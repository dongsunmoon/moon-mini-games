 srcs[srcs.length-1].onended=()=>{try{g.disconnect();if(dst!==out)dst.disconnect()}catch(e){}if(HELD[key]&&HELD[key].g===g)delete HELD[key]};
 // off(): the key came up early (free play), so end the note like a real instrument would
 return {off(){if(S.ring)return;const r=S.rel||.12,n=Math.max(AC.currentTime,t+(S.hold?.15:.3));if(n>=end)return;try{g.gain.cancelScheduledValues(n);g.gain.setValueAtTime(gv,n);g.gain.setTargetAtTime(0,n,r);srcs.forEach(s=>{try{s.stop(n+r*7)}catch(e){}})}catch(e){}}}}
// drum and percussion recordings: kind -> [file, gain, reverb]
const DRUM_KIT={kick:['kick',1.4],snare:['snare',.8,.12],hat:['hihat',.6],ohat:['hihat-open',.5],tom:['tom',1.3,.1],crash:['cymbal',.6,.2],clap:['clap',.9,.1],
 wood:['woodblock',.6],shaker:['shaker',.65],tamb:['tambourine',.6,.1],triangle:['triangle',.6,.25],timpani:['timpani',1,.2],
 jangguL:['darbuka-low',.95,.12],jangguH:['darbuka-high',.8,.1],buk:['framedrum',1.2,.15],kkwaeng:['brakedrum',.7,.12],jing:['gong',.5,.25]};
let OPEN_HAT=null;
function drumSample(k,t,vol,out){const P=SETS.perc,e=DRUM_KIT[k];if(!e||!P.buf)return false;const B=P.buf[e[0]];if(!B)return false;
 const g=AC.createGain();g.gain.value=vol*e[1];g.connect(out);if(e[2])send(g,e[2]);
 // a closed hi-hat cuts off the open one
 if(k==='hat'&&OPEN_HAT&&OPEN_HAT.t<t){try{OPEN_HAT.g.gain.setTargetAtTime(0,t,.02)}catch(x){}}if(k==='ohat')OPEN_HAT={g,t};
 const s=AC.createBufferSource();s.buffer=B.b;s.connect(g);s.start(t,B.o);s.onended=()=>{try{g.disconnect()}catch(x){}};return true}

// ---------------------------------------------------------------- instrument voices (synthesized; used until the recordings load, or if they cannot)
// play(voice, midi, when, dur, vol, dest) — every pitched sound in the game goes through here
function play(v,m,when,dur=.5,vol=.8,dest){const a=audioCtx();if(!a||!SND.on)return;m=midiOf(m);const t=at(when),out=dest||MASTER;
 const id=VOICE_SET[v];if(id){if(SETS[id].buf){try{const h=playSample(SETS[id],v,m,t,dur,vol,out);if(h)return h}catch(e){}}else loadSet(id)}
 synth(SYNTH_OF[v]||v,m,t,dur,vol,out)}
function synth(v,m,t,dur,vol,out){const f=hz(m),end=t+Math.max(.08,dur);
 try{switch(v){
 case 'piano':{const g2=gate(t,end,.15,out);send(g2,.25);const e=env(t,vol*.3,.004,vol*.06,.55,g2),lp=filt('lowpass',Math.min(9000,f*8),.5,e),low=f<200;
  lp.frequency.setTargetAtTime(Math.max(low?900:500,f*2.6),t+.02,.35);
  osc('triangle',f,t,end+.9,lp);osc('sine',f*2,t,end+.9,lp,low?.5:.32);osc('sine',f*3,t,end+.9,lp,low?.25:.1);if(low)osc('sine',f*4,t,end+.9,lp,.14);
  const h=env(t,vol*.05,.001,0,.012,out);noiseSrc(t,.04,filt('bandpass',2600,1.2,h));break}
 case 'ep':{const g2=gate(t,end,.25,out);send(g2,.2);const e=env(t,vol*.22,.01,vol*.05,.6,g2);osc('sine',f,t,end+1,e);osc('sine',f*2,t,end+1,e,.18);break}
 case 'bass':{const g2=gate(t,end,.08,out);const e=env(t,vol*.42,.008,vol*.18,.25,g2),lp=filt('lowpass',700,.7,e);osc('triangle',f,t,end+.4,lp);osc('sine',f,t,end+.4,lp,.6);break}
 case 'pluck':{const s=AC.createBufferSource();s.buffer=ksBuf(m);const g=AC.createGain();g.gain.value=vol*(m>70?.85:.7);s.connect(g);const g2=gate(t,end+.6,.3,out);g.connect(g2);send(g2,.35);s.start(t);s.stop(t+1.8);break}
 case 'bow':{const g2=gate(t,end,.18,out);send(g2,.45);const e=env(t,vol*.2,.09,vol*.17,.3,g2),lp=filt('lowpass',Math.min(5200,f*7),.8,e),pk=filt('peaking',f*2.5,1.2,lp);pk.gain.value=5;
  const o=osc('sawtooth',f,t,end+.8,pk),lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=5.6;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(f*.007,t+.35);lfo.connect(lg);lg.connect(o.frequency);lfo.start(t);lfo.stop(end+.8);break}
 case 'flute':{const g2=gate(t,end,.12,out);send(g2,.4);const e=env(t,vol*.26,.07,vol*.22,.3,g2);const o=osc('sine',f,t,end+.6,e);osc('triangle',f,t,end+.6,e,.18);osc('sine',f*2,t,end+.6,e,f<300?.45:.15);osc('sine',f*3,t,end+.6,e,f<300?.22:.05);
  const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=5;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(f*.004,t+.4);lfo.connect(lg);lg.connect(o.frequency);lfo.start(t);lfo.stop(end+.6);
  const b=env(t,vol*.05,.03,vol*.015,.1,g2);noiseSrc(t,Math.max(.1,dur)+.3,filt('bandpass',f*2,1.5,b));break}
 case 'reed':{const g2=gate(t,end,.1,out);send(g2,.35);const e=env(t,vol*.2,.05,vol*.17,.3,g2),lp=filt('lowpass',f*3.2,1,e);osc('square',f,t,end+.5,lp);break}
 case 'brass':{const g2=gate(t,end,.12,out);send(g2,.35);const e=env(t,vol*.24,.04,vol*.2,.3,g2),lp=filt('lowpass',f*1.2,1.4,e);
  lp.frequency.setValueAtTime(f*1.2,t);lp.frequency.linearRampToValueAtTime(f*6,t+.07);lp.frequency.setTargetAtTime(f*3.6,t+.08,.2);
  const o=osc('sawtooth',f*.985,t,end+.6,lp);o.frequency.setTargetAtTime(f,t,.03);break}
 case 'mallet':{const e=env(t,vol*.42,.002,0,.16,out);send(e,.35);osc('sine',f,t,t+1,e);osc('sine',f*2,t,t+1,e,f<250?.4:.12);osc('sine',f*3.93,t,t+1,e,.22);osc('sine',f*9.2,t,t+.3,e,.05);break}
 case 'bell':{const e=env(t,vol*.3,.002,0,.7,out);send(e,.5);[1,2.76,5.4,8.9].forEach((k,i)=>osc('sine',f*k,t,t+3,e,[1,.5,.25,.12][i]));break}
 case 'organ':{const g2=gate(t,end,.06,out);send(g2,.35);const e=env(t,vol*.16,.02,vol*.16,.3,g2);[1,2,3,4].forEach((k,i)=>osc('sine',f*k,t,end+.4,e,[1,.6,.3,.15][i]));break}
 }}catch(e){}}
const playChord=(v,ms,when,dur,vol,dest)=>ms.forEach(m=>play(v,m,when,dur,vol,dest));

// ---------------------------------------------------------------- drums
const DRUM_SYN={tamb:'shaker',timpani:'tom',jangguL:'tom',buk:'kick',jangguH:'wood'};
function drum(k,when,vol=.9,dest){const a=audioCtx();if(!a||!SND.on)return;const t=at(when),out=dest||MASTER;
 if(DRUM_KIT[k]){try{if(drumSample(k,t,vol,out))return}catch(e){}if(!SETS.perc.buf)loadSet('perc')}
 if(k==='triangle'||k==='kkwaeng'||k==='jing'){synth('bell',k==='triangle'?100:k==='kkwaeng'?86:50,t,.1,vol*.6,out);return}
 try{switch(DRUM_SYN[k]||k){
 case 'kick':{const e=env(t,vol*.95,.002,0,.12,out);const o=osc('sine',150,t,t+.6,e);o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(46,t+.12);
  const c=env(t,vol*.38,.001,0,.008,out);osc('square',1100,t,t+.03,c);const b2=env(t,vol*.35,.002,0,.05,out);osc('sine',180,t,t+.2,b2);break}
 case 'snare':{const e=env(t,vol*.75,.001,0,.06,out);send(e,.25);noiseSrc(t,.35,filt('bandpass',1900,.7,filt('highpass',800,null,e)));const b=env(t,vol*.4,.001,0,.035,out);osc('triangle',190,t,t+.2,b);break}
 case 'hat':{const e=env(t,vol*.55,.001,0,.02,out);noiseSrc(t,.12,filt('highpass',7200,null,e));break}
 case 'ohat':{const e=env(t,vol*.45,.002,0,.09,out);noiseSrc(t,.6,filt('highpass',6500,null,e));break}
 case 'tom':{const e=env(t,vol*.75,.002,0,.12,out);const o=osc('sine',150,t,t+.6,e);o.frequency.exponentialRampToValueAtTime(88,t+.25);osc('triangle',300,t,t+.25,e,.35);break}
 case 'crash':{const e=env(t,vol*.34,.002,0,.45,out);send(e,.6);noiseSrc(t,2,filt('highpass',4200,null,e));break}
 case 'clap':{for(let i=0;i<3;i++){const e=env(t+i*.011,vol*.7,.001,0,i===2?.06:.008,out);noiseSrc(t+i*.011,.3,filt('bandpass',1400,.9,e))}break}
 case 'click':case 'accent':{const e=env(t,vol*(k==='accent'?.42:.3),.001,0,.012,out);osc('sine',k==='accent'?2200:1500,t,t+.08,e);break}
 case 'wood':{const e=env(t,vol*.4,.001,0,.02,out);osc('sine',920,t,t+.1,e);osc('sine',1380,t,t+.1,e,.4);break}
 case 'shaker':{const e=env(t,vol*.4,.02,0,.035,out);noiseSrc(t,.12,filt('highpass',5000,null,e));break}
 }}catch(e){}}

// ---------------------------------------------------------------- sound effects
const sfxAt=(d=0)=>audioCtx()?AC.currentTime+d:0;
const SFX={
 tap(){play('mallet',84,sfxAt(),.1,.35)},
 good(){[72,76,79].forEach((m,i)=>play('mallet',m,sfxAt(i*.06),.1,.4))},
 bad(){play('reed',50,sfxAt(),.18,.35);play('reed',47,sfxAt(.12),.24,.3)},
 coin(){play('bell',96,sfxAt(),.1,.3);play('bell',100,sfxAt(.07),.1,.3)},
 star(i=0){play('mallet',79+i*4,sfxAt(),.2,.55);play('bell',91+i*4,sfxAt(.02),.2,.18)},
 open(){[67,72,76,79,84].forEach((m,i)=>play('mallet',m,sfxAt(i*.05),.1,.35))},
 level(){[60,64,67,72,76,79,84].forEach((m,i)=>play('piano',m,sfxAt(i*.07),.3,.55))},
 win(){const t=sfxAt();[[60,64,67],[65,69,72],[67,71,74],[72,76,79]].forEach((c,i)=>playChord('brass',c,t+i*.16,i===3?.9:.14,.42));drum('crash',t+.48,.6)},
 fanfare(){const t=sfxAt();[67,67,67,72].forEach((m,i)=>play('brass',m,t+i*.13,i===3?.8:.1,.55));playChord('brass',[60,64,67],t+.39,.8,.3);drum('crash',t+.39,.5)},
 cheer(){const t=sfxAt();for(let i=0;i<14;i++)drum('clap',t+i*.05+Math.random()*.03,.5);},
 roll(dur=1.6){const t=sfxAt();const n=Math.floor(dur/.045);for(let i=0;i<n;i++)drum('snare',t+i*.045,.18+.5*i/n)},
 whoosh(){if(!audioCtx()||!SND.on)return;const t=sfxAt(),e=env(t,.18,.08,0,.12,MASTER),b=filt('bandpass',600,1,e);b.frequency.exponentialRampToValueAtTime(2400,t+.3);noiseSrc(t,.5,b)},
 pop(){play('mallet',88,sfxAt(),.06,.35)},
 click(){drum('wood',sfxAt(),.5)},
 sad(){[64,62,60].forEach((m,i)=>play('ep',m,sfxAt(i*.16),.25,.5))},
};
</script>
<script>
// ================================================================ notation: staff, notes, rests, rhythms and keyboards drawn as SVG
const LETTER={C:0,D:1,E:2,F:3,G:4,A:5,B:6};
// diatonic step from middle C (C4 = 0, E4 = 2 = bottom line of the treble staff); sharps sit on the letter below
function stepOf(m){m=midiOf(m);const pc=((m%12)+12)%12,oct=Math.floor(m/12)-1,n=PC[pc];return LETTER[n[0]]+7*(oct-4)}
const sharpOf=m=>isBlack(midiOf(m));
// note names: 도레미 (solfège), C D E (letters) or both
const SOLF=['도','도♯','레','레♯','미','파','파♯','솔','솔♯','라','라♯','시'],SOLF_EN=['Do','Do♯','Re','Re♯','Mi','Fa','Fa♯','Sol','Sol♯','La','La♯','Ti'];
function noteName(m,style){m=midiOf(m);const pc=((m%12)+12)%12,L1=PC[pc].replace('#','♯'),S=LANG==='en'?SOLF_EN[pc]:SOLF[pc];
 style=style||OPT_NAMES();return style==='letter'?L1:style==='both'?`${S} ${L1}`:S}
let OPT_NAMES=()=>LANG==='en'?'letter':'solfege';
const NOTE_COLORS=['#ff5a5f','#ff5a5f','#ff9f1c','#ff9f1c','#ffd23f','#3ec46d','#3ec46d','#1fb5c9','#1fb5c9','#4b7bff','#4b7bff','#a25cff'];
const colorOf=m=>NOTE_COLORS[((midiOf(m)%12)+12)%12];

// ---------------------------------------------------------------- glyphs
// treble clef drawn as one stroke around the G line (y=30 when the top line is y=0)
const CLEF_D='M13.5 31C10 31 9.5 26.5 13 25.5C18 24 22 28 21.5 32.5C21 38 14 40.5 9 38.5C3.5 36 3 28 8 22C12 17 18.5 12 19 3C19.4-6 16.5-14 14.8-14C12-14 10-7 10.5 0L14 50C14.6 56 10.5 58.5 7.5 56.5';
const clefSVG=(x,y,s=1,col='#1d2a4a')=>`<g transform="translate(${x},${y}) scale(${s})"><path d="${CLEF_D}" fill="none" stroke="${col}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8.6" cy="53.6" r="3.2" fill="${col}"/></g>`;
function headSVG(x,y,{hollow=false,whole=false,col='#1d2a4a'}={}){
 if(whole)return `<ellipse cx="${x}" cy="${y}" rx="7.4" ry="4.9" fill="none" stroke="${col}" stroke-width="2.4" transform="rotate(-18 ${x} ${y})"/><ellipse cx="${x}" cy="${y}" rx="7.4" ry="4.9" fill="none" stroke="${col}" stroke-width="1.2"/>`;
 return hollow?`<ellipse cx="${x}" cy="${y}" rx="6.3" ry="4.5" fill="#fff" stroke="${col}" stroke-width="2.2" transform="rotate(-22 ${x} ${y})"/>`:`<ellipse cx="${x}" cy="${y}" rx="6.3" ry="4.5" fill="${col}" transform="rotate(-22 ${x} ${y})"/>`}
const flagSVG=(x,y,col,dbl)=>`<path d="M${x} ${y}c1 7 9 9 8 18c4-9-5-12-8-18z" fill="${col}"/>`+(dbl?`<path d="M${x} ${y+7}c1 7 9 9 8 18c4-9-5-12-8-18z" fill="${col}"/>`:'');
function restSVG(k,x,y,col='#1d2a4a'){
 // y is the middle of the staff
 switch(k){
  case 'q':return `<path d="M${x-3} ${y-14}l6 7-4 5 5 6c-5-2-8 1-4 6c-7-3-6-8-1-8l-5-6 4-5z" fill="${col}" stroke="${col}" stroke-width="1.4" stroke-linejoin="round"/>`;
  case 'h':return `<rect x="${x-7}" y="${y-5}" width="14" height="5" fill="${col}"/>`;
  case 'w':return `<rect x="${x-7}" y="${y-10}" width="14" height="5" fill="${col}"/>`;
  case 'e':return `<circle cx="${x-2}" cy="${y-6}" r="2.8" fill="${col}"/><path d="M${x-2} ${y-4}q4 1 6-3l-5 14" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round"/>`;
  case 's':return `<circle cx="${x-2}" cy="${y-8}" r="2.4" fill="${col}"/><circle cx="${x-4}" cy="${y-1}" r="2.4" fill="${col}"/><path d="M${x-2} ${y-6}q4 1 6-3l-6 18M${x-4} ${y+1}q4 1 6-3" fill="none" stroke="${col}" stroke-width="1.8" stroke-linecap="round"/>`;
 }return ''}
const sharpSVG=(x,y,col)=>`<text x="${x}" y="${y+6}" font-size="17" font-weight="700" text-anchor="middle" fill="${col}">♯</text>`;

// ---------------------------------------------------------------- staff with pitched notes
// notes: [{m, d (beats, optional), col, label}] spread evenly; returns an SVG string
function staffSVG(notes=[],{w=320,pad=0,clef=true,sig=null,labels=false,col='#1d2a4a',bars=[],x0=null,hideNames=false,focus=-1}={}){
 const top=34,bot=top+40,h=130,start=x0!=null?x0:(clef?46:18)+(sig?22:0),span=w-start-16,n=Math.max(1,notes.length),dx=span/n;
 let s=`<svg class="staff" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">`;
 for(let i=0;i<5;i++)s+=`<line x1="${pad+6}" y1="${top+i*10}" x2="${w-6}" y2="${top+i*10}" stroke="#7d88a6" stroke-width="1.3"/>`;
 if(clef)s+=clefSVG(pad+12,top,1,col);
 if(sig)s+=`<text x="${pad+(clef?50:20)}" y="${top+18}" font-size="21" font-weight="900" text-anchor="middle" fill="${col}" font-family="Georgia,serif">${sig[0]}</text><text x="${pad+(clef?50:20)}" y="${top+38}" font-size="21" font-weight="900" text-anchor="middle" fill="${col}" font-family="Georgia,serif">${sig[1]}</text>`;
 bars.forEach(i=>{const x=start+dx*i-dx*.15;s+=`<line x1="${x}" y1="${top}" x2="${x}" y2="${bot}" stroke="#7d88a6" stroke-width="1.6"/>`});
 notes.forEach((nt,i)=>{const x=start+dx*(i+.5),c=nt.col||col;
  if(nt.rest){s+=restSVG(nt.rest,x,top+20,c);return}
  s+=`<g class="sn" data-i="${i}">`;
  const st=stepOf(nt.m),y=bot-(st-2)*5,d=nt.d||1;
  // ledger lines below (C4 and lower) and above (A5 and higher)
  for(let k=0;k>=st;k-=2)s+=`<line x1="${x-11}" y1="${bot-(k-2)*5}" x2="${x+11}" y2="${bot-(k-2)*5}" stroke="#7d88a6" stroke-width="1.4"/>`;
  for(let k=12;k<=st;k+=2)s+=`<line x1="${x-11}" y1="${bot-(k-2)*5}" x2="${x+11}" y2="${bot-(k-2)*5}" stroke="#7d88a6" stroke-width="1.4"/>`;
  if(i===focus)s+=`<circle cx="${x}" cy="${y}" r="14" fill="#ffe680" opacity=".75"/>`;
  if(sharpOf(nt.m))s+=sharpSVG(x-15,y,c);
  s+=headSVG(x,y,{hollow:d>=2,whole:d>=4,col:c});
  if(d<4){const up=st<6,sx=up?x+5.6:x-5.6,sy2=up?y-34:y+34;s+=`<line x1="${sx}" y1="${y+(up?-1:1)}" x2="${sx}" y2="${sy2}" stroke="${c}" stroke-width="1.8"/>`;if(d<1&&up)s+=flagSVG(sx,sy2,c,d<.5)}
  if(d===1.5||d===3)s+=`<circle cx="${x+11}" cy="${y-(st%2===0?3:0)}" r="2.2" fill="${c}"/>`;
  if(labels&&!hideNames)s+=`<text x="${x}" y="${h-6}" font-size="13" font-weight="900" text-anchor="middle" fill="${c}">${esc(nt.label||noteName(nt.m))}</text>`;
  s+='</g>';
 });
 return s+'</svg>'}

// ---------------------------------------------------------------- rhythms (one-line percussion staff)
const RTOK={w:[4,0],h:[2,0],q:[1,0],e:[.5,0],s:[.25,0],dq:[1.5,0],dh:[3,0],de:[.75,0],wr:[4,1],hr:[2,1],qr:[1,1],er:[.5,1],sr:[.25,1]};
function parseRhythm(str){let t=0;return str.trim().split(/\s+/).filter(x=>x!=='|').map(k=>{const [d,r]=RTOK[k]||[1,0],o={k,d,rest:!!r,t};t+=d;return o})}
const rhythmBeats=str=>parseRhythm(str).reduce((a,b)=>a+b.d,0);
// draws the rhythm; cols[i] colours token i; returns {svg, xs}
// ball: room above the notes for the bouncing ball (see ballAt)
const BALL_Y=3;
function rhythmSVG(str,{w=320,sig=4,cols=[],showSig=false,count=false,cursor=null,ball=false}={}){
 const toks=parseRhythm(str),total=toks.reduce((a,b)=>a+b.d,0),bars=Math.max(1,Math.ceil(total/sig-1e-9)),h=count?92:78,line=46,top=ball?-26:0;
 const x0=showSig?40:16,span=w-x0-14;
 // spacing grows with duration but never too tight
 const unit=span/(total+bars*.15),xs=[];let s=`<svg class="rhy" viewBox="0 ${top} ${w} ${h-top}" xmlns="http://www.w3.org/2000/svg"><line x1="8" y1="${line}" x2="${w-8}" y2="${line}" stroke="#9aa5c2" stroke-width="2"/>`;
 if(showSig)s+=`<text x="22" y="${line-4}" font-size="19" font-weight="900" text-anchor="middle" fill="#1d2a4a" font-family="Georgia,serif">${sig}</text><text x="22" y="${line+16}" font-size="19" font-weight="900" text-anchor="middle" fill="#1d2a4a" font-family="Georgia,serif">4</text>`;
 let x=x0+unit*.4,barAt=sig;
 toks.forEach((tk,i)=>{xs.push(x);x+=tk.d*unit;if(Math.abs(tk.t+tk.d-barAt)<1e-6&&i<toks.length-1){s+=`<line x1="${x-unit*.3}" y1="${line-16}" x2="${x-unit*.3}" y2="${line+16}" stroke="#9aa5c2" stroke-width="2"/>`;x+=unit*.15;barAt+=sig}});
 s+=`<line x1="${w-12}" y1="${line-16}" x2="${w-12}" y2="${line+16}" stroke="#9aa5c2" stroke-width="2"/><line x1="${w-8}" y1="${line-16}" x2="${w-8}" y2="${line+16}" stroke="#9aa5c2" stroke-width="3.5"/>`;
 // beam groups: eighths/sixteenths inside one beat
 const groups=[];let cur=null;
 toks.forEach((tk,i)=>{const short=!tk.rest&&tk.d<1&&tk.k!=='de';const beat=Math.floor(tk.t+1e-6);if(short&&cur&&cur.beat===beat){cur.idx.push(i)}else{if(cur&&cur.idx.length>1)groups.push(cur);cur=short?{beat,idx:[i]}:null}});
 if(cur&&cur.idx.length>1)groups.push(cur);
 const inGroup=new Set(groups.flatMap(g=>g.idx));
 toks.forEach((tk,i)=>{const c=cols[i]||'#1d2a4a',xx=xs[i];
  if(tk.rest){s+=restSVG(tk.k[0],xx,line+(tk.k==='wr'?4:tk.k==='hr'?0:0),c);return}
  s+=headSVG(xx,line,{hollow:tk.d>=2,whole:tk.d>=4,col:c});
  if(tk.d<4)s+=`<line x1="${xx+5.6}" y1="${line-1}" x2="${xx+5.6}" y2="${line-32}" stroke="${c}" stroke-width="1.8"/>`;
  if(tk.d<1&&!inGroup.has(i))s+=flagSVG(xx+5.6,line-32,c,tk.d<.5);
  if(tk.k==='dq'||tk.k==='dh'||tk.k==='de')s+=`<circle cx="${xx+11}" cy="${line-3}" r="2.3" fill="${c}"/>`});
 groups.forEach(g=>{const a=xs[g.idx[0]]+5.6,b=xs[g.idx[g.idx.length-1]]+5.6;s+=`<rect x="${a-.9}" y="${line-34}" width="${b-a+1.8}" height="4.6" fill="#1d2a4a"/>`;
  // second beam for sixteenths
  g.idx.forEach((i,j)=>{if(toks[i].d<=.25){const nx=g.idx[j+1]!=null&&toks[g.idx[j+1]].d<=.25?xs[g.idx[j+1]]+5.6:null,pv=g.idx[j-1]!=null&&toks[g.idx[j-1]].d<=.25;
   if(nx!=null)s+=`<rect x="${xs[i]+4.7}" y="${line-27}" width="${nx-xs[i]-5.6+1.8}" height="4.6" fill="#1d2a4a"/>`;else if(!pv)s+=`<rect x="${xs[i]+4.7}" y="${line-27}" width="8" height="4.6" fill="#1d2a4a"/>`}})});
 if(count){toks.forEach((tk,i)=>{if(Math.abs(tk.t-Math.round(tk.t))<1e-6)s+=`<text x="${xs[i]}" y="${h-4}" font-size="13" font-weight="900" text-anchor="middle" fill="#7d88a6">${(Math.round(tk.t)%sig)+1}</text>`;else if(Math.abs(tk.t%1-.5)<1e-6)s+=`<text x="${xs[i]}" y="${h-4}" font-size="13" font-weight="900" text-anchor="middle" fill="#b0b8cf">&amp;</text>`})}
 if(cursor!=null)s+=`<line class="rcur" x1="${cursor}" y1="8" x2="${cursor}" y2="${line+22}" stroke="#ff5fa2" stroke-width="3" stroke-linecap="round"/>`;
 if(ball)s+=`<circle class="rball" cx="-30" cy="${BALL_Y}" r="7.5" fill="#ff5fa2" stroke="#fff" stroke-width="1.5"/>`;
 return {svg:s+'</svg>',xs,unit,x0}}
// The bouncing ball over a rhythm: it lands on every note (and on each count-in beat), so the child sees each tap coming.
// lands: beat times, in order. A long hop (a long note or a rest) goes higher; big:true makes one hop a big jump (into the first note).
// Returns the height y, the last landing k, and t: the beat to take x from (the ball stays on the last note once it has landed there).
function ballAt(lands,b){let k=-1;while(k+1<lands.length&&lands[k+1].t<=b)k++;const t=lands.length?Math.min(b,lands[lands.length-1].t):b;
 if(k<0||k>=lands.length-1)return {y:BALL_Y,k,t};const a=lands[k],len=lands[k+1].t-a.t,f=(b-a.t)/len,h=lands[k+1].big?24:clamp(5+len*9,6,22);
 return {y:BALL_Y-h*4*f*(1-f),k,t}}

// ---------------------------------------------------------------- single symbols for quizzes and lesson cards
function symbolSVG(k,{size=90,col='#1d2a4a'}={}){
 const box=(inner,w=60,h=80)=>`<svg class="sym" viewBox="0 0 ${w} ${h}" width="${size*w/80}" height="${size*h/80}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
 const note=(d,dot,beam)=>{let s=headSVG(24,58,{hollow:d>=2,whole:d>=4,col});if(d<4)s+=`<line x1="29.6" y1="57" x2="29.6" y2="20" stroke="${col}" stroke-width="2"/>`;if(d<1)s+=flagSVG(29.6,20,col,d<.5);if(dot)s+=`<circle cx="38" cy="55" r="2.6" fill="${col}"/>`;return box(s)};
 switch(k){
  case 'w':return note(4);case 'h':return note(2);case 'q':return note(1);case 'e':return note(.5);case 's':return note(.25);case 'dh':return note(2,1);case 'dq':return note(1,1);
  case 'ee':return box(headSVG(14,58,{col})+headSVG(44,58,{col})+`<line x1="19.6" y1="57" x2="19.6" y2="22" stroke="${col}" stroke-width="2"/><line x1="49.6" y1="57" x2="49.6" y2="22" stroke="${col}" stroke-width="2"/><rect x="18.7" y="20" width="31.8" height="5" fill="${col}"/>`);
  case 'wr':case 'hr':case 'qr':case 'er':case 'sr':return box(`<line x1="6" y1="${k==='wr'?34:k==='hr'?44:40}" x2="54" y2="${k==='wr'?34:k==='hr'?44:40}" stroke="#c3cbe0" stroke-width="1.5"/>`+restSVG(k[0],30,44,col));
  case 'clef':return box(clefSVG(18,18,1,col)+[0,1,2,3,4].map(i=>`<line x1="4" y1="${18+i*10}" x2="56" y2="${18+i*10}" stroke="#c3cbe0" stroke-width="1.2"/>`).join(''),60,90);
  case 'sharp':case 'flat':case 'natural':return box(`<text x="30" y="58" font-size="54" text-anchor="middle" fill="${col}">${{sharp:'♯',flat:'♭',natural:'♮'}[k]}</text>`);
  case 'repeat':return box(`${[0,1,2,3,4].map(i=>`<line x1="4" y1="${20+i*10}" x2="56" y2="${20+i*10}" stroke="#c3cbe0" stroke-width="1.2"/>`).join('')}<circle cx="30" cy="35" r="3" fill="${col}"/><circle cx="30" cy="45" r="3" fill="${col}"/><rect x="37" y="20" width="3" height="40" fill="${col}"/><rect x="44" y="20" width="7" height="40" fill="${col}"/>`);
  case 'final':return box(`${[0,1,2,3,4].map(i=>`<line x1="4" y1="${20+i*10}" x2="50" y2="${20+i*10}" stroke="#c3cbe0" stroke-width="1.2"/>`).join('')}<rect x="38" y="20" width="3" height="40" fill="${col}"/><rect x="45" y="20" width="7" height="40" fill="${col}"/>`);
  case 'bar':return box(`${[0,1,2,3,4].map(i=>`<line x1="4" y1="${20+i*10}" x2="56" y2="${20+i*10}" stroke="#c3cbe0" stroke-width="1.2"/>`).join('')}<rect x="29" y="20" width="2.5" height="40" fill="${col}"/>`);
  case 'cresc':return box(`<path d="M6 40L54 26M6 40L54 54" stroke="${col}" stroke-width="3" fill="none" stroke-linecap="round"/>`);
  case 'decresc':return box(`<path d="M6 26L54 40M6 54L54 40" stroke="${col}" stroke-width="3" fill="none" stroke-linecap="round"/>`);
  case 'fermata':return box(`<path d="M8 50a22 22 0 0 1 44 0" fill="none" stroke="${col}" stroke-width="4"/><circle cx="30" cy="44" r="4" fill="${col}"/>`);
  default:{// dynamics: p, pp, mp, mf, f, ff
   return box(`<text x="30" y="56" font-size="${k.length>1?34:44}" font-style="italic" font-weight="900" text-anchor="middle" fill="${col}" font-family="Georgia,'Times New Roman',serif">${esc(k)}</text>`)}
 }}

// ---------------------------------------------------------------- a picture of a keyboard (not playable)
function keyboardSVG({from=60,to=72,hi={},labels=true,w=320,dots={},showBlackNames=false,showBlack=false,names=null}={}){showBlackNames=showBlackNames||showBlack;
 const whites=[];for(let m=from;m<=to;m++)if(!isBlack(m))whites.push(m);
 const kw=w/whites.length,h=kw*3.6>130?130:kw*3.6;let s=`<svg class="kbd" viewBox="0 0 ${w} ${h+4}" xmlns="http://www.w3.org/2000/svg">`;
 whites.forEach((m,i)=>{const c=hi[m]||'#fff';s+=`<rect data-m="${m}" data-c="${c}" x="${i*kw+1}" y="1" width="${kw-2}" height="${h}" rx="5" fill="${c}" stroke="#9aa5c2" stroke-width="1.5"/>`;
  if(dots[m])s+=`<circle cx="${i*kw+kw/2}" cy="${h-34}" r="7" fill="${dots[m]}"/>`;
  if(labels)s+=`<text x="${i*kw+kw/2}" y="${h-10}" font-size="${clamp(kw*.42,12,14)}" font-weight="900" text-anchor="middle" fill="${hi[m]&&hi[m]!=='#fff'?'#fff':'#5f6b8f'}">${esc(noteName(m,names).split(' ')[0])}</text>`});
 for(let m=from;m<=to;m++){if(!isBlack(m))continue;const i=whites.indexOf(m-1);if(i<0)continue;const x=(i+1)*kw-kw*.31,c=hi[m]||'#26304d';
  s+=`<rect data-m="${m}" data-c="${c}" x="${x}" y="1" width="${kw*.62}" height="${h*.6}" rx="3" fill="${c}"/>`;if(dots[m])s+=`<circle cx="${x+kw*.31}" cy="${h*.6-12}" r="5.5" fill="${dots[m]}"/>`;
  if(showBlackNames){const nm=noteName(m,names).split(' ')[0],fs=Math.min(12,kw*.32),fit=kw*.56;s+=`<text x="${x+kw*.31}" y="${h*.6-6}" font-size="${fs}" font-weight="900" text-anchor="middle" fill="#fff"${fs*.62*nm.length>fit?` textLength="${fit}" lengthAdjust="spacingAndGlyphs"`:''}>${esc(nm)}</text>`}}
 return s+'</svg>'}
</script>
<script>
// ================================================================ activities: beat tapping, rhythm copy/reading, falling-note piano/drums/chords, quizzes and keyboard tasks

const COMBO_TXT={10:'10콤보! 박자를 탔어요!|10 combo! You’ve got the beat!',20:'20콤보! 손가락이 춤춰요!|20 combo! Fingers dancing!',30:'30콤보! 진짜 음악가 같아요!|30 combo! A real musician!',50:'50콤보! 믿을 수 없어요!|50 combo! Unbelievable!',80:'80콤보!! 전설이에요!|80 combo!! Legendary!'};
const judgeOf=(dt,w)=>{const a=Math.abs(dt);return a<=w.p?'p':a<=w.g?'g':a<=w.o?'o':null};
const starsOf=acc=>acc>=.88?3:acc>=.7?2:acc>=.45?1:0;
let ACT=null;
function stopActivity(){const a=ACT;ACT=null;if(a){try{a.stop()}catch(e){console.error(e)}}}
function tally(){return {p:0,g:0,o:0,m:0,extra:0,combo:0,maxCombo:0,n:0,offs:[],
 add(j,dt){this[j]++;this.n++;if(j==='m')this.combo=0;else{this.combo++;if(this.combo>this.maxCombo)this.maxCombo=this.combo;if(dt!=null)this.offs.push(dt)}},
 acc(){const tot=this.n+this.extra*.5;return tot?(this.p*JW.p+this.g*JW.g+this.o*JW.o)/tot:0},
 result(extra={}){const acc=this.acc(),avg=this.offs.length?this.offs.reduce((a,b)=>a+b,0)/this.offs.length:0;
  return {acc,stars:starsOf(acc),p:this.p,g:this.g,o:this.o,m:this.m,n:this.n,extra:this.extra,maxCombo:this.maxCombo,avgOff:avg,timed:true,...extra}}}}
async function ensureAudio(){const a=audioCtx();if(a&&a.state!=='running'){try{await Promise.race([a.resume(),new Promise(r=>setTimeout(r,450))])}catch(e){}}
 if(a&&!(SETS.piano.buf&&SETS.perc.buf))await want(['piano','perc'],1500);return audioReady()}
const makeClock=useAC=>useAC?(perf=performance.now())=>heardTime(perf):(perf=performance.now())=>perf/1000;
// when the first sound of a game plays: a moment from now, but never already past on the audio clock (slow wireless speakers)
const startAt=(clk,ok,lead)=>ok&&AC?Math.max(clk()+lead,AC.currentTime+.1):clk()+lead;
// keys that count as a tap in the beat and rhythm games
const isTapKey=e=>!e.repeat&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&e.key!=='Escape'&&e.key!=='Tab'&&(e.key.length===1||e.key==='Enter');
function bubble(host,txt,cls=''){const b=host.querySelector('.tbub');if(!b)return;b.textContent=T(txt);b.className='tbub show '+cls;clearTimeout(b._t);b._t=setTimeout(()=>b.classList.remove('show'),1600)}
const tface=t=>`<span class="tface" style="background:${TEACHERS[t].bg}">${pic(TEACHERS[t].img,TEACHERS[t].icon)}</span>`;
function countdownHTML(){return `<div class="cdown hidden"></div>`}
function showCount(host,txt){const c=host.querySelector('.cdown');if(!c||c.textContent===txt&&!c.classList.contains('hidden'))return;c.textContent=txt;c.classList.remove('hidden','pop');void c.offsetWidth;c.classList.add('pop')}
const hideCount=host=>{const c=host.querySelector('.cdown');if(c)c.classList.add('hidden')};
function simJ(acc){const r=Math.random();return r<acc*.8?'p':r<acc*.95?'g':r<acc*1.05?'o':'m'}

// ================================================================ the beat bar: where am I in the bar, and whose turn is it?
// One bubble per beat (beat 1, the strong beat, is the big one) lights in time with the clicks, and a ball hops between them,
// landing on each bubble on its beat: the child sees the next beat coming. The hop back to beat 1 is higher, so a new bar shows too.
// Phases colour it: ready = count-in, listen = the teacher plays, go = the child's turn, quiet = keep the beat inside.
const CNT=[['하나','one'],['둘','two'],['셋','three'],['넷','four'],['다섯','five'],['여섯','six']];
const cntWord=i=>L(...CNT[((i%CNT.length)+CNT.length)%CNT.length]);
const barHTML=sig=>`<div class="bbar" data-ph="ready"><span class="bb-tag"></span><div class="bb-row">${Array.from({length:sig},(_,i)=>`<i class="${i?'':'one'}"><b>${i+1}</b></i>`).join('')}<u class="bb-head"></u></div><div class="bb-say"></div></div>`;
function beatBar(el,sig){const row=el.querySelector('.bb-row'),bs=[...row.querySelectorAll('i')],head=row.querySelector('.bb-head'),tag=el.querySelector('.bb-tag'),sayEl=el.querySelector('.bb-say');
 let ph='',lit=-1,cs=null,said=null,gs=null;
 const centers=()=>cs||(cs=bs.map(b=>b.offsetLeft+b.offsetWidth/2));
 // where the ball lands: in the top of each bubble, above its number
 const lands=()=>gs||(gs=bs.map(b=>({x:b.offsetLeft+b.offsetWidth/2,y:b.offsetTop+4})));
 const xOf=beat=>{const c=centers(),i=((Math.floor(beat)%sig)+sig)%sig,step=c.length>1?c[1]-c[0]:60;return c[i]+(beat-Math.floor(beat))*step};
 return {
  phase(p,t){if(p!==ph){ph=p;el.dataset.ph=p;cs=gs=null}if(t!=null&&tag.textContent!==t)tag.textContent=t},
  // beat: beats counted from a bar line (0 = beat 1); null hides the light, as in the quiet part
  at(beat){if(beat==null){head.style.opacity=0;if(lit>=0){bs[lit].classList.remove('on');lit=-1}return}
   const i=((Math.floor(beat)%sig)+sig)%sig;if(i!==lit){if(lit>=0)bs[lit].classList.remove('on');lit=i;bs[i].classList.add('on')}
   const g=lands(),f=beat-Math.floor(beat),a=g[i],b=g[(i+1)%sig],h=sig>1&&i===sig-1?20:14;
   head.style.opacity=1;head.style.transform=`translate(${(a.x+(b.x-a.x)*f).toFixed(1)}px,${(a.y+(b.y-a.y)*f-h*4*f*(1-f)).toFixed(1)}px)`},
  say(txt,cls=''){if(txt===said)return;said=txt;sayEl.textContent=txt;sayEl.className='bb-say '+cls;if(txt){void sayEl.offsetWidth;sayEl.classList.add('pop')}},
  // a tap or a note shown at its place in the bar
  dot(beat,cls){const d=document.createElement('u');d.className='bb-n '+cls;d.style.left=xOf(beat).toFixed(1)+'px';row.appendChild(d);return d},
  clear(){row.querySelectorAll('.bb-n').forEach(d=>d.remove())},
  mark(i,j){const b=bs[((i%sig)+sig)%sig];if(!b)return;b.classList.remove('jp','jg','jo','jm');void b.offsetWidth;b.classList.add('j'+j);clearTimeout(b._t);b._t=setTimeout(()=>b.classList.remove('j'+j),450)}}}
let BEAT_TOLD=false,RHY_TOLD=false,COACH_BAR=false;

// ================================================================ 1. beat tapping (steady beat, tempo changes, inner pulse)
// The child presses Start when ready. The teacher counts in “1, 2, 3, 4” on the bar (two bars for the first few tries:
// one to listen, one to count along), “Now!” marks the first beat, and missed beats before the first tap are not counted.
// Ms. Hop hops on the drum and lands on every beat, so each beat can be seen coming; a big jump on the last count lands on the first beat.
function runBeat(spec,host,opt){
 const segs=spec.segs||[[spec.bpm,spec.beats]],sig=spec.sig||4,w=WIN[opt.tier||1],fade=spec.fade||null;
 const beats=[];let t=0;segs.forEach(([b,n])=>{const spb=60/b;for(let i=0;i<n;i++){beats.push({t,spb,j:null});t+=spb}});
 const runs=(S.cnt&&S.cnt.beat)||0,bars=opt.contest||runs>=3?1:2,lead=sig*bars,spb0=60/segs[0][0],quiet=i=>fade&&i>=fade[0]&&i<fade[1];
 const changes=[];{let n=0;segs.forEach(([b,c],k)=>{if(k)changes.push({i:n,faster:b>segs[k-1][0]});n+=c})}
 host.innerHTML=`<div class="beatlab">
  <div class="tline">${tface(opt.teacher||'hop')}<div class="tbub"></div></div>
  ${barHTML(sig)}
  <div class="bl-msg"></div>
  <div class="bl-ctl"></div>
  <div class="bl-stage"><div class="bl-ring"></div><button class="bl-pad" type="button" aria-label="${esc(T('북|Drum'))}"><i class="bl-shadow"></i><span class="bl-hop">${pic(TEACHERS.hop.img,'🦘')}</span><b class="bl-num"></b></button></div>
  <div class="bl-meter"><span>◀ ${T('빨라요|Early')}</span><div class="bl-bar"><em></em><i></i></div><span>${T('늦어요|Late')} ▶</span></div>
  <div class="bl-judge"></div>
  <div class="bl-dots">${beats.map((b,i)=>`<i class="${quiet(i)?'quiet':''}"></i>`).join('')}</div>
  <div class="center sub">${T('화면의 북을 누르거나 아무 키나 눌러요|Tap the drum or press any key')}</div></div>`;
 const $q=s=>host.querySelector(s),pad=$q('.bl-pad'),ring=$q('.bl-ring'),num=$q('.bl-num'),hopEl=$q('.bl-hop'),shadow=$q('.bl-shadow'),dots=[...host.querySelectorAll('.bl-dots i')],tick=$q('.bl-bar i'),jt=$q('.bl-judge'),msg=$q('.bl-msg'),ctl=$q('.bl-ctl');
 const bar=beatBar($q('.bbar'),sig);
 const tl=tally();let stopped=false,raf=0,clk=null,t0=0,bs=null,lastBeat=-1,ended=false,tapped=false,run=0,msgKey='';
 const setMsg=(k,txt)=>{if(k===msgKey)return;msgKey=k;msg.textContent=txt;msg.classList.toggle('quietmsg',k==='quiet')};
 // h: how high this hop goes (0 = sitting still), f: 0..1 of the way to the next landing
 const hop=(h,f,dim)=>{const up=h*4*f*(1-f);hopEl.style.transform=`translateY(${(-up).toFixed(1)}px)`;hopEl.style.opacity=dim?.45:1;
  shadow.style.transform=`scale(${(1-up/120).toFixed(3)})`;shadow.style.opacity=h?1:.6};
 const finish=()=>{if(ended)return;ended=true;stop();S.cnt=S.cnt||{};S.cnt.beat=(S.cnt.beat||0)+1;const r=tl.result({kind:'beat'});opt.done(r)};
 const stop=()=>{stopped=true;cancelAnimationFrame(raf);killBus(bs);window.removeEventListener('keydown',onKey)};
 const mark=(i,j,dt)=>{const b=beats[i];b.j=j;tl.add(j,dt);dots[i].className=(quiet(i)?'quiet ':'')+'j'+j;
  if(j==='m'){run=0;return}
  if(tl.combo&&tl.combo%8===0)bubble(host,pick(PRAISE_SHORT));
  // the first whole bar on time, once a visit: Coach Moon notices the effort
  if(++run===sig&&!COACH_BAR&&typeof coachPop==='function'){COACH_BAR=true;coachPop('clap','네 박을 딱딱 맞췄어요! 몸이 박자를 기억해요 🌙','Four beats right on time! Your body remembers the beat 🌙',{gap:30000})}};
 const tap=(perf)=>{if(stopped||!clk)return;pad.classList.remove('hit');void pad.offsetWidth;pad.classList.add('hit');drum('snare',0,.5,bs);
  const now=clk(perf)-t0-TIMING.calib;let best=-1,bd=9;
  beats.forEach((b,i)=>{if(b.j)return;const d=now-b.t;if(Math.abs(d)<Math.abs(bd)&&Math.abs(d)<=Math.min(b.spb*.5,.4)){bd=d;best=i}});
  if(best<0)return;tapped=true;const j=judgeOf(bd,w)||'m';mark(best,j,j==='m'?null:bd);bar.mark(best,j);
  tick.style.left=(50+clamp(bd/.25,-1,1)*48)+'%';tick.style.background=JCOL[j];tick.classList.remove('flash');void tick.offsetWidth;tick.classList.add('flash');
  jt.textContent=j==='m'?(bd<0?T('너무 빨라요!|Too early!'):T('너무 늦어요!|Too late!')):T(JTXT[j]);jt.style.color=JCOL[j];jt.classList.remove('pop');void jt.offsetWidth;jt.classList.add('pop');
  if(j==='m')SFX.pop()};

 pad.addEventListener('pointerdown',e=>{e.preventDefault();tap(e.timeStamp)});

// ================================================================ 6. note town: reading notes on the staff, one note friend at a time
// Each note is a little friend who lives at its place on the staff; pressing its key gives it its voice (see → hear → play).
// · Teach before asking: a new friend is shown with its name and place, heard, then played with its key glowing.
// · Landmarks first (middle C, then G on the treble clef's line), then one neighbour at a time, so a note can be worked out
//   by counting steps (line → space → line) from a note the child already knows.
// · Errorless: help fades per note (glowing key → name label → colour only → plain) and comes back after a miss.
//   A wrong key plays that note and shows where it lives next to the target; two misses or "Show me" teach the answer.
// · Leitner-style memory per note: "known" = read with no help on two different days; known notes come back for review
//   after 1, 2, 4, 7 and 14 days. A new friend joins only when every friend met so far is at least "almost there".

// ---------------------------------------------------------------- the memory: one record per note friend in the player's save
const nrS=()=>{if(typeof S==='undefined')return {n:{},r:0,hi:0,last:''};if(!S.nr||typeof S.nr!=='object')S.nr={};const R=S.nr;
 if(!R.n||typeof R.n!=='object')R.n={};R.r=+R.r||0;R.hi=R.hi?1:0;R.last=R.last||'';
 for(const id of Object.keys(R.n)){const x=R.n[id];if(!NR_INFO[id]||!x||typeof x!=='object'){delete R.n[id];continue}
  x.lv=clamp(+x.lv||0,0,4);for(const k of ['ok','w','pc','kb','seen'])x[k]=+x[k]||0;if(!Array.isArray(x.pd))x.pd=[];x.due=x.due||'';x.intro=x.intro?1:0;if(x.at==null)x.at=-1}
 return R};
const nrFresh=()=>({lv:0,ok:0,w:0,pc:0,pd:[],kb:0,due:'',seen:0,intro:0,at:-1,ld:''});
// -1 = not met yet (or met but its first lesson was never finished)
const nrLv=id=>{const x=nrS().n[id];return x&&x.intro?x.lv:-1};
const nrBucket=lv=>lv<0?0:lv<=2?1:lv===3?3:4;
const NR_ICON=['🥚','🌱','🌱','🌷','⭐'];
const dayAdd=n=>{const d=new Date();d.setDate(d.getDate()+n);return dayKey(d)};
const nrDue=x=>x.lv>=4&&(!x.due||daysSince(x.due)>=0);
// solid enough for a new friend to join: known, or almost there and read once more with no help since the last miss
const nrReady=x=>!!x&&(x.lv>=4||(x.lv===3&&x.pc>=1));
const nrOpen=()=>lessonDone('b3')||Object.keys(nrS().n).length>0;
// how=clean (no help at all), helped (only the planned glow of a brand-new friend), miss (a wrong key or "Show me")
function nrUpdate(id,how){const R=nrS(),x=R.n[id];if(!x)return {was:0,now:0};const was=x.lv,today=dayKey();let ev=null;x.seen++;x.at=R.r;x.ld=today;
 if(how==='miss'){x.w++;x.pc=0;if(x.lv>=4){x.lv=3;x.pd=[];x.kb=0;x.due=''}else if(x.lv>=2)x.lv--}
 else{if(how==='clean')x.ok++;

  else if(how==='clean'){
   if(x.lv<3)x.lv++;
   else if(x.lv===3){x.pc++;if(!x.pd.includes(today))x.pd=x.pd.concat(today).slice(-4);if(x.pc>=3&&x.pd.length>=2){x.lv=4;x.kb=0;x.due=dayAdd(NR_INT[0]);ev='known'}}
   else if(nrDue(x)){x.kb=Math.min(NR_INT.length-1,x.kb+1);x.due=dayAdd(NR_INT[x.kb])}}}
 save();return {was,now:x.lv,ev}}
// one round: which friends come, in what order, and which octave of keys to show
function nrPlan(){const R=nrS(),n=R.n;let ids=NR_ORDER.filter(id=>n[id]);const fresh=ids.filter(id=>!n[id].intro);
 if(!ids.length){['C4','G4'].forEach(id=>{n[id]=nrFresh();fresh.push(id)});ids=['C4','G4']}
 else if(!fresh.length&&ids.every(id=>nrReady(n[id]))){const nx=NR_ORDER.find(id=>!n[id]);if(nx){n[nx]=nrFresh();fresh.push(nx);ids.push(nx)}}
 save();
 const inZ=(z,id)=>{const m=midiOf(id);return m>=z[0]&&m<=z[1]};let zone=NR_ZONES[0];
 if(ids.some(id=>midiOf(id)>72)){const wt=id=>fresh.includes(id)?6:n[id].lv<=2?3:n[id].lv===3?2:nrDue(n[id])?1:0,sc=NR_ZONES.map(z=>ids.filter(id=>inZ(z,id)).reduce((a,id)=>a+wt(id),0));
  zone=fresh.some(id=>midiOf(id)>72)?NR_ZONES[1]:fresh.some(id=>midiOf(id)<67)?NR_ZONES[0]:sc[1]>sc[0]?NR_ZONES[1]:sc[0]>sc[1]?NR_ZONES[0]:NR_ZONES[R.r%2]}
 const pool=ids.filter(id=>inZ(zone,id)),fr=fresh.filter(id=>pool.includes(id)),N=pool.length<=3?8:10,want=[];
 // new friends three times (the first is their lesson), friends still learning twice, almost-there once or twice, known ones when due
 pool.forEach(id=>{const x=n[id];if(fr.includes(id))[100,90,80].forEach(p=>want.push([id,p]));else if(x.lv<=2)(pool.length<=3?[70,60,50]:[70,60]).forEach(p=>want.push([id,p]));
  else if(x.lv===3)(pool.length<=4?[55,45]:[55]).forEach(p=>want.push([id,p]));else if(nrDue(x))want.push([id,40])});
 // fill up with known friends seen least recently, then the others
 const fill=pool.slice().sort((a,b)=>(n[b].lv>=4)-(n[a].lv>=4)||n[a].at-n[b].at||Math.random()-.5);for(let i=0,p=20;want.length<N&&fill.length;i++,p-=.01)want.push([fill[i%fill.length],p]);
 const chosen=want.sort((a,b)=>b[1]-a[1]).slice(0,N),cnt={};chosen.forEach(([id])=>cnt[id]=(cnt[id]||0)+1);

 for(let p=0;p<N;p++){if(slots[p])continue;const a=slots[p-1],b=slots[p+1];let j=rest.findIndex(id=>ok(id,p)&&id!==a&&id!==b);if(j<0)j=rest.findIndex(id=>ok(id,p)&&id!==a);if(j<0)j=rest.findIndex(id=>ok(id,p));
  if(j>=0){slots[p]=rest.splice(j,1)[0];continue}const alt=pool.filter(id=>ok(id,p)&&id!==a);slots[p]=alt.length?pick(alt):pool.find(id=>ok(id,p))||pool[0]}

// ---------------------------------------------------------------- the round
function runNR(spec,host,opt){const R=nrS(),P=nrPlan(),N=P.queue.length,[lo,hi]=P.zone;

 NR_ORDER.forEach(id=>{res.before[id]=nrLv(id)});

 const home=m=>{const el=kb.keyEl(m);if(!el)return;el.classList.add('home');setTimeout(()=>el.classList.remove('home'),650);fly(m,'♪ '+nrLab(m))};

 const showBtn=()=>{ctl.innerHTML=`<button class="btn ghost small" id="nrShow" type="button">🤔 ${L('모르겠어요 · 알려 줘요','Not sure? Show me')}</button>`;$q('#nrShow').addEventListener('click',()=>{if(cur&&!cur.done)reveal(false)})};
 function hello(){phase='hello';setTag(null);
  svgEl.innerHTML=nrSVG([{m:64,x:80,col:colorOf(64),tcol:nrTxtCol(64),label:L('줄 음표','line note'),lsz:12},{m:65,x:153,col:colorOf(65),tcol:nrTxtCol(65),label:L('칸 음표','space note'),lsz:12}],{nums:true,aria:L('오선: 줄 다섯 개, 줄 음표와 칸 음표','The staff: five lines, a line note and a space note')});
  say(L(...NR_HELLO));ctl.innerHTML=`<button class="btn green" id="nrGo" type="button">🎵 ${L('친구 만나러 가기','Meet the friends')} ▶</button>`;
  $q('#nrGo').addEventListener('click',()=>{SFX.click();R.hi=1;save();stopVoice();step()})}

 function intro(id){phase='intro';const t=midiOf(id),i=NR_INFO[id];cur={id,t,done:false};setTag(0,true);

  $q('#nrHear').addEventListener('click',()=>{stopVoice();hear()});
  later(()=>{tone(t);sing()},350);later(()=>speak(L(i.i[0],i.i[1]),{onend:()=>{if(phase==='intro'&&cur&&cur.id===id&&!cur.done){tone(t);sing();setMsg(L(i.i[0]+' 반짝이는 건반을 눌러 봐요!',i.i[1]+' Press the glowing key!'))}}}),1100)}
 function ask(id){phase='ask';const t=midiOf(id),x=R.n[id];cur={id,t,lv:x.lv,tries:0,show:false,glowed:false,first:null,done:false};setTag(x.lv);
  svgEl.innerHTML=nrAskSVG(t,{lv:x.lv,cls:'pop'});
  const p=L('이 친구의 건반은 어디일까요? 눌러서 목소리를 찾아 줘요!','Where is this friend’s key? Press it to give it a voice!');

   if(m===cur.t){cur.done=true;const x=R.n[cur.id];x.intro=1;save();res.met.push(cur.id);dots[k].className='nw';home(m);sing();const Tn=nrNm(m);
    speak(L(`${Tn}!`,`${nrNm(m,1)}!`));setMsg(L(`와, ${Tn}${nrJ(Tn,'이','가')} 노래해요! 🎵`,`Yay, ${Tn} is singing! 🎵`));tok++;k++;later(step,1500)}

  dots[k].className=rep?'ok':'half';home(c.t);sing();ctl.innerHTML='';const Tn=nrNm(c.t);speak(L(`${Tn}!`,`${nrNm(c.t,1)}!`));
  if(u.ev==='known'){setMsg(L(`⭐ 이제 ${Tn}${nrJ(Tn,'을','를')} 혼자 읽을 수 있어요!`,`⭐ Now you can read ${Tn} all by yourself!`));setTag(4);celebrate('stars');
   try{coachPop('clap',`${Tn}${nrJ(Tn,'을','를')} 이제 혼자 읽어요! 다른 날에도 기억해 낸 거예요 ⭐`,`You can read ${Tn} on your own now! You remembered it on another day ⭐`,{gap:15000})}catch(e){}}
  else if(rep)setMsg(pick([L(`딩동! ${Tn}${nrJ(Tn,'이','가')} 노래해요! 🎵`,`Ding! ${nrNm(c.t,1)} is singing! 🎵`),L(`맞아요, ${Tn}${nrJ(Tn,'이에요','예요')}! ✨`,`Yes, that’s ${Tn}! ✨`),L(`${Tn}${nrJ(Tn,'이','가')} 목소리를 찾았어요! 🎶`,`${nrNm(c.t,1)} found its voice! 🎶`)]));

  k++;later(step,u.ev==='known'?2000:1200)}

  svgEl.innerHTML=nrAskSVG(c.t,{lv:c.lv,ghost:m});say(nrWhy(c.t,m),'help')}

  svgEl.innerHTML=nrAskSVG(c.t,{lv:c.lv,lab:true,ref:true});glow(c.t);ctl.innerHTML='';say(nrShow(c.t,again),'help')}

  const gap=.36,t0=AC?AC.currentTime+.25:0;ms.forEach((m,i)=>{play('piano',m,t0+i*gap,gap*.95,.8,bs);later(()=>{const g=svgEl.querySelector(`.sn[data-i="${i}"]`);if(g){g.classList.add('lit');setTimeout(()=>g.classList.remove('lit'),300)}const el=kb.keyEl(m);if(el){el.classList.add('home');setTimeout(()=>el.classList.remove('home'),300)}},250+i*gap*1000)});

<script>
// ================================================================ singing: breathing, warm-ups and pitch matching with the microphone
// The voice is analysed on this device only; nothing is recorded or sent anywhere.
let MIC=null,MIC_DENIED=false,SING_FIRST=false;
async function micOn(){if(MIC)return MIC;const a=audioCtx();if(!a||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('nomic');

// YIN pitch detection on the latest 2048 samples; returns {f (Hz or -1), rms}

function micRead(){if(!MIC)return {f:-1,rms:0};const now=performance.now();if(now-LAST.t<38)return LAST.r;LAST.t=now;LAST.r=micRead2();return LAST.r}

 if(rms<.01)return {f:-1,rms};const sr=AC.sampleRate,W=1024,tMin=Math.floor(sr/1050),tMax=Math.min(Math.floor(sr/80),n-W-1);
 if(!YD||YD.length<tMax+2){YD=new Float32Array(tMax+2);YC=new Float32Array(tMax+2)}
 for(let t=1;t<=tMax+1;t++){let s=0;for(let i=0;i<W;i++){const x=b[i]-b[i+t];s+=x*x}YD[t]=s}
 let run=0;YC[0]=1;for(let t=1;t<=tMax+1;t++){run+=YD[t];YC[t]=run?YD[t]*t/run:1}
 let tau=-1;for(let t=tMin;t<=tMax;t++){if(YC[t]<.14){while(t+1<=tMax&&YC[t+1]<YC[t])t++;tau=t;break}}
 if(tau<0){let mn=1,mt=-1;for(let t=tMin;t<=tMax;t++)if(YC[t]<mn){mn=YC[t];mt=t}if(mn<.3)tau=mt;else return {f:-1,rms}}
 const a1=YC[tau-1],a2=YC[tau],a3=YC[tau+1],den=a1-2*a2+a3,shift=den?(a1-a3)/(2*den):0;

const centsTo=(f,target)=>{if(f<=0)return null;const c=1200*Math.log2(f/hz(target));return ((c%1200)+1800)%1200-600};

  try{navigator.permissions.query({name:'microphone'}).then(p=>{if(p.state!=='granted'){ask();return}micOn().then(()=>{if(!done){done=true;onReady(true)}},ask)},ask)}catch(e){ask()}
  setTimeout(ask,1500);return}
 micAsk(host,teacher,onReady)}

// ================================================================ breathing: in for 4, hold for 2, “sss” out for 6

 const stop=()=>{stopped=true;cancelAnimationFrame(raf);micOff()};
 const finish=()=>{if(ended)return;ended=true;stop();if(useMic){const acc=outT?clamp(outOn/outT/.85,0,1):0;opt.done({acc,stars:starsOf(acc),kind:'breath'})}else opt.done({acc:1,stars:3,kind:'breath',self:true})};
 ACT={stop,sim(acc=.9){finish()}};
 micGate(host,opt.teacher||'lala',on=>{if(stopped){micOff();return}useMic=on;
  host.innerHTML=`<div class="breath"><div class="tline">${tface(opt.teacher||'lala')}<div class="tbub"></div></div>
   <div class="br-msg"></div><div class="br-stage"><div class="br-ball"></div><b class="br-n"></b></div>
   ${on?`<div class="br-meter"><span>💨</span><div class="bar"><i></i></div></div>`:''}<div class="br-cyc">${Array.from({length:cycles},()=>'<i></i>').join('')}</div>
   <p class="sub center">${T('어깨는 편하게, 배가 풍선처럼 불룩해지게 숨을 쉬어요|Relax your shoulders and let your tummy puff up like a balloon')}</p></div>`;
  const ball=host.querySelector('.br-ball'),msg=host.querySelector('.br-msg'),n=host.querySelector('.br-n'),meter=host.querySelector('.br-meter i'),cyc=[...host.querySelectorAll('.br-cyc i')];
  const TXT={in:'🌬️ 코로 천천히 들이마셔요|🌬️ Breathe in slowly through your nose',hold:'✋ 잠깐 멈춰요|✋ Hold it',out:'🐍 “스~~~” 하고 길게 내쉬어요|🐍 Breathe out a long “sss”',rest:'😌 편하게 쉬어요|😌 Relax'};

   const sc=seg.k==='in'?.45+.55*f:seg.k==='hold'?1:seg.k==='out'?1-.55*f:.45;ball.style.transform=`scale(${sc.toFixed(3)})`;ball.className='br-ball '+seg.k;
   n.textContent=seg.k==='rest'?'':String(Math.min(Math.floor(f*seg.d/spb)+1,Math.round(seg.d/spb)));
   if(useMic){const r=micRead();const lv=clamp(r.rms/.08,0,1);if(meter)meter.style.width=(lv*100)+'%';if(seg.k==='out'&&now>=seg.t+.5){outT++;if(r.rms>.015)outOn++}}

  else{const s=SONGS[spec.song||'twinkle'],spb=60/bpm,mel=parseMelody(s.m).slice(0,spec.len||14);notes=mel.filter(n=>!n.rest).map(n=>({t:n.b*spb,d:n.d*spb,m:n.m}));dur=Math.max(...notes.map(n=>n.t+n.d))+.5;lo=Math.min(...notes.map(n=>n.m))-3;hi=Math.max(...notes.map(n=>n.m))+3;
   $q('.sg-q').textContent=T('막대에 적힌 계이름으로 노래해요! 내 목소리 선을 막대에 올려요.|Sing the note names on the bars! Keep your voice line on the bars.')}
  const guide=t=>task==='siren'?(t<1?55:t<4?55+(t-1)/3*17:t<7?72-(t-4)/3*17:55):(()=>{const n=notes.find(n=>t>=n.t&&t<n.t+n.d);return n?n.m:null})();
  const W=()=>cv.clientWidth,H=()=>cv.clientHeight,yOf=m=>H()-12-(m-lo)/(hi-lo)*(H()-24);
  ctl.innerHTML=`<button class="btn green go" type="button">▶ ${T('시작|Start')}</button>`;
  const draw=now=>{const w=W(),h=H(),dpr=Math.min(2,devicePixelRatio||1);if(cv.width!==w*dpr){cv.width=w*dpr;cv.height=h*dpr}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#fffaf0';ctx.fillRect(0,0,w,h);
   const px=w*.25,pps=w/4;ctx.fillStyle='rgba(255,95,162,.15)';ctx.fillRect(px-2,0,4,h);
   if(task==='siren'){ctx.strokeStyle='#3ec46d';ctx.lineWidth=14;ctx.lineCap='round';ctx.globalAlpha=.35;ctx.beginPath();for(let t=Math.max(0,now-1);t<now+3;t+=.05){const x=px+(t-now)*pps,y=yOf(guide(t));t===Math.max(0,now-1)?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke();ctx.globalAlpha=1}
   else notes.forEach(n=>{const x=px+(n.t-now)*pps,x2=x+n.d*pps-4;if(x2<0||x>w)return;ctx.fillStyle=colorOf(n.m);ctx.globalAlpha=.85;ctx.beginPath();ctx.roundRect?ctx.roundRect(x,yOf(n.m)-10,x2-x,20,8):ctx.rect(x,yOf(n.m)-10,x2-x,20);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.font='900 12px system-ui';ctx.textAlign='left';ctx.fillText(noteName(n.m,'solfege'),x+5,yOf(n.m)+4)});
   ctx.strokeStyle='#ff5fa2';ctx.lineWidth=3;ctx.beginPath();let first=true;trace.forEach(p=>{const x=px+(p.t-now)*pps;if(x<0||p.m==null){first=true;return}const y=yOf(p.m);first?ctx.moveTo(x,y):ctx.lineTo(x,y);first=false});ctx.stroke()};
  const loop=()=>{if(stopped)return;const now=performance.now()/1000-start;if(now>dur){const acc=useMic?(tot?clamp(on/tot/.8,0,1):0):1;if(useMic)finish({acc,stars:starsOf(acc),kind:'sing'});else{tip.textContent='';selfRate(host,finish)}return}
   const g=now>=0?guide(now):null;let m=null;
   if(useMic&&now>=0){const r=micRead();if(r.f>0){const raw=69+12*Math.log2(r.f/440);
     // fold the sung pitch to the octave of the guide so a child singing an octave up still lines up
     m=g!=null?raw+12*Math.round((g-raw)/12):raw}
    trace.push({t:now,m});if(trace.length>400)trace.shift();
    if(g!=null){tot++;if(m!=null&&Math.abs(m-g)<=(task==='siren'?1.2:.75))on++;tip.textContent=m==null?'🎤 '+T('소리를 내 봐요!|Let me hear you!'):Math.abs(m-g)<=.75?'🎯 '+T('좋아요!|Nice!'):m>g?'⬇️ '+T('조금 낮게|A bit lower'):'⬆️ '+T('조금 높게|A bit higher')}}
   draw(now);raf=requestAnimationFrame(loop)};
  ctl.querySelector('.go').addEventListener('click',async()=>{ctl.innerHTML='';await ensureAudio();await want(['flute'],1500);start=performance.now()/1000+1.2;const t0=AC?AC.currentTime+1.2:0;
   if(task==='siren'){for(let i=0;i<4;i++)drum('click',t0-1.2+i*.3,.6,bs);/* a soft guide glide */const o=AC&&SND.on?AC.createOscillator():null;if(o){const g2=AC.createGain();o.type='sine';g2.gain.value=0;o.connect(g2);g2.connect(bs);o.frequency.setValueAtTime(hz(55),t0);o.frequency.setValueAtTime(hz(55),t0+1);o.frequency.linearRampToValueAtTime(hz(72),t0+4);o.frequency.linearRampToValueAtTime(hz(55),t0+7);g2.gain.setValueAtTime(0,t0);g2.gain.linearRampToValueAtTime(.08,t0+.3);g2.gain.setValueAtTime(.08,t0+7.3);g2.gain.linearRampToValueAtTime(0,t0+7.8);o.start(t0);o.stop(t0+8)}}
   else{const spb=60/bpm;for(let i=0;i<4;i++)drum(i?'click':'accent',t0-4*spb+i*spb,.6,bs);notes.forEach(n=>play('flute',n.m,t0+n.t,n.d*.95,.3,bs));const nb=Math.ceil(dur/spb);for(let i=0;i<nb;i++)drum('click',t0+i*spb,.25,bs)}
   raf=requestAnimationFrame(loop)});
  draw(-1)}
}
</script>
<script>
// ================================================================ Little Music Academy
// Short lessons with six teachers, falling-note piano and drums, rhythm and singing games, daily practice with streaks,
// contests against rivals, a sticker book, a shop and several players per device.

// ---------------------------------------------------------------- helpers
const $=id=>document.getElementById(id);
const num=n=>Number(n).toLocaleString(LANG==='en'?'en-US':'ko-KR');
const dayKey=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const daysSince=k=>{if(!k)return 999;const [y,m,d]=k.split('-').map(Number);return Math.round((new Date(dayKey())-new Date(y,m-1,d))/864e5)};
const pic=(src,emoji)=>src?`<img class="ei" src="${src}" data-emoji="${esc(emoji)}" alt="" draggable="false">`:esc(emoji);
document.addEventListener('error',e=>{const t=e.target;if(!t||t.tagName!=='IMG')return;if(t.dataset.fb!==undefined){const w=document.createElement('span');w.innerHTML=icHTML(t.dataset.fb);t.replaceWith(...w.childNodes);return}if(t.dataset.emoji!==undefined)t.replaceWith(document.createTextNode(t.dataset.emoji))},true);
const COIN='🪙';
const COPYRIGHT=()=>`<footer class="copy">© 2026 Dongsun Moon. ${L('모든 권리 보유.','All rights reserved.')}<br>${L('노래 가락은 저작권이 끝난 전래 동요와 클래식 곡을 새로 편곡했어요. 악기 소리는 퍼블릭 도메인(CC0)으로 공개된 실제 악기 녹음(Versilian Studios VCSL·VSCO 2 CE, Freesound bletort)을 다듬어 썼어요. 그림과 캐릭터는 이 게임을 위해 만들었어요.','Melodies are public-domain folk songs and classical pieces, newly arranged. Instrument sounds are real recordings released into the public domain (CC0) by Versilian Studios (VCSL, VSCO 2 CE) and bletort on Freesound. Art and characters were made for this game.')}</footer>`;
function sparkle(el){if(!el)return;const r=el.getBoundingClientRect();for(let i=0;i<8;i++){const s=document.createElement('i');s.className='spk';s.textContent=pick(['✨','⭐','🎵','💫']);s.style.left=(r.left+r.width*Math.random())+'px';s.style.top=(r.top+r.height*Math.random())+'px';$('fx').appendChild(s);setTimeout(()=>s.remove(),900)}}

// ---------------------------------------------------------------- save: several players on one device
const SAVE_KEY='musicAcademy.v1';
const freshP=()=>({name:L('음악 친구','Music friend'),av:'🧒',xp:0,lvl:1,coins:120,earned:0,lessons:{},songs:{},drums:{},contests:{},stickers:[],ach:[],how:{},
 daily:{day:'',tasks:[],done:[],chest:false},streak:{n:0,best:0,last:'',shields:1},days:{},stats:{taps:0,perfect:0,plays:0,maxCombo:0,sings:0,secs:0},
 owned:['skin-block','stage-night','keys-classic'],equip:{skin:'skin-block',stage:'stage-night',keys:'keys-classic'},intro:false,fails:{},created:dayKey(),
 cnt:{},mic:0,nr:{n:{},r:0,hi:0,last:''}});
const mergeP=d=>{const f=freshP();if(!d||typeof d!=='object')return f;return {...f,...d,streak:{...f.streak,...d.streak},stats:{...f.stats,...d.stats},equip:{...f.equip,...d.equip},daily:{...f.daily,...d.daily}}};
function loadRoot(){let r=null;try{r=JSON.parse(localStorage.getItem(SAVE_KEY)||'null')}catch(e){}
 if(!r||!Array.isArray(r.P)||!r.P.length)r={v:1,cur:0,P:[freshP()],opt:{}};
 r.opt={sound:true,voice:true,calib:0,...r.opt};r.P=r.P.map(mergeP);r.cur=clamp(r.cur||0,0,r.P.length-1);return r}
let ROOT=loadRoot(),S=ROOT.P[ROOT.cur];
// the player picked on the main page decides the name and face
if(MGP.me){S.name=MGP.me.name;S.av=MGP.me.av;S.faceSet=true}
const homeHref=()=>'index.html?lang='+LANG;
const save=()=>{ROOT.P[ROOT.cur]=S;try{localStorage.setItem(SAVE_KEY,JSON.stringify(ROOT))}catch(e){}};
function applyOpts(){SND.on=ROOT.opt.sound;TIMING.calib=(ROOT.opt.calib||0)/1000;OPT_NAMES=()=>ROOT.opt.names||(LANG==='en'?'letter':'solfege');
 LOOK.skin=S.equip.skin.replace('skin-','');LOOK.stage=S.equip.stage.replace('stage-','');LOOK.keys=S.equip.keys.replace('keys-','')}

// ---------------------------------------------------------------- progress
const lessonIdx=id=>LESSONS.findIndex(l=>l.id===id);
const lessonDone=id=>!!(S.lessons[id]&&(S.lessons[id].s>=1||S.lessons[id].pass));
// each unit opens on its own (UNIT_NEED, with the topics below); inside a unit the lessons go in order
const lessonOpen=i=>{const l=LESSONS[i],prev=LESSONS[i-1];if(!l)return false;if(prev&&prev.u===l.u)return lessonDone(prev.id);return !unitNeed(l.u).length};
const nextLesson=()=>LESSONS.find((l,i)=>lessonOpen(i)&&!lessonDone(l.id))||null;
const doneCount=()=>LESSONS.filter(l=>lessonDone(l.id)).length;
const starTotal=()=>Object.values(S.lessons).reduce((a,b)=>a+(b.s||0),0);
const SONG_UNLOCK={hotcross:'b4',mary:'b6',clair:'b6',twinkle:'e4',ode:'e6',lightly:'e7',jacques:'f5',oldmac:'f5',london:'i4',oldman:'i4',jingle:'i5',yankee:'j4',furelise:'j4'};
const DRUM_UNLOCK={accent4:'a4',boomclap:'d2',rock:'d3',rockfill:'d4',disco:'d5',waltz:'f2',march:'f4',funk:'j2'};
const songOpen=id=>lessonDone(SONG_UNLOCK[id]);
const drumOpen=id=>lessonDone(DRUM_UNLOCK[id]);
const contestOpen=c=>lessonDone(c.after);
const unitOf=l=>UNITS.find(u=>u.id===l.u);
const teacherOf=l=>unitOf(l).teacher;
const titleOf=lvl=>{let t=TITLES[0];for(const x of TITLES)if(lvl>=x[0])t=x;return {icon:t[1],name:T(t[2])}};
const xpNeed=l=>60+l*40;

// ---------------------------------------------------------------- voice (teachers speak every instruction)
let voices=[];
const NOVELTY=/albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|deranged|hysterical|grandma|grandpa|eddy|flo\b|reed|rocko|sandy|shelley/i;
function loadVoices(){try{voices=speechSynthesis.getVoices().filter(v=>(v.lang||'').toLowerCase().startsWith(LANG)&&!NOVELTY.test(v.name))}catch(e){voices=[]}}
if('speechSynthesis' in window){loadVoices();try{speechSynthesis.addEventListener('voiceschanged',loadVoices)}catch(e){}}
const bestVoice=()=>voices.find(v=>/google|yuna|sora|samantha|ava|allison|natural|premium|enhanced|siri/i.test(v.name))||voices[0]||null;
// read music words the way people say them: 4/4 → “4분의 4”, p(피아노) → “피아노”, no emoji or symbols
function speakable(t){t=String(t);
 t=t.replace(/\b(pp|p|mp|mf|f|ff)\s?\(([^)]+)\)/g,'$2').replace(/\(([A-G][♯♭#b]?)\)/g,'').replace(/(\d)\/(\d)/g,L('$2분의 $1','$1 $2')).replace(/“[<>]”\s?/g,'')
  .replace(/♯/g,L(' 샵',' sharp')).replace(/♭/g,L(' 플랫',' flat')).replace(/[·–]/g,' ').replace(/~+/g,'').replace(/W-W-H-W-W-W-H|W-H-W-W-H-W-W/g,'');
 return t.replace(/\p{Extended_Pictographic}|‍|️|[①②③④⭕❌♩♪♫♬]/gu,'').replace(/\s+/g,' ').trim()}
let pendingSay=null,saySeq=0;
document.addEventListener('pointerdown',()=>{const p=pendingSay;pendingSay=null;if(!p)return;setTimeout(()=>{if(p.seq===saySeq)speak(p.text,p.o)},300)},{capture:true,once:true});
// o.force: the child pressed a “hear again” button, so read it even when the teacher voice is switched off
function speak(text,o={}){const end=o.onend||null;
 if(!(ROOT.opt.voice||o.force)||!('speechSynthesis' in window)||!text){if(end)setTimeout(end,250);return}
 saySeq++;const seq=saySeq;if(navigator.userActivation&&!navigator.userActivation.hasBeenActive){pendingSay={text,o,seq};if(end)setTimeout(end,250);return}
 try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(speakable(text));const v=bestVoice();if(v)u.voice=v;u.lang=LANG==='en'?'en-US':'ko-KR';u.rate=1;u.pitch=1.12;
  let fired=false;const fire=()=>{if(fired||seq!==saySeq)return;fired=true;if(end)end()};u.onend=fire;u.onerror=fire;setTimeout(fire,Math.min(14000,600+speakable(text).length*95));speechSynthesis.speak(u)}catch(e){if(end)end()}}
const stopVoice=()=>{saySeq++;try{speechSynthesis.cancel()}catch(e){}};

// ---------------------------------------------------------------- HUD, modals, toasts, effects
function updateHud(){const t=titleOf(S.lvl);$('lvlNum').textContent=S.lvl;$('lvlName').innerHTML=`${esc(S.name)} <small>${t.icon} ${esc(t.name)}</small>`;$('xpFill').style.width=Math.min(100,100*S.xp/xpNeed(S.lvl))+'%';
 $('coinNum').textContent=num(S.coins);$('streakNum').textContent=S.streak.n;$('streakPill').classList.toggle('lit',S.streak.last===dayKey());$('avaBtn').textContent=S.av;
 $('lvlBtn').setAttribute('aria-label',L(`${S.name} · 레벨 ${S.lvl} · 내 정보`,`${S.name} · Level ${S.lvl} · My info`))}
function toast(html){const t=document.createElement('div');t.className='toast';t.innerHTML=html;$('toasts').appendChild(t);setTimeout(()=>t.classList.add('out'),2300);setTimeout(()=>t.remove(),2700)}
let MQ=[],CUR=null,MFOCUS=null;
function modal(html,o={}){MQ.push({html,...o});if(!CUR)nextModal()}
// closable modals close with ✕, a tap outside or Escape; the ones that must be answered (closable:false) only close from their own buttons
function nextModal(){const m=MQ.shift();if(!m)return;const ae=document.activeElement;if(!MFOCUS&&ae&&ae!==document.body&&!$('modalRoot').contains(ae))MFOCUS=ae;CUR=m;const can=m.closable!==false;
 $('modalRoot').innerHTML=`<div class="mback"><div class="modal ${m.cls||''}" role="dialog" aria-modal="true" tabindex="-1">${can?`<button class="mx" type="button" data-act="close" aria-label="${esc(L('닫기','Close'))}">✕</button>`:''}${m.html}</div></div>`;
 const back=$('modalRoot').querySelector('.mback'),box=back.querySelector('.modal'),h=box.querySelector('h2');if(h){h.id=h.id||'mTitle';box.setAttribute('aria-labelledby',h.id)}
 box.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;if(a==='close'){closeModal();return}const f=m.acts&&m.acts[a];if(f){const r=f(b);if(r!==false)closeModal(typeof r==='function'?r:null)}});
 if(can){let downHere=false;back.addEventListener('pointerdown',e=>{downHere=e.target===back});back.addEventListener('click',e=>{if(e.target===back&&downHere&&CUR===m)closeModal()})}
 try{box.focus({preventScroll:true})}catch(e){}
 if(m.onOpen)m.onOpen(box)}
function closeModal(after){const m=CUR;CUR=null;$('modalRoot').innerHTML='';if(m&&m.onClose)m.onClose();if(after)after();if(!CUR)nextModal();
 if(!CUR&&MFOCUS){const f=MFOCUS;MFOCUS=null;if(f.isConnected&&!f.closest('.hidden'))try{f.focus({preventScroll:true})}catch(e){}}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&CUR&&CUR.closable!==false){e.preventDefault();closeModal()}});
function celebrate(kind='confetti'){const fx=$('fx'),em=kind==='stars'?['⭐','🌟','✨']:['🎉','🎊','🎵','🎶','⭐','💖','🌈'];for(let i=0;i<34;i++){const s=document.createElement('i');s.className='conf';s.textContent=pick(em);s.style.left=(Math.random()*100)+'vw';s.style.animationDelay=(Math.random()*.6)+'s';s.style.fontSize=(18+Math.random()*22)+'px';fx.appendChild(s);setTimeout(()=>s.remove(),3200)}}

// ---------------------------------------------------------------- rewards, levels, stickers, streaks, trophies
function grant({xp=0,coins=0}={}){S.xp+=xp;S.coins+=coins;if(coins>0)S.earned+=coins;const ups=[];while(S.xp>=xpNeed(S.lvl)){S.xp-=xpNeed(S.lvl);S.lvl++;ups.push(S.lvl)}save();updateHud();
 if(coins>0){$('coinPill').classList.remove('bump');void $('coinPill').offsetWidth;$('coinPill').classList.add('bump')}
 ups.forEach(l=>{const t=titleOf(l),newT=TITLES.find(x=>x[0]===l);modal(`<div class="lvup"><div class="big">🎉</div><h2>${L(`레벨 ${l}!`,`Level ${l}!`)}</h2>${newT?`<p class="newtitle">${t.icon} ${esc(t.name)}</p><p>${L('새로운 칭호를 얻었어요!','You earned a new title!')}</p>`:`<p>${L('연습한 만큼 쑥쑥 자라고 있어요!','You’re growing with every practice!')}</p>`}${coachLine(newT?'big':'up')}</div><div class="row"><button class="btn gold" data-act="close" type="button">${L('신나요!','Yay!')}</button></div>`,{cls:'pop',onOpen:()=>{SFX.level();celebrate();speak(L(`레벨 ${l}! 정말 대단해요!`,`Level ${l}! Amazing!`))}})});
 return ups}
function giveSticker(pref){const left=STICKERS.filter(s=>!S.stickers.includes(s));if(!left.length){grant({coins:30});return null}const s=pref&&left.includes(pref)?pref:pick(left);S.stickers.push(s);save();return s}
// any finished practice counts for the streak; a rest-day pass covers one missed day
function practiced(){const today=dayKey();S.days[today]=(S.days[today]||0)+1;const keys=Object.keys(S.days).sort();while(keys.length>70)delete S.days[keys.shift()];
 if(S.streak.last===today){save();return null}
 const gap=daysSince(S.streak.last);let usedShield=false;
 if(gap===1)S.streak.n++;else if(gap===2&&S.streak.shields>0){S.streak.shields--;S.streak.n++;usedShield=true}else S.streak.n=1;
 S.streak.last=today;S.streak.best=Math.max(S.streak.best,S.streak.n);if(S.streak.n%7===0)S.streak.shields=Math.min(2,S.streak.shields+1);save();updateHud();
 const n=S.streak.n,ms=[3,7,14,21,30,50,100].includes(n);
 setTimeout(()=>{if(ms){const st=giveSticker();grant({coins:n*10});modal(`<div class="streakup"><div class="flame">🔥</div><h2>${L(`${n}일 연속 연습!`,`${n}-day streak!`)}</h2><p>${L('매일 조금씩 연습하는 게 진짜 실력의 비밀이에요!','A little practice every day is the real secret!')}</p><div class="rewards"><span>${COIN} +${n*10}</span>${st?`<span class="stk">${st}</span>`:''}</div></div><div class="row"><button class="btn gold" data-act="close" type="button">${L('최고!','Awesome!')}</button></div>`,{cls:'pop',onOpen:()=>{SFX.fanfare();celebrate();speak(L(`${n}일 연속 연습! 정말 대단해요!`,`${n} days in a row! You’re amazing!`))}})}
  else toast(`🔥 ${L(`${n}일째 연습!`,`Day ${n} of practice!`)}${usedShield?' · 🛡️ '+L('쉬는 날 카드를 썼어요','Rest-day pass used'):''}`)},400);
 return n}
const ACH=[
 {id:'first',icon:'🎵',name:'첫 수업|First lesson',desc:'레슨 1개 마치기|Finish a lesson',test:()=>doneCount()>=1},
 {id:'l10',icon:'📚',name:'열 걸음|Ten steps',desc:'레슨 10개 마치기|Finish 10 lessons',test:()=>doneCount()>=10},
 {id:'l30',icon:'🎓',name:'부지런한 학생|Hard worker',desc:'레슨 30개 마치기|Finish 30 lessons',test:()=>doneCount()>=30},
 {id:'all',icon:'👑',name:'아카데미 졸업|Graduate',desc:'모든 레슨 마치기|Finish every lesson',test:()=>doneCount()>=LESSONS.length},
 {id:'star3',icon:'🌟',name:'세 별 수집가|Triple-star collector',desc:'별 3개 레슨 10개|10 three-star lessons',test:()=>Object.values(S.lessons).filter(x=>x.s>=3).length>=10},
 {id:'combo30',icon:'🔥',name:'30 콤보|30 combo',desc:'한 번에 30번 연속 맞히기|Hit 30 in a row',test:()=>S.stats.maxCombo>=30},
 {id:'combo80',icon:'☄️',name:'80 콤보|80 combo',desc:'한 번에 80번 연속 맞히기|Hit 80 in a row',test:()=>S.stats.maxCombo>=80},
 {id:'perfect',icon:'💯',name:'완벽한 연주|Flawless',desc:'정확도 98% 이상|98% accuracy or better',test:()=>Object.values(S.songs).some(x=>x.best>=.98)||Object.values(S.drums).some(x=>x.best>=.98)},

// a concept as a MiniLesson: the teacher reads each slide, then its demo plays; a try comes last
function cnArt(v,p){return box=>{box.innerHTML=`<div class="vis cnvis">${visHTML(v,p)}</div>${p?`<button type="button" class="btn ghost small cndemo">🎵 ${L('다시 들어 보기','Hear it again')}</button>`:''}`;
 const b=box.querySelector('.cndemo');if(b)b.addEventListener('click',()=>{stopVoice();demo(p,box.querySelector('.vis'))})}}
function cnLesson(c){const tp=CN_TOPIC[c.id],t=TEACHERS[tp.teacher];
 const steps=c.from.map(r=>{const [lid,k]=r.split('.'),s=LESSON_BY[lid].intro[+k];return {say:T(s.t),art:cnArt(s.v,s.p),after:s.p?box=>{const v=box.querySelector('.vis');if(v)demo(s.p,v)}:null}});
 if(c.tr)steps.push(c.tr());
 return {id:c.id,icon:c.icon,title:T(c.t),who:{img:t.img,name:T(t.name)},steps,key:c.key.map(T)}}
const openCN=(id,o)=>{const c=CN_BY[id];if(c)MiniLesson.open(cnLesson(c),o)};
// small tries inside a concept lesson: no score, no time limit, and "🤔 알려 줘요" always helps
const yo=w=>{const c=w.charCodeAt(w.length-1);return w+(c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28>0?'이에요':'예요')};
function tryTap(n,say){return {say:T(say),try:true,art:(box,api)=>{box.innerHTML=`<button type="button" class="cn-drum" aria-label="${L('북 치기','Tap the drum')}">🥁<b>0</b></button>`;let k=0;const b=box.querySelector('.cn-drum');
 b.addEventListener('pointerdown',async e=>{e.preventDefault();await ensureAudio();if(AC)drum('tom',AC.currentTime+.01,.9);k++;b.querySelector('b').textContent=k;b.classList.remove('hit');void b.offsetWidth;b.classList.add('hit');
  if(k<n)api.say(cntWord(k-1));else if(k===n){api.say(L('잘했어요!','Well done!'));api.done()}})}}}
function tryKeys({from,to,labels,want,any,say}){return {say:T(say),try:true,art:(box,api)=>{box.innerHTML='<div class="cn-keys"></div>';const got=new Set();let i=0;
 const kb=buildKeys(box.querySelector('.cn-keys'),{from,to,labels,onDown:async m=>{await ensureAudio();if(AC)play('piano',m,AC.currentTime+.01,.6,.8);
  const ok=any?want.includes(m)&&!got.has(m):m===want[i];const nm=noteName(m).split(' ')[0];
  if(ok){got.add(m);i++;const k=kb.keyEl(m);if(k)k.classList.add('cn-ok');if(got.size===want.length){api.say(L(`${nm}! 아주 잘했어요!`,`${nm}! Great job!`));api.done()}else api.say(L(`${nm}, 좋아요!`,`${nm}, good!`))}
  else if(!got.has(m))api.say(L(`그건 ${yo(nm)}. 다시 찾아봐요.`,`That’s ${nm}. Try again.`))}});
 box._kb=kb},show:box=>{const kb=box._kb;if(kb)want.forEach(m=>{const k=kb.keyEl(m);if(k)k.classList.add('cn-ok')})}}}
function tryPads(say){return {say:T(say),try:true,art:(box,api)=>{const got=new Set();
 box.innerHTML=`<div class="vpads cn-pads">${['kick','snare','hat'].map(k=>`<button type="button" class="vp" data-d="${k}" style="--c:${DRUM_LANES[k].col}">${DRUM_LANES[k].icon}<small>${esc(T(DRUM_LANES[k].sub))}</small></button>`).join('')}</div>`;
 box.querySelectorAll('.vp').forEach(b=>b.addEventListener('pointerdown',async e=>{e.preventDefault();await ensureAudio();const k=b.dataset.d;if(AC)drum(k,AC.currentTime+.01,1);b.classList.remove('hit');void b.offsetWidth;b.classList.add('hit');got.add(k);api.say(T(DRUM_LANES[k].sub)+' · “'+T(DRUM_LANES[k].name)+'!”');if(got.size===3)api.done()}))}}}

async function demo(p,vis){stopDemo();const my=DEMO.n,ok=await ensureAudio();const vs=[...(p.voices||[]),...(p.seq&&p.seq.v?[p.seq.v]:[])];if(vs.length)await want(vs,2500);if(DEMO.n!==my)return;const b=DEMO.bus=bus(1);if(!b)return;const t0=AC.currentTime+.15,lag=ok?clamp(AC.currentTime-heardTime(),0,.5):0,at=(sec,f)=>DEMO.timers.push(setTimeout(f,Math.max(0,(t0-AC.currentTime+lag+sec)*1000)));

 // with a beat bar on the slide, the first bar is the count-in and the second shows when to start tapping

  if(vb)at(p.metro.beats*spb,()=>{vb.at(null);vb.say('')})}

 if(p.song){const s=SONGS[p.song],spb=60/s.bpm,mel=parseMelody(s.m);let beats=0,cut=mel.findIndex(n=>(beats+=n.d)>=s.sig*4);const part=mel.slice(0,cut<0?mel.length:cut+1).map(n=>(n.rest?'r':PC[n.m%12]+(Math.floor(n.m/12)-1))+'/'+n.d).join(' ');
  notes(part,s.bpm);schedBacking(parseChords(s.c).filter(c=>c.b<s.sig*4),spb,s.sig,t0+(s.pick||0)*0,b,.7)}

  const svg=vis.querySelector('.vrhy svg');if(svg){const r=rhythmSVG(p.rhy.p,{w:340,sig,count:true,showSig:!!vis.querySelector('.vrhy').dataset.ss});const cur=svg.querySelector('.rcur'),ball=svg.querySelector('.rball'),lands=toks.filter(t=>!t.rest).map(t=>({t:t.t}));const start=performance.now()+(t0-AC.currentTime+lag)*1000;

const roundName=r=>r.type==='song'?'🎹 '+T(SONGS[r.song].t):r.type==='drum'?'🥁 '+T(DRUMS[r.pattern].t):r.type==='beat'?'💓 '+L('박자 지키기','Keep the beat'):r.type==='echo'?'👂 '+L('리듬 따라 하기','Copy the rhythm'):'📖 '+L('리듬 읽기','Rhythm reading');

// rivals stay close to the player so every round feels like a real race
function rivalLive(i,frac,live){const off=[-.04,.03,-.07,.05][i%4]+Math.sin(frac*7+i*2)*.035;return clamp(live+off,0,1)}
function contestRound(){const c=CT.c,r=c.rounds[CT.i];RUN={kind:'contest'};const host=playView(`${c.icon} ${T(c.name)} · ${L('라운드','Round')} ${CT.i+1}/${c.rounds.length}`);

 speak(L(`라운드 ${CT.i+1}! ${roundName(r)}`,`Round ${CT.i+1}! ${roundName(r)}`));
 setTimeout(()=>{if(VIEW!=='play'||RUN.kind!=='contest')return;const tier=CONTESTS.indexOf(c)>=3?2:1;
  runActivity({...r,count:r.count||3},host,{contest:true,tier,teacher:r.type==='drum'?'boom':r.type==='song'?'mia':'hop',

   done:res=>{CT.accs.push(res.acc);trackStats(res);roundResult(res)}})},1900)}
function rivalTargets(){// final averages for the rivals, decided by how well the player did
 const c=CT.c,A=CT.accs.reduce((a,b)=>a+b,0)/CT.accs.length*100,[g,s,b]=c.medal,place=A>=g?1:A>=s?2:A>=b?3:4,above=place-1;
 return {A,place,targets:c.rivals.map((_,i)=>i<above?clamp(A+1+i*1.5+Math.random()*2,0,99.5):clamp(A-1.5-(i-above)*2.5-Math.random()*3,15,99))}}
function roundResult(res){stopActivity();const c=CT.c,last=CT.i===c.rounds.length-1,host=$('host');
 // rivals' round scores: neck and neck along the way, landing on their targets in the final round
 const {targets}=rivalTargets();
 c.rivals.forEach((_,i)=>{const prev=CT.riv[i],n=CT.accs.length;let v;if(last){const need=targets[i]*n-prev.reduce((a,b)=>a+b,0);v=clamp(need,20,100)}else v=clamp(res.acc*100+[-3,2,-6][i%3]+(Math.random()*6-3),20,100);prev.push(v)});

  <button class="btn gold cta" id="ctNext" type="button">${last?'🏆 '+L('최종 결과 발표!','Final results!'):L('다음 라운드 ▶','Next round ▶')}</button></div>`;
 setTimeout(()=>host.querySelectorAll('.sbar i').forEach(i=>i.style.width=i.dataset.w+'%'),80);(rows[0].me?SFX.good:SFX.pop)();
 $('ctNext').addEventListener('click',()=>{if(last)ceremony();else{CT.i++;contestRound()}})}
function ceremony(){CT.over=true;const c=CT.c,host=$('host'),n=CT.accs.length,me=CT.accs.reduce((a,b)=>a+b,0)/n*100;
 const all=[{n:S.name,ic:S.av,v:me,me:true},...c.rivals.map((id,i)=>({id,n:T(RIVALS[id].name),ic:RIVALS[id].icon,v:CT.riv[i].reduce((a,b)=>a+b,0)/n}))].sort((a,b)=>b.v-a.v);
 const place=all.findIndex(x=>x.me)+1,medal=place<=3?4-place:0,rec=S.contests[c.id]||{medal:0,best:0,n:0};
 const firstGold=medal===3&&rec.medal<3;S.contests[c.id]={medal:Math.max(rec.medal,medal),best:Math.max(rec.best,me/100),n:rec.n+1};
 const coins=Math.round(c.prize*[.2,.4,.6,1][medal]),st=firstGold?giveSticker(pick(['🏅','👑','💎','🏰']))||giveSticker():null;save();try{LR.save()}catch(e){}
 host.innerHTML=`<div class="ceremony card"><h2>${c.icon} ${L('최종 결과','Final results')}</h2><div class="drumroll">🥁 ${L('두구두구두구…','Drumroll…')}</div>

// tap along with ticks; the average delay becomes the timing correction
function calibrate(){let taps=[],clk=null,t0=0,b=null,spb=60/90,N=12;
 modal(`<h2>⏱️ ${L('박자 맞추기 보정','Timing check')}</h2><p>${L('블루투스 이어폰이나 화면 반응이 느리면 박자가 늦게 판정될 수 있어요. “똑딱” 소리에 맞춰 버튼을 12번 눌러 주세요.','Wireless headphones or slow screens can make taps seem late. Tap the button along with the 12 ticks.')}</p>
  <button type="button" class="bl-pad calpad" id="calPad">👆</button><p class="center" id="calMsg">${L('시작을 누르세요','Press start')}</p>
  <div class="row"><button class="btn green" id="calGo" type="button">▶ ${L('시작','Start')}</button><button class="btn ghost" data-act="zero" type="button">${L('0으로 되돌리기','Reset to 0')}</button></div>`,{acts:{zero:()=>{ROOT.opt.calib=0;save();applyOpts();toast('⏱️ 0ms')}},
  onOpen:box=>{const pad=box.querySelector('#calPad'),msg=box.querySelector('#calMsg');
   box.querySelector('#calGo').addEventListener('click',async()=>{const ok=await ensureAudio();if(!ok){msg.textContent=L('소리를 켤 수 없어요','Sound is not available');return}taps=[];clk=makeClock(true);b=bus(1);t0=startAt(clk,true,.6);for(let i=0;i<N;i++)drum(i%4?'click':'accent',t0+i*spb,.9,b);msg.textContent=L('똑딱에 맞춰 눌러요!','Tap with the ticks!');
    setTimeout(()=>{killBus(b);const offs=taps.map(t=>{const k=Math.round((t-t0)/spb);return k>=2&&k<N?(t-t0)-k*spb:null}).filter(x=>x!=null&&Math.abs(x)<.3).sort((a,c)=>a-c);
     if(offs.length<5){msg.textContent=L('눌린 횟수가 부족해요. 다시 해 봐요!','Not enough taps. Try again!');return}const med=offs[Math.floor(offs.length/2)],ms=clamp(Math.round(med*1000),-200,250);ROOT.opt.calib=ms;save();applyOpts();msg.textContent=L(`보정 완료! ${ms>0?'+':''}${ms}ms`,`Done! ${ms>0?'+':''}${ms} ms`);SFX.good()},600+N*spb*1000+500)});
   pad.addEventListener('pointerdown',e=>{e.preventDefault();if(clk)taps.push(clk(e.timeStamp));pad.classList.remove('hit');void pad.offsetWidth;pad.classList.add('hit')})}})}
