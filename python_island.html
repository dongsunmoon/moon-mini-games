<script>
/* Language: ?lang=ko|en, then the saved choice, then the device language. Shared by every page on this site. */
const LANG=(()=>{let q=null,s=null;try{q=new URLSearchParams(location.search).get('lang')}catch(e){}try{s=localStorage.getItem('moonGames.lang')}catch(e){}const l=q==='ko'||q==='en'?q:s==='ko'||s==='en'?s:/^ko/i.test(navigator.language||'')?'ko':'en';if(q===l){try{localStorage.setItem('moonGames.lang',l)}catch(e){}}document.documentElement.lang=l;return l})();
const L=(ko,en)=>LANG==='en'?en:ko;
/*COACH:BEGIN*/
// Coach Moon, the maker's character, cheers the player on in every game, in two ways:
// · coachLine(kind) puts one line inside result and level-up windows (kinds: up, big, good, try, race).
// · coachPop(pose,ko,en) shows a small bubble in the corner at good moments. It never blocks a tap and
//   waits between appearances, so he never nags. He only praises and encourages.
// Source: _src/coach/coach.js, copied into every game by _src/coach/inject.py.
const coachEsc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const coachNm=()=>{try{return MGP.me&&MGP.me.name||''}catch(e){return ''}};
const coachPick=a=>a[Math.random()*a.length|0];
const coachSay_=t=>{const nm=coachNm(),ok=t.filter(x=>nm||!/\{nm\}/.test(x[0])),x=coachPick(ok.length?ok:t);return L(x[0],x[1]).replace(/\{nm\}/g,coachEsc(nm))};
const COACH={
 up:['clap',[['꾸준히 한 덕분이에요. 정말 멋져요!','Your steady practice paid off. Awesome!'],['어제보다 오늘 더 잘하고 있어요!','You’re doing even better than yesterday!'],['계속 도전해서 여기까지 왔어요!','You kept trying, and look how far you’ve come!'],['{nm}의 노력이 반짝반짝 빛나요 ✨','Your hard work is shining, {nm} ✨'],['문 코치가 박수 쳐요! 짝짝짝 👏','Coach Moon is clapping for you! 👏'],['이 기세 그대로 가 봐요! 🌙','Keep this going! 🌙']]],
 big:['medal',[['정말 대단해요! 이 메달 받아요 🏅','Amazing! This medal is yours 🏅'],['최고예요! 오늘의 주인공이에요 🏅','The best! You’re the star today 🏅'],['{nm}, 문 코치가 정말 자랑스러워요! 🏅','I’m so proud of you, {nm}! 🏅'],['완벽해요! 멋진 실력이에요 🌟','Perfect! What great skills 🌟']]],
 try:['go',[['괜찮아요! 연습하면 다음엔 더 잘할 거예요.','That’s okay! With practice you’ll do even better next time.'],['끝까지 해낸 게 멋져요. 다음에 또 해 봐요!','You finished, and that’s great. Let’s try again next time!'],['틀린 문제에서 제일 많이 배워요. 문 코치가 응원해요 🌙','We learn the most from mistakes. Coach Moon is cheering for you 🌙'],['{nm}, 할 수 있어요! 한 번 더 해 봐요 🌙','You can do it, {nm}! One more try 🌙']]],
 good:['go',[['잘했어요! 조금만 더 연습하면 별 3개예요 ⭐','Nice work! A little more practice and it’s 3 stars ⭐'],['좋아요! 한 번 더 하면 더 잘할 거예요 🌙','Good job! One more go and you’ll do even better 🌙'],['실력이 쑥쑥 자라고 있어요! 문 코치가 응원해요 🌙','Your skills are growing fast! Coach Moon is cheering 🌙'],['{nm}, 점점 더 잘하고 있어요!','You’re getting better and better, {nm}!']]],
 race:['clap',[['응원한 보람이 있어요! 정말 신나요!','Your cheering paid off! So exciting!'],['끝까지 응원한 게 최고예요!','Cheering to the very end was the best!'],['와, 우승이에요! 문 코치도 같이 응원했어요 🎉','A win! Coach Moon was cheering too 🎉']]]};
function coachLine(k){const [pose,ls]=COACH[k];return `<div class="mcoach"><img src="images/coach-moon-${pose}.webp" alt="" width="58" height="70" onerror="this.parentNode.remove()"><p><b>${L('문 코치','Coach Moon')}</b>${coachSay_(ls)}</p></div>`}
let coachAt=0,coachRun=0,coachMiss=0;
// true while a game window (dialog) is open, so the bubble never covers one
const coachBusy=()=>[...document.querySelectorAll('[role="dialog"],[aria-modal="true"]')].some(e=>e.getAttribute('aria-hidden')!=='true'&&e.getClientRects().length&&getComputedStyle(e).visibility!=='hidden');
function coachLater(fn,left=180){if(!coachBusy()){fn();return}if(left>0)setTimeout(()=>coachLater(fn,left-1),1000)}
function coachPop(pose,ko,en,o={}){const now=Date.now();if(!o.force&&now-coachAt<(o.gap||60000))return false;if(!o.force&&coachBusy())return false;coachAt=now;
 let el=document.getElementById('coachPop');if(!el){el=document.createElement('div');el.id='coachPop';el.setAttribute('role','status');document.body.appendChild(el)}
 el.innerHTML=`<img src="images/coach-moon-${pose}.webp" alt="" onerror="this.remove()"><p><b>${L('문 코치','Coach Moon')}</b>${L(ko,en)}</p>`;
 el.classList.remove('show');void el.offsetWidth;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),o.ms||4500);return true}
// call with every final answer: praise runs of right answers, and help after two misses in a row
function coachAnswer(ok){
 if(ok){coachRun++;coachMiss=0;if(![3,5,10,15,20,30].includes(coachRun))return;const n=coachRun,t=coachPick([[`${n}번 연속 성공! 집중력이 대단해요 🌙`,`${n} in a row! Amazing focus 🌙`],[`와, ${n}번 연속이에요! 문 코치가 박수 쳐요 👏`,`Wow, ${n} in a row! Coach Moon is clapping 👏`],[`${n}번 연속! 오늘 머리가 반짝반짝해요 ✨`,`${n} straight! Your brain is sparkling today ✨`]]);coachPop('clap',t[0],t[1],{gap:20000});return}
 coachRun=0;coachMiss++;if(coachMiss!==2)return;const nm=coachEsc(coachNm()),t=coachPick([['괜찮아요! 틀리면서 배우는 거예요. 천천히 다시 봐요 🌙','That’s okay! Mistakes help us learn. Take another look 🌙'],[nm?`${nm}, 할 수 있어요! 문 코치가 응원해요 🌙`:'할 수 있어요! 문 코치가 응원해요 🌙',nm?`You can do it, ${nm}! Coach Moon is cheering 🌙`:'You can do it! Coach Moon is cheering 🌙'],['실수는 배움의 친구예요. 한 번 더 해 봐요!','Mistakes are friends of learning. One more try!']]);coachPop('go',t[0],t[1],{gap:30000})}
// Once a day per game he says hello, a few minutes in he shares a tip, and after 20 minutes he suggests a little rest.
// Each day a game is opened is noted for the main page's praise-stamp board.
function coachStart(hello,tips){const game=(location.pathname.split('/').pop()||'index').replace(/\.html$/,''),k='moonGames.coach'+(MGP.me?'@'+MGP.me.id:''),d=new Date().toLocaleDateString('en-CA');
 const notes=f=>{let st={};try{st=JSON.parse(localStorage.getItem(k)||'{}')||{}}catch(e){}f(st);try{localStorage.setItem(k,JSON.stringify(st))}catch(e){}return st};
 const st=notes(st=>{st.played=(st.played||[]).filter(x=>x!==d).concat(d).slice(-14)}),nm=coachEsc(coachNm());
 // the hello counts as said only once it has really been shown
 if((st.hello||{})[game]!==d)setTimeout(()=>coachLater(()=>setTimeout(()=>{if(coachPop('hi',`${hello[0]} ${nm?`문 코치는 언제나 ${nm} 편이에요 🌙`:'문 코치가 응원해요 🌙'}`,`${hello[1]} ${nm?`Coach Moon is always on your side, ${nm} 🌙`:'Coach Moon is cheering for you 🌙'}`,{force:true,ms:6000}))notes(st=>{(st.hello=st.hello||{})[game]=d})},900)),2500);
 if(tips&&tips.length)setTimeout(()=>{const t=coachPick(tips);coachPop('idea',t[0],t[1],{ms:6000})},4*60000);
 setTimeout(()=>coachLater(()=>coachPop('go','벌써 20분이나 열심히 했어요! 눈이 피곤하면 잠깐 쉬어도 좋아요 🌙','20 minutes of hard work already! Rest your eyes for a bit if they’re tired 🌙',{force:true,ms:7000})),20*60000)}
// Chrome's read-aloud voice can freeze: it says it is speaking, but no sentence ever starts and every later one waits behind it.
// Starting a sentence the instant after cancel() is a common trigger, so a sentence that follows a cancel waits a moment.
// A sentence that has not started after 3 seconds is cancelled and tried once more; if that try is stuck too,
// Coach Moon says once how to get the voice back, instead of the game going quiet with no reason.
(()=>{const ss=window.speechSynthesis;if(!ss||ss.__mgGuard||typeof SpeechSynthesisUtterance!=='function')return;ss.__mgGuard=1;
 const speak0=ss.speak.bind(ss),cancel0=ss.cancel.bind(ss),live=new Set();let gen=0,cutAt=0,told=false;
 ss.cancel=()=>{gen++;if(ss.speaking||ss.pending)cutAt=performance.now();live.clear();cancel0()};
 const send=(u,my,retry)=>{if(my!==gen)return;const watch=!live.size;let started=false;live.add(u);
  u.addEventListener('start',()=>{started=true});['end','error'].forEach(e=>u.addEventListener(e,()=>live.delete(u)));
  try{if(ss.paused)ss.resume()}catch(e){}speak0(u);if(!watch)return;
  setTimeout(()=>{if(started||my!==gen||!live.has(u))return;live.delete(u);cancel0();
   if(!retry){const c=new SpeechSynthesisUtterance(u.text);['lang','voice','rate','pitch','volume'].forEach(k=>{try{c[k]=u[k]}catch(e){}});setTimeout(()=>send(c,my,true),200)}
   else if(!told){told=true;if(typeof coachPop==='function')coachPop('idea','목소리가 잠깐 멈췄어요. 브라우저를 완전히 껐다 켜면 다시 들려요 🌙','The voice got stuck. Close the browser fully and open it again to hear it 🌙',{force:true,ms:8000})}},3000)};
 ss.speak=u=>{const my=gen,wait=cutAt+150-performance.now();if(wait>0)setTimeout(()=>send(u,my,false),wait);else send(u,my,false)}})();
/*COACH:END*/
function applyLang(){if(LANG!=='en')return;document.querySelectorAll('[data-en]').forEach(el=>{el.textContent=el.dataset.en});for(const a of ['aria-label','placeholder','title'])document.querySelectorAll('[data-en-'+a+']').forEach(el=>el.setAttribute(a,el.getAttribute('data-en-'+a)))}
function setLang(next){try{localStorage.setItem('moonGames.lang',next)}catch(e){}try{speechSynthesis.cancel()}catch(e){}const u=new URL(location.href);u.searchParams.set('lang',next);location.replace(u.href)}
</script>
<script>
/* Player profile picked on the main page. Each game keeps its save per profile ("key@profileId"),
   so players never share progress and resetting one game leaves every other game alone. */
const MGP=(()=>{let P=null;try{P=JSON.parse(localStorage.getItem('moonGames.profiles')||'null')}catch(e){}
 const me=P&&Array.isArray(P.list)&&P.list.find(x=>x&&x.id===P.cur)||null;
 if(me){const S=Storage.prototype,g=S.getItem,s=S.setItem,r=S.removeItem,own=/^(little-detective-|marbleRush\.|marble3dsettings|chessKnights\.|scienceGuardians\.|musicAcademy\.|mathAquarium\.|pythonIsland\.)/,k=x=>{x=String(x);return own.test(x)&&!x.includes('@')?x+'@'+me.id:x};
  S.getItem=function(x){return g.call(this,k(x))};S.setItem=function(x,v){return s.call(this,k(x),v)};S.removeItem=function(x){return r.call(this,k(x))}}
 return {me}})();
</script>

.place .dots{display:flex;gap:4px;margin-top:4px}.place .dots i{width:12px;height:12px;border-radius:50%;background:#dde9e6}.place .dots i.d{background:var(--leaf)}.place .dots i.b{background:#ffc53d;box-shadow:0 0 0 2px #fff3c4}

/* ---------------------------------------------------------------- mission screen */
.phead{display:flex;align-items:center;gap:8px;margin-bottom:4px}

.copts{display:grid;gap:8px;margin-bottom:8px}.copt{position:relative;text-align:left;border:3px solid transparent;border-radius:16px;background:var(--codebg);padding:6px 4px 6px 40px;box-shadow:0 3px 0 #dfe8dc}

/* ---------------------------------------------------------------- turtle board */
.tboard{position:relative;margin:2px auto;border-radius:14px;overflow:hidden;box-shadow:0 0 0 3px #e9dfc4}

/* ---------------------------------------------------------------- message board (console) */
.stagebox.text{align-items:stretch}

.tin label{display:flex;flex-direction:column;gap:6px;margin-top:8px;font-weight:800}.tin label span{display:flex;gap:6px}.tin input,.askin{flex:1;min-height:48px;border-radius:12px;border:2px solid #9fd3c8;padding:0 12px;font-size:17px}

.var.changed{animation:pop .5s}.var.changed .vn{background:#ffcf3d}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
.var .bx{min-width:52px;min-height:40px;padding:6px 10px;border-radius:10px;background:linear-gradient(180deg,#ffe1a3,#f8c56a);box-shadow:inset 0 -4px 0 #d9a040;display:grid;place-items:center;font-family:var(--mono);font-weight:800}

.v-str{color:#9a4b00}.v-num{color:#5d2bb8}.v-bool{color:#c2348a}.v-none{color:#888}.v-mini{font-family:var(--mono);font-size:13px}.v-obj{font-weight:800}
.cars{display:flex;align-items:flex-end;gap:3px;flex-wrap:wrap}.engine{font-size:30px;line-height:1}

.fnchip{display:inline-block;padding:6px 10px;border-radius:12px;background:#e6f7f2;font-family:var(--mono);font-weight:800;color:#0b5f5a}

function build(t,world,diff,R){const o=t(R,diff);if(!o)return null;const kind=o.kind||'out';let options,ans;

// ---------------------------------------------------------------- build one request
let SEQ=0;
function build(t,r,diff){const j=t.make(r),who=pk(r,VILLAGERS),lock=(j.start||[]).length;
 const solution=[...(j.start||[]),...j.body].join('\n');
 const m={id:'job-'+t.id+'-'+(++SEQ),job:t.id,place:t.place,stage:t.place,kind:diff>=3?'type':'tiles',who,title:j.title,say:j.say,learn:j.learn,hints:j.hints,
  start:(j.start||[]).join('\n'),lockN:lock,tiles:j.tiles,solution,goal:j.uses?{uses:j.uses}:null,
  cases:(j.cases||[]).map(c=>({start:c.join('\n'),solution:[...c,...j.body].join('\n')})),
  snippets:j.tiles.map(x=>MISSION.fill(x)),reward:3+(t.need>=7?2:t.need>=4?1:0)};
 if(t.place==='kitchen')m.kitchen={};else m.park={ride:t.ride};
 return m}
// does this request really work, and does it really need its idea? (the reference passes every case; a hard-coded answer fails one)
function sound(m){const all=[{start:m.start,solution:m.solution},...m.cases];
 for(let i=0;i<all.length;i++){const c=all[i],mm={...m,id:m.id+'@'+i,solution:c.solution,goal:null},r=MISSION.run(mm,c.solution,{maxTrace:1,vars:false});if(r.err||!MISSION.judge(mm,r).ok)return false}
 if(m.cases.length){const res=all.map(c=>{const r=MISSION.run(m,c.solution,{maxTrace:1,vars:false});return JSON.stringify(r.stage.result())});if(new Set(res).size<2)return false}
 return true}
// pick a request the child can do now, leaning toward what they learned most recently
function make(maxW,diff=1,rng=Math.random,avoid=[]){const ok=T.filter(t=>t.need<=maxW);let pool=ok.filter(t=>!avoid.includes(t.id));if(!pool.length)pool=ok;
 const top=Math.max(...pool.map(t=>t.need));const weighted=pool.flatMap(t=>t.need===top&&top>0?[t,t,t]:[t]);
 for(let k=0;k<20;k++){const m=build(pk(rng,weighted),rng,diff);if(sound(m))return m}
 return build(T[0],rng,diff)}
// judge a child's code for every customer in the request
function judge(m,r,code){const j=MISSION.judge(m,r);if(!j.ok)return j;
 const body=code.split('\n').slice(m.lockN).join('\n');
 for(let i=0;i<m.cases.length;i++){const c=m.cases[i],mm={...m,id:m.id+'#'+i,solution:c.solution,start:c.start},rr=MISSION.run(mm,c.start+'\n'+body,{maxTrace:1,vars:false}),jj=MISSION.judge(mm,rr);
  if(!jj.ok)return {...jj,caseStart:c.start,case:i+1}}
 return {ok:true}}
return {make,judge,build,sound,T,VILLAGERS,COL}})();

 {id:'w3-3',kind:'predict',stage:'text',title:'바뀌는 상자|The box changes',
  say:'물고기를 2마리 잡고, 3마리를 더 잡았어요! 📦 fish 상자 속 수가 바뀌어요. 🔮 실행하기 전에 화면에 무엇이 나올지 골라요.|I caught 2 fish, then 3 more! The number in the 📦 fish box changes. 🔮 Before it runs, pick what the screen will show.',

  options:['2\n5','2\n2','5\n5'],

  hints:['코드는 위에서부터 한 줄씩 해요. 2번째 줄에서 상자에는 몇이 들어 있나요?|Code runs from the top. What’s in the box at line 2?','3번째 줄은 📦 fish 상자 값 3 늘리기예요. 2에 3을 더해요. 4번째 줄은 바뀐 값을 보여 줘요.|Line 3 adds 3 to the 📦 fish box: 2 plus 3. Line 4 shows the new value.']},
 {id:'w3-4',kind:'choose',stage:'text',title:'이름표 규칙|Name tag rules',
  say:'아이스크림 상자에 이름표를 붙여요. 🤔 코드 3개 중에서 오류 없이 아이스크림 수 4를 보여 주는 코드를 골라요. 이름표만 서로 달라요.|Let’s tag the ice cream box. 🤔 Pick the one code of the three that shows the ice cream count, 4, with no error. Only the name tags are different.',
  scene:'🍦📦',
  ask:'오류 없이 아이스크림 수를 보여 주는 코드를 골라요.|Pick the code that shows the ice cream with no error.',
  options:['ice_cream = 4\nprint("아이스크림", ice_cream)','ice cream = 4\nprint("아이스크림", ice cream)','1ice_cream = 4\nprint("아이스크림", 1ice_cream)'],
  solution:'ice_cream = 4\nprint("아이스크림", ice_cream)',
  why:'상자 이름에는 빈칸을 쓸 수 없고, 숫자로 시작할 수도 없어요. 빈칸 대신 `_` 기호를 써요.|Box names can’t have spaces or start with a number. Use `_` in place of a space.',

  hints:['세 코드는 이름표만 달라요. 이름표 글자를 하나씩 비교해 봐요.|The three codes differ only in the name tag. Compare the tags letter by letter.','이름표에 빈칸이 있으면 파이썬은 이름이 두 개인 줄 알아요. 숫자로 시작해도 안 돼요.|If a tag has a space, Python thinks it’s two names. Starting with a number won’t work either.','빈칸 대신 밑줄 `_` 기호를 쓰고, 글자로 시작하는 이름표를 골라요.|Pick the tag that starts with a letter and uses an underscore `_` instead of a space.']},
 {id:'w3-5',kind:'fix',stage:'text',title:'글자와 숫자|Text and numbers',

  scene:'🐱🎂',
  code:'pet = "고양이"\nage = 2\nage = age + 1\nprint(pet + "는 " + age + "살")',bug:4,

  solution:'pet = "고양이"\nage = 2\nage = age + 1\nprint(pet + "는 " + str(age) + "살")',

 {id:'w3-6',kind:'type',stage:'turtle',title:'크기 상자|The size box',

  solution:'from turtle import *\nsize = 100\nforward(size)\nleft(90)\nforward(size)\nleft(90)\nforward(size)\nleft(90)\nforward(size)',
  learn:'상자 하나만 바꿨는데 네 변이 모두 커졌어요. 변수를 쓰면 고치기 쉬워요.|Changing one box made all four sides bigger. Variables make code easy to change.',
  hints:['`forward(size)` 명령은 ✏️ size 상자 속 값만큼 앞으로 그려요. 그 상자는 2번째 줄에 있어요.|`forward(size)` draws forward by the value in the size box. That box is on line 2.','2번째 줄의 50을 지우고 100을 써요. 다른 줄은 그대로 둬요.|On line 2, delete 50 and write 100. Leave the other lines as they are.','2번째 줄을 이렇게 써요: `size = 100`|Write line 2 like this: `size = 100`']},

  hints:['📦 상자 타일(`age = 8` 같은 줄)을 먼저 놓고, 그 아래에 `print` 타일을 놓아요. 상자가 먼저 있어야 해요!|Place the 📦 box tiles (like `age = 8`) first, then the `print` tiles below. The boxes must come first!','`print(f"이름: {name}")` 코드처럼 글자 앞에 `f` 글자가 있으면, `{name}` 자리에 name 상자 값이 쏙 들어가요.|In `print(f"이름: {name}")`, the `f` before the text makes the name box’s value pop into the `{name}` spot.','`input()` 함수는 실행할 때 이름을 물어봐요. 내 이름을 직접 써 넣어요!|`input()` asks for your name when it runs. Type it in!']}

WORLD(4,{icon:'🌀',name:'빙글빙글 풍차|Whirl Windmill',concept:'for 반복|for loops',
 intro:['풍차는 같은 일을 빙글빙글 몇 번이고 해요. 이번에는 반복을 배워요!|The windmill does the same thing round and round. Now let’s learn loops!',
  '`for i in range(3):` 줄은 🔁 3번 반복이에요. 그 아래 들여 쓴 줄들을 3번 해요.|`for i in range(3):` means 🔁 repeat 3 times. The indented lines under it run 3 times.',
  '들여쓰기는 줄 앞을 띄우는 거예요. “이 줄은 반복 안에 있어요”라는 표시예요.|Indenting means leaving space at the front of a line. It’s the sign for “this line is inside the loop.”'],
 demo:'for i in range(3):\n    print("빙글")',
 missions:[
 {id:'w4-1',kind:'watch',stage:'turtle',title:'반복 네모|Loop square',
  say:'반복으로 네모를 그려요. ✏️ 100만큼 앞으로 그리기, ↰ 90도 왼쪽으로 돌기, 이 두 줄을 🔁 4번 반복해요. ▶ 실행해서 봐요!|Let’s draw a square with a loop. ✏️ Draw forward 100, ↰ turn left 90: these two lines 🔁 repeat 4 times. Press ▶ Run and watch!',
  code:'from turtle import *\nfor i in range(<<4>>):\n    forward(100)\n    left(90)',
  notes:{2:'2번째 줄: 🔁 아래 들여 쓴 두 줄을 4번 반복해요.|Line 2: 🔁 Repeats the two indented lines below 4 times.',3:'3번째 줄: ✏️ 100만큼 앞으로 선을 그려요.|Line 3: ✏️ Draws a line forward 100.',4:'4번째 줄: ↰ 왼쪽으로 90도 돌고, 2번째 줄로 돌아가요.|Line 4: ↰ Turns left 90, then goes back to line 2.'},
  solution:'from turtle import *\nfor i in range(4):\n    forward(100)\n    left(90)',
  learn:'`for` 반복을 쓰면 같은 줄을 여러 번 쓰지 않아도 되풀이해요.|With a `for` loop, lines repeat without you writing them again and again.',
  hints:['▶ 실행하고, 선이 몇 개 그려지는지 세어 봐요.|Press ▶ Run and count the lines that get drawn.','들여 쓴 두 줄이 한 묶음으로 4번 반복돼요. 2번째 줄의 4를 눌러 3이나 8로 바꾸면 어떻게 될까요?|The two indented lines repeat together, 4 times. What if you tap the 4 on line 2 and make it 3 or 8?']},
 {id:'w4-2',kind:'blank',stage:'turtle',title:'세모 그리기|Draw a triangle',
  say:'이번엔 세모예요! 🔁 3번 반복하며 ✏️ 120만큼 그리고 ↰ 왼쪽으로 돌아요. ❓ 빈칸을 눌러 몇 도씩 돌지 골라요. 세모가 딱 닫히면 성공!|Now a triangle! 🔁 Repeat 3 times: ✏️ draw 120, then ↰ turn left. Tap the ❓ blank to pick how far each turn is. When the triangle closes, you win!',
  code:'from turtle import *\nfor i in range(3):\n    forward(120)\n    left(<<120|90|60>>)',
  solution:'from turtle import *\nfor i in range(3):\n    forward(120)\n    left(120)',
  learn:'세모는 “앞으로 가고 120도 돌기”를 3번 반복해요. 세 번 돌면 한 바퀴, 360도예요.|A triangle is “go forward, turn 120” repeated 3 times. Three turns make one full turn: 360.',
  hints:['네모는 90도씩 4번 돌아서 한 바퀴(360도)였어요. 세모는 3번 돌아서 한 바퀴예요.|The square turned 90, four times: one full turn, 360. A triangle makes a full turn in 3.','360을 3으로 나누면 얼마일까요? 120, 90, 60을 하나씩 넣고 실행해 봐도 좋아요!|What is 360 divided by 3? You can also try 120, 90 and 60 one by one!','한 번에 120도씩 돌면, 세 번에 360도가 돼요.|Turn 120 each time, and three turns make 360.']},
 {id:'w4-3',kind:'predict',stage:'text',title:'i는 몇일까?|What is i?',
  say:'🔁 3번 반복하면서 반복 상자 `i` 속 숫자를 보여 줘요. 이 상자는 지금 몇 번째인지 세요. 🔮 실행하기 전에 화면에 무엇이 나올지 골라요.|🔁 Repeat 3 times and show the number in the loop box `i`. This box counts which time round it is. 🔮 Before it runs, pick what the screen will show.',
  scene:'🌀🔢',
  code:'for i in range(3):\n    print(i)',
  ask:'화면에 무엇이 나올까요?|What will the screen show?',
  options:['0\n1\n2','1\n2\n3','3\n3\n3'],
  why:'반복 상자 `i` 값은 0부터 세기 시작해요. 그래서 `range(3)` 코드는 0, 1, 2로 3번이에요.|The loop box `i` starts counting at 0. So `range(3)` gives 0, 1, 2: three times.',
  solution:'for i in range(3):\n    print(i)',
  learn:'반복 상자 `i` 값은 0부터 하나씩 커져요. 파이썬은 0부터 세는 걸 좋아해요.|The loop box `i` goes up by one, starting from 0. Python likes to count from 0.',
  hints:['처음 반복할 때 `i` 상자 값은 1이 아니라 0이에요.|The first time round, the box `i` holds 0, not 1.','0부터 시작해서 숫자 3개를 세어 봐요. 0, 1, 그다음은?|Start at 0 and count 3 numbers: 0, 1, and then?']},
 {id:'w4-4',kind:'fix',stage:'grid',title:'들여쓰기 버그|Indent bug',

  learn:'들여쓰기로 반복 안과 밖이 정해져요. 반복이 끝나고 한 번만 할 줄은 들여 쓰지 않아요.|Indenting decides what’s inside or outside the loop. A line that runs once after the loop isn’t indented.',

 {id:'w4-5',kind:'order',stage:'text',title:'양 세기|Counting sheep',

 {id:'w4-6',kind:'tiles',stage:'turtle',title:'반짝반짝 별|Twinkle star',

WORLD(5,{icon:'🔀',name:'갈림길|Crossroads',concept:'if 조건|if decisions',
 intro:['여기는 갈림길이에요! 코드도 길을 골라서 갈 수 있어요.|This is Crossroads! Code can choose which way to go, too.',
  '`if` 줄은 ❓ “만약 ~이면?” 하고 물어요. 답이 참(`True`)일 때만 그 아래 들여 쓴 줄을 해요.|An `if` line asks ❓ “what if…?” Only when the answer is `True` does it run the indented lines under it.',

 demo:'apples = 5\nif apples > 3:\n    print("사과가 많아요! 🍎")',
 missions:[
 {id:'w5-1',kind:'watch',stage:'text',title:'빵집 문 열었나요?|Is the bakery open?',
  say:'빵집은 8시가 지나면 문을 열어요. ▶ 실행해서 봐요. 그다음 1번째 줄의 10을 눌러 7로 바꾸고 다시 실행해요. 어떤 줄이 사라질까요?|The bakery opens after 8 o’clock. Press ▶ Run and watch. Then tap the 10 on line 1, make it 7 and run again. Which line goes away?',
  scene:'🍞🥐🥖',
  code:'hour = <<10>>\nif hour > 8:\n    print("빵집 문 열었어요! 🍞")\nprint("좋은 하루 보내요!")',

   2:'2번째 줄: ❓ 시각이 8보다 커요? 크면 답은 참(`True`)이에요.|Line 2: ❓ Is the hour bigger than 8? If so, the answer is `True`.',
   3:'3번째 줄: 🗨️ 답이 참일 때만 이 들여 쓴 줄을 해요.|Line 3: 🗨️ This indented line runs only when the answer is `True`.',
   4:'4번째 줄: 🗨️ 들여 쓰지 않은 줄은 언제나 해요.|Line 4: 🗨️ A line that isn’t indented always runs.'},

  say:'내 돈이 사탕 값보다 많으면 사탕을 사요. ❓ 빈칸을 눌러 알맞은 비교 기호를 골라서, 화면에 “사탕을 샀어요!”가 나오게 해요.|If my money is more than the price, I buy the candy. Tap the ❓ blank and pick the right compare sign, so the screen says I bought the candy.',

  code:'money = 1000\nprice = 700\nif money <<>|<|==>> price:\n    print("사탕을 샀어요! 🍬")',

  learn:'비교 기호는 질문을 만들어요. `>` 기호는 ‘커요?’, `<` 기호는 ‘작아요?’, `==` 기호는 ‘같아요?’예요.|Compare signs make questions: `>` asks “bigger?”, `<` asks “smaller?”, `==` asks “the same?”',
  hints:['1번째 줄 내 돈은 1000, 2번째 줄 사탕 값은 700이에요. 어느 쪽이 더 커요?|Line 1: my money is 1000. Line 2: the price is 700. Which is bigger?',

 {id:'w5-3',kind:'predict',stage:'text',title:'아니면 else|Or else',
  say:'아이스크림 가게예요. ↪️ `else` 줄은 ‘아니면’이에요. 내 돈은 500원, 아이스크림은 800원! 🔮 실행하기 전에 화면에 무엇이 나올지 골라요.|It’s the ice cream shop. ↪️ `else` means “otherwise”. I have 500 won, and the ice cream costs 800! 🔮 Before it runs, pick what the screen will show.',
  scene:'🍦🍨🐷',
  code:'money = 500\nprice = 800\nif money >= price:\n    print("아이스크림 주세요! 🍦")\nelse:\n    print("돈을 조금 더 모아요 🐷")',
  solution:'money = 500\nprice = 800\nif money >= price:\n    print("아이스크림 주세요! 🍦")\nelse:\n    print("돈을 조금 더 모아요 🐷")',
  ask:'무엇이 나올까요?|What will it print?',
  options:['아이스크림 주세요! 🍦','돈을 조금 더 모아요 🐷','아이스크림 주세요! 🍦\n돈을 조금 더 모아요 🐷'],
  why:'`>=` 기호는 ‘크거나 같아요?’예요. 500은 800보다 작아서 답이 거짓이라 `else` 쪽 줄만 해요.|`>=` asks “bigger or the same?” 500 is smaller than 800, so it’s `False` and only the `else` line runs.',

 {id:'w5-4',kind:'fix',stage:'text',title:'쿠키 나누기|Sharing cookies',

  solution:'cookies = 8\nif cookies % 2 == 0:\n    print("둘이 똑같이 나눠요 🍪")\nelse:\n    print("한 개가 남아요")',

   '`%` 기호는 나누고 남은 수예요. 8을 둘이 나누면 0개 남아요. `== 0` 코드와 끝의 `:` 기호가 다 있는 줄을 골라요.|`%` gives what’s left over. 8 shared by 2 leaves 0. Pick the line with `== 0` and the `:` at the end.']},
 {id:'w5-5',kind:'order',stage:'text',title:'낚시 대회|Fishing contest',
  say:'낚시 대회예요! 물고기 크기에 따라 말이 달라요. ❓ `elif` 줄은 ‘아니고 만약’이에요. 🧩 카드를 위에서부터 순서대로 눌러요.|It’s a fishing contest! What Py says depends on the fish’s size. ❓ `elif` means “or else, if”. 🧩 Tap the cards in order, from the top.',

   '50보다 크면 왕 큰 물고기, 20보다 크면 멋진 물고기, 아니면 아기 물고기예요. 들여 쓴 카드는 각 질문 바로 아래!|Over 50: huge fish. Over 20: great fish. Otherwise: baby fish. Each indented card goes right under its question!']},
 {id:'w5-6',kind:'tiles',stage:'grid',title:'사과 있어?|Any apple here?',

WORLD(6,{icon:'💧',name:'될 때까지 폭포|Until Waterfall',concept:'while 반복|while loops',
 intro:['쏴아아! 여기는 될 때까지 폭포예요. 폭포처럼 계속 흐르는 반복을 배워요.|Splash! This is Until Waterfall. Let’s learn a loop that keeps flowing like a waterfall.',

 missions:[
 {id:'w6-1',kind:'watch',stage:'grid',title:'길 끝까지 쭉|All the way',
  say:'사과가 길 끝에 있어요. 몇 칸인지 세지 않아도 돼요! 🔁 앞이 비어 있는 동안 계속 ➡️ 앞으로 한 칸 가요. ▶ 실행해서 봐요.|The apple is at the end of the path. No need to count the squares! 🔁 While the way ahead is clear, keep going ➡️ one step forward. Press ▶ Run and watch.',
  grid:{map:['#########','#P.....A#','#########'],dir:'E'},
  code:'while front_is_clear():\n    move()\neat()',
  notes:{1:'1번째 줄: 🔁 앞이 비었어? 참이면 아래 줄을 해요.|Line 1: 🔁 Is the way ahead clear? If `True`, do the line below.',
   2:'2번째 줄: ➡️ 한 칸 가고, 1번째 줄로 돌아가 또 물어요.|Line 2: ➡️ Move one step, then go back to line 1 and ask again.',
   3:'3번째 줄: 앞이 막혀서 반복이 끝났어요. 😋 이제 냠!|Line 3: The way is blocked, so the loop is over. 😋 Now, munch!'},
  solution:'while front_is_clear():\n    move()\neat()',
  learn:'`while` 반복은 답이 참(`True`)인 동안 계속 돌아요. 한 번만 묻는 `if` 줄과 달라요.|A `while` loop keeps going while the answer is `True`. That’s different from `if`, which asks only once.',
  hints:['▶ 실행하고 파이가 몇 칸 가는지 세어 봐요. 6칸이에요. 그런데 코드에는 6이 없어요!|Press ▶ Run and count how far Py goes: 6 squares. But there’s no 6 in the code!',
   '👣 한 줄씩 버튼으로 보면, 한 칸 갈 때마다 1번째 줄로 돌아가서 다시 묻는 게 보여요.|Use the 👣 Step button to see Py go back to line 1 and ask again after every square.']},
 {id:'w6-2',kind:'blank',stage:'grid',title:'집에 닿을 때까지|Until home',
  say:'🏠 집이 길 가운데 있어요. 집을 지나치지 말고 딱 멈춰야 해요. ❓ 빈칸을 눌러 알맞은 질문을 골라요. 파이가 집에서 멈추면 성공!|🏠 Home is in the middle of the path. Py must stop right on it, not walk past. Tap the ❓ blank and pick the right question. If Py stops at home, you win!',
  grid:{map:['#########','#P...G..#','#########'],dir:'E'},
  code:'while <<not at_goal()|at_goal()|front_is_clear()>>:\n    move()',
  solution:'while not at_goal():\n    move()',
  learn:'`not` 단어는 답을 거꾸로 바꿔요. `while not at_goal()` 코드는 ‘집이 아닌 동안’ 계속 가요.|`not` flips the answer. `while not at_goal()` keeps going while Py is not home yet.',
  hints:['`at_goal()` 질문은 ‘집에 왔어?’예요. 출발할 때 답은 거짓이라, 이걸 쓰면 한 칸도 안 가요.|`at_goal()` asks “am I home?” At the start it’s `False`, so with it Py doesn’t move at all.',
   '`front_is_clear()` 질문을 쓰면 집을 지나 바위까지 가 버려요.|With `front_is_clear()`, Py walks right past home to the rock.',
   '‘아직 집이 아니야?’를 물으려면 `not` 단어를 앞에 붙여요. 그게 🔁 집에 갈 때까지 계속이에요.|To ask “not home yet?”, put `not` in front. That means 🔁 keep going until home.']},
 {id:'w6-3',kind:'predict',stage:'text',title:'쿠키가 없어질 때까지|Until the cookies are gone',
  say:'파이가 쿠키 3개를 다 먹을 때까지 냠냠해요. 🔁 한 번 돌 때마다 쿠키가 1개씩 줄어요. 🔮 실행하기 전에 화면에 무엇이 나올지 골라요.|Py munches until all 3 cookies are gone. 🔁 Each time round, one cookie goes away. 🔮 Before it runs, pick what the screen will show.',
  scene:'🍪🍪🍪🐍',
  code:'cookies = 3\nwhile cookies > 0:\n    print("냠냠 🍪")\n    cookies = cookies - 1\nprint("다 먹었어요!")',
  solution:'cookies = 3\nwhile cookies > 0:\n    print("냠냠 🍪")\n    cookies = cookies - 1\nprint("다 먹었어요!")',
  ask:'무엇이 나올까요?|What will it print?',
  options:['냠냠 🍪\n냠냠 🍪\n냠냠 🍪\n다 먹었어요!','냠냠 🍪\n다 먹었어요!','냠냠 🍪\n냠냠 🍪\n냠냠 🍪\n냠냠 🍪\n다 먹었어요!'],
  why:'쿠키가 3, 2, 1일 때 한 번씩 먹어요. 0이 되면 `cookies > 0` 질문의 답이 거짓이라 멈춰요.|Py eats when there are 3, 2 and 1 cookies. At 0, `cookies > 0` is `False`, so it stops.',
  learn:'반복할 때마다 상자의 수를 1씩 줄이면, `while` 반복으로 수를 거꾸로 셀 수 있어요.|Take 1 from the box each time, and a `while` loop can count down.',
  hints:['📦 cookies 상자 수를 따라가 봐요. 3 → 2 → 1 → 0이에요. 냠냠은 몇 번일까요?|Follow the 📦 cookies box: 3 → 2 → 1 → 0. How many munches?',
   '0이 되면 `cookies > 0` 질문의 답은 거짓이라 멈추고, 마지막 줄을 한 번 보여 줘요.|At 0, `cookies > 0` is `False`, so the loop stops and the last line shows once.']},
 {id:'w6-4',kind:'fix',stage:'text',title:'끝나지 않는 저금통|The never-ending piggy bank',
  say:'동전을 5개씩 모아 30개가 되면 멈춰야 하는데, 0만 끝없이 나와요! 🐞 ▶ 실행해서 보고, 틀린 줄을 눌러서 고쳐요.|Py saves 5 coins at a time and should stop at 30, but only 0 comes out, forever! 🐞 Press ▶ Run and watch, then tap the wrong line and fix it.',
  scene:'🪙🐷',
  code:'coins = 0\nwhile coins < 30:\n    print(coins)\ncoins = coins + 5\nprint("저금통 가득! 🐷")',bug:4,
  fixes:['    coins = coins + 5','coins = coins + 10','    coins = coins - 5'],
  solution:'coins = 0\nwhile coins < 30:\n    print(coins)\n    coins = coins + 5\nprint("저금통 가득! 🐷")',
  learn:'`while` 반복 안에서 상자의 값이 바뀌어야 언젠가 멈춰요. 안 바뀌면 끝없이 돌아요.|The value in the box must change inside a `while` loop, or the loop never stops.',
  hints:['▶ 실행하면 0만 계속 나와요. 🔁 반복 안에서 📦 coins 상자 값이 바뀌나요?|Press ▶ Run: only 0 comes out, again and again. Does the 📦 coins box change inside the 🔁 loop?',
   '4번째 줄이 들여 써져 있지 않아서 반복 밖에 있어요. 그래서 동전이 안 늘어요.|Line 4 isn’t indented, so it’s outside the loop. That’s why the coins never go up.',
   '4번째 줄을 눌러서, 앞에 빈칸 4칸이 있고 5를 더하는 줄을 골라요.|Tap line 4 and pick the line that has 4 spaces in front and adds 5.']},
 {id:'w6-5',kind:'tiles',stage:'grid',title:'가면서 냠냠|Munch on the way',
  say:'집까지 가면서 사과 3개도 먹어요. 칸은 세지 않아도 돼요! 🧱 🔁 집에 갈 때까지 계속 타일 안에 ➡️ 앞으로 한 칸, 🍎 사과가 있으면 😋 사과 먹기를 넣어요.|Eat 3 apples on the way home. No need to count squares! 🧱 Inside the 🔁 keep going until home tile, put ➡️ one step forward, then 🍎 if there’s an apple, 😋 eat it.',
  grid:{map:['#########','#P.AA.AG#','#FFFFFFF#','#########'],dir:'E'},
  tiles:['while not at_goal():','move()','if apple_here():','eat()','turn_left()'],
  solution:'while not at_goal():\n    move()\n    if apple_here():\n        eat()',
  learn:'`while` 반복 안에 `if` 줄을 넣으면, 길이가 달라도 같은 코드로 살펴보며 갈 수 있어요.|With an `if` inside a `while` loop, the same code checks every square on a path of any length.',
  hints:['맨 위에 🔁 집에 갈 때까지 계속(`while not at_goal():`) 타일을 놓아요.|Start with the 🔁 keep going until home (`while not at_goal():`) tile.',
   '반복 안에서 ➡️ 한 칸 가고, 🍎 사과가 있는지 물어봐요. 있으면 그 안에서 😋 먹어요.|Inside the loop, ➡️ move one step and 🍎 ask if there’s an apple. If so, 😋 eat it inside that.',
   '`while` 타일 → `move()` 타일 → `if apple_here():` 타일 → `eat()` 타일 순서로, 점점 안으로 들여 써요.|`while` → `move()` → `if apple_here():` → `eat()`, each one indented further in.']},
 {id:'w6-6',kind:'order',stage:'grid',title:'꼬불꼬불 미로|Twisty maze',
  say:'미로를 지나 🏠 집에 가요! 🔁 집에 갈 때까지, 👀 앞이 비었으면 ➡️ 한 칸 가고 ↪️ 아니면 ↰ 왼쪽으로 돌아요. 🧩 카드를 순서대로 눌러요. 하나는 남아요.|Get through the maze to 🏠 home! 🔁 Until home: 👀 if the way is clear, ➡️ move one step; ↪️ otherwise, ↰ turn left. 🧩 Tap the cards in order. One is left over.',
  grid:{map:['#######','#G....#','#####.#','#P....#','#######'],dir:'E'},
  solution:'while not at_goal():\n    if front_is_clear():\n        move()\n    else:\n        turn_left()',
  extra:['        turn_right()'],
  learn:'`while` 반복과 `if`, `else` 줄을 함께 쓰면, 파이가 스스로 길을 찾아요!|Put `while` together with `if` and `else`, and Py finds the way by itself!',
  hints:['맨 바깥, 맨 위 카드는 🔁 집에 갈 때까지 계속이에요.|The outside card, at the very top, is 🔁 keep going until home.',
   '반복 안에서 👀 ‘앞이 비었어?’ 하고 물어요. 참이면 ➡️ 가고, ↪️ 아니면 돌아요.|Inside the loop, 👀 ask “is the way clear?” If `True`, ➡️ move. ↪️ Otherwise, turn.',
   '미로가 왼쪽으로 꺾여요. 그래서 ↱ 오른쪽으로 돌기(`turn_right()`) 카드는 쓰지 않아요.|The maze bends to the left, so the ↱ turn right (`turn_right()`) card isn’t needed.']},
 {id:'w6-7',kind:'make',stage:'text',title:'로켓 발사|Rocket launch',
  say:'로켓 발사 카운트다운을 해요! 🎨 📦 n 상자에 시작 숫자를 넣고, 🔁 `while n > 0:` 반복으로 숫자를 하나씩 줄이며 보여 줘요. 끝나면 발사!|Let’s count down to blast-off! 🎨 Put a start number in the 📦 n box, then use a 🔁 `while n > 0:` loop to show each number as it goes down. Then launch!',
  idea:'나만의 로켓 카운트다운을 만들어요! 시작 숫자와 발사 말도 골라요.|Make your own rocket countdown! Pick the start number and the launch words.',
  scene:'🚀🌙✨',
  tiles:['n = <<5>>','while n > 0:','print(n)','n = n - 1','print(<<"우주선 준비 완료!"|"카운트다운 시작!">>)','print(<<"발사! 🚀"|"슝~ 우주로 출발! ✨"|"달나라로 가요! 🌙">>)'],
  goal:{minOut:2,uses:['While']},
  solution:'print("우주선 준비 완료!")\nn = 5\nwhile n > 0:\n    print(n)\n    n = n - 1\nprint("발사! 🚀")',
  learn:'`while` 반복으로 수가 0이 될 때까지 세었어요. 상자 값을 꼭 바꿔 주는 것, 잊지 않았죠!|You counted down to 0 with a `while` loop, and you remembered to change the box each time!',
  hints:['📦 n 상자 타일(`n = 5`)을 놓고, 그 아래에 `while n > 0:` 타일을 놓아요.|Place the 📦 n box tile (`n = 5`), then the `while n > 0:` tile under it.',
   '반복 안에 🗨️ `print(n)` 타일과 📦 `n = n - 1` 타일을 들여 써서 놓아요. 숫자가 하나씩 줄어요.|Inside the loop, indent the 🗨️ `print(n)` tile and the 📦 `n = n - 1` tile. The number goes down by one.',
   '반복이 끝나면, 들여 쓰지 않은 줄로 발사 말을 보여 줘요. ⇤ 버튼으로 내어 써요.|After the loop, show the launch words on a line that isn’t indented. Use ⇤ to move it back out.']}
 ]});
WORLD(7,{icon:'🛠️',name:'발명가 공방|Inventor’s Workshop',concept:'함수 만들기|Making functions',
 intro:['여기는 발명가 공방이에요! 오늘은 나만의 새 명령을 만들어요.|This is the Inventor’s Workshop! Today we make our very own commands.',
  '함수는 레시피 카드예요. `def` 단어로 카드에 할 일을 차례로 적어 둬요.|A function is a recipe card. With `def`, you write the steps on the card.',
  '카드 이름 뒤에 `()` 괄호를 붙여 부르면 적힌 대로 해요. 몇 번이든 부를 수 있어요!|Call the card’s name with `()`, and it does the steps. Call it as often as you like!'],
 demo:'def hello():\n    print("안녕!")\n    print("반가워요! 🐍")\n\nhello()\nhello()',
 missions:[
 {id:'w7-1',kind:'watch',stage:'grid',title:'뒤로 돌아!|Turn around!',
  say:'👀 ▶ 실행을 누르고 봐요. 파이가 `turn_around` 레시피 카드(왼쪽으로 두 번 돌기)를 만들어요. 사과를 먹고 그 카드를 불러 뒤로 돈 다음 🏠 집으로 가요.|👀 Press ▶ Run and watch. Py makes a `turn_around` recipe card (turn left twice). After eating the apple, Py calls the card, turns around and goes 🏠 home.',
  grid:{map:['######','#GP.A#','######'],dir:'E'},
  code:'def turn_around():\n    turn_left()\n    turn_left()\n\nmove()\nmove()\neat()\nturn_around()\nmove()\nmove()\nmove()',
  notes:{1:'📋 `turn_around` 레시피 카드를 만들어요. 적어 두기만 하고 아직 하지 않아요!|📋 Make the `turn_around` recipe card. It’s only written down; nothing happens yet!',
   2:'카드에 적힌 첫 번째 일: ↰ 왼쪽으로 돌기.|Step 1 on the card: ↰ turn left.',
   3:'카드의 두 번째 일: 한 번 더 ↰ 왼쪽! 두 번 돌면 뒤를 봐요.|Step 2 on the card: ↰ left again! Two turns means facing back.',
   5:'여기서부터 진짜로 움직여요. ➡️ 앞으로 한 칸!|Now Py really starts moving. ➡️ One step forward!',
   7:'사과 칸에 왔어요. 😋 사과를 냠냠 먹어요.|Py is on the apple square. 😋 Munch the apple.',
   8:'▶ `turn_around` 카드를 불러요. 파이가 2번, 3번 줄로 가서 카드대로 해요!|▶ Call the `turn_around` card. Py jumps to lines 2 and 3 and does what the card says!',
   9:'이제 집 쪽을 보고 있어요. ➡️ 세 칸 가면 🏠 도착!|Now Py faces home. ➡️ Three steps and 🏠 we’re there!'},
  solution:'def turn_around():\n    turn_left()\n    turn_left()\n\nmove()\nmove()\neat()\nturn_around()\nmove()\nmove()\nmove()',
  learn:'`def` 단어로 레시피 카드(함수)를 만들고, 이름 뒤에 `()` 괄호를 붙여 불러요. 나만의 새 명령이 생겨요!|`def` makes a recipe card (a function), and its name with `()` calls it. You get a brand-new command of your own!',
  hints:['▶ 실행을 누르고 파이 말풍선의 줄 번호를 따라가 봐요.|Press ▶ Run and follow the line numbers in Py’s bubble.',
   '8번 줄 `turn_around()` 코드에서 파이가 2번, 3번 줄로 갔다가 다시 돌아와요.|At line 8, `turn_around()`, Py jumps to lines 2 and 3, then comes back.',
   '👣 한 줄씩 버튼을 누르면 한 줄씩 천천히 볼 수 있어요.|Press 👣 Step to watch one line at a time.']},
 {id:'w7-2',kind:'blank',stage:'turtle',title:'네모 세 개|Three squares',
  say:'❓ 빈칸을 눌러 알맞은 코드를 골라요. `square` 레시피 카드는 네모 하나를 그려요. 🔁 3번 반복 안에서 이 카드를 불러 점선 그림처럼 네모 3개를 그려요.|❓ Tap the blank and pick the right code. The `square` recipe card draws one square. Call it inside the 🔁 repeat-3 loop to draw 3 squares like the dotted picture.',
  code:'from turtle import *\ndef square():\n    for i in range(4):\n        forward(40)\n        left(90)\n\npenup()\nbackward(80)\npendown()\nfor i in range(3):\n    <<square()|forward(40)|circle(20)>>\n    penup()\n    forward(60)\n    pendown()',
  solution:'from turtle import *\ndef square():\n    for i in range(4):\n        forward(40)\n        left(90)\n\npenup()\nbackward(80)\npendown()\nfor i in range(3):\n    square()\n    penup()\n    forward(60)\n    pendown()',
  learn:'함수는 한 번 만들어 두면 이름만 불러서 몇 번이든 다시 써요. 코드도 짧아져요!|Make a function once, then just call its name to use it again and again. Your code gets shorter too!',
  hints:['빈칸에 들어갈 줄은 반복할 때마다 네모 하나를 통째로 그려야 해요.|The line in the blank must draw one whole square each time round.',
   '`forward(40)` 명령은 선 1개, `circle(20)` 명령은 원 1개를 그려요. 네모 1개를 그리는 건 `square()` 명령이에요.|`forward(40)` draws 1 line and `circle(20)` draws 1 circle. The one that draws 1 square is `square()`.',
   '빈칸에서 `square()` 명령을 골라요. 이름 뒤의 `()` 괄호가 카드를 불러요.|Pick `square()` for the blank. The `()` after the name calls the card.']},
 {id:'w7-3',kind:'choose',stage:'grid',title:'가서 먹기 명령|The go-and-eat command',
  say:'🤔 세 코드 중 하나를 골라요. `go_eat` 레시피 카드는 ‘➡️ 앞으로 한 칸 가고 😋 사과 먹기’예요. 사과 3개를 모두 먹는 코드는 하나뿐이에요.|🤔 Pick one of the three codes. The `go_eat` recipe card means “➡️ one step forward, then 😋 eat the apple”. Only one code eats all 3 apples.',
  grid:{map:['######','#PAAA#','######'],dir:'E'},
  ask:'사과 3개를 다 먹는 코드는 어느 것일까요?|Which code eats all 3 apples?',
  options:['def go_eat():\n    move()\n    eat()\n\ngo_eat()\ngo_eat()\ngo_eat()',
   'go_eat()\ngo_eat()\ngo_eat()\n\ndef go_eat():\n    move()\n    eat()',
   'def go_eat():\n    move()\n    eat()\n\ngo_eat\ngo_eat\ngo_eat'],
  solution:'def go_eat():\n    move()\n    eat()\n\ngo_eat()\ngo_eat()\ngo_eat()',
  why:'카드는 먼저 만들어야 부를 수 있어요. 컴퓨터는 위에서부터 읽거든요. 그리고 부를 때는 이름 뒤에 `()` 괄호를 꼭 붙여요.|The card must be made before you call it, because the computer reads from the top. And always add `()` after the name to call it.',
  learn:'함수는 먼저 `def` 단어로 만들고, 그다음에 이름 뒤에 `()` 괄호를 붙여 불러요.|First make a function with `def`, then call it with `()` after its name.',
  hints:['두 가지를 봐요. 카드를 만드는 `def` 줄이 맨 위에 있나요? 부를 때 괄호가 있나요?|Check two things: is the `def` line that makes the card at the top? Are there brackets when calling?',
   '컴퓨터는 위에서부터 한 줄씩 읽어요. 아직 안 만든 카드를 부르면 오류가 나요.|The computer reads one line at a time from the top. Calling a card that isn’t made yet is an error.',
   '`go_eat` 이름만 쓰면 부르는 게 아니에요. `go_eat()` 모양처럼 괄호가 있는 코드를 골라요.|Just `go_eat` doesn’t call it. Pick the code with brackets, like `go_eat()`.']},
 {id:'w7-4',kind:'order',stage:'turtle',title:'크기를 고르는 네모|Squares of any size',
  say:'🧩 카드를 위에서부터 순서대로 눌러요. `square(size)` 레시피 카드에는 `size` 재료 칸이 있어요. `square(40)` 코드는 작은 네모, `square(80)` 코드는 큰 네모를 그려요.|🧩 Tap the cards in order, from the top. The `square(size)` recipe card has an ingredient slot, `size`. `square(40)` draws a small square and `square(80)` a big one.',
  solution:'from turtle import *\ndef square(size):\n    for i in range(4):\n        forward(size)\n        left(90)\nsquare(40)\nsquare(80)',
  extra:['        forward(40)'],
  learn:'`size` 같은 재료 칸을 매개변수라고 해요. 부를 때마다 다른 숫자를 넣을 수 있어요.|An ingredient slot like `size` is called a parameter. You can pass a different number each time you call.',
  hints:['레시피 카드를 만드는 `def` 줄을 맨 먼저 놓고, 카드를 부르는 두 줄은 맨 아래에 놓아요.|Put the `def` line that makes the card first, and the two lines that call it at the bottom.',
   '카드 안에는 🔁 4번 반복이 있고, 그 안에 ✏️ 앞으로 그리기와 ↰ 90도 왼쪽으로 돌기가 있어요.|Inside the card is 🔁 repeat 4 times, and inside that, ✏️ draw forward and ↰ turn left 90°.',
   '크기가 바뀌어야 하니까 `forward(40)` 카드 말고 `forward(size)` 카드를 써요.|The size must change, so use `forward(size)`, not `forward(40)`.']},
 {id:'w7-5',kind:'fix',stage:'text',title:'응원 단장 파이|Cheerleader Py',
  say:'🐞 ▶ 실행해서 틀린 줄을 찾고 눌러서 고쳐요. 게시판에 ‘파이, 힘내! 💪’와 ‘토끼, 힘내! 💪’가 나오면 성공이에요. 지금은 토끼를 부를 때 오류가 나요!|🐞 Press ▶ Run, find the wrong line and tap it to fix it. Success is "파이, 힘내! 💪" and "토끼, 힘내! 💪" on the board. Right now, cheering for Bunny gives an error!',
  scene:'📣🐍🐰',
  code:'def cheer(name):\n    print(name + ", 힘내! 💪")\n\ncheer("파이")\ncheer()',bug:5,
  fixes:['cheer("토끼")','cheer(토끼)','cheer'],
  solution:'def cheer(name):\n    print(name + ", 힘내! 💪")\n\ncheer("파이")\ncheer("토끼")',
  learn:'재료 칸이 있는 함수를 부를 때는 괄호 안에 재료를 꼭 넣어요.|When a function has an ingredient slot, always put a value in the brackets when you call it.',
  hints:['▶ 실행하고 🐞 표시가 붙은 줄과 오류 설명을 봐요. 무엇이 빠졌다고 하나요?|Press ▶ Run and look at the line marked 🐞 and the error message. What does it say is missing?',
   '5번 줄 `cheer()` 코드의 괄호가 비어 있어요. `name` 재료 칸에 넣을 이름이 없어요.|On line 5, the brackets in `cheer()` are empty. There’s no name for the `name` slot.',
   '글자는 따옴표로 감싸요. 5번 줄을 `cheer("토끼")` 코드로 바꿔요.|Text goes in quotes. Change line 5 to `cheer("토끼")`.']},
 {id:'w7-6',kind:'type',stage:'text',title:'버거 계산기|Burger calculator',
  say:'⌨️ `price` 카드는 버거 값을 계산해 ↩️ 돌려줘요. 버거 1개는 500원이에요. 2번 줄 `return` 뒤에 계산을 직접 써서 게시판에 1000과 1500이 나오게 해요.|⌨️ The `price` card works out the burger cost and ↩️ gives it back. One burger is 500 won. Type the calculation after `return` on line 2 so the board shows 1000 and 1500.',
  scene:'🍔🍔💰',
  start:'def price(count):\n    return \n\nprint(price(2))\nprint(price(3))',
  snippets:['count','* 500'],
  solution:'def price(count):\n    return count * 500\n\nprint(price(2))\nprint(price(3))',
  learn:'`return` 단어는 함수가 계산한 값을 돌려줘요. 돌려받은 값은 `print` 명령으로 보여 줄 수 있어요.|`return` gives back the value a function worked out. You can show it with `print`.',
  hints:['`count` 재료 칸에는 버거 개수가 들어 있어요. `price(2)` 코드라면 2개예요.|The `count` slot holds how many burgers. For `price(2)`, it’s 2.',
   '버거 값은 개수 × 500이에요. 파이썬에서 곱하기는 `*` 기호예요. 아래 버튼을 눌러도 돼요.|The cost is count × 500. In Python, times is `*`. You can tap the buttons below.',
   '2번 줄을 `return count * 500` 코드로 만들어요.|Make line 2 `return count * 500`.']},
 {id:'w7-7',kind:'make',stage:'turtle',title:'나만의 꽃밭|My flower garden',
  say:'🎨 내 맘대로 만들어요! 먼저 `def flower():` 레시피 카드에 꽃 한 송이 그리는 법을 적어요. 그다음 `flower()` 명령을 여러 번 불러 꽃밭을 꾸며요.|🎨 Make your own! First, write how to draw one flower on a `def flower():` recipe card. Then call `flower()` many times to fill a garden.',
  idea:'`def` 카드로 나만의 그림을 그려요. 꽃, 집, 나무… 무엇이든 좋아요!|Draw your own picture with a `def` card. Flowers, a house, trees… anything!',
  tiles:['def flower():','for i in range(<<6>>):','circle(<<20>>)','left(<<60>>)','right(<<90>>)','forward(<<120>>)','backward(<<90>>)','dot(<<15>>)','color(<<"pink"|"green"|"red"|"orange"|"purple"|"yellow">>)','penup()','pendown()','flower()'],
  goal:{minSegs:10,uses:['Def']},
  solution:'from turtle import *\ndef flower():\n    color("green")\n    right(90)\n    forward(90)\n    backward(90)\n    left(90)\n    color("pink")\n    for i in range(6):\n        circle(20)\n        left(60)\n    color("yellow")\n    dot(15)\n\npenup()\nbackward(240)\npendown()\nfor i in range(3):\n    penup()\n    forward(120)\n    pendown()\n    flower()',
  learn:'내가 만든 함수로 그림을 그렸어요. 이름이 있는 카드라서 코드를 읽기도 쉬워요!|You drew a picture with your own function. A named card makes the code easy to read, too!',
  hints:['`def flower():` 타일을 먼저 놓고, 아래 줄들을 ⇥ 버튼으로 들여 써요. 들여 쓴 줄이 카드에 적힌 일이에요.|Place `def flower():` first and indent the lines under it with ⇥. The indented lines are the card’s steps.',
   '🔁 6번 반복 안에 `circle(20)` 줄과 `left(60)` 줄을 넣으면 꽃잎 6장이 빙 둘러 피어요.|Put `circle(20)` and `left(60)` inside 🔁 repeat 6, and 6 petals bloom all around.',
   '카드 밖(들여 쓰지 않은 줄)에서 ✋ 펜 들기, `forward(120)` 줄로 옆으로 가기, ✍️ 펜 내리기, `flower()` 순서로 또 불러요.|Outside the card (not indented): ✋ pen up, move over with `forward(120)`, ✍️ pen down, then call `flower()` again.']}
 ]});
WORLD(8,{icon:'🚂',name:'리스트 기차역|List Train Station',concept:'리스트|Lists',
 intro:['칙칙폭폭! 여기는 리스트 기차역이에요. 리스트는 여러 값을 줄줄이 싣는 기차예요.|Choo choo! This is List Train Station. A list is a train that carries many values in a row.',
  '`[ ]` 대괄호 안에 값을 쉼표로 나눠 넣으면, 한 칸에 하나씩 타요.|Put values inside `[ ]`, split by commas, and each one rides in its own car.',
  '칸 번호는 0부터 세요. 맨 앞 칸이 0번, 그다음 칸이 1번이에요!|Car numbers start at 0. The first car is car 0, the next is car 1!'],
 demo:'fruits = ["🍎", "🍌", "🍇"]\nprint(fruits)\nprint(fruits[0])',
 missions:[
 {id:'w8-1',kind:'watch',stage:'text',title:'과일 기차 출발!|Fruit train, go!',scene:'🚂🍎🍌🍇',
  say:'👀 ▶ 실행을 누르고 봐요. `fruits` 기차에 🍎🍌🍇가 타요. 0번 칸 꺼내기, 맨 끝 칸 꺼내기, 칸 수 세기를 차례로 해요. 📦 메모리 칸의 기차도 봐요.|👀 Press ▶ Run and watch. 🍎🍌🍇 board the `fruits` train. Py takes out car 0, takes out the last car, then counts the cars. Watch the train in 📦 Memory too.',
  code:'fruits = ["🍎", "🍌", "🍇"]\nprint(fruits)\nprint(fruits[0])\nprint(fruits[-1])\nprint(len(fruits))',
  notes:{1:'`fruits` 기차에 과일 3개가 한 칸에 하나씩 타요. 칸 번호는 0, 1, 2예요.|Three fruits board the `fruits` train, one per car. Car numbers: 0, 1, 2.',
   2:'기차 전체를 그대로 게시판에 보여 줘요.|Show the whole train on the board.',
   3:'`fruits[0]` 코드는 0번 칸, 맨 앞 칸의 🍎를 꺼내요.|`fruits[0]` takes out car 0, the first car: 🍎.',
   4:'`fruits[-1]` 코드는 맨 끝 칸의 🍇를 꺼내요. -1은 뒤에서 첫 번째!|`fruits[-1]` takes out the last car: 🍇. -1 means first from the back!',
   5:'`len(fruits)` 코드는 칸이 모두 몇 개인지 세요. 3칸!|`len(fruits)` counts all the cars: 3!'},
  solution:'fruits = ["🍎", "🍌", "🍇"]\nprint(fruits)\nprint(fruits[0])\nprint(fruits[-1])\nprint(len(fruits))',
  learn:'리스트는 여러 값을 한 줄로 싣는 기차예요. 칸 번호는 0부터 세요.|A list is a train carrying many values in a row. Car numbers start at 0.',
  hints:['▶ 실행하고 게시판에 나온 줄을 코드 줄과 하나씩 맞춰 봐요.|Press ▶ Run and match each line on the board to a line of code.',
   '📦 메모리 칸의 기차에서 칸 아래 번호 0, 1, 2를 찾아봐요. 🍎가 0번이에요.|In 📦 Memory, find the numbers 0, 1, 2 under the cars. 🍎 is car 0.']},
 {id:'w8-2',kind:'blank',stage:'text',title:'몇 번 칸일까?|Which car?',scene:'🚂🍎🍌🍇🍓',
  say:'❓ 빈칸 2개를 눌러 칸 번호를 골라요. 게시판 첫 줄에 🍌, 둘째 줄에 🍓가 나오면 성공이에요. 맨 앞 🍎가 0번 칸이에요!|❓ Tap the 2 blanks and pick car numbers. Success is 🍌 on line 1 of the board and 🍓 on line 2. The first car, 🍎, is car 0!',
  code:'fruits = ["🍎", "🍌", "🍇", "🍓"]\nprint(fruits[<<1|2|0>>])\nprint(fruits[<<3|4|2>>])',
  solution:'fruits = ["🍎", "🍌", "🍇", "🍓"]\nprint(fruits[1])\nprint(fruits[3])',
  learn:'`fruits[1]` 코드처럼 대괄호 안에 칸 번호를 쓰면 그 칸의 값을 꺼내요.|Write a car number in brackets, like `fruits[1]`, to take out that car’s value.',
  hints:['맨 앞 칸부터 손가락으로 0, 1, 2, 3 하고 세어 봐요.|Count with your finger from the first car: 0, 1, 2, 3.',
   '🍌 바나나는 두 번째 칸이라서 1번, 🍓 딸기는 네 번째 칸이라서 3번이에요.|🍌 is the second car, so car 1. 🍓 is the fourth car, so car 3.']},
 {id:'w8-3',kind:'predict',stage:'text',title:'칸마다 들르기|Visit every car',scene:'🚂🍎🍌🍇',
  say:'🔮 실행하기 전에 게시판에 무엇이 나올지 골라요. `for fruit in fruits:` 반복은 기차 칸을 앞에서부터 하나씩 꺼내 `fruit` 상자에 넣어요.|🔮 Before running, pick what the board will show. The loop `for fruit in fruits:` takes each car from the front and puts it in the `fruit` box.',
  code:'fruits = ["🍎", "🍌", "🍇"]\nfor fruit in fruits:\n    print(fruit, "냠냠!")',
  ask:'게시판에 무엇이 나올까요?|What will the board show?',
  options:['🍎 냠냠!\n🍌 냠냠!\n🍇 냠냠!','fruit 냠냠!\nfruit 냠냠!\nfruit 냠냠!',"['🍎', '🍌', '🍇'] 냠냠!"],
  why:'반복할 때마다 `fruit` 상자에 칸 하나의 값이 담겨요. 🍎, 🍌, 🍇 순서로 하나씩 냠냠!|Each time round, the `fruit` box holds one car’s value: 🍎, then 🍌, then 🍇. Yum, one at a time!',
  solution:'fruits = ["🍎", "🍌", "🍇"]\nfor fruit in fruits:\n    print(fruit, "냠냠!")',
  learn:'`for fruit in fruits:` 코드는 기차의 모든 칸을 앞에서부터 하나씩 들러요.|`for fruit in fruits:` visits every car of the train, one by one from the front.',
  hints:['기차가 3칸이니 반복도 3번 돌아요. 한 바퀴마다 `fruit` 상자에 무엇이 들었을지 생각해 봐요.|3 cars means 3 times round. Think about what’s in the `fruit` box each time.',
   '`fruit` 상자에는 기차 전체가 아니라 칸 하나의 값이 들어가요. 처음엔 🍎, 다음엔 🍌예요.|The `fruit` box holds one car’s value, not the whole train. First 🍎, then 🍌.']},
 {id:'w8-4',kind:'fix',stage:'text',title:'딸기로 바꿔요|Swap in a strawberry',scene:'🍌🔄🍓',
  say:'🐞 ▶ 실행해서 틀린 줄을 찾고 눌러서 고쳐요. 🍌 바나나 칸만 🍓 딸기로 바꿔서 🍎🍓🍇가 되면 성공이에요. 지금은 🍇 포도가 바뀌어요!|🐞 Press ▶ Run, find the wrong line and tap it to fix it. Swap only the 🍌 car for 🍓, so the train is 🍎🍓🍇. Right now the 🍇 changes instead!',
  code:'fruits = ["🍎", "🍌", "🍇"]\nfruits[2] = "🍓"\nprint(fruits)',bug:2,
  fixes:['fruits[1] = "🍓"','fruits[3] = "🍓"','fruits[0] = "🍓"'],
  solution:'fruits = ["🍎", "🍌", "🍇"]\nfruits[1] = "🍓"\nprint(fruits)',
  learn:'`fruits[1] = "🍓"` 코드처럼 쓰면 그 칸에 새 값이 타요. 칸 번호는 0부터!|Writing `fruits[1] = "🍓"` puts a new value in that car. Count from 0!',
  hints:['▶ 실행하고 📦 메모리 칸의 기차에서 어느 칸이 바뀌는지 봐요.|Press ▶ Run and see which car changes in 📦 Memory.',
   '2번 줄의 칸 번호를 봐요. 🍌는 두 번째 칸이에요. 0부터 세면 몇 번일까요?|Look at the car number on line 2. 🍌 is the second car. Counting from 0, what number is it?',
   '2번 줄을 `fruits[1] = "🍓"` 코드로 바꿔요.|Change line 2 to `fruits[1] = "🍓"`.']},
 {id:'w8-5',kind:'order',stage:'text',title:'동물 기차 타기|All aboard, animals',scene:'🚂🐶🐱🐰',
  say:'🧩 카드를 위에서부터 순서대로 눌러요. 🐶 한 칸짜리 `train` 기차 끝에 `append` 메서드로 🐱, 🐰를 차례로 붙여요. 마지막에 기차와 칸 수 3을 보여 줘요.|🧩 Tap the cards in order, from the top. The `train` starts with one car, 🐶. Use `append` to add 🐱, then 🐰, to the end. Last, show the train and its 3 cars.',
  solution:'train = ["🐶"]\ntrain.append("🐱")\ntrain.append("🐰")\nprint(train)\nprint("기차 칸 수:", len(train))',
  extra:['train.push("🐰")'],
  learn:'`append` 메서드는 리스트 맨 끝에 새 칸을 붙여요. 점 뒤에 쓰는 이런 명령을 메서드라고 해요.|`append` adds a new car to the end of a list. A command written after a dot like this is called a method.',
  hints:['기차를 만드는 `train = ["🐶"]` 줄이 맨 먼저예요. 기차가 있어야 칸을 붙여요.|The line that makes the train, `train = ["🐶"]`, comes first. You need a train before you add cars.',
   '🚂 🐱 붙이기, 그다음 🚂 🐰 붙이기예요. 🗨️ 보여 주는 두 줄은 맨 끝에 놓아요.|Add 🐱, then add 🐰. The two 🗨️ show lines go last.',
   '파이썬 리스트에는 `push` 기능이 없어요. 칸을 붙일 때는 `append` 메서드예요.|Python lists have no `push`. To add a car, use `append`.']},
 {id:'w8-6',kind:'tiles',stage:'turtle',title:'무지개 네모|Rainbow square',
  say:'🧱 타일을 눌러 코드를 만들어요. `colors` 색깔 기차를 만들고 `for c in colors:` 반복으로 색을 하나씩 꺼내요. 칸마다 그 색으로 변을 하나씩 그려 4색 네모를 완성해요.|🧱 Tap tiles to build the code. Make the `colors` train, then use `for c in colors:` to take each colour. For each car, draw one side in that colour to finish a 4-colour square.',
  start:'from turtle import *\npensize(5)',
  tiles:['colors = ["red", "yellow", "green", <<"blue"|"purple">>]','for c in colors:','color(c)','forward(<<100>>)','left(<<90>>)'],
  solution:'from turtle import *\npensize(5)\ncolors = ["red", "yellow", "green", "blue"]\nfor c in colors:\n    color(c)\n    forward(100)\n    left(90)',
