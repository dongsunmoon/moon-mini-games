 missions:[
 {id:'w10-1',kind:'watch',stage:'text',title:'내 스티커 주머니|My sticker pouch',scene:'🫧🐶🐱🐰',
  say:'👀 ▶ 실행을 누르고 봐요. `stickers` 주머니에 🐶🐱가 있어요. `add` 메서드로 🐰와 🐶를 넣어요. 같은 🐶가 또 들어가는지 📦 메모리 칸을 잘 봐요.|👀 Press ▶ Run and watch. The `stickers` pouch has 🐶🐱. Py uses `add` to put in 🐰, then 🐶. Watch 📦 Memory: does a second 🐶 go in?',
  code:'stickers = {"🐶", "🐱"}\nstickers.add("🐰")\nstickers.add("🐶")\nprint(len(stickers))\nprint("🐶" in stickers)',
  notes:{1:'`{ }` 중괄호에 스티커를 넣으면 세트 주머니가 돼요. 지금은 2장!|Stickers inside `{ }` make a set pouch. 2 stickers now!',
   2:'🫧 `add` 메서드로 새 스티커 🐰를 넣어요. 이제 3장!|🫧 `add` puts in a new sticker, 🐰. Now there are 3!',
   3:'🐶는 벌써 있어요! 같은 스티커는 하나만 넣어서 그대로 3장이에요.|🐶 is already there! Only one of each, so it stays at 3.',
   4:'`len(stickers)` 코드로 주머니 속 스티커 수를 세요. 3이 나와요.|`len(stickers)` counts the stickers in the pouch: 3.',
   5:'`in` 단어로 "🐶 있어요?" 하고 물어요. 있으니까 `True` 값이 나와요.|`in` asks, “Is 🐶 in there?” It is, so the answer is `True`.'},
  solution:'stickers = {"🐶", "🐱"}\nstickers.add("🐰")\nstickers.add("🐶")\nprint(len(stickers))\nprint("🐶" in stickers)',
  learn:'세트는 같은 스티커는 하나만 넣는 주머니예요. `in` 단어로 있는지 물어볼 수 있어요.|A set is a pouch that keeps only one of each sticker. Use `in` to ask if something is there.',
  hints:['▶ 실행하고 게시판의 3과 `True` 값이 어느 줄에서 나왔는지 봐요.|Press ▶ Run and see which lines printed 3 and `True`.',
   '3번 줄에서 📦 메모리 칸의 주머니 스티커가 늘어나는지 잘 봐요.|On line 3, watch whether the pouch in 📦 Memory gets more stickers.']},
 {id:'w10-2',kind:'blank',stage:'text',title:'네 장 만들기|Make it four',scene:'🫧🐶🐱🐰➕',
  say:'❓ 빈칸을 눌러 넣을 스티커를 골라요. 주머니에는 🐶🐱🐰 3장이 있어요. 하나를 넣은 뒤 게시판에 4가 나오면 성공이에요.|❓ Tap the blank and pick a sticker to add. The pouch has 3: 🐶🐱🐰. Success is when the board shows 4 after adding one.',
  code:'stickers = {"🐶", "🐱", "🐰"}\nstickers.add(<<"🦊"|"🐶"|"🐱">>)\nprint(len(stickers))',
  solution:'stickers = {"🐶", "🐱", "🐰"}\nstickers.add("🦊")\nprint(len(stickers))',
  learn:'세트 주머니는 새 스티커가 들어갈 때만 늘어나요. 이미 있는 스티커는 그대로예요.|A set pouch only grows when a new sticker goes in. One it already has changes nothing.',
  hints:['주머니에 벌써 있는 스티커를 먼저 봐요. 같은 스티커는 또 들어가지 않아요.|First look at the stickers already in the pouch. A sticker it has won’t go in again.',
   '🐶나 🐱를 넣으면 그대로 3장이에요. 주머니에 없는 새 스티커를 골라요.|Adding 🐶 or 🐱 keeps it at 3. Pick a sticker the pouch doesn’t have yet.']},
 {id:'w10-3',kind:'predict',stage:'text',title:'손님 세기|Count the visitors',scene:'🐶🐱🐶🐰🐶',
  say:'🔮 실행하기 전에 게시판에 무엇이 나올지 골라요. `visitors` 손님 기차에는 5칸이 있어요. `set()` 함수로 주머니에 쏟으면 같은 손님은 하나만 남아요.|🔮 Before running, pick what the board will show. The `visitors` train has 5 cars. Pour it into a pouch with `set()`, and each visitor stays only once.',
  code:'visitors = ["🐶", "🐱", "🐶", "🐰", "🐶"]\npouch = set(visitors)\nprint(len(visitors))\nprint(len(pouch))',
  ask:'게시판에 무엇이 나올까요?|What will the board show?',
  options:['5\n3','5\n5','3\n5'],
  why:'기차에는 5칸이 다 있어요. 주머니에는 🐶, 🐱, 🐰 세 장만 남아요.|The train keeps all 5 cars. Only three stickers stay in the pouch: 🐶, 🐱, 🐰.',
  solution:'visitors = ["🐶", "🐱", "🐶", "🐰", "🐶"]\npouch = set(visitors)\nprint(len(visitors))\nprint(len(pouch))',
  learn:'`set()` 함수로 리스트를 세트로 바꾸면 겹친 값이 사라져요. 서로 다른 것이 몇 개인지 셀 때 좋아요.|Turning a list into a set with `set()` removes repeats. Great for counting how many different things.',
  hints:['첫 줄은 기차 칸 수, 둘째 줄은 주머니 스티커 수예요. 기차는 겹쳐도 칸마다 다 실어요.|Line 1 is the train’s car count; line 2 is the pouch’s sticker count. A train keeps every car, even repeats.',
   '주머니에는 같은 동물이 한 번만 들어가요. 🐶, 🐱, 🐰… 서로 다른 동물은 몇 마리일까요?|Each animal goes in the pouch only once. 🐶, 🐱, 🐰… how many different animals?']},
 {id:'w10-4',kind:'fix',stage:'text',title:'칸 번호는 없어요|No car numbers',scene:'🫧🐶🐱🐰',
  say:'🐞 ▶ 실행해서 틀린 줄을 찾고 눌러서 고쳐요. 주머니에 🐶가 있으면 ‘🐶 스티커 있어요!’가 나와야 해요. 세트에는 칸 번호가 없어서 오류가 나요!|🐞 Press ▶ Run, find the wrong line and tap it to fix it. If 🐶 is in the pouch, the board should say "🐶 스티커 있어요!". A set has no car numbers, so there’s an error!',
  code:'stickers = {"🐶", "🐱", "🐰"}\nif stickers[0] == "🐶":\n    print("🐶 스티커 있어요!")',bug:2,
  fixes:['if "🐶" in stickers:','if stickers[1] == "🐶":','if "🐶" == stickers:'],
  solution:'stickers = {"🐶", "🐱", "🐰"}\nif "🐶" in stickers:\n    print("🐶 스티커 있어요!")',
  learn:'세트는 섞인 주머니라서 `[0]` 같은 칸 번호가 없어요. 있는지 볼 때는 `in` 단어로 물어봐요.|A set is a mixed-up pouch, so there are no car numbers like `[0]`. To check, ask with `in`.',
  hints:['▶ 실행하고 🐞 표시가 붙은 줄을 봐요. `[0]` 같은 칸 번호를 쓴 곳이 있나요?|Press ▶ Run and look at the line marked 🐞. Does it use a car number like `[0]`?',
   '첫 미션에서 `in` 단어로 "🐶 있어요?" 하고 물었던 걸 떠올려 봐요.|Remember how the first mission asked “Is 🐶 in there?” with `in`.',
   '2번 줄을 `if "🐶" in stickers:` 코드로 바꿔요.|Change line 2 to `if "🐶" in stickers:`.']},
 {id:'w10-5',kind:'order',stage:'text',title:'주머니 합치기|Pool our pouches',scene:'🫧➕🫧',
  say:'🧩 카드를 위에서부터 순서대로 눌러요. 내 주머니와 친구 주머니를 세로 막대 기호로 합쳐 `together` 주머니를 만들어요. 게시판에 ‘합치면: 4’와 `True` 값이 나오면 성공!|🧩 Tap the cards in order, from the top. Join my pouch and my friend’s with the bar symbol into a `together` pouch. Success is "합치면: 4" and `True` on the board.',
  solution:'mine = {"🐶", "🐱", "🐰"}\nfriend = {"🐱", "🦊"}\ntogether = mine | friend\nprint("합치면:", len(together))\nprint("🦊" in together)',
  extra:['together = mine + friend'],
  learn:'세로 막대 기호로 두 세트를 합치면, 겹친 스티커는 한 장만 남아요.|When two sets are joined with the bar symbol, a shared sticker is kept only once.',
  hints:['`mine` 주머니와 `friend` 주머니를 먼저 만들어야 합칠 수 있어요.|Make the `mine` pouch and the `friend` pouch before you join them.',
   '세트는 `+` 기호로 더하지 않아요. 세로 막대 기호가 있는 카드를 써요.|Sets don’t join with `+`. Use the card with the bar symbol.',
   '합치는 줄 다음에 🗨️ 보여 주는 두 줄을 놓아요. 🐱는 둘 다 있어서 한 장만 남으니 4장이에요.|After the join line come the two 🗨️ show lines. We both have 🐱, so it’s kept once: 4 in all.']},
 {id:'w10-6',kind:'tiles',stage:'text',title:'친구와 비교|Compare with a friend',scene:'🐶🐱🐰🆚🐱🦊🐶',
  say:'🧱 타일을 눌러 코드를 만들어요. `&` 기호는 둘 다 가진 스티커, `-` 기호는 나만 가진 스티커예요. 둘 다 있는 것을 먼저, 나만 있는 것을 다음에 보여 줘요.|🧱 Tap tiles to build the code. `&` gives the stickers we both have, and `-` the ones only I have. Show the shared ones first, then the ones only I have.',
  start:'mine = {"🐶", "🐱", "🐰"}\nfriend = {"🐱", "🦊", "🐶"}',
  tiles:['both = mine & friend','only_me = mine - friend','print("둘 다 있어요:", sorted(both))','print("나만 있어요:", sorted(only_me))','print(both[0])'],
  solution:'mine = {"🐶", "🐱", "🐰"}\nfriend = {"🐱", "🦊", "🐶"}\nboth = mine & friend\nprint("둘 다 있어요:", sorted(both))\nonly_me = mine - friend\nprint("나만 있어요:", sorted(only_me))',
  learn:'`&` 기호는 겹치는 스티커를, `-` 기호는 나만 있는 스티커를 찾아요. 스티커를 바꿀 때 딱이에요!|`&` finds the stickers we share, and `-` finds the ones only I have. Perfect for trading!',
  hints:['먼저 `both = mine & friend` 타일로 상자를 만들고, 바로 아래에 그 상자를 보여 주는 타일을 놓아요.|First make the box with `both = mine & friend`, then put the tile that shows it right below.',
   '그다음 `only_me = mine - friend` 타일을 놓고, 그 아래에 ‘나만 있어요’를 보여 주는 타일을 놓아요.|Next, place `only_me = mine - friend`, and under it the tile that shows "나만 있어요".',
   '세트에는 칸 번호가 없어서 `both[0]` 타일은 오류가 나요. `sorted()` 함수가 스티커를 줄 세워 보여 줘요.|A set has no car numbers, so `both[0]` gives an error. `sorted()` lines the stickers up to show them.']},
 {id:'w10-7',kind:'make',stage:'text',title:'스티커 바꾸기 날|Sticker swap day',scene:'🫧🐶🦄🐼🐸',
  say:'🎨 내 맘대로 만들어요! 내 주머니 `mine`, 친구 주머니 `friend` 타일로 스티커를 채워요. 합치기, 겹치는 것, 나만 있는 것을 찾아 게시판에 2줄 이상 보여 줘요.|🎨 Make your own! Fill my pouch, `mine`, and my friend’s pouch, `friend`, with stickers. Join them, find the shared ones and the ones only you have, and show 2 or more lines.',
  idea:'두 주머니를 만들고, 합치고, 비교해서 2줄 이상 보여 줘요!|Make two pouches, join and compare them, and show 2 or more lines!',
  tiles:['mine = {<<"🐶"|"🐱"|"🐰">>, <<"🦊"|"🐼"|"🐸">>, <<"🐯"|"🐻"|"🐷">>}',
   'friend = {<<"🐶"|"🐱"|"🐰">>, <<"🦊"|"🐼"|"🐸">>, <<"🐵"|"🐧"|"🐤">>}',
   'mine.add(<<"🦄"|"🐳"|"🦋">>)',
   'together = mine | friend',
   'both = mine & friend',
   'only_me = mine - friend',
   'print("내 스티커 수:", len(mine))',
   'print("합치면:", len(together))',
   'print("둘 다 있어요:", sorted(both))',
   'print("나만 있어요:", sorted(only_me))',
   'if <<"🦄"|"🐳"|"🦋">> in mine:',
   'print(<<"와, 있어요!"|"내 보물 스티커!">>)'],
  goal:{minOut:2},
  solution:'mine = {"🐶", "🐼", "🐯"}\nfriend = {"🐶", "🐸", "🐧"}\nmine.add("🦄")\nprint("내 스티커 수:", len(mine))\ntogether = mine | friend\nprint("합치면:", len(together))\nboth = mine & friend\nprint("둘 다 있어요:", sorted(both))\nif "🦄" in mine:\n    print("와, 있어요!")',
  learn:'세트로 스티커를 모으고, 합치고, 비교했어요. 똑같은 스티커 걱정 없이 모을 수 있어요!|You collected, joined and compared stickers with sets. No worrying about doubles!',
  hints:['먼저 두 주머니 타일을 놓고, `len(mine)` 코드가 든 타일로 내 스티커가 몇 장인지 보여 줘요.|Place the two pouch tiles first, then show how many stickers you have with the `len(mine)` tile.',
   '합친 건 `together`, 둘 다 있는 건 `both`, 나만 있는 건 `only_me` 상자예요. 상자를 만든 뒤에 보여 줘요.|Joined is `together`, shared is `both`, only mine is `only_me`. Make each box before you show it.',
   '`if ... in mine:` 타일 아래에 `print` 타일을 ⇥ 버튼으로 들여 쓰면 보물 스티커가 있는지 확인해요.|Indent a `print` tile under `if ... in mine:` with ⇥ to check for your treasure sticker.']}
 ]});
WORLD(11,{icon:'🍪',name:'쿠키틀 공장|Cookie-Cutter Factory',concept:'클래스|Classes',
 intro:['어서 와요, 쿠키 공장이에요! 쿠키틀 하나만 있으면 쿠키를 잔뜩 찍어 낼 수 있어요.|Welcome to the cookie factory! With one cookie cutter, you can press out lots of cookies.',
  '파이썬에서는 쿠키틀을 클래스, 틀로 찍은 쿠키 하나하나를 객체라고 해요.|In Python, the cutter is called a class, and each cookie pressed out is an object.',
  '쿠키마다 자기 속성(이름표)이 있어요. 별 쿠키는 별 모양, 하트 쿠키는 하트 모양! `self` 이름은 ‘이 쿠키 자신’이에요.|Each cookie has its own attributes (name tags). A star cookie is star-shaped, a heart cookie heart-shaped! `self` means “this cookie itself”.'],
 demo:'class Cookie:\n    def __init__(self, shape):\n        self.shape = shape\n\na = Cookie("⭐")\nb = Cookie("❤️")\nprint(a.shape, b.shape)',
 missions:[
 {id:'w11-1',kind:'watch',stage:'text',title:'첫 번째 쿠키틀|My first cutter',scene:'🍪🐶✨',
  say:'👀 ▶ 실행을 누르고 봐요. `Pet` 쿠키틀(클래스)로 동물 쿠키(객체)를 하나 찍어요. 이름은 뭉치! 게시판에 뭉치가 나오고, 📦 메모리 칸에 쿠키 카드가 생겨요.|👀 Press ▶ Run and watch. The `Pet` cookie cutter (a class) presses out one pet cookie (an object) named "뭉치". The board shows its name, and a cookie card appears in 📦 Memory.',
  code:'class Pet:\n    def __init__(self, name):\n        self.name = name\n\nmy_pet = Pet("뭉치")\nprint(my_pet.name)',
  notes:{1:'🍪 `Pet` 쿠키틀을 만들어요. 틀만 있고 아직 쿠키는 없어요.|🍪 Make the `Pet` cookie cutter. Just the cutter, no cookies yet.',
   2:'`__init__` 메서드는 쿠키를 찍을 때 저절로 실행돼요. `self` 이름은 이 쿠키 자신이에요.|`__init__` runs by itself when a cookie is pressed out. `self` is this cookie itself.',
   3:'받은 이름을 이 쿠키의 `name` 이름표에 적어요.|Write the given name on this cookie’s `name` tag.',
   5:'`Pet("뭉치")` 코드로 틀에서 쿠키 하나를 찍어 `my_pet` 상자에 넣어요.|`Pet("뭉치")` presses out one cookie and puts it in the `my_pet` box.',
   6:'`my_pet.name` 코드는 점 뒤의 `name` 이름표를 읽어요. 뭉치!|`my_pet.name` reads the `name` tag after the dot: "뭉치"!'},
  solution:'class Pet:\n    def __init__(self, name):\n        self.name = name\n\nmy_pet = Pet("뭉치")\nprint(my_pet.name)',
  learn:'클래스는 쿠키틀, 객체는 그 틀로 찍은 쿠키예요. `__init__` 메서드가 새 객체에 이름표를 붙여요.|A class is a cookie cutter, and an object is a cookie made from it. `__init__` gives each new object its name tag.',
  hints:['▶ 실행하고 5번 줄에서 📦 메모리 칸에 쿠키 카드가 생기는 걸 봐요.|Press ▶ Run and watch a cookie card appear in 📦 Memory at line 5.',
   '5번 줄에서 파이가 2번, 3번 줄로 갔다가 돌아와요. `__init__` 메서드가 저절로 실행되는 거예요.|At line 5, Py jumps to lines 2 and 3, then comes back. That’s `__init__` running by itself.']},
 {id:'w11-2',kind:'choose',stage:'text',title:'두 마리 찍기|Two pets',scene:'🐶🐱',
  say:'🤔 세 코드 중 하나를 골라요. `Pet` 쿠키틀로 동물 쿠키 두 개를 찍어요. 게시판에 ‘뭉치 나비’처럼 저마다 자기 이름이 나와야 해요.|🤔 Pick one of the three codes. Press out two pet cookies with the `Pet` cutter. The board must show each one’s own name, like "뭉치 나비".',
  ask:'두 동물이 저마다 자기 이름을 말하는 코드는?|Which code lets each pet say its own name?',
  options:['class Pet:\n    def __init__(self, name):\n        self.name = name\n\na = Pet("뭉치")\nb = Pet("나비")\nprint(a.name, b.name)',
   'class Pet:\n    def __init__(self, name):\n        name = name\n\na = Pet("뭉치")\nb = Pet("나비")\nprint(a.name, b.name)',
   'class Pet:\n    def __init__(self, name):\n        self.name = "뭉치"\n\na = Pet("뭉치")\nb = Pet("나비")\nprint(a.name, b.name)'],
  solution:'class Pet:\n    def __init__(self, name):\n        self.name = name\n\na = Pet("뭉치")\nb = Pet("나비")\nprint(a.name, b.name)',
  why:'`self.` 부분이 있어야 이름표가 이 쿠키에 붙어요. 이름을 "뭉치"로 정해 두면 모두 뭉치가 돼요.|Only with `self.` does the tag stick to this cookie. If the name is always "뭉치", every pet is "뭉치".',
  learn:'틀은 하나라도 객체는 따로따로예요. 객체마다 자기 속성을 가져요.|One cutter, but every object is separate. Each object keeps its own attributes.',
  hints:['세 코드는 3번째 줄만 달라요. 그 줄을 나란히 비교해 봐요.|The three codes differ only on line 3. Compare that line side by side.',
   '`self.` 부분이 없으면 이름표가 쿠키에 붙지 않고 사라져요.|Without `self.`, the name tag doesn’t stick to the cookie; it just disappears.',
   '괄호로 받은 `name` 재료를 그대로 적어야 쿠키마다 이름이 달라져요.|Write down the `name` that came in the brackets, so each cookie gets its own name.']},
 {id:'w11-3',kind:'predict',stage:'text',title:'말하는 동물|Talking pets',scene:'🐶💬',
  say:'🔮 실행하기 전에 게시판에 무엇이 나올지 골라요. 틀 안의 `speak` 메서드는 동물 쿠키가 할 줄 아는 일이에요. 맨 아래 두 줄에서 누가 먼저 말하는지 봐요.|🔮 Before running, pick what the board will show. The `speak` method inside the cutter is something a pet cookie can do. Check the last two lines: who speaks first?',
  code:'class Pet:\n    def __init__(self, name):\n        self.name = name\n\n    def speak(self):\n        print(self.name, "멍멍!")\n\na = Pet("뭉치")\nb = Pet("초코")\nb.speak()\na.speak()',
  ask:'게시판에 무엇이 나올까요?|What will the board show?',
  options:['초코 멍멍!\n뭉치 멍멍!','뭉치 멍멍!\n초코 멍멍!','self 멍멍!\nself 멍멍!'],
  solution:'class Pet:\n    def __init__(self, name):\n        self.name = name\n\n    def speak(self):\n        print(self.name, "멍멍!")\n\na = Pet("뭉치")\nb = Pet("초코")\nb.speak()\na.speak()',
  why:'`b.speak()` 코드를 먼저 불렀어요. 이때 `self` 이름은 `b` 쿠키, 초코예요. 그래서 초코가 먼저 말해요.|`b.speak()` is called first, so `self` is cookie `b`, "초코". That’s why "초코" speaks first.',
  learn:'메서드는 객체가 할 줄 아는 일이에요. `self` 이름에는 그 메서드를 부른 객체가 들어가요.|A method is something an object can do. `self` is the object that called it.',
  hints:['맨 아래 두 줄을 봐요. 누가 먼저 `speak()` 메서드를 부르나요?|Look at the last two lines. Who calls `speak()` first?',
   '`b.speak()` 코드에서는 `self` 이름이 `b` 쿠키예요. `b` 쿠키의 이름은 뭐였죠?|In `b.speak()`, `self` is cookie `b`. What was `b`’s name?']},
 {id:'w11-4',kind:'fix',stage:'text',title:'목소리를 찾아요|Find the voice',scene:'🐱❓',
  say:'🐞 ▶ 실행해서 틀린 줄을 찾고 눌러서 고쳐요. 게시판에 ‘나비 야옹!’이 나오면 성공이에요. `speak` 메서드 첫 줄의 괄호에 꼭 있어야 할 게 빠졌어요.|🐞 Press ▶ Run, find the wrong line and tap it to fix it. Success is "나비 야옹!" on the board. Something is missing in the brackets on the first line of `speak`.',
  code:'class Pet:\n    def __init__(self, name):\n        self.name = name\n\n    def speak():\n        print(self.name, "야옹!")\n\nc = Pet("나비")\nc.speak()',bug:5,
  fixes:['    def speak(self):','    def speak(self)','    def speak(name):'],
  solution:'class Pet:\n    def __init__(self, name):\n        self.name = name\n\n    def speak(self):\n        print(self.name, "야옹!")\n\nc = Pet("나비")\nc.speak()',
  learn:'메서드를 만들 때는 괄호 첫 칸에 꼭 `self` 이름을 써요. 그래야 메서드가 자기 객체를 알아요.|When you make a method, put `self` first in the brackets. That’s how the method knows its object.',
  hints:['▶ 실행하고 오류 설명을 읽어 봐요. 메서드를 만드는 `def` 줄들을 살펴봐요.|Press ▶ Run and read the error. Look at the `def` lines that make methods.',
   '2번 줄 `def __init__(self, name):` 코드와 5번 줄 `def speak():` 코드를 비교해 봐요. 괄호 안이 달라요.|Compare line 2, `def __init__(self, name):`, with line 5, `def speak():`. The brackets differ.',
   '5번 줄 괄호 안에 `self` 이름을 넣고, 끝의 콜론(:)도 잊지 말아요.|Put `self` in the brackets on line 5, and don’t forget the colon (:) at the end.']},
 {id:'w11-5',kind:'blank',stage:'text',title:'냠냠 밥 주기|Feeding time',scene:'🐶🍖',
  say:'❓ 빈칸 2개를 눌러 알맞은 코드를 골라요. `feed` 메서드로 밥을 주면 배고픔이 1 줄어요. 뭉치에게 밥을 한 번 줘서 ‘뭉치 배고픔 2’가 나오면 성공이에요.|❓ Tap the 2 blanks and pick the right code. Feeding with `feed` lowers hunger by 1. Feed "뭉치" once so the board shows "뭉치 배고픔 2".',
  code:'class Pet:\n    def __init__(self, name):\n        self.name = name\n        self.hunger = 3\n\n    def feed(self):\n        <<self.hunger|hunger>> = self.hunger - 1\n\np = Pet("뭉치")\np.<<feed()|feed>>\nprint(p.name, "배고픔", p.hunger)',
  solution:'class Pet:\n    def __init__(self, name):\n        self.name = name\n        self.hunger = 3\n\n    def feed(self):\n        self.hunger = self.hunger - 1\n\np = Pet("뭉치")\np.feed()\nprint(p.name, "배고픔", p.hunger)',
  learn:'메서드 안에서 `self.hunger` 속성을 바꾸면 그 객체의 값이 진짜로 바뀌어요. 메서드는 괄호를 붙여 불러요.|Changing `self.hunger` in a method really changes that object. Call a method with brackets.',
  hints:['실행하면서 📦 메모리 칸의 `Pet` 카드를 봐요. 배고픔 숫자가 3에서 2로 바뀌나요?|Run it and watch the `Pet` card in 📦 Memory. Does hunger go from 3 to 2?',
   '첫 빈칸: `self.` 부분이 있어야 이 쿠키의 배고픔이 바뀌어요. 없으면 잠깐 쓰고 사라지는 상자예요.|Blank 1: only with `self.` does this cookie’s hunger change. Without it, it’s a box that vanishes.',
   '둘째 빈칸: 메서드는 `feed()` 모양처럼 괄호를 붙여야 실행돼요.|Blank 2: a method only runs with brackets, like `feed()`.']},
 {id:'w11-6',kind:'tiles',stage:'text',title:'다 같이 밥 먹자|Dinner for all',scene:'🐶🐱🐹🍖',
  say:'🧱 타일을 눌러 코드를 만들어요. `pets` 기차에 동물 쿠키 3개가 탔어요. `for p in pets:` 반복으로 한 마리씩 `feed` 메서드로 밥을 주고, 배고픔을 보여 줘요.|🧱 Tap tiles to build the code. Three pet cookies ride the `pets` train. Use `for p in pets:` to feed each one with `feed`, then show its hunger.',
  start:'class Pet:\n    def __init__(self, name):\n        self.name = name\n        self.hunger = 3\n\n    def feed(self):\n        self.hunger = self.hunger - 1\n\npets = [Pet("뭉치"), Pet("나비"), Pet("초코")]',
  tiles:['for p in pets:','p.feed()','pets.feed()','print(p.name, "배고픔", p.hunger)'],
  goal:{uses:['For']},
  solution:'class Pet:\n    def __init__(self, name):\n        self.name = name\n        self.hunger = 3\n\n    def feed(self):\n        self.hunger = self.hunger - 1\n\npets = [Pet("뭉치"), Pet("나비"), Pet("초코")]\nfor p in pets:\n    p.feed()\n    print(p.name, "배고픔", p.hunger)',
  learn:'객체를 리스트 기차에 태우면 `for` 반복으로 한 마리씩 차례로 돌볼 수 있어요.|Put objects on a list train, and a `for` loop can care for them one by one.',
  hints:['`for p in pets:` 타일을 먼저 놓아요. 반복할 때마다 `p` 상자에 동물이 한 마리씩 들어가요.|Place `for p in pets:` first. Each time round, the `p` box holds one pet.',
   '밥은 기차 전체가 아니라 `p` 상자 속 동물에게 줘요. `p.feed()` 타일을 골라요.|Feed the pet in the `p` box, not the whole train. Pick the `p.feed()` tile.',
   '반복 안의 두 줄은 ⇥ 버튼으로 들여 써요. 밥을 먼저 주고, 그다음에 보여 줘요.|Indent the two lines inside the loop with ⇥. Feed first, then show.']},
 {id:'w11-7',kind:'make',stage:'text',title:'나만의 쿠키틀|My own cutter',scene:'🤖🐶🍪',
  say:'🎨 내 맘대로 만들어요! `class` 타일로 나만의 쿠키틀을 만들고, 쿠키(객체)를 두 개 이상 찍어요. 메서드를 불러서 게시판에 2줄 이상 나오게 해요.|🎨 Make your own! Build your own cookie cutter with the `class` tile and press out two or more cookies (objects). Call methods so the board shows 2 or more lines.',
  idea:'나만의 클래스를 만들고, 객체 2개 이상이 말하게 해요!|Make your own class and make 2 or more objects talk!',
  tiles:['class <<Robot|Pet|Cookie>>:','def __init__(self, name):','self.name = name','self.happy = <<5>>','def speak(self):','print(self.name, <<"삐빅!"|"멍멍!"|"바삭바삭!">>)','def play(self):','self.happy = self.happy + 1','print(self.name, "기분", self.happy)','<<a|b>> = <<Robot|Pet|Cookie>>(<<"동동"|"반짝"|"뭉치"|"나비"|"별"|"하트">>)','<<a|b>>.speak()','<<a|b>>.play()'],
  goal:{minOut:2,uses:['Class']},
  solution:'class Robot:\n    def __init__(self, name):\n        self.name = name\n        self.happy = 5\n\n    def speak(self):\n        print(self.name, "삐빅!")\n\n    def play(self):\n        self.happy = self.happy + 1\n        print(self.name, "기분", self.happy)\n\na = Robot("동동")\nb = Robot("반짝")\na.speak()\nb.speak()\nb.play()',
  bonus:{ko:'쿠키들을 리스트 기차에 태우고 `for` 반복으로 모두 말하게 해 봐요!',en:'Put your objects on a list train and make them all talk with a `for` loop!',uses:['For']},
  bonusSolution:'class Robot:\n    def __init__(self, name):\n        self.name = name\n        self.happy = 5\n\n    def speak(self):\n        print(self.name, "삐빅!")\n\nrobots = [Robot("동동"), Robot("반짝"), Robot("뚝딱")]\nfor r in robots:\n    r.speak()',
  learn:'틀 하나를 잘 만들면 객체를 몇 개든 찍어 낼 수 있어요. 그게 클래스의 힘이에요!|Make one good cutter and you can press out as many objects as you like. That’s the power of classes!',
  hints:['순서는 쿠키틀 만들기(`class` 줄), 쿠키 찍기(`a = ...` 줄), 메서드 부르기(`a.speak()` 줄)예요.|The order: make the cutter (`class`), press out cookies (`a = ...`), then call methods (`a.speak()`).',
   '틀 안의 `def` 줄은 ⇥ 버튼으로 한 번, 메서드 안의 줄은 두 번 들여 써요.|Indent the `def` lines inside the cutter once with ⇥, and the lines inside a method twice.',
   '쿠키틀 이름과 쿠키를 찍을 때 쓰는 이름이 같아야 해요. `class Robot:` 틀이면 `Robot("동동")` 코드로 찍어요.|The cutter’s name must match the name you press with: `class Robot:` goes with `Robot("동동")`.']}
 ]});
WORLD(12,{icon:'🎪',name:'섬 축제|Island Festival',concept:'모두 함께|Everything together',
 intro:['드디어 섬 축제 날이에요! 지금까지 배운 걸 모두 모아서 축제를 준비해요.|It’s festival day on the island! Let’s use everything we’ve learned to get ready.',
  '반복, 조건, 함수, 리스트, 딕셔너리, 세트, 클래스… 친구는 벌써 다 할 줄 알아요!|Loops, ifs, functions, lists, dicts, sets, classes… you already know them all!',
  '작은 프로그램을 하나씩 만들면서 축제를 즐겨요. 🎉|Let’s enjoy the festival by making one small program at a time. 🎉'],
 demo:'festival = ["🎈", "🍭", "🎆"]\nfor thing in festival:\n    print(thing, "준비 완료!")',
 missions:[
 {id:'w12-1',kind:'watch',stage:'turtle',title:'축제 포스터|Festival poster',
  say:'👀 ▶ 실행을 누르고 봐요. `flag` 레시피 카드는 세모 깃발 하나를 그려요. 🔁 반복이 이 카드를 6번 불러 깃발 줄을 만들고, 풍선 4개도 찍어요.|👀 Press ▶ Run and watch. The `flag` recipe card draws one triangle flag. A 🔁 loop calls it 6 times for a row of flags, then stamps 4 balloons.',
  code:'from turtle import *\nbgcolor("lightyellow")\n\ndef flag():\n    begin_fill()\n    for k in range(3):\n        forward(30)\n        right(120)\n    end_fill()\n    forward(40)\n\ncolor("orange")\npenup()\ngoto(-120, 130)\npendown()\nfor i in range(<<6>>):\n    flag()\n\npenup()\ngoto(-50, 30)\nwrite("🎪 섬 축제 🎪")\ngoto(-90, -80)\ncolor("hotpink")\nfor i in range(<<4>>):\n    dot(40)\n    forward(60)',
  notes:{4:'📋 `flag` 레시피 카드를 만들어요. 깃발 하나 그리는 법이에요.|📋 Make the `flag` recipe card: how to draw one flag.',
   6:'🔁 선 긋고 120도 돌기를 3번 하면 세모 깃발이 돼요.|🔁 Draw a line and turn 120°, three times, to make a triangle flag.',
   10:'`forward(40)` 코드로 다음 깃발 자리로 옮겨 가요.|`forward(40)` moves on to the next flag’s spot.',
   16:'🔁 반복이 `flag()` 카드를 6번 불러요. 숫자를 눌러 바꿔 봐요!|🔁 The loop calls the `flag()` card 6 times. Tap the number to change it!',
   21:'📝 `write()` 함수로 포스터에 글자를 써요.|📝 `write()` puts words on the poster.',
   24:'🔁 반복으로 ⚫ `dot(40)` 점을 4번 찍어 풍선을 만들어요.|🔁 The loop stamps ⚫ `dot(40)` 4 times to make balloons.'},
  solution:'from turtle import *\nbgcolor("lightyellow")\n\ndef flag():\n    begin_fill()\n    for k in range(3):\n        forward(30)\n        right(120)\n    end_fill()\n    forward(40)\n\ncolor("orange")\npenup()\ngoto(-120, 130)\npendown()\nfor i in range(6):\n    flag()\n\npenup()\ngoto(-50, 30)\nwrite("🎪 섬 축제 🎪")\ngoto(-90, -80)\ncolor("hotpink")\nfor i in range(4):\n    dot(40)\n    forward(60)',
  learn:'함수와 반복을 함께 쓰면 짧은 코드로도 멋진 그림을 그릴 수 있어요.|With a function and a loop together, short code can draw something great.',
  hints:['▶ 실행하고 깃발과 풍선이 몇 개 그려지는지 세어 봐요.|Press ▶ Run and count the flags and balloons.',
   '16번 줄이나 24번 줄 `range()` 괄호 안의 색칠된 숫자를 눌러 바꾸면 깃발이나 풍선 수가 바뀌어요.|Tap the coloured number in `range()` on line 16 or 24 to change how many flags or balloons.']},
 {id:'w12-2',kind:'type',stage:'text',title:'간식 가게 계산|Snack-stand sales',scene:'🍢🍭🧃',
  say:'⌨️ 4번 빈 줄에 반복을 직접 써요. `orders` 주문 기차를 하나씩 보며 `menu` 메뉴판 가격을 `total` 상자에 더해요. ‘오늘 번 돈은 8 코인!’이 나오면 성공이에요.|⌨️ Type a loop on the empty line 4. Go through the `orders` train and add each `menu` price into the `total` box. Success is "오늘 번 돈은 8 코인!".',
  start:'menu = {"떡볶이": 3, "솜사탕": 2, "주스": 1}\norders = ["솜사탕", "떡볶이", "솜사탕", "주스"]\ntotal = 0\n\nprint("오늘 번 돈은", total, "코인!")',
  snippets:['for food in orders:','menu[food]','total = total + '],
  goal:{uses:['For']},
  solution:'menu = {"떡볶이": 3, "솜사탕": 2, "주스": 1}\norders = ["솜사탕", "떡볶이", "솜사탕", "주스"]\ntotal = 0\nfor food in orders:\n    total = total + menu[food]\nprint("오늘 번 돈은", total, "코인!")',
  learn:'리스트에서 주문을 하나씩 꺼내고, 딕셔너리 메뉴판에서 값을 찾아 더했어요. 진짜 가게 프로그램이에요!|You took each order from the list, found its price in the dict, and added it up. A real shop program!',
  hints:['주문 기차를 `for` 반복으로 하나씩 꺼내고, 메뉴판에서 그 간식의 가격을 찾아 더해요.|Take each order with a `for` loop, find that snack’s price on the menu, and add it.',
   '`total = 0` 줄과 `print` 줄 사이에 2줄을 써요. 아래 버튼을 눌러도 돼요.|Write 2 lines between `total = 0` and `print`. You can tap the buttons below.',
   '`for food in orders:` 줄을 쓰고, 그 아래에 `total = total + menu[food]` 줄을 한 칸 들여 써요.|Write `for food in orders:`, then indent `total = total + menu[food]` under it.']},
 {id:'w12-3',kind:'predict',stage:'text',title:'스티커 바꾸기|Sticker swap',scene:'🐶🐱🐰🐼🦊',
  say:'🔮 실행하기 전에 게시판에 무엇이 나올지 골라요. 같은 스티커는 하나만 들어가요. 내 스티커 수, 합친 스티커 수, 내 주머니에 🦊가 있는지가 차례로 나와요.|🔮 Before running, pick what the board will show. A pouch keeps only one of each sticker. Out come my sticker count, the joined count, then whether 🦊 is in my pouch.',
  code:'mine = {"🐶", "🐱", "🐰"}\nfriend = {"🐱", "🐼", "🦊"}\nmine.add("🐼")\nmine.add("🐱")\nprint(len(mine))\nprint(len(mine | friend))\nif "🦊" in mine:\n    print("여우 있어요!")\nelse:\n    print("여우 없어요")',
  ask:'게시판에 무엇이 나올까요?|What will the board show?',
  options:['4\n5\n여우 없어요','5\n6\n여우 없어요','4\n5\n여우 있어요!'],
  solution:'mine = {"🐶", "🐱", "🐰"}\nfriend = {"🐱", "🐼", "🦊"}\nmine.add("🐼")\nmine.add("🐱")\nprint(len(mine))\nprint(len(mine | friend))\nif "🦊" in mine:\n    print("여우 있어요!")\nelse:\n    print("여우 없어요")',
  why:'🐱는 이미 있어서 내 주머니는 4장이에요. 합치면 🐶🐱🐰🐼🦊 5장이지만, 그건 새 주머니라서 내 주머니엔 🦊가 없어요.|🐱 was already there, so mine has 4. Joined, there are 5: 🐶🐱🐰🐼🦊. But that’s a new pouch, so mine still has no 🦊.',
  learn:'세트 주머니에는 같은 스티커가 하나만 들어가요. 그래서 겹치지 않게 세기 편해요.|A set pouch holds just one of each sticker, so counting without doubles is easy.',
  hints:['한 줄씩 따라가며 내 주머니 속 스티커를 손가락으로 세어 봐요.|Go line by line and count the stickers in my pouch on your fingers.',
   '`mine.add("🐱")` 줄에서는 🐱 스티커가 이미 있었는지 확인해요.|At `mine.add("🐱")`, check whether 🐱 was already there.',
   '두 주머니를 합치는 6번 줄은 새 주머니를 만들어요. `mine` 주머니는 그대로예요.|Line 6, which joins the pouches, makes a new pouch. `mine` itself doesn’t change.']},
 {id:'w12-4',kind:'tiles',stage:'text',title:'축제 퀴즈 쇼|Festival quiz show',scene:'🎤❓🏆',inputs:['8','7'],
  say:'🧱 타일을 눌러 코드를 만들어요. 1번 문제 채점 코드와 똑같은 모양으로 2번 문제(정답 7)를 채점해요. 맨 끝에 점수를 보여 줘서 ‘점수: 2’가 나오면 성공!|🧱 Tap tiles to build the code. Look at how question 1 is checked, and check question 2 (the answer is 7) the same way. Show the score at the end: success is "점수: 2".',
  start:'score = 0\nanswer = input("3 + 5 = ")\nif answer == "8":\n    score = score + 1\nanswer = input("무지개는 몇 색? ")',
  tiles:['if answer == <<"7"|7>>:','score = score + 1','print("점수:", score)','if answer = "7":'],
  goal:{uses:['If']},
  solution:'score = 0\nanswer = input("3 + 5 = ")\nif answer == "8":\n    score = score + 1\nanswer = input("무지개는 몇 색? ")\nif answer == "7":\n    score = score + 1\nprint("점수:", score)',
  learn:'`input()` 함수로 답을 받고 `if` 조건으로 채점했어요. 점수는 `score` 상자에 차곡차곡 쌓여요.|You took answers with `input()` and checked them with `if`. Points pile up in the `score` box.',
  hints:['1번 문제를 채점하는 3번, 4번 줄을 잘 보고 똑같은 모양으로 만들어요.|Look at lines 3 and 4, which check question 1, and build the same shape.',
   '`input()` 함수로 받은 답은 글자예요. 따옴표가 있는 `"7"` 값과 `==` 기호로 비교해요. `=` 기호 하나는 비교가 아니에요.|An answer from `input()` is text, so compare it with `"7"` in quotes using `==`. A single `=` doesn’t compare.',
   '`if answer == "7":` 아래에 `score = score + 1` 줄을 들여 쓰고, `print` 줄은 맨 끝에 들여 쓰지 않고 놓아요.|Indent `score = score + 1` under `if answer == "7":`, and put `print` at the very end, not indented.']},
 {id:'w12-5',kind:'fix',stage:'text',title:'동물 자랑 대회|Pet show',scene:'🐶🐱🐹🎀',
  say:'🐞 ▶ 실행해서 틀린 줄을 찾고 눌러서 고쳐요. 동물 쿠키 3개가 `pets` 기차에 탔어요. 반복할 때마다 `p` 상자 속 동물이 `show` 메서드로 재주를 보여 주면 성공이에요.|🐞 Press ▶ Run, find the wrong line and tap it to fix it. Three pet cookies ride the `pets` train. Success is when, each time round, the pet in the `p` box shows its trick with `show`.',
  code:'class Pet:\n    def __init__(self, name, trick):\n        self.name = name\n        self.trick = trick\n\n    def show(self):\n        print(self.name, "-", self.trick, "👏")\n\npets = [Pet("뭉치", "공 굴리기"),\n        Pet("나비", "높이 뛰기"),\n        Pet("콩이", "빙글 돌기")]\nfor p in pets:\n    pets.show()',bug:13,
  fixes:['    p.show()','    pets[0].show()','    show()'],
  solution:'class Pet:\n    def __init__(self, name, trick):\n        self.name = name\n        self.trick = trick\n\n    def show(self):\n        print(self.name, "-", self.trick, "👏")\n\npets = [Pet("뭉치", "공 굴리기"),\n        Pet("나비", "높이 뛰기"),\n        Pet("콩이", "빙글 돌기")]\nfor p in pets:\n    p.show()',
  learn:'메서드는 기차 전체가 아니라 객체 하나하나에게 불러요. 반복할 때 `p` 상자에 든 객체에게요!|Call a method on each object, not on the whole train: the object in the loop box `p`!',
  hints:['▶ 실행하고 🐞 표시가 붙은 줄을 봐요. `pets` 이름은 기차 전체예요. 기차는 재주를 부릴 줄 몰라요.|Press ▶ Run and look at the line marked 🐞. `pets` is the whole train, and a train can’t do tricks.',
   '반복할 때마다 동물 한 마리가 `p` 상자에 들어가요. 13번 줄에서 그 동물에게 재주를 시켜요.|Each time round, one pet is in the `p` box. On line 13, ask that pet to do its trick.',
   '13번 줄을 `p.show()` 코드로 바꿔요. 들여쓰기는 그대로예요.|Change line 13 to `p.show()`, keeping the indent.']},
 {id:'w12-6',kind:'tiles',stage:'grid',title:'축제 퍼레이드|Festival parade',
  say:'🧱 타일을 눌러 코드를 만들어요. 🔁 집에 갈 때까지 반복하며 🍎 사과가 있으면 먹고, 👀 앞이 비었으면 가고, 막히면 돌아요. 사과 4개를 먹고 🏠 집으로!|🧱 Tap tiles to build the code. 🔁 Keep going until home: 🍎 apple here? Eat it. 👀 Way clear? Move. Blocked? Turn. Eat all 4 apples and reach 🏠 home.',
  grid:{map:['#########',
             '#P.A....#',
             '#######.#',
             '#..A.G#A#',
             '#.#####.#',
             '#...A...#',
             '#########'],dir:'E'},
  start:'while not at_goal():',
  tiles:['if apple_here():','eat()','if front_is_clear():','move()','else:','turn_right()','turn_left()'],
  goal:{uses:['While','If']},
  solution:'while not at_goal():\n    if apple_here():\n        eat()\n    if front_is_clear():\n        move()\n    else:\n        turn_right()',
  learn:'`while` 반복과 `if` 조건을 함께 쓰면 길이 꼬불꼬불해도 파이가 스스로 판단하며 걸어요.|With `while` and `if` together, Py decides for itself, however the path winds.',
  hints:['파이의 할 일을 말로 해 봐요. 사과가 있으면 먹고, 앞이 비었으면 가고, 아니면 돌아요.|Say Py’s job in words: apple here? Eat. Way clear? Go. Otherwise, turn.',
   '첫 모퉁이를 손가락으로 따라가 봐요. 파이는 오른쪽과 왼쪽 중 어느 쪽으로 돌아야 하나요?|Trace the first corner with your finger. Does Py need to turn right or left?',
   '`else:` 줄은 `if front_is_clear():` 줄과 같은 깊이로, 그 안의 도는 줄은 한 칸 더 들여 써요.|Put `else:` at the same depth as `if front_is_clear():`, and indent the turn inside it one more.']},
 {id:'w12-7',kind:'make',stage:'turtle',title:'축제 불꽃놀이|Festival fireworks',
  say:'🎨 내 맘대로 만들어요! `firework(size)` 레시피 카드에 불꽃을 적어요. 🔁 12번 반복으로 앞으로 갔다 돌아오고 30도 돌아요. 펜을 들고 옮겨 가며 카드를 여러 번 불러요.|🎨 Make your own! Write a firework on a `firework(size)` recipe card: 🔁 repeat 12 times, go forward, come back, turn 30°. Lift the pen, move, and call the card many times.',
  idea:'함수와 반복으로 불꽃을 그려요. 다 그리면 놀이터에서 무엇이든 계속 만들어요!|Draw fireworks with a function and a loop. Then keep making anything in the playground!',
  tiles:['bgcolor(<<"black"|"navy">>)','def firework(size):','for i in range(<<12>>):','forward(size)','backward(size)','right(<<30>>)','color(<<"gold"|"pink"|"cyan"|"orange">>)','penup()','pendown()','goto(<<-90>>, <<60>>)','firework(<<60>>)','write(<<"축제 최고!"|"고마워요!"|"또 만나요!">>)'],
  goal:{minSegs:6,uses:['For']},
  solution:'from turtle import *\nbgcolor("black")\n\ndef firework(size):\n    for i in range(12):\n        forward(size)\n        backward(size)\n        right(30)\n\ncolor("gold")\npenup()\ngoto(-90, 60)\npendown()\nfirework(60)\ncolor("pink")\npenup()\ngoto(80, 20)\npendown()\nfirework(45)\ncolor("cyan")\npenup()\ngoto(0, -100)\npendown()\nfirework(35)\npenup()\ngoto(-50, -170)\nwrite("축제 최고!")',
  bonus:{ko:'`def` 레시피 카드로 불꽃을 만들고, `write()` 함수로 축제 인사도 써 봐요!',en:'Make fireworks with a `def` recipe card, and write a festival greeting with `write()`!',uses:['Def','write']},
  bonusSolution:'from turtle import *\nbgcolor("navy")\n\ndef firework(size):\n    for i in range(12):\n        forward(size)\n        backward(size)\n        right(30)\n\ncolor("orange")\nfor n in range(3):\n    penup()\n    goto(-120 + n * 110, 40 - n * 50)\n    pendown()\n    firework(40)\npenup()\ngoto(-60, -170)\nwrite("또 만나요!")',
  learn:'배운 걸 모두 모아 멋진 작품을 만들었어요! 놀이터에서 친구만의 프로그램을 계속 만들어 봐요.|You put it all together into something great! Keep making your own programs in the playground.',
  hints:['먼저 `def firework(size):` 타일을 놓고, 그 안에 🔁 12번 반복을 넣어요. 12번 × 30도면 딱 한 바퀴예요.|First place `def firework(size):` with 🔁 repeat 12 inside it. 12 times 30 degrees is one full turn.',
   '반복 안에는 `forward(size)`, `backward(size)`, `right(30)` 세 줄을 ⇥ 버튼으로 들여 써요.|Inside the loop, indent three lines with ⇥: `forward(size)`, `backward(size)`, `right(30)`.',
   '카드 밖에서 ✋ 펜 들기, `goto()` 타일로 옮기기, ✍️ 펜 내리기, `firework(60)` 타일 순서로 불러요. 밝은 색이 잘 보여요!|Outside the card: ✋ pen up, move with `goto()`, ✍️ pen down, then `firework(60)`. Bright colours show up best!']}
 ]});

<script>
// ================================================================ Little Python Island · core
// Save data, rewards, sound, voice, windows and Py the baby python (drawn in SVG, dressed by the child).

// ---------------------------------------------------------------- helpers
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const dayKey=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addDays=(k,n)=>{const [y,m,d]=k.split('-').map(Number);return dayKey(new Date(y,m-1,d+n))};
const now=()=>Date.now();
// 'ko|en' → the current language; `code` inside text becomes <code>
const T=s=>{const p=String(s).split('|');return LANG==='en'?(p[1]??p[0]):p[0]};
const rich=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\n/g,'<br>');
const tx=s=>rich(T(s));
// Korean particle after a word: josa('엉킴이','이') → '엉킴이가', josa('꼬마 기차','을') → '꼬마 기차를'
const josa=(w,p)=>{w=String(w);const c=w.charCodeAt(w.length-1),b=c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28>0;const P={이:['이','가'],가:['이','가'],을:['을','를'],를:['을','를'],은:['은','는'],는:['은','는'],과:['과','와'],와:['과','와']}[p];return w+(b?P[0]:P[1])};
const COPYRIGHT=()=>`<footer class="copy">© 2026 Dongsun Moon. ${L('모든 권리 보유. 무단 복제와 사용을 금해요.','All rights reserved. No copying or reuse without permission.')}<br>${L('미션, 그림, 캐릭터, 소리, 파이썬 실행기는 이 게임을 위해 새로 만들었어요. Python은 Python Software Foundation의 상표예요.','Missions, art, characters, sounds and the Python runner were made for this game. Python is a trademark of the Python Software Foundation.')}</footer>`;

// ---------------------------------------------------------------- save (one save per profile picked on the main page)
const SAVE_KEY='pythonIsland.v1';
const freshS=()=>({v:1,created:dayKey(),name:L('코딩 친구','Coder'),av:'🧒',xp:0,lvl:1,apples:10,done:{},drafts:{},seen:{},rev:{},
 stats:{runs:0,bugs:0,fixed:0,hints:0,steps:0,missions:0,bonus:0,reviews:0,works:0,days:[]},works:[],
 wear:{color:'leaf',hat:'',acc:''},owned:{color:['leaf'],hat:[''],acc:['']},opt:{sound:true,voice:true,speed:1,big:false,diff:1},tut:{},today:{day:'',n:0},last:now(),
 tickets:3,games:{best:{},plays:{},lv:{}},boss:{won:{},tries:{},best:{}},items:{shield:1,bolt:1,heart:1,card:1},gear:{rod:0,kart:0,ship:0,suit:0},friends:[],deco:[],chests:{day:'',n:0},trophies:[]});
function loadS(){let d=null;try{d=JSON.parse(localStorage.getItem(SAVE_KEY)||'null')}catch(e){}const f=freshS();if(!d||typeof d!=='object')return f;
 const s={...f,...d};for(const k of ['stats','wear','owned','opt','tut','today','games','boss','items','gear','chests'])s[k]={...f[k],...(d[k]||{})};return s}
let S=loadS();
if(MGP.me){S.name=MGP.me.name;S.av=MGP.me.av}
let saveT=0,NOSAVE=false;
const save=(soon=false)=>{const w=()=>{if(NOSAVE)return;S.last=now();try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}};clearTimeout(saveT);if(soon)saveT=setTimeout(w,400);else w()};
window.addEventListener('pagehide',()=>save());document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
function markDay(){const t=dayKey();if(S.today.day!==t)S.today={day:t,n:0};const ds=S.stats.days;if(ds[ds.length-1]!==t){ds.push(t);if(ds.length>60)ds.shift()}}

// ---------------------------------------------------------------- levels and rewards
const TITLES=[[1,'🌱','코딩 새싹|Code Sprout'],[3,'🧭','명령 탐험가|Command Explorer'],[5,'🔎','버그 탐정|Bug Detective'],[8,'🌀','반복 마법사|Loop Wizard'],[11,'🔀','조건 박사|Condition Expert'],[14,'🛠️','함수 발명가|Function Inventor'],[18,'🚂','데이터 기관사|Data Engineer'],[22,'🍪','클래스 건축가|Class Architect'],[26,'🐍','파이썬 레인저|Python Ranger']];
const titleOf=l=>{let t=TITLES[0];for(const x of TITLES)if(l>=x[0])t=x;return {icon:t[1],name:T(t[2])}};
const xpNeed=l=>30+15*l;
function addXP(n){S.xp+=n;let up=false;while(S.xp>=xpNeed(S.lvl)){S.xp-=xpNeed(S.lvl);S.lvl++;up=true}updateHud();return up}
function addApples(n,at){if(!n)return;S.apples+=n;popAt(at,`+${n} 🍎`);updateHud()}

// ---------------------------------------------------------------- sound effects (made in the browser)
let AC=null;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}if(AC&&AC.state==='suspended')AC.resume();return AC}
document.addEventListener('pointerdown',()=>audio(),{capture:true,once:true});
function tone(f,t0,dur,type='sine',vol=.16,slide=0){const ac=AC;if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f*slide),t0+dur);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.012);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+dur+.05)}
function sfx(name){if(!S.opt.sound)return;const ac=audio();if(!ac)return;const t=ac.currentTime+.01;
 switch(name){
  case 'tap':tone(660,t,.06,'triangle',.07);break;
  case 'tile':tone(520,t,.05,'square',.04);tone(780,t+.04,.06,'triangle',.06);break;
  case 'step':tone(420+Math.random()*60,t,.05,'triangle',.05);break;
  case 'move':tone(300,t,.07,'sine',.08,1.5);break;
  case 'turn':tone(500,t,.06,'triangle',.05,.8);break;
  case 'eat':tone(700,t,.06,'square',.05);tone(980,t+.06,.1,'square',.05);break;
  case 'bump':tone(160,t,.18,'sine',.14,.6);break;
  case 'draw':tone(880,t,.04,'sine',.025);break;
  case 'print':tone(1200,t,.03,'square',.025);break;
  case 'good':[523,659,784].forEach((f,k)=>tone(f,t+k*.07,.18,'triangle',.13));break;
  case 'oops':tone(392,t,.14,'triangle',.1);tone(330,t+.12,.2,'triangle',.08);break;
  case 'win':[523,659,784,1047].forEach((f,k)=>tone(f,t+k*.1,.3,'triangle',.13));tone(1047,t+.4,.5,'sine',.07);break;
  case 'coin':tone(988,t,.08,'square',.05);tone(1319,t+.07,.16,'square',.05);break;
  case 'fanfare':[523,523,523,659,784,659,784,1047].forEach((f,k)=>tone(f,t+k*.13,k===7?.8:.16,'square',.06));break;
  default:tone(520,t,.08,'triangle',.07)}}

// ---------------------------------------------------------------- voice (Py reads story lines, hints and explanations; code is never read)
let voices=[];
const NOVELTY=/albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|deranged|hysterical|grandma|grandpa|eddy|flo\b|reed|rocko|sandy|shelley/i;
function loadVoices(){try{voices=speechSynthesis.getVoices().filter(v=>(v.lang||'').toLowerCase().startsWith(LANG)&&!NOVELTY.test(v.name))}catch(e){voices=[]}}
if('speechSynthesis' in window){loadVoices();try{speechSynthesis.addEventListener('voiceschanged',loadVoices)}catch(e){}}
const bestVoice=()=>voices.find(v=>/google|yuna|sora|samantha|ava|allison|natural|premium|enhanced|siri/i.test(v.name))||voices[0]||null;
// read code names plainly: `move()` → "move", symbols and emoji dropped
function speakable(t){t=String(t).replace(/<[^>]+>/g,' ');
 t=t.replace(/`([^`]*)`/g,(m,c)=>' '+c.replace(/[()[\]{}:"'#=<>.,_*+\-/%]/g,' ').replace(/\s+/g,' ').trim()+' ');
 t=t.replace(/[→➡]/g,' ').replace(/\p{Extended_Pictographic}|‍|️/gu,' ').replace(/[▶⏹👣💡]/g,' ');
 return t.replace(/[()…·•"“”]/g,' ').replace(/\s+/g,' ').trim()}
let pendingSay=null,saySeq=0;
document.addEventListener('pointerdown',()=>{const p=pendingSay;pendingSay=null;if(p)setTimeout(()=>{if(p.seq===saySeq)say(p.t,p.o)},250)},{capture:true,once:true});
function say(text,o={}){const end=o.onend||null;if(!(S.opt.voice||o.force)||!('speechSynthesis' in window)||!text){if(end)setTimeout(end,200);return}
 saySeq++;const seq=saySeq;if(navigator.userActivation&&!navigator.userActivation.hasBeenActive){pendingSay={t:text,o,seq};if(end)setTimeout(end,200);return}
 try{speechSynthesis.cancel();const words=speakable(text),u=new SpeechSynthesisUtterance(words),v=bestVoice();if(v)u.voice=v;u.lang=LANG==='en'?'en-US':'ko-KR';u.rate=LANG==='en'?.95:1;u.pitch=1.15;

function hl(line,slot){let out='',m;const re=new RegExp(TOK.source,TOK.flags),s=String(line);   // own copy: slots call hl() again
 while((m=re.exec(s))&&m[0]){const [w,sl,cm,st,nu,nm]=m;
  if(sl)out+=slot?slot(sl.slice(2,-2).split('|')):`<span class="t-st">${esc(sl.slice(2,-2).split('|')[0])}</span>`;
  else if(cm)out+=`<span class="t-cm">${esc(cm)}</span>`;else if(st)out+=`<span class="t-st">${esc(st)}</span>`;else if(nu)out+=`<span class="t-nu">${esc(nu)}</span>`;
  else if(nm){const after=s.slice(re.lastIndex);out+=`<span class="${PYKW.has(nm)?'t-kw':PYBI.has(nm)?'t-bi':/^\s*\(/.test(after)?'t-fn':'t-nm'}">${esc(nm)}</span>`}
  else out+=esc(w)}
 return out}
// leading spaces become indent guides so children can see which lines are "inside"
function indentHTML(line){const m=/^( *)/.exec(line)[1].length,lv=Math.floor(m/4),rest=m%4;return '<i class="ind"></i>'.repeat(lv)+' '.repeat(rest)}
function codeHTML(code,o={}){let k=0;const ls=String(code).split('\n');
 return `<div class="code ${o.cls||''}">${ls.map((l,i)=>{const n=i+1,cls=[o.cur===n?'cur':'',o.err===n?'err':'',o.sel===n?'sel':'',o.mark&&o.mark[n]?o.mark[n]:'',i<(o.lock||0)?'lock':''].join(' ');
  const body=hl(l.replace(/^ +/,''),o.slot?(opts)=>o.slot(k++,opts,n):null),cap=o.capt?o.capt(i,l):null;
  return `<div class="cl ${cls}" data-ln="${n}"><span class="ln">${n}</span><span class="ct">${indentHTML(l)}${body||'&nbsp;'}${cap?`<span class="lcap">${esc(cap)}</span>`:''}</span></div>`}).join('')}</div>`}
// the faint meaning after each line (setting "코드 뜻 보기", on unless switched off)
const captOn=()=>S.opt.capt!==false;
const capFn=(fill)=>captOn()?(i,l)=>CAPTION.of(fill?fill(i,l):l):null;

// ---------------------------------------------------------------- the garden grid (Py the snake from above)
const CELL={'#':'🪨','T':'🌳','~':'','F':'🌼','G':'🏠'};
const DIRANG={E:0,S:90,W:180,N:-90};
function pyHeadSVG(){const c=COLORS[S.wear.color]||COLORS.leaf,main=c[0].startsWith('url')?(S.wear.color==='gold'?'#ffc53d':'#4fb6ff'):c[0];
 return `<svg viewBox="0 0 40 40"><ellipse cx="20" cy="20" rx="17" ry="14" fill="${main}" stroke="${c[1]}" stroke-width="2"/><circle cx="27" cy="13" r="4.2" fill="#fff"/><circle cx="27" cy="27" r="4.2" fill="#fff"/><circle cx="28.4" cy="13" r="2.4" fill="#1f2b55"/><circle cx="28.4" cy="27" r="2.4" fill="#1f2b55"/><circle cx="12" cy="20" r="2" fill="${c[1]}" opacity=".5"/><path class="tongue" d="M37 20 h5 l2 -2 M42 20 l2 2" stroke="#ff4f6d" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`}
function GridView(host,cfg){const g=STAGE.parseGrid(cfg);let cs=48;
 const st={x:g.px,y:g.py,d:g.dir,ang:DIRANG[g.dir],trail:[],grow:0,food:{...g.food}};
 function size(){const w=Math.max(200,(host.clientWidth||340)-8);cs=Math.floor(Math.min(56,w/g.w,(innerHeight*.42)/g.h));host.style.setProperty('--cs',cs+'px')}
 function cellHTML(x,y){const c=(g.rows[y]&&g.rows[y][x])||'.',k=x+','+y,n=st.food[k]||0;
  return `<div class="gc ${c==='~'?'water':c==='#'||c==='T'?'block':''} ${(x+y)%2?'odd':''}" data-k="${k}">${CELL[c]||''}${n?`<span class="apple">🍎${n>1?`<b>${n}</b>`:''}</span>`:''}</div>`}
 function draw(){size();let h='';for(let y=0;y<g.h;y++)for(let x=0;x<g.w;x++)h+=cellHTML(x,y);
  host.innerHTML=`<div class="grid" style="grid-template-columns:repeat(${g.w},var(--cs));width:calc(${g.w} * var(--cs))">${h}<div class="body" id="gBody"></div><div class="head" id="gHead">${pyHeadSVG()}</div><div class="gsay" id="gSay"></div></div><div class="gstat" id="gStat"></div>`;
  place(true);stat()}
 const headEl=()=>host.querySelector('.head'),bodyEl=()=>host.querySelector('.body');
 function place(instant){const h=headEl();if(!h)return;h.style.transition=instant?'none':'';h.style.transform=`translate(${st.x*cs}px,${st.y*cs}px) rotate(${st.ang}deg)`;
  const b=bodyEl(),seg=st.trail.slice(-(1+st.grow));b.innerHTML=seg.map((p,i)=>`<i style="transform:translate(${p[0]*cs}px,${p[1]*cs}px) scale(${.55+.35*(i+1)/seg.length})"></i>`).join('')}
 function stat(){const left=Object.values(st.food).reduce((t,n)=>t+n,0),el=host.querySelector('#gStat');if(!el)return;
  el.innerHTML=`${g.apples?`<span>🍎 ${L(`남은 사과 ${left}개`,`${left} apple${left===1?'':'s'} left`)}</span>`:''}${g.goal?`<span>🏠 ${L('집으로 가요','Go home')}</span>`:''}`}
 function bubble(text,cls=''){const b=host.querySelector('#gSay');if(!b)return;b.className='gsay show '+cls;b.textContent=text;b.style.transform=`translate(${st.x*cs+cs/2}px,${st.y*cs}px)`;clearTimeout(b._t);b._t=setTimeout(()=>b.classList.remove('show'),1300)}
 function apply(ev,dur){const h=headEl();if(!h)return 0;
  switch(ev.a){
   case 'move':st.trail.push([st.x,st.y]);if(st.trail.length>40)st.trail.shift();st.x=ev.x;st.y=ev.y;place();sfx('move');return dur;
   case 'turn':st.ang+=ev.s==='L'?-90:90;st.d=ev.d;place();sfx('turn');return dur*.7;
   case 'eat':{const k=ev.x+','+ev.y;st.food[k]=Math.max(0,(st.food[k]||0)-1);const c=host.querySelector(`[data-k="${k}"]`);if(c)c.outerHTML=cellHTML(ev.x,ev.y);st.grow++;place();h.classList.remove('chomp');void h.offsetWidth;h.classList.add('chomp');bubble(L('냠!','Yum!'),'yum');sfx('eat');stat();return dur}
   case 'bump':h.classList.remove('bump');void h.offsetWidth;h.classList.add('bump');bubble(L('쿵!','Bonk!'),'oops');sfx('bump');return dur*1.4;
   case 'nothing':bubble('?','oops');sfx('oops');return dur;
   case 'look':return dur*.35;
   case 'say':bubble(ev.s);sfx('print');return dur*1.5}
  return 0}
 draw();
 return {apply,reset:()=>{Object.assign(st,{x:g.px,y:g.py,d:g.dir,ang:DIRANG[g.dir],trail:[],grow:0,food:{...g.food}});draw()},redraw:draw,el:host}}

// ---------------------------------------------------------------- the turtle board (three stacked canvases: paper+target, ink, turtle)
function TurtleView(host,o={}){const W=400;let px=340,scale=1,dpr=Math.min(2,window.devicePixelRatio||1);
 host.innerHTML=`<div class="tboard"><canvas class="tc0"></canvas><canvas class="tc1"></canvas><canvas class="tc2"></canvas></div>`;
 const [c0,c1,c2]=host.querySelectorAll('canvas');const x0=c0.getContext('2d'),x1=c1.getContext('2d'),x2=c2.getContext('2d');
 let target=o.target||null,bg=null,turtles=[{x:0,y:0,h:0,show:true,c:'black'}],anim=null,view=200;
 function fit(extra){let m=200;const look=d=>{if(!d)return;for(const s of d.segs)m=Math.max(m,Math.abs(s.x1),Math.abs(s.y1),Math.abs(s.x2),Math.abs(s.y2));for(const p of d.dots)m=Math.max(m,Math.abs(p.x)+p.s/2);for(const t of d.texts)m=Math.max(m,Math.abs(t.x)+20,Math.abs(t.y)+10)};look(target);look(extra);view=Math.min(2000,m*1.05)}
 function size(){px=Math.min(Math.max(220,(host.clientWidth||340)-4),420);for(const c of [c0,c1,c2]){c.width=px*dpr;c.height=px*dpr;c.style.width=c.style.height=px+'px'}host.querySelector('.tboard').style.width=host.querySelector('.tboard').style.height=px+'px';scale=px/(2*view)}
 const P=(x,y)=>[(x+view)*scale*dpr,(view-y)*scale*dpr];
 function paper(){x0.setTransform(1,0,0,1,0,0);x0.fillStyle=bg||'#fffdf6';x0.fillRect(0,0,c0.width,c0.height);
  x0.strokeStyle='rgba(80,110,170,.09)';x0.lineWidth=1;const step=50;for(let v=-Math.floor(view/step)*step;v<=view;v+=step){const [a]=P(v,0),[,b]=P(0,v);x0.beginPath();x0.moveTo(a,0);x0.lineTo(a,c0.height);x0.stroke();x0.beginPath();x0.moveTo(0,b);x0.lineTo(c0.width,b);x0.stroke()}
  x0.strokeStyle='rgba(80,110,170,.2)';const [ox,oy]=P(0,0);x0.beginPath();x0.moveTo(ox-6,oy);x0.lineTo(ox+6,oy);x0.moveTo(ox,oy-6);x0.lineTo(ox,oy+6);x0.stroke();
  if(target){x0.save();x0.setLineDash([6*dpr,6*dpr]);x0.strokeStyle='rgba(120,130,170,.55)';x0.lineWidth=3*dpr;x0.lineCap='round';
   for(const f of target.fills){x0.fillStyle='rgba(150,160,200,.15)';x0.beginPath();f.pts.forEach(([x,y],i)=>{const [a,b]=P(x,y);i?x0.lineTo(a,b):x0.moveTo(a,b)});x0.closePath();x0.fill()}
   for(const s of target.segs){const [a,b]=P(s.x1,s.y1),[c,d]=P(s.x2,s.y2);x0.beginPath();x0.moveTo(a,b);x0.lineTo(c,d);x0.stroke()}
   for(const p of target.dots){const [a,b]=P(p.x,p.y);x0.beginPath();x0.arc(a,b,Math.max(2,p.s/2*scale*dpr),0,7);x0.stroke()}x0.restore()}}
 const lw=w=>Math.max(1.5,w*scale*dpr*1.4);
 function line(ctx,s,t=1){const [a,b]=P(s.x1,s.y1),[c,d]=P(s.x1+(s.x2-s.x1)*t,s.y1+(s.y2-s.y1)*t);ctx.strokeStyle=s.c;ctx.lineWidth=lw(s.w||1);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke()}
 function sprite(){x2.setTransform(1,0,0,1,0,0);x2.clearRect(0,0,c2.width,c2.height);
  for(const t of turtles){if(!t.show)continue;const [a,b]=P(t.x,t.y),r=9*dpr*Math.max(.8,Math.min(1.4,scale*1.2));x2.save();x2.translate(a,b);x2.rotate(-t.h*Math.PI/180);
   x2.fillStyle='#7ad36b';for(const [lx,ly] of [[.5,.75],[.5,-.75],[-.6,.75],[-.6,-.75]]){x2.beginPath();x2.ellipse(lx*r,ly*r,r*.32,r*.22,0,0,7);x2.fill()}
   x2.beginPath();x2.arc(r*1.05,0,r*.38,0,7);x2.fill();x2.fillStyle='#1f2b55';x2.beginPath();x2.arc(r*1.18,-r*.14,r*.08,0,7);x2.arc(r*1.18,r*.14,r*.08,0,7);x2.fill();
   x2.fillStyle='#3f9b4a';x2.beginPath();x2.ellipse(0,0,r*.85,r*.7,0,0,7);x2.fill();x2.strokeStyle=t.c||'#1f2b55';x2.lineWidth=2*dpr;x2.stroke();
   x2.fillStyle='#62bd57';x2.beginPath();x2.ellipse(0,0,r*.45,r*.36,0,0,7);x2.fill();x2.restore()}}
 function inkDot(p){const [a,b]=P(p.x,p.y);x1.fillStyle=p.c;x1.beginPath();x1.arc(a,b,Math.max(1.5,p.s/2*scale*dpr),0,7);x1.fill()}
 function inkText(t){const [a,b]=P(t.x,t.y);x1.fillStyle=t.c;x1.font=`bold ${Math.round(14*dpr*Math.max(.8,scale))}px system-ui,sans-serif`;x1.fillText(t.s,a,b)}
 function inkFill(f){x1.save();x1.globalCompositeOperation='destination-over';x1.fillStyle=f.c;x1.beginPath();f.pts.forEach(([x,y],i)=>{const [a,b]=P(x,y);i?x1.lineTo(a,b):x1.moveTo(a,b)});x1.closePath();x1.fill();x1.restore()}
 function reset(extra){if(anim){cancelAnimationFrame(anim.raf);anim=null}bg=null;turtles=[{x:0,y:0,h:0,show:true,c:'black'}];fit(extra);size();paper();x1.setTransform(1,0,0,1,0,0);x1.clearRect(0,0,c1.width,c1.height);sprite()}
 const T0=k=>turtles[k||0]||(turtles[k||0]={x:0,y:0,h:0,show:true,c:'black'});
 // returns a promise that resolves when the event's animation ends
 function apply(ev,dur){const t=T0(ev.k);
  switch(ev.a){
   case 'line':case 'move':{const len=Math.hypot(ev.x2-ev.x1,ev.y2-ev.y1),d=Math.min(dur*1.6,Math.max(dur*.25,len*dur/130)),seg={x1:ev.x1,y1:ev.y1,x2:ev.x2,y2:ev.y2,c:ev.c,w:ev.w};if(ev.a==='line'&&len>3)sfx('draw');
    return new Promise(res=>{const t0=performance.now();const fr=now=>{const p=Math.min(1,(now-t0)/d);t.x=ev.x1+(ev.x2-ev.x1)*p;t.y=ev.y1+(ev.y2-ev.y1)*p;
     x2.setTransform(1,0,0,1,0,0);sprite();if(ev.a==='line')line(x2,seg,p);if(p<1){anim={raf:requestAnimationFrame(fr)}}else{anim=null;if(ev.a==='line')line(x1,seg);t.x=ev.x2;t.y=ev.y2;sprite();res()}};anim={raf:requestAnimationFrame(fr)}})}
   case 'turn':t.h=ev.h;sprite();return wait(dur*.35);
   case 'color':t.c=ev.c;sprite();return wait(0);
   case 'dot':inkDot(ev);return wait(dur*.4);case 'write':inkText(ev);sfx('print');return wait(dur*.5);
   case 'stamp':inkDot({x:ev.x,y:ev.y,s:12,c:ev.c});return wait(dur*.4);
   case 'fill':inkFill(ev);sfx('good');return wait(dur*.6);
   case 'bg':bg=ev.c;paper();return wait(0);
   case 'new':T0(ev.k);sprite();return wait(0);
   case 'show':t.show=ev.v;sprite();return wait(0)}
  return wait(0)}
 // draw a whole drawing at once (gallery thumbnails, fast-forward)
 function drawAll(dr){for(const f of dr.fills)inkFill(f);for(const s of dr.segs)line(x1,s);for(const p of dr.dots)inkDot(p);for(const t of dr.texts)inkText(t);if(dr.bg){bg=dr.bg;paper()}turtles=dr.turtles.map(t=>({...t}));sprite()}
 reset();
 return {apply,reset,drawAll,setTarget:d=>{target=d;reset()},el:host}}
const wait=ms=>new Promise(r=>setTimeout(r,Math.max(0,ms)));

function TextView(host,o={}){let buf='';
 host.innerHTML=`<div class="tconsole">${o.scene?`<div class="scene">${esc(o.scene)}</div>`:''}<div class="thead">💬 ${L('파이의 게시판','Py’s message board')}<small>${L('print 결과가 여기 보여요','print shows up here')}</small></div><pre class="tout" aria-live="polite"></pre><div class="tin"></div></div>`;

// ---------------------------------------------------------------- memory pictures: box, train, lockers, sticker pouch, cookie card
function valHTML(v){if(!v)return '';switch(v.t){
 case 'str':return `<span class="v-str">"${esc(v.r)}"</span>`;case 'int':case 'float':return `<span class="v-num">${esc(v.r)}</span>`;case 'bool':return `<span class="v-bool">${v.r}</span>`;case 'None':return '<span class="v-none">None</span>';
 case 'list':case 'tuple':return `<span class="v-mini">[${v.items.map(x=>valHTML(x)).join(', ')}${v.n>v.items.length?', …':''}]</span>`;
 case 'dict':return `<span class="v-mini">{${v.pairs.map(([k,x])=>valHTML(k)+': '+valHTML(x)).join(', ')}}</span>`;
 case 'set':return `<span class="v-mini">{${v.items.map(x=>valHTML(x)).join(', ')}}</span>`;
 case 'obj':return `<span class="v-obj">🍪 ${esc(v.cls)}</span>`;default:return `<span class="v-mini">${esc(v.r||v.t)}</span>`}}
function varCard(name,v,changed){const nm=`<b class="vn">${esc(name)}</b>`,ch=changed?' changed':'';
 switch(v.t){
  case 'list':case 'tuple':return `<div class="var train${ch}">${nm}<div class="cars"><span class="engine">${v.t==='tuple'?'🔒':'🚂'}</span>${v.items.map((x,i)=>`<span class="car"><span class="cv">${valHTML(x)}</span><small>${i}</small></span>`).join('')}${v.n>v.items.length?`<span class="car more">+${v.n-v.items.length}</span>`:''}${!v.n?`<span class="car empty">${L('빈 기차','empty')}</span>`:''}</div></div>`;
  case 'dict':return `<div class="var lockers${ch}">${nm}<div class="lks">${v.pairs.map(([k,x])=>`<span class="lk"><small>${valHTML(k)}</small><span>${valHTML(x)}</span></span>`).join('')}${!v.n?`<span class="lk empty">${L('빈 사물함','empty')}</span>`:''}</div></div>`;
  case 'set':return `<div class="var pouch${ch}">${nm}<div class="pch">${v.items.map(x=>`<span class="stk">${valHTML(x)}</span>`).join('')}${!v.n?`<span class="stk empty">${L('비어 있어요','empty')}</span>`:''}</div></div>`;
  case 'obj':return `<div class="var cookie${ch}">${nm}<div class="ck"><div class="ckh">🍪 ${esc(v.cls)}</div>${v.attrs.map(([k,x])=>`<div class="cka"><small>${esc(k)}</small>${valHTML(x)}</div>`).join('')||`<div class="cka"><small>${L('속성 없음','no attributes')}</small></div>`}</div></div>`;
  case 'func':return `<div class="var chipv${ch}">${nm}<span class="fnchip">🛠️ ${esc(v.r)}</span></div>`;
  case 'class':return `<div class="var chipv${ch}">${nm}<span class="fnchip">🍪 ${L('틀','cutter')} ${esc(v.r)}</span></div>`;
  default:return `<div class="var box${ch}">${nm}<span class="bx">${valHTML(v)}</span><small class="vt">${v.t==='str'?L('글자','text'):v.t==='int'||v.t==='float'?L('숫자','number'):v.t}</small></div>`}}
function MemView(host){let prev={};
 function render(snap){if(!snap){host.innerHTML='';host.classList.add('hidden');return}
  const g=snap.g||[],l=snap.l?{fn:snap.fn,l:snap.l}:null;if(!g.length&&!l){host.classList.add('hidden');host.innerHTML='';return}host.classList.remove('hidden');
  const now={};const card=(scope,[k,v])=>{const key=scope+k,j=JSON.stringify(v);now[key]=j;return varCard(k,v,prev[key]!==undefined&&prev[key]!==j||prev[key]===undefined&&Object.keys(prev).length>0)};
  host.innerHTML=`<div class="memh">📦 ${L('메모리','Memory')}<small>${L('변수가 지금 담고 있는 값','what each variable holds now')}</small></div><div class="vars">${g.map(x=>card('g',x)).join('')}</div>${l?`<div class="memh sub">🛠️ ${esc(l.fn)}() ${L('안의 변수','variables')}</div><div class="vars local">${l.l.map(x=>card('l',x)).join('')||`<small class="muted">${L('아직 없어요','none yet')}</small>`}</div>`:''}`;
  prev=now}
 return {render,reset:()=>{prev={};render(null)}}}

function chooser(title,opts,cur,then,o={}){

// ---------------------------------------------------------------- editors (one per mission kind); each gives code() and draws itself

 if(h.length)pool.push(['hat',pick(h)[0]]);if(a.length)pool.push(['acc',pick(a)[0]]);if(dk.length&&big)pool.push(['deco',pick(dk)]);

// the shortest program for a dish: with the loop chip, a repeating run of layers becomes a 🔁 loop when that saves lines
function dishCode(d,loop=hasSkill('for')){const out=[];let i=0;
 while(i<d.length){let best=null;
  if(loop)for(let p=1;p<=3;p++){let n=1;while(i+p*(n+1)<=d.length&&d.slice(i,i+p).every((x,k)=>x===d[i+p*n+k]))n++;const gain=p*n-(p+1);if(n>=2&&gain>0&&(!best||gain>best.gain))best={p,n,gain}}
  if(best){out.push(`for i in range(${best.n}):`,...d.slice(i,i+best.p).map(x=>`    ${x}()`));i+=best.p*best.n}else out.push(d[i++]+'()')}
 return [...out,'serve()']}

async function runCode(step=false){const m=P.m;const code=currentCode();

 for(;;){const res=await play(r,{step,skip});if(res==='stopped')return;
  if(!r.need)break;
  const ans=m.stage==='text'?await P.view.ask(r.need.prompt):await askModal(r.need.prompt);if(!P||P.m!==m)return;

async function play(r,o={}){const my=++PLAY.n,m=P.m;P.running=true;P.stepping=!!o.step;PLAY.queued=0;runbar();
 if(P.view.reset)P.view.reset(m.stage==='turtle'?r.stage.drawing():undefined);P.mem.reset();P.ed.mark&&P.ed.mark(0,0);
 const strip=$('outstrip');if(strip){strip.classList.add('hidden');strip.textContent=''}
 const sp=S.opt.speed||1,base=(m.kind==='watch'?560:340)/sp,evs=r.events,said=new Set();let ei=0;
 const applyEv=async(ev,fast)=>{if(ev.t==='out'){if(m.stage==='text')P.view.apply(ev,fast?0:base);else if(strip){strip.classList.remove('hidden');strip.textContent+=ev.s;strip.scrollTop=strip.scrollHeight}return}
  if(ev.t==='act'){const d=P.view.apply(ev,fast?0:base);if(!fast)await (d&&d.then?d:wait(d))}};
 for(let i=0;i<r.trace.length;i++){if(PLAY.n!==my)return 'stopped';const t=r.trace[i],fast=i<(o.skip||0);
  if(t.line){P.ed.mark&&P.ed.mark(t.line,0);if(!fast)sfx('step')}
  if(m.kind==='watch'&&m.notes&&t.line&&m.notes[t.line]&&!said.has(t.line)&&!fast){said.add(t.line);const note=T(m.notes[t.line]);pySays(`<p><b>${L(`${t.line}번째 줄`,`Line ${t.line}`)}</b> · ${tx(m.notes[t.line])}</p>`,'think');
   // in step mode the note is read while things move; in a normal run the voice gets a moment first (never more than a few seconds)
   if(o.step)say(note);else{await new Promise(res=>{let done=false;const f=()=>{if(!done){done=true;res()}};say(note,{onend:f});setTimeout(f,Math.min(4000,900+note.length*55)/sp)});if(PLAY.n!==my)return 'stopped'}}
  let any=false;while(ei<evs.length&&evs[ei].step===i){any=true;await applyEv(evs[ei++],fast);if(PLAY.n!==my)return 'stopped'}
  P.mem.render((r.trace[i+1]||t).vars);
  if(fast)continue;
  if(o.step&&t.line){if(PLAY.queued>0)PLAY.queued--;else{await new Promise(res=>{PLAY.next=res;runbar()});PLAY.next=null}if(PLAY.n!==my)return 'stopped'}
  else await wait(any?base*.35:base)}
 while(ei<evs.length)await applyEv(evs[ei++],true);
 if(r.trace.length>=2500){const last=r.trace[r.trace.length-1];if(last.vars)P.mem.render(last.vars)}
 if(m.stage==='turtle'&&r.trace.length>=2500){P.view.reset(r.stage.drawing());P.view.drawAll(r.stage.drawing())}
 P.running=false;P.stepping=false;runbar();return 'done'}

   ${m.bonus&&!S.done[m.id].b?`<div class="bonusbox">⭐ <b>${L('도전 미션','Challenge')}</b> ${esc(LANG==='en'?m.bonus.en:m.bonus.ko)}<button class="btn ghost small" type="button" data-act="close">${L('도전해 볼래요','I’ll try')}</button></div>`:''}

   {cls:'result',acts:{again:()=>()=>openMission(m.id),next:()=>()=>{if(wasAll)worldComplete(w);else if(nx&&nx.world===m.world)openMission(nx.id);else go('school')}}})},900)}

function startReview(){const q=reviewDue();if(!q.length){toast(L('오늘의 기억 퀴즈를 다 했어요!','Today’s memory quiz is done!'));return}openMission(q[0],{review:{q,i:0}})}

 addXP(3);addApples(1,$('runbar'));save();sfx('good');

 else{if(P.labErr){S.stats.fixed++;P.labErr=false}sfx('good');pySays(`<p>✨ ${pick([L('멋진 코드예요!','Lovely code!'),L('잘 돌아가요!','It runs!'),L('직접 만든 프로그램이에요!','A program you made yourself!')])}</p>`,'happy')}
 save(true)}
function examples(){const st=LAB.stage;modal(`<h2>📚 ${L('예제 불러오기','Load an example')}</h2><p class="muted">${L('예제를 실행해 보고, 숫자나 색을 바꿔 보세요!','Run an example, then change its numbers or colours!')}</p><div class="chooser">${EXAMPLES[st].map((e,i)=>`<button type="button" class="chopt" data-act="ex" data-i="${i}">${L(e[0],e[1])}</button>`).join('')}</div>`,{acts:{ex:b=>{const e=EXAMPLES[st][+b.dataset.i];LAB.code[st]=e[2];RENDER.lab()}}})}

// ---------------------------------------------------------------- my works (gallery)
function saveWork(w){S.works.unshift({id:'k'+now(),t:dayKey(),...w});S.works=S.works.slice(0,40);S.stats.works++;save(true);checkTrophies();
 if(S.works.length===1)setTimeout(()=>coachTalk('clap','첫 작품이 생겼어요! 문 코치도 보고 싶어요. 🎒 내 파이 → 작품에서 언제든 다시 볼 수 있어요.|Your first work! Coach Moon wants to see it. Find it in 🎒 My Py → Works.'),2500)}
// ---------------------------------------------------------------- welcome and the player card
function welcome(){modal(`<div class="big">${pySVG('wow',{cls:'big'})}</div><h2>${L('파이의 로봇 버거 가게에 온 걸 환영해요!','Welcome to Py’s Robot Burger shop!')}</h2>
  ${pyLine('안녕! 나는 아기 뱀 파이예요. 섬에 로봇 버거 가게를 열었는데… 로봇들이 요리를 하나도 몰라요!|Hi! I’m Py, a baby python. I opened a robot burger shop on the island… but the robots can’t cook a thing!','oops')}
  <div class="pyline coachline"><img class="cimg" src="images/coach-moon-hi.webp" alt=""><div class="bubble"><p><b>🌙 ${L('문 코치','Coach Moon')}</b> ${L('로봇은 진짜 파이썬 코드대로만 움직여요. 우리가 코드를 가르치면 로봇이 요리하고, 손님이 오고, 가게가 커져요. 내가 옆에서 같이 할게요!','Robots only follow real Python code. Teach them code and they cook, diners come and the shop grows. I’ll be right beside you!')}</p></div></div>
  <ul class="howlist"><li>🤖 ${L('로봇을 눌러 레시피 코드를 가르쳐요.','Tap a robot and teach it a recipe in code.')}</li><li>🍔 ${L('내 캐릭터로 걸어 다니며 버거를 손님께 가져다줘요.','Walk around as yourself and carry burgers to diners.')}</li><li>🛠️ ${L('사과로 로봇, 테이블, 칩을 늘리고 새 메뉴를 열어요.','Spend apples on robots, tables and chips; open new menu items.')}</li><li>🏫 ${L('학교에서 문 코치와 더 배우고, 🎡 놀이공원에서 놀아요.','Learn more with Coach Moon at 🏫 school and play at the 🎡 funpark.')}</li></ul>
  <button class="btn wide" type="button" data-act="go">🍔 ${L('가게 문 열기!','Open the shop!')}</button>`,{cls:'wide',closable:false,onOpen:()=>sayLines([L('안녕! 나는 아기 뱀 파이예요. 섬에 로봇 버거 가게를 열었는데, 로봇들이 요리를 하나도 몰라요!','Hi! I’m Py, a baby python. I opened a robot burger shop on the island, but the robots can’t cook a thing!'),L('로봇은 진짜 파이썬 코드대로만 움직여요. 우리가 코드를 가르치면 로봇이 요리하고, 가게가 커져요. 내가 옆에서 같이 할게요!','Robots only follow real Python code. Teach them code and they cook, and the shop grows. I’ll be right beside you!')]),
  acts:{go:()=>{S.tut.hello=1;save();return ()=>{if(VIEW!=='home')go('home');else RENDER.home()}}}})}
function meCard(){const t=titleOf(S.lvl);modal(`<div class="big">${esc(S.av)}</div><h2>${esc(S.name)}</h2><p><b>${t.icon} ${esc(t.name)}</b> · ${L(`레벨 ${S.lvl}`,`Level ${S.lvl}`)}</p><div class="meter"><i style="width:${Math.min(100,100*S.xp/xpNeed(S.lvl))}%"></i></div><p class="muted">${L(`다음 레벨까지 ${xpNeed(S.lvl)-S.xp} XP`,`${xpNeed(S.lvl)-S.xp} XP to the next level`)}</p>
  <div class="statrow"><span><b>${Object.keys(S.done).length}</b><small>${L('미션','missions')}</small></span><span><b>${S.stats.runs}</b><small>▶ ${L('실행','runs')}</small></span><span><b>${S.stats.fixed}</b><small>🐞 ${L('고친 버그','bugs fixed')}</small></span><span><b>${S.stats.reviews}</b><small>🧠 ${L('복습','reviews')}</small></span></div>
  <p class="muted">${L('레벨은 미션과 복습을 할 때마다 올라요.','Levels grow with every mission and review.')}</p>`)}

// ---------------------------------------------------------------- one click handler per area
function wire(){
 document.querySelector('.nav').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b)return;sfx('tap');go(b.dataset.v)});
 $('gearBtn').addEventListener('click',()=>{sfx('tap');settings()});
 $('hudLvlBtn').addEventListener('click',()=>{sfx('tap');meCard()});
 $('hudApplePill').addEventListener('click',()=>{sfx('tap');go('shop')});
 $('hudTicketPill').addEventListener('click',()=>{sfx('tap');go('arcade')});
 $('hudBugPill').addEventListener('click',()=>{sfx('tap');modal(`<div class="big">🐞</div><h2>${L(`고친 버그 ${S.stats.fixed}개`,`${S.stats.fixed} bugs fixed`)}</h2>${pyLine('버그를 만나고 고칠 때마다 이 숫자가 늘어요. 진짜 개발자도 매일 버그를 고쳐요!|This grows each time you meet a bug and fix it. Real coders fix bugs every day!','happy')}`)});
 document.querySelector('main').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  switch(a){
   case 'home':sfx('tap');go('home');break;
   case 'place':sfx('tap');placeSheet(+b.dataset.n);break;
   case 'spot':sfx('tap');spotSheet(b.dataset.s);break;
   case 'req':sfx('tap');reqSheet(+b.dataset.i);break;
   case 'king':sfx('tap');if(kingReady())startBossFlow(13);else coachTalk('idea','모든 장소의 보스를 물리치면 버그 대왕 버글과 마지막 대결을 해요!|Beat every place’s boss to face King Buggle!');break;
   case 'chest':sfx('tap');openDailyChest();break;
   case 'ride':startRide(b.dataset.g);break;
   case 'lab':sfx('tap');go('lab');break;
   case 'mission':sfx('tap');openMission(b.dataset.id);break;
   case 'review':sfx('tap');startReview();break;
   case 'back':sfx('tap');if(P&&P.lab)go('arcade');else if(P&&P.m&&P.m.rb)go('home');else go('school');break;
   case 'hint':hint();break;
   case 'run':if(!P)break;P.lab?labRun(false):runCode(false);break;
   case 'step':if(!P)break;P.lab?labRun(true):runCode(true);break;
   case 'nextstep':sfx('tap');if(PLAY.next){const f=PLAY.next;PLAY.next=null;f()}else if(P&&P.running)PLAY.queued=Math.min(3,(PLAY.queued||0)+1);break;
   case 'stop':sfx('tap');stopPlay();runbar();pySays(`<p>⏹ ${L('멈췄어요. 다시 ▶ 실행할 수 있어요.','Stopped. You can press ▶ again.')}</p>`);break;
   case 'reset':sfx('tap');P.view.reset&&P.view.reset();P.mem.reset();P.ed.mark&&P.ed.mark(0,0);{const s=$('outstrip');if(s)s.classList.add('hidden')}break;
   case 'predict':predictPick(+b.dataset.i);break;
   case 'replay':runCode(false);break;
   case 'gotit':sfx('tap');success(P.m.code,{predicted:false});break;
   case 'choose':choosePick(+b.dataset.i);break;
   case 'mode':{const t=b.dataset.v==='type';if(t===!!P.typing)return;S.drafts[P.m.id]=P.ed.raw?P.ed.raw():P.ed.code()||'';P.typing=t;sfx('tap');setupEditor();break}
   case 'labst':sfx('tap');LAB.stage=b.dataset.v;RENDER.lab();break;
   case 'examples':sfx('tap');examples();break;
   case 'labsave':{const code=P.ed.code();if(!code){toast(L('먼저 코드를 써요','Write some code first'));return}sfx('coin');saveWork({stage:LAB.stage,code,title:L(`내 작품 ${S.works.length+1}`,`My work ${S.works.length+1}`),grid:LAB.stage==='grid'?LABGRID:null});toast('💾 '+L('작품에 저장했어요!','Saved to My works!'));break}
   case 'labclear':sfx('tap');LAB.code[LAB.stage]=LAB.stage==='turtle'?'from turtle import *\n':'';RENDER.lab();break;
   case 'wopen':{const w=S.works[+b.dataset.i];if(!w)return;sfx('tap');LAB.stage=w.stage;LAB.code[w.stage]=w.code;go('lab');break}
   case 'wdel':{const i=+b.dataset.i;sfx('tap');modal(`<h2>🗑 ${L('이 작품을 지울까요?','Delete this work?')}</h2><p>${L('지우면 되돌릴 수 없어요.','This can’t be undone.')}</p><div class="row"><button class="btn ghost" type="button" data-act="close">${L('아니요','No')}</button><button class="btn danger" type="button" data-act="yes">${L('지울래요','Delete')}</button></div>`,{acts:{yes:()=>{S.works.splice(i,1);save();return ()=>RENDER.me()}}});break}
   case 'stab':sfx('tap');SHOP=b.dataset.v;RENDER.shop();break;
   case 'buy':buy(b.dataset.k,b.dataset.id);break;
   case 'mtab':sfx('tap');ME=b.dataset.v;RENDER.me();break;
   case 'dtab':sfx('tap');DRESS=b.dataset.v;RENDER[VIEW]();break;
   case 'ditem':dressItem(b.dataset.id);break}})}

// ---------------------------------------------------------------- start-up
function boot(){applyLang();document.body.classList.toggle('bigcode',!!S.opt.big);markDay();updateHud();wire();
 const q=new URLSearchParams(location.search),mid=q.get('m');
 if(mid&&MBY[mid]){go('school');openMission(mid,{review:null,force:true})}else go(q.get('v')&&RENDER[q.get('v')]&&q.get('v')!=='play'?q.get('v'):'home');
 if(!S.tut.hello&&!mid)welcome()}
boot();
</script>
<script>try{coachStart(['꼬마 파이썬 섬에 온 걸 환영해요!','Welcome to Little Python Island!'],[['코드가 안 될 때는 👣 한 줄씩 실행해 보면 버그가 잘 보여요.','When code doesn’t work, 👣 step through it line by line to spot the bug.'],['틀린 코드도 소중해요. 무엇이 다른지 비교하면서 배우거든요.','Wrong code is precious too. You learn by comparing what’s different.'],['하루에 미션 한두 개면 충분해요. 꾸준함이 최고예요!','One or two missions a day is plenty. Steady wins!']])}catch(e){}</script>
