    thumb:'<div class="thumb t-aqua" aria-hidden="true"><img class="cover" src="images/cover-aquarium.webp" alt="" onerror="this.remove()"><div class="kelp" style="left:6%"></div><div class="kelp" style="left:88%;animation-delay:-1.4s"></div><span class="ic" style="left:12%;top:18%">🐠</span><span class="ic" style="left:70%;top:14%">🐙</span><span class="ic big" style="left:40%;top:34%">🐳</span><span class="ic" style="left:18%;top:60%">🦀</span><span class="ic" style="left:72%;top:58%">🐡</span><span class="math" style="left:56%;top:12%">7×8</span><span class="math" style="left:8%;top:42%">½+¼</span><span class="math" style="left:78%;top:36%">+</span><i class="bb" style="left:30%"></i><i class="bb" style="left:62%;animation-delay:-1.5s"></i><i class="bb" style="left:84%;animation-delay:-2.6s"></i></div>',

    tags:[['🧮 1~6학년 수학','🧮 Grades 1–6 math'],['🐠 아쿠아리움 경영','🐠 Run an aquarium'],['🇰🇷🇨🇦 한국·캐나다 교육과정','🇰🇷🇨🇦 Korea + Canada curricula']],

    tags:[['🐍 진짜 파이썬','🐍 Real Python'],['⚔️ 버그 보스 13','⚔️ 13 bug bosses'],['🎡 놀이기구 미니게임','🎡 Ride mini-games']],
    stat:()=>{const d=readSave('pythonIsland.v1');const n=d&&d.done?Object.keys(d.done).length:0;return n?L(`🐍 Lv.${d.lvl} · 마친 미션 ${n}개 · 고친 버그 ${(d.stats&&d.stats.fixed)||0}개`,`🐍 Lv.${d.lvl} · ${n} mission${n===1?'':'s'} · ${(d.stats&&d.stats.fixed)||0} bugs fixed`):''}

const pick=pair=>L(pair[0],pair[1]);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);

// ---------------------------------------------------------------- player profiles
// Profiles live only on this device. Every game stores its save under "key@profileId", so each player keeps
// separate progress and resetting one game never touches another game or another player.
const PKEY='moonGames.profiles',LKEY='moonGames.legacy';
const GAME_KEYS=[['little-detective-v3','🕵️','꼬마 탐정단|Little Detectives'],['marbleRush.v2','🔮','마블 레이스|Marble Rush'],['marble3dsettings','🔮','마블 레이스(예전 설정)|Marble Rush (old settings)'],['chessKnights.v1','♞','꼬마 체스 기사단|Little Chess Knights'],['scienceGuardians.v1','🔬','꼬마 과학 수호대|Little Science Guardians'],['musicAcademy.v1','🎵','꼬마 음악 아카데미|Little Music Academy'],['pythonIsland.v1','🐍','꼬마 파이썬 섬|Little Python Island'],['mathAquarium.v1','🐠','꼬마 수학 아쿠아리움|Little Math Aquarium']];
const AV=['🐰','🐻','🦊','🐼','🐨','🐯','🦁','🐸','🐱','🐶','🐥','🦄','🐙','🐬','🦖','⭐'];
const T2=s=>{const [k,e]=s.split('|');return L(k,e||k)};
const getJ=(k,d=null)=>{try{const v=JSON.parse(localStorage.getItem(k)||'null');return v==null?d:v}catch(e){return d}};
const setJ=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let PROF=getJ(PKEY,{list:[],cur:null});if(!Array.isArray(PROF.list))PROF={list:[],cur:null};
const me=()=>PROF.list.find(p=>p.id===PROF.cur)||null;
const saveProf=()=>setJ(PKEY,PROF);
// Each game saves its own progress in this browser; show the current player's progress on the card.
const readSave=key=>{const m=me();return getJ(m?key+'@'+m.id:key)};
function renderGames(){document.getElementById('games').innerHTML=GAMES.map(g=>`
  <a class="card" href="${esc(g.file)}?lang=${LANG}">
    ${g.thumb}
    <div class="body">
      <div class="title"><h2>${esc(pick(g.title))}</h2><span class="age">${esc(pick(g.age))}</span></div>
      <p class="desc">${esc(pick(g.desc))}</p>
      <ul class="tags">${g.tags.map(t=>`<li>${esc(pick(t))}</li>`).join('')}</ul>
      ${(s=>s?`<span class="stat">${esc(s)}</span>`:'')((()=>{try{return g.stat?.()}catch(e){return ''}})())}
      <span class="play">▶ ${L('플레이','Play')}</span>
    </div>
  </a>`).join('');
 renderCoach()}
function renderWho(){const el=$('who');
 if(!PROF.list.length){el.innerHTML=`<div class="psetup"><b>👨‍👩‍👧 ${L('프로필을 만들면 형제자매가 모든 게임 기록을 따로 가질 수 있어요!','Make a profile for each player so everyone keeps their own progress in every game!')}</b><button type="button" class="pbtn" data-pa="add">➕ ${L('프로필 만들기','Make a profile')}</button></div>`}
 else el.innerHTML=`<div class="pbar"><span class="plabel">🎮 ${L('지금 플레이하는 사람 (눌러서 바꿔요)','Now playing (tap to switch)')}</span><div class="pchips">${PROF.list.map(p=>`<button type="button" class="pchip ${p.id===PROF.cur?'on':''}" data-pid="${p.id}"><span class="pav">${esc(p.av)}</span><b>${esc(p.name)}</b></button>`).join('')}<button type="button" class="pchip add" data-pa="add" aria-label="${esc(L('프로필 추가','Add a profile'))}">➕</button><button type="button" class="pchip edit" data-pa="manage" aria-label="${esc(L('프로필 고치기','Edit profiles'))}">✏️</button></div></div>`}
function choose(id){PROF.cur=id;coachWait=false;saveProf();try{sessionStorage.setItem('moonGames.picked','1')}catch(e){}closeP();renderWho();renderGames()}
// ---- small dialogs
function openP(html,bind){$('pm').innerHTML=`<div class="pmask"><div class="pmodal" role="dialog">${html}</div></div>`;bind&&bind($('pm').querySelector('.pmodal'))}
function closeP(){$('pm').innerHTML=''}
function picker(){const last=PROF.cur;openP(`<h2>🎮 ${L('누가 놀까요?','Who’s playing?')}</h2><p>${L('내 프로필을 누르면 모든 게임이 내 기록으로 열려요.','Tap your profile and every game opens with your own progress.')}</p>
 <div class="pgrid">${PROF.list.map(p=>`<button type="button" class="pbig ${p.id===last?'last':''}" data-pid="${p.id}"><span class="pav">${esc(p.av)}</span><b>${esc(p.name)}</b></button>`).join('')}</div>
 <div class="prow3"><button type="button" class="pbtn ghost" data-pa="add">➕ ${L('새 프로필','New profile')}</button></div>`,box=>box.addEventListener('click',onAct))}
function profileForm(p){const isNew=!p;let av=p?p.av:AV.find(a=>!PROF.list.some(x=>x.av===a))||AV[0];
 openP(`<h2>${isNew?L('새 프로필','New profile'):L('프로필 고치기','Edit profile')}</h2><input class="pin" id="pName" maxlength="10" value="${esc(p?p.name:'')}" placeholder="${esc(L('이름','Name'))}" autocomplete="off">
  <div class="avgrid">${AV.map(a=>`<button type="button" data-av="${a}" class="${a===av?'on':''}">${a}</button>`).join('')}</div>
  <div class="prow3">${isNew?'':`<button type="button" class="pbtn red" data-pa="del" data-pid="${p.id}">🗑️ ${L('지우기','Delete')}</button>`}<button type="button" class="pbtn ghost" data-pa="cancel">${L('취소','Cancel')}</button><button type="button" class="pbtn" data-pa="ok">${L('저장','Save')}</button></div>`,
  box=>{box.querySelector('.avgrid').addEventListener('click',e=>{const b=e.target.closest('[data-av]');if(!b)return;av=b.dataset.av;box.querySelectorAll('[data-av]').forEach(x=>x.classList.toggle('on',x===b))});
   box.addEventListener('click',e=>{const b=e.target.closest('[data-pa]');if(!b)return;const a=b.dataset.pa;
    if(a==='cancel'){PROF.list.length&&!me()?picker():closeP();return}
    if(a==='del'){confirmDelete(p);return}
    if(a==='ok'){const name=$('pName').value.trim();if(!name){$('pName').focus();return}
     if(isNew){const np={id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name,av};PROF.list.push(np);saveProf();offerLegacy(np)}else{p.name=name;p.av=av;saveProf();closeP();renderWho();renderGames()}}});
   setTimeout(()=>$('pName').focus(),50)})}
function manage(){openP(`<h2>✏️ ${L('프로필 고치기','Edit profiles')}</h2>${PROF.list.map(p=>`<div class="prow2"><span class="pav">${esc(p.av)}</span><b>${esc(p.name)}</b><button type="button" data-pa="edit" data-pid="${p.id}" aria-label="${esc(L('고치기','Edit'))}">✏️</button></div>`).join('')}
 <div class="prow3"><button type="button" class="pbtn ghost" data-pa="add">➕ ${L('새 프로필','New profile')}</button><button type="button" class="pbtn" data-pa="cancel">${L('닫기','Close')}</button></div>`,box=>box.addEventListener('click',onAct))}
function confirmDelete(p){openP(`<h2>🗑️ ${L(`${esc(p.name)} 프로필을 지울까요?`,`Delete ${esc(p.name)}?`)}</h2><p>${L('이 프로필의 모든 게임 기록이 사라지고 되돌릴 수 없어요. 다른 프로필의 기록은 그대로 남아요.','All game progress for this profile will be gone for good. Other profiles keep theirs.')}</p>
 <div class="prow3"><button type="button" class="pbtn ghost" data-pa="cancel">${L('아니요','No')}</button><button type="button" class="pbtn red" data-pa="yes">${L('지울래요','Delete')}</button></div>`,
 box=>box.addEventListener('click',e=>{const b=e.target.closest('[data-pa]');if(!b)return;if(b.dataset.pa==='cancel'){manage();return}
  GAME_KEYS.forEach(([k])=>{try{localStorage.removeItem(k+'@'+p.id)}catch(e){}});try{localStorage.removeItem(CKEY+'@'+p.id)}catch(e){}PROF.list=PROF.list.filter(x=>x!==p);if(PROF.cur===p.id)PROF.cur=null;saveProf();renderWho();renderGames();if(PROF.list.length&&!me())picker();else closeP()}))}
// ---- progress saved before profiles existed: let the family hand it to the right player once
function legacyOffers(np){const done=getJ(LKEY,{moved:{},names:{}}),out=[];
 GAME_KEYS.forEach(([k,ic,nm])=>{if(done.moved[k])return;const raw=localStorage.getItem(k);if(raw==null)return;let d=null;try{d=JSON.parse(raw)}catch(e){}
  const taken=done.names[k]||[];
  if(k==='scienceGuardians.v1'&&d&&d.P&&typeof d.P==='object'){const ids=Object.keys(d.P).filter(id=>!taken.includes(d.P[id].name));const hit=ids.find(id=>d.P[id].name===np.name);
   if(hit)out.push({k,label:`${ic} ${T2(nm)} · “${d.P[hit].name}”`,match:true,data:{...d,P:{[hit]:d.P[hit]},order:[hit],cur:hit},name:d.P[hit].name});
   else if(ids.length)out.push({k,label:`${ic} ${T2(nm)} · ${ids.map(id=>d.P[id].name).join(', ')}`,data:{...d,P:Object.fromEntries(ids.map(id=>[id,d.P[id]])),order:(d.order||ids).filter(id=>ids.includes(id)),cur:ids.includes(d.cur)?d.cur:ids[0]},whole:true});return}
  if(k==='musicAcademy.v1'&&d&&Array.isArray(d.P)){const ps=d.P.filter(p=>!taken.includes(p.name));const hit=ps.find(p=>p.name===np.name);
   if(hit)out.push({k,label:`${ic} ${T2(nm)} · “${hit.name}”`,match:true,data:{...d,P:[hit],cur:0},name:hit.name});
   else if(ps.length)out.push({k,label:`${ic} ${T2(nm)} · ${ps.map(p=>p.name).join(', ')}`,data:{...d,P:ps,cur:0},whole:true});return}
  out.push({k,label:`${ic} ${T2(nm)}`,raw,whole:true})});
 return out}
function offerLegacy(np){const offers=legacyOffers(np),first=PROF.list.length===1;
 if(!offers.length){choose(np.id);return}
 openP(`<h2>📦 ${L('예전 게임 기록이 있어요','There’s earlier progress')}</h2><p>${L(`프로필을 만들기 전에 이 기기에서 하던 기록이에요. ${esc(np.name)}의 기록만 골라서 옮겨요.`,`This progress was saved on this device before profiles. Pick only what belongs to ${esc(np.name)}.`)}</p>
  <div class="mig">${offers.map((o,i)=>`<label><input type="checkbox" data-i="${i}" ${o.match||first?'checked':''}> ${esc(o.label)}</label>`).join('')}</div>
  <div class="prow3"><button type="button" class="pbtn ghost" data-pa="skip">${L('새로 시작','Start fresh')}</button><button type="button" class="pbtn" data-pa="move">${L('골라서 옮기기','Move selected')}</button></div>`,
  box=>box.addEventListener('click',e=>{const b=e.target.closest('[data-pa]');if(!b)return;
   if(b.dataset.pa==='move'){const done=getJ(LKEY,{moved:{},names:{}});box.querySelectorAll('input[data-i]').forEach(c=>{if(!c.checked)return;const o=offers[+c.dataset.i];
     try{localStorage.setItem(o.k+'@'+np.id,o.raw!=null?o.raw:JSON.stringify(o.data))}catch(e){}
     if(o.name){(done.names[o.k]=done.names[o.k]||[]).push(o.name)}else done.moved[o.k]=true});setJ(LKEY,done)}
   choose(np.id)}))}
function onAct(e){const b=e.target.closest('[data-pid],[data-pa]');if(!b)return;const a=b.dataset.pa;
 if(a==='add'){profileForm(null);return}if(a==='manage'){manage();return}if(a==='cancel'){closeP();return}

// ---------------------------------------------------------------- Coach Moon

  more:(d,n)=>L(`음악 연습 ${n}일 연속이에요!`,`${n} days of music practice in a row!`),big:[7,14,30,60,100],bigMsg:n=>L(`음악 연습 ${n}일 연속!`,`A ${n}-day music streak!`)},
 'chess_knights.html':{get:()=>{const d=readSave('chessKnights.v1');return d&&d.solved>0?{lv:+d.lvl||0,n:+d.solved||0}:null},
  more:d=>L(`체스 퍼즐을 ${d}개 더 풀었어요!`,`You solved ${d} more chess puzzle${d>1?'s':''}!`),big:[25,50,100,200,500,1000],bigMsg:n=>L(`체스 퍼즐 ${n}개 돌파!`,`${n} chess puzzles solved!`)},
 'detective_game.html':{get:()=>{const d=readSave('little-detective-v3');return d&&d.caught>0?{lv:+d.level||0,n:+d.caught||0}:null},
  more:d=>L(`사건을 ${d}개 더 해결했어요!`,`You solved ${d} more case${d>1?'s':''}!`),big:[10,25,50,100,200],bigMsg:n=>L(`해결한 사건 ${n}개 돌파!`,`${n} cases solved!`)},
 'python_island.html':{get:()=>{const d=readSave('pythonIsland.v1');const n=d&&d.done?Object.keys(d.done).length:0;return n?{lv:+d.lvl||0,n}:null},
  more:d=>L(`파이썬 미션을 ${d}개 더 해냈어요!`,`You finished ${d} more Python mission${d>1?'s':''}!`),big:[7,14,28,42,63,84],bigMsg:n=>L(`파이썬 미션 ${n}개 완료!`,`${n} Python missions done!`)},
 'marble_rush_3d.html':{get:()=>{const m=(readSave('marbleRush.v2')||readSave('marble3dsettings'))?.mineStats;return m&&m.races>0?{lv:0,n:+m.wins||0}:null},
  more:d=>L(`내 구슬이 ${d}번 더 우승했어요!`,`Your marble won ${d} more race${d>1?'s':''}!`),big:[5,10,25,50,100],bigMsg:n=>L(`내 구슬 우승 ${n}번!`,`Your marble has won ${n} races!`)}
};
// the learning games the coach suggests, least recently opened first
const CREC=['science_guardians.html','math_aquarium.html','python_island.html','music_academy.html','chess_knights.html','detective_game.html'];
const CTIPS=[
 ['과학 가게에 실험 주문이 오면 실험대를 눌러 봐요. 직접 실험하고 배워요!','When a science shop order needs an experiment, tap the lab table and try it yourself!'],
 ['과학 퀴즈에서 이기면 상자가 열려요. 스티커 앨범을 채워 봐요!','Win a science quiz battle to open a chest, and fill up your sticker album!'],
 ['수학 아쿠아리움에서 문제를 맞히면 새 수조가 열리고 손님이 와요.','In the Math Aquarium, right answers open new tanks and bring visitors.'],
 ['음악은 매일 조금씩 연습하면 🔥 연속 기록이 쌓여요.','Practice music a little every day and your 🔥 streak grows.'],
 ['체스 퍼즐은 먼저 체크, 잡을 수 있는 말, 공격을 찾아봐요!','In chess puzzles, look for checks, captures and attacks first!'],
 ['탐정 놀이는 목격자 단서를 잘 듣고, 아닌 사람을 하나씩 지워 봐요.','As a detective, listen to the clues and rule people out one by one.'],
 ['마블 레이스에서는 내 구슬을 골라 응원해요. 리그 우승에 도전!','In Marble Rush, pick your marble and cheer it on to win the league!'],
 ['파이썬 섬에서 코드가 안 될 때는 👣 한 줄씩 실행해 봐요. 버그가 잘 보여요!','On Python Island, step through code 👣 line by line when it doesn’t work. Bugs show up!'],
 ['마블 레이스의 🛠️ 코스 만들기로 나만의 코스를 짓고, 🔬 실험실에서 예상해 봐요!','Build your own course 🛠️ in Marble Rush, and make predictions in the 🔬 lab!']];
const CGO=[
 ['조금씩 매일 하는 게 최고예요. 오늘도 한 판 해 볼까요?','A little every day works best. Shall we play one round?'],
 ['틀려도 괜찮아요. 틀린 문제에서 제일 많이 배워요!','Mistakes are fine. They’re where we learn the most!'],
 ['어려우면 쉬운 단계부터 다시 해도 돼요. 천천히 해요!','If it’s hard, go back to an easier level. Take your time!'],
 ['눈이 피곤하면 잠깐 쉬어요. 쉬는 것도 실력이에요!','If your eyes get tired, take a little break. Resting is a skill too!']];
// the coach waits while "who's playing?" is open, and says one thing per player per page view
let CMSG='',CN=null,CDONE={};
function coachSay(pose,text,rec){CMSG=text;const pic=$('coPic'),img=$('coImg');img.src=`images/coach-moon-${pose}.webp`;pic.classList.remove('pop');void pic.offsetWidth;pic.classList.add('pop');
 $('coMsg').textContent=text;
 $('coActs').innerHTML=rec?`<a class="co-go" href="${esc(rec)}?lang=${LANG}">▶ ${esc(L(`${gname(rec)} 하러 가기`,`Play ${gname(rec)}`))}</a>`:''}
function coachRec(st){const d=st.day.replace(/-/g,'')|0;return CREC.map((f,i)=>[f,st.open[f]||'',(i+d)%CREC.length]).sort((a,b)=>a[1]<b[1]?-1:a[1]>b[1]?1:a[2]-b[2])[0][0]}
function renderCoach(){const m=me();
 if(!m||coachWait){CN=null;coachSay('hi',PROF.list.length?L('안녕하세요! 저는 문 코치예요. 누가 놀지 골라 주세요.','Hi! I’m Coach Moon. Pick who’s playing.'):L('안녕하세요! 저는 문 코치예요. 위에서 프로필을 만들면 게임마다 내 기록이 따로 저장돼요.','Hi! I’m Coach Moon. Make a profile above and every game keeps your own progress.'));return}
 const done=CDONE[m.id+'|'+m.name];if(done){CN=getJ(CKEY+'@'+m.id,{});coachSay(...done);coachStamps(CN,0);return}
 const say=(...a)=>{CDONE[m.id+'|'+m.name]=a;coachSay(...a)};
 const k=CKEY+'@'+m.id,st=getJ(k,{}),first=!st.snap,now={};st.open=st.open||{};
 for(const f in CPROG){let v=null;try{v=CPROG[f].get()}catch(e){}if(v)now[f]=v}
 // what grew since last time: milestones first, then level-ups, then plain progress
 const ev=[];if(!first)for(const f in now){const a=st.snap[f],b=now[f],P=CPROG[f];
  if(!a){ev.push([1,'clap',L(`${gname(f)}에서 첫 기록이 생겼어요!`,`Your first progress in ${gname(f)}!`)]);continue}
  const ma=a.m!=null?a.m:a.n,mb=b.m!=null?b.m:b.n,big=P.big.filter(t=>ma<t&&mb>=t).pop();
  if(big)ev.push([3,'medal',P.bigMsg(big)]);
  else if(b.lv>a.lv)ev.push([b.lv%5===0?3:2,b.lv%5===0?'medal':'clap',L(`${gname(f)} 레벨 ${b.lv} 달성!`,`Level ${b.lv} in ${gname(f)}!`)]);
  else if(b.n>a.n)ev.push([1,'clap',P.more(b.n-a.n,b.n)])}
 ev.sort((x,y)=>y[0]-x[0]);
 // praise stamps: every day a game was played earns one, seven make a Coach Moon medal (missed days never cost anything)
 const nd=(st.played||[]).filter(d=>d>(st.stampLast||'')).sort();let fresh=0;if(nd.length){fresh=nd.length;st.stamps=(st.stamps|0)+fresh;st.stampLast=nd[nd.length-1]}
 const full=fresh&&Math.floor(st.stamps/7)>Math.floor((st.stamps-fresh)/7),stp=fresh?L(` 칭찬 도장 쾅! 🌙`,` Praise stamp! 🌙`):'';
 const newDay=st.day!==today();st.day=today();st.views=newDay?1:(st.views||0)+1;st.snap=now;
 const rec=coachRec(st),nm=m.name;CN=st;setJ(k,st);coachStamps(st,fresh);
 if(full){say('medal',L(`${nm}, 칭찬 도장 7개를 다 모았어요! 🏅 문 코치 메달을 줄게요. 문 코치는 언제나 ${nm} 편이에요!`,`${nm}, you filled all 7 praise stamps! 🏅 Here’s a Coach Moon medal. Coach Moon is always on your side!`),rec);return}
 if(first){say('hi',L(`${nm}, 안녕하세요! 저는 문 코치예요. 잘한 일이 생기면 여기서 꼭 칭찬해 줄게요. 문 코치는 언제나 ${nm} 편이에요!`,`Hi ${nm}! I’m Coach Moon. Whenever you do something great, I’ll cheer for you right here. Coach Moon is always on your side!`)+(fresh?L(' 오늘 첫 칭찬 도장도 쾅! 🌙',' And here’s your first praise stamp! 🌙'):L(` 오늘은 ${gname(rec)} 어때요?`,` How about ${gname(rec)} today?`)),rec);return}
 if(ev.length){const [lvl,pose,txt]=ev[0];say(pose,`${nm}, ${txt} `+(lvl===3?L('정말 대단해요! 🏅','That’s amazing! 🏅'):L('잘했어요! 👏','Great job! 👏'))+(ev.length>1?L(' 다른 게임에서도 열심히 했네요.',' You worked hard in other games too.'):'')+stp,rec);return}
 if(fresh){say('clap',(st.stamps===1?L(`${nm}, 첫 칭찬 도장이에요! 게임을 한 날마다 하나씩 찍어 줄게요. 7개를 모으면 문 코치 메달! 🌙`,`${nm}, your first praise stamp! You get one for every day you play. Collect 7 for a Coach Moon medal! 🌙`):fresh>1?L(`${nm}, 그동안 열심히 했네요! 칭찬 도장 ${fresh}개 쾅! 🌙`,`${nm}, you’ve been working hard! ${fresh} praise stamps! 🌙`):L(`${nm}, 오늘도 열심히 했네요! 칭찬 도장 쾅! 🌙`,`${nm}, you worked hard today! Praise stamp! 🌙`)),rec);return}
 if(newDay){say('hi',L(`${nm}, 반가워요! 오늘은 ${gname(rec)} 어때요?`,`Hi ${nm}! How about ${gname(rec)} today?`),rec);return}
 if(st.views%2)say('idea',nextTip(),rec);else{const g=CGO[st.views/2%CGO.length|0];say('go',L(g[0],g[1]),rec)}}
function coachStamps(st,fresh){const el=$('coStamps'),n=st.stamps|0;if(!n){el.hidden=true;return}el.hidden=false;
 const on=n%7||(fresh?7:0),medals=Math.floor(n/7);
 el.innerHTML=`<span>🌙 ${L('칭찬 도장','Praise stamps')} ${on}/7</span><span class="cs-row">${[...Array(7)].map((_,i)=>`<i class="cs${i<on?' on':''}${i<on&&i>=on-fresh?' new':''}" style="animation-delay:${.25+(i-(on-fresh))*.18}s"></i>`).join('')}</span>${medals?`<span class="cs-med">🏅 ${L('문 코치 메달','Coach Moon medal')} ×${medals}</span>`:''}`}
function nextTip(){const st=CN||{};st.tip=((st.tip|0)+1)%CTIPS.length;if(CN&&me())setJ(CKEY+'@'+me().id,CN);const t=CTIPS[st.tip];return L(t[0],t[1])}
function coachTip(){coachSay('idea',nextTip(),CN&&me()?coachRec(CN):null)}
// read aloud with a natural voice (never the macOS novelty voices)
const NOVELTY=/albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|deranged|hysterical|grandma|grandpa|eddy|flo\b|reed|rocko|sandy|shelley/i;
function coachSpeak(){if(!('speechSynthesis' in window)||!CMSG)return;try{speechSynthesis.cancel();const vs=speechSynthesis.getVoices().filter(v=>(v.lang||'').toLowerCase().startsWith(LANG)&&!NOVELTY.test(v.name)),v=vs.find(v=>/google|yuna|sora|samantha|ava|allison|natural|premium|enhanced|siri/i.test(v.name))||vs[0];
 const u=new SpeechSynthesisUtterance(CMSG.replace(/[\u{1F300}-\u{1FAFF}☀-➿]/gu,''));if(v)u.voice=v;u.lang=LANG==='en'?'en-US':'ko-KR';speechSynthesis.speak(u)}catch(e){}}
$('coSay').addEventListener('click',coachSpeak);
$('coPic').addEventListener('click',()=>{coachTip();coachSpeak()});
// remember which game was opened today so the coach can suggest a different one next time
function coachOpened(e){const a=e.target.closest('a[href]');const m=me();if(!a||!m)return;const k=CKEY+'@'+m.id,st=getJ(k,{});st.open=st.open||{};st.open[a.getAttribute('href').split('?')[0]]=today();setJ(k,st)}
$('games').addEventListener('click',coachOpened);$('coActs').addEventListener('click',coachOpened);
// with profiles, ask who is playing whenever the site is opened in a new tab
let picked=false;try{picked=!!sessionStorage.getItem('moonGames.picked')}catch(e){}
let coachWait=!!(PROF.list.length&&(!picked||!me()));
$('who').addEventListener('click',onAct);
renderWho();renderGames();
if(coachWait)picker();
applyLang();
document.querySelectorAll('[data-lang]').forEach(b=>{
  b.setAttribute('aria-pressed',String(b.dataset.lang===LANG));
  b.addEventListener('click',()=>{if(b.dataset.lang!==LANG)setLang(b.dataset.lang)});
