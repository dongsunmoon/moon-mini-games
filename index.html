<style>

.brand h1{margin:0;font-size:clamp(24px,5.4vw,36px);line-height:1.05;letter-spacing:-.6px}

/* Marble thumbnail: dark sky, a glowing track and rolling marbles */
.t-marble{background:radial-gradient(ellipse at 35% -30%,#3a5a96 0%,#0e1830 70%)}
.t-marble .track{position:absolute;left:-15%;right:-15%;top:54%;height:44px;border-radius:30px;background:linear-gradient(180deg,#5b52b0,#36286e);transform:rotate(-7deg);box-shadow:0 -3px 0 #55ffed,0 3px 0 #55ffed,0 0 26px #55ffed66}
.t-marble .m{position:absolute;width:var(--s,40px);height:var(--s,40px);border-radius:50%;background:var(--c);background:radial-gradient(circle at 32% 28%,#fff 0 7%,var(--c) 34%,color-mix(in srgb,var(--c) 60%,#000) 100%);box-shadow:0 0 16px var(--c);animation:roll 2.6s ease-in-out infinite alternate}
.t-marble .flag{position:absolute;right:8%;top:16%;font-size:40px}

/* Chess thumbnail: night-purple sky over a checkerboard and a golden knight */
.t-chess{background:radial-gradient(circle at 50% 20%,#8f7bff 0,#2b2f7a 75%)}
.t-chess .board{position:absolute;left:-10%;right:-10%;bottom:-38%;height:70%;transform:perspective(380px) rotateX(58deg);background:repeating-conic-gradient(#eeeed2 0 25%,#769656 0 50%) 0 0/16.66% 25%;box-shadow:0 -8px 30px rgba(0,0,0,.35)}
.t-chess .knight{position:absolute;left:50%;top:46%;width:42%;height:auto;aspect-ratio:1;transform:translate(-50%,-50%);filter:drop-shadow(0 12px 14px rgba(0,0,0,.4));animation:hop 2.4s ease-in-out infinite}
.t-chess .spark{position:absolute;font-size:30px}
@keyframes hop{50%{transform:translate(-50%,-58%) rotate(-4deg)}}
/* Science thumbnail: lab-blue sky with a spinning atom, a magnet, a compass and a little villain */
.t-science{background:radial-gradient(circle at 30% 20%,#5fe3ff 0,#1a7fb0 55%,#0f3d6e 100%)}
.t-science .ring{position:absolute;left:50%;top:50%;width:46%;aspect-ratio:1;border:4px solid #ffffffb0;border-radius:50%;transform:translate(-50%,-50%) rotate(var(--r)) scaleY(.36);box-shadow:0 0 18px #7cf3ff}
.t-science .core{position:absolute;left:50%;top:50%;width:12%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 35% 30%,#fff,#ffd84d 45%,#ff9f45);box-shadow:0 0 22px #ffd84d}
.t-science .atom{position:absolute;inset:0;animation:spinA 9s linear infinite}
.t-science .ic{position:absolute;font-size:38px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.3))}
.t-music{background:radial-gradient(circle at 30% 20%,#ff9ad5 0,#8a4dff 55%,#2a1466 100%)}
.t-music .keys{position:absolute;left:8%;right:8%;bottom:10%;height:26%;border-radius:10px;background:repeating-linear-gradient(90deg,#fff 0 calc(12.5% - 3px),#d9d0ff calc(12.5% - 3px) 12.5%);box-shadow:0 8px 18px rgba(0,0,0,.3)}
.t-music .ic{position:absolute;font-size:36px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.3));animation:bob 3s ease-in-out infinite}
.t-music .ic:nth-of-type(2n){animation-delay:-1.5s}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes spinA{to{transform:rotate(360deg)}}
/* Aquarium thumbnail: a deep-blue tank with swaying kelp, fish, rising bubbles and floating sums */
.t-aqua{background:radial-gradient(ellipse at 50% -20%,#9fe8ff 0,transparent 55%),repeating-linear-gradient(105deg,transparent 0 34px,#ffffff10 34px 52px),linear-gradient(180deg,#2bb3e8 0%,#0e6fb8 55%,#0a3f78 100%)}

.t-aqua .bb{position:absolute;bottom:12%;width:12px;height:12px;border-radius:50%;border:2px solid #ffffffcc;animation:riseB 4s linear infinite}

@keyframes riseB{to{transform:translateY(-150px);opacity:0}}

    title:['마블 레이스','Marble Rush'],
    age:['누구나','All ages'],
    desc:['진짜처럼 통통 튕기는 구슬 레이스! 내 구슬을 응원하고 5경기 리그 우승에 도전해요.','Marbles really bounce! Cheer for yours and go for the 5-race league title.'],
    tags:[['🌈 6개 월드','🌈 6 worlds'],['🏆 리그전','🏆 League'],['📣 내 구슬 응원','📣 Cheer your marble']],
    stat:()=>{const m=(readSave('marbleRush.v2')||readSave('marble3dsettings'))?.mineStats;return m&&m.races>0?L(`🏆 내 구슬 우승 ${m.wins}번 / ${m.races}경기`,`🏆 Your marble won ${m.wins} of ${m.races} race${m.races===1?'':'s'}`):''}
  },
  {
    file:'chess_knights.html',
    thumb:'<div class="thumb t-chess" aria-hidden="true"><img class="cover" src="images/cover-chess.webp" alt="" onerror="this.remove()"><div class="board"></div><svg class="knight" viewBox="0 0 100 100"><defs><linearGradient id="tkG" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#fff8cf"/><stop offset=".5" stop-color="#ffd659"/><stop offset="1" stop-color="#d99a0b"/></linearGradient></defs><g fill="url(#tkG)" stroke="#7a5200" stroke-width="3.2" stroke-linejoin="round"><path d="M71 81H30Q29 67 38 59Q45 53 46 46Q40 50 33 53Q26 56 22 51Q19 47 23 42L38 27Q42 19 49 15L50 6L58 13Q74 18 76 40Q78 62 71 81Z"/><path d="M22 89Q22 81 30 81H70Q78 81 78 89V90Q78 94 74 94H26Q22 94 22 90Z"/></g><circle cx="44" cy="29" r="3.6" fill="#5c3d00"/></svg><span class="spark" style="left:14%;top:16%">⭐</span><span class="spark" style="left:78%;top:20%">👑</span><span class="spark" style="left:80%;top:66%">🪙</span></div>',
    title:['꼬마 체스 기사단','Little Chess Knights'],
    age:['6세 이상','Ages 6+'],
    desc:['체스 퍼즐을 풀고 보스를 이겨 새 지역을 열어요! 코인을 모아 체스판과 기물을 꾸며요.','Solve chess puzzles, beat the bosses and open new lands! Spend coins on boards and pieces.'],
    tags:[['♞ 체스 퍼즐','♞ Chess puzzles'],['⚔️ AI 대결','⚔️ AI battles'],['📈 레벨업','📈 Level up']],
    stat:()=>{const d=readSave('chessKnights.v1');return d&&d.solved>0?L(`♞ Lv.${d.lvl} · 퍼즐 점수 ${d.rating} · 푼 퍼즐 ${d.solved}개`,`♞ Lv.${d.lvl} · Puzzle score ${d.rating} · ${d.solved} solved`):''}
  },
  {
    file:'science_guardians.html',
    thumb:'<div class="thumb t-science" aria-hidden="true"><img class="cover" src="images/cover-science.webp" alt="" onerror="this.remove()"><div class="atom"><div class="ring" style="--r:0deg"></div><div class="ring" style="--r:60deg"></div><div class="ring" style="--r:120deg"></div></div><div class="core"></div><span class="ic" style="left:9%;top:14%">🧭</span><span class="ic" style="left:78%;top:12%">🧲</span><span class="ic" style="left:12%;top:62%">🔦</span><span class="ic" style="left:76%;top:60%">🦹</span></div>',
    title:['꼬마 과학 수호대','Little Science Guardians'],
    age:['6~11세','Ages 6–11'],
    desc:['그림자, 자석, 전기, 산과 염기, 부력, 지진, 우주, 공룡 화석까지! 과학 퀴즈와 실험으로 헷갈 박사의 악당들을 물리쳐요.','Shadows, magnets, electricity, acids and bases, buoyancy, earthquakes, space and dinosaur fossils! Beat Dr. Mix-Up’s villains with science quizzes and hands-on labs.'],
    tags:[['🔬 실험 26가지','🔬 26 labs'],['📚 과학 카드 164장','📚 164 science cards'],['🎚️ 학년별 난이도','🎚️ Grade levels']],
    stat:()=>{const r=readSave('scienceGuardians.v1'),d=r&&r.P&&r.P[r.cur];return d&&d.correct>0?L(`🔬 ${d.name} Lv.${d.lvl} · 과학 카드 ${Object.keys(d.cards||{}).length}장`,`🔬 ${d.name} Lv.${d.lvl} · ${Object.keys(d.cards||{}).length} science cards`):''}
  },
  {
    file:'music_academy.html',
    thumb:'<div class="thumb t-music" aria-hidden="true"><img class="cover" src="images/cover-music.webp" alt="" onerror="this.remove()"><div class="keys"></div><span class="ic" style="left:9%;top:12%">🎵</span><span class="ic" style="left:40%;top:6%">🎤</span><span class="ic" style="left:76%;top:12%">🥁</span><span class="ic" style="left:60%;top:34%">🎺</span><span class="ic" style="left:20%;top:36%">🎹</span></div>',
    title:['꼬마 음악 아카데미','Little Music Academy'],
    age:['6~11세','Ages 6–11'],
    desc:['박자, 피아노, 악보, 노래, 드럼, 화음, 악기까지! 여섯 선생님과 매일 조금씩 연습하고 음악 대회에서 메달을 따요.','Beat, piano, reading music, singing, drums, chords and instruments! Practice a little every day with six teachers and win medals in music contests.'],
    tags:[['🎓 레슨 62개','🎓 62 lessons'],['🏆 음악 대회','🏆 Music contests'],['🔥 매일 연습','🔥 Daily streaks']],
    stat:()=>{const r=readSave('musicAcademy.v1'),d=r&&r.P&&r.P[r.cur];return d&&d.stats&&d.stats.plays>0?L(`🎵 ${d.name} Lv.${d.lvl} · 🔥 ${d.streak.n}일 연속`,`🎵 ${d.name} Lv.${d.lvl} · 🔥 ${d.streak.n}-day streak`):''}
  },
  {
    file:'math_aquarium.html',
    thumb:'<div class="thumb t-aqua" aria-hidden="true"><img class="cover" src="images/cover-aquarium.webp" alt="" onerror="this.remove()"><div class="kelp" style="left:6%"></div><div class="kelp" style="left:88%;animation-delay:-1.4s"></div><span class="ic" style="left:12%;top:18%">🐠</span><span class="ic" style="left:70%;top:14%">🐙</span><span class="ic big" style="left:40%;top:34%">🐳</span><span class="ic" style="left:18%;top:60%">🦀</span><span class="ic" style="left:72%;top:58%">🐡</span><span class="math" style="left:56%;top:12%">7×8</span><span class="math" style="left:8%;top:42%">½+¼</span><span class="math" style="left:78%;top:36%">+</span><i class="bb" style="left:30%"></i><i class="bb" style="left:62%;animation-delay:-1.5s"></i><i class="bb" style="left:84%;animation-delay:-2.6s"></i></div>',
    title:['꼬마 수학 아쿠아리움','Little Math Aquarium'],
    age:['6~12세','Ages 6–12'],
    desc:['수학을 풀면 수조가 열리고 손님이 와요! 학년마다 아쿠아리움 20곳을 키우면 1~6학년 수학을 한 학년씩 마스터해요. 매점·직원·낚시·다이빙·운전 미션까지!','Solve math to open tanks and welcome visitors! Grow 20 aquariums per grade to master Grade 1–6 math, one grade at a time. Shops, staff, fishing, diving and driving too!'],
    tags:[['🧮 1~6학년 수학','🧮 Grades 1–6 math'],['🐠 아쿠아리움 경영','🐠 Run an aquarium'],['🇰🇷🇨🇦 한국·캐나다 교육과정','🇰🇷🇨🇦 Korea + Canada curricula']],
    stat:()=>{const d=readSave('mathAquarium.v1');if(!d||!d.stats||!d.stats.correct)return '';const n=Object.values(d.G||{}).reduce((t,g)=>t+(g.aq||[]).filter(a=>a&&a.done).length,0);return L(`🐠 ${d.grade}학년 · 마스터한 단원 ${n}개 · 맞힌 문제 ${d.stats.correct}개`,`🐠 Grade ${d.grade} · ${n} skill${n===1?'':'s'} mastered · ${d.stats.correct} right`)}
  }
];
const pick=pair=>L(pair[0],pair[1]);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);

// ---------------------------------------------------------------- player profiles
// Profiles live only on this device. Every game stores its save under "key@profileId", so each player keeps
// separate progress and resetting one game never touches another game or another player.
const PKEY='moonGames.profiles',LKEY='moonGames.legacy';
const GAME_KEYS=[['little-detective-v3','🕵️','꼬마 탐정단|Little Detectives'],['marbleRush.v2','🔮','마블 레이스|Marble Rush'],['marble3dsettings','🔮','마블 레이스(예전 설정)|Marble Rush (old settings)'],['chessKnights.v1','♞','꼬마 체스 기사단|Little Chess Knights'],['scienceGuardians.v1','🔬','꼬마 과학 수호대|Little Science Guardians'],['musicAcademy.v1','🎵','꼬마 음악 아카데미|Little Music Academy'],['mathAquarium.v1','🐠','꼬마 수학 아쿠아리움|Little Math Aquarium']];
const AV=['🐰','🐻','🦊','🐼','🐨','🐯','🦁','🐸','🐱','🐶','🐥','🦄','🐙','🐬','🦖','⭐'];
const T2=s=>{const [k,e]=s.split('|');return L(k,e||k)};
const getJ=(k,d=null)=>{try{const v=JSON.parse(localStorage.getItem(k)||'null');return v==null?d:v}catch(e){return d}};
const setJ=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let PROF=getJ(PKEY,{list:[],cur:null});if(!Array.isArray(PROF.list))PROF={list:[],cur:null};
const me=()=>PROF.list.find(p=>p.id===PROF.cur)||null;
const saveProf=()=>setJ(PKEY,PROF);
// Each game saves its own progress in this browser; show the current player's progress on the card.
const readSave=key=>{const m=me();return getJ(m?key+'@'+m.id:key)};
function renderGames(){document.getElementById('games').innerHTML=GAMES.map(g=>`
  <a class="card" href="${esc(g.file)}?lang=${LANG}">
    ${g.thumb}
    <div class="body">
      <div class="title"><h2>${esc(pick(g.title))}</h2><span class="age">${esc(pick(g.age))}</span></div>
      <p class="desc">${esc(pick(g.desc))}</p>
      <ul class="tags">${g.tags.map(t=>`<li>${esc(pick(t))}</li>`).join('')}</ul>
      ${(s=>s?`<span class="stat">${esc(s)}</span>`:'')((()=>{try{return g.stat?.()}catch(e){return ''}})())}
      <span class="play">▶ ${L('플레이','Play')}</span>
    </div>
  </a>`).join('');
 const m=me();$('helloT').textContent=m?L(`${m.name}, 오늘은 어떤 게임을 해 볼까요? 🎮`,`${m.name}, which game today? 🎮`):L('오늘은 어떤 게임을 해 볼까요? 🎮','Which game do you want to play today? 🎮')}
function renderWho(){const el=$('who');
 if(!PROF.list.length){el.innerHTML=`<div class="psetup"><b>👨‍👩‍👧 ${L('프로필을 만들면 형제자매가 모든 게임 기록을 따로 가질 수 있어요!','Make a profile for each player so everyone keeps their own progress in every game!')}</b><button type="button" class="pbtn" data-pa="add">➕ ${L('프로필 만들기','Make a profile')}</button></div>`}
 else el.innerHTML=`<div class="pbar"><span class="plabel">🎮 ${L('지금 플레이하는 사람 (눌러서 바꿔요)','Now playing (tap to switch)')}</span><div class="pchips">${PROF.list.map(p=>`<button type="button" class="pchip ${p.id===PROF.cur?'on':''}" data-pid="${p.id}"><span class="pav">${esc(p.av)}</span><b>${esc(p.name)}</b></button>`).join('')}<button type="button" class="pchip add" data-pa="add" aria-label="${esc(L('프로필 추가','Add a profile'))}">➕</button><button type="button" class="pchip edit" data-pa="manage" aria-label="${esc(L('프로필 고치기','Edit profiles'))}">✏️</button></div></div>`}
function choose(id){PROF.cur=id;saveProf();try{sessionStorage.setItem('moonGames.picked','1')}catch(e){}closeP();renderWho();renderGames()}
// ---- small dialogs
function openP(html,bind){$('pm').innerHTML=`<div class="pmask"><div class="pmodal" role="dialog">${html}</div></div>`;bind&&bind($('pm').querySelector('.pmodal'))}
function closeP(){$('pm').innerHTML=''}
function picker(){const last=PROF.cur;openP(`<h2>🎮 ${L('누가 놀까요?','Who’s playing?')}</h2><p>${L('내 프로필을 누르면 모든 게임이 내 기록으로 열려요.','Tap your profile and every game opens with your own progress.')}</p>
 <div class="pgrid">${PROF.list.map(p=>`<button type="button" class="pbig ${p.id===last?'last':''}" data-pid="${p.id}"><span class="pav">${esc(p.av)}</span><b>${esc(p.name)}</b></button>`).join('')}</div>
 <div class="prow3"><button type="button" class="pbtn ghost" data-pa="add">➕ ${L('새 프로필','New profile')}</button></div>`,box=>box.addEventListener('click',onAct))}
function profileForm(p){const isNew=!p;let av=p?p.av:AV.find(a=>!PROF.list.some(x=>x.av===a))||AV[0];
 openP(`<h2>${isNew?L('새 프로필','New profile'):L('프로필 고치기','Edit profile')}</h2><input class="pin" id="pName" maxlength="10" value="${esc(p?p.name:'')}" placeholder="${esc(L('이름','Name'))}" autocomplete="off">
  <div class="avgrid">${AV.map(a=>`<button type="button" data-av="${a}" class="${a===av?'on':''}">${a}</button>`).join('')}</div>
  <div class="prow3">${isNew?'':`<button type="button" class="pbtn red" data-pa="del" data-pid="${p.id}">🗑️ ${L('지우기','Delete')}</button>`}<button type="button" class="pbtn ghost" data-pa="cancel">${L('취소','Cancel')}</button><button type="button" class="pbtn" data-pa="ok">${L('저장','Save')}</button></div>`,
  box=>{box.querySelector('.avgrid').addEventListener('click',e=>{const b=e.target.closest('[data-av]');if(!b)return;av=b.dataset.av;box.querySelectorAll('[data-av]').forEach(x=>x.classList.toggle('on',x===b))});
   box.addEventListener('click',e=>{const b=e.target.closest('[data-pa]');if(!b)return;const a=b.dataset.pa;
    if(a==='cancel'){PROF.list.length&&!me()?picker():closeP();return}
    if(a==='del'){confirmDelete(p);return}
    if(a==='ok'){const name=$('pName').value.trim();if(!name){$('pName').focus();return}
     if(isNew){const np={id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name,av};PROF.list.push(np);saveProf();offerLegacy(np)}else{p.name=name;p.av=av;saveProf();closeP();renderWho();renderGames()}}});
   setTimeout(()=>$('pName').focus(),50)})}
function manage(){openP(`<h2>✏️ ${L('프로필 고치기','Edit profiles')}</h2>${PROF.list.map(p=>`<div class="prow2"><span class="pav">${esc(p.av)}</span><b>${esc(p.name)}</b><button type="button" data-pa="edit" data-pid="${p.id}" aria-label="${esc(L('고치기','Edit'))}">✏️</button></div>`).join('')}
 <div class="prow3"><button type="button" class="pbtn ghost" data-pa="add">➕ ${L('새 프로필','New profile')}</button><button type="button" class="pbtn" data-pa="cancel">${L('닫기','Close')}</button></div>`,box=>box.addEventListener('click',onAct))}
function confirmDelete(p){openP(`<h2>🗑️ ${L(`${esc(p.name)} 프로필을 지울까요?`,`Delete ${esc(p.name)}?`)}</h2><p>${L('이 프로필의 모든 게임 기록이 사라지고 되돌릴 수 없어요. 다른 프로필의 기록은 그대로 남아요.','All game progress for this profile will be gone for good. Other profiles keep theirs.')}</p>
 <div class="prow3"><button type="button" class="pbtn ghost" data-pa="cancel">${L('아니요','No')}</button><button type="button" class="pbtn red" data-pa="yes">${L('지울래요','Delete')}</button></div>`,
 box=>box.addEventListener('click',e=>{const b=e.target.closest('[data-pa]');if(!b)return;if(b.dataset.pa==='cancel'){manage();return}
  GAME_KEYS.forEach(([k])=>{try{localStorage.removeItem(k+'@'+p.id)}catch(e){}});PROF.list=PROF.list.filter(x=>x!==p);if(PROF.cur===p.id)PROF.cur=null;saveProf();renderWho();renderGames();if(PROF.list.length&&!me())picker();else closeP()}))}
// ---- progress saved before profiles existed: let the family hand it to the right player once
function legacyOffers(np){const done=getJ(LKEY,{moved:{},names:{}}),out=[];
 GAME_KEYS.forEach(([k,ic,nm])=>{if(done.moved[k])return;const raw=localStorage.getItem(k);if(raw==null)return;let d=null;try{d=JSON.parse(raw)}catch(e){}
  const taken=done.names[k]||[];
  if(k==='scienceGuardians.v1'&&d&&d.P&&typeof d.P==='object'){const ids=Object.keys(d.P).filter(id=>!taken.includes(d.P[id].name));const hit=ids.find(id=>d.P[id].name===np.name);
   if(hit)out.push({k,label:`${ic} ${T2(nm)} · “${d.P[hit].name}”`,match:true,data:{...d,P:{[hit]:d.P[hit]},order:[hit],cur:hit},name:d.P[hit].name});
   else if(ids.length)out.push({k,label:`${ic} ${T2(nm)} · ${ids.map(id=>d.P[id].name).join(', ')}`,data:{...d,P:Object.fromEntries(ids.map(id=>[id,d.P[id]])),order:(d.order||ids).filter(id=>ids.includes(id)),cur:ids.includes(d.cur)?d.cur:ids[0]},whole:true});return}
  if(k==='musicAcademy.v1'&&d&&Array.isArray(d.P)){const ps=d.P.filter(p=>!taken.includes(p.name));const hit=ps.find(p=>p.name===np.name);
   if(hit)out.push({k,label:`${ic} ${T2(nm)} · “${hit.name}”`,match:true,data:{...d,P:[hit],cur:0},name:hit.name});
   else if(ps.length)out.push({k,label:`${ic} ${T2(nm)} · ${ps.map(p=>p.name).join(', ')}`,data:{...d,P:ps,cur:0},whole:true});return}
  out.push({k,label:`${ic} ${T2(nm)}`,raw,whole:true})});
 return out}
function offerLegacy(np){const offers=legacyOffers(np),first=PROF.list.length===1;
 if(!offers.length){choose(np.id);return}
 openP(`<h2>📦 ${L('예전 게임 기록이 있어요','There’s earlier progress')}</h2><p>${L(`프로필을 만들기 전에 이 기기에서 하던 기록이에요. ${esc(np.name)}의 기록만 골라서 옮겨요.`,`This progress was saved on this device before profiles. Pick only what belongs to ${esc(np.name)}.`)}</p>
  <div class="mig">${offers.map((o,i)=>`<label><input type="checkbox" data-i="${i}" ${o.match||first?'checked':''}> ${esc(o.label)}</label>`).join('')}</div>
  <div class="prow3"><button type="button" class="pbtn ghost" data-pa="skip">${L('새로 시작','Start fresh')}</button><button type="button" class="pbtn" data-pa="move">${L('골라서 옮기기','Move selected')}</button></div>`,
  box=>box.addEventListener('click',e=>{const b=e.target.closest('[data-pa]');if(!b)return;
   if(b.dataset.pa==='move'){const done=getJ(LKEY,{moved:{},names:{}});box.querySelectorAll('input[data-i]').forEach(c=>{if(!c.checked)return;const o=offers[+c.dataset.i];
     try{localStorage.setItem(o.k+'@'+np.id,o.raw!=null?o.raw:JSON.stringify(o.data))}catch(e){}
     if(o.name){(done.names[o.k]=done.names[o.k]||[]).push(o.name)}else done.moved[o.k]=true});setJ(LKEY,done)}
   choose(np.id)}))}
function onAct(e){const b=e.target.closest('[data-pid],[data-pa]');if(!b)return;const a=b.dataset.pa;
 if(a==='add'){profileForm(null);return}if(a==='manage'){manage();return}if(a==='cancel'){closeP();return}
 if(a==='edit'){profileForm(PROF.list.find(p=>p.id===b.dataset.pid));return}
 if(b.dataset.pid)choose(b.dataset.pid)}
$('who').addEventListener('click',onAct);
renderWho();renderGames();
// with profiles, ask who is playing whenever the site is opened in a new tab
let picked=false;try{picked=!!sessionStorage.getItem('moonGames.picked')}catch(e){}
if(PROF.list.length&&(!picked||!me()))picker();
applyLang();
document.querySelectorAll('[data-lang]').forEach(b=>{
  b.setAttribute('aria-pressed',String(b.dataset.lang===LANG));
  b.addEventListener('click',()=>{if(b.dataset.lang!==LANG)setLang(b.dataset.lang)});
});
</script>
</body>
</html>
