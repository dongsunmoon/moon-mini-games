// Coach Moon, the maker's character, cheers the player on in every game, in two ways:
// · coachLine(kind) puts one line inside result and level-up windows (kinds: up, big, good, try, race).
// · coachPop(pose,ko,en) shows a small bubble in the corner at good moments. It never blocks a tap and
//   waits between appearances, so he never nags. He only praises and encourages.
// Source: _src/coach/coach.js, copied into every game by _src/coach/inject.py.
// LR keeps the learning record that the parents' report (report.html) reads. Each game has one record per player,
// stored under its save prefix + "learn", so the profile script files it as "...@profileId". It holds:
// · days: play time in seconds and right/wrong answers per day (the last 120 days). Time counts only while the
//   page is visible and the player touched or typed in the last 2 minutes.
// · sum: the game's own summary of skills, built by the function passed to LR.set() (see _src/report/SPEC.md).
// · when: the day each skill first reached "mastered" ('' = before the record started).
// · sk: right/wrong counts per skill, from coachAnswer(ok,skillId); skw: the same per week (Monday's date, 12 weeks).
// · mx: kinds of questions the child got wrong (up to 40), from coachAnswer(ok,skillId,item) with
//   item={id,q:[ko,en],a:[ko,en],g?:[ko,en],tip?:[ko,en]}: the latest example, the right answer, the child's answer,
//   how many misses, and how many right answers in a row since the last miss (so the report can say "fixed now").
// · ls: the mini lessons (MiniLesson, in lesson.js) the child watched to the end, with the first day.
// A game's reset must call LR.forget() so the report forgets only that game; LR.resume() starts a fresh record.
const LR=(()=>{const f=(location.pathname.split('/').pop()||'').replace(/\.html$/,'');
 const KEY={math_aquarium:'mathAquarium.learn',science_guardians:'scienceGuardians.learn',music_academy:'musicAcademy.learn',chess_knights:'chessKnights.learn',detective_game:'little-detective-learn',marble_rush_3d:'marbleRush.learn',coding_island:'pythonIsland.learn',python_island:'pythonIsland.learn'}[f];
 const day=()=>new Date().toLocaleDateString('en-CA'),week=(n=0)=>{const d=new Date();d.setDate(d.getDate()-(d.getDay()+6)%7-7*n);return d.toLocaleDateString('en-CA')};
 const two=x=>Array.isArray(x)?x.slice(0,2).map(v=>String(v==null?'':v).slice(0,140)):undefined;let R=null,fn=null,off=!KEY,dirty=false,last=0;
 const load=()=>{if(R)return R;try{R=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(!R||R.v!==1)R={v:1,days:{},when:{}};return R};
 const today=()=>{const r=load(),d=day();return r.days[d]||(r.days[d]={s:0,r:0,w:0})};
 const save=()=>{if(off)return;const r=load();
  if(fn){try{const s=fn();if(s){const first=!r.sum,d=day();r.sum=s;(s.areas||[]).forEach(a=>(a.skills||[]).forEach(k=>{if(k.st===2&&r.when[k.id]==null)r.when[k.id]=first?'':d}))}}catch(e){}}
  const ks=Object.keys(r.days).sort();ks.slice(0,Math.max(0,ks.length-120)).forEach(k=>delete r.days[k]);
  const old=week(12);for(const k in r.skw||{}){for(const w in r.skw[k])if(w<old)delete r.skw[k][w];if(!Object.keys(r.skw[k]).length)delete r.skw[k]}
  r.at=Date.now();try{localStorage.setItem(KEY,JSON.stringify(r))}catch(e){}dirty=false};
 ['pointerdown','keydown','touchstart','wheel'].forEach(e=>addEventListener(e,()=>{last=Date.now()},{passive:true,capture:true}));
 setInterval(()=>{if(off||document.hidden||Date.now()-last>120000)return;today().s+=10;dirty=true},10000);

 return {
  ans(ok,skill,item){if(off)return;const t=today(),r=load(),i=ok?0:1;ok?t.r++:t.w++;
   if(skill!=null){const sk=r.sk||(r.sk={});(sk[skill]||(sk[skill]=[0,0]))[i]++;const sw=r.skw||(r.skw={}),o=sw[skill]||(sw[skill]={}),w=week();(o[w]||(o[w]=[0,0]))[i]++}
   if(item&&item.id!=null){const mx=r.mx||(r.mx={}),id=String(item.id).slice(0,80);let e=mx[id];
    if(!ok){if(!e)e=mx[id]={s:skill,n:0,ok:0,f:day()};e.n++;e.k=0;e.l=day();e.q=two(item.q);e.a=two(item.a);e.g=two(item.g);e.tip=two(item.tip)||e.tip;
     const ids=Object.keys(mx);if(ids.length>40)ids.sort((a,b)=>mx[a].l!==mx[b].l?(mx[a].l<mx[b].l?-1:1):mx[a].n-mx[b].n).slice(0,ids.length-40).forEach(x=>delete mx[x])}
    else if(e){e.ok++;e.k=(e.k||0)+1}}
   dirty=true},
  set(f){fn=f;setTimeout(save,1500)},save,
  stat(id){const x=(load().sk||{})[id];return x?{r:x[0],w:x[1]}:null},
  // mini lessons watched to the end (MiniLesson): lesson id → the first day; les() returns them all
  les(id){const r=load();if(id==null)return r.ls||{};if(!(r.ls||(r.ls={}))[id]){r.ls[id]=day();dirty=true;if(!off)save()}return r.ls},
  forget(){off=true;R=null;try{localStorage.removeItem(KEY)}catch(e){}},
  resume(){off=!KEY;R=null;dirty=false}}})();
const coachEsc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const coachNm=()=>{try{return MGP.me&&MGP.me.name||''}catch(e){return ''}};

const COACH={

function coachLine(k){const [pose,ls]=COACH[k];return `<div class="mcoach"><img src="images/coach-moon-${pose}.webp" alt="" width="58" height="70" onerror="this.parentNode.remove()"><p><b>${L('문 코치','Coach Moon')}</b>${coachSay_(ls)}</p></div>`}
let coachAt=0,coachRun=0,coachMiss=0;
// true while a game window (dialog) is open, so the bubble never covers one
const coachBusy=()=>[...document.querySelectorAll('[role="dialog"],[aria-modal="true"]')].some(e=>e.getAttribute('aria-hidden')!=='true'&&e.getClientRects().length&&getComputedStyle(e).visibility!=='hidden');
function coachLater(fn,left=180){if(!coachBusy()){fn();return}if(left>0)setTimeout(()=>coachLater(fn,left-1),1000)}
function coachPop(pose,ko,en,o={}){const now=Date.now();if(!o.force&&now-coachAt<(o.gap||60000))return false;if(!o.force&&coachBusy())return false;coachAt=now;
 let el=document.getElementById('coachPop');if(!el){el=document.createElement('div');el.id='coachPop';el.setAttribute('role','status');document.body.appendChild(el)}
 el.innerHTML=`<img src="images/coach-moon-${pose}.webp" alt="" onerror="this.remove()"><p><b>${L('문 코치','Coach Moon')}</b>${L(ko,en)}</p>`;
 el.classList.remove('show');void el.offsetWidth;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),o.ms||4500);return true}
// call with every final answer: praise runs of right answers, and help after two misses in a row.
// The optional skill id (one of the skill ids in the game's LR summary) counts the answer for that skill in the report,
// and the optional item (see LR above) lets the report list the kinds of questions the child often gets wrong.
function coachAnswer(ok,skill,item){try{LR.ans(ok,skill,item)}catch(e){}
 if(ok){coachRun++;coachMiss=0;if(![3,5,10,15,20,30].includes(coachRun))return;const n=coachRun,t=coachPick([[`${n}번 연속 성공! 집중력이 대단해요 🌙`,`${n} in a row! Amazing focus 🌙`],[`와, ${n}번 연속이에요! 문 코치가 박수 쳐요 👏`,`Wow, ${n} in a row! Coach Moon is clapping 👏`],[`${n}번 연속! 오늘 머리가 반짝반짝해요 ✨`,`${n} straight! Your brain is sparkling today ✨`]]);coachPop('clap',t[0],t[1],{gap:20000});return}
 coachRun=0;coachMiss++;if(coachMiss!==2)return;const nm=coachEsc(coachNm()),t=coachPick([['괜찮아요! 틀리면서 배우는 거예요. 천천히 다시 봐요 🌙','That’s okay! Mistakes help us learn. Take another look 🌙'],[nm?`${nm}, 할 수 있어요! 문 코치가 응원해요 🌙`:'할 수 있어요! 문 코치가 응원해요 🌙',nm?`You can do it, ${nm}! Coach Moon is cheering 🌙`:'You can do it! Coach Moon is cheering 🌙'],['실수는 배움의 친구예요. 한 번 더 해 봐요!','Mistakes are friends of learning. One more try!']]);coachPop('go',t[0],t[1],{gap:30000})}
// Once a day per game he says hello, a few minutes in he shares a tip, and after 20 minutes he suggests a little rest.
// Each day a game is opened is noted for the main page's praise-stamp board.
function coachStart(hello,tips){const game=(location.pathname.split('/').pop()||'index').replace(/\.html$/,''),k='moonGames.coach'+(MGP.me?'@'+MGP.me.id:''),d=new Date().toLocaleDateString('en-CA');
 const notes=f=>{let st={};try{st=JSON.parse(localStorage.getItem(k)||'{}')||{}}catch(e){}f(st);try{localStorage.setItem(k,JSON.stringify(st))}catch(e){}return st};
 const st=notes(st=>{st.played=(st.played||[]).filter(x=>x!==d).concat(d).slice(-14)}),nm=coachEsc(coachNm());
 // the hello counts as said only once it has really been shown
 if((st.hello||{})[game]!==d)setTimeout(()=>coachLater(()=>setTimeout(()=>{if(coachPop('hi',`${hello[0]} ${nm?`문 코치는 언제나 ${nm} 편이에요 🌙`:'문 코치가 응원해요 🌙'}`,`${hello[1]} ${nm?`Coach Moon is always on your side, ${nm} 🌙`:'Coach Moon is cheering for you 🌙'}`,{force:true,ms:6000}))notes(st=>{(st.hello=st.hello||{})[game]=d})},900)),2500);
 if(tips&&tips.length)setTimeout(()=>{const t=coachPick(tips);coachPop('idea',t[0],t[1],{ms:6000})},4*60000);
 setTimeout(()=>coachLater(()=>coachPop('go','벌써 20분이나 열심히 했어요! 눈이 피곤하면 잠깐 쉬어도 좋아요 🌙','20 minutes of hard work already! Rest your eyes for a bit if they’re tired 🌙',{force:true,ms:7000})),20*60000)}
// Chrome's read-aloud voice can freeze: it says it is speaking, but no sentence ever starts and every later one waits behind it.
// Starting a sentence the instant after cancel() is a common trigger, so a sentence that follows a cancel waits a moment.
// A sentence that has not started after 3 seconds is cancelled and tried once more; if that try is stuck too,
// Coach Moon says once how to get the voice back, instead of the game going quiet with no reason.
(()=>{const ss=window.speechSynthesis;if(!ss||ss.__mgGuard||typeof SpeechSynthesisUtterance!=='function')return;ss.__mgGuard=1;
 const speak0=ss.speak.bind(ss),cancel0=ss.cancel.bind(ss),live=new Set();let gen=0,cutAt=0,told=false;
 ss.cancel=()=>{gen++;if(ss.speaking||ss.pending)cutAt=performance.now();live.clear();cancel0()};
 const send=(u,my,retry)=>{if(my!==gen)return;const watch=!live.size;let started=false;live.add(u);
  u.addEventListener('start',()=>{started=true});['end','error'].forEach(e=>u.addEventListener(e,()=>live.delete(u)));
  try{if(ss.paused)ss.resume()}catch(e){}speak0(u);if(!watch)return;
  setTimeout(()=>{if(started||my!==gen||!live.has(u))return;live.delete(u);cancel0();
   if(!retry){const c=new SpeechSynthesisUtterance(u.text);['lang','voice','rate','pitch','volume'].forEach(k=>{try{c[k]=u[k]}catch(e){}});setTimeout(()=>send(c,my,true),200)}
   else if(!told){told=true;if(typeof coachPop==='function')coachPop('idea','목소리가 잠깐 멈췄어요. 브라우저를 완전히 껐다 켜면 다시 들려요 🌙','The voice got stuck. Close the browser fully and open it again to hear it 🌙',{force:true,ms:8000})}},3000)};
 ss.speak=u=>{const my=gen,wait=cutAt+150-performance.now();if(wait>0)setTimeout(()=>send(u,my,false),wait);else send(u,my,false)}})();
// Mini lessons (미니 수업) and the concept notebook (개념 노트), shared by every game. Kids asked for time to learn
// before solving, so a teacher talks the child through a few short pages first: see, hear, then do one small thing.
// · A lesson: {id, title:[ko,en], icon, who?:{img,name:[ko,en]}, steps:[...], key:[[ko,en],...], cta?:[ko,en]}
//   Each step is {say:[ko,en], art?, try?, show?}. art is an HTML string, or a function (box,api) that draws the
//   picture with the game's own helpers. On a "try" step the child does the small thing in the picture and the game
//   calls api.done(); "🤔 알려 줘요" runs show(box,api) (or just api.done()) so not knowing never blocks or costs anything.
//   after(box,api), if given, runs once the teacher has finished reading the step (for example to play a demo).
//   key holds the 1–3 lines to remember; they close the lesson and stay in the notebook.
// · MiniLesson.cfg({voice:(text,onEnd)=>…, stop:()=>…, who:{img,name}}) once per game: the game's own read-aloud (it
//   respects the game's voice switch; onEnd, when the game supports it, runs after the line), what to stop when a page
//   changes (demos, sounds), and the default teacher.
// · MiniLesson.open(lesson,{onDone,onClose}) plays a lesson. MiniLesson.before(lesson,go) plays it the first time and
//   then calls go(); later it calls go() at once. Closing early also calls go(), so a lesson never traps the child.
// · MiniLesson.book({title,groups:[{name:[ko,en],items:[{id,title,icon,key,lesson}]}],open}) shows the notebook; an
//   item's lesson is a lesson object or a function that returns one. After a lesson the notebook comes back.
// · What was watched to the end is kept in the game's learning record (LR.les), so it resets with the game and the
//   parents' report can show it.
const MiniLesson=(()=>{let C={voice:null,who:null},el=null,cur=null,back=null,lastFocus=null;
 const T=x=>Array.isArray(x)?L(x[0],x[1]):String(x==null?'':x),E=s=>coachEsc(T(s));
 const seen=id=>{try{return !!LR.les()[id]}catch(e){return false}};
 const talk=(t,cb)=>{try{if(C.voice){if(C.voice.length>1){C.voice(t,cb);return}C.voice(t)}}catch(e){}if(cb)setTimeout(cb,400)},
  hush=()=>{try{if(C.stop)C.stop()}catch(e){}try{speechSynthesis.cancel()}catch(e){}};
 function shell(cls){close(true);lastFocus=document.activeElement;el=document.createElement('div');el.className='mlx '+(cls||'');
  el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');document.body.appendChild(el);document.addEventListener('keydown',key,true);return el}
 function close(quiet){if(!el)return;hush();document.removeEventListener('keydown',key,true);el.remove();el=null;const c=cur;cur=null;
  if(!quiet){if(c&&c.o.onClose)c.o.onClose(c.done);if(back){const b=back;back=null;book(b.spec,b.at)}else if(lastFocus&&lastFocus.focus)try{lastFocus.focus()}catch(e){}}}
 function key(e){if(!el)return;if(e.key==='Escape'){e.preventDefault();e.stopPropagation();close();return}
  if(!cur)return;if(e.key==='ArrowRight'){const b=el.querySelector('[data-m=next]');if(b&&!b.disabled){e.preventDefault();b.click()}}else if(e.key==='ArrowLeft'&&cur.i>0){e.preventDefault();go(cur.i-1)}}
 function open(ls,o={}){if(!ls||!ls.steps||!ls.steps.length)return;const who=ls.who||C.who||{img:'images/coach-moon-idea.webp',name:['문 코치','Coach Moon']};
  shell('');cur={ls,o,who,i:0,done:false,ok:{}};
  el.setAttribute('aria-labelledby','mlxT');
  el.innerHTML=`<div class="mlx-card"><div class="mlx-top"><span class="mlx-kick">📖 ${L('미니 수업','Mini lesson')}</span><b id="mlxT">${ls.icon?ls.icon+' ':''}${E(ls.title)}</b><button type="button" class="mlx-x" data-m="x" aria-label="${L('닫기','Close')}">✕</button></div>
   <div class="mlx-dots" aria-hidden="true"></div><div class="mlx-stage"></div>
   <div class="mlx-talk"><img src="${coachEsc(who.img)}" alt="" onerror="this.remove()"><p aria-live="polite"></p><button type="button" class="mlx-hear" data-m="hear" aria-label="${L('다시 듣기','Hear again')}">🔊</button></div>

  el.addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b||!cur)return;const m=b.dataset.m;
   if(m==='x')close();else if(m==='hear')talk(el.querySelector('.mlx-talk p').textContent);else if(m==='prev')go(cur.i-1);else if(m==='next')go(cur.i+1);
   else if(m==='help'){const s=cur.ls.steps[cur.i];try{if(s.show)s.show(el.querySelector('.mlx-stage'),api(cur.i))}catch(e){}api(cur.i).done()}
   else if(m==='again')go(0);else if(m==='end'){const c=cur;close(true);if(back){const b=back;back=null;book(b.spec,b.at)}else if(lastFocus&&lastFocus.focus)try{lastFocus.focus()}catch(e){}if(c.o.onDone)c.o.onDone()}});
  go(0)}

@keyframes nodePulse{50%{transform:translateX(calc(var(--off)*var(--k))) scale(1.04)}}
@media (max-width:440px){.node{--k:.55}}

/* ---------------------------------------------------------------- lesson slides */
.lesson .lhead h2{margin:2px 0 8px}
.ldots{display:flex;gap:6px;align-items:center}
.ldots i{width:28px;height:8px;border-radius:99px;background:#e4dcff;font-style:normal}
.ldots i.on{background:var(--brand)}
.ldots i.act{width:auto;height:auto;background:none;font-size:18px;margin-left:4px}
.teach{display:flex;gap:12px;align-items:center;margin:12px 0}
.teach .say{position:relative;flex:1;background:#f6f2ff;border-radius:18px;padding:12px 14px;font-weight:800;font-size:17px;line-height:1.45}
.teach .say::before{content:"";position:absolute;left:-9px;top:24px;border:9px solid transparent;border-right-color:#f6f2ff;border-left:0}
.vis{min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#fffaf0;border-radius:18px;padding:12px;margin-bottom:6px}
.vemoji{font-size:64px;line-height:1.2;text-align:center}
.vtext{font-size:30px;font-weight:900;letter-spacing:4px}
.vkbd,.vstaff,.vrhy{width:100%;max-width:420px}
.vkbd svg,.vstaff svg,.vrhy svg{width:100%;height:auto;display:block}
.vkbd rect{transition:fill .12s}
.sn.lit ellipse,.sn.lit line,.sn.lit path{fill:#ff5fa2;stroke:#ff5fa2}
.sn{transition:transform .1s}
.vsym,.vinstr{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.vsym div,.vinstr div{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:900;font-size:14px}
.ib{display:grid;place-items:center;width:64px;height:64px;font-size:44px;background:#fff;border-radius:16px;box-shadow:0 3px 0 #ece4ff}
.isvg{width:52px;height:52px;display:block}
.vpulse{position:relative;width:120px;height:120px;display:grid;place-items:center}
.vpulse i{position:absolute;inset:0;border-radius:50%;background:#ff5fa233;animation:vp var(--d) infinite}
.vpulse b{font-size:54px}
.vpulse.beat i{animation:none;transform:scale(1.15);background:#ff5fa266}
@keyframes vp{0%{transform:scale(.8);opacity:1}100%{transform:scale(1.25);opacity:0}}
.vpads{display:flex;gap:12px}
.vp{display:flex;flex-direction:column;align-items:center;justify-content:center;width:84px;height:84px;border-radius:50%;background:var(--c);color:#fff;font-size:30px;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.vp small{font-size:13px;font-weight:900}
.vp.hit{animation:padhit .18s}
@keyframes padhit{50%{transform:scale(.88);filter:brightness(1.3)}}
.vlabel{min-height:34px;font-size:22px;font-weight:900;color:var(--brand-d)}
.vlabel.pop{animation:popin .35s}
@keyframes popin{from{transform:scale(.6);opacity:0}}
.lbtns{margin-top:6px}

/* ---------------------------------------------------------------- activity frame */
.phead{color:#fff;font-weight:900;font-size:16px;margin:0 4px 8px;opacity:.95;text-align:center}
.host{position:relative}
.tline{display:flex;align-items:center;gap:8px;min-height:50px}
.tline.small .tface{width:38px;height:38px;font-size:22px}
.tbub{position:relative;background:#fff;border-radius:14px;padding:6px 12px;font-weight:900;font-size:15px;opacity:0;transform:translateX(-6px);transition:all .25s;box-shadow:0 4px 10px rgba(0,0,0,.15)}
.tbub.show{opacity:1;transform:none}
.tbub.big{background:linear-gradient(90deg,#fff3c4,#ffd6ea);font-size:16px}
.cdown{position:absolute;left:50%;top:38%;z-index:5;transform:translate(-50%,-50%);font-size:96px;font-weight:900;color:#fff;text-shadow:0 6px 18px rgba(0,0,0,.4);pointer-events:none}
.cdown.pop{animation:cd .5s}
@keyframes cd{from{transform:translate(-50%,-50%) scale(1.6);opacity:0}}
.qdots{display:flex;gap:6px;justify-content:center;margin:6px 0 10px;flex-wrap:wrap}
.qdots i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.35)}
.qdots i.cur{background:#fff}
.quiz .qdots i,.keytask .qdots i,.sing .qdots i{background:#e4dcff}.quiz .qdots i.cur{background:#7b5cff}
.qdots i.ok{background:#3ee07a}.qdots i.half{background:#ffd23f}.qdots i.no{background:#ff7b8a}

/* beat tapping */
.beatlab,.rhylab,.quiz,.keytask,.sing,.breath,.micgate,.howto{background:rgba(255,255,255,.96);border-radius:24px;padding:12px 14px 16px;box-shadow:var(--shadow);position:relative}
.bl-msg,.rl-msg{text-align:center;font-weight:900;font-size:17px;min-height:26px}
.bl-msg.quietmsg{color:#7b5cff}
.bl-stage{position:relative;width:220px;height:220px;margin:8px auto;display:grid;place-items:center}
.bl-ring{position:absolute;inset:0;border-radius:50%;border:6px solid #ff5fa2;opacity:0}
.bl-ring.beat{animation:ring .5s ease-out}
@keyframes ring{0%{transform:scale(.75);opacity:1}100%{transform:scale(1.15);opacity:0}}
.bl-pad{position:relative;width:170px;height:170px;border-radius:50%;border:0;background:radial-gradient(circle at 40% 35%,#fff7e0,#ffcf6b 55%,#f29a1e);box-shadow:0 10px 0 #c97a10,0 18px 30px rgba(0,0,0,.25);display:grid;place-items:center;touch-action:none}
.bl-pad.hit{animation:padhit2 .16s}
@keyframes padhit2{50%{transform:translateY(6px) scale(.96);box-shadow:0 4px 0 #c97a10}}
.bl-hop{font-size:56px;line-height:1;will-change:transform}.bl-hop .ei{width:70px;height:70px}
/* Ms. Hop's shadow on the drum: small when she is high in the air, full when she lands on the beat */
.bl-shadow{position:absolute;left:50%;top:62%;width:64px;height:14px;margin-left:-32px;border-radius:50%;background:rgba(122,67,0,.28);pointer-events:none}
.bl-num{position:absolute;bottom:18px;font-size:22px;font-weight:900;color:#7a4300}
.bl-meter{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:900;color:var(--muted);margin:6px 0}
.bl-bar{position:relative;flex:1;height:18px;border-radius:99px;background:linear-gradient(90deg,#ffd6dc,#fff 40%,#fff 60%,#ffd6dc)}
.bl-bar em{position:absolute;left:50%;top:-4px;bottom:-4px;width:3px;margin-left:-1.5px;background:#3ec46d;border-radius:2px}
.bl-bar i{position:absolute;top:-3px;width:14px;height:24px;margin-left:-7px;border-radius:7px;left:50%;background:#ccc;opacity:0}
.bl-bar i.flash{animation:tick 1s}
@keyframes tick{0%{opacity:1;transform:scale(1.3)}70%{opacity:1}100%{opacity:.25;transform:none}}
.bl-judge{text-align:center;font-size:26px;font-weight:900;min-height:36px}
.bl-judge.pop,.hw-judge.pop{animation:jpop .45s}
@keyframes jpop{from{transform:scale(1.5);opacity:.3}}
.bl-dots{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:6px 0 4px}
.bl-dots i{width:14px;height:14px;border-radius:50%;background:#e4dcff}
.bl-dots i.quiet{box-shadow:inset 0 0 0 2px #7b5cff;background:#f6f2ff}
.bl-dots i.jp{background:#ffd23f}.bl-dots i.jg{background:#3ee07a}.bl-dots i.jo{background:#5cc8ff}.bl-dots i.jm{background:#ff7b8a}

/* rhythm */
.rl-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rl-top b{background:#f1edff;border-radius:99px;padding:3px 10px;font-size:13px}
.rl-sheet{min-height:96px;display:grid;place-items:center;background:#fffaf0;border-radius:16px;margin:8px 0;padding:4px}
.rl-sheet svg{width:100%;height:auto;max-height:140px}
.rl-hidden{font-size:22px;font-weight:900;color:var(--brand-d)}
.rl-ctl{display:flex;gap:10px;justify-content:center;min-height:52px;flex-wrap:wrap}
.rl-pad{width:150px;height:150px;margin:10px auto 4px;display:grid;font-size:56px}
.rl-pad.listening{filter:grayscale(.6);opacity:.6}
.rl-pop{position:absolute;left:50%;top:-6px;font-style:normal;font-size:24px;animation:rlp .6s forwards}
@keyframes rlp{to{transform:translateY(-40px);opacity:0}}
/* beat bar: one bubble per beat of the bar, lit in time; the colour says whose turn it is (count-in, teacher, me, inner beat) */
.bbar{margin:4px auto 2px;max-width:440px;text-align:center}
.bb-tag{display:inline-block;min-height:26px;padding:3px 14px;border-radius:99px;font-size:15px;font-weight:900;background:#f1edff;color:var(--brand-d)}
.bb-tag:empty{visibility:hidden}
.bbar[data-ph="listen"] .bb-tag{background:#e0f3ff;color:#1b74b3}
.bbar[data-ph="go"] .bb-tag{background:#ffe5f0;color:#c92a6f}
.bbar[data-ph="quiet"] .bb-tag{background:#f3efff;color:#6a4be0}
.bb-row{position:relative;display:flex;gap:10px;justify-content:center;align-items:center;margin:18px 0 14px;min-height:64px}
.bb-row i{position:relative;width:50px;height:50px;border-radius:50%;background:#efeafd;display:grid;place-items:center;font-style:normal;transition:background .1s,transform .1s,box-shadow .2s}
.bb-row i.one{width:62px;height:62px;box-shadow:inset 0 0 0 3px #d6ccf7}
.bb-row i b{font-size:21px;font-weight:900;color:#a395d6;transition:color .1s}
.bb-row i.one b{font-size:25px}
.bb-row i.on{transform:scale(1.14)}.bb-row i.on b{color:#fff}
.bbar[data-ph="ready"] .bb-row i.on{background:#8d7bff}
.bbar[data-ph="listen"] .bb-row i.on{background:#3daef5}
.bbar[data-ph="go"] .bb-row i.on{background:#ff5fa2}
.bbar[data-ph="quiet"] .bb-row i{background:transparent;box-shadow:inset 0 0 0 2px #cfc3f7}
.bb-row i.jp{box-shadow:0 0 0 5px #ffd23f}.bb-row i.jg{box-shadow:0 0 0 5px #3ee07a}.bb-row i.jo{box-shadow:0 0 0 5px #5cc8ff}.bb-row i.jm{box-shadow:0 0 0 5px #ff7b8a}
/* the ball hops from bubble to bubble and lands on each one on its beat, so the next beat can be seen coming */
.bb-head{position:absolute;left:0;top:0;z-index:3;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--brand-d);box-shadow:0 2px 4px rgba(0,0,0,.25);opacity:0;text-decoration:none;will-change:transform}
.bbar[data-ph="listen"] .bb-head{background:#3daef5}.bbar[data-ph="go"] .bb-head{background:#ff5fa2}
.bb-n{position:absolute;top:-9px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#3daef5;text-decoration:none;animation:popin .2s}
.bb-n.kid{top:auto;bottom:-26px;background:#ff5fa2}.bb-n.x{background:#ff7b8a;border-radius:3px}
.bb-say{min-height:42px;font-size:32px;line-height:42px;font-weight:900;color:var(--brand-d)}
.bb-say.go{color:#ff3d8b}.bb-say.small{font-size:20px}
.bb-say.pop{animation:jpop .4s}
.bl-pad.go,.rl-pad.go{box-shadow:0 10px 0 #c97a10,0 0 0 10px rgba(255,95,162,.45),0 18px 30px rgba(0,0,0,.25)}
.bl-ctl{display:flex;justify-content:center;min-height:0}
.bl-ctl .btn{margin:2px auto 6px}
.rl-msg{font-size:16px;text-align:right}
@media (max-width:420px){.bl-stage{width:190px;height:190px;margin:4px auto}.bl-pad{width:150px;height:150px}.bb-row{gap:8px}.bb-row i{width:46px;height:46px}.bb-row i.one{width:56px;height:56px}.rl-pad{width:130px;height:130px}}
/* short screens (phones with the address bar, small laptops): everything to play with stays on screen without scrolling */
@media (max-height:760px){.bl-pad.rl-pad{width:112px;height:112px;margin:6px auto 2px;font-size:46px}.rl-ctl:empty{min-height:0}.rl-sheet{margin:4px 0}.rl-sheet svg{max-height:112px}.rhylab .bb-row{margin:12px 0 8px}
 .bl-stage{width:180px;height:180px;margin:2px auto}.bl-pad{width:140px;height:140px}}
.vbar .bbar{margin:0 auto}

/* falling notes */
.hw{display:flex;flex-direction:column;gap:6px;height:calc(100dvh - 120px);min-height:520px;position:relative}
.hw-top{display:flex;align-items:center;gap:8px;color:#fff;font-weight:900}
.hw-score{font-size:22px;min-width:64px}
.hw-combo{font-size:18px;color:#ffd23f;min-width:50px}
.hw-prog{flex:1;height:10px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden}
.hw-prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff8fd1,#ffd23f)}
.hw-acc{min-width:44px;text-align:right}
.hw .tline{min-height:0;height:40px;flex:0 0 auto}
.hw .tbub{font-size:14px;line-height:1.15;max-height:38px;overflow:hidden}
.hw-staff{width:100%;height:110px;border-radius:14px;background:#fffdf7;flex:0 0 auto}
.hw-road{position:relative;flex:1;min-height:200px;border-radius:18px;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(255,255,255,.2)}
.hw-cv{position:absolute;left:0;top:0;display:block;width:100%;height:100%}
.hw-judge{position:absolute;left:0;right:0;top:28%;text-align:center;pointer-events:none;font-size:34px;font-weight:900;text-shadow:0 3px 10px rgba(0,0,0,.45)}
.hw-judge i{display:block;font-style:normal;font-size:18px;color:#fff}
.hw-input{flex:0 0 auto;position:relative}
.hw-input.song{height:min(170px,24vh)}
.hw-input.drum,.hw-input.chordplay{display:flex;gap:8px;height:min(150px,22vh)}
.hw-hint{color:#e9e2ff!important;font-size:13px}
.hw .cdown{top:24%;font-size:56px;opacity:.92}
.hw-judge .hint{color:#fff;font-size:24px}
/* keys and pads show the note colour, and fill up with it as their next note comes down: full = press now */
.hw .pk.w:not(.rb){box-shadow:inset 0 -7px 0 var(--nc)}
.hw .pk.b{box-shadow:0 3px 0 #0b0e1a,inset 0 -5px 0 var(--nc)}
.hw .pk::before,.hw .pad::before{content:'';position:absolute;left:0;right:0;bottom:0;height:calc(var(--s,0)*100%);background:var(--nc,#fff);opacity:.55;border-radius:inherit;pointer-events:none;z-index:0}
.hw .pad::before{background:#fff;opacity:.4}
.hw .pk span,.hw .pad>:not(kbd){position:relative;z-index:1}.hw .pad kbd{z-index:1}
.pad.want{animation:kglow .5s 2}
.hw-rivals{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;background:rgba(0,0,0,.25);border-radius:12px;padding:6px 8px}
.rrow{position:relative;display:flex;gap:6px;align-items:center;color:#fff;font-size:12.5px;font-weight:800;height:20px}
.rrow span{width:16px}.rrow b{position:relative;z-index:1;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.rrow i{position:absolute;left:22px;top:2px;bottom:2px;border-radius:6px;background:rgba(255,255,255,.18);transition:width .3s}
.rrow.me i{background:linear-gradient(90deg,#ff8fd1aa,#ffd23faa)}
/* short screens: a smaller staff and keys keep the keys on screen; in contests the rivals' table stands in for the teacher line */
@media (max-height:760px){.hw{min-height:440px}.hw-staff{height:84px}.hw-road{min-height:140px}.hw-input.song{height:min(150px,22vh)}.hw.ct .tline{display:none}}
.pad{flex:1;border:0;border-radius:20px;background:var(--c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;box-shadow:0 6px 0 rgba(0,0,0,.25);touch-action:none;position:relative}
.pad .pi{font-size:34px;line-height:1.1}.pad b{font-size:20px}.pad small{font-size:12px;font-weight:800;opacity:.9}.pad .cn{font-size:30px}
.pad kbd{position:absolute;top:6px;right:8px;font:900 12px system-ui;background:rgba(0,0,0,.25);border-radius:6px;padding:1px 5px}
.pad.down{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.25);filter:brightness(1.15)}
@media (pointer:coarse){.pad kbd{display:none}}
/* playable keys */
.pkeys{position:relative;height:100%;min-height:120px;touch-action:none;-webkit-user-select:none;user-select:none}
.pk{position:absolute;top:0;border:0;padding:0;display:flex;align-items:flex-end;justify-content:center;touch-action:none}
.pk.w{height:100%;background:linear-gradient(180deg,#fff 70%,#eef0f7);border:1.5px solid #9aa5c2;border-radius:0 0 10px 10px;box-shadow:inset 0 -6px 0 #dfe3ee;z-index:1}
.pk.b{height:60%;background:linear-gradient(180deg,#3a4466,#1d2238);border-radius:0 0 7px 7px;z-index:2;box-shadow:0 3px 0 #0b0e1a}
.pk span{font-weight:900;font-size:clamp(12px,2.6vw,16px);color:#5f6b8f;margin-bottom:10px;pointer-events:none}
.pk.b span{color:#fff;font-size:12px;letter-spacing:-.6px;white-space:nowrap;margin-bottom:6px}
.pk.w.rb{box-shadow:inset 0 -14px 0 var(--nc)}
.pk.w.gd{background:linear-gradient(180deg,#fffbe6 60%,#ffe08a)}
.pk.b.gd{background:linear-gradient(180deg,#8a6a1a,#3a2a06)}
.pk.down,.pk.w.down{background:linear-gradient(180deg,#ffe6f2,#ffc2de)}
.pk.b.down{background:#7b5cff}
.pk.glow{animation:kglow .9s infinite}
.pk.w.glow{background:linear-gradient(180deg,#fff,#ffe680)}
@keyframes kglow{50%{box-shadow:inset 0 -6px 0 #ffd23f,0 0 0 4px #ffd23f}}
.pk.hint{background:linear-gradient(180deg,#fff,#b8f5cf)!important;animation:kglow .7s infinite}
.pk.b.hint{background:#3ec46d!important}
.pk.good{background:linear-gradient(180deg,#e8fff0,#9fe8b9)!important}
.pk.b.good{background:#1f9a4f!important}
.pk.bad,.pk.nope{animation:shake .35s;background:linear-gradient(180deg,#fff,#ffc4cb)!important}
.pk.sel{background:linear-gradient(180deg,#eef4ff,#a9c8ff)!important}
.pk.b.sel{background:#2a8df4!important}
.pk.start{background:linear-gradient(180deg,#fff,#ffd6ea)!important}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}

/* quiz */
.qcard{margin-top:4px}
.qcard.in{animation:viewIn .3s}
.qq{font-size:19px;font-weight:900;text-align:center;margin:4px 0 10px;line-height:1.35}
.qart{display:grid;place-items:center;font-size:58px;line-height:1.2;margin:6px auto 10px;min-height:70px}
.qart svg{max-width:100%}
.qart.staffart,.qart.kbdart{width:min(320px,100%)}
.qart.staffart svg,.qart.kbdart svg{width:100%;height:auto}
.qart.instr{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:18px}
.qart.instr .ib{width:90px;height:90px;font-size:62px}.qart.instr .isvg{width:74px;height:74px}
.qcard .hear{display:flex;margin:-4px auto 10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.n2{grid-template-columns:1fr 1fr}
.opt{border:0;border-radius:16px;min-height:60px;padding:10px;background:#f1edff;font-weight:900;font-size:16px;box-shadow:0 4px 0 #d6ccfa;line-height:1.25}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 #d6ccfa}
.opt.right{background:linear-gradient(180deg,#d8ffe6,#9fe8b9);box-shadow:0 4px 0 #5fc98a}
.opt.wrong{background:linear-gradient(180deg,#ffe2e6,#ffb3bd);box-shadow:0 4px 0 #f28694;animation:shake .35s}
.opt:disabled{cursor:default}
.qfb{margin-top:10px;text-align:center;font-weight:800;display:grid;gap:6px;justify-items:center}

/* keyboard tasks */
.kt-q{font-size:19px;font-weight:900;text-align:center;line-height:1.35}
.kt-art{display:grid;place-items:center;min-height:10px;margin:6px 0}
.kt-art svg{width:min(300px,90%);height:auto}
.kt-steps{display:flex;gap:6px;justify-content:center;margin:6px 0}
.kt-steps .ss{min-width:34px;padding:4px 6px;border-radius:10px;background:#f1edff;font-weight:900;font-size:14px;text-align:center;color:#b3a8d8}
.kt-steps .ss.ok{background:#3ee07a;color:#fff}.kt-steps .ss.half{background:#ffd23f;color:#5a4300}
.kt-fb{min-height:24px;text-align:center;font-weight:800;color:var(--brand-d)}
.kt-kbd{height:min(180px,28vh);margin-top:6px}
.kt-ctl{display:flex;justify-content:center;gap:10px;margin-top:8px}

/* singing */
.sg-q{text-align:center;font-weight:900;font-size:17px;line-height:1.35}
.sg-q .big{font-size:40px}
.sg-stage{position:relative;margin:8px 0}
.sg-cv{display:block;width:100%;height:min(260px,36vh);border-radius:16px;background:#fffaf0;box-shadow:inset 0 0 0 2px #f0e6cc}
.sg-tip{text-align:center;font-weight:900;font-size:20px;min-height:32px;margin-top:6px;color:var(--brand-d)}
.sg-ctl{display:flex;flex-direction:column;align-items:center;gap:8px}
.sg-ctl .row{margin-top:0}
.sg-tip.ok{color:#1f9d50}.sg-tip.warm{color:#e07800}.sg-tip.cold{color:#3b6fd6}.sg-tip.quiet{color:var(--muted)}
.sg-notes{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:4px 0 8px}

.howsing{position:relative;width:170px;height:150px;margin:10px auto;border-radius:16px;background:#fffaf0;box-shadow:inset 0 0 0 2px #f0e6cc;overflow:hidden}

@keyframes hsBall{0%{transform:translateY(62px)}45%{transform:translateY(14px)}60%,100%{transform:none}}
@keyframes hsTg{0%,58%{box-shadow:0 0 0 7px rgba(62,196,109,.25)}70%,100%{box-shadow:0 0 0 7px #3ec46d,0 0 22px #3ec46d}}
@keyframes hsArr{0%,50%{opacity:1}60%,100%{opacity:0}}
.howbar{margin:8px auto 4px;max-width:300px}

.howbar .hb-row{display:flex;gap:10px;justify-content:center;margin:6px 0}

.howbar .hb-row i:nth-child(1){width:52px;height:52px}
.howbar .hb-row i:nth-child(2){animation-delay:.5s}.howbar .hb-row i:nth-child(3){animation-delay:1s}.howbar .hb-row i:nth-child(4){animation-delay:1.5s}

.howbar .hand{display:block;font-size:34px;animation:hbH 4s infinite}
@keyframes hbT1{0%,48%{opacity:1}52%,100%{opacity:0}}
@keyframes hbT2{0%,48%{opacity:0}52%,100%{opacity:1}}
@keyframes hbB{0%,11%{background:#8d7bff}13%,49%{background:#efeafd}50%,61%{background:#ff5fa2}63%,100%{background:#efeafd}}
@keyframes hbBE{0%,11%{background:#3daef5}13%,49%{background:#efeafd}50%,61%{background:#ff5fa2}63%,100%{background:#efeafd}}
@keyframes hbH{0%,49%{opacity:.25;transform:none}50%,52%,62.5%,64.5%,75%,77%,87.5%,89.5%{opacity:1;transform:translateY(-8px)}51%,56%,63.5%,69%,76%,81%,88.5%,94%{opacity:1;transform:none}}
.micgate{text-align:center}
.mg-ic{font-size:72px;line-height:1.2}
.micgate h3{font-size:18px}
.breath{text-align:center}
.br-msg{font-weight:900;font-size:19px;min-height:30px}
.br-stage{position:relative;height:240px;display:grid;place-items:center}
.br-ball{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d9f6ff,#5cc8ff 60%,#2a8df4);box-shadow:0 10px 30px rgba(42,141,244,.4);transition:transform .2s linear}
.br-ball.out{background:radial-gradient(circle at 35% 30%,#ffe6f2,#ff8fd1 60%,#ff5fa2)}
.br-ball.hold{background:radial-gradient(circle at 35% 30%,#fff7d6,#ffd23f 60%,#f2a500)}
.br-n{position:absolute;font-size:44px;font-weight:900;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.br-meter{display:flex;align-items:center;gap:8px;margin:4px 20px}

.br-cyc{display:flex;gap:8px;justify-content:center;margin:8px}

/* how-to cards */
.howto{text-align:center}
.howto p{font-weight:800;font-size:17px;line-height:1.45}
.howroad{position:relative;width:180px;height:170px;margin:10px auto;background:linear-gradient(180deg,#2a1466,#5a33b8);border-radius:16px;overflow:hidden}
.howroad .blk{position:absolute;left:62px;width:56px;height:30px;border-radius:9px;background:#ff5fa2;animation:fall 1.8s infinite linear}

@keyframes fall{0%{top:-30px}70%{top:106px;opacity:1}75%{opacity:0}100%{top:106px;opacity:0}}
@keyframes handtap{0%,62%{transform:translateY(10px)}70%{transform:translateY(-4px)}80%,100%{transform:translateY(10px)}}

@keyframes hb{0%,100%{transform:scale(1)}10%{transform:scale(.92)}}
@keyframes handtap2{0%,100%{transform:translate(0,0)}10%{transform:translate(-10px,-10px)}}

/* results */
.result{text-align:center}
.rstars{display:flex;justify-content:center;gap:8px;font-size:56px;line-height:1;color:#e4dcff}

.mx+h2{padding-right:44px}
@keyframes fadeIn{from{opacity:0}}
@keyframes popIn{from{opacity:0;transform:scale(.85)}}
.newtitle{font-size:22px;font-weight:900;color:var(--brand-d)}
.lvup .big,.ach .big,.chest .big{animation:float 2s infinite}
.streakup .flame{font-size:84px;animation:float 1.6s infinite}
@keyframes float{50%{transform:translateY(-8px) scale(1.05)}}
.plist{display:grid;gap:8px}

 {id:'a3',u:'A',t:'마음속 박자|The beat inside you',intro:[
  {t:'진짜 음악가는 소리가 없어도 마음속으로 박을 세요.|Real musicians keep the beat in their heads, even in silence.',v:{emoji:'🧠💓'}},
  {t:'똑딱 소리가 중간에 사라져요. 그래도 같은 빠르기로 계속 쳐요! 마지막에 소리가 돌아오면 얼마나 맞았는지 알 수 있어요.|The ticks will disappear in the middle. Keep tapping at the same speed! When they come back, you’ll see how close you stayed.',v:{emoji:'🤫'}}],
  a:{type:'beat',bpm:84,beats:24,fade:[8,20]}},
 {id:'a4',u:'A',t:'센박과 여린박|Strong and weak beats',intro:[
  {t:'박을 넷씩 묶으면 첫 번째 박이 가장 힘차요. 이걸 “센박”이라고 해요.|When beats come in groups of four, the first one is the strongest. It’s the “strong beat”.',v:{text:'💥 · · · 💥 · · ·'},p:{drum:{pattern:'accent4',bars:2,bpm:80}}},
  {t:'첫째 박은 “쿵”, 나머지 박은 “칫”! 하나 둘 셋 넷!|Beat one goes “boom”, the others go “tss”! One, two, three, four!'}],
  a:{type:'drum',pattern:'accent4',bars:6,bpm:76,lanes:['kick','hat']}},
 // B ---- pitch and keyboard
 {id:'b1',u:'B',t:'높은 소리, 낮은 소리|High and low sounds',intro:[
  {t:'새가 짹짹하는 소리는 높고, 곰이 우우하는 소리는 낮아요.|A bird’s tweet is high and a bear’s growl is low.',v:{emoji:'🐦  🐻'},p:{seq:{notes:'C6/1 C3/1',bpm:70}}},
  {t:'피아노는 오른쪽으로 갈수록 높은 소리, 왼쪽으로 갈수록 낮은 소리가 나요.|On a piano, sounds get higher to the right and lower to the left.',v:{kbd:{from:48,to:72,labels:false}},p:{seq:{notes:'C3/.5 E3/.5 G3/.5 C4/.5 E4/.5 G4/.5 C5/1',bpm:100}}}],
  a:{type:'pitch',task:'hl',count:6}},
 {id:'b2',u:'B',t:'건반 지도|The keyboard map',intro:[
  {t:'검은 건반은 2개, 3개씩 짝을 지어 있어요. 이게 건반의 지도예요!|Black keys come in groups of 2 and 3. That’s the map of the keyboard!',v:{kbd:{from:48,to:71,labels:false,dots:{49:'#ff5fa2',51:'#ff5fa2',54:'#3ec4ff',56:'#3ec4ff',58:'#3ec4ff',61:'#ff5fa2',63:'#ff5fa2',66:'#3ec4ff',68:'#3ec4ff',70:'#3ec4ff'}}}},
  {t:'검은 건반 2개 바로 왼쪽 흰 건반이 “도”예요. 3개 바로 왼쪽은 “파”예요.|The white key just left of the 2 black keys is “Do” (C). Just left of the 3 black keys is “Fa” (F).',v:{kbd:{from:48,to:71,labels:false,hi:{48:'#ff5a5f',60:'#ff5a5f',53:'#3ec46d',65:'#3ec46d'}}},p:{seq:{notes:'C4/1 F4/1 C5/1',bpm:80}}}],
  a:{type:'keys',task:'findCF',count:6}},
 {id:'b3',u:'B',t:'도레미파솔라시도|Do Re Mi Fa Sol La Ti Do',intro:[
  {t:'흰 건반은 도부터 차례로 도·레·미·파·솔·라·시예요. 그리고 다시 도!|From Do, the white keys go Do, Re, Mi, Fa, Sol, La, Ti, and then Do again!',v:{kbd:{from:60,to:72,labels:true}},p:{seq:{notes:'C4/.5 D4/.5 E4/.5 F4/.5 G4/.5 A4/.5 B4/.5 C5/1',bpm:90}}},
  {t:'영어로는 C·D·E·F·G·A·B라고도 불러요. 도 = C예요.|In letters they are C, D, E, F, G, A, B. Do = C.',v:{kbd:{from:60,to:72,labels:true,names:'letter'}}}],
  a:{type:'keys',task:'name',range:[60,72],count:8}},
 {id:'b4',u:'B',t:'첫 노래 연습|Your first song',intro:[
  {t:'도·레·미 세 음으로 “뜨거운 빵”을 쳐 봐요. 미-레-도!|Let’s play “Hot Cross Buns” with just Do, Re, Mi. Mi-Re-Do!',v:{kbd:{from:60,to:64,labels:true,hi:{60:'#ff5a5f',62:'#ff9f1c',64:'#ffd23f'}}},p:{song:'hotcross'}},
  {t:'이번엔 천천히 기다려 주는 연습이에요. 빛나는 건반을 눌러요!|This is wait-for-me practice. Press the glowing key!'}],
  a:{type:'song',song:'hotcross',step:true}},
 {id:'b5',u:'B',t:'박자에 맞춰 뜨거운 빵|Hot Cross Buns in time',intro:[
  {t:'이제 음표가 내려와요. 노란 선에 닿을 때 딱 맞춰 눌러요! 건반이 같은 색으로 꽉 차오르는 순간이 누를 때예요.|Now the notes fall down. Press when they touch the yellow line! When the key fills up with colour, it’s time to press.',v:{emoji:'⬇️🎹'}},
  {t:'가로줄 하나가 한 박이에요. 길쭉한 음표는 길게 이어지는 음이니까 다음 음을 기다려요.|Each line across is one beat. Long notes last longer, so wait for the next one.'}],
  a:{type:'song',song:'hotcross',speed:.85}},
 {id:'b6',u:'B',t:'메리의 어린 양|Mary Had a Little Lamb',intro:[
  {t:'이번 노래에는 “솔”도 나와요. 도·레·미·솔!|This song has Sol too. Do, Re, Mi, Sol!',v:{kbd:{from:60,to:67,labels:true,hi:{60:'#ff5a5f',62:'#ff9f1c',64:'#ffd23f',67:'#1fb5c9'}}},p:{song:'mary'}}],
  a:{type:'song',song:'mary',speed:.9}},
 {id:'b7',u:'B',t:'올라가요, 내려가요|Up or down?',intro:[
  {t:'소리 세 개가 계단처럼 올라가기도 하고 내려가기도 해요.|Three sounds can climb up like stairs, or go down.',v:{emoji:'📈 📉'},p:{seq:{notes:'C4/1 E4/1 G4/1 r/1 G4/1 E4/1 C4/1',bpm:100}}}],
  a:{type:'pitch',task:'contour',count:6}},
 // S ---- singing and voice
 {id:'s1',u:'S',t:'바른 자세와 숨쉬기|Posture and breathing',intro:[
  {t:'노래할 때는 등을 쭉 펴고, 어깨는 편하게, 발은 바닥에 꾹 붙여요.|To sing, stand or sit tall, relax your shoulders and keep your feet flat on the floor.',v:{emoji:'🧍✨'}},
  {t:'숨을 들이마시면 배가 풍선처럼 불룩, 내쉬면 쏙! 이게 노래하는 숨, 복식 호흡이에요.|Breathe in and your tummy puffs up like a balloon; breathe out and it goes back in. That’s a singing breath!',v:{emoji:'🎈'}},
  {t:'공이 커질 때 들이마시고, 작아질 때 “스~” 하고 길게 내쉬어요.|Breathe in as the ball grows, then let out a long “sss” as it shrinks.',v:{emoji:'🔵'}}],
  a:{type:'breath',cycles:3}},
 {id:'s2',u:'S',t:'목 풀기|Voice warm-ups',intro:[
  {t:'입술을 “부르르” 떨거나 “음~” 하고 허밍하면 목이 부드럽게 풀려요.|Lip trills (“brrr”) and humming (“mmm”) gently warm up your voice.',v:{emoji:'😗〰️'},p:{seq:{notes:'C4/1 E4/1 G4/1 E4/1 C4/2',bpm:96,v:'flute'}}},
  {t:'“아”는 입을 크게, “이”는 옆으로 쭉, “우”는 동그랗게 모아요.|For “ah” open wide, for “ee” smile wide, for “oo” make a small circle.',v:{emoji:'😮 😁 😗'}},
  {t:'이번엔 “우~” 하고 사이렌처럼 낮은 소리에서 높은 소리로 미끄러져요!|Now slide from low to high like a siren: “ooo~”!',v:{emoji:'🚨'}}],
  a:{type:'sing',task:'siren'}},
 {id:'s3',u:'S',t:'같은 소리 내기|Match the note',intro:[
  {t:'선생님 소리를 잘 듣고 똑같은 높이로 “아~” 하고 불러요.|Listen to my note, then sing “ahh” at the same height.',p:{seq:{notes:'E4/2',bpm:60,v:'flute'}}},
  {t:'내 목소리는 공으로 보여요. 공을 동그라미 과녁에 넣고 잠깐 버티면 성공! 화살표가 ⬆이면 조금 높게, ⬇이면 조금 낮게 불러요. 어려우면 다시 듣기를 눌러요.|Your voice shows up as a ball. Get it into the circle and hold it there! If the arrow points ⬆ sing a little higher; ⬇ means a little lower. Tap Hear it again any time.',v:{emoji:'🎯'}}],
  a:{type:'sing',task:'match',count:5}},
 {id:'s4',u:'S',t:'도레미파솔 노래하기|Sing Do-Re-Mi-Fa-Sol',intro:[
  {t:'계단을 오르듯 한 음씩 올라가요. 도·레·미·파·솔!|Climb up one step at a time: Do, Re, Mi, Fa, Sol!',v:{kbd:{from:60,to:67,labels:true}},p:{seq:{notes:'C4/1 D4/1 E4/1 F4/1 G4/2',bpm:80,v:'flute'}}}],
  a:{type:'sing',task:'scale'}},
 {id:'s5',u:'S',t:'계이름으로 노래하기|Sing with Do-Re-Mi',intro:[
  {t:'“반짝반짝 작은 별” 가락을 계이름으로 불러요. 도도솔솔 라라솔~|Sing “Twinkle Twinkle” with Do-Re-Mi: Do Do Sol Sol La La Sol~',v:{staff:{notes:'C4/1 C4/1 G4/1 G4/1 A4/1 A4/1 G4/2',labels:true}},p:{song:'twinkle'}},
  {t:'한 음씩 차례로 불러요. 맞게 부르면 다음 음으로 넘어가요. 천천히 해도 괜찮아요! 다 부르면 내가 부른 노래를 들려줘요.|Sing one note at a time. When you match it, the next one comes. Take your time! At the end you’ll hear the song you sang.'}],
  a:{type:'sing',task:'song',song:'twinkle',len:14,bpm:80}},
 {id:'s6',u:'S',t:'목소리 건강|A healthy voice',intro:[
  {t:'목소리도 소중한 악기예요. 소리를 지르면 목이 다칠 수 있어요. 물을 자주 마셔요!|Your voice is a precious instrument. Shouting can hurt it. Drink water often!',v:{emoji:'💧🗣️'}}],
  a:{type:'quiz',bank:'voice',count:5}},
 // C ---- notes and rests
 {id:'c1',u:'C',t:'음표의 길이|How long is a note?',intro:[
  {t:'음표는 모양에 따라 길이가 달라요. 4분음표는 1박이에요.|A note’s shape tells how long it lasts. A quarter note lasts 1 beat.',v:{sym:[['q','1박|1 beat']]},p:{rhy:{p:'q q q q',bpm:80}}},
  {t:'속이 빈 2분음표는 2박, 막대가 없는 온음표는 4박이에요!|A hollow half note lasts 2 beats, and a whole note with no stem lasts 4!',v:{sym:[['h','2박|2 beats'],['w','4박|4 beats']]},p:{rhy:{p:'h h w',bpm:80}}}],
  a:{type:'quiz',bank:'values',set:['q','h','w'],count:6}},
 {id:'c2',u:'C',t:'리듬 읽기|Reading rhythms',intro:[
  {t:'악보의 리듬을 보고 북을 쳐요. 통통 튀는 공이 음표에 내려앉을 때 쳐요!|Read the rhythm and tap the drum. Tap when the bouncing ball lands on a note!',v:{rhy:'q q h'},p:{rhy:{p:'q q h',bpm:76}}},
  {t:'2분음표는 한 번 치고 2박을 기다려요. “따-안”!|For a half note, tap once and wait 2 beats: “taa-aa”!'}],
  a:{type:'read',level:1,count:4,bpm:72}},
 {id:'c3',u:'C',t:'쉼표는 쉬는 박|Rests are quiet beats',intro:[
  {t:'쉼표는 소리를 내지 않고 쉬는 박이에요. 4분쉼표는 1박 쉬어요.|A rest is a quiet beat. A quarter rest is 1 beat of silence.',v:{sym:[['qr','1박 쉼|1 beat rest'],['hr','2박 쉼|2 beats rest']]}},
  {t:'쉼표에서는 북을 치지 말고 마음속으로 “쉼” 하고 세요.|On a rest, don’t tap. Just think “rest”.',v:{rhy:'q qr q qr'},p:{rhy:{p:'q qr q qr',bpm:76}}}],
  a:{type:'read',level:2,count:4,bpm:72}},
 {id:'c4',u:'C',t:'리듬 따라 하기|Copy the rhythm',intro:[
  {t:'콩콩 선생님이 먼저 한 마디를 쳐요(파란 불 👂). 불빛이 분홍색이 되면 내 차례(👆)! 잘 듣고 똑같이 따라 쳐요.|Ms. Hop plays one bar first (blue lights 👂). When the lights turn pink, it’s your turn (👆)! Listen, then copy it.',v:{emoji:'👂➡️🥁'},p:{rhy:{p:'q q h',bpm:80}}}],
  a:{type:'echo',level:1,count:5,bpm:80}},
 {id:'c5',u:'C',t:'8분음표 둘은 한 박|Two eighths make a beat',intro:[
  {t:'8분음표는 반 박이에요. 둘이 손을 잡으면 1박이 돼요. “따-따”!|An eighth note is half a beat. Two of them holding hands make 1 beat: “ti-ti”!',v:{sym:[['e','반 박|½ beat'],['ee','1박|1 beat']]},p:{rhy:{p:'e e e e q q',bpm:76}}}],
  a:{type:'read',level:3,count:4,bpm:70}},
 {id:'c6',u:'C',t:'리듬 따라 하기 2|Copy the rhythm 2',intro:[
  {t:'이번엔 빠른 8분음표도 나와요. 귀를 쫑긋!|Now there are quick eighth notes too. Listen closely!',p:{rhy:{p:'q e e q q',bpm:80}}}],
  a:{type:'echo',level:3,count:5,bpm:80}},
 // D ---- drums
 {id:'d1',u:'D',t:'드럼 세트 친구들|Meet the drum kit',intro:[
  {t:'발로 밟는 큰 북은 베이스 드럼이에요. “쿵!”|The big drum you play with your foot is the bass drum. “Boom!”',v:{emoji:'💥'},p:{drums:['kick','kick']}},
  {t:'스틱으로 치는 스네어 드럼은 “짝!”, 심벌즈 두 개가 붙은 하이햇은 “칫!”|The snare drum goes “crack!” and the hi-hat, two cymbals stacked together, goes “tss!”',v:{emoji:'🥁 ✨'},p:{drums:['snare','hat','hat']}}],
  a:{type:'quiz',bank:'drumkit',count:6}},
 {id:'d2',u:'D',t:'쿵-짝 쿵-짝|Boom-clap',intro:[
  {t:'1박과 3박에는 쿵, 2박과 4박에는 짝! 많은 노래가 이 박자로 움직여요.|Boom on beats 1 and 3, clap on beats 2 and 4! Tons of songs move like this.',p:{drum:{pattern:'boomclap',bars:2,bpm:84}}},
  {t:'처음 한 마디는 쿵쾅 선생님이 보여 줄게. 그다음 따라와!|I’ll play the first bar. Then you join in!'}],
  a:{type:'drum',pattern:'boomclap',bars:6,bpm:80,lanes:['kick','snare']}},
 {id:'d3',u:'D',t:'하이햇 8비트|Eight-beat rock',intro:[
  {t:'하이햇이 “칫칫칫칫” 8번, 그 위에 쿵-짝! 이게 록 드럼이야!|The hi-hat goes “tss” eight times, with boom-clap on top. That’s a rock beat!',p:{drum:{pattern:'rock',bars:2,bpm:80}}}],
  a:{type:'drum',pattern:'rock',bars:6,bpm:72}},
 {id:'d4',u:'D',t:'필인으로 마무리|Finish with a fill',intro:[
  {t:'네 마디마다 스네어를 다다다닥! 다음 부분으로 넘어가는 신호, “필인”이야.|Every fourth bar, rattle the snare! That’s a “fill”, a signal that a new part is coming.',p:{drum:{pattern:'rockfill',bars:4,bpm:80}}}],
  a:{type:'drum',pattern:'rockfill',bars:8,bpm:76}},
 {id:'d5',u:'D',t:'디스코 비트|Disco beat',intro:[
  {t:'쿵이 매 박마다! 하이햇은 박 사이에서 “칫”. 춤추고 싶어지지?|Boom on every beat, and the hi-hat goes “tss” in between. Feel like dancing?',p:{drum:{pattern:'disco',bars:2,bpm:96}}}],
  a:{type:'drum',pattern:'disco',bars:8,bpm:88}},
 // E ---- staff
 {id:'e1',u:'E',t:'오선과 높은음자리표|The staff and the treble clef',intro:[
  {t:'음악을 적는 다섯 줄을 “오선”이라고 해요. 줄은 아래부터 첫째 줄, 둘째 줄… 하고 세요.|Music is written on five lines called the “staff”. Count the lines from the bottom up.',v:{staff:{notes:[]}}},
  {t:'맨 앞의 높은음자리표는 둘째 줄이 “솔”이라고 알려 줘요. 음표가 위로 갈수록 높은 소리예요.|The treble clef at the front marks the second line as Sol (G). The higher a note sits, the higher it sounds.',v:{staff:{notes:[{m:60},{m:64},{m:67},{m:72}],labels:true}},p:{seq:{notes:'C4/1 E4/1 G4/1 C5/1',bpm:80}}}],
  a:{type:'quiz',bank:'staffbasics',count:6}},
 {id:'e2',u:'E',t:'도·레·미 찾기|Find Do, Re, Mi',intro:[
  {t:'“가온 도”는 오선 아래 짧은 덧줄 위에 있어요. 레는 그 바로 위, 미는 첫째 줄!|Middle C (Do) sits on a little ledger line below the staff. Re (D) is just above it, and Mi (E) is on the first line!',v:{staff:{notes:[{m:60},{m:62},{m:64}],labels:true}},p:{seq:{notes:'C4/1 D4/1 E4/1',bpm:80}}}],
  a:{type:'notes',range:[60,64],count:8}},
 {id:'e3',u:'E',t:'도부터 솔까지|Do up to Sol',intro:[
  {t:'줄–칸–줄–칸, 한 칸씩 올라갈 때마다 한 음씩 높아져요.|Line, space, line, space: each step up is the next note up.',v:{staff:{notes:[{m:60},{m:62},{m:64},{m:65},{m:67}],labels:true}},p:{seq:{notes:'C4/.5 D4/.5 E4/.5 F4/.5 G4/1',bpm:80}}}],
  a:{type:'notes',range:[60,67],count:10}},
 {id:'e4',u:'E',t:'반짝반짝 작은 별|Twinkle Twinkle Little Star',intro:[
  {t:'위쪽 오선에 악보가 지나가요. 악보를 보면서 쳐 봐요!|Music scrolls across the staff at the top. Read it as you play!',v:{staff:{notes:'C4/1 C4/1 G4/1 G4/1 A4/1 A4/1 G4/2',labels:true}},p:{song:'twinkle'}}],
  a:{type:'song',song:'twinkle',mode:'both',speed:.85}},
 {id:'e5',u:'E',t:'높은 도까지|All the way to high Do',intro:[
  {t:'라·시·높은 도까지 읽어 봐요. 높은 도는 셋째 칸이에요.|Now read La, Ti and high Do. High Do sits in the third space.',v:{staff:{notes:[{m:69},{m:71},{m:72}],labels:true}},p:{seq:{notes:'A4/1 B4/1 C5/2',bpm:80}}}],
  a:{type:'notes',range:[60,72],count:12}},
 {id:'e6',u:'E',t:'환희의 송가|Ode to Joy',intro:[
  {t:'베토벤 아저씨가 만든 유명한 곡이에요. 미-미-파-솔!|A famous tune by Beethoven. Mi-Mi-Fa-Sol!',v:{staff:{notes:'E4/1 E4/1 F4/1 G4/1 G4/1 F4/1 E4/1 D4/1',labels:true}},p:{song:'ode'}}],
  a:{type:'song',song:'ode',mode:'both',speed:.9}},
 {id:'e7',u:'E',t:'작은 한스|Lightly Row',intro:[
  {t:'솔-미-미, 파-레-레! 신나는 독일 동요예요.|Sol-Mi-Mi, Fa-Re-Re! A cheerful German folk song.',p:{song:'lightly'}}],
  a:{type:'song',song:'lightly',mode:'both'}},
 // F ---- bars and time signatures
 {id:'f1',u:'F',t:'마디와 박자표|Bars and time signatures',intro:[
  {t:'악보는 세로줄로 “마디”를 나눠요. 맨 앞의 박자표 4/4는 한 마디에 4분음표 4개만큼 들어간다는 뜻이에요.|Bar lines split music into “bars” (also called measures). The time signature 4/4 means four quarter notes fit in each bar.',v:{rhy:'q q q q h h',sig:true},p:{rhy:{p:'q q q q h h',bpm:80}}}],
  a:{type:'quiz',bank:'sig',count:6}},
 {id:'f2',u:'F',t:'3박자 왈츠|Waltz in 3',intro:[
  {t:'3/4박자는 “쿵-짝-짝, 쿵-짝-짝”. 빙글빙글 춤추는 왈츠예요!|3/4 time goes “boom-tick-tick”. It’s a twirling waltz!',p:{drum:{pattern:'waltz',bars:2,bpm:96}}}],
  a:{type:'drum',pattern:'waltz',bars:8,bpm:90,lanes:['kick','hat']}},
 {id:'f3',u:'F',t:'3박자 리듬 읽기|Reading in 3',intro:[
  {t:'한 마디에 3박이에요. 하나-둘-셋, 하나-둘-셋!|Three beats in each bar. One-two-three, one-two-three!',v:{rhy:'q q q h q',sig3:true},p:{rhy:{p:'q q q h q',bpm:84,sig:3}}}],
  a:{type:'read',level:'w3',count:4,bpm:80,sig:3}},
 {id:'f4',u:'F',t:'2박자 행진곡|March in 2',intro:[
  {t:'2/4박자는 “하나-둘, 하나-둘” 씩씩하게 걷는 행진곡에 잘 어울려요.|2/4 time is “left-right, left-right”, perfect for a march.',p:{drum:{pattern:'march',bars:4,bpm:104}}}],
  a:{type:'drum',pattern:'march',bars:8,bpm:96,lanes:['kick','snare']}},
 {id:'f5',u:'F',t:'자크 형제|Frère Jacques',intro:[
  {t:'노래 끝에 낮은 “솔”이 나와요. 도 왼쪽의 솔을 찾아봐요!|There’s a low Sol near the end. Find the Sol to the left of Do!',v:{kbd:{from:55,to:69,labels:true,hi:{55:'#1fb5c9'}}},p:{song:'jacques'}}],
  a:{type:'song',song:'jacques',mode:'both'}},
 // G ---- scales and chords (with whole and half steps, major and minor)
 {id:'g1',u:'G',t:'반음과 온음|Half steps and whole steps',intro:[
  {t:'바로 옆 건반으로 가는 거리를 “반음”이라고 해요. 검은 건반도 한 칸으로 세요.|Moving to the very next key, black or white, is a “half step”.',v:{kbd:{from:60,to:67,labels:true,hi:{60:'#ff5a5f',61:'#ff5fa2'}}},p:{seq:{notes:'C4/1 C#4/1',bpm:70}}},
  {t:'반음 두 개를 합치면 “온음”이에요. 도에서 레는 온음!|Two half steps make a “whole step”. Do to Re is a whole step!',v:{kbd:{from:60,to:67,labels:true,hi:{60:'#ff5a5f',62:'#2a8df4'}}},p:{seq:{notes:'C4/1 D4/1',bpm:70}}},
  {t:'미-파와 시-도 사이에는 검은 건반이 없어요. 그래서 흰 건반끼리인데도 반음이에요!|There’s no black key between Mi–Fa or Ti–Do, so those white keys are only a half step apart!',v:{kbd:{from:60,to:72,labels:true,hi:{64:'#ffd23f',65:'#ffd23f',71:'#a25cff',72:'#a25cff'}}}}],
  a:{type:'steps',task:'name',count:8}},
 {id:'g2',u:'G',t:'반음·온음 건반 찾기|Find the step',intro:[
  {t:'이번엔 직접 찾아요. “미에서 반음 위”는? 바로 옆 파!|Now you find it. A half step up from Mi? The very next key, Fa!',v:{kbd:{from:60,to:72,labels:true,hi:{64:'#ffd23f',65:'#3ec46d'}}}}],
  a:{type:'steps',task:'find',count:8}},
 {id:'g3',u:'G',t:'장음계 만들기|Build a major scale',intro:[
  {t:'도레미파솔라시도는 “온-온-반-온-온-온-반” 순서로 올라가요. 이것을 장음계라고 해요.|Do-Re-Mi-Fa-Sol-La-Ti-Do climbs whole, whole, half, whole, whole, whole, half. That’s a major scale.',v:{kbd:{from:60,to:72,labels:true}},p:{seq:{notes:'C4/.5 D4/.5 E4/.5 F4/.5 G4/.5 A4/.5 B4/.5 C5/1',bpm:90}}},
  {t:'도(C, 음이름 “다”)에서 시작하는 장음계라서 “다장조”라고 불러요. 건반을 차례로 눌러 만들어 봐요!|It starts on C, so it’s called C major. Build it key by key!'}],
  a:{type:'scale',task:'build',key:'C'}},
 {id:'g4',u:'G',t:'장조와 단조|Major and minor',intro:[
  {t:'장조는 보통 밝고 신나는 느낌, 단조는 슬프거나 신비로운 느낌이 많이 나요.|Major usually sounds bright and happy; minor often sounds sad or mysterious.',v:{emoji:'😊  😢'}},
  {t:'같은 노래를 장조와 단조로 들어 봐요. 느낌이 어떻게 다른가요?|Listen to the same tune in major, then minor. How do they feel?',p:{majmin:0}},
  {t:'라에서 시작하는 “라시도레미파솔라”는 단음계예요. 반음 자리가 달라서 느낌이 바뀌어요!|“La-Ti-Do-Re-Mi-Fa-Sol-La” starting on La is a minor scale. The half steps move, and the mood changes!',v:{kbd:{from:57,to:69,labels:true,hi:{57:'#a25cff',69:'#a25cff'}}},p:{seq:{notes:'A3/.5 B3/.5 C4/.5 D4/.5 E4/.5 F4/.5 G4/.5 A4/1',bpm:90}}}],
  a:{type:'scale',task:'majmin',count:6}},
 {id:'g5',u:'G',t:'화음이란?|What is a chord?',intro:[
  {t:'여러 음을 한꺼번에 누르면 어울리는 소리, “화음”이 돼요.|Press several notes together and they blend into a “chord”.',v:{kbd:{from:60,to:72,labels:true,hi:{60:'#2a8df4',64:'#2a8df4',67:'#2a8df4'}}},p:{chord:[60,64,67]}},
  {t:'도·미·솔! 하나 건너 하나씩 누르면 돼요.|Do, Mi, Sol! Skip one key between each.'}],
  a:{type:'chord',task:'build',chords:['C'],count:3}},
 {id:'g6',u:'G',t:'으뜸·버금딸림·딸림화음|Three main chords',intro:[
  {t:'다장조에서 도미솔은 “으뜸화음”, 파라도는 “버금딸림화음”, 솔시레는 “딸림화음”이에요.|In C major, C–E–G is the home chord (I), F–A–C is chord IV and G–B–D is chord V.',v:{kbd:{from:60,to:76,labels:true,hi:{65:'#3ec46d',69:'#3ec46d',72:'#3ec46d'}}},p:{chords:['C','F','G','C']}},
  {t:'이 세 화음만 있으면 많은 노래에 반주를 붙일 수 있어요!|With just these three chords you can play along with lots of songs!'}],
  a:{type:'chord',task:'build',chords:['C','F','G'],count:5}},
 {id:'g7',u:'G',t:'밝은 화음, 슬픈 화음|Happy chord, sad chord',intro:[
  {t:'도·미·솔은 밝은 장화음, 도·미♭·솔은 슬픈 단화음이에요. 가운데 음 하나만 반음 내려가도 느낌이 확 달라져요!|C–E–G is a bright major chord; C–E♭–G is a sad minor chord. Lowering just the middle note a half step changes the whole mood!',v:{emoji:'😊  😢'},p:{chordpair:[[60,64,67],[60,63,67]]}}],
  a:{type:'chord',task:'majmin',count:6}},
 {id:'g8',u:'G',t:'반주 쳐 보기|Play the chords',intro:[
  {t:'선생님이 멜로디를 칠게요. 여러분은 화음 버튼으로 반주를 쳐요!|I’ll play the melody. You play the chords with the chord buttons!',v:{emoji:'🎹🐻'},p:{song:'twinkle'}}],
  a:{type:'chordplay',song:'twinkle'}},
 // H ---- instruments
 {id:'h1',u:'H',t:'악기 가족|Instrument families',intro:[
  {t:'악기는 소리 내는 방법에 따라 가족이 있어요. 줄을 쓰면 현악기, 숨을 불면 관악기, 두드리면 타악기, 건반을 누르면 건반악기!|Instruments come in families by how they make sound: strings, wind instruments, percussion and keyboards!',v:{instr:['violin','trumpet','drum','piano']}},
  {t:'관악기는 다시 나무로 시작한 목관악기와 입술을 떨며 부는 금관악기로 나눠요.|Wind instruments split into woodwinds, first made of wood, and brass, played by buzzing your lips.',v:{instr:['flute','clarinet','trumpet','tuba']}}],
  a:{type:'quiz',bank:'family',count:6}},
 {id:'h2',u:'H',t:'소리 듣고 맞히기|Guess by ear',intro:[
  {t:'눈을 감고 들어 봐요. 줄을 뜯는 소리, 부는 소리, 두드리는 소리가 다 달라요.|Close your eyes and listen. Plucked, blown and struck sounds are all different.',p:{voices:['pluck','flute','mallet']}}],
  a:{type:'listen',task:'family',count:6}},
 {id:'h3',u:'H',t:'우리 악기|Korean instruments',intro:[
  {t:'우리나라에도 멋진 악기가 많아요. 가야금, 해금, 대금, 장구를 만나 봐요! 대금 말고는 비슷한 악기 소리로 들려줘요.|Korea has wonderful instruments too: gayageum, haegeum, daegeum and janggu! Except the daegeum, you’ll hear a similar instrument’s sound.',v:{instr:['gayageum','haegeum','daegeum','janggu']}},
  {t:'꽹과리·징·장구·북 네 악기로 하는 신나는 공연을 “사물놀이”라고 해요.|A lively show with four instruments, kkwaenggwari, jing, janggu and buk, is called “samulnori”.',v:{instr:['kkwaenggwari','jing','janggu','buk']}}],
  a:{type:'quiz',bank:'korean',count:6}},
 {id:'h4',u:'H',t:'오케스트라|The orchestra',intro:[
  {t:'여러 악기 가족이 모여 함께 연주하는 큰 악단이 오케스트라예요. 지휘자가 빠르기와 셈여림을 알려 줘요.|An orchestra is a big group of instrument families playing together. The conductor shows how fast and how loud.',v:{emoji:'🎻🎺🥁🎼'}}],
  a:{type:'quiz',bank:'orch',count:5}},
 // I ---- dynamics, tempo, symbols
 {id:'i1',u:'I',t:'셈여림|Loud and soft',intro:[
  {t:'p(피아노)는 여리게, f(포르테)는 세게! 소리의 크기도 악보에 적어요.|p (piano) means soft and f (forte) means loud. Music tells you how loud to play!',v:{sym:[['p','여리게|soft'],['f','세게|loud']]},p:{dyn:true}},
  {t:'“<” 모양은 점점 세게(크레셴도), “>” 모양은 점점 여리게(데크레셴도)예요.|“<” means get louder (crescendo) and “>” means get softer (decrescendo).',v:{sym:[['cresc','점점 세게|louder'],['decresc','점점 여리게|softer']]}}],
  a:{type:'quiz',bank:'dyn',count:6}},
 {id:'i2',u:'I',t:'빠르기말|Tempo words',intro:[
  {t:'알레그로는 빠르게, 모데라토는 보통 빠르게, 안단테는 느리게, 아다지오는 아주 느리게!|Allegro is fast, Moderato is medium, Andante is a walking pace and Adagio is slow!',v:{emoji:'🐇 🚶 🐢'},p:{tempo:true}}],
  a:{type:'quiz',bank:'tempo',count:6}},
 {id:'i3',u:'I',t:'악보 기호|Music symbols',intro:[
  {t:'도돌이표를 만나면 앞으로 돌아가서 한 번 더! 끝세로줄은 곡이 끝났다는 뜻이에요.|A repeat sign says “go back and play again!” A final bar line means the end.',v:{sym:[['repeat','도돌이표|repeat'],['final','끝세로줄|the end']]}},
  {t:'♯(올림표)는 반음 올리고, ♭(내림표)는 반음 내려요.|A sharp (♯) raises a note a half step and a flat (♭) lowers it.',v:{sym:[['sharp','반음 올림|half step up'],['flat','반음 내림|half step down']]}}],
  a:{type:'quiz',bank:'symbols',count:6}},
 {id:'i4',u:'I',t:'런던 다리|London Bridge',intro:[
  {t:'점4분음표가 나와요. “따-안 따”처럼 길게-짧게!|Watch for the dotted quarter: long, then short!',p:{song:'london'}}],
  a:{type:'song',song:'london',mode:'both'}},
 {id:'i5',u:'I',t:'징글벨|Jingle Bells',intro:[
  {t:'미미미-, 미미미-! 썰매처럼 신나게 달려요!|Mi-Mi-Mi, Mi-Mi-Mi! Dash along like a sleigh!',p:{song:'jingle'}}],
  a:{type:'song',song:'jingle',mode:'both',speed:.9}},
 // J ---- level up
 {id:'j1',u:'J',t:'점음표 리듬|Dotted rhythms',intro:[
  {t:'점이 붙으면 원래 길이의 반만큼 길어져요. 점4분음표는 1박 반!|A dot adds half the note’s length. A dotted quarter lasts one and a half beats!',v:{sym:[['dq','1박 반|1½ beats'],['dh','3박|3 beats']]},p:{rhy:{p:'dq e q q',bpm:76}}}],
  a:{type:'read',level:4,count:4,bpm:70}},
 {id:'j2',u:'J',t:'싱코페이션 드럼|Syncopated drums',intro:[
  {t:'쿵이 박과 박 사이에 숨어 있어! 엇박이 들어가면 리듬이 통통 튀어.|The boom hides between the beats! Off-beats make the rhythm bounce.',p:{drum:{pattern:'funk',bars:2,bpm:80}}}],
  a:{type:'drum',pattern:'funk',bars:8,bpm:72}},
 {id:'j3',u:'J',t:'검은 건반의 이름|Black key names',intro:[
  {t:'도 바로 오른쪽 검은 건반은 도보다 반음 높은 “도♯(올림 도)”예요. 레보다 반음 낮으니 “레♭”이라고도 해요.|The black key just right of Do is Do♯, a half step higher. It’s also Re♭, a half step below Re.',v:{kbd:{from:60,to:72,labels:true,showBlack:true}},p:{seq:{notes:'C4/1 C#4/1 D4/1',bpm:80}}}],
  a:{type:'keys',task:'black',count:6}},
 {id:'j4',u:'J',t:'엘리제를 위하여|Für Elise',intro:[
  {t:'베토벤의 유명한 피아노곡이에요. 미-레♯-미-레♯! 검은 건반이 나와요.|A famous piano piece by Beethoven. Mi-Re♯-Mi-Re♯! It uses black keys.',p:{song:'furelise'}}],
  a:{type:'song',song:'furelise',mode:'both',speed:.85}},
 {id:'j5',u:'J',t:'16분음표 리듬|Sixteenth notes',intro:[
  {t:'16분음표는 8분음표의 절반! 네 개가 모여야 1박이에요. “따다다다”!|A sixteenth note is half of an eighth. Four make one beat: “ti-ka-ti-ka”!',v:{sym:[['s','4분의 1박|¼ beat']]},p:{rhy:{p:'s s s s q q q',bpm:70}}}],
  a:{type:'echo',level:5,count:4,bpm:70}},
];

const RESTV=[['wr','온쉼표|whole rest','4박|4 beats'],['hr','2분쉼표|half rest','2박|2 beats'],['qr','4분쉼표|quarter rest','1박|1 beat'],['er','8분쉼표|eighth rest','반 박|½ beat']];

// join two 'ko|en' texts into one; Korean 은/는 after a word
const pj=(a,b,sep=': ')=>{const [a1,a2]=a.split('|'),[b1,b2]=b.split('|');return `${a1}${sep}${b1}|${a2||a1}${sep}${b2||b1}`};
const josaKo=(w,x,y)=>{const c=w.charCodeAt(w.length-1);return c>=0xac00&&c<=0xd7a3&&(c-0xac00)%28?x:y};
