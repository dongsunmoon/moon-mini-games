<style>
:root{
 color-scheme:light;
 --ink:#1f2550;--muted:#626a9a;--line:#e3e6f7;--card:#ffffff;--bg1:#2b2f7a;--bg2:#6a4fd6;
 --brand:#6b5cff;--brand-d:#4a3cd6;--gold:#ffc83d;--gold-d:#e09a00;--green:#33c46b;--green-d:#1f9a4f;--red:#ff5a6a;--red-d:#d8344a;
 --sky:#eaf2ff;--shadow:0 12px 30px rgba(32,30,110,.18);
 --light:#eeeed2;--dark:#769656;--last:rgba(255,214,64,.55);--sel:rgba(255,214,64,.75);--dot:rgba(20,30,60,.28);--frame:#4a3a2a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{min-height:100dvh;color:var(--ink);font:16px/1.45 system-ui,-apple-system,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
 background:radial-gradient(1200px 600px at 80% -10%,#8f7bff55,transparent 60%),radial-gradient(900px 500px at -10% 110%,#3fd3ff33,transparent 60%),linear-gradient(170deg,#262a6e,#4b3bb8 55%,#7a4fd0);
 background-attachment:fixed;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
 background-image:radial-gradient(2px 2px at 20% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 40% 80%,#fff,transparent),radial-gradient(2px 2px at 85% 65%,#fff,transparent),radial-gradient(1px 1px at 10% 70%,#fff,transparent),radial-gradient(1px 1px at 55% 50%,#fff,transparent)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hidden{display:none!important}
.ei{width:1.2em;height:1.2em;object-fit:contain;vertical-align:-.25em}
img{-webkit-user-drag:none}

/* ---------------------------------------------------------------- top bar */
.hud{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));
 background:linear-gradient(180deg,rgba(26,22,84,.92),rgba(26,22,84,.78));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 6px 20px rgba(10,8,50,.35);color:#fff}
.hud .back{flex:0 0 auto;width:42px;height:42px;border-radius:14px;border:0;background:rgba(255,255,255,.14);font-size:20px;display:grid;place-items:center}

.lvl{flex:1;min-width:0;overflow:hidden;display:flex;align-items:center;gap:8px;border:0;background:none;padding:0;text-align:left}
.lvl .badge{flex:0 0 auto;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:15px;color:#3b2a00;
 background:radial-gradient(circle at 35% 30%,#fff6c9,#ffc83d 55%,#e09a00);box-shadow:0 0 0 3px rgba(255,255,255,.25),0 4px 10px rgba(0,0,0,.3)}
.lvl .info{flex:1;min-width:0;overflow:hidden}

/* ---------------------------------------------------------------- layout */
main{width:min(1120px,100%);margin:0 auto;padding:14px max(12px,env(safe-area-inset-right)) 40px max(12px,env(safe-area-inset-left))}
.view{animation:viewIn .28s ease}

.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--brand-d),0 4px 8px rgba(60,40,200,.25)}
.btn.gold{background:linear-gradient(180deg,#ffe07a,var(--gold));color:#4a3000;box-shadow:0 5px 0 var(--gold-d),0 10px 18px rgba(224,154,0,.3)}

@keyframes float{50%{transform:translateY(-10px) rotate(-3deg)}}

/* ---------------------------------------------------------------- home */
.home{display:grid;gap:14px}
.hero{display:flex;gap:14px;align-items:center;color:#fff;padding:18px;border-radius:26px;position:relative;overflow:hidden;
 background:linear-gradient(135deg,#ff8a5c,#ff5fa2 45%,#8f5cff);box-shadow:0 14px 34px rgba(30,10,90,.35)}

.hero .stats{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.hero .stats span{background:rgba(255,255,255,.22);border-radius:99px;padding:4px 10px;font-size:13px;font-weight:800}
.cta{width:100%;min-height:76px;font-size:21px;border-radius:22px;flex-direction:column;gap:0}

.tile .dot{position:absolute;top:8px;right:10px;min-width:22px;height:22px;border-radius:99px;background:var(--red);color:#fff;font-size:12px;font-weight:900;display:grid;place-items:center;padding:0 6px;box-shadow:0 2px 6px rgba(216,52,74,.5);animation:pulse 1.6s infinite}

.foot{text-align:center;color:#d8dbff;font-size:12px;font-weight:700;opacity:.8;margin-top:6px}

/* ---------------------------------------------------------------- adventure map */
.chapters{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory;scrollbar-width:none}
.chapters::-webkit-scrollbar{display:none}

.chap .ic{font-size:34px;height:44px;display:grid;place-items:center}
.chap .ic .ei{width:44px;height:44px;border-radius:10px;object-fit:cover}
.chap b{font-size:13.5px;font-weight:900;white-space:nowrap}
.chap small{font-size:12px;font-weight:800;opacity:.85}
.chap.on{background:#fff;color:var(--ink);box-shadow:0 6px 16px rgba(0,0,0,.25)}
.chap.locked{opacity:.55}
.banner{position:relative;overflow:hidden;border-radius:24px;padding:18px;color:#fff;display:flex;gap:14px;align-items:center;box-shadow:0 12px 28px rgba(0,0,0,.25)}
.banner .art{flex:0 0 auto;width:96px;height:96px;border-radius:20px;display:grid;place-items:center;font-size:62px;background:rgba(255,255,255,.2)}
.banner .art .ei{width:96px;height:96px;border-radius:20px;object-fit:cover}
.banner h2{margin:0;font-size:24px;font-weight:900;letter-spacing:-.4px}
.banner .skill{display:inline-block;margin:4px 0 6px;padding:3px 10px;border-radius:99px;background:rgba(0,0,0,.2);font-size:13px;font-weight:900}
.banner .prog{font-weight:800;font-size:14px}
.banner .learn{margin-top:8px}
.path{position:relative;margin:14px auto 0;max-width:560px}
.path svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.path path{fill:none;stroke:rgba(255,255,255,.55);stroke-width:10;stroke-linecap:round;stroke-dasharray:2 18}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:0}
.node .ball{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:900;color:#fff;
 background:radial-gradient(circle at 35% 30%,#a99cff,#6b5cff 60%,#4a3cd6);box-shadow:0 6px 0 #3427a8,0 10px 16px rgba(0,0,0,.3);transition:transform .1s}
.node:active .ball{transform:translateY(4px);box-shadow:0 2px 0 #3427a8}
.node.done .ball{background:radial-gradient(circle at 35% 30%,#a6f5c3,#33c46b 60%,#1f9a4f);box-shadow:0 6px 0 #167a3d,0 10px 16px rgba(0,0,0,.3)}
.node.locked .ball{background:radial-gradient(circle at 35% 30%,#d6d8e6,#a3a7bf 70%);box-shadow:0 6px 0 #7b809c;color:#eef}
.node.cur .ball{animation:nodePulse 1.4s infinite}
.node.boss .ball{width:96px;height:96px;font-size:54px;background:radial-gradient(circle at 35% 30%,#ffd1a1,#ff7a45 60%,#d4401c);box-shadow:0 7px 0 #a02c10,0 12px 20px rgba(0,0,0,.35)}
.node.boss .ball .ei{width:84px;height:84px;border-radius:50%;object-fit:cover}
.node.boss.done .ball{background:radial-gradient(circle at 35% 30%,#fff2b0,#ffc83d 60%,#e09a00);box-shadow:0 7px 0 #a86f00}

.node .stars{font-size:15px;letter-spacing:-2px;text-shadow:0 2px 3px rgba(0,0,0,.3);min-height:20px}
.node .stars .off{filter:grayscale(1) brightness(1.6);opacity:.5}
.node .tag{font-size:12px;font-weight:900;color:#fff;background:#d4401c;border-radius:99px;padding:1px 8px;margin-top:2px}
.node .me{position:absolute;left:calc(100% + 2px);top:6px;font-size:30px;animation:float 1.8s ease-in-out infinite}
.node .me .ei{width:40px;height:40px}
@keyframes nodePulse{0%,100%{box-shadow:0 6px 0 #3427a8,0 0 0 0 rgba(255,255,255,.7)}50%{box-shadow:0 6px 0 #3427a8,0 0 0 14px rgba(255,255,255,0)}}

/* ---------------------------------------------------------------- game (board) */
.game{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.boardcol{--bs:min(100%,640px,max(300px,calc(100dvh - 190px)));display:flex;flex-direction:column;gap:8px;min-width:0;align-items:center}
.bar{width:100%;max-width:var(--bs);display:flex;align-items:center;gap:10px;color:#fff;min-height:48px}
.bar .av{flex:0 0 auto;width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:30px;overflow:hidden}
.bar .av .ei{width:46px;height:46px;object-fit:cover}
.bar .who{flex:1;min-width:0}
.bar .who b{display:block;font-size:16px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .who small{font-size:13px;font-weight:800;opacity:.85}
.bar .caps{font-size:18px;letter-spacing:-5px;min-height:20px;white-space:nowrap}
.bar .caps em{font-style:normal;letter-spacing:0;font-size:13px;font-weight:900;margin-left:8px;background:rgba(255,255,255,.2);border-radius:99px;padding:1px 7px}
.bar .turn{font-size:13px;font-weight:900;border-radius:99px;padding:5px 11px;background:rgba(255,255,255,.18)}
.bar .turn.on{background:var(--gold);color:#3b2a00;animation:pulse 1.6s infinite}
.thinking i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:#fff;animation:think 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes think{50%{transform:translateY(-6px);opacity:.5}}
.rushbar{display:flex;gap:8px;align-items:center;width:100%;max-width:var(--bs)}
.rushbar .tm{flex:1;height:16px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.rushbar .tm i{display:block;height:100%;background:linear-gradient(90deg,#ffd84d,#ff8a3d);transition:width 1s linear}
.rushbar .tm.low i{background:linear-gradient(90deg,#ff7a7a,#ff3d5a)}
.rushbar b{color:#fff;font-weight:900;font-size:18px;min-width:56px;text-align:center}
.rushbar .lives{font-size:20px;letter-spacing:-2px}
.rushbar .score{background:#fff;color:var(--ink);border-radius:12px;padding:2px 10px}
.frame{position:relative;width:var(--bs);aspect-ratio:1;border-radius:14px;padding:2.2%;background:linear-gradient(145deg,#6b4b32,#3e2a1c);box-shadow:0 18px 40px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.2)}
.board{position:relative;width:100%;height:100%;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border-radius:6px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.sq{position:relative;background:var(--light)}
.sq.dk{background:var(--dark)}
.sq .co{position:absolute;font-size:clamp(8px,1.6vw,12px);font-weight:900;line-height:1;pointer-events:none;opacity:.85}
.sq .co.r{left:3px;top:3px}.sq .co.f{right:3px;bottom:2px}
.sq .co{color:var(--dark)}.sq.dk .co{color:var(--light)}
.sq.last::after,.sq.sel::after,.sq.hintF::after,.sq.hintT::after,.sq.bad::after,.sq.good::after,.sq.chk::after{content:"";position:absolute;inset:0;pointer-events:none}
.sq.last::after{background:var(--last)}
.sq.sel::after{background:var(--sel)}
.sq.chk::after{background:radial-gradient(circle,rgba(255,40,40,.95) 0,rgba(255,40,40,.6) 35%,transparent 72%)}
.sq.hintF::after{box-shadow:inset 0 0 0 5px #31e0ff;background:rgba(49,224,255,.25);animation:hintGlow 1s infinite alternate}
.sq.hintT::after{box-shadow:inset 0 0 0 5px #31e0ff;background:rgba(49,224,255,.18);animation:hintGlow 1s infinite alternate}
.sq.bad::after{background:rgba(255,50,70,.6)}
.sq.good::after{background:rgba(60,230,120,.55)}
@keyframes hintGlow{to{box-shadow:inset 0 0 0 5px #fff;background:rgba(49,224,255,.45)}}

/* board themes */

 text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 20px rgba(0,0,0,.4);transition:transform .25s cubic-bezier(.2,1.6,.4,1),opacity .2s}

<script id="engineSrc">
/*ENGINE-START*/
// Chess rules and a small alpha-beta AI. 0x88 board: sq = row*16 + col, row 0 is rank 8 (top), col 0 is the a-file.
// Piece codes: type 1-6 (P N B R Q K) plus 8 for black. No DOM access, so it can be tested headless.
const Chess=(()=>{
const P=1,N=2,B=3,R=4,Q=5,K=6,WHITE=0,BLACK=8;
const typeOf=p=>p&7,colorOf=p=>p&8;
const KNIGHT=[-33,-31,-18,-14,14,18,31,33],KING=[-17,-16,-15,-1,1,15,16,17],DIAG=[-17,-15,15,17],ORTH=[-16,-1,1,16];
const CH='.PNBRQK..pnbrqk',LETTER='.PNBRQK';
const START_FEN='rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
const sqName=s=>'abcdefgh'[s&7]+(8-(s>>4));
const sqOf=n=>(8-(+n[1]))*16+(n.charCodeAt(0)-97);
// castling rights left after a move touches a square (a8 e8 h8 / a1 e1 h1)
const CR=new Int8Array(128).fill(15);CR[0]=7;CR[4]=3;CR[7]=11;CR[112]=13;CR[116]=12;CR[119]=14;

class Position{
 constructor(fen){this.load(fen||START_FEN)}
 load(fen){
  const [pl,turn,cas='-',ep='-',hm='0',fm='1']=fen.trim().split(/\s+/);
  this.b=new Int8Array(128);this.ks=[-1,-1];let r=0,c=0;
  for(const ch of pl){
   if(ch==='/'){r++;c=0}
   else if(ch>='1'&&ch<='8')c+=+ch;
   else{const p=CH.indexOf(ch);if(p<=0)throw new Error('bad FEN '+fen);const s=r*16+c;this.b[s]=p;if(typeOf(p)===K)this.ks[colorOf(p)>>3]=s;c++}
  }
  this.turn=turn==='b'?BLACK:WHITE;
  this.castle=(cas.includes('K')?1:0)|(cas.includes('Q')?2:0)|(cas.includes('k')?4:0)|(cas.includes('q')?8:0);
  this.ep=ep!=='-'?sqOf(ep):-1;this.half=+hm||0;this.full=+fm||1;this.hist=[];
  return this;
 }
 fen(){
  let s='';
  for(let r=0;r<8;r++){let e=0;for(let c=0;c<8;c++){const p=this.b[r*16+c];if(!p)e++;else{if(e){s+=e;e=0}s+=CH[p]}}if(e)s+=e;if(r<7)s+='/'}
  const cas=(this.castle&1?'K':'')+(this.castle&2?'Q':'')+(this.castle&4?'k':'')+(this.castle&8?'q':'')||'-';
  return `${s} ${this.turn?'b':'w'} ${cas} ${this.ep<0?'-':sqName(this.ep)} ${this.half} ${this.full}`;
 }
 // board + side + castling + en passant: equal keys mean the same position for repetition
 key(){return this.fen().split(' ').slice(0,4).join(' ')}
 attacked(sq,by){
  const b=this.b;
  if(by===WHITE){if(!((sq+15)&0x88)&&b[sq+15]===P)return true;if(!((sq+17)&0x88)&&b[sq+17]===P)return true}
  else{if(!((sq-15)&0x88)&&b[sq-15]===(P|BLACK))return true;if(!((sq-17)&0x88)&&b[sq-17]===(P|BLACK))return true}
  for(const d of KNIGHT){const s=sq+d;if(!(s&0x88)&&b[s]===(N|by))return true}
  for(const d of KING){const s=sq+d;if(!(s&0x88)&&b[s]===(K|by))return true}
  for(const d of DIAG){let s=sq+d;while(!(s&0x88)){const p=b[s];if(p){if(p===(B|by)||p===(Q|by))return true;break}s+=d}}
  for(const d of ORTH){let s=sq+d;while(!(s&0x88)){const p=b[s];if(p){if(p===(R|by)||p===(Q|by))return true;break}s+=d}}
  return false;
 }
 inCheck(side=this.turn){return this.attacked(this.ks[side>>3],side^8)}
 pseudo(capsOnly){
  const b=this.b,us=this.turn,them=us^8,mv=[];
  const add=(f,t,fl=0,c=b[t])=>{
   const p=b[f];
   if(typeOf(p)===P&&((t>>4)===0||(t>>4)===7)){for(const pt of [Q,R,B,N])mv.push({f,t,p,c,pr:pt|us,fl})}
   else mv.push({f,t,p,c,pr:0,fl});
  };
  for(let sq=0;sq<120;sq++){
   if(sq&0x88){sq+=7;continue}
   const p=b[sq];if(!p||colorOf(p)!==us)continue;const t=typeOf(p);
   if(t===P){
    const dir=us===WHITE?-16:16,row=sq>>4,one=sq+dir;
    if(!(one&0x88)&&!b[one]){
     const promo=(one>>4)===0||(one>>4)===7;
     if(!capsOnly||promo)add(sq,one);
     if(!capsOnly&&row===(us===WHITE?6:1)&&!b[one+dir])add(sq,one+dir,1);
    }
    for(const to of [one-1,one+1]){
     if(to&0x88)continue;
     if(b[to]&&colorOf(b[to])===them)add(sq,to);
     else if(to===this.ep)add(sq,to,2,P|them);
    }
   }else if(t===N||t===K){
    for(const d of t===N?KNIGHT:KING){const to=sq+d;if(to&0x88)continue;const q=b[to];if(!q){if(!capsOnly)add(sq,to)}else if(colorOf(q)===them)add(sq,to)}
    if(t===K&&!capsOnly)this.castles(sq,add);
   }else{
    for(const d of t===B?DIAG:t===R?ORTH:KING){
     let to=sq+d;
     while(!(to&0x88)){const q=b[to];if(!q){if(!capsOnly)add(sq,to)}else{if(colorOf(q)===them)add(sq,to);break}to+=d}
    }
   }
  }
  return mv;
 }
 castles(sq,add){
  const b=this.b,us=this.turn,them=us^8,home=us===WHITE?116:4;
  if(sq!==home||this.attacked(home,them))return;
  const ks=us===WHITE?1:4,qs=us===WHITE?2:8;
  if(this.castle&ks&&!b[home+1]&&!b[home+2]&&b[home+3]===(R|us)&&!this.attacked(home+1,them)&&!this.attacked(home+2,them))add(home,home+2,4);
  if(this.castle&qs&&!b[home-1]&&!b[home-2]&&!b[home-3]&&b[home-4]===(R|us)&&!this.attacked(home-1,them)&&!this.attacked(home-2,them))add(home,home-2,4);
 }
 make(m){
  const b=this.b,us=this.turn;
  this.hist.push([m,this.castle,this.ep,this.half,this.ks[0],this.ks[1]]);
  b[m.t]=m.pr||m.p;b[m.f]=0;
  if(m.fl&2)b[us===WHITE?m.t+16:m.t-16]=0;
  if(m.fl&4){const rf=m.t>m.f?m.t+1:m.t-2,rt=m.t>m.f?m.t-1:m.t+1;b[rt]=b[rf];b[rf]=0}
  if(typeOf(m.p)===K)this.ks[us>>3]=m.t;
  this.castle&=CR[m.f]&CR[m.t];
  this.ep=m.fl&1?(m.f+m.t)>>1:-1;
  this.half=typeOf(m.p)===P||m.c?0:this.half+1;
  if(us===BLACK)this.full++;
  this.turn=us^8;
 }
 undo(){
  const [m,castle,ep,half,k0,k1]=this.hist.pop(),b=this.b;
  this.turn^=8;const us=this.turn;
  b[m.f]=m.p;
  if(m.fl&2){b[m.t]=0;b[us===WHITE?m.t+16:m.t-16]=m.c}else b[m.t]=m.c;
  if(m.fl&4){const rf=m.t>m.f?m.t+1:m.t-2,rt=m.t>m.f?m.t-1:m.t+1;b[rf]=b[rt];b[rt]=0}
  this.castle=castle;this.ep=ep;this.half=half;this.ks[0]=k0;this.ks[1]=k1;
  if(us===BLACK)this.full--;
 }
 legal(capsOnly){
  const us=this.turn,out=[];
  for(const m of this.pseudo(capsOnly)){this.make(m);if(!this.attacked(this.ks[us>>3],us^8))out.push(m);this.undo()}
  return out;
 }
 uci(m){return sqName(m.f)+sqName(m.t)+(m.pr?LETTER[typeOf(m.pr)].toLowerCase():'')}
 fromUci(u){
  const f=sqOf(u.slice(0,2)),t=sqOf(u.slice(2,4)),pr=u[4];
  return this.legal().find(m=>m.f===f&&m.t===t&&(!m.pr||LETTER[typeOf(m.pr)].toLowerCase()===(pr||'q')))||null;
 }
 san(m,legal=this.legal()){
  const t=typeOf(m.p);let s;
  if(m.fl&4)s=m.t>m.f?'O-O':'O-O-O';
  else{
   s=t===P?'':LETTER[t];
   if(t!==P&&t!==K){
    const others=legal.filter(o=>o.t===m.t&&o.p===m.p&&o.f!==m.f);
    if(others.length){
     const sameFile=others.some(o=>(o.f&7)===(m.f&7)),sameRank=others.some(o=>(o.f>>4)===(m.f>>4));
     s+=!sameFile?'abcdefgh'[m.f&7]:!sameRank?String(8-(m.f>>4)):sqName(m.f);
    }
   }
   if(m.c){if(t===P)s+='abcdefgh'[m.f&7];s+='x'}
   s+=sqName(m.t);
   if(m.pr)s+='='+LETTER[typeOf(m.pr)];
  }
  this.make(m);if(this.inCheck())s+=this.legal().length?'+':'#';this.undo();
  return s;
 }
 // only kings, or kings plus one bishop or knight, or one bishop each on the same colour
 insufficient(){
  const minors=[];
  for(let s=0;s<120;s++){if(s&0x88){s+=7;continue}const p=this.b[s];if(!p||typeOf(p)===K)continue;if(typeOf(p)===P||typeOf(p)===R||typeOf(p)===Q)return false;minors.push([p,s])}
  if(minors.length<=1)return true;
  if(minors.length===2&&typeOf(minors[0][0])===B&&typeOf(minors[1][0])===B&&colorOf(minors[0][0])!==colorOf(minors[1][0])){
   const shade=s=>((s>>4)+(s&7))&1;return shade(minors[0][1])===shade(minors[1][1]);
  }
  return false;
 }
 // 'mate' | 'stalemate' | 'fifty' | 'material' | null (threefold repetition is tracked by the caller)
 status(){
  if(!this.legal().length)return this.inCheck()?'mate':'stalemate';
  if(this.half>=100)return 'fifty';
  if(this.insufficient())return 'material';
  return null;
 }
 // material count per side in pawns, for the "+3" score next to captured pieces
 material(){const v=[0,1,3,3,5,9,0],out=[0,0];for(let s=0;s<120;s++){if(s&0x88){s+=7;continue}const p=this.b[s];if(p)out[colorOf(p)>>3]+=v[typeOf(p)]}return out}
}

// ---------------------------------------------------------------- AI
const VAL=[0,100,320,330,500,900,0],MATE=30000,INF=1e9;
// Positional bonuses written for this game as simple formulas (white's view, index 0 = a8):
// minor pieces and the queen like the centre, pawns like to advance, rooks like the 7th rank,
// the king hides in a corner until the endgame and then walks to the centre.
const ring=i=>3.5-Math.max(Math.abs((i>>3)-3.5),Math.abs((i&7)-3.5)); // 0 on the edge .. 3 in the middle
const table=f=>Array.from({length:64},(_,i)=>Math.round(f(i>>3,i&7,ring(i))));
const PST=[[],
 table((r,c)=>[0,60,32,18,10,4,0,0][r]+((c===3||c===4)&&r<=4?8:0)-((c===3||c===4)&&r===6?10:0)),
 table((r,c,k)=>k*10-25),
 table((r,c,k)=>k*6-10),
 table((r,c)=>(r===1?12:0)+(r===7&&(c===3||c===4)?4:0)),
 table((r,c,k)=>k*4-6),
 table((r,c)=>r===7?(c<=2||c>=6?20:0):-(7-r)*8-10)];
const KING_END=table((r,c,k)=>k*12-18);

// score from the side to move's point of view
function evaluate(pos){
 const b=pos.b;let mg=0,heavy=0,mat=[0,0];
 for(let s=0;s<120;s++){if(s&0x88){s+=7;continue}const p=b[s];if(!p)continue;const t=typeOf(p);if(t!==P&&t!==K)heavy+=VAL[t];mat[colorOf(p)>>3]+=VAL[t]}
 const end=heavy<=1500;
 for(let s=0;s<120;s++){
  if(s&0x88){s+=7;continue}
  const p=b[s];if(!p)continue;const t=typeOf(p),white=!colorOf(p),i=white?(s>>4)*8+(s&7):(7-(s>>4))*8+(s&7);
  const v=VAL[t]+(t===K&&end?KING_END[i]:PST[t][i]);mg+=white?v:-v;
 }
 // mop-up: the side that is clearly ahead in an endgame drives the other king to the edge
 if(end&&Math.abs(mat[0]-mat[1])>=300){
  const lead=mat[0]>mat[1]?0:1,mine=pos.ks[lead],theirs=pos.ks[lead^1];
  const r=theirs>>4,c=theirs&7,center=Math.max(3-r,r-4)+Math.max(3-c,c-4),dist=Math.abs((mine>>4)-r)+Math.abs((mine&7)-c);
  const bonus=center*12+(14-dist)*5;mg+=lead===0?bonus:-bonus;
 }
 return pos.turn===WHITE?mg:-mg;
}
const orderScore=m=>(m.c?10000+10*VAL[typeOf(m.c)]-VAL[typeOf(m.p)]:0)+(m.pr?9000:0);
function quiesce(pos,alpha,beta,ctx,qd){
 ctx.nodes++;
 const stand=evaluate(pos);if(stand>=beta)return beta;if(stand>alpha)alpha=stand;if(qd<=0)return alpha;
 const moves=pos.legal(true).sort((a,b)=>orderScore(b)-orderScore(a));
 for(const m of moves){pos.make(m);const sc=-quiesce(pos,-beta,-alpha,ctx,qd-1);pos.undo();if(sc>=beta)return beta;if(sc>alpha)alpha=sc}
 return alpha;
}
function search(pos,depth,alpha,beta,ply,ctx){
 if((++ctx.nodes&1023)===0&&ctx.armed&&Date.now()>ctx.deadline)ctx.stop=true;
 if(ctx.stop)return 0;
 const moves=pos.legal();
 if(!moves.length)return pos.inCheck()?-MATE+ply:0;
 if(pos.half>=100)return 0;
 if(depth<=0)return ctx.q?quiesce(pos,alpha,beta,ctx,6):evaluate(pos);
 moves.sort((a,b)=>orderScore(b)-orderScore(a));
 let best=-INF;
 for(const m of moves){
  pos.make(m);const sc=-search(pos,depth-1,-beta,-alpha,ply+1,ctx);pos.undo();
  if(ctx.stop)return 0;
  if(sc>best)best=sc;if(sc>alpha)alpha=sc;if(alpha>=beta)break;
 }
 return best;
}
// Pick a move for the side to move. opts: depth, ms (time budget), q (quiescence), noise (centipawns of random
// spread between near-equal moves) and blunder (chance of a random legal move). Returns {move, score, depth}.
function bestMove(pos,opts={}){
 const depth=opts.depth||3,noise=opts.noise||0,rand=opts.rand||Math.random;
 const moves=pos.legal();if(!moves.length)return null;
 if(opts.blunder&&rand()<opts.blunder){
  // even a "blunder" never walks into a mate in one when another move avoids it
  const safe=moves.filter(m=>{pos.make(m);const mated=pos.legal().some(r=>{pos.make(r);const x=pos.status()==='mate';pos.undo();return x});pos.undo();return !mated});
  const pool=safe.length?safe:moves;return {move:pool[Math.floor(rand()*pool.length)],score:0,depth:0,random:true};
 }
 const ctx={nodes:0,deadline:Date.now()+(opts.ms||1000),stop:false,q:opts.q!==false};
 let scored=moves.map(m=>({m,s:0})),done=0;
 for(let d=1;d<=depth;d++){
  let best=-INF;const next=[];
  // previous iteration's best first; moves worse than best-noise are cut (their exact score is not needed)
  for(const e of scored){
   const alpha=best===-INF?-INF:best-noise-1;
   pos.make(e.m);const sc=-search(pos,d-1,-INF,-alpha,1,ctx);pos.undo();
   if(ctx.stop)break;
   next.push({m:e.m,s:sc});if(sc>best)best=sc;
  }
  if(ctx.stop&&d>1)break;
  if(next.length===scored.length){scored=next.sort((a,b)=>b.s-a.s);done=d}
  ctx.armed=true; // depth 1 always finishes, so there is always a real answer
  if(ctx.stop)break;
  if(Math.abs(scored[0].s)>MATE-100)break;
 }
 const top=scored[0].s,near=scored.filter(e=>e.s>=top-noise&&(top<MATE-100||e.s===top));
 // a found mate is always played; otherwise choose among the near-best moves with a random tilt
 const choice=near.length>1?near.map(e=>({e,k:e.s+rand()*noise})).sort((a,b)=>b.k-a.k)[0].e:scored[0];
 return {move:choice.m,score:choice.s,depth:done,nodes:ctx.nodes};
}

return {Position,START_FEN,sqName,sqOf,typeOf,colorOf,WHITE,BLACK,P,N,B,R,Q,K,LETTER,bestMove,evaluate,MATE};
})();
/*ENGINE-END*/

function audio(){if(!S.sound)return null;try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){return null}return AC}
function tone(f,d=.12,type='sine',v=.08,at=0){const a=audio();if(!a)return;const t=a.currentTime+at,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.03)}
function knock(v=.4,f=1000){const a=audio();if(!a)return;if(!noiseBuf){noiseBuf=a.createBuffer(1,Math.floor(a.sampleRate*.07),a.sampleRate);const ch=noiseBuf.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1)*Math.pow(1-i/ch.length,5)}
 const s=a.createBufferSource(),bp=a.createBiquadFilter(),g=a.createGain();s.buffer=noiseBuf;bp.type='bandpass';bp.frequency.value=f;bp.Q.value=1.2;g.gain.value=v;s.connect(bp).connect(g).connect(a.destination);s.start()}

const BD={pos:null,flip:false,side:WHITE,ids:new Int16Array(128).fill(-1),els:{},next:1,sel:-1,targets:[],last:null,hint:null,interactive:false,onMove:null,drag:null};
const sqAt=i=>{let r=i>>3,c=i&7;if(BD.flip){r=7-r;c=7-c}return r*16+c};
const dispOf=sq=>{let r=sq>>4,c=sq&7;if(BD.flip){r=7-r;c=7-c}return [r,c]};
function boardBuild(){
 let h='';for(let i=0;i<64;i++)h+='<div class="sq"></div>';
 $('board').innerHTML=h+'<div class="pieces" id="pieces"></div>';
 $('board').addEventListener('pointerdown',onDown);
 window.addEventListener('pointermove',onDrag,{passive:false});
 window.addEventListener('pointerup',onUp);window.addEventListener('pointercancel',onUp);
}
function paintSquares(){
 const sqs=$('board').children;
 for(let i=0;i<64;i++){const s=sqAt(i),r=s>>4,c=s&7,el=sqs[i];el.className='sq'+((r+c)&1?' dk':'');el.dataset.sq=s;
  el.innerHTML=((i&7)===0?`<span class="co r">${8-r}</span>`:'')+((i>>3)===7?`<span class="co f">${'abcdefgh'[c]}</span>`:'')}
}
function placeEl(el,sq){const [r,c]=dispOf(sq),t=`translate(${c*100}%,${r*100}%)`;el.style.transform=t;el.style.setProperty('--t',t)}
function addPiece(sq,p){const id=BD.next++,el=document.createElement('div');el.className='pc '+(colorOf(p)?'b':'w');el.innerHTML=pieceSVG(p);placeEl(el,sq);$('pieces').appendChild(el);BD.ids[sq]=id;BD.els[id]=el;return el}
function removePiece(sq){const id=BD.ids[sq];if(id<0)return;const el=BD.els[id];delete BD.els[id];BD.ids[sq]=-1;if(el){el.classList.add('gone');setTimeout(()=>el.remove(),260)}}
function movePieceEl(f,t){const id=BD.ids[f];BD.ids[f]=-1;BD.ids[t]=id;const el=BD.els[id];if(el)placeEl(el,t);return el}
function boardSet(pos,flip){
 BD.pos=pos;BD.flip=!!flip;BD.sel=-1;BD.targets=[];BD.hint=null;BD.drag=null;BD.ids.fill(-1);BD.els={};
 const h=pos.hist[pos.hist.length-1];BD.last=h?h[0]:null;
 $('pieces').innerHTML='';
 for(let s=0;s<120;s++){if(s&0x88){s+=7;continue}if(pos.b[s])addPiece(s,pos.b[s])}
 paintSquares();marks();
}
// animate a legal move, then apply it to BD.pos
function boardPlay(m,sound=true){
 const pos=BD.pos,us=pos.turn;
 if(m.c)removePiece(m.fl&2?(us===WHITE?m.t+16:m.t-16):m.t);
 const el=movePieceEl(m.f,m.t);
 if(m.fl&4){const rf=m.t>m.f?m.t+1:m.t-2,rt=m.t>m.f?m.t-1:m.t+1;movePieceEl(rf,rt)}
 if(m.pr&&el)setTimeout(()=>{el.innerHTML=pieceSVG(m.pr);el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')},180);
 pos.make(m);BD.last=m;BD.sel=-1;BD.targets=[];BD.hint=null;
 if(sound){if(pos.inCheck())SFX.check();else if(m.c)SFX.capture();else SFX.move()}
 marks();
}
// take back the last move with animation
function boardUndo(){

 const el=movePieceEl(m.t,m.f);if(m.pr&&el)el.innerHTML=pieceSVG(m.p);

 if(mine(s)){e.preventDefault();if(BD.sel!==s)SFX.click();select(s);const el=BD.els[BD.ids[s]];if(el)BD.drag={s,el,x:e.clientX,y:e.clientY,id:e.pointerId,moved:false};return}

function onDrag(e){
 const d=BD.drag;if(!d||e.pointerId!==d.id)return;

function grant({coins=0,xp=0,items={}}={}){
 const before=S.coins;S.coins+=coins;S.earned+=Math.max(0,coins);
 for(const [k,v] of Object.entries(items))S.inv[k]=(S.inv[k]||0)+v;

 while(S.xp>=xpNeed(S.lvl)){S.xp-=xpNeed(S.lvl);S.lvl++;const oldT=titleOf(S.lvl-1).name,t=titleOf(S.lvl);
  const gift={coins:50+S.lvl*10,items:{hint:1,...(S.lvl%5===0?{shield:1,undo:1}:{})}};S.coins+=gift.coins;S.earned+=gift.coins;
  for(const [k,v] of Object.entries(gift.items))S.inv[k]=(S.inv[k]||0)+v;
  levels.push({lvl:S.lvl,gift,newTitle:t.name!==oldT?t:null});

 levels.forEach(l=>modal(levelHTML(l),{cls:'levelup',onOpen:()=>{SFX.level();celebrate('fireworks');speak(L(`레벨 업! 이제 레벨 ${l.lvl}이에요!`,`Level up! You are now level ${l.lvl}!`))}}));

// a treasure chest with two coin bags: add them up for a bonus (3-digit addition)
function mathChest(title,done){
 const a=100+rnd(150),b=60+rnd(140),ans=a+b,opts=shuffle([ans,ans+10*(1+rnd(4)),ans-10*(1+rnd(4))]);
 let answered=false;
 modal(`<div style="font-size:70px">🎁</div><h2>${esc(title)}</h2><p>${L('상자 안에 코인 주머니가 2개 있어요. 모두 몇 개일까요? 맞히면 보너스 +50!','There are two coin bags inside. How many coins in total? Get it right for +50 bonus!')}</p>
  <div class="math" style="font-size:24px">${COIN} ${a} + ${COIN} ${b} = ?</div>
  <div class="choices">${opts.map(o=>`<button type="button" data-act="ans" data-v="${o}">${o}</button>`).join('')}</div>
  <p id="chestMsg" style="min-height:24px"></p><div class="row"><button class="btn gold hidden" id="chestTake" type="button" data-act="take">${L('받기','Collect')}</button></div>`,
 {closable:false,acts:{
  ans:b2=>{if(answered)return false;answered=true;const ok=+b2.dataset.v===ans;
   document.querySelectorAll('.choices button').forEach(x=>{if(+x.dataset.v===ans)x.classList.add('right');else if(x===b2)x.classList.add('wrong')});
   $('chestMsg').textContent=ok?L(`정답! ${a} + ${b} = ${ans} · 보너스 +50!`,`Correct! ${a} + ${b} = ${ans} · +50 bonus!`):L(`정답은 ${ans}이에요. 그래도 ${ans}코인을 받아요!`,`The answer is ${ans}. You still get ${ans} coins!`);
   if(ok){SFX.good();celebrate()}else SFX.bad();
   $('chestTake').classList.remove('hidden');$('chestTake').dataset.coins=ans+(ok?50:0);return false},
  take:b2=>{const n=+b2.dataset.coins;const r=grant({coins:n,xp:30});flyCoins(null,r.coins);done&&done()}
 }});
}

  <button class="btn small ghost learn" type="button" data-lesson="${c}">📖 ${L('기술 배우기','Learn the trick')}</button></div></div>
 <div class="path" style="height:${H}px"><svg viewBox="0 0 100 ${H}" preserveAspectRatio="none"><path vector-effect="non-scaling-stroke" d="${pts.map(([x,y],k)=>(k?'L':'M')+x+' '+y).join(' ')}"/></svg>${nodes}</div>`;

let PZ=null;
function startStage(c,k){
 mapChapter=c;S.lastChapter=c;save();
 const go=()=>startPuzzle(ADV_STAGES[c][k],'stage',{c,k});
 if(!S.lessons.includes(c)&&k===0)lessonModal(c,go);else go();
}
function startRated(){
 const seen=new Set(S.seen);let pool=[];
 for(let w=80;w<=600&&pool.length<3;w+=80)pool=PUZ.map((p,i)=>i).filter(i=>!STAGE_SET.has(i)&&!seen.has(i)&&Math.abs(PUZ[i].rating-S.rating)<=w);
 if(!pool.length)pool=PUZ.map((p,i)=>i).filter(i=>!STAGE_SET.has(i));
 startPuzzle(pick(pool),'rated');
}
function startDaily(){
 const d=dayKey();
 if(S.daily.day!==d){
  let h=0;for(const ch of d)h=(h*31+ch.charCodeAt(0))>>>0;
  const pool=PUZ.map((p,i)=>i).filter(i=>!STAGE_SET.has(i)&&Math.abs(PUZ[i].rating-S.rating)<=150);
  S.daily={day:d,idx:pool.length?pool[h%pool.length]:h%PUZ.length,done:false};save();
 }
 if(S.daily.done){modal(`<div style="font-size:64px">📅</div><h2>${L('오늘의 퍼즐 완료!','Daily puzzle done!')}</h2><p>${L('내일 새로운 문제가 기다려요. 실력 퍼즐도 도전해 봐요!','A new one arrives tomorrow. Try the rated puzzles too!')}</p><div class="row"><button class="btn" type="button" data-act="again">${L('다시 풀어 보기','Solve it again')}</button><button class="btn green" type="button" data-act="rated">🧩 ${L('실력 퍼즐','Rated')}</button></div>`,{acts:{again:()=>()=>startPuzzle(S.daily.idx,'daily',{replay:true}),rated:()=>startRated}});return}
 startPuzzle(S.daily.idx,'daily');
}
function startPuzzle(idx,mode,extra={}){
 const p=PUZ[idx],pos=new Position(p.fen);
 if(MODE!=='puzzle'||VIEW!=='game')setupGame('puzzle');
 const z={idx,p,mode,...extra,step:0,mistakes:0,hints:0,shieldUsed:false,busy:true,done:false,firstTry:!S.seen.includes(idx),missSaid:false};
 PZ=z;BT=null;BD.side=pos.turn^8;BD.interactive=false;BD.onMove=puzzleMove;
 boardSet(pos,BD.side===BLACK);
 renderPuzzleBars();renderPuzzleGoal();renderPuzzleTools();
 say(mode==='rush'?L('준비!','Ready!'):L('상대가 먼저 한 수 둬요. 잘 보세요!','Your opponent moves first. Watch closely!'),mode!=='rush');
 setTimeout(()=>{
  if(PZ!==z||z.done)return;
  boardPlay(pos.fromUci(p.moves[0]));z.step=1;z.busy=false;BD.interactive=true;
  say(`${sideName(BD.side)} ${L('차례!','to move!')} ${THEMES[p.theme].goal}`,mode!=='rush');renderPuzzleBars();
 },mode==='rush'?380:900);
}

$('tools').addEventListener('click',e=>{

function useHint(){
 const z=PZ;if(!z||z.busy||z.done)return;
 if(S.inv.hint<=0){toast(`💡 ${L('힌트가 없어요. 상점에서 살 수 있어요!','No hints left. Get more in the shop!')}`);return}
 const m=BD.pos.fromUci(z.p.moves[z.step]);if(!m)return;
 S.inv.hint--;z.hints++;save();SFX.hint();
 if(BD.hint&&BD.hint.f===m.f){BD.hint={f:m.f,t:m.t};say(L('반짝이는 칸으로 옮겨 봐요!','Move it to the glowing square!'))}
 else{BD.hint={f:m.f,t:-1};say(L('반짝이는 기물을 움직여 봐요! 어디로 갈지 생각해요.','Move the glowing piece! Where should it go?'))}
 marks();renderPuzzleTools();
}
function puzzleMove(m){
 const z=PZ;if(!z||z.busy||z.done)return;
 const u=BD.pos.uci(m),exp=z.p.moves[z.step];
 boardPlay(m);
 const mate=BD.pos.status()==='mate';
 if(u===exp||mate){
  z.step++;flashSq(m.t,'good',500);
  if(mate||z.step>=z.p.moves.length){puzzleSolved(mate);return}

function rateChange(z,score){

 const K=S.ratedPlays<20?40:26,exp=1/(1+Math.pow(10,(z.p.rating-S.rating)/400));
 let d=Math.round(K*(score-exp));if(d<0)d=Math.round(d*.6);
 const before=S.rating;S.rating=Math.max(400,S.rating+d);S.ratedPlays++;
 if(!S.seen.includes(z.idx))S.seen.push(z.idx);
 return S.rating-before;
}

 const bt=BT;bt.thinking=true;BD.interactive=false;renderBattle();
 const t0=Date.now(),wait=550+rnd(450);
 aiMove(BD.pos,bt.bot.ai).then(u=>setTimeout(()=>{
  if(BT!==bt||bt.over)return;
  const mv=u&&BD.pos.fromUci(u);bt.thinking=false;
  if(!mv){checkBattleEnd();return}
  const big=mv.c&&typeOf(mv.c)>=4;applyBattleMove(mv);
  if(!bt.over){BD.interactive=true;renderBattle();
   if(BD.pos.inCheck())say(L('체크! 킹을 지켜요!','Check! Protect your king!'));
   else if(big)say(L(`앗, ${josa(bt.bot.name,'이','가')} 큰 기물을 잡았어요. 반격해 봐요!`,`Oh no, ${bt.bot.name} took a big piece. Strike back!`));
  }
 },Math.max(0,wait-(Date.now()-t0))));
}
function checkBattleEnd(){
 const st=BD.pos.status();let res=null,why=st;
 if(st==='mate')res=BD.pos.turn===BT.me?'lose':'win';else if(st)res='draw';
 else if(BT.keys[BD.pos.key()]>=3){res='draw';why='repeat'}
 if(res)battleOver(res,why);
}
function battleHint(){
 if(!BT||BT.over||BT.thinking||BD.pos.turn!==BT.me)return;
 if(S.inv.hint<=0){toast(`💡 ${L('힌트가 없어요. 상점에서 살 수 있어요!','No hints left. Get more in the shop!')}`);return}
 if(BT.hinting)return;BT.hinting=true;const bt=BT;S.inv.hint--;save();SFX.hint();renderBattle();
 aiMove(BD.pos,{depth:3,ms:700}).then(u=>{bt.hinting=false;if(BT!==bt||bt.over||BD.pos.turn!==bt.me)return;const m=u&&BD.pos.fromUci(u);if(!m)return;
  BD.hint={f:m.f,t:m.t};marks();renderBattle();say(L(`${BD.pos.san(m)}! 반짝이는 기물을 반짝이는 칸으로 옮겨 봐요.`,`${BD.pos.san(m)}! Move the glowing piece to the glowing square.`))});
}
function battleUndo(){
 if(!BT||BT.over||BT.thinking||BD.pos.turn!==BT.me)return;
 if(S.inv.undo<=0){toast(`⏪ ${L('무르기가 없어요. 상점에서 살 수 있어요!','No take-backs left. Get more in the shop!')}`);return}
 const myMoves=BT.me===WHITE?Math.ceil(BT.moves.length/2):Math.floor(BT.moves.length/2);
 if(myMoves<1||BT.moves.length<2){toast(L('아직 되돌릴 수가 없어요','Nothing to take back yet'));return}
 S.inv.undo--;
 for(let i=0;i<2;i++){const k=BD.pos.key();BT.keys[k]--;boardUndo();BT.moves.pop();BT.sans.pop()}
 SFX.click();saveBattle();renderBattle();say(L('한 수 물렀어요. 이번엔 더 좋은 수를 찾아봐요!','Move taken back. Find a better one this time!'));
}
function battleResign(){
 if(!BT||BT.over)return;
 if(!BT.resignArm){BT.resignArm=true;renderBattle();setTimeout(()=>{if(BT&&BT.resignArm&&!BT.over){BT.resignArm=false;renderBattle()}},4000);return}
 battleOver('lose','resign');
}
function battleOver(res,why){
 const bt=BT;bt.over=true;BD.interactive=false;S.battle=null;
 const b=bt.bot,first=!(S.botWins[b.id]>0),bossFirst=bt.boss!=null&&!S.bossWins.includes(bt.boss);
 let coins=0,xp=0,extra='',title,icon,line;
 if(res==='win'){
  S.wins++;S.botWins[b.id]=(S.botWins[b.id]||0)+1;track('win');
  coins=b.reward*(first?2:1);xp=40+bt.bi*15;
  if(bossFirst){S.bossWins.push(bt.boss);coins+=200+bt.boss*100;xp+=100;extra+=`<span class="item">🗺️ ${L('새 지역이 열렸어요!','A new land is open!')}</span>`}
  title=L('승리!','Victory!');icon='🏆';line=b.lose;SFX.win();celebrate();setTimeout(()=>celebrate('fireworks'),600);
 }else if(res==='draw'){coins=Math.round(b.reward/3);xp=20;title=L('무승부!','Draw!');icon='🤝';line=why==='stalemate'?L('스테일메이트! 킹이 갈 곳이 없지만 체크가 아니라서 무승부예요.','Stalemate! The king cannot move but is not in check, so it is a draw.'):why==='repeat'?L('같은 자리가 3번 나와서 무승부예요.','The same position happened 3 times, so it is a draw.'):L('기물이 부족해서 무승부예요.','Not enough pieces to checkmate, so it is a draw.');SFX.good()}
 else{coins=10;xp=10;title=why==='resign'?L('기권했어요','You resigned'):L('아쉬워요!','So close!');icon='💪';line=b.win;SFX.lose()}
 const r=grant({coins,xp});save();
 say(res==='win'?`${b.icon} “${b.lose}” ${L('대단해요!','Amazing!')}`:res==='lose'?L('괜찮아요! 퍼즐로 연습하면 더 강해져요. 다시 도전해 봐요!','That’s okay! Practice puzzles to get stronger, then try again!'):line);
 const bossNext=res==='win'&&bt.boss!=null&&bt.boss+1<CHAPTERS.length;
 setTimeout(()=>modal(`<div style="font-size:70px">${icon}</div><h2>${title}</h2><p>${b.icon} ${esc(b.name)}: “${esc(res==='draw'?line:res==='win'?b.lose:b.win)}”</p>${res==='draw'?'':`<p>${esc(res==='lose'?L('질 때도 도전 보상을 받아요. 다음엔 이길 수 있어요!','You still get a reward for trying. You can win next time!'):'')}</p>`}${rewardChips(r,extra)}
  <div class="row"><button class="btn ghost" type="button" data-act="out">${bt.boss!=null?L('지도로','Map'):L('상대 고르기','Rivals')}</button>${res==='win'?(bossNext?`<button class="btn green" type="button" data-act="nextland">${CHAPTERS[bt.boss+1].icon} ${L('새 지역으로!','To the new land!')}</button>`:''):`<button class="btn red" type="button" data-act="again">⚔️ ${L('다시 도전','Rematch')}</button>`}</div>`,
  {closable:false,acts:{out:()=>()=>go(bt.boss!=null?'map':'battle'),again:()=>()=>startBattle(bt.bi,bt.me,{boss:bt.boss}),nextland:()=>()=>{mapChapter=bt.boss+1;S.lastChapter=mapChapter;save();go('map')}}}),res==='win'?1200:900);
}

// ---------------------------------------------------------------- shop
let shopTab='items';
function renderShop(){
 const tabs=[['items',L('🎒 아이템','🎒 Items')],['board',L('🎨 체스판','🎨 Boards')],['pieces',L('♞ 기물','♞ Pieces')],['fx',L('🎉 축하 효과','🎉 Effects')],['coach',L('🐾 코치','🐾 Coaches')]];
 let list='';
 const buyBtn=(kind,id,price,owned,on)=>owned?(on?`<button class="btn small ghost" type="button" disabled>✅ ${L('사용 중','Equipped')}</button>`:`<button class="btn small green" type="button" data-equip="${kind}:${id}">${L('사용하기','Equip')}</button>`):`<button class="btn small gold" type="button" data-buy="${kind}:${id}" ${S.coins<price?'disabled':''}>${COIN} ${num(price)}</button>`;
 if(shopTab==='items')list=Object.entries(ITEMS).map(([id,it])=>`<div class="item"><span class="own">${L('보유','Own')} ${S.inv[id]||0}</span><div class="pv">${pic(it.img,it.icon)}</div><b>${esc(it.name)} ×${it.pack}</b><small>${esc(it.desc)}</small><button class="btn small gold" type="button" data-buy="items:${id}" ${S.coins<it.price?'disabled':''}>${COIN} ${num(it.price)}</button></div>`).join('');
 else if(shopTab==='board')list=BOARDS.map(b=>{const own=S.owned.board.includes(b.id);return `<div class="item">${own?`<span class="own">✓</span>`:''}<div class="pv bt-${b.id}"><div class="mini-board">${Array.from({length:16},(_,i)=>`<i class="${((i>>2)+(i&3))&1?'dk':''}"></i>`).join('')}</div></div><b>${esc(b.name)}</b>${buyBtn('board',b.id,b.price,own,S.equip.board===b.id)}</div>`}).join('');
 else if(shopTab==='pieces')list=PIECESETS.map(p=>{const own=S.owned.pieces.includes(p.id);return `<div class="item">${own?`<span class="own">✓</span>`:''}<div class="pv ps-${p.id}" style="background:#e9ecf8"><div class="mini-pieces">${pieceHTML(2)}${pieceHTML(2|BLACK)}</div></div><b>${esc(p.name)}</b>${buyBtn('pieces',p.id,p.price,own,S.equip.pieces===p.id)}</div>`}).join('');
 else if(shopTab==='fx')list=EFFECTS.map(f=>{const own=S.owned.fx.includes(f.id);return `<div class="item">${own?`<span class="own">✓</span>`:''}<div class="pv">${f.icon}</div><b>${esc(f.name)}</b><button class="btn small ghost" type="button" data-preview="${f.id}">👀 ${L('미리 보기','Preview')}</button>${buyBtn('fx',f.id,f.price,own,S.equip.fx===f.id)}</div>`}).join('');
 else list=Object.entries(COACHES).map(([id,c])=>{const own=S.owned.coach.includes(id);return `<div class="item">${own?`<span class="own">✓</span>`:''}<div class="pv">${pic(c.img,c.icon)}</div><b>${esc(c.name)}</b><small>${esc(c.say)} ${L('퍼즐을 함께 풀어요','Solves puzzles with you')}</small>${buyBtn('coach',id,c.price,own,S.equip.coach===id)}</div>`}).join('');
 $('v-shop').innerHTML=`<h2 class="section-title">🛒 ${L('상점','Shop')} <small>${COIN} ${num(S.coins)}</small></h2><div class="tabs">${tabs.map(([k,t])=>`<button type="button" data-tab="${k}" aria-pressed="${shopTab===k}">${t}</button>`).join('')}</div><div class="items">${list}</div>`;
}
$('v-shop').addEventListener('click',e=>{
 const t=e.target.closest('[data-tab]'),b=e.target.closest('[data-buy]'),q=e.target.closest('[data-equip]'),pv=e.target.closest('[data-preview]');
 if(t){SFX.click();shopTab=t.dataset.tab;renderShop();return}
 if(pv){celebrate(pv.dataset.preview);return}
 if(q){SFX.click();const [k,id]=q.dataset.equip.split(':');S.equip[k]=id;save();renderShop();toast('✅ '+L('바꿨어요!','Equipped!'));return}
 if(b){
  SFX.click();const [k,id]=b.dataset.buy.split(':');
  const def=k==='items'?ITEMS[id]:k==='board'?BOARDS.find(x=>x.id===id):k==='pieces'?PIECESETS.find(x=>x.id===id):k==='fx'?EFFECTS.find(x=>x.id===id):COACHES[id];
  const price=def.price;if(S.coins<price)return;
  modal(`<div style="font-size:60px">${k==='items'?pic(def.img,def.icon):k==='coach'?pic(def.img,def.icon):k==='fx'?def.icon:'🛍️'}</div><h2>${esc(def.name)}${k==='items'?' ×'+def.pack:''}</h2><p>${L('살까요? 남는 코인을 계산해 봐요!','Buy it? Let’s count the coins left!')}</p>
   <div class="math" style="font-size:22px">${COIN} ${num(S.coins)} − ${num(price)} = ${num(S.coins-price)}</div>
   <div class="row"><button class="btn ghost" type="button" data-act="close">${L('아니요','No')}</button><button class="btn gold" type="button" data-act="buy">${L('살래요!','Buy!')}</button></div>`,
  {acts:{buy:()=>{if(S.coins<price)return;S.coins-=price;S.purchases++;
   if(k==='items')S.inv[id]=(S.inv[id]||0)+def.pack;else{S.owned[k].push(id);S.equip[k]=id}
   save();updateHud();SFX.coin();celebrate('stars');toast(`🛍️ ${esc(def.name)} ${L('구매 완료!','purchased!')}`);checkTrophies();renderShop()}}});
 }
});

// ---------------------------------------------------------------- trophies
function renderTrophies(){
 $('v-trophy').innerHTML=`<h2 class="section-title">🏆 ${L('업적','Trophies')} <small>${S.ach.length}/${ACH.length}</small></h2><div class="grid2">${ACH.map(a=>{const done=a.test(S),got=S.ach.includes(a.id);
  return `<div class="trophy ${done?'':'lock'}"><span class="ic">${a.icon}</span><div><b>${esc(a.name)}</b><small>${esc(a.desc)}</small></div><div class="act">${got?`<span class="got">✅ ${L('받음','Claimed')}</span>`:done?`<button class="btn small gold" type="button" data-ach="${a.id}">${COIN} +${a.coins}</button>`:`<span class="sub">${COIN} ${a.coins}</span>`}</div></div>`}).join('')}</div>`;
}
$('v-trophy').addEventListener('click',e=>{const b=e.target.closest('[data-ach]');if(!b)return;const a=ACH.find(x=>x.id===b.dataset.ach);if(!a||S.ach.includes(a.id)||!a.test(S))return;S.ach.push(a.id);const r=grant({coins:a.coins,xp:20});flyCoins(b,r.coins);SFX.win();celebrate('stars');renderTrophies()});

// ---------------------------------------------------------------- settings
function openSettings(){
 const sw=(id,on,label)=>`<div class="row"><span>${label}</span><button class="switch ${on?'on':''}" type="button" data-act="${id}" aria-pressed="${on}"></button></div>`;
 let resetArm=false;
 modal(`<h2>⚙️ ${L('설정','Settings')}</h2><div class="settings">${sw('snd',S.sound,L('🔊 효과음','🔊 Sound effects'))}${sw('voice',S.voice,L('🗣️ 코치 목소리','🗣️ Coach voice'))}${sw('shield',S.shieldOn,L('🛡️ 실수 방패 자동 사용','🛡️ Use the shield automatically'))}
  <div class="row"><span>🌐 ${L('언어','Language')}</span><button class="btn small ghost" type="button" data-act="lang">${LANG==='en'?'한국어':'English'}</button></div>
  <div class="row"><span>🗑️ ${L('처음부터 다시 하기','Start over')}</span><button class="btn small red" type="button" data-act="reset">${L('초기화','Reset')}</button></div></div>
  <p style="font-size:12.5px;margin-top:14px">${L('체스 퍼즐은 Lichess 공개 퍼즐 데이터베이스(CC0, 자유 이용)에서 골랐어요. 체스판·기물 그림, 캐릭터, 소리, AI는 이 게임을 위해 직접 만들었어요.','Puzzles come from the Lichess open puzzle database (CC0, free to use). The board, pieces, characters, sounds and AI were made for this game.')}</p>`,
 {acts:{
  snd:b=>{S.sound=!S.sound;b.classList.toggle('on',S.sound);save();if(S.sound)SFX.click();return false},
  voice:b=>{S.voice=!S.voice;b.classList.toggle('on',S.voice);save();if(!S.voice)try{speechSynthesis.cancel()}catch(e){}else speak(L('코치 목소리를 켰어요!','Coach voice is on!'));return false},
  shield:b=>{S.shieldOn=!S.shieldOn;b.classList.toggle('on',S.shieldOn);save();if(PZ)renderPuzzleTools();return false},
  lang:()=>{save();setLang(LANG==='en'?'ko':'en');return false},
  reset:b=>{if(!resetArm){resetArm=true;b.textContent=L('정말요? 한 번 더','Really? Tap again');return false}try{localStorage.removeItem(SAVE_KEY)}catch(e){}location.reload();return false},
 }});
}

// ---------------------------------------------------------------- daily login
function dailyLogin(){
 const d=dayKey();if(S.login.last===d)return;
 const y=new Date();y.setDate(y.getDate()-1);
 S.login.streak=S.login.last===dayKey(y)?S.login.streak+1:1;S.login.last=d;S.login.best=Math.max(S.login.best,S.login.streak);save();
 const idx=(S.login.streak-1)%7,coins=LOGIN[idx];
 modal(`<h2>📅 ${L('출석 보상','Daily reward')}</h2><p>${L(`${S.login.streak}일 연속 출석! 매일 오면 선물이 커져요.`,`${S.login.streak}-day streak! Come every day for bigger gifts.`)}</p>
  <div class="calendar">${LOGIN.map((c,i)=>`<div class="${i<idx?'got':i===idx?'today':''}">${L(`${i+1}일`,`Day ${i+1}`)}<b>${i===6?'🎁':i<idx?'✅':'🪙'}</b>${c}</div>`).join('')}</div>
  <div class="row"><button class="btn gold" type="button" data-act="take">${COIN} +${coins} ${L('받기','Collect')}</button></div>`,
 {closable:false,acts:{take:b=>{const r=grant({coins,xp:10,items:idx===6?{hint:2,shield:1}:{}});flyCoins(b,r.coins);if(VIEW==='home')renderHome()}}});
}

// ---------------------------------------------------------------- start
boardBuild();applyLang();updateHud();ensureMissions();$('homeLink').href='index.html?lang='+LANG;
// No title screen: open straight onto the home screen
{
 go('home');
 if(!S.intro){S.intro=true;save();const c=COACHES[S.equip.coach];
  modal(`<div style="font-size:70px">${pic(c.img,c.icon)}</div><h2>${L('안녕! 나는 멍멍 코치야','Hi! I am Coach Woof')}</h2><p>${L('체스 왕국에 온 걸 환영해! 퍼즐을 풀면 코인과 별을 받고, 레벨이 올라가. 지역마다 보스를 이기면 새 땅이 열려!','Welcome to the chess kingdom! Solve puzzles for coins and stars, and level up. Beat each land’s boss to open a new one!')}</p>
   <div class="row"><button class="btn green" type="button" data-act="go">▶ ${L('모험 시작!','Start the adventure!')}</button></div>`,
  {closable:false,acts:{go:()=>()=>startStage(0,0)},onOpen:()=>speak(L('안녕! 나는 멍멍 코치야. 체스 왕국에 온 걸 환영해! 퍼즐을 풀면 코인과 별을 받고, 레벨이 올라가. 지역마다 보스를 이기면 새 땅이 열려!','Hi! I am Coach Woof. Welcome to the chess kingdom! Solve puzzles for coins and stars, and level up. Beat each land’s boss to open a new one!'))});
 }
 dailyLogin();
}
window.addEventListener('beforeunload',()=>{if(BT&&!BT.over)saveBattle();save()});

// For browser verification
window.__chessTest={get:()=>S,set:o=>{Object.assign(S,o);save();updateHud()},PUZ,ADV_STAGES,BD,
 solve:()=>{if(!PZ||PZ.done)return false;const m=BD.pos.fromUci(PZ.p.moves[PZ.step]);if(!m)return false;BD.onMove(m);return true},
 wrong:()=>{if(!PZ||PZ.done)return false;const exp=PZ.p.moves[PZ.step];const m=BD.pos.legal().find(x=>BD.pos.uci(x)!==exp&&!(()=>{BD.pos.make(x);const s=BD.pos.status()==='mate';BD.pos.undo();return s})());if(!m)return false;BD.onMove(m);return true},
 pz:()=>PZ,bt:()=>BT,rush:()=>RUSH,go,startStage,startBattle,startRated,bossIntro,battleOver:r=>battleOver(r,'test')};
</script>
