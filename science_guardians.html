<style>
:root{
 color-scheme:light;
 --ink:#1d2a4a;--muted:#5f6b8f;--line:#e2e8f5;--card:#ffffff;

*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;min-height:100dvh;color:var(--ink);font:16px/1.45 system-ui,-apple-system,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
 background:radial-gradient(900px 500px at 85% -10%,#5fe3ff44,transparent 60%),radial-gradient(800px 500px at -10% 110%,#7cff9c33,transparent 60%),linear-gradient(170deg,#0f3d6e,#16649c 55%,#1a9aa6);
 background-attachment:fixed;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;
 background-image:radial-gradient(circle at 12% 22%,transparent 9px,#fff3 10px,transparent 11px),radial-gradient(circle at 78% 16%,transparent 14px,#fff3 15px,transparent 16px),radial-gradient(circle at 60% 72%,transparent 7px,#fff3 8px,transparent 9px),radial-gradient(circle at 26% 84%,transparent 12px,#fff3 13px,transparent 14px),radial-gradient(circle at 90% 60%,transparent 5px,#fff3 6px,transparent 7px)}

 background:linear-gradient(180deg,rgba(8,36,70,.94),rgba(8,36,70,.8));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 6px 20px rgba(5,20,50,.35);color:#fff}

.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.ctile{position:relative;border:0;border-radius:20px;background:#fff;box-shadow:var(--shadow);padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-height:150px}

.ctile .wk{position:absolute;top:6px;right:8px;font-size:20px;animation:pulse 1.6s infinite}

/* ---------------------------------------------------------------- play: arena */
.arena{position:relative;border-radius:24px;padding:10px 12px 12px;color:#fff;box-shadow:0 12px 28px rgba(0,0,0,.25);overflow:hidden}
.arena::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 0,#ffffff33,transparent 50%);pointer-events:none}
.arena.hurt{animation:hurt .45s}
@keyframes hurt{30%{box-shadow:inset 0 0 0 999px rgba(255,40,60,.45),0 12px 28px rgba(0,0,0,.25);transform:translateX(-6px)}60%{transform:translateX(5px)}}
.ptitle{font-size:13px;font-weight:900;opacity:.9;text-align:center;margin-bottom:4px}
.fighters{display:flex;align-items:center;gap:8px}
.fighters .me,.fighters .foe{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.fighters .foe{flex-direction:row-reverse;text-align:right}
.fighters b{display:block;font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi,.fi{min-width:0;flex:1}
.avw .ava{width:58px;height:58px;font-size:34px}
.hearts{font-size:17px;letter-spacing:-2px;white-space:nowrap}
.hearts .shd{letter-spacing:0;margin-left:6px;font-size:15px}
.combo{font-size:13px;font-weight:900;min-height:18px;color:#ffe27a;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.vs{flex:0 0 auto;font-weight:900;font-size:15px;opacity:.8;font-style:italic}
.fimg{flex:0 0 auto;width:76px;height:76px;border-radius:22px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:50px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.3)}
.fimg .ei{width:72px;height:72px}
.fimg.hit{animation:fhit .45s}
@keyframes fhit{20%{transform:translateX(8px) rotate(8deg);filter:brightness(2.2)}50%{transform:translateX(-6px) rotate(-6deg)}}
.foe.lunge .fimg{animation:lunge .45s}
@keyframes lunge{40%{transform:translateX(-30px) scale(1.15)}}
.foe.down .fimg{animation:fdown .9s forwards}
@keyframes fdown{to{transform:translateY(20px) rotate(90deg) scale(.6);opacity:.25;filter:grayscale(1)}}
.hp{position:relative;height:16px;border-radius:99px;background:rgba(0,0,0,.3);overflow:hidden;margin-top:4px}
.hp i{position:absolute;right:0;top:0;bottom:0;width:100%;background:linear-gradient(90deg,#ff9f45,#ff4d5e);border-radius:99px;transition:width .5s cubic-bezier(.2,.9,.3,1.2)}
.hp span{position:relative;display:block;text-align:center;font-size:11.5px;font-weight:900;line-height:16px;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.foesay{position:relative;margin:8px 0 0;background:#fff;color:var(--ink);border-radius:16px;padding:8px 12px;font-weight:800;font-size:14.5px;box-shadow:0 6px 14px rgba(0,0,0,.2)}
.foesay::before{content:"";position:absolute;right:34px;top:-8px;border:8px solid transparent;border-bottom-color:#fff;border-top:0}
.foesay.pop{animation:popIn .3s cubic-bezier(.2,1.4,.4,1)}
.labhead{display:flex;align-items:center;gap:10px}
.labhead div{flex:1;min-width:0}
.labhead b{display:block;font-size:17px;font-weight:900}
.labhead small{font-weight:800;opacity:.9}
.labhead .score{font-weight:900;font-size:18px;background:rgba(255,255,255,.22);border-radius:14px;padding:6px 12px}
.beamfx{position:fixed;left:0;top:0;z-index:77;width:44px;height:44px;margin:-22px 0 0 -22px;font-size:38px;display:grid;place-items:center;pointer-events:none;filter:drop-shadow(0 0 12px var(--c)) drop-shadow(0 0 4px var(--c))}
.dmg{position:fixed;z-index:78;transform:translate(-50%,-50%);font-size:30px;font-weight:900;color:#fff;text-shadow:0 3px 0 #c0283a,0 0 12px rgba(0,0,0,.5);pointer-events:none;animation:dmg 1.1s ease-out forwards;white-space:nowrap}
.dmg small{font-size:15px;display:block;text-align:center}
.dmg.crit{color:#ffe27a;font-size:36px}
.dmg.ouch,.dmg.shield{font-size:40px}
@keyframes dmg{0%{opacity:0;transform:translate(-50%,-20%) scale(.6)}20%{opacity:1;transform:translate(-50%,-70%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}

/* ---------------------------------------------------------------- play: challenge card */
.chal{margin-top:12px;position:relative;padding:12px 14px 14px;max-width:720px;margin-left:auto;margin-right:auto}
.arena,.itembar{max-width:720px;margin-left:auto;margin-right:auto}
.chal.enter{animation:chalIn .35s cubic-bezier(.2,1.2,.4,1)}
@keyframes chalIn{from{opacity:0;transform:translateY(14px) scale(.98)}}
.chead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ctag{font-size:13px;font-weight:900;background:#edf4ff;color:var(--brand-d);border-radius:99px;padding:4px 11px}
.buddyh{margin-left:auto;font-size:26px;line-height:1}
.buddyh .ei{width:34px;height:34px}
.sayb{width:40px;height:40px;border-radius:12px;border:0;background:#fff4cc;font-size:19px;box-shadow:0 3px 0 #f0d78a;flex:0 0 auto}
.sayb.sm{width:32px;height:32px;font-size:15px;vertical-align:middle;margin-right:2px}
.cbody{position:relative}
.cbody.shake,.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.qtext{font-size:clamp(18px,4.6vw,21px);font-weight:900;line-height:1.4;letter-spacing:-.3px;margin:4px 2px 10px}
.qtext.small{font-size:16px;color:var(--muted);text-align:center;margin:8px 0}
.qart{font-size:58px;text-align:center;line-height:1.15;margin:2px 0 10px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.15))}
.qart.sm{font-size:40px}
.opts{display:grid;gap:10px}
.opts.n2,.opts.n4{grid-template-columns:1fr 1fr}
.opts.n3{grid-template-columns:1fr}
.opts.grid2c{grid-template-columns:1fr 1fr}
.opt{min-height:58px;border:0;border-radius:16px;background:#f1f6ff;box-shadow:0 4px 0 #cfdcf2;font-weight:900;font-size:16.5px;padding:8px 12px;line-height:1.3;color:var(--ink);transition:transform .08s}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 #cfdcf2}
.opt .ic{font-size:26px;vertical-align:middle}
.opt.right{background:#d8ffe6;box-shadow:0 4px 0 #8fdcae;animation:pop .35s}
.opt.wrong{background:#ffe1e5;box-shadow:0 4px 0 #f3a8b3;animation:shake .4s}
.opt.gone{opacity:.25;text-decoration:line-through}
.opt:disabled{cursor:default}
@keyframes pop{50%{transform:scale(1.05)}}
.claim{display:flex;gap:10px;align-items:flex-start;margin:4px 0}
.claim .who{flex:0 0 auto;width:58px;height:58px;border-radius:18px;background:#f3ecff;display:grid;place-items:center;font-size:38px}
.claim .who .ei{width:54px;height:54px}
.claim .says{position:relative;flex:1;background:#fff8e6;border:3px solid #ffd36b;border-radius:18px;padding:12px 14px;font-weight:900;font-size:clamp(17px,4.4vw,20px);line-height:1.4}
.claim .says::before{content:"";position:absolute;left:-11px;top:18px;border:9px solid transparent;border-right-color:#ffd36b;border-left:0}
.oxrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.oxb{min-height:96px;border:0;border-radius:22px;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.oxb b{font-size:44px;line-height:1}
.oxb small{font-size:15px}
.oxb.o{background:#e3f2ff;color:#1764b8;box-shadow:0 6px 0 #a9cdf2}
.oxb.x{background:#ffe8ec;color:#c0283a;box-shadow:0 6px 0 #f3b3be}
.oxb:active{transform:translateY(4px)}
.oxb.right{background:#d8ffe6;box-shadow:0 6px 0 #8fdcae;animation:pop .35s}
.oxb.wrong{background:#ffd6dc;animation:shake .4s}
.hintline{background:#fffbe0;border:2px dashed #ffd36b;border-radius:14px;padding:8px 12px;font-weight:800;font-size:14.5px;margin:6px 0 10px}
/* sorting */
.sortcard{display:flex;flex-direction:column;align-items:center;gap:2px;margin:6px auto 12px;width:min(240px,80%);padding:12px;border-radius:22px;background:linear-gradient(160deg,#fff,#f1f6ff);box-shadow:0 0 0 3px #d7e5fb,0 10px 20px rgba(10,40,90,.12);position:relative}
.sortcard.in{animation:popIn .35s cubic-bezier(.2,1.4,.4,1)}
.sortcard .ic{font-size:60px;line-height:1.1}
.sortcard b{font-size:19px;font-weight:900;text-align:center}
.sortcard .cnt{position:absolute;top:8px;right:12px;font-size:12px;font-weight:900;color:var(--muted)}
.bins{display:grid;gap:10px}
.bins.n2{grid-template-columns:1fr 1fr}.bins.n3{grid-template-columns:1fr 1fr 1fr}
.bin{border:3px dashed #b9cdee;border-radius:18px;background:#f7faff;min-height:96px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:900}
.bin .bi{font-size:30px}
.bin b{font-size:14.5px;line-height:1.2;text-align:center}
.bin .tray{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;font-size:18px;min-height:22px}
.bin .tray .was{opacity:.55;text-decoration:underline wavy #ff5a6a}
.bin.flash-ok{border-color:#33c46b;background:#e3fbea}
.bin.flash-bad{border-color:#ff5a6a;background:#ffe8ec}
.bin.hinted{border-color:#ffc83d;background:#fff8d6;animation:pulse 1s infinite}
.tank{position:relative;height:110px;margin:0 auto 10px;width:min(260px,85%);border-radius:0 0 18px 18px;border:3px solid #9cc8e0;border-top:0;overflow:hidden;background:linear-gradient(#fff 0 22%,#cfeaff 22%)}
.tank .water{position:absolute;left:0;right:0;top:22%;height:4px;background:#8fc9ef}
.tank .drop,.magstage .drop{position:absolute;left:50%;top:-40px;font-size:36px;transform:translateX(-50%);opacity:0}
.tank .drop.float{animation:float2 1s ease-out forwards}
.tank .drop.sink{animation:sink 1s ease-in forwards}
@keyframes float2{0%{top:-40px;opacity:1}60%{top:30%}80%{top:12%}100%{top:16%;opacity:1}}
@keyframes sink{0%{top:-40px;opacity:1}40%{top:20%}100%{top:66%;opacity:1}}
.magstage{position:relative;height:96px;margin:0 auto 10px;width:min(260px,85%);border-radius:18px;background:#f4f0ff}
.magstage .bigmag{position:absolute;left:50%;top:6px;transform:translateX(-50%) rotate(180deg);font-size:44px}
.magstage .drop{top:70px}
.magstage .drop.stick{animation:stick .8s cubic-bezier(.3,1.6,.5,1) forwards}
.magstage .drop.fall{animation:mfall .8s ease forwards}
@keyframes stick{0%{top:70px;opacity:1}100%{top:40px;opacity:1}}
@keyframes mfall{0%{top:62px;opacity:1}40%{top:56px}100%{top:66px;opacity:1;transform:translateX(30%) rotate(30deg)}}
/* ordering */
.slots{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px;margin:4px 0 12px}
.slot{width:52px;height:52px;border-radius:14px;border:3px dashed #b9cdee;display:grid;place-items:center;font-weight:900;color:#9fb0cf;font-size:18px}
.slot.on{border-style:solid;border-color:#33c46b;background:#e3fbea;font-size:30px;animation:pop .3s}
.slot .svgi{width:40px;height:40px}
.arr{font-style:normal;font-weight:900;color:#9fb0cf}
.tiles2{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.tl{border:0;border-radius:18px;background:#f1f6ff;box-shadow:0 4px 0 #cfdcf2;min-height:92px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:900}
.tl .ic{font-size:36px;line-height:1}
.tl .svgi{width:44px;height:44px}
.tl b{font-size:14px;line-height:1.25}
.tl.placed{opacity:.3;transform:scale(.94)}
.tl.hinted{box-shadow:0 0 0 4px #ffc83d,0 4px 0 #cfdcf2;animation:pulse 1s infinite}
/* pick all */
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px}
.pk{border:3px solid transparent;border-radius:18px;background:#f1f6ff;box-shadow:0 4px 0 #cfdcf2;min-height:88px;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:900}
.pk .ic{font-size:34px}
.pk b{font-size:14px}
.pk[aria-pressed="true"]{border-color:var(--brand);background:#e1efff}
.pk.right{border-color:#33c46b;background:#e3fbea}
.pk.wrong{border-color:#ff5a6a;background:#ffe8ec}
.pk.dim{opacity:.45}
.pk.hinted{box-shadow:0 0 0 4px #ffc83d}
/* riddle */
.clues{margin:0 0 10px;padding:0 0 0 24px;font-weight:800;font-size:16.5px;line-height:1.5}
.clues li{margin:4px 0;animation:popIn .3s}
.clues li.hid{display:none}
/* labs: shared */
.simwrap{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 0 0 3px #dbe7f7;background:#eaf4ff;max-width:520px;margin:0 auto}
.simwrap.sq{max-width:340px;margin:0 auto}
.simsvg{display:block;width:100%;height:auto;touch-action:none;-webkit-user-select:none;user-select:none}
.dragtip{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:rgba(20,30,60,.72);color:#fff;font-weight:900;font-size:13px;border-radius:99px;padding:4px 12px;pointer-events:none;animation:pulse 1.6s infinite;transition:opacity .3s}
.dragtip.gone{opacity:0}
.simmsg{min-height:0;font-weight:900;font-size:15px;color:#b15a00;text-align:center;margin:8px 0 0;opacity:0;transition:opacity .2s}
.simmsg.show{opacity:1;min-height:22px}
.simrow{display:flex;justify-content:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.simrow .btn{min-width:160px}
.gauge{text-align:center;font-weight:800;font-size:13.5px;color:var(--muted);margin-top:6px}
.gauge b{color:var(--ink)}
.spk{position:absolute;font-size:24px;pointer-events:none;animation:spk .9s ease-out forwards;z-index:5}
@keyframes spk{0%{opacity:0;transform:scale(.3)}30%{opacity:1;transform:scale(1.3)}100%{opacity:0;transform:translateY(-30px) scale(1)}}
/* silhouette */
.silwall{position:relative;height:170px;border-radius:18px;background:radial-gradient(circle at 50% 50%,#fffbe0 0,#ffe9a8 45%,#c9a96a 100%);display:grid;place-items:center;overflow:hidden;margin-bottom:12px;box-shadow:inset 0 0 30px rgba(120,80,20,.35)}
.silwall .torchi{position:absolute;left:10px;bottom:8px;font-size:34px;transform:rotate(-30deg)}
.sil{font-size:120px;line-height:1;filter:brightness(0) opacity(.82);transition:filter .6s}
.sil.flip{transform:scaleX(-1) rotate(-12deg)}
.sil.reveal{filter:none}
/* race */
.race{display:grid;gap:8px}
.lane{display:flex;align-items:center;gap:10px;border:3px solid transparent;border-radius:18px;background:#f1f6ff;box-shadow:0 4px 0 #cfdcf2;padding:8px 10px;text-align:left;min-height:64px}
.lane .ln{flex:0 0 112px;display:flex;align-items:center;gap:6px;font-weight:900;font-size:13.5px;line-height:1.2}
.lane .ln .ic{font-size:28px;line-height:1}
.lane .track{position:relative;flex:1;height:40px;border-radius:12px;background:repeating-linear-gradient(90deg,#fff 0 18px,#e7eefb 18px 36px)}
.lane .rc{--p:0;position:absolute;top:50%;left:calc(var(--p)*(100% - 40px));transform:translateY(-50%);font-size:32px;line-height:1;transition:none}
.race.shrink .rc{left:calc(50% - 20px);transform-origin:50% 60%}
.race.shrink .rc.gone{opacity:0!important}
.lane .fin{position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:18px;opacity:.7}
.race.shrink .fin{display:none}
.race.fall{grid-template-columns:repeat(auto-fit,minmax(90px,1fr))}
.race.fall .lane{flex-direction:column;align-items:center;text-align:center;padding:8px 6px}
.race.fall .lane .ln{flex:0 0 auto;flex-direction:column}
.race.fall .lane .track{width:46px;flex:0 0 150px;background:linear-gradient(#eaf4ff,#d9ecff 92%,#8fd16a 92%)}
.race.fall .lane .rc{left:50%;top:calc(4px + var(--p)*(100% - 44px));transform:translateX(-50%)}
.race.fall .fin{display:none}
.lane.mine{border-color:var(--brand);background:#e1efff}
.lane.winner{border-color:#ffc83d;background:#fff8d6;box-shadow:0 0 0 3px #ffc83d,0 4px 0 #e0b22a}
.lane.winner .ln::after{content:"🏆";font-size:22px}
/* magnets */
.magrow{display:flex;justify-content:center;align-items:center;flex-wrap:nowrap;padding:22px 4px;background:#f4f0ff;border-radius:18px;overflow:hidden}
.mag{position:relative;display:flex;width:clamp(64px,18vw,96px);height:46px;border:0;padding:0;border-radius:10px;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.2);margin-left:18px;transition:margin .45s cubic-bezier(.3,1.5,.5,1)}
.mag:first-child{margin-left:0}
.mag span{flex:1;display:grid;place-items:center;font-weight:900;font-size:20px;color:#fff}
.mag .n{background:linear-gradient(180deg,#ff6b6b,#e2333f)}
.mag .s{background:linear-gradient(180deg,#5aa0ff,#2c64d6)}
.mag.flip{flex-direction:row-reverse}
.mag.spin{animation:mspin .4s}
.mag.wig{animation:shake .4s}
.mag em{position:absolute;top:-2px;right:2px;font-style:normal;font-size:13px}
.mag.locked{box-shadow:0 4px 0 rgba(0,0,0,.2),0 0 0 3px #ffc83d}
.mag.stuck{margin-left:0}
.mag.push{margin-left:46px}
@keyframes mspin{50%{transform:rotateY(90deg)}}
/* thermometer */
.thermo-wrap{display:flex;align-items:center;justify-content:center;gap:4px;background:#f3f8ff;border-radius:18px;padding:6px 8px;margin-bottom:10px}
.thermo-wrap .thermo{width:min(230px,58vw)}
.tside{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:90px}
.tside .scene{font-size:44px}
.tside .tv{font-size:28px;font-weight:900;color:#c0283a}
/* thunder */
.storm{position:relative;border-radius:18px;overflow:hidden}
.storm.shake{animation:shake .5s 2}
.storm .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .08s}
.storm .flash.on{opacity:.85}
.counter{position:absolute;right:12px;top:10px;background:rgba(255,255,255,.92);border-radius:16px;padding:4px 14px;text-align:center;font-weight:900}
.counter b{display:block;font-size:34px;line-height:1.1;color:#24305e}
.counter small{font-size:12px;color:var(--muted)}
/* sound */
.instr{display:flex;justify-content:center;align-items:flex-end;gap:10px;background:#f3f8ff;border-radius:18px;padding:12px 8px}
.ins{position:relative;border:3px solid transparent;border-radius:16px;background:#fff;box-shadow:0 4px 0 #cfdcf2;width:72px;padding:6px 4px 22px}
.ins svg{width:100%;height:auto;display:block}
.instr.drum .ins{width:84px}
.ins .num{position:absolute;left:50%;bottom:3px;transform:translateX(-50%);font-weight:900;font-size:13px;color:var(--muted)}
.ins.sel{border-color:var(--brand);background:#e1efff}
.ins.right{border-color:#33c46b;background:#e3fbea}
.ins.wrong{border-color:#ff5a6a;background:#ffe8ec}
.ins.buzz svg{animation:buzz .35s}
@keyframes buzz{20%{transform:translateX(-2px)}40%{transform:translateX(2px)}60%{transform:translateX(-2px)}80%{transform:translateX(1px)}}
/* hand washing */
.sink{background:linear-gradient(#e8f6ff,#cfeaff);border-radius:18px;padding:10px}
.hands{position:relative;height:170px;display:grid;place-items:center;font-size:120px;line-height:1;border-radius:14px;touch-action:none;cursor:grab;transition:filter .4s}
.hands.wet{filter:saturate(1.2) brightness(1.05)}
.hands .germ{position:absolute;font-size:28px;transition:opacity .3s}
.hands .foam{position:absolute;inset:10% 15%;border-radius:50%;background:radial-gradient(circle at 30% 40%,#fff 0 12%,transparent 13%),radial-gradient(circle at 60% 30%,#fff 0 10%,transparent 11%),radial-gradient(circle at 70% 65%,#fff 0 14%,transparent 15%),radial-gradient(circle at 35% 70%,#fff 0 11%,transparent 12%);opacity:0;pointer-events:none}
.hands:not(.soapy) .foam{opacity:0!important}
.hands.clean{filter:drop-shadow(0 0 12px #fff)}
.sbar{position:relative;height:24px;border-radius:99px;background:#fff;overflow:hidden;margin-top:8px}
.sbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7cf3ff,#33c46b)}
.sbar b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px}
.steps{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
/* map grid */
.gridwrap{position:relative;max-width:360px;margin:0 auto 10px}
.grid{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:4px;background:#cfe8c4;border-radius:16px;padding:6px}
.cell{aspect-ratio:1;border:0;border-radius:10px;background:#f4fbef;display:grid;place-items:center;position:relative;padding:0;box-shadow:inset 0 -3px 0 rgba(0,0,0,.06)}
.cell .pi{font-size:clamp(20px,6vw,30px);line-height:1}
.cell .rob{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(20px,6vw,30px);animation:pop .25s}

.dpad{margin:8px auto 0;max-width:300px;gap:8px}

/* speed */
.spbar{display:flex;align-items:center;gap:10px;margin-top:4px}

.spbar .score{background:#fff;color:var(--ink);border-radius:12px;padding:2px 12px;font-size:22px;font-weight:900;min-width:56px;text-align:center}
.spcombo{min-height:20px;text-align:center;font-weight:900;color:#fff6b0}
.claim.big .says{font-size:clamp(19px,5vw,23px);min-height:96px;display:flex;align-items:center}
.speedcard .oxb{min-height:110px}
.spfb{min-height:26px;text-align:center;font-weight:900;margin-top:10px}
.spfb.ok{color:var(--green-d)}.spfb.bad{color:var(--red-d)}
/* feedback panel */
.fb{margin-top:14px;border-radius:18px;padding:12px 14px;animation:popIn .3s cubic-bezier(.2,1.3,.4,1)}
.fb.ok{background:#e9fbef;box-shadow:inset 0 0 0 3px #9fe2bb}
.fb.bad{background:#fff1f3;box-shadow:inset 0 0 0 3px #f6c0c8}
.fbh{font-size:19px;font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fbh .dm{font-size:14px;background:#fff;border-radius:99px;padding:2px 10px;color:#b0410f}
.fbh .dm.sh{color:#1764b8}.fbh .dm.hurt{color:#c0283a}
.fba{margin-top:6px;font-weight:800;font-size:15.5px}
.fbw{margin-top:6px;font-weight:700;font-size:15px;line-height:1.5;color:#253050}
.fbr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;flex-wrap:wrap}
.cardchip{border:0;border-radius:99px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.12);padding:6px 12px;font-weight:900;font-size:13.5px;color:var(--brand-d);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbr .next{flex:1;min-width:150px}
/* items */
.itembar{position:sticky;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;padding:10px 4px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,rgba(10,50,90,.35) 45%)}
.tool{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-height:58px;border:0;border-radius:16px;background:#fff;box-shadow:0 4px 0 #cfdcf2,0 8px 14px rgba(10,40,90,.18);font-weight:900;font-size:12.5px;color:var(--ink);padding:4px}
.tool:active{transform:translateY(3px);box-shadow:0 1px 0 #cfdcf2}
.tool .ic{font-size:22px;line-height:1.1}
.tool .tlb{white-space:nowrap}
.tool .ic .ei{width:26px;height:26px}
.tool .n{position:absolute;top:-6px;right:-4px;min-width:22px;height:22px;border-radius:99px;background:var(--brand);color:#fff;font-size:12px;display:grid;place-items:center;padding:0 6px;box-shadow:0 2px 5px rgba(0,0,0,.25)}
.tool .n.zero{background:#a3a7bf}
.tool.on{background:#e6fff0;box-shadow:0 4px 0 #9fe2bb,0 8px 14px rgba(10,40,90,.18)}

/* ---------------------------------------------------------------- lists: labs, shop, trophies */
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:12px}
.bot{display:flex;gap:12px;align-items:center;border:0;text-align:left;background:#fff;border-radius:20px;padding:12px;box-shadow:var(--shadow);position:relative;width:100%}
.bot .pt{position:relative;flex:0 0 auto;width:70px;height:70px;border-radius:20px;display:grid;place-items:center;font-size:42px;overflow:hidden}
.bot b{font-size:17px;font-weight:900;display:block}
.bot small{display:block;font-weight:800;color:var(--muted);font-size:13px}
.bot.locked{filter:grayscale(.9);opacity:.6}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;min-height:44px;padding:0 16px;border-radius:99px;border:0;background:rgba(255,255,255,.16);color:#fff;font-weight:900;font-size:15px}
.tabs button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:10px}
.item{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:#fff;border-radius:20px;padding:12px 10px;box-shadow:var(--shadow);position:relative}
.item .pv{width:100%;height:96px;border-radius:14px;display:grid;place-items:center;font-size:56px;background:#f3f7ff;overflow:hidden}
.item .pv .ei{width:84px;height:84px}
.item b{font-size:15.5px;font-weight:900}
.item small{font-size:12.5px;font-weight:700;color:var(--muted);min-height:34px}
.item .own{position:absolute;top:8px;left:8px;font-size:12px;font-weight:900;background:#e3f8eb;color:var(--green-d);border-radius:99px;padding:2px 8px}
.item .btn{width:100%;min-height:44px;font-size:15px}
.trophy{display:flex;gap:12px;align-items:center;background:#fff;border-radius:18px;padding:12px;box-shadow:var(--shadow)}
.trophy .ic{flex:0 0 auto;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:34px;background:#fff4cc}
.trophy.lock .ic{filter:grayscale(1);opacity:.45;background:#eee}
.trophy b{display:block;font-weight:900}
.trophy small{display:block;font-weight:700;color:var(--muted)}
.trophy .act{margin-left:auto;flex:0 0 auto}
.trophy .got{font-size:13px;font-weight:900;color:var(--green-d)}
.section-title{color:#fff;font-size:22px;font-weight:900;margin:4px 0 12px;letter-spacing:-.4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.section-title small{font-size:14px;opacity:.85}

/* ---------------------------------------------------------------- modals, toasts, effects */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(6,20,50,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fadeIn .2s}
.modal .box{position:relative;width:min(440px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:#fff;border-radius:28px;padding:22px 20px 20px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.4);animation:popIn .35s cubic-bezier(.2,1.4,.4,1)}
.modal h2{margin:4px 0 6px;font-size:25px;font-weight:900;letter-spacing:-.5px}
.modal p{margin:6px 0;font-weight:700;color:var(--muted)}
.modal .row{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.modal .row .btn{flex:1;min-width:130px}
.modal .x{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:0;background:#f0f3fa;font-size:18px;z-index:2}
@keyframes fadeIn{from{opacity:0}}
@keyframes popIn{from{opacity:0;transform:scale(.7)}}
.bossart{width:150px;height:150px;margin:4px auto 6px;border-radius:36px;display:grid;place-items:center;font-size:96px;box-shadow:0 12px 26px rgba(0,0,0,.25),inset 0 0 0 4px rgba(255,255,255,.35)}

.bossart.sm{width:110px;height:110px;font-size:66px;border-radius:28px}
.bossart.sm .ei{width:96px;height:96px}
.bossart.down{filter:grayscale(.3)}
.speech{position:relative;background:#fff8e6;border:3px solid #ffd36b;border-radius:18px;padding:10px 14px;font-weight:900;font-size:16px;color:var(--ink);margin:8px 0}
.mons{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:10px 0;font-size:30px}
.mons span{background:#f3f0ff;border-radius:14px;padding:4px 8px}
.mons.sm{font-size:22px;gap:6px}
.bigstars{display:flex;justify-content:center;gap:6px;font-size:54px;margin:6px 0 2px;min-height:66px}
.bigstars span{display:inline-block;opacity:0;transform:scale(.2) rotate(-40deg)}
.bigstars span.in{animation:starIn .45s cubic-bezier(.2,1.6,.4,1) forwards}
.bigstars span.dim{filter:grayscale(1);opacity:.25!important;transform:none!important;animation:none}
@keyframes starIn{to{opacity:1;transform:scale(1) rotate(0)}}
.bignum{font-size:64px;font-weight:900;color:var(--brand-d);line-height:1.1}
.rewards{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:12px 0 4px}
.rewards span{display:inline-flex;align-items:center;gap:5px;background:#f3f6ff;border-radius:99px;padding:7px 13px;font-weight:900;font-size:15.5px}
.rewards span.coin{background:#fff4cc;color:#7a4b00}
.rewards span.xp{background:#e2f6ff;color:#0b5c84}
.rewards span.item{background:#e6fff0;color:#1b7a42}
.math{margin:10px auto 0;display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:18px;color:#7a4b00;background:#fffaf0;border:2px dashed #ffd36b;border-radius:14px;padding:6px 14px}
.math .ei{width:24px;height:24px}
.review{text-align:left;margin-top:12px;background:#f7f9ff;border-radius:16px;padding:10px 12px}
.review summary{font-weight:900;cursor:pointer}
.review .rv{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:1px dashed var(--line);font-size:14px}
.review .rv b{font-weight:900}
.review .rv span{color:var(--muted);font-weight:700}
.levelup .rays{position:absolute;left:50%;top:92px;width:420px;height:420px;margin:-210px 0 0 -210px;pointer-events:none;opacity:.5;
 background:repeating-conic-gradient(from 0deg,#ffe58a 0 10deg,transparent 10deg 20deg);border-radius:50%;-webkit-mask:radial-gradient(circle,#000 20%,transparent 68%);mask:radial-gradient(circle,#000 20%,transparent 68%);animation:spin 8s linear infinite}
.levelup .num{position:relative;width:120px;height:120px;margin:4px auto 0;border-radius:50%;display:grid;place-items:center;font-size:54px;font-weight:900;color:#3b2a00;
 background:radial-gradient(circle at 35% 30%,#fff6c9,#ffc83d 55%,#e09a00);box-shadow:0 0 0 6px #fff3c4,0 10px 26px rgba(224,154,0,.5);animation:popIn .6s cubic-bezier(.2,1.6,.4,1)}
.levelup .lbl{position:relative;font-size:30px;font-weight:900;color:var(--brand);letter-spacing:1px;margin-top:10px}
@keyframes spin{to{transform:rotate(360deg)}}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.choices button{min-height:56px;border-radius:16px;border:0;background:#eef4ff;font-weight:900;font-size:22px;box-shadow:0 4px 0 #cfdcf2}
.choices button.right{background:#d8ffe6;box-shadow:0 4px 0 #8fdcae}
.choices button.wrong{background:#ffe1e5;box-shadow:0 4px 0 #f3a8b3}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.calendar div{border-radius:12px;padding:8px 2px;background:#f3f6ff;font-size:12px;font-weight:900;color:var(--muted)}
.calendar div b{display:block;font-size:22px;line-height:1.3}
.calendar div.got{background:#e3f8eb;color:var(--green-d)}
.calendar div.today{background:#fff4cc;color:#7a4b00;box-shadow:0 0 0 3px var(--gold);animation:pulse 1.4s infinite}
.toasts{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,420px)}
.toast{background:#fff;border-radius:16px;padding:10px 16px;font-weight:900;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:toastIn .35s cubic-bezier(.2,1.4,.4,1),toastOut .3s 2.4s forwards;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;text-align:center}
.toast .ei{width:26px;height:26px}
@keyframes toastIn{from{opacity:0;transform:translateY(-16px) scale(.9)}}
@keyframes toastOut{to{opacity:0;transform:translateY(-10px)}}
.fx{position:fixed;inset:0;pointer-events:none;z-index:75;overflow:hidden}
.fx i{position:absolute;display:block;will-change:transform,opacity}
.flycoin{position:fixed;left:0;top:0;z-index:76;pointer-events:none;width:30px;height:30px}
.flycoin .ei{width:30px;height:30px}
.settings .row{justify-content:space-between;align-items:center;margin-top:10px;padding:10px 12px;background:#f6f8ff;border-radius:14px;font-weight:900;color:var(--ink);text-align:left}
.settings .row .btn{flex:0 0 auto;min-width:0}
.switch{width:58px;height:32px;border-radius:99px;border:0;background:#c9cce0;position:relative;flex:0 0 auto}
.switch::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .18s;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.switch.on{background:var(--green)}
.switch.on::after{left:30px}
.diffs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.diffs button{border:3px solid transparent;border-radius:18px;background:#f3f6ff;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:900;box-shadow:0 4px 0 #cfdcf2}
.diffs button span{font-size:30px}
.diffs button small{font-size:12px;color:var(--muted);font-weight:800}
.diffs button.on{border-color:var(--green);background:#e9fbef}
.field{display:flex;flex-direction:column;gap:4px;text-align:left;font-weight:900;margin-top:6px}
.field input{font:inherit;font-size:18px;font-weight:800;border:3px solid #d7e2f5;border-radius:14px;padding:10px 12px;color:var(--ink)}
.avs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
.avs button{aspect-ratio:1;border:3px solid transparent;border-radius:14px;background:#f3f6ff;font-size:26px;padding:0}
.avs button.on{border-color:var(--brand);background:#e1efff}
.plist{display:grid;gap:8px;margin-top:10px;text-align:left}
.pl{display:flex;align-items:center;gap:12px;border:3px solid transparent;border-radius:18px;background:#f3f6ff;padding:10px 12px}
.pl.on{border-color:var(--green);background:#e9fbef}
.pl span{flex:1;min-width:0}
.pl b{display:block;font-weight:900}
.pl small{font-weight:800;color:var(--muted)}
.pl em{font-style:normal}
.usebox{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900;margin-top:10px;background:#fff8d6;border-radius:14px;padding:8px}
.usebox input{width:22px;height:22px}

.cert{margin:4px 0;border:6px double #e0a92a;border-radius:18px;padding:16px 14px;background:linear-gradient(160deg,#fffdf3,#fff3c9)}
.cert .ct{font-size:20px;font-weight:900;color:#8a5a00}
.cert .cn{display:flex;align-items:center;justify-content:center;gap:10px;margin:12px 0 6px;font-size:26px;font-weight:900}
.cert p{color:#5a4a20!important}
.cert .cd{font-weight:800;color:#8a7a50;font-size:13px}
/* ---------------------------------------------------------------- responsive */
@media (max-width:760px){
 .tiles{grid-template-columns:repeat(4,1fr);gap:8px}
 .tile{min-height:108px;padding:10px 4px 8px;border-radius:18px}
 .tile .ic{font-size:34px;height:44px}.tile .ic .ei{width:44px;height:44px}
 .tile b{font-size:13.5px}.tile small{font-size:11px}
}

 main{padding-top:10px}
 .tiles{grid-template-columns:repeat(2,1fr);gap:10px}
 .tile{flex-direction:row;min-height:72px;justify-content:flex-start;text-align:left;gap:10px;padding:10px 12px}
 .tile .ic{height:auto}.tile .ic .ei{width:42px;height:42px}
 .tile div{align-items:flex-start;min-width:0}
 .tile b{font-size:15px}.tile small{font-size:12px}
 .hero{padding:14px}.hero .face .ava{width:66px;height:66px;font-size:38px}
 .hero .buddy{top:8px;right:8px;font-size:26px}.hero .buddy .ei{width:38px;height:38px}
 .banner{padding:14px}.banner .art{width:72px;height:72px;font-size:46px}.banner .art .ei{width:72px;height:72px}
 .banner h2{font-size:20px}
 .card{padding:14px}
 .chal{padding:10px 12px 12px}
 .items{grid-template-columns:repeat(2,1fr);gap:10px}
 .modal h2{font-size:22px}
 .avw .ava{width:48px;height:48px;font-size:28px}
 .fimg{width:62px;height:62px;font-size:40px;border-radius:18px}.fimg .ei{width:58px;height:58px}
 .fighters b{font-size:13px}
 .hearts{font-size:15px}
 .opt{font-size:15.5px;min-height:54px}
 .lane .ln{flex-basis:92px;font-size:12.5px}
 .lane .ln .ic{font-size:22px}
 .instr{gap:6px}.ins{width:62px}.instr.drum .ins{width:72px}
 .oxb{min-height:84px}
}

 .opts.n4{grid-template-columns:1fr}
 .bins.n3 b{font-size:12.5px}
}
/* indicator lab */
.indi{display:flex;gap:16px;align-items:center;justify-content:center;background:#f6f2ff;border-radius:18px;padding:12px;margin-bottom:8px}
.beaker{position:relative;width:92px;height:118px;border:4px solid #9a8cc0;border-top-width:0;border-radius:0 0 24px 24px;background:#fff;overflow:hidden;flex:0 0 auto}
.beaker .liq{position:absolute;left:0;right:0;bottom:0;height:74%;background:#7d55c7;transition:background-color 1.1s}
.beaker .liq.stir{animation:stir .9s}
@keyframes stir{30%{transform:scaleY(1.06)}60%{transform:scaleY(.97)}}
.indi .side{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:120px}
.indi .cnt{font-weight:900;color:var(--muted);font-size:13px}
.indi .what{display:flex;flex-direction:column;align-items:center;font-weight:900;text-align:center}
.indi .what .ic{font-size:40px;line-height:1.1}
.indikey{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:0 0 8px}
.indikey span{color:#fff;font-weight:900;font-size:12.5px;padding:4px 10px;border-radius:99px}
.bin:disabled{opacity:.6}

.flamebox,.cktbox{border-radius:18px;overflow:hidden}
.flamebox .outer{transition:fill .45s}
.flamebox .fl{transform-origin:180px 140px;animation:flick .16s infinite alternate}
@keyframes flick{to{transform:scale(.97,1.05)}}
.flsamps{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:10px}
.flsamp{border:0;border-radius:14px;min-height:46px;padding:6px 12px;background:#eef2ff;color:var(--ink);font-weight:900;font-size:15px;box-shadow:0 3px 0 #cfd8f5}
.flsamp.on{background:#fff3c4;box-shadow:0 3px 0 #e2b93a,0 0 0 3px #ffd84d}
.flsamp:disabled{opacity:.6}.flsamp.hinted{box-shadow:0 0 0 4px #ffc83d;animation:pulse 1s infinite}

.ckt{border:0;border-radius:16px;background:#f3f7ff;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink);box-shadow:0 3px 0 #cfdcf2}
.ckt .bt{font-size:18px;letter-spacing:-2px}
.ckt b{font-size:12.5px;line-height:1.25;text-align:center}
.ckt.mine{box-shadow:0 0 0 3px #7aa7ff,0 3px 0 #cfdcf2}
.ckt.winner{background:#fff6cf;box-shadow:0 0 0 3px #ffc83d}
[class^="bglow"]{transition:opacity .5s}
/* seasons, water and water-cycle labs */
.season .pick{cursor:pointer}
.season .pf{transition:stroke .3s}
.waterlab .ice,.waterlab .wat,.waterlab .bubs,.waterlab .steamg{transition:opacity .5s}
.waterlab .stm{animation:steam 1.6s ease-in infinite}
.waterlab .s1{animation-delay:.5s}.waterlab .s2{animation-delay:1s}
@keyframes steam{from{transform:translateY(10px);opacity:0}40%{opacity:1}to{transform:translateY(-18px);opacity:0}}
.waterlab .bb{animation:bubble 1s ease-in infinite}
.waterlab .b1{animation-delay:.3s}.waterlab .b2{animation-delay:.6s}.waterlab .b3{animation-delay:.15s}
@keyframes bubble{from{transform:translateY(0);opacity:.9}to{transform:translateY(-40px);opacity:0}}
.cyc svg{border-radius:16px}
.cyc .hot{cursor:pointer}
.cyc .sun{transition:r .4s,fill .4s}.cyc .sun.sunon{r:28px;fill:#ffb400}
.cyc .vap.up .vp{animation:steam 1.4s ease-in infinite}.cyc .vap .v1{animation-delay:.45s}.cyc .vap .v2{animation-delay:.9s}
.cyc .cloud{transition:opacity .6s}.cyc .cloud.dark ellipse{fill:#b9c4d4}
.cyc .rain.fall .rd{animation:rain .7s linear infinite}.cyc .rain .r1{animation-delay:.2s}.cyc .rain .r2{animation-delay:.4s}.cyc .rain .r3{animation-delay:.1s}.cyc .rain .r4{animation-delay:.5s}
@keyframes rain{from{transform:translateY(0);opacity:1}to{transform:translateY(46px);opacity:0}}
.cyc .riv{stroke-dasharray:14 10}.cyc .riv.flow{stroke:#2f8cf0;animation:flow .8s linear infinite}

.cycsteps{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:4px}
.cycsteps li{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;color:var(--muted)}
.cycsteps li span{flex:0 0 22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#e6edf8;font-size:12px;font-weight:900}
.cycsteps li.on{color:var(--ink)}.cycsteps li.on span{background:#33c46b;color:#fff}
.cycnext{margin-top:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.quakebox.quaking{animation:shake .4s 3}
.quakebox.quaking .town{animation:wob .22s 7}
@keyframes wob{25%{transform:translate(-3px,1px) rotate(-2deg)}75%{transform:translate(3px,-1px) rotate(2deg)}}
.qmap .qpin{cursor:pointer}
.qbtns .flsamp{min-height:40px;font-size:14px}

</style>
