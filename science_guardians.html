<style>

.ctile b{font-size:14.5px;font-weight:900;line-height:1.25}
.ctile small{font-size:12px;font-weight:800;color:var(--muted)}
.ctile.lock{background:#eef2f9;opacity:.8}
.ctile.t1{box-shadow:0 0 0 3px #e6b88a,var(--shadow)}.ctile.t2{box-shadow:0 0 0 3px #c9d3e6,var(--shadow)}.ctile.t3{box-shadow:0 0 0 3px #ffd24d,0 0 18px #ffd24d88}
.ctile .mbar2{width:80%;height:6px;border-radius:99px;background:#eef2fa;overflow:hidden;margin-top:auto}
.ctile .mbar2 i{display:block;height:100%;background:linear-gradient(90deg,#ffd84d,#ff9f45)}
.ctile .wk{position:absolute;top:6px;right:8px;font-size:20px;animation:pulse 1.6s infinite}

/* ---------------------------------------------------------------- play: arena */
.arena{position:relative;border-radius:24px;padding:10px 12px 12px;color:#fff;box-shadow:0 12px 28px rgba(0,0,0,.25);overflow:hidden}
.arena::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 0,#ffffff33,transparent 50%);pointer-events:none}
.arena.hurt{animation:hurt .45s}
@keyframes hurt{30%{box-shadow:inset 0 0 0 999px rgba(255,40,60,.45),0 12px 28px rgba(0,0,0,.25);transform:translateX(-6px)}60%{transform:translateX(5px)}}
.ptitle{font-size:13px;font-weight:900;opacity:.9;text-align:center;margin-bottom:4px}
.fighters{display:flex;align-items:center;gap:8px}
.fighters .me,.fighters .foe{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.fighters .foe{flex-direction:row-reverse;text-align:right}
.fighters b{display:block;font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi,.fi{min-width:0;flex:1}
.avw .ava{width:58px;height:58px;font-size:34px}
.hearts{font-size:17px;letter-spacing:-2px;white-space:nowrap}
.hearts .shd{letter-spacing:0;margin-left:6px;font-size:15px}
.combo{font-size:13px;font-weight:900;min-height:18px;color:#ffe27a;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.vs{flex:0 0 auto;font-weight:900;font-size:15px;opacity:.8;font-style:italic}
.fimg{flex:0 0 auto;width:76px;height:76px;border-radius:22px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:50px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.3)}
.fimg .ei{width:72px;height:72px}
.fimg.hit{animation:fhit .45s}
@keyframes fhit{20%{transform:translateX(8px) rotate(8deg);filter:brightness(2.2)}50%{transform:translateX(-6px) rotate(-6deg)}}
.foe.lunge .fimg{animation:lunge .45s}
@keyframes lunge{40%{transform:translateX(-30px) scale(1.15)}}
.foe.down .fimg{animation:fdown .9s forwards}
@keyframes fdown{to{transform:translateY(20px) rotate(90deg) scale(.6);opacity:.25;filter:grayscale(1)}}
.hp{position:relative;height:16px;border-radius:99px;background:rgba(0,0,0,.3);overflow:hidden;margin-top:4px}
.hp i{position:absolute;right:0;top:0;bottom:0;width:100%;background:linear-gradient(90deg,#ff9f45,#ff4d5e);border-radius:99px;transition:width .5s cubic-bezier(.2,.9,.3,1.2)}
.hp span{position:relative;display:block;text-align:center;font-size:11.5px;font-weight:900;line-height:16px;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.foesay{position:relative;margin:8px 0 0;background:#fff;color:var(--ink);border-radius:16px;padding:8px 12px;font-weight:800;font-size:14.5px;box-shadow:0 6px 14px rgba(0,0,0,.2)}
.foesay::before{content:"";position:absolute;right:34px;top:-8px;border:8px solid transparent;border-bottom-color:#fff;border-top:0}
.foesay.pop{animation:popIn .3s cubic-bezier(.2,1.4,.4,1)}
.labhead{display:flex;align-items:center;gap:10px}
.labhead div{flex:1;min-width:0}
.labhead b{display:block;font-size:17px;font-weight:900}
.labhead small{font-weight:800;opacity:.9}
.labhead .score{font-weight:900;font-size:18px;background:rgba(255,255,255,.22);border-radius:14px;padding:6px 12px}
.beamfx{position:fixed;left:0;top:0;z-index:77;width:44px;height:44px;margin:-22px 0 0 -22px;font-size:38px;display:grid;place-items:center;pointer-events:none;filter:drop-shadow(0 0 12px var(--c)) drop-shadow(0 0 4px var(--c))}
.dmg{position:fixed;z-index:78;transform:translate(-50%,-50%);font-size:30px;font-weight:900;color:#fff;text-shadow:0 3px 0 #c0283a,0 0 12px rgba(0,0,0,.5);pointer-events:none;animation:dmg 1.1s ease-out forwards;white-space:nowrap}
.dmg small{font-size:15px;display:block;text-align:center}
.dmg.crit{color:#ffe27a;font-size:36px}
.dmg.ouch,.dmg.shield{font-size:40px}
@keyframes dmg{0%{opacity:0;transform:translate(-50%,-20%) scale(.6)}20%{opacity:1;transform:translate(-50%,-70%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}

/* ---------------------------------------------------------------- play: challenge card */
.chal{margin-top:12px;position:relative;padding:12px 14px 14px;max-width:720px;margin-left:auto;margin-right:auto}
.arena,.itembar{max-width:720px;margin-left:auto;margin-right:auto}
.chal.enter{animation:chalIn .35s cubic-bezier(.2,1.2,.4,1)}
@keyframes chalIn{from{opacity:0;transform:translateY(14px) scale(.98)}}
.chead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ctag{font-size:13px;font-weight:900;background:#edf4ff;color:var(--brand-d);border-radius:99px;padding:4px 11px}
.buddyh{margin-left:auto;font-size:26px;line-height:1}
.buddyh .ei{width:34px;height:34px}
.sayb{width:40px;height:40px;border-radius:12px;border:0;background:#fff4cc;font-size:19px;box-shadow:0 3px 0 #f0d78a;flex:0 0 auto}
.sayb.sm{width:32px;height:32px;font-size:15px;vertical-align:middle;margin-right:2px}
.cbody{position:relative}
.cbody.shake,.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.qtext{font-size:clamp(18px,4.6vw,21px);font-weight:900;line-height:1.4;letter-spacing:-.3px;margin:4px 2px 10px}
.qtext.small{font-size:16px;color:var(--muted);text-align:center;margin:8px 0}
.qart{font-size:58px;text-align:center;line-height:1.15;margin:2px 0 10px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.15))}
.qart.sm{font-size:40px}
.opts{display:grid;gap:10px}
.opts.n2,.opts.n4{grid-template-columns:1fr 1fr}
.opts.n3{grid-template-columns:1fr}
.opts.grid2c{grid-template-columns:1fr 1fr}
.opt{min-height:58px;border:0;border-radius:16px;background:#f1f6ff;box-shadow:0 4px 0 #cfdcf2;font-weight:900;font-size:16.5px;padding:8px 12px;line-height:1.3;color:var(--ink);transition:transform .08s}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 #cfdcf2}
.opt .ic{font-size:26px;vertical-align:middle}
.opt.right{background:#d8ffe6;box-shadow:0 4px 0 #8fdcae;animation:pop .35s}
.opt.wrong{background:#ffe1e5;box-shadow:0 4px 0 #f3a8b3;animation:shake .4s}
.opt.gone{opacity:.25;text-decoration:line-through}
.opt:disabled{cursor:default}
@keyframes pop{50%{transform:scale(1.05)}}
.claim{display:flex;gap:10px;align-items:flex-start;margin:4px 0}
.claim .who{flex:0 0 auto;width:58px;height:58px;border-radius:18px;background:#f3ecff;display:grid;place-items:center;font-size:38px}
.claim .who .ei{width:54px;height:54px}
.claim .says{position:relative;flex:1;background:#fff8e6;border:3px solid #ffd36b;border-radius:18px;padding:12px 14px;font-weight:900;font-size:clamp(17px,4.4vw,20px);line-height:1.4}
.claim .says::before{content:"";position:absolute;left:-11px;top:18px;border:9px solid transparent;border-right-color:#ffd36b;border-left:0}
.oxrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.oxb{min-height:96px;border:0;border-radius:22px;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.oxb b{font-size:44px;line-height:1}
.oxb small{font-size:15px}
.oxb.o{background:#e3f2ff;color:#1764b8;box-shadow:0 6px 0 #a9cdf2}
.oxb.x{background:#ffe8ec;color:#c0283a;box-shadow:0 6px 0 #f3b3be}
.oxb:active{transform:translateY(4px)}
.oxb.right{background:#d8ffe6;box-shadow:0 6px 0 #8fdcae;animation:pop .35s}
.oxb.wrong{background:#ffd6dc;animation:shake .4s}
.hintline{background:#fffbe0;border:2px dashed #ffd36b;border-radius:14px;padding:8px 12px;font-weight:800;font-size:14.5px;margin:6px 0 10px}
/* sorting */
.sortcard{display:flex;flex-direction:column;align-items:center;gap:2px;margin:6px auto 12px;width:min(240px,80%);padding:12px;border-radius:22px;background:linear-gradient(160deg,#fff,#f1f6ff);box-shadow:0 0 0 3px #d7e5fb,0 10px 20px rgba(10,40,90,.12);position:relative}
.sortcard.in{animation:popIn .35s cubic-bezier(.2,1.4,.4,1)}
.sortcard .ic{font-size:60px;line-height:1.1}
.sortcard b{font-size:19px;font-weight:900;text-align:center}
.sortcard .cnt{position:absolute;top:8px;right:12px;font-size:12px;font-weight:900;color:var(--muted)}
.bins{display:grid;gap:10px}
.bins.n2{grid-template-columns:1fr 1fr}.bins.n3{grid-template-columns:1fr 1fr 1fr}
.bin{border:3px dashed #b9cdee;border-radius:18px;background:#f7faff;min-height:96px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:900}
.bin .bi{font-size:30px}
.bin b{font-size:14.5px;line-height:1.2;text-align:center}
.bin .tray{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;font-size:18px;min-height:22px}
.bin .tray .was{opacity:.55;text-decoration:underline wavy #ff5a6a}
.bin.flash-ok{border-color:#33c46b;background:#e3fbea}
.bin.flash-bad{border-color:#ff5a6a;background:#ffe8ec}
.bin.hinted{border-color:#ffc83d;background:#fff8d6;animation:pulse 1s infinite}
.tank{position:relative;height:110px;margin:0 auto 10px;width:min(260px,85%);border-radius:0 0 18px 18px;border:3px solid #9cc8e0;border-top:0;overflow:hidden;background:linear-gradient(#fff 0 22%,#cfeaff 22%)}
.tank .water{position:absolute;left:0;right:0;top:22%;height:4px;background:#8fc9ef}
.tank .drop,.magstage .drop{position:absolute;left:50%;top:-40px;font-size:36px;transform:translateX(-50%);opacity:0}
.tank .drop.float{animation:float2 1s ease-out forwards}
.tank .drop.sink{animation:sink 1s ease-in forwards}
@keyframes float2{0%{top:-40px;opacity:1}60%{top:30%}80%{top:12%}100%{top:16%;opacity:1}}
@keyframes sink{0%{top:-40px;opacity:1}40%{top:20%}100%{top:66%;opacity:1}}
.magstage{position:relative;height:96px;margin:0 auto 10px;width:min(260px,85%);border-radius:18px;background:#f4f0ff}
.magstage .bigmag{position:absolute;left:50%;top:6px;transform:translateX(-50%) rotate(180deg);font-size:44px}
.magstage .drop{top:70px}
.magstage .drop.stick{animation:stick .8s cubic-bezier(.3,1.6,.5,1) forwards}
.magstage .drop.fall{animation:mfall .8s ease forwards}
@keyframes stick{0%{top:70px;opacity:1}100%{top:40px;opacity:1}}
@keyframes mfall{0%{top:62px;opacity:1}40%{top:56px}100%{top:66px;opacity:1;transform:translateX(30%) rotate(30deg)}}
/* ordering */
.slots{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px;margin:4px 0 12px}
.slot{width:52px;height:52px;border-radius:14px;border:3px dashed #b9cdee;display:grid;place-items:center;font-weight:900;color:#9fb0cf;font-size:18px}
.slot.on{border-style:solid;border-color:#33c46b;background:#e3fbea;font-size:30px;animation:pop .3s}
.slot .svgi{width:40px;height:40px}
.arr{font-style:normal;font-weight:900;color:#9fb0cf}
.tiles2{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.tl{border:0;border-radius:18px;background:#f1f6ff;box-shadow:0 4px 0 #cfdcf2;min-height:92px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:900}
.tl .ic{font-size:36px;line-height:1}
.tl .svgi{width:44px;height:44px}
.tl b{font-size:14px;line-height:1.25}
.tl.placed{opacity:.3;transform:scale(.94)}
.tl.hinted{box-shadow:0 0 0 4px #ffc83d,0 4px 0 #cfdcf2;animation:pulse 1s infinite}
/* pick all */
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px}
.pk{border:3px solid transparent;border-radius:18px;background:#f1f6ff;box-shadow:0 4px 0 #cfdcf2;min-height:88px;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:900}
.pk .ic{font-size:34px}
.pk b{font-size:14px}
.pk[aria-pressed="true"]{border-color:var(--brand);background:#e1efff}
.pk.right{border-color:#33c46b;background:#e3fbea}
.pk.wrong{border-color:#ff5a6a;background:#ffe8ec}
.pk.dim{opacity:.45}
.pk.hinted{box-shadow:0 0 0 4px #ffc83d}
/* riddle */
.clues{margin:0 0 10px;padding:0 0 0 24px;font-weight:800;font-size:16.5px;line-height:1.5}
.clues li{margin:4px 0;animation:popIn .3s}
.clues li.hid{display:none}
/* labs: shared */
.simwrap{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 0 0 3px #dbe7f7;background:#eaf4ff;max-width:520px;margin:0 auto}
.simwrap.sq{max-width:340px;margin:0 auto}
.simsvg{display:block;width:100%;height:auto;touch-action:none;-webkit-user-select:none;user-select:none}
.dragtip{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:rgba(20,30,60,.72);color:#fff;font-weight:900;font-size:13px;border-radius:99px;padding:4px 12px;pointer-events:none;animation:pulse 1.6s infinite;transition:opacity .3s}
.dragtip.gone{opacity:0}
.simmsg{min-height:0;font-weight:900;font-size:15px;color:#b15a00;text-align:center;margin:8px 0 0;opacity:0;transition:opacity .2s}
.simmsg.show{opacity:1;min-height:22px}
.simrow{display:flex;justify-content:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.simrow .btn{min-width:160px}
.gauge{text-align:center;font-weight:800;font-size:13.5px;color:var(--muted);margin-top:6px}
.gauge b{color:var(--ink)}
.spk{position:absolute;font-size:24px;pointer-events:none;animation:spk .9s ease-out forwards;z-index:5}
@keyframes spk{0%{opacity:0;transform:scale(.3)}30%{opacity:1;transform:scale(1.3)}100%{opacity:0;transform:translateY(-30px) scale(1)}}
/* silhouette */
.silwall{position:relative;height:170px;border-radius:18px;background:radial-gradient(circle at 50% 50%,#fffbe0 0,#ffe9a8 45%,#c9a96a 100%);display:grid;place-items:center;overflow:hidden;margin-bottom:12px;box-shadow:inset 0 0 30px rgba(120,80,20,.35)}
.silwall .torchi{position:absolute;left:10px;bottom:8px;font-size:34px;transform:rotate(-30deg)}
.sil{font-size:120px;line-height:1;filter:brightness(0) opacity(.82);transition:filter .6s}
.sil.flip{transform:scaleX(-1) rotate(-12deg)}
.sil.reveal{filter:none}
/* race */
.race{display:grid;gap:8px}
.lane{display:flex;align-items:center;gap:10px;border:3px solid transparent;border-radius:18px;background:#f1f6ff;box-shadow:0 4px 0 #cfdcf2;padding:8px 10px;text-align:left;min-height:64px}
.lane .ln{flex:0 0 112px;display:flex;align-items:center;gap:6px;font-weight:900;font-size:13.5px;line-height:1.2}
.lane .ln .ic{font-size:28px;line-height:1}
.lane .track{position:relative;flex:1;height:40px;border-radius:12px;background:repeating-linear-gradient(90deg,#fff 0 18px,#e7eefb 18px 36px)}
.lane .rc{--p:0;position:absolute;top:50%;left:calc(var(--p)*(100% - 40px));transform:translateY(-50%);font-size:32px;line-height:1;transition:none}
.race.shrink .rc{left:calc(50% - 20px);transform-origin:50% 60%}
.race.shrink .rc.gone{opacity:0!important}
.lane .fin{position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:18px;opacity:.7}
.race.shrink .fin{display:none}
.race.fall{grid-template-columns:repeat(auto-fit,minmax(90px,1fr))}
.race.fall .lane{flex-direction:column;align-items:center;text-align:center;padding:8px 6px}
.race.fall .lane .ln{flex:0 0 auto;flex-direction:column}
.race.fall .lane .track{width:46px;flex:0 0 150px;background:linear-gradient(#eaf4ff,#d9ecff 92%,#8fd16a 92%)}
.race.fall .lane .rc{left:50%;top:calc(4px + var(--p)*(100% - 44px));transform:translateX(-50%)}
.race.fall .fin{display:none}
.lane.mine{border-color:var(--brand);background:#e1efff}
.lane.winner{border-color:#ffc83d;background:#fff8d6;box-shadow:0 0 0 3px #ffc83d,0 4px 0 #e0b22a}
.lane.winner .ln::after{content:"🏆";font-size:22px}
/* magnets */
.magrow{display:flex;justify-content:center;align-items:center;flex-wrap:nowrap;padding:22px 4px;background:#f4f0ff;border-radius:18px;overflow:hidden}
.mag{position:relative;display:flex;width:clamp(64px,18vw,96px);height:46px;border:0;padding:0;border-radius:10px;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.2);margin-left:18px;transition:margin .45s cubic-bezier(.3,1.5,.5,1)}
.mag:first-child{margin-left:0}
.mag span{flex:1;display:grid;place-items:center;font-weight:900;font-size:20px;color:#fff}
.mag .n{background:linear-gradient(180deg,#ff6b6b,#e2333f)}
.mag .s{background:linear-gradient(180deg,#5aa0ff,#2c64d6)}
.mag.flip{flex-direction:row-reverse}
.mag.spin{animation:mspin .4s}
.mag.wig{animation:shake .4s}
.mag em{position:absolute;top:-2px;right:2px;font-style:normal;font-size:13px}
.mag.locked{box-shadow:0 4px 0 rgba(0,0,0,.2),0 0 0 3px #ffc83d}
.mag.stuck{margin-left:0}
.mag.push{margin-left:46px}
@keyframes mspin{50%{transform:rotateY(90deg)}}
/* thermometer */
.thermo-wrap{display:flex;align-items:center;justify-content:center;gap:4px;background:#f3f8ff;border-radius:18px;padding:6px 8px;margin-bottom:10px}
.thermo-wrap .thermo{width:min(230px,58vw)}
.tside{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:90px}
.tside .scene{font-size:44px}
.tside .tv{font-size:28px;font-weight:900;color:#c0283a}
/* thunder */
.storm{position:relative;border-radius:18px;overflow:hidden}
.storm.shake{animation:shake .5s 2}
.storm .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .08s}
.storm .flash.on{opacity:.85}
.counter{position:absolute;right:12px;top:10px;background:rgba(255,255,255,.92);border-radius:16px;padding:4px 14px;text-align:center;font-weight:900}
.counter b{display:block;font-size:34px;line-height:1.1;color:#24305e}
.counter small{font-size:12px;color:var(--muted)}
/* sound */
.instr{display:flex;justify-content:center;align-items:flex-end;gap:10px;background:#f3f8ff;border-radius:18px;padding:12px 8px}
.ins{position:relative;border:3px solid transparent;border-radius:16px;background:#fff;box-shadow:0 4px 0 #cfdcf2;width:72px;padding:6px 4px 22px}
.ins svg{width:100%;height:auto;display:block}
.instr.drum .ins{width:84px}
.ins .num{position:absolute;left:50%;bottom:3px;transform:translateX(-50%);font-weight:900;font-size:13px;color:var(--muted)}
.ins.sel{border-color:var(--brand);background:#e1efff}
.ins.right{border-color:#33c46b;background:#e3fbea}
.ins.wrong{border-color:#ff5a6a;background:#ffe8ec}
.ins.buzz svg{animation:buzz .35s}
@keyframes buzz{20%{transform:translateX(-2px)}40%{transform:translateX(2px)}60%{transform:translateX(-2px)}80%{transform:translateX(1px)}}
/* hand washing */
.sink{background:linear-gradient(#e8f6ff,#cfeaff);border-radius:18px;padding:10px}
.hands{position:relative;height:170px;display:grid;place-items:center;font-size:120px;line-height:1;border-radius:14px;touch-action:none;cursor:grab;transition:filter .4s}
.hands.wet{filter:saturate(1.2) brightness(1.05)}
.hands .germ{position:absolute;font-size:28px;transition:opacity .3s}
.hands .foam{position:absolute;inset:10% 15%;border-radius:50%;background:radial-gradient(circle at 30% 40%,#fff 0 12%,transparent 13%),radial-gradient(circle at 60% 30%,#fff 0 10%,transparent 11%),radial-gradient(circle at 70% 65%,#fff 0 14%,transparent 15%),radial-gradient(circle at 35% 70%,#fff 0 11%,transparent 12%);opacity:0;pointer-events:none}
.hands:not(.soapy) .foam{opacity:0!important}
.hands.clean{filter:drop-shadow(0 0 12px #fff)}
.sbar{position:relative;height:24px;border-radius:99px;background:#fff;overflow:hidden;margin-top:8px}
.sbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7cf3ff,#33c46b)}
.sbar b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px}

const CARD_RAW=[
 // ---------------------------------------------------------------- 0 Compass Camp
 ['dir4',0,1,'🧭','동서남북|The four directions','기본 방향은 북·동·남·서 4가지예요. 지도에서는 보통 위가 북쪽, 오른쪽이 동쪽, 아래가 남쪽, 왼쪽이 서쪽이에요.|The four main directions are north, east, south and west. On most maps north is at the top, east on the right, south at the bottom and west on the left.','북쪽을 보고 서면 오른손 쪽이 동쪽이에요!|Face north and your right hand points east!'],
 ['sunrise',0,1,'🌅','해는 동쪽에서 떠요|The Sun rises in the east','해는 아침에 동쪽에서 떠서, 한낮에는 남쪽 하늘 높이 있다가, 저녁에 서쪽으로 져요.|The Sun rises in the east in the morning, is high in the southern sky at midday, and sets in the west in the evening.','아침 햇살이 들어오는 창문은 동쪽 창문이에요.|The window that gets morning sunshine faces east.'],
 ['compass',0,1,'🧭','나침반|The compass','나침반 바늘의 빨간 끝(N)은 언제나 북쪽을 가리켜요. 나침반을 돌려도 바늘은 다시 북쪽을 봐요.|The red end (N) of a compass needle always points north. Even if you turn the compass, the needle swings back to north.','캠핑이나 등산을 할 때 나침반이 있으면 길을 잃지 않아요.|A compass helps you stay on track when camping or hiking.'],
 ['leftright',0,1,'↔️','왼쪽·오른쪽과 동서남북|Left/right vs. compass directions','왼쪽·오른쪽은 내가 몸을 돌리면 바뀌지만, 동서남북은 내가 돌아도 바뀌지 않아요.|Left and right change when you turn around, but north, east, south and west stay the same.','길을 알려줄 때 “북쪽으로 두 블록”이라고 하면 누구에게나 똑같이 통해요.|“Two blocks north” means the same thing to everyone.'],
 ['mapread',0,1,'🗺️','지도 읽기|Reading a map','지도는 하늘 위에서 내려다본 그림이에요. 방위표(N 화살표)와 그림 기호를 보면 길을 찾을 수 있어요.|A map is a picture of a place seen from above. The north arrow and the symbols help you find your way.','공원 안내판 지도에서 “현재 위치”부터 찾아봐요.|On a park map, find the “You are here” spot first.'],
 ['dir8',0,2,'✳️','8방위|Eight directions','북과 동 사이는 북동, 남과 서 사이는 남서처럼 사이 방향도 있어요. 모두 합치면 8방위예요.|Between north and east is northeast, between south and west is southwest, and so on. Together they make eight directions.','일기예보에서 “북서풍”이라고 하면 북서쪽에서 부는 바람이에요.|A “northwest wind” blows from the northwest.'],
 ['noonshadow',0,2,'🕛','한낮 그림자는 북쪽|Noon shadows point north','캐나다나 한국 같은 북쪽 나라에서는 한낮에 해가 남쪽 하늘에 있어서 그림자가 북쪽을 가리켜요.|In northern countries like Canada and Korea, the midday Sun is in the southern sky, so shadows point north.','나침반이 없을 때 한낮의 막대 그림자로 북쪽을 찾을 수 있어요.|No compass? A stick’s shadow at midday points north.'],
 ['magnetearth',0,2,'🌏','지구는 커다란 자석|Earth is a giant magnet','지구는 커다란 자석 같아서 작은 자석인 나침반 바늘이 북쪽을 가리켜요. 가까이에 자석이나 쇠가 있으면 바늘이 엉뚱한 곳을 가리킬 수 있어요.|Earth acts like a giant magnet, so the little magnet in a compass points north. A magnet or iron nearby can make the needle point the wrong way.','나침반은 휴대폰, 스피커, 쇠붙이에서 떨어뜨려서 써요.|Keep a compass away from phones, speakers and metal.'],
 ['polaris',0,3,'⭐','북극성|The North Star','북극성은 밤새 거의 움직이지 않고 북쪽 하늘에 있어요. 옛날 사람들은 북극성을 보고 길을 찾았어요.|The North Star (Polaris) stays almost still in the northern sky all night. Long ago, travelers used it to find their way.','국자 모양의 북두칠성을 찾으면 북극성을 찾기 쉬워요.|Find the Big Dipper first; it points to the North Star.'],
 ['moss',0,2,'🌿','이끼 방향은 믿지 마요|Don’t trust the moss','“이끼는 나무 북쪽에만 자란다”는 말은 믿을 수 없어요. 이끼는 그늘지고 축축하면 어느 쪽에나 자라요.|“Moss only grows on the north side of trees” is not true. Moss grows on any side that is shady and damp.','길을 찾을 땐 이끼 말고 나침반, 해, 지도를 써요.|To find your way, use a compass, the Sun or a map, not moss.'],
 // ---------------------------------------------------------------- 1 Shadow Park
 ['shform',1,1,'👤','그림자가 생기는 이유|How shadows form','빛은 곧게 나아가요. 물체가 빛을 막으면 그 뒤쪽은 빛이 닿지 않아 어두워져요. 그게 그림자예요.|Light travels in straight lines. When an object blocks the light, the area behind it gets no light. That dark area is a shadow.','손전등 빛을 손으로 막아 벽에 그림자 동물을 만들어 봐요.|Block a flashlight with your hands to make shadow animals on the wall.'],
 ['shopp',1,1,'↔️','그림자는 빛의 반대쪽|Shadows fall opposite the light','그림자는 언제나 빛이 오는 쪽의 반대쪽에 생겨요. 빛이 왼쪽에서 오면 그림자는 오른쪽!|A shadow always falls on the side away from the light. Light from the left makes a shadow on the right!','해를 등지고 서면 내 그림자가 내 앞에 생겨요.|Stand with your back to the Sun and your shadow is in front of you.'],
 ['shnear',1,1,'🔦','빛과 가까우면 커져요|Closer to the light, bigger shadow','물체를 손전등에 가까이 하면 벽의 그림자가 커지고, 멀리 하면 작아져요.|Move an object closer to the flashlight and its shadow on the wall grows. Move it away and the shadow shrinks.','그림자 연극에서 괴물을 크게 만들고 싶으면 인형을 빛 쪽으로!|In a shadow play, move the puppet toward the light to make a giant monster!'],
 ['shlow',1,1,'📏','빛이 낮으면 길어져요|Low light, long shadow','빛이 낮게 비추면 그림자가 길어지고, 머리 위에서 비추면 짧아져요.|When light shines from low down, shadows get long. When it shines from overhead, shadows get short.','아침·저녁 그림자는 키다리, 한낮 그림자는 땅꼬마!|Morning and evening shadows are tall; midday shadows are tiny!'],
 ['shsun',1,2,'🕐','하루 동안 바뀌는 그림자|Shadows change during the day','해가 하늘을 지나가면 그림자도 움직여요. 아침에는 서쪽으로 길게, 한낮에는 짧게, 저녁에는 동쪽으로 길게 생겨요.|As the Sun crosses the sky, shadows move. They are long toward the west in the morning, short at midday and long toward the east in the evening.','옛날 사람들은 그림자로 시간을 재는 해시계를 썼어요.|Long ago, people told time with shadows on a sundial.'],
 ['shtrans',1,1,'🪟','투명·반투명·불투명|Clear, cloudy and solid','유리처럼 빛이 잘 통과하면 그림자가 거의 없고, 기름종이처럼 조금 통과하면 흐린 그림자, 나무처럼 막으면 진한 그림자가 생겨요.|Clear things like glass let light through, so they make almost no shadow. Cloudy things like wax paper make a faint shadow. Solid things like wood make a dark shadow.','두꺼운 커튼을 치면 방이 어두워지는 것도 빛을 막기 때문이에요.|Thick curtains make a room dark because they block the light.'],
 ['shshape',1,1,'⭐','그림자 모양|Shadow shapes','그림자는 물체의 테두리 모양을 닮아요. 하지만 물체를 돌리거나 빛의 방향이 바뀌면 그림자 모양도 바뀌어요.|A shadow has the outline shape of the object. Turn the object or move the light and the shadow’s shape changes.','손 모양을 바꾸면 강아지, 새, 토끼 그림자를 만들 수 있어요.|Change your hand shape to make a dog, a bird or a bunny shadow.'],
 ['straight',1,2,'➡️','빛은 곧게 나아가요|Light travels straight','빛은 휘지 않고 똑바로 나아가요. 그래서 벽 뒤에 숨으면 빛이 닿지 않아요.|Light does not bend around corners; it goes straight. That is why light can’t reach you behind a wall.','커튼 틈으로 들어온 햇빛이 곧은 줄처럼 보여요.|Sunlight through a gap in the curtains looks like a straight beam.'],
 ['mirror',1,2,'🪞','빛의 반사|Light bounces','거울은 빛을 튕겨 보내요(반사). 우리가 물건을 보는 것도 물건에 튕긴 빛이 눈에 들어오기 때문이에요.|A mirror bounces light back (reflection). We see things because light bounces off them into our eyes.','깜깜한 방에서는 아무것도 안 보여요. 빛이 있어야 볼 수 있어요.|In a pitch-dark room you can’t see anything. We need light to see.'],
 ['glow',1,1,'💡','스스로 빛나는 것|Things that make light','해, 불, 전구, 반딧불이는 스스로 빛을 내요. 달과 거울은 스스로 빛나지 않고 다른 빛을 반사해요.|The Sun, fire, light bulbs and fireflies make their own light. The Moon and mirrors don’t; they reflect other light.','자전거 반사판도 스스로 빛나지 않고 자동차 불빛을 반사해서 반짝여요.|A bike reflector doesn’t glow by itself; it reflects car headlights.'],
 // ---------------------------------------------------------------- 2 Zoom Bus Road
 ['pushpull',2,1,'👐','밀기와 당기기|Push and pull','물체를 움직이려면 밀거나 당겨야 해요. 이렇게 물체를 움직이는 것을 “힘”이라고 해요. 세게 밀수록 더 빨리, 더 멀리 가요.|To move something you push or pull it. That push or pull is called a force. A bigger push makes it go faster and farther.','문을 열 때, 그네를 밀 때, 썰매를 끌 때 모두 힘을 써요.|Opening a door, pushing a swing and pulling a sled all use forces.'],
 ['inertia',2,1,'🚌','급정거하면 앞으로!|Sudden stop: you lurch forward','움직이던 물체는 계속 움직이려고 해요(관성). 버스가 갑자기 멈추면 몸은 계속 앞으로 가려다 앞으로 쏠려요.|Moving things keep moving (this is called inertia). When a bus stops suddenly, your body keeps going and lurches forward.','버스에서 서 있을 때는 손잡이를 꼭 잡아요.|Hold on to a handle when you stand on a bus.'],
 ['inertia2',2,1,'🚦','갑자기 출발하면 뒤로!|Sudden start: you lean back','멈춰 있던 물체는 계속 멈춰 있으려고 해요. 버스가 갑자기 출발하면 몸이 제자리에 남으려 해서 뒤로 쏠려요.|Still things like to stay still. When a bus starts suddenly, your body wants to stay put, so you lean backward.','버스가 출발할 때는 자리에 앉아 있거나 손잡이를 잡아요.|Sit down or hold on when the bus pulls away.'],
 ['seatbelt',2,1,'🦺','안전벨트|Seat belts','차가 갑자기 멈춰도 몸은 계속 앞으로 가려고 해요. 안전벨트가 몸을 꽉 잡아 줘서 다치지 않아요.|When a car stops suddenly, your body keeps moving forward. A seat belt holds you in place so you don’t get hurt.','가까운 곳에 갈 때도 차에 타면 바로 안전벨트! 어린이는 부스터 시트도 써요.|Buckle up for every ride, even short ones. Kids use booster seats too.'],
 ['friction',2,1,'🧊','마찰력|Friction','두 물체가 비벼질 때 움직임을 방해하는 힘이 마찰력이에요. 거친 곳은 마찰이 커서 덜 미끄럽고, 얼음처럼 매끈한 곳은 잘 미끄러워요.|Friction is a force that slows things down when two surfaces rub together. Rough surfaces have lots of friction; smooth ice has very little.','겨울에 얼음길에 모래를 뿌리면 덜 미끄러워요. 손을 비비면 따뜻해지는 것도 마찰 때문!|Sand on icy sidewalks stops slipping. Rubbing your hands warms them up: that’s friction too!'],
 ['gravity',2,1,'🍎','중력|Gravity','지구는 모든 물체를 아래로 끌어당겨요. 그래서 공을 위로 던져도 다시 떨어져요.|Earth pulls everything down toward it. That is why a ball you throw up always comes back down.','미끄럼틀을 슝 내려올 수 있는 것도 중력 덕분이에요.|Gravity is what pulls you down the slide!'],
 ['slope',2,2,'🛷','비탈이 가파를수록 빨라요|Steeper slopes are faster','비탈이 가파를수록 굴러 내려가는 물체가 더 빨라져요. 공처럼 둥근 것은 잘 구르고, 네모난 상자는 잘 안 굴러요.|The steeper the slope, the faster things roll down. Round things like balls roll easily; boxes don’t.','썰매는 가파른 언덕에서 더 씽씽 달려요. 너무 가파른 곳은 위험해요!|Sleds go faster on steep hills. Too steep is dangerous!'],
 ['stopdist',2,1,'🚗','차는 바로 못 멈춰요|Cars can’t stop instantly','빠르게 달리던 차는 브레이크를 밟아도 한참 더 가서 멈춰요. 비나 눈이 오면 더 길어져요.|A fast car keeps going for a while even after the driver brakes. On rain or snow it takes even longer.','길을 건너기 전에는 멈추고, 차가 완전히 섰는지 양쪽을 살펴요.|Before you cross, stop and look both ways until cars have fully stopped.'],
 ['seesaw',2,2,'⚖️','시소의 균형|Balancing a seesaw','무거운 쪽은 가운데 가까이, 가벼운 쪽은 끝에 앉으면 시소가 균형을 이뤄요. 무게 × 가운데까지의 거리가 같으면 균형!|To balance a seesaw, the heavier person sits closer to the middle and the lighter person sits near the end. When weight × distance is the same on both sides, it balances!','아빠와 시소를 탈 때는 아빠가 가운데 쪽으로 앉아야 해요.|When you ride with a grown-up, they should sit closer to the middle.'],
 ['airres',2,2,'🪂','공기 저항|Air resistance','공기도 움직임을 방해해요. 낙하산이나 펼친 종이는 천천히, 뭉친 종이는 빨리 떨어져요. 크기와 모양이 같으면 무거워도 가벼워도 거의 함께 떨어져요.|Air pushes back on moving things. Parachutes and flat paper fall slowly, while crumpled paper falls fast. Objects of the same size and shape fall at almost the same speed, heavy or light.','민들레 씨앗은 솜털 낙하산으로 바람을 타고 멀리 날아가요.|Dandelion seeds float far away on tiny fluffy parachutes.'],
 // ---------------------------------------------------------------- 3 Magnet Factory
 ['magiron',3,1,'🧲','자석에 붙는 것|What magnets pick up','자석은 철(쇠)로 된 물건을 끌어당겨요. 클립, 쇠못, 옷핀은 붙고, 나무, 종이, 플라스틱, 유리는 안 붙어요.|Magnets pull things made of iron or steel. Paper clips, nails and safety pins stick; wood, paper, plastic and glass don’t.','냉장고 자석이 붙는 건 냉장고 문이 철로 만들어졌기 때문이에요.|Fridge magnets stick because the fridge door is made of steel.'],
 ['magmetal',3,2,'🥫','모든 금속이 붙지는 않아요|Not every metal sticks','알루미늄 캔, 구리, 금반지는 금속이지만 자석에 붙지 않아요. 자석은 주로 철로 된 것을 끌어당겨요.|Aluminum cans, copper and gold rings are metals, but magnets don’t pull them. Magnets mostly pull iron and steel.','재활용 공장에서는 큰 자석으로 철 캔만 골라내요.|Recycling plants use giant magnets to pull out steel cans.'],
 ['poles',3,1,'🧲','N극과 S극|North and south poles','자석에는 N극과 S극이 있어요. 다른 극끼리는 붙고(N–S), 같은 극끼리는 밀어내요(N–N, S–S).|Every magnet has a north (N) and a south (S) pole. Opposite poles pull together (N–S); the same poles push apart (N–N, S–S).','자석 기차 장난감이 붙거나 밀리는 것도 이 원리예요.|Magnetic toy trains snap together or push apart because of poles.'],
 ['magthrough',3,1,'📄','자석의 힘은 통과해요|Magnet force goes through things','자석의 힘은 종이, 물, 유리, 얇은 플라스틱을 통과해요. 종이 아래에서 자석을 움직이면 위의 클립도 따라 움직여요.|A magnet’s pull goes through paper, water, glass and thin plastic. Move a magnet under paper and a clip on top follows it.','냉장고 자석이 그림 종이를 붙잡아 두는 것도 이 덕분이에요.|That’s how a fridge magnet holds a drawing in place.'],
 ['magend',3,2,'💪','양 끝이 가장 세요|The ends are strongest','막대자석은 가운데보다 양 끝(극)의 힘이 가장 세요. 클립도 양 끝에 많이 붙어요.|A bar magnet pulls hardest at its two ends (the poles), not in the middle. Most clips stick to the ends.','자석 낚시 놀이를 할 때는 자석 끝을 물고기에 대 봐요.|In a magnet fishing game, use the end of the magnet.'],
 ['float',3,1,'🛟','뜨는 것, 가라앉는 것|Float or sink','나무, 코르크, 공기가 든 공은 물에 뜨고, 돌, 동전, 쇠 숟가락은 가라앉아요.|Wood, cork and balls full of air float. Stones, coins and metal spoons sink.','목욕할 때 장난감이 뜨는지 가라앉는지 실험해 봐요.|Test your bath toys: which float and which sink?'],
 ['heatcond',3,2,'🥄','열이 잘 통하는 금속|Metal carries heat','금속은 열을 잘 전해서, 뜨거운 국에 넣은 쇠 숟가락은 금방 뜨거워져요. 나무와 플라스틱은 열이 잘 안 통해요.|Metal passes heat along quickly, so a metal spoon in hot soup gets hot fast. Wood and plastic don’t pass heat well.','그래서 냄비 손잡이는 플라스틱이나 나무로 만들어요. 뜨거운 냄비는 오븐 장갑으로!|That’s why pot handles are plastic or wood. Use oven mitts for hot pots!'],
 ['material',3,1,'🧱','물질의 쓰임|Materials have jobs','유리는 투명해서 창문, 고무는 잘 늘어나서 고무줄, 쇠는 단단해서 못, 천은 부드러워서 옷을 만들어요.|Glass is clear, so we make windows. Rubber stretches, so we make rubber bands. Metal is strong, so we make nails. Cloth is soft, so we make clothes.','우비는 물이 스며들지 않는 재료로 만들어요.|Raincoats are made of materials that keep water out.'],
 ['recycle',3,1,'♻️','분리배출|Sorting recycling','종이, 플라스틱, 캔, 유리를 나눠서 버리면 다시 새 물건으로 만들 수 있어요. 음식물 쓰레기는 퇴비가 돼요.|When we sort paper, plastic, cans and glass, they can be made into new things. Food scraps can become compost.','병과 캔은 물로 헹군 다음 분리해서 버려요.|Rinse bottles and cans before you put them in the recycling.'],
 ['electric',3,2,'⚡','전기는 조심!|Be careful with electricity','금속과 물은 전기가 잘 통해요. 젖은 손으로 콘센트나 스위치를 만지면 감전될 수 있어요.|Electricity travels easily through metal and water. Touching plugs or switches with wet hands can give you a shock.','콘센트에는 절대 젓가락이나 핀을 넣지 마요.|Never put chopsticks, pins or anything else into an outlet.'],
 // ---------------------------------------------------------------- 4 Kitchen Lab
 ['states',4,1,'🧊','고체·액체·기체|Solid, liquid, gas','얼음처럼 모양이 일정한 것은 고체, 물처럼 흘러서 그릇 모양이 되는 것은 액체, 수증기나 공기처럼 퍼져 나가는 것은 기체예요.|Things that keep their shape, like ice, are solids. Things that flow and take the shape of their container, like water, are liquids. Things that spread out to fill a space, like steam and air, are gases.','주스는 액체, 컵은 고체, 풍선 속 공기는 기체!|Juice is a liquid, the cup is a solid and the air in a balloon is a gas!'],
 ['melt',4,1,'🍦','녹기|Melting','고체가 열을 받으면 액체가 돼요. 얼음은 녹아서 물이 되고, 초콜릿은 손에서 녹아요.|When a solid warms up, it can melt into a liquid. Ice melts into water and chocolate melts in your hand.','아이스크림은 햇볕 아래에서 빨리 녹으니 그늘에서 먹어요.|Ice cream melts fast in the sun, so eat it in the shade.'],
 ['freeze',4,1,'❄️','얼기|Freezing','물은 0°C보다 차가워지면 얼음이 돼요. 캐나다의 겨울에는 호수도 꽁꽁 얼어요.|Water turns to ice when it gets colder than 0°C. In a Canadian winter, even lakes freeze solid.','물은 얼면 부피가 커져서, 물을 꽉 채운 유리병을 얼리면 깨질 수 있어요.|Water grows bigger when it freezes, so a full glass bottle in the freezer can crack.'],
 ['boil',4,1,'♨️','끓기|Boiling','물은 100°C가 되면 보글보글 끓으며 수증기(기체)로 변해요.|Water bubbles and boils at 100°C, turning into water vapor (a gas).','끓는 물과 김은 아주 뜨거우니 가까이 가지 마요.|Boiling water and steam are very hot. Stay back!'],
 ['evap',4,2,'💨','증발|Evaporation','물은 끓지 않아도 조금씩 수증기가 되어 날아가요. 그래서 물웅덩이가 마르고 빨래가 말라요. 햇볕이 쨍하고 바람이 불면 더 빨리 말라요.|Water slowly turns into vapor even without boiling. That’s how puddles dry up and laundry dries. Sun and wind make it happen faster.','젖은 수건은 펼쳐서 널어야 빨리 말라요.|Spread out a wet towel and it dries faster.'],
 ['condense',4,2,'💧','응결|Condensation','공기 속 수증기가 차가운 것에 닿으면 다시 물방울이 돼요. 차가운 컵 겉의 물방울, 샤워 후 뿌연 거울, 겨울 입김이 모두 그래요.|When water vapor in the air touches something cold, it turns back into water drops. Drops on a cold cup, a foggy bathroom mirror and your breath on a winter day are all condensation.','차가운 음료 컵 밑에는 받침을 깔아요.|Put a coaster under a cold drink.'],
 ['dissolve',4,1,'🍬','녹아서 섞이기(용해)|Dissolving','설탕이나 소금은 물에 녹아서 안 보이게 섞여요. 모래는 녹지 않아요. 따뜻한 물에서, 저어 주면 더 빨리 녹아요.|Sugar and salt dissolve in water and disappear from sight. Sand doesn’t dissolve. Warm water and stirring make things dissolve faster.','코코아 가루는 따뜻한 우유에 넣고 저어야 잘 녹아요.|Stir cocoa powder into warm milk so it dissolves well.'],
 ['thermo',4,1,'🌡️','온도계|Thermometers','온도계를 보면 얼마나 뜨겁고 차가운지 숫자로 알 수 있어요. 단위는 °C(섭씨)예요. 0°C보다 낮으면 영하예요.|A thermometer tells us how hot or cold something is with a number. We measure in °C (degrees Celsius). Below 0°C is “below zero”.','일기예보의 −10°C는 영하 10도, 꽁꽁 언 날씨예요.|−10°C in the forecast means ten below zero: freezing cold!'],
 ['heatflow',4,2,'🔥','열은 뜨거운 데서 차가운 데로|Heat moves from hot to cold','열은 언제나 뜨거운 쪽에서 차가운 쪽으로 이동해요. 그래서 뜨거운 코코아는 식고, 얼음을 넣은 음료는 시원해져요.|Heat always moves from something hot to something colder. That’s why hot cocoa cools down and ice cools a drink.','두꺼운 옷이나 수건은 열이 빠져나가는 걸 막아 줘요.|Thick clothes and towels slow heat from escaping.'],
 ['fridge',4,1,'🥛','냉장고의 비밀|Why we use a fridge','세균은 따뜻한 곳에서 빨리 늘어나요. 음식을 차갑게 두면 덜 상해요.|Germs grow fast where it’s warm. Keeping food cold helps it stay fresh.','우유와 남은 음식은 바로 냉장고에 넣어요.|Put milk and leftovers back in the fridge right away.'],
 // ---------------------------------------------------------------- 5 Green Forest
 ['plantneeds',5,1,'🌱','식물에게 필요한 것|What plants need','식물이 자라려면 햇빛, 물, 공기, 그리고 영양분이 있는 흙이 필요해요. 물이 너무 많아도 안 좋아요.|Plants need sunlight, water, air and soil with nutrients to grow. Too much water is bad, too.','화분은 햇빛 드는 창가에 두고, 흙이 마르면 물을 줘요.|Keep a plant by a sunny window and water it when the soil is dry.'],
 ['plantparts',5,1,'🌷','식물의 부분|Parts of a plant','뿌리는 물을 빨아들이고, 줄기는 물을 나르고, 잎은 햇빛으로 양분을 만들고, 꽃은 씨앗을 만들어요.|Roots soak up water, stems carry it, leaves make food from sunlight and flowers make seeds.','당근은 뿌리, 상추는 잎, 브로콜리는 꽃봉오리를 먹는 거예요!|A carrot is a root, lettuce is a leaf and broccoli is flower buds!'],
 ['lifecycle',5,1,'🦋','나비의 한살이|A butterfly’s life cycle','나비는 알 → 애벌레 → 번데기 → 나비로 자라요. 번데기 속에서 모습이 완전히 바뀌어요.|A butterfly grows from egg → caterpillar → chrysalis → butterfly. It changes completely inside the chrysalis.','봄·여름에 잎 뒷면을 살펴보면 작은 알이나 애벌레를 볼 수 있어요.|Look under leaves in spring and summer to spot tiny eggs or caterpillars.'],
 ['frog',5,1,'🐸','개구리의 한살이|A frog’s life cycle','개구리는 알 → 올챙이 → 다리가 난 올챙이 → 개구리로 자라요. 올챙이는 물속에서 아가미로 숨 쉬어요.|A frog grows from egg → tadpole → tadpole with legs → frog. Tadpoles breathe underwater with gills.','봄 연못의 젤리 같은 알 덩어리가 개구리 알이에요.|The jelly blobs in a spring pond are frog eggs.'],
 ['insect',5,1,'🐞','곤충|Insects','곤충은 다리가 6개이고 몸이 머리·가슴·배 3부분이에요. 거미는 다리가 8개라서 곤충이 아니에요.|Insects have 6 legs and 3 body parts: head, thorax and abdomen. Spiders have 8 legs, so they are not insects.','개미, 무당벌레, 벌, 나비, 메뚜기는 모두 곤충이에요.|Ants, ladybugs, bees, butterflies and grasshoppers are all insects.'],
 ['groups',5,2,'🐋','동물 무리|Animal groups','포유류는 털이 있고 새끼에게 젖을 먹여요(고래·박쥐도!). 새는 깃털과 부리가 있고 알을 낳아요. 물고기는 아가미로 숨 쉬어요.|Mammals have hair and feed their babies milk (whales and bats too!). Birds have feathers and beaks and lay eggs. Fish breathe with gills.','펭귄은 날지 못해도 깃털이 있는 새예요.|Penguins can’t fly, but they have feathers: they’re birds!'],
 ['foodchain',5,2,'🦊','먹이 사슬|Food chains','풀 → 토끼 → 여우처럼 먹고 먹히는 관계를 먹이 사슬이라고 해요. 모든 먹이 사슬은 햇빛을 받는 식물에서 시작해요.|Grass → rabbit → fox is a food chain: who eats whom. Every food chain starts with plants that use sunlight.','한 동물이 사라지면 먹이 사슬의 다른 동물도 힘들어져요.|If one animal disappears, others in the food chain have a hard time.'],
 ['eaters',5,2,'🦷','초식·육식·잡식|Plant-eaters and meat-eaters','풀을 먹는 동물은 초식동물(토끼, 사슴), 고기를 먹는 동물은 육식동물(늑대, 사자), 둘 다 먹으면 잡식동물(곰, 사람)이에요.|Animals that eat plants are herbivores (rabbits, deer). Meat-eaters are carnivores (wolves, lions). Animals that eat both are omnivores (bears, people).','우리도 채소와 고기를 골고루 먹는 잡식동물이에요.|We are omnivores too: we eat both veggies and meat.'],
 ['seasonlife',5,1,'🍁','계절과 생물|Seasons and living things','가을에는 단풍잎이 물들어 떨어지고, 캐나다 거위는 따뜻한 남쪽으로 날아가요. 곰은 겨울잠을 자요.|In fall, leaves change color and drop, and Canada geese fly south to warmer places. Bears sleep through the winter.','이른 봄에는 단풍나무 수액을 모아 메이플 시럽을 만들어요.|In early spring, maple sap is collected to make maple syrup.'],
 ['decomp',5,2,'🍄','자연의 재활용꾼|Nature’s recyclers','지렁이와 버섯은 죽은 잎과 음식 찌꺼기를 잘게 분해해서 기름진 흙으로 만들어요.|Worms and mushrooms break down dead leaves and food scraps into rich soil.','음식물 쓰레기로 퇴비를 만들면 텃밭 흙이 좋아져요.|Compost made from food scraps makes garden soil healthy.'],
 // ---------------------------------------------------------------- 6 Sky Station
 ['daynight',6,1,'🌍','낮과 밤|Day and night','지구는 팽이처럼 하루에 한 바퀴 돌아요(자전). 해를 바라보는 쪽은 낮, 반대쪽은 밤이에요.|Earth spins like a top, once every day. The side facing the Sun has day; the other side has night.','한국이 낮일 때 캐나다는 밤이에요. 할머니 할아버지께 전화할 때 시간을 확인해요!|When it’s daytime in Korea, it’s night in Canada. Check the time before you call family far away!'],
 ['sunstar',6,1,'☀️','해는 별이에요|The Sun is a star','해(태양)는 스스로 빛과 열을 내는 아주 큰 별이에요. 가장 가까운 별이라서 크고 밝게 보여요.|The Sun is a huge star that makes its own light and heat. It looks big and bright because it’s the closest star to us.','해를 맨눈으로 똑바로 보면 눈을 다쳐요. 절대 보지 마요!|Never look straight at the Sun. It can hurt your eyes!'],
 ['moonphase',6,2,'🌙','달의 모양 변화|Moon phases','달은 스스로 빛나지 않고 햇빛을 반사해요. 약 한 달 동안 초승달 → 반달 → 보름달 → 반달 → 그믐달로 모양이 바뀌어 보여요.|The Moon doesn’t make light; it reflects sunlight. Over about a month it seems to change from crescent → half → full → half → crescent.','오늘 밤 달 모양을 그려 두고 일주일 뒤와 비교해 봐요.|Draw tonight’s Moon and compare it with the Moon a week later.'],
 ['watercycle',6,2,'🔄','물의 여행|The water cycle','바다와 강의 물이 증발해 수증기가 되고, 하늘에서 식어 구름이 되고, 비나 눈으로 내려 다시 강과 바다로 가요.|Water from oceans and rivers evaporates into vapor, cools into clouds, falls as rain or snow and flows back to rivers and oceans.','오늘 마신 물도 예전에는 구름이었을지 몰라요!|The water you drank today may once have been a cloud!'],
 ['clouds',6,1,'☁️','구름과 비|Clouds and rain','구름은 아주 작은 물방울이나 얼음 알갱이가 모인 거예요. 물방울이 커지고 무거워지면 비나 눈이 되어 떨어져요.|Clouds are made of tiny water drops or ice crystals. When the drops grow big and heavy, they fall as rain or snow.','먹구름이 몰려오면 우산을 챙겨요.|When dark clouds roll in, grab an umbrella.'],
 ['rainbow',6,1,'🌈','무지개|Rainbows','햇빛 속에는 여러 색이 숨어 있어요. 비 온 뒤 해를 등지고 서면 물방울이 햇빛을 나눠서 무지개가 보여요(빨주노초파남보).|Sunlight hides many colors. After rain, stand with the Sun behind you and water drops split the light into a rainbow (red, orange, yellow, green, blue, indigo, violet).','맑은 날 해를 등지고 분무기를 뿌리면 작은 무지개를 만들 수 있어요.|On a sunny day, spray a mist with the Sun behind you to make a mini rainbow.'],
 ['thunder',6,1,'⚡','번개와 천둥|Lightning and thunder','빛은 소리보다 훨씬 빨라서 번개가 먼저 보이고 천둥은 나중에 들려요. 3초를 세면 약 1km 떨어진 거예요.|Light is much faster than sound, so we see lightning before we hear thunder. Every 3 seconds you count is about 1 km away.','천둥이 들리면 바로 건물 안으로! 큰 나무 아래는 위험해요.|When thunder roars, go indoors! Never shelter under a tall tree.'],
 ['seasons',6,1,'🍂','사계절|The four seasons','봄·여름·가을·겨울이 차례로 돌아와요. 여름에는 낮이 길고 덥고, 겨울에는 낮이 짧고 추워요.|Spring, summer, fall and winter come around in order. Summer has long, warm days; winter has short, cold days.','캐나다의 겨울에는 오후 5시면 벌써 깜깜해져요.|In a Canadian winter, it can be dark by 5 p.m.'],
 ['orbit',6,3,'🪐','공전과 기울기|Earth’s orbit and tilt','지구는 1년에 한 바퀴 해 둘레를 돌아요(공전). 지구가 기울어져 있어서 계절이 생겨요. 여름이 더운 건 해와 가까워서가 아니에요!|Earth travels around the Sun once a year (its orbit). Earth is tilted, and that tilt causes the seasons. Summer is not hot because we are closer to the Sun!','캐나다가 여름일 때 남반구의 호주는 겨울이에요.|When it’s summer in Canada, it’s winter in Australia.'],
 ['dress',6,1,'🧣','날씨에 맞는 옷차림|Dressing for the weather','추운 날에는 여러 겹 입고 모자와 장갑으로 귀와 손가락을 지켜요. 더운 날에는 모자, 선크림, 물을 챙겨요.|On cold days, wear layers and cover your ears and fingers with a hat and mittens. On hot days, bring a hat, sunscreen and water.','캐나다 겨울에는 동상을 조심해서 코와 귀를 꼭 가려요.|In a Canadian winter, cover your nose and ears to prevent frostbite.'],
 // ---------------------------------------------------------------- 7 Healthy Town
 ['sound',7,1,'🔔','소리는 떨림|Sound is vibration','물체가 떨리면 소리가 나요. 북을 치거나 기타 줄을 튕기면 떨리면서 소리가 나요.|Sounds are made when things vibrate (shake quickly). A drum or a guitar string makes sound when it vibrates.','말할 때 목에 손을 대 보면 떨림이 느껴져요.|Put your hand on your throat while you talk and feel it buzz.'],
 ['pitch',7,1,'🎵','높은 소리, 낮은 소리|High and low sounds','짧고, 가늘고, 팽팽할수록 높은 소리가 나고, 길고, 굵고, 느슨할수록 낮은 소리가 나요.|Short, thin and tight things make high sounds. Long, thick and loose things make low sounds.','실로폰의 짧은 막대는 높은 소리, 긴 막대는 낮은 소리!|On a xylophone, short bars sound high and long bars sound low!'],
 ['loud',7,1,'🔊','큰 소리, 작은 소리|Loud and soft','세게 치면 크게 떨려서 큰 소리, 살살 치면 작게 떨려서 작은 소리가 나요. 너무 큰 소리는 귀를 다치게 해요.|Hit something hard and it vibrates a lot: loud. Tap it gently: soft. Very loud sounds can hurt your ears.','이어폰 소리는 작게! 아주 시끄러운 곳에서는 귀마개를 써요.|Keep headphones quiet, and wear earplugs in very noisy places.'],
 ['soundtravel',7,2,'📞','소리의 여행|How sound travels','소리는 공기, 물, 실 같은 고체를 통해 전해져요. 공기가 없는 우주에서는 소리가 전해지지 않아요. 벽이나 산에 부딪혀 돌아오는 소리가 메아리예요.|Sound travels through air, water and solids like string. In space there is no air, so sound can’t travel. An echo is sound bouncing back off a wall or mountain.','종이컵 두 개를 실로 이어 실 전화기를 만들어 봐요.|Make a string telephone with two paper cups.'],
 ['heart',7,1,'❤️','심장과 폐|Heart and lungs','심장은 쉬지 않고 피를 온몸으로 보내고, 폐는 공기를 들이마셔 산소를 받아들여요. 뛰면 심장이 더 빨리 뛰어요.|Your heart pumps blood all around your body without stopping. Your lungs breathe in air to get oxygen. When you run, your heart beats faster.','손목이나 목에 손가락을 대고 맥박을 세어 봐요.|Put two fingers on your wrist or neck and count your pulse.'],
 ['body',7,1,'🦴','우리 몸|My body','뼈는 몸을 받치고 뇌와 심장 같은 중요한 곳을 보호해요. 근육이 뼈를 당겨서 몸이 움직여요. 눈·귀·코·혀·피부의 다섯 감각으로 세상을 느껴요.|Bones hold you up and protect important parts like your brain and heart. Muscles pull on bones to move you. Your five senses (eyes, ears, nose, tongue and skin) tell you about the world.','우유, 멸치 같은 칼슘 음식과 운동이 뼈를 튼튼하게 해요.|Calcium foods like milk and lots of exercise make bones strong.'],
 ['germs',7,1,'🧼','세균과 손 씻기|Germs and hand washing','세균은 너무 작아서 눈에 안 보여요. 비누로 20초 이상 손을 씻으면 세균을 없앨 수 있어요. 기침은 팔꿈치 안쪽에!|Germs are too tiny to see. Washing with soap for at least 20 seconds gets rid of them. Cough into your elbow!','밖에서 돌아오면, 화장실 다녀오면, 밥 먹기 전에 손 씻기!|Wash after coming inside, after the bathroom and before you eat!'],
 ['healthy',7,1,'🥦','튼튼한 생활 습관|Healthy habits','골고루 먹고, 물을 마시고, 매일 뛰어놀고, 푹 자요. 초등학생은 하루 9~12시간 자는 게 좋아요.|Eat lots of different foods, drink water, play actively every day and sleep well. Kids your age need 9–12 hours of sleep.','이는 하루 2번, 2분 동안 꼼꼼히 닦아요.|Brush your teeth twice a day for two minutes.'],
 ['emergency',7,1,'🚒','위급할 때|Emergencies','캐나다·미국에서는 911, 한국에서는 불이 나거나 다치면 119, 범죄는 112에 전화해요. 불이 나면 몸을 낮추고 밖으로! 옷에 불이 붙으면 멈추고, 엎드리고, 굴러요.|In Canada and the US, call 911. In Korea, call 119 for fires and injuries and 112 for police. In a fire, stay low and get out! If your clothes catch fire: stop, drop and roll.','우리 집 주소를 외워 두면 위급할 때 도움이 돼요.|Learn your home address by heart. It helps in an emergency.'],
 ['firstaid',7,2,'🩹','응급처치 상식|First-aid facts','데었을 때는 시원한 흐르는 물에 10분 넘게 식혀요(버터·얼음은 안 돼요). 코피가 나면 고개를 앞으로 숙이고 콧볼을 꼭 눌러요.|For a burn, cool it under running water for more than 10 minutes (no butter or ice). For a nosebleed, lean forward and pinch the soft part of your nose.','다치면 참지 말고 바로 어른에게 알려요.|If you get hurt, tell a grown-up right away.'],
];

<script>
// ================================================================ challenge formats and interactive science labs
// Each maker returns {tag:[icon,label], say, answer, mount(box, done), hint()}; done(ok, {answer, why}) is called once.
const T=s=>{s=String(s);const i=s.indexOf('|');return i<0?s:LANG==='en'?s.slice(i+1):s.slice(0,i)};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=n=>Math.floor(Math.random()*n),pick=a=>a[rnd(a.length)],rand=(a,b)=>a+Math.random()*(b-a);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const k=rnd(i+1);[a[i],a[k]]=[a[k],a[i]]}return a};
const ICON_SVG={
 chrysalis:'<svg viewBox="0 0 64 64"><path d="M32 3v9" stroke="#7a5230" stroke-width="3" stroke-linecap="round"/><path d="M32 11c11 6 13 19 10 31-2 9-6 16-10 19-4-3-8-10-10-19-3-12-1-25 10-31z" fill="#8ccf63" stroke="#3f7d2c" stroke-width="2.5"/><path d="M25 25q7 4 14 0M24 34q8 4 16 0M26 43q6 3 12 0" stroke="#3f7d2c" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="29" cy="18" r="2" fill="#e8c43a"/></svg>',
 frogspawn:'<svg viewBox="0 0 64 64">'+[[20,22],[34,18],[46,26],[16,36],[30,32],[44,40],[24,48],[38,50],[50,14]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="8" fill="#d8f0ff" stroke="#9cc8e0" stroke-width="1.5"/><circle cx="${x}" cy="${y}" r="3" fill="#222"/>`).join('')+'</svg>',
 tadpole:'<svg viewBox="0 0 64 64"><path d="M30 34q14 -2 22 6q-6 -2 -10 2q-4 4 -12 -2z" fill="#3a4a3a"/><ellipse cx="22" cy="32" rx="13" ry="10" fill="#3a4a3a"/><circle cx="17" cy="29" r="2.4" fill="#fff"/><circle cx="16.5" cy="29" r="1.2" fill="#000"/></svg>',
 froglet:'<svg viewBox="0 0 64 64"><path d="M34 32q12 -1 20 6q-6 -2 -9 2q-4 3 -11 -3z" fill="#4c7a3a"/><path d="M22 40l-6 10m0 0l-5 1m5-1l1 5M30 40l5 9m0 0l5 0m-5 0l-1 5" stroke="#4c7a3a" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="25" cy="32" rx="14" ry="11" fill="#5f9a46"/><circle cx="20" cy="27" r="3.4" fill="#fff"/><circle cx="20" cy="27" r="1.6" fill="#000"/><circle cx="30" cy="27" r="3.4" fill="#fff"/><circle cx="30" cy="27" r="1.6" fill="#000"/></svg>',
};
const icon=(s,cls='')=>s&&s[0]==='@'?`<span class="svgi ${cls}">${ICON_SVG[s.slice(1)]||''}</span>`:esc(s);
const svgPt=(svg,e)=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const m=svg.getScreenCTM();return m?p.matrixTransform(m.inverse()):{x:0,y:0}};
// pointer drag over an element; cb(point in svg units, phase)
function onDrag(el,svg,cb){
 el.addEventListener('pointerdown',e=>{if(el.dataset.lock)return;e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){}cb(svgPt(svg,e),'down');
  const mv=ev=>{ev.preventDefault();cb(svgPt(svg,ev),'move')},up=ev=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);cb(svgPt(svg,ev),'up')};
  el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)});
}
function tween(ms,step,end){const t0=performance.now();const f=now=>{const k=Math.min(1,(now-t0)/ms),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;step(e);if(k<1)requestAnimationFrame(f);else if(end)end()};requestAnimationFrame(f)}
const later=(ms,f)=>setTimeout(f,ms);
const qText=(s,cls='')=>`<div class="qtext ${cls}">${esc(s)}</div>`;
// shared "check" flow for labs: a few tries, a nudge after a miss, then the answer is shown
function tryFlow(box,ctx,{check,nudge,reveal,answer,why}){
 let left=ctx.tries,busy=false;
 const btn=box.querySelector('.check'),msg=box.querySelector('.simmsg');
 btn.addEventListener('click',()=>{
  if(busy||box.dataset.done)return;
  if(check()){busy=true;box.dataset.done=1;btn.disabled=true;SFX.good();sparkle(box);later(500,()=>box.__done(true,{why:why&&why()}));return}
  left--;SFX.bad();box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');
  if(left>0){msg.textContent='🤔 '+(nudge()||T('조금 더 바꿔 봐요!|Try changing it a bit more!'))+' '+T(`(기회 ${left}번 남음)|(${left} ${left===1?'try':'tries'} left)`);msg.classList.add('show');return}
  busy=true;box.dataset.done=1;btn.disabled=true;box.dataset.lock=1;msg.textContent='👀 '+T('정답을 보여 줄게요!|Here’s how it works!');msg.classList.add('show');
  reveal(()=>later(700,()=>box.__done(false,{answer:answer(),why:why&&why()})));
 });
}
function sparkle(box){const r=box.getBoundingClientRect();for(let i=0;i<10;i++){const s=document.createElement('i');s.className='spk';s.textContent=pick(['✨','⭐','💫']);s.style.left=(r.width*(.2+Math.random()*.6))+'px';s.style.top=(r.height*(.25+Math.random()*.5))+'px';box.appendChild(s);later(900,()=>s.remove())}}
const checkRow=(label=T('확인!|Check!'))=>`<div class="simmsg"></div><div class="simrow"><button class="btn green check" type="button">✔ ${esc(label)}</button></div>`;

const CH={};
// ---------------------------------------------------------------- multiple choice
function choiceUI(box,opts,correct,done,cls=''){
 box.insertAdjacentHTML('beforeend',`<div class="opts n${opts.length} ${cls}">${opts.map((o,i)=>`<button class="opt" type="button" data-i="${i}">${o.html}</button>`).join('')}</div>`);
 const wrap=box.querySelector('.opts');
 wrap.addEventListener('click',e=>{const b=e.target.closest('.opt');if(!b||b.disabled||box.dataset.done)return;box.dataset.done=1;const i=+b.dataset.i,ok=i===correct;
  b.classList.add(ok?'right':'wrong');wrap.querySelectorAll('.opt').forEach(x=>{if(+x.dataset.i===correct)x.classList.add('right');x.disabled=true});done(ok,i)});
 return ()=>{const c=[...wrap.querySelectorAll('.opt:not(:disabled)')].filter(x=>+x.dataset.i!==correct);if(c.length<=1)return false;const b=pick(c);b.disabled=true;b.classList.add('gone');return true};
}
CH.mc=(q,ctx)=>{
 const wrong=shuffle(q.o.slice()).slice(0,ctx.diff===1?2:3),opts=shuffle([q.a,...wrong]);let hint=null;
 return {tag:['🔍',T('퀴즈|Quiz')],say:T(q.q)+' … '+opts.map(T).join(', '),answer:T(q.a),
  mount(box,done){box.innerHTML=qText(T(q.q))+(q.art?`<div class="qart">${icon(q.art)}</div>`:'');hint=choiceUI(box,opts.map(o=>({html:esc(T(o))})),opts.indexOf(q.a),ok=>done(ok))},
  hint:()=>hint&&hint()};
};
// ---------------------------------------------------------------- true or false: the villain makes a claim
CH.ox=(q,ctx)=>{let B;
 return {tag:['⭕',T('OX 퀴즈|True or false')],say:T(q.s)+' … '+T('맞을까요, 틀릴까요?|True or false?'),answer:q.v?T('⭕ 맞아요|⭕ True'):T('❌ 틀려요|❌ False'),
  mount(box,done){B=box;box.innerHTML=`<div class="claim"><span class="who">${foeFace()}</span><div class="says">“${esc(T(q.s))}”</div></div>${qText(T('이 말이 맞을까요?|Is that true?'),'small')}
   <div class="oxrow"><button class="oxb o" type="button" data-v="1"><b>⭕</b><small>${T('맞아요|True')}</small></button><button class="oxb x" type="button" data-v="0"><b>❌</b><small>${T('틀려요|False')}</small></button></div>`;
   box.querySelector('.oxrow').addEventListener('click',e=>{const b=e.target.closest('.oxb');if(!b||box.dataset.done)return;box.dataset.done=1;const ok=+b.dataset.v===q.v;b.classList.add(ok?'right':'wrong');box.querySelectorAll('.oxb').forEach(x=>{x.disabled=true;if(+x.dataset.v===q.v)x.classList.add('right')});done(ok)})},
  hint(){if(!B||B.querySelector('.hintline'))return false;const c=CARD[q.c];B.querySelector('.claim').insertAdjacentHTML('afterend',`<div class="hintline">💡 ${esc(c.title)}: ${esc(c.life)}</div>`);return true}};
};
// ---------------------------------------------------------------- sorting into bins, one card at a time
CH.sort=(q,ctx)=>{
 const n=[4,5,6][ctx.diff-1];
 const byBin=q.bins.map((_,b)=>shuffle(q.items.filter(it=>it[2]===b)));
 let list=byBin.map(a=>a[0]).filter(Boolean);const rest=shuffle(byBin.flatMap(a=>a.slice(1)));
 while(list.length<n&&rest.length)list.push(rest.pop());list=shuffle(list);
 let k=0,miss=0,wrongs=[],B=null,hintOn=false;
 const binName=b=>T(q.bins[b][1]);
 return {tag:['🗂️',T('분류하기|Sorting')],say:T(q.q)+' … '+T(list[0][1]),answer:'',
  mount(box,done){B=box;
   const stage=q.fx==='tank'?`<div class="tank"><div class="water"></div><span class="drop"></span></div>`:q.fx==='magnet'?`<div class="magstage"><span class="bigmag">🧲</span><span class="drop"></span></div>`:'';
   box.innerHTML=qText(T(q.q))+stage+`<div class="sortcard"><span class="cnt"></span><span class="ic"></span><b></b></div><div class="bins n${q.bins.length}">${q.bins.map((b,i)=>`<button class="bin" type="button" data-b="${i}"><span class="bi">${esc(b[0])}</span><b>${esc(T(b[1]))}</b><span class="tray"></span></button>`).join('')}</div>`;
   const card=box.querySelector('.sortcard');
   const show=()=>{const it=list[k];card.querySelector('.cnt').textContent=`${k+1}/${list.length}`;card.querySelector('.ic').innerHTML=icon(it[0]);card.querySelector('b').textContent=T(it[1]);card.classList.remove('in');void card.offsetWidth;card.classList.add('in');hintOn=false;box.querySelectorAll('.bin').forEach(x=>x.classList.remove('hinted'));if(k)speak(T(it[1]))};
   const observe=it=>{const d=box.querySelector('.drop');if(!d)return;d.innerHTML=icon(it[0]);d.className='drop';void d.offsetWidth;d.classList.add(q.fx==='tank'?(it[2]===0?'float':'sink'):(it[2]===0?'stick':'fall'));if(q.fx==='tank')SFX.splash();else if(it[2]===0)SFX.snap()};
   box.querySelector('.bins').addEventListener('click',e=>{const b=e.target.closest('.bin');if(!b||box.dataset.done||card.dataset.busy)return;const it=list[k],bi=+b.dataset.b,ok=bi===it[2];card.dataset.busy=1;
    const target=box.querySelector(`.bin[data-b="${it[2]}"]`);
    if(ok){SFX.good();b.classList.add('flash-ok')}else{miss++;wrongs.push(`${it[0][0]==='@'?'':it[0]} ${T(it[1])} → ${binName(it[2])}`);SFX.bad();b.classList.add('flash-bad');target.classList.add('flash-ok');card.classList.add('shake')}
    observe(it);
    later(ok?420:1000,()=>{b.classList.remove('flash-ok','flash-bad');target.classList.remove('flash-ok');card.classList.remove('shake');
     target.querySelector('.tray').insertAdjacentHTML('beforeend',`<i class="${ok?'':'was'}">${icon(it[0])}</i>`);delete card.dataset.busy;k++;
     if(k>=list.length){box.dataset.done=1;card.classList.add('hidden');done(miss<=(ctx.diff===1?1:0),{answer:wrongs.join(' · ')})}else show()})});
   show();
  },
  hint(){if(!B||B.dataset.done||hintOn)return false;hintOn=true;B.querySelector(`.bin[data-b="${list[k][2]}"]`).classList.add('hinted');return true}};
};
// ---------------------------------------------------------------- put things in order

function toast(html){const t=document.createElement('div');t.className='toast';t.innerHTML=html;$('toasts').appendChild(t);setTimeout(()=>t.remove(),2800)}
const MQ=[];let CUR=null,DEFER=null;
// modal(html,{acts:{name:fn}}): buttons with data-act run fn and close the modal (return false keeps it open; return a function to run after it closes)
function modal(html,o={}){MQ.push({html,...o});if(!CUR)nextModal()}
function nextModal(){
 const m=MQ.shift();CUR=m||null;
 if(!m){$('modalRoot').innerHTML='';if(DEFER){const f=DEFER;DEFER=null;f()}return}
 $('modalRoot').innerHTML=`<div class="modal ${m.cls||''}" role="dialog" aria-modal="true"><div class="box">${m.closable===false?'':`<button class="x" type="button" data-act="close" aria-label="${L('닫기','Close')}">✕</button>`}${m.html}</div></div>`;
 if(m.onOpen)m.onOpen($('modalRoot').querySelector('.box'));
}
function closeModal(after){const m=CUR;CUR=null;$('modalRoot').innerHTML='';if(m&&m.onClose)m.onClose();if(after){if(MQ.length)DEFER=after;else{nextModal();after();return}}nextModal()}
$('modalRoot').addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');
 if(!b){if(e.target.classList.contains('modal')&&CUR&&CUR.closable!==false)closeModal();return}
 SFX.click();const act=b.dataset.act;if(act==='close'){closeModal();return}
 const fn=CUR&&CUR.acts&&CUR.acts[act];if(!fn){closeModal();return}
 const r=fn(b);if(r===false)return;closeModal(typeof r==='function'?r:null);
});

  const a=i.animate([{transform:`translate(${x}px,${y}px) rotate(0deg)`,opacity:1},{transform:`translate(${x+dx}px,${y+dy}px) rotate(${rot}deg)`,opacity:0}],{duration:dur,easing:'cubic-bezier(.15,.6,.35,1)'});a.onfinish=()=>i.remove()};
 const COLORS=['#ff5a6a','#ffc83d','#33c46b','#4cb4ff','#a77bff','#ff8ad8'];
 if(kind==='fireworks'){for(let b=0;b<4;b++){const cx=W*(.2+Math.random()*.6),cy=H*(.18+Math.random()*.35),c=pick(COLORS);setTimeout(()=>{for(let k=0;k<26;k++){const a=k/26*Math.PI*2,v=90+Math.random()*90;spawn(cx,cy,Math.cos(a)*v*1.6,Math.sin(a)*v*1.6+60,0,1100,'',{width:'8px',height:'8px',borderRadius:'50%',background:c,boxShadow:`0 0 10px ${c}`})}tone(300+rnd(400),.25,'sine',.03)},b*260)}return}

  else spawn(x,y,dx,dy,rot,dur,'',{width:(6+rnd(6))+'px',height:(10+rnd(8))+'px',borderRadius:'2px',background:pick(COLORS)});

function flyCoins(from,n){

function grant({coins=0,xp=0,items={}}={},defer=false){
 if(coins>0&&S.equip.buddy==='bunny')coins=Math.round(coins*1.1);
 const before=S.coins;S.coins+=coins;S.earned+=Math.max(0,coins);
 for(const [k,v] of Object.entries(items))S.inv[k]=(S.inv[k]||0)+v;
 S.xp+=xp;const levels=[];
 while(S.xp>=xpNeed(S.lvl)){S.xp-=xpNeed(S.lvl);S.lvl++;const oldT=titleOf(S.lvl-1).name,t=titleOf(S.lvl);
  const gift={coins:40+S.lvl*10,items:{hint:1,...(S.lvl%5===0?{shield:1,potion:1}:{})}};S.coins+=gift.coins;S.earned+=gift.coins;
  for(const [k,v] of Object.entries(gift.items))S.inv[k]=(S.inv[k]||0)+v;
  levels.push({lvl:S.lvl,gift,newTitle:t.name!==oldT?t:null});
 }
 save();updateHud();
 if(!defer)levelModals(levels);
 checkTrophies();
 return {coins,xp,before,after:before+coins,levels};
}

function ensureMissions(){
 const d=dayKey();if(S.missions.day===d)return;
 S.missions={day:d,list:shuffle(MISSIONS.slice()).slice(0,3).map(m=>({id:m.id,n:0,got:false})),chest:false};save();
}
function track(id,n=1){
 ensureMissions();
 for(const m of S.missions.list){if(m.id!==id||m.got)continue;const def=MISSIONS.find(x=>x.id===id);const was=m.n;m.n=Math.min(def.goal,m.n+n);
  if(was<def.goal&&m.n>=def.goal)toast(`${def.icon} ${L('임무 완료!','Mission complete!')} <small>${esc(def.text)}</small>`)}
 save();
}

// a card got answered: grow its mastery (at most 3 points a day so repeats are spread over days)
function learn(id,ok){
 const c=S.cards[id]||(S.cards[id]={m:0,d:'',n:0,r:0,w:0});const day=dayKey(),before=tierOf(c.m);
 if(c.d!==day){c.d=day;c.n=0}
 if(ok){c.r++;if(c.n<3){c.n++;c.m++}
  if(S.weak[id]){S.weak[id]--;if(S.weak[id]<=0){delete S.weak[id];S.beaten++;toast(`👾 ${L('오답 몬스터 퇴치!','Mistake monster defeated!')} <small>${esc(CARD[id].title)}</small>`)}}}
 else{c.w++;S.weak[id]=2;c.m=Math.max(0,c.m-1)}
 const after=tierOf(c.m);if(after>before){toast(`${TIER[after].icon} ${L('카드 승급!','Card leveled up!')} <b>${esc(CARD[id].title)}</b>`);track('card')}
 save();
}

// a chest with two coin bags: add them up for a bonus (3-digit addition)
function mathChest(title,done){
 const easy=S.diff===1,a=easy?20+rnd(60):100+rnd(150),b=easy?10+rnd(40):60+rnd(140),ans=a+b,opts=shuffle([ans,ans+10*(1+rnd(3)),ans-10*(1+rnd(3))]);
 let answered=false;
 modal(`<div style="font-size:70px">🎁</div><h2>${esc(title)}</h2><p>${L('상자 안에 코인 주머니가 2개 있어요. 모두 몇 개일까요? 맞히면 보너스 +50!','There are two coin bags inside. How many coins in total? Get it right for +50 bonus!')}</p>
  <div class="math" style="font-size:24px">${COIN} ${a} + ${COIN} ${b} = ?</div>
  <div class="choices">${opts.map(o=>`<button type="button" data-act="ans" data-v="${o}">${o}</button>`).join('')}</div>
  <p id="chestMsg" style="min-height:24px"></p><div class="row"><button class="btn gold hidden" id="chestTake" type="button" data-act="take">${L('받기','Collect')}</button></div>`,
 {closable:false,acts:{
  ans:b2=>{if(answered)return false;answered=true;const ok=+b2.dataset.v===ans;
   document.querySelectorAll('.choices button').forEach(x=>{if(+x.dataset.v===ans)x.classList.add('right');else if(x===b2)x.classList.add('wrong')});
   $('chestMsg').textContent=ok?L(`정답! ${a} + ${b} = ${ans} · 보너스 +50!`,`Correct! ${a} + ${b} = ${ans} · +50 bonus!`):L(`정답은 ${ans}이에요. 그래도 ${ans}코인을 받아요!`,`The answer is ${ans}. You still get ${ans} coins!`);
   if(ok){SFX.good();celebrate()}else SFX.bad();
   $('chestTake').classList.remove('hidden');$('chestTake').dataset.coins=ans+(ok?50:0);return false},
  take:b2=>{const n=+b2.dataset.coins;const r=grant({coins:n,xp:30});flyCoins(null,r.coins);done&&done()}
 }});
}

function stageFocus(w,s){
 const A=availCards(w).map(c=>c.id),n=A.length,chunk=i=>A.slice(Math.round(i*n/4),Math.round((i+1)*n/4));
 if(s>=4)return {focus:A,fresh:[]};
 const nw=chunk(s),prev=s>0?chunk(s-1):[];return {focus:[...nw,...prev].length?[...nw,...prev]:A,fresh:nw};
}
const poolOf=ids=>QALL.filter(q=>ids.includes(q.c)&&q.l<=S.diff);
function startStage(w,s){
 const {focus,fresh}=stageFocus(w,s),W=WORLDS[w];
 mapWorld=w;

  foe:{icon:W.mon.icon,img:W.mon.img,name:W.mon.name,hi:W.mon.hi,hp:D().mon}}));
}

let SP=null;
function speedPool(){const ws=openWorldIds();let p=QALL.filter(q=>q.t==='ox'&&q.l<=S.diff&&ws.includes(CARD[q.c].w));if(p.length<12)p=QALL.filter(q=>q.t==='ox'&&q.l<=S.diff&&CARD[q.c].w<=Math.max(1,...ws));return p}
function speedIntro(){
 const t=D().speed+(S.equip.buddy==='robot'?10:0),has=(S.inv.freeze||0)>0;
 modal(`<div style="font-size:64px">⚡</div><h2>${L('번개 OX','Lightning True-or-False')}</h2><p>${L(`${t}초 동안 헷갈 박사의 말이 맞는지(O) 틀린지(X) 최대한 많이 맞혀요! 틀리면 3초가 줄어요.`,`You have ${t} seconds. Decide if Dr. Mix-Up’s claims are true (O) or false (X). A wrong answer costs 3 seconds!`)}</p>
  <p>${L('최고 기록','Best')}: <b>${S.speedBest}</b></p>
  ${has?`<label class="usebox"><input type="checkbox" id="useFreeze"> ${pic(ITEMS.freeze.img,ITEMS.freeze.icon)} ${esc(ITEMS.freeze.name)} ${L('쓰기','use')} (${S.inv.freeze})</label>`:''}
  <div class="row"><button class="btn gold" type="button" data-act="go">⚡ ${L('시작!','Start!')}</button></div>`,
 {acts:{go:()=>{const use=has&&$('useFreeze')&&$('useFreeze').checked;if(use){S.inv.freeze--;save()}return ()=>speedBegin(t+(use?15:0))}}});
}
function speedBegin(sec){
 S.speedPlays++;save();go('play');
 SP={end:Date.now()+sec*1000,total:sec,score:0,combo:0,best:0,miss:[],pool:shuffle(speedPool()),i:0,over:false,cur:null,lock:false,timer:null};
 $('v-play').innerHTML=`<div class="arena speed" style="background:linear-gradient(135deg,#ffb347,#ff5e7e 50%,#7b4dff)"><div class="ptitle">⚡ ${L('번개 OX','Lightning O/X')}</div>
  <div class="spbar"><div class="tm"><i id="spT"></i></div><b id="spS" class="score">0</b></div><div class="spcombo" id="spC"></div></div>
  <div class="chal card speedcard" id="chal"><div class="claim big"><span class="who">${pic(FINAL.img,FINAL.icon)}</span><div class="says" id="spQ"></div></div>
  <div class="oxrow"><button class="oxb o" type="button" data-v="1"><b>⭕</b><small>${L('맞아요','True')}</small></button><button class="oxb x" type="button" data-v="0"><b>❌</b><small>${L('틀려요','False')}</small></button></div><div class="spfb" id="spF"></div></div>`;
 $('v-play').querySelector('.oxrow').addEventListener('click',e=>{const b=e.target.closest('.oxb');if(!b||!SP||SP.over||SP.lock)return;speedAnswer(+b.dataset.v===SP.cur.v)});
 speedNext();SP.timer=setInterval(speedTick,200);
}
function speedNext(){if(!SP)return;if(SP.i>=SP.pool.length){SP.pool=shuffle(SP.pool);SP.i=0}SP.cur=SP.pool[SP.i++];$('spQ').textContent='“'+T(SP.cur.s)+'”';SP.lock=false;speak(T(SP.cur.s))}
function speedTick(){if(!SP||SP.over)return;const left=(SP.end-Date.now())/1000;$('spT').style.width=Math.max(0,left/SP.total*100)+'%';$('spT').parentElement.classList.toggle('low',left<10);if(left<=10&&left>0&&Math.floor(left)!==SP.lt){SP.lt=Math.floor(left);SFX.tick()}if(left<=0)speedEnd()}
function speedAnswer(ok){
 const q=SP.cur;SP.lock=true;learn(q.c,ok);S.answered++;
 const f=$('spF');
 if(ok){SP.score++;SP.combo++;SP.best=Math.max(SP.best,SP.combo);S.correct++;track('correct');SFX.good();f.className='spfb ok';f.textContent='✅ '+(SP.combo>=3?`🔥${SP.combo}`:'')}
 else{SP.combo=0;SP.end-=3000;SP.miss.push(q);SFX.bad();f.className='spfb bad';f.textContent=`❌ ${L('정답','Answer')}: ${q.v?'⭕':'❌'} · −3${L('초','s')}`;const c=$('chal');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}
 $('spS').textContent=SP.score;$('spC').textContent=SP.combo>=3?`🔥 ${SP.combo} ${L('콤보','combo')}`:'';
 if(SP.best>S.bestCombo)S.bestCombo=SP.best;
 setTimeout(()=>{if(SP&&!SP.over)speedNext()},ok?380:1100);
}
function speedEnd(){
 if(!SP||SP.over)return;SP.over=true;clearInterval(SP.timer);stopVoice();
 const P=SP,rec=P.score>S.speedBest;if(rec)S.speedBest=P.score;track('speed');
 const r=grant({coins:P.score*3+(rec&&P.score>=5?50:0),xp:10+P.score*2},true);SFX.win();if(rec)celebrate();
 modal(`<div style="font-size:64px">⚡</div><h2>${rec?L('새 기록!','New record!'):L('시간 끝!','Time’s up!')}</h2><div class="bignum">${P.score}</div><p>${L(`최고 기록 ${S.speedBest} · 최고 콤보 ${P.best}`,`Best ${S.speedBest} · best combo ${P.best}`)}</p>${rewardChips(r)}
  ${P.miss.length?`<details class="review" open><summary>📝 ${L(`틀린 문제 다시 보기 (${P.miss.length})`,`Review your mistakes (${P.miss.length})`)}</summary>${[...new Set(P.miss)].map(q=>`<div class="rv"><b>${q.v?'⭕':'❌'} ${esc(T(q.s))}</b><span>${esc(q.why?T(q.why):CARD[q.c].text)}</span></div>`).join('')}</details>`:''}
  <div class="row"><button class="btn ghost" type="button" data-act="out">${L('홈으로','Home')}</button><button class="btn gold" type="button" data-act="again">⚡ ${L('다시 하기','Again')}</button></div>`,
 {closable:false,acts:{out:()=>()=>go('home'),again:()=>()=>speedIntro()},onOpen:b=>{if(r.coins)setTimeout(()=>flyCoins(b.querySelector('.rewards'),r.coins),400)}});
 levelModals(r.levels);checkTrophies();save();
}

function openPlayers(){
 modal(`<h2>👥 ${L('수호대원 바꾸기','Switch player')}</h2><p>${L('형제자매가 각자 기록을 따로 가질 수 있어요.','Brothers and sisters can each keep their own progress.')}</p>
  <div class="plist">${ROOT.order.map(id=>{const p=id===ROOT.cur?S:merge(ROOT.P[id]);return `<button type="button" class="pl ${id===ROOT.cur?'on':''}" data-act="p_${id}">${avatarHTML(p)}<span><b>${esc(p.name)}</b><small>Lv.${p.lvl} · ${DIFFS[p.diff].icon} ${esc(DIFFS[p.diff].grade)} · 📚 ${Object.keys(p.cards).length}</small></span>${id===ROOT.cur?'<em>✅</em>':''}</button>`}).join('')}</div>
  <div class="row"><button class="btn ghost" type="button" data-act="edit">✏️ ${L('내 정보 고치기','Edit my profile')}</button>${ROOT.order.length<6?`<button class="btn green" type="button" data-act="add">➕ ${L('새 대원','New player')}</button>`:''}</div>`,
 {acts:{...Object.fromEntries(ROOT.order.map(id=>['p_'+id,()=>{if(id!==ROOT.cur){save();ROOT.cur=id;S=merge(ROOT.P[id]);save();quietTrophies();toast(`${S.av} ${L(`${S.name} 대원, 반가워요!`,`Welcome back, ${S.name}!`)}`)}go('home');dailyLogin()}])),
  edit:()=>()=>playerForm(S,{isNew:false}),add:()=>()=>playerForm({...fresh(),name:L('새 대원','New guardian')},{isNew:true})}});
}
function openSettings(){
 const sw=(id,on,label)=>`<div class="row"><span>${label}</span><button class="switch ${on?'on':''}" type="button" data-act="${id}" aria-pressed="${on}"></button></div>`;
 let resetArm=false;const d=D();
 modal(`<h2>⚙️ ${L('설정','Settings')}</h2><div class="settings">${sw('snd',ROOT.opt.sound,L('🔊 효과음','🔊 Sound effects'))}${sw('voice',ROOT.opt.voice,L('🗣️ 읽어 주는 목소리','🗣️ Read-aloud voice'))}${sw('shield',S.shieldOn,L('🛡️ 실수 방패 자동 사용','🛡️ Use the shield automatically'))}
  <div class="row"><span>🎚️ ${L('난이도','Difficulty')}</span><button class="btn small ghost" type="button" data-act="diff">${d.icon} ${esc(d.name)} · ${esc(d.grade)}</button></div>
  <div class="row"><span>👥 ${L('수호대원','Players')}</span><button class="btn small ghost" type="button" data-act="players">${esc(S.av)} ${esc(S.name)}</button></div>
  <div class="row"><span>🌐 ${L('언어','Language')}</span><button class="btn small ghost" type="button" data-act="lang">${LANG==='en'?'한국어':'English'}</button></div>
  <div class="row"><span>🗑️ ${L('이 대원 처음부터','Restart this player')}</span><button class="btn small red" type="button" data-act="reset">${L('초기화','Reset')}</button></div></div>
  <p style="font-size:12.5px;margin-top:14px">${L('모든 문제, 설명, 그림, 소리는 초등 과학 교과 내용(한국·캐나다)을 바탕으로 이 게임을 위해 직접 만들었어요. 기록은 이 기기에만 저장돼요.','All questions, explanations, pictures and sounds were written for this game, based on elementary science topics from Korea and Canada. Progress is saved only on this device.')}</p>`,
 {acts:{
  snd:b=>{ROOT.opt.sound=!ROOT.opt.sound;b.classList.toggle('on',ROOT.opt.sound);save();if(ROOT.opt.sound)SFX.click();return false},
  voice:b=>{ROOT.opt.voice=!ROOT.opt.voice;b.classList.toggle('on',ROOT.opt.voice);save();if(!ROOT.opt.voice)stopVoice();else speak(L('읽어 주는 목소리를 켰어요!','The read-aloud voice is on!'));return false},
  shield:b=>{S.shieldOn=!S.shieldOn;b.classList.toggle('on',S.shieldOn);save();if(PS)drawItems();return false},
  diff:()=>()=>openDifficulty(),players:()=>()=>openPlayers(),
  lang:()=>{save();setLang(LANG==='en'?'ko':'en');return false},
  reset:b=>{if(!resetArm){resetArm=true;b.textContent=L('정말요? 한 번 더','Really? Tap again');return false}const keep={name:S.name,av:S.av,diff:S.diff};S={...fresh(),...keep};save();location.reload();return false},
 }});
}

// ---------------------------------------------------------------- daily login
function dailyLogin(){
 const d=dayKey();if(S.login.last===d)return;
 const y=new Date();y.setDate(y.getDate()-1);
 S.login.streak=S.login.last===dayKey(y)?S.login.streak+1:1;S.login.last=d;S.login.best=Math.max(S.login.best,S.login.streak);save();
 const idx=(S.login.streak-1)%7,coins=LOGIN[idx];
 modal(`<h2>📅 ${L('출석 보상','Daily reward')}</h2><p>${L(`${S.login.streak}일 연속 출석! 매일 오면 선물이 커져요.`,`${S.login.streak}-day streak! Come every day for bigger gifts.`)}</p>
  <div class="calendar">${LOGIN.map((c,i)=>`<div class="${i<idx?'got':i===idx?'today':''}">${L(`${i+1}일`,`Day ${i+1}`)}<b>${i===6?'🎁':i<idx?'✅':'🪙'}</b>${c}</div>`).join('')}</div>
  <div class="row"><button class="btn gold" type="button" data-act="take">${COIN} +${coins} ${L('받기','Collect')}</button></div>`,
 {closable:false,acts:{take:b=>{const r=grant({coins,xp:10,items:idx===6?{hint:2,shield:1,potion:1}:{}});flyCoins(b,r.coins);if(VIEW==='home')renderHome()}}});
}

// ---------------------------------------------------------------- story intro and start
function introStory(){
 const b=BUDDIES[S.equip.buddy];
 modal(`<div class="bossart" style="background:${FINAL.grad}">${pic(FINAL.img,FINAL.icon)}</div><h2>${esc(FINAL.name)}</h2><div class="speech">“${esc(FINAL.hi)}”</div>`,
  {closable:false,acts:{},onOpen:box=>{speak(FINAL.hi);box.insertAdjacentHTML('beforeend',`<div class="row"><button class="btn red" type="button" data-act="next">${L('큰일이다! ▶','Oh no! ▶')}</button></div>`);CUR.acts={next:()=>()=>{
   modal(`<div style="font-size:72px">${pic(b.img,b.icon)}</div><h2>${L(`${S.name} 대원, 도와줘요!`,`${S.name}, we need you!`)}</h2><p>${L('헷갈 박사의 몬스터들이 마을에 엉터리 상식을 퍼뜨리고 있어요. 과학 문제를 맞히면 공격, 틀리면 하트가 줄어요. 틀려도 괜찮아요. 설명을 보면 더 강해져요! 새로 배운 내용은 과학 카드로 모아요.','Dr. Mix-Up’s monsters are spreading silly myths around town. Answer science questions to attack; wrong answers cost a heart. Mistakes are okay: read the explanation and you get stronger! Everything you learn becomes a science card.')}</p>
    <div class="row"><button class="btn green" type="button" data-act="go">▶ ${L('출동!','Let’s go!')}</button></div>`,{closable:false,acts:{go:()=>{S.intro=true;save();return ()=>{dailyLogin();startStage(0,0)}}},onOpen:()=>speak(L(`${S.name} 대원, 도와줘요! 과학 문제를 맞히면 몬스터를 공격해요. 틀려도 괜찮아요, 설명을 보면 더 강해져요!`,`${S.name}, we need you! Answer science questions to attack the monsters. Mistakes are okay. Read the explanation and you get stronger!`))})}}}});
}
function renderSplashPlayers(){
 const el=$('splashPlayers');if(!el)return;
 if(ROOT.order.length<2){el.innerHTML='';return}
 el.innerHTML=`<p>${L('누가 할까요?','Who’s playing?')}</p><div class="spl">${ROOT.order.map(id=>{const p=id===ROOT.cur?S:merge(ROOT.P[id]);return `<button type="button" data-pid="${id}" class="${id===ROOT.cur?'on':''}">${avatarHTML(p)}<b>${esc(p.name)}</b><small>Lv.${p.lvl}</small></button>`}).join('')}</div>`;
}
function begin(){
 audio();SFX.level();$('splash').classList.add('hidden');go('home');
 if(!S.intro){playerForm(S,{isNew:true});return}
 dailyLogin();
}
applyLang();updateHud();ensureMissions();quietTrophies();$('homeLink').href='index.html?lang='+LANG;renderSplashPlayers();
$('splashPlayers').addEventListener('click',e=>{const b=e.target.closest('[data-pid]');if(!b)return;const id=b.dataset.pid;if(id!==ROOT.cur){save();ROOT.cur=id;S=merge(ROOT.P[id]);save();quietTrophies();updateHud()}begin()});
$('startBtn').addEventListener('click',begin);
window.addEventListener('beforeunload',()=>save());

// For browser verification
window.__sciTest={get:()=>S,root:()=>ROOT,set:o=>{Object.assign(S,o);save();updateHud()},ps:()=>PS,sp:()=>SP,QALL,CARD,CH,SIMS,LABS,go,startStage,bossIntro,finalIntro,startReview,startDaily,startLab,speedBegin,finish,
 solve:()=>{if(!PS||!PS.cur||PS.cur.answered)return false;PS.cur.answered=true;answer(true,{});return true},miss:()=>{if(!PS||!PS.cur||PS.cur.answered)return false;PS.cur.answered=true;answer(false,{});return true},next:()=>{if(PS){if(PS.over)finish();else nextTurn()}},
 show:k=>{if(!PS)return false;PS.fixed=[QALL[k]];PS.over=false;nextTurn();return QALL[k]}};
</script>
</body>
</html>
