<html lang="ko">
<head>
<meta charset="utf-8">

<script>
/* Language: ?lang=ko|en, then the saved choice, then the device language. Shared by every page on this site. */
const LANG=(()=>{let q=null,s=null;try{q=new URLSearchParams(location.search).get('lang')}catch(e){}try{s=localStorage.getItem('moonGames.lang')}catch(e){}const l=q==='ko'||q==='en'?q:s==='ko'||s==='en'?s:/^ko/i.test(navigator.language||'')?'ko':'en';if(q===l){try{localStorage.setItem('moonGames.lang',l)}catch(e){}}document.documentElement.lang=l;return l})();
const L=(ko,en)=>LANG==='en'?en:ko;
function applyLang(){if(LANG!=='en')return;document.querySelectorAll('[data-en]').forEach(el=>{el.textContent=el.dataset.en});document.querySelectorAll('[data-en-html]').forEach(el=>{el.innerHTML=el.dataset.enHtml});for(const a of ['aria-label','placeholder','title'])document.querySelectorAll('[data-en-'+a+']').forEach(el=>el.setAttribute(a,el.getAttribute('data-en-'+a)))}
function setLang(next){try{localStorage.setItem('moonGames.lang',next)}catch(e){}try{speechSynthesis.cancel()}catch(e){}const u=new URL(location.href);u.searchParams.set('lang',next);location.replace(u.href)}
</script>
<style>
:root{
  color-scheme:light;
  --bg-top:#e9f0ff;--bg-bottom:#fff6e8;
  --ink:#24305e;--muted:#5d6894;--card:#ffffff;--line:#dfe5f7;
  --brand:#5b6cff;--brand-ink:#ffffff;--accent:#ffb84d;
  --shadow:0 14px 34px rgba(54,72,160,.14);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh;min-height:100dvh;color:var(--ink);
  background:radial-gradient(circle at 85% -10%,#d8dcff 0,transparent 42%),linear-gradient(180deg,var(--bg-top),var(--bg-bottom));
  font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  -webkit-tap-highlight-color:transparent;
}
a{color:inherit}
.wrap{width:min(980px,100%);margin:0 auto;padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 36px max(16px,env(safe-area-inset-left))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.moon{width:58px;height:58px;flex:0 0 58px;border-radius:50%;display:grid;place-items:center;font-size:34px;background:linear-gradient(145deg,#fff3c4,#ffd36b);box-shadow:0 8px 22px rgba(255,184,77,.45),inset -6px -8px 0 rgba(224,148,40,.25)}
.brand h1{margin:0;font-size:clamp(24px,5.4vw,36px);line-height:1.05;letter-spacing:-.6px}
.brand h1 small{display:block;font-size:.46em;letter-spacing:0;color:var(--muted);font-weight:700;margin-top:5px}
.lang{display:inline-flex;padding:4px;border-radius:999px;background:#fff;border:1px solid var(--line);box-shadow:0 4px 14px rgba(54,72,160,.08)}
.lang button{font:inherit;font-size:14px;font-weight:800;border:0;border-radius:999px;padding:9px 15px;min-height:40px;background:transparent;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.lang button:focus-visible,.card:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.hello{margin:22px 0 18px;font-size:clamp(16px,3.6vw,20px);font-weight:800;line-height:1.45}
.hello span{color:var(--muted);font-weight:700;font-size:.82em;display:block;margin-top:2px}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}
.card{display:flex;flex-direction:column;text-decoration:none;background:var(--card);border-radius:26px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .18s ease,box-shadow .18s ease}
.card:hover{transform:translateY(-4px);box-shadow:0 20px 40px rgba(54,72,160,.2)}
.card:active{transform:scale(.985)}
.thumb{position:relative;aspect-ratio:16/9;overflow:hidden}
.thumb .cover{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover;transition:transform .35s ease}
.card:hover .thumb .cover{transform:scale(1.04)}
.body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.title{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.title h2{margin:0;font-size:23px;letter-spacing:-.4px}
.age{flex:0 0 auto;font-size:12px;font-weight:800;color:#6a4b00;background:#fff0c9;border-radius:999px;padding:4px 10px}
.desc{margin:0;color:var(--muted);font-size:15px;line-height:1.5;font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.tags li{font-size:12.5px;font-weight:800;background:#f0f3ff;color:#3d4a8a;border-radius:10px;padding:5px 9px}
.stat{align-self:flex-start;font-size:13px;font-weight:800;color:#2f6b45;background:#e4f6ea;border-radius:10px;padding:6px 10px}
.play{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:16px;background:var(--brand);color:var(--brand-ink);font-size:18px;font-weight:900;box-shadow:0 8px 18px rgba(91,108,255,.35)}
.card:hover .play{filter:brightness(1.08)}
/* Detective thumbnail: city-map mint with the detective, magnifier and buddies */
.t-detective{background:radial-gradient(circle,#b2d7cb 1.4px,transparent 1.6px) 0 0/30px 30px,linear-gradient(160deg,#d9f2e6,#c4e7f6)}
.t-detective .road{position:absolute;left:-10%;right:-10%;top:58%;height:22px;background:#fefdf0;transform:rotate(-8deg);box-shadow:0 0 0 2px #c3d6c7}
.t-detective .hero{position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);font-size:86px;filter:drop-shadow(0 8px 10px rgba(37,57,110,.25))}
.t-detective .glass{position:absolute;left:62%;top:22%;font-size:46px;transform:rotate(-18deg)}
.t-detective .pin{position:absolute;font-size:30px}
/* Marble thumbnail: dark sky, a glowing track and rolling marbles */
.t-marble{background:radial-gradient(ellipse at 35% -30%,#3a5a96 0%,#0e1830 70%)}
.t-marble .track{position:absolute;left:-15%;right:-15%;top:54%;height:44px;border-radius:30px;background:linear-gradient(180deg,#5b52b0,#36286e);transform:rotate(-7deg);box-shadow:0 -3px 0 #55ffed,0 3px 0 #55ffed,0 0 26px #55ffed66}
.t-marble .m{position:absolute;width:var(--s,40px);height:var(--s,40px);border-radius:50%;background:var(--c);background:radial-gradient(circle at 32% 28%,#fff 0 7%,var(--c) 34%,color-mix(in srgb,var(--c) 60%,#000) 100%);box-shadow:0 0 16px var(--c);animation:roll 2.6s ease-in-out infinite alternate}
.t-marble .flag{position:absolute;right:8%;top:16%;font-size:40px}
@keyframes roll{to{transform:translateX(26px) rotate(160deg)}}
/* Chess thumbnail: night-purple sky over a checkerboard and a golden knight */
.t-chess{background:radial-gradient(circle at 50% 20%,#8f7bff 0,#2b2f7a 75%)}
.t-chess .board{position:absolute;left:-10%;right:-10%;bottom:-38%;height:70%;transform:perspective(380px) rotateX(58deg);background:repeating-conic-gradient(#eeeed2 0 25%,#769656 0 50%) 0 0/16.66% 25%;box-shadow:0 -8px 30px rgba(0,0,0,.35)}
.t-chess .knight{position:absolute;left:50%;top:46%;width:42%;height:auto;aspect-ratio:1;transform:translate(-50%,-50%);filter:drop-shadow(0 12px 14px rgba(0,0,0,.4));animation:hop 2.4s ease-in-out infinite}
.t-chess .spark{position:absolute;font-size:30px}
@keyframes hop{50%{transform:translate(-50%,-58%) rotate(-4deg)}}
/* Science thumbnail: lab-blue sky with a spinning atom, a magnet, a compass and a little villain */
.t-science{background:radial-gradient(circle at 30% 20%,#5fe3ff 0,#1a7fb0 55%,#0f3d6e 100%)}
.t-science .ring{position:absolute;left:50%;top:50%;width:46%;aspect-ratio:1;border:4px solid #ffffffb0;border-radius:50%;transform:translate(-50%,-50%) rotate(var(--r)) scaleY(.36);box-shadow:0 0 18px #7cf3ff}
.t-science .core{position:absolute;left:50%;top:50%;width:12%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 35% 30%,#fff,#ffd84d 45%,#ff9f45);box-shadow:0 0 22px #ffd84d}
.t-science .atom{position:absolute;inset:0;animation:spinA 9s linear infinite}
.t-science .ic{position:absolute;font-size:38px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.3))}
.t-music{background:radial-gradient(circle at 30% 20%,#ff9ad5 0,#8a4dff 55%,#2a1466 100%)}
.t-music .keys{position:absolute;left:8%;right:8%;bottom:10%;height:26%;border-radius:10px;background:repeating-linear-gradient(90deg,#fff 0 calc(12.5% - 3px),#d9d0ff calc(12.5% - 3px) 12.5%);box-shadow:0 8px 18px rgba(0,0,0,.3)}
.t-music .ic{position:absolute;font-size:36px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.3));animation:bob 3s ease-in-out infinite}
.t-music .ic:nth-of-type(2n){animation-delay:-1.5s}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes spinA{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.t-marble .m,.t-chess .knight,.t-science .atom,.t-music .ic{animation:none}.card{transition:none}}
.tips{margin:22px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px}
.tips li{background:#ffffffc7;border:1px solid var(--line);border-radius:14px;padding:9px 12px;font-size:13.5px;font-weight:700;color:var(--muted)}
footer{margin-top:22px;text-align:center;color:#8a93b8;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="moon" aria-hidden="true">🌙</div>
      <h1>Moon Mini Games<small data-en="Mini games for kids">어린이 미니 게임 모음</small></h1>
    </div>
    <div class="lang" role="group" aria-label="언어 선택 · Language" data-en-aria-label="Language · 언어 선택">
      <button type="button" data-lang="ko" lang="ko">한국어</button>
      <button type="button" data-lang="en" lang="en">English</button>
    </div>
  </header>

  <p class="hello"><b data-en="Which game do you want to play today? 🎮">오늘은 어떤 게임을 해 볼까요? 🎮</b><span data-en="Tap a card to start right away.">카드를 누르면 바로 시작해요.</span></p>

  <main class="games" id="games" aria-label="게임 목록" data-en-aria-label="Games"></main>

  <ul class="tips">
    <li data-en="🔊 Turn the sound on to hear the voice guide">🔊 소리를 켜면 음성 안내가 나와요</li>
    <li data-en="📱 Works on phones, tablets and computers">📱 휴대폰 · 태블릿 · 컴퓨터 모두 OK</li>
    <li data-en="💾 Progress is saved on this device">💾 진행 기록은 이 기기에 저장돼요</li>
  </ul>
  <footer>Moon Mini Games · 🌙<br>© 2026 Dongsun Moon. <span data-en="All rights reserved.">모든 권리 보유.</span></footer>
</div>

<script>
// To add a game: copy one entry, point `file` at the new HTML file, and fill both languages.
const GAMES=[
  {
    file:'detective_game.html',
    thumb:'<div class="thumb t-detective" aria-hidden="true"><img class="cover" src="images/cover-detective.webp" alt="" onerror="this.remove()"><div class="road"></div><span class="pin" style="left:9%;top:14%">🏙️</span><span class="pin" style="left:76%;top:62%">🍪</span><span class="pin" style="left:14%;top:64%">🐶</span><span class="glass">🔍</span><span class="hero">🕵️</span></div>',
    title:['꼬마 탐정단','Little Detectives'],
    age:['6~9세','Ages 6–9'],
    desc:['목격자의 단서를 듣고 범인을 찾아요! 동네 순찰 미니게임 7가지도 있어요.','Listen to the witness clues and catch the thief! Plus 7 patrol mini-games.'],
    tags:[['🧠 추리','🧠 Logic'],['👀 관찰력','👀 Observation'],['🗺️ 지도 탐험','🗺️ Map quest']],
    stat:()=>{const d=readSave('little-detective-v3');return d&&d.caught>0?L(`🏅 탐정 Lv.${d.level} · 해결한 사건 ${d.caught}개`,`🏅 Detective Lv.${d.level} · ${d.caught} case${d.caught===1?'':'s'} solved`):''}
  },
  {
    file:'marble_rush_3d.html',
    thumb:'<div class="thumb t-marble" aria-hidden="true"><img class="cover" src="images/cover-marble.webp" alt="" style="object-position:50% 62%" onerror="this.remove()"><div class="track"></div><span class="flag">🏁</span><span class="m" style="--c:#ff4260;left:14%;top:44%"></span><span class="m" style="--c:#ffe55b;left:33%;top:41%;--s:36px;animation-delay:-.6s"></span><span class="m" style="--c:#40eb84;left:52%;top:36%;--s:42px;animation-delay:-1.1s"></span><span class="m" style="--c:#4cb4ff;left:70%;top:33%;--s:34px;animation-delay:-1.8s"></span></div>',
    title:['마블 레이스','Marble Rush'],
    age:['누구나','All ages'],
    desc:['진짜처럼 통통 튕기는 구슬 레이스! 내 구슬을 응원하고 5경기 리그 우승에 도전해요.','Marbles really bounce! Cheer for yours and go for the 5-race league title.'],
    tags:[['🌈 6개 월드','🌈 6 worlds'],['🏆 리그전','🏆 League'],['📣 내 구슬 응원','📣 Cheer your marble']],
    stat:()=>{const m=(readSave('marbleRush.v2')||readSave('marble3dsettings'))?.mineStats;return m&&m.races>0?L(`🏆 내 구슬 우승 ${m.wins}번 / ${m.races}경기`,`🏆 Your marble won ${m.wins} of ${m.races} race${m.races===1?'':'s'}`):''}
  },
  {
    file:'chess_knights.html',
    thumb:'<div class="thumb t-chess" aria-hidden="true"><img class="cover" src="images/cover-chess.webp" alt="" onerror="this.remove()"><div class="board"></div><svg class="knight" viewBox="0 0 100 100"><defs><linearGradient id="tkG" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#fff8cf"/><stop offset=".5" stop-color="#ffd659"/><stop offset="1" stop-color="#d99a0b"/></linearGradient></defs><g fill="url(#tkG)" stroke="#7a5200" stroke-width="3.2" stroke-linejoin="round"><path d="M71 81H30Q29 67 38 59Q45 53 46 46Q40 50 33 53Q26 56 22 51Q19 47 23 42L38 27Q42 19 49 15L50 6L58 13Q74 18 76 40Q78 62 71 81Z"/><path d="M22 89Q22 81 30 81H70Q78 81 78 89V90Q78 94 74 94H26Q22 94 22 90Z"/></g><circle cx="44" cy="29" r="3.6" fill="#5c3d00"/></svg><span class="spark" style="left:14%;top:16%">⭐</span><span class="spark" style="left:78%;top:20%">👑</span><span class="spark" style="left:80%;top:66%">🪙</span></div>',
    title:['꼬마 체스 기사단','Little Chess Knights'],
    age:['6세 이상','Ages 6+'],
    desc:['체스 퍼즐을 풀고 보스를 이겨 새 지역을 열어요! 코인을 모아 체스판과 기물을 꾸며요.','Solve chess puzzles, beat the bosses and open new lands! Spend coins on boards and pieces.'],
    tags:[['♞ 체스 퍼즐','♞ Chess puzzles'],['⚔️ AI 대결','⚔️ AI battles'],['📈 레벨업','📈 Level up']],
    stat:()=>{const d=readSave('chessKnights.v1');return d&&d.solved>0?L(`♞ Lv.${d.lvl} · 퍼즐 점수 ${d.rating} · 푼 퍼즐 ${d.solved}개`,`♞ Lv.${d.lvl} · Puzzle score ${d.rating} · ${d.solved} solved`):''}
  },
  {
    file:'science_guardians.html',
    thumb:'<div class="thumb t-science" aria-hidden="true"><img class="cover" src="images/cover-science.webp" alt="" onerror="this.remove()"><div class="atom"><div class="ring" style="--r:0deg"></div><div class="ring" style="--r:60deg"></div><div class="ring" style="--r:120deg"></div></div><div class="core"></div><span class="ic" style="left:9%;top:14%">🧭</span><span class="ic" style="left:78%;top:12%">🧲</span><span class="ic" style="left:12%;top:62%">🔦</span><span class="ic" style="left:76%;top:60%">🦹</span></div>',
    title:['꼬마 과학 수호대','Little Science Guardians'],
    age:['6~11세','Ages 6–11'],
    desc:['그림자, 자석, 전기, 산과 염기, 부력, 지진, 우주, 공룡 화석까지! 과학 퀴즈와 실험으로 헷갈 박사의 악당들을 물리쳐요.','Shadows, magnets, electricity, acids and bases, buoyancy, earthquakes, space and dinosaur fossils! Beat Dr. Mix-Up’s villains with science quizzes and hands-on labs.'],
    tags:[['🔬 실험 26가지','🔬 26 labs'],['📚 과학 카드 164장','📚 164 science cards'],['🎚️ 학년별 난이도','🎚️ Grade levels']],
    stat:()=>{const r=readSave('scienceGuardians.v1'),d=r&&r.P&&r.P[r.cur];return d&&d.correct>0?L(`🔬 ${d.name} Lv.${d.lvl} · 과학 카드 ${Object.keys(d.cards||{}).length}장`,`🔬 ${d.name} Lv.${d.lvl} · ${Object.keys(d.cards||{}).length} science cards`):''}
  },
  {
    file:'music_academy.html',
    thumb:'<div class="thumb t-music" aria-hidden="true"><img class="cover" src="images/cover-music.webp" alt="" onerror="this.remove()"><div class="keys"></div><span class="ic" style="left:9%;top:12%">🎵</span><span class="ic" style="left:40%;top:6%">🎤</span><span class="ic" style="left:76%;top:12%">🥁</span><span class="ic" style="left:60%;top:34%">🎺</span><span class="ic" style="left:20%;top:36%">🎹</span></div>',
    title:['꼬마 음악 아카데미','Little Music Academy'],
    age:['6~11세','Ages 6–11'],
    desc:['박자, 피아노, 악보, 노래, 드럼, 화음, 악기까지! 여섯 선생님과 매일 조금씩 연습하고 음악 대회에서 메달을 따요.','Beat, piano, reading music, singing, drums, chords and instruments! Practice a little every day with six teachers and win medals in music contests.'],
    tags:[['🎓 레슨 62개','🎓 62 lessons'],['🏆 음악 대회','🏆 Music contests'],['🔥 매일 연습','🔥 Daily streaks']],
    stat:()=>{const r=readSave('musicAcademy.v1'),d=r&&r.P&&r.P[r.cur];return d&&d.stats&&d.stats.plays>0?L(`🎵 ${d.name} Lv.${d.lvl} · 🔥 ${d.streak.n}일 연속`,`🎵 ${d.name} Lv.${d.lvl} · 🔥 ${d.streak.n}-day streak`):''}
  }
];
const pick=pair=>L(pair[0],pair[1]);
// Each game saves its own progress in this browser; show it on the card when there is some.
const readSave=key=>{try{return JSON.parse(localStorage.getItem(key)||'null')}catch(e){return null}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.getElementById('games').innerHTML=GAMES.map(g=>`
  <a class="card" href="${esc(g.file)}?lang=${LANG}">
    ${g.thumb}
    <div class="body">
      <div class="title"><h2>${esc(pick(g.title))}</h2><span class="age">${esc(pick(g.age))}</span></div>
      <p class="desc">${esc(pick(g.desc))}</p>
      <ul class="tags">${g.tags.map(t=>`<li>${esc(pick(t))}</li>`).join('')}</ul>
      ${(s=>s?`<span class="stat">${esc(s)}</span>`:'')(g.stat?.())}
      <span class="play">▶ ${L('플레이','Play')}</span>
    </div>
  </a>`).join('');
applyLang();
document.querySelectorAll('[data-lang]').forEach(b=>{
  b.setAttribute('aria-pressed',String(b.dataset.lang===LANG));
  b.addEventListener('click',()=>{if(b.dataset.lang!==LANG)setLang(b.dataset.lang)});
});
