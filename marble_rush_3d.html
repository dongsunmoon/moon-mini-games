<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title data-en="Marble Rush">마블 레이스 | Marble Rush</title>
<script>
/* Language: ?lang=ko|en, then the saved choice, then the device language. Shared by every page on this site. */
const LANG=(()=>{let q=null,s=null;try{q=new URLSearchParams(location.search).get('lang')}catch(e){}try{s=localStorage.getItem('moonGames.lang')}catch(e){}const l=q==='ko'||q==='en'?q:s==='ko'||s==='en'?s:/^ko/i.test(navigator.language||'')?'ko':'en';if(q===l){try{localStorage.setItem('moonGames.lang',l)}catch(e){}}document.documentElement.lang=l;return l})();
const L=(ko,en)=>LANG==='en'?en:ko;
function applyLang(){if(LANG!=='en')return;document.querySelectorAll('[data-en]').forEach(el=>{el.textContent=el.dataset.en});document.querySelectorAll('[data-en-html]').forEach(el=>{el.innerHTML=el.dataset.enHtml});for(const a of ['aria-label','placeholder','title'])document.querySelectorAll('[data-en-'+a+']').forEach(el=>el.setAttribute(a,el.getAttribute('data-en-'+a)))}
function setLang(next){try{localStorage.setItem('moonGames.lang',next)}catch(e){}try{speechSynthesis.cancel()}catch(e){}const u=new URL(location.href);u.searchParams.set('lang',next);location.replace(u.href)}
function wireLangTools(){const b=document.getElementById('langBtn');if(b){b.textContent=LANG==='en'?'🌐 한국어':'🌐 English';b.setAttribute('aria-label',LANG==='en'?'한국어로 바꾸기':'Switch to English');b.addEventListener('click',()=>setLang(LANG==='en'?'ko':'en'))}const h=document.getElementById('homeLink');if(h)h.href='index.html?lang='+LANG}
</script>
<script>
/* Player profile picked on the main page. Each game keeps its save per profile ("key@profileId"),
   so players never share progress and resetting one game leaves every other game alone. */
const MGP=(()=>{let P=null;try{P=JSON.parse(localStorage.getItem('moonGames.profiles')||'null')}catch(e){}
 const me=P&&Array.isArray(P.list)&&P.list.find(x=>x&&x.id===P.cur)||null;
 if(me){const S=Storage.prototype,g=S.getItem,s=S.setItem,r=S.removeItem,own=/^(little-detective-|marbleRush\.|marble3dsettings|chessKnights\.|scienceGuardians\.|musicAcademy\.|mathAquarium\.)/,k=x=>{x=String(x);return own.test(x)&&!x.includes('@')?x+'@'+me.id:x};
  S.getItem=function(x){return g.call(this,k(x))};S.setItem=function(x,v){return s.call(this,k(x),v)};S.removeItem=function(x){return r.call(this,k(x))}}
 return {me}})();
</script>
<style>
:root{color-scheme:dark;--ink:#f4f7ff;--muted:#a9b7d2;--glass:rgba(13,25,47,.88)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#070d1b;color:var(--ink);font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}
body{background:radial-gradient(ellipse at 35% -30%,#24375d 0%,#080e1c 62%)}
button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
.hidden{display:none!important}
.app{width:min(1560px,100%);margin:auto;padding:16px 18px 26px}
.mast{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 31% 27%,#fff,#ffda74 10%,#ff7656 33%,#b738ff 64%,#2d1469);box-shadow:0 0 24px #e26cfa66}
.brand h1{margin:0;font-size:clamp(20px,2.6vw,30px);line-height:1;letter-spacing:-.6px}.brand h1 span{color:#75e9ff}
.brand p{color:var(--muted);margin:5px 0 0;font-size:12px}
.mast-tools{display:flex;align-items:center;gap:8px;margin-left:auto}
.tool-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid #3b5073;background:#121f38;color:#d7e6ff;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:800;text-decoration:none;white-space:nowrap}
.tool-btn:hover{background:#1c2c49}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px}
.panel{background:var(--glass);border:1px solid #283756;border-radius:20px;padding:16px;box-shadow:0 14px 50px #0003}
.sidebar{display:flex;flex-direction:column;gap:16px;align-self:start}
.label{font-size:12px;font-weight:800;color:#a8c0ec;letter-spacing:1px;margin:0 0 9px}
.hint{color:#8396b5;font-size:11px;margin:6px 0 0;line-height:1.45}
.maps{display:grid;gap:7px}
.map{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid #2b3b5b;background:#131e35;color:#fff;padding:6px 8px 6px 6px;border-radius:12px;min-width:0}
.map img{width:46px;height:46px;border-radius:10px;object-fit:cover;flex:0 0 46px;background:#20304e}
.map b{display:block;font-size:13px}.map small{display:block;font-size:11px;color:#b3c0d9;margin-top:2px;line-height:1.3}
.map:hover:not(:disabled){background:#1c2c49}.map.active{background:#193a4e;border-color:#55d5ff;box-shadow:inset 0 0 0 1px #55d5ff55}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{border:1px solid #3b5073;background:#1a2a47;color:#d7e6ff;border-radius:10px;padding:9px 6px;font-size:13px;font-weight:800}
.seg button.on{background:#0d6f88;border-color:#55e0ff;color:#fff}
.field-line{display:flex;justify-content:space-between;align-items:center;gap:12px}
.count-box input{background:#0c172b;color:#fff;border:1px solid #3b567d;border-radius:11px;width:74px;padding:8px;text-align:center;font-size:20px;font-weight:900}
.range{width:100%;accent-color:#65dbf8;margin:12px 0 2px}
.mine-picker{display:flex;flex-wrap:wrap;gap:7px}
.mine-chip{width:34px;height:34px;border-radius:50%;border:2px solid #ffffff55;color:#fff;font-weight:900;font-size:13px;display:grid;place-items:center;padding:0;text-shadow:0 1px 2px #000a;transition:transform .15s,box-shadow .15s}
.mine-chip.on{border-color:#fff;transform:scale(1.18);box-shadow:0 0 0 3px #ffe16b,0 0 16px #ffe16b}
.mine-chip:disabled{opacity:.55}.mine-chip.on:disabled{opacity:1}
.small-btn{border:1px solid #3b5073;background:#1a2a47;color:#d7e6ff;border-radius:9px;padding:7px 10px;font-size:12px;font-weight:700}
.names-panel{display:grid;gap:5px;margin-top:9px;max-height:280px;overflow:auto;padding-right:2px}
.names-panel label{display:flex;align-items:center;gap:7px;font-size:12px}
.names-panel .dot{width:16px;height:16px;border-radius:50%;flex:0 0 16px;border:1px solid #fff8}
.names-panel input{flex:1;min-width:0;background:#0c172b;color:#fff;border:1px solid #3b567d;border-radius:8px;padding:6px 8px;font-size:13px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid #283957;font-size:13px}
.switch{width:42px;height:25px;position:relative;border:1px solid #39496a;border-radius:99px;background:#263551;padding:0;flex:0 0 42px}
.switch:after{content:'';position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#8798b5;transition:transform .2s}
.switch.on{background:#076a83;border-color:#38d6f7}.switch.on:after{background:#fff;transform:translateX(17px)}
.voice-select{max-width:58%;min-width:0;background:#0c172b;color:#fff;border:1px solid #3b567d;border-radius:9px;padding:6px 8px;font-size:12px}
.primary{width:100%;background:linear-gradient(110deg,#54e9f0,#67a7ff);border:0;border-radius:13px;padding:15px;color:#092137;font-size:16px;font-weight:900;box-shadow:0 10px 24px #31b9fa33}
.primary:hover{filter:brightness(1.1)}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.control{border:1px solid #3b5175;border-radius:11px;background:#1a2a46;color:#eaf2ff;font-size:12px;padding:10px 5px}
.scene-panel{position:relative;min-width:0;overflow:hidden;border-radius:20px;border:1px solid #354462;height:min(76vh,860px);min-height:560px;background:#0e2046;box-shadow:0 16px 60px #0008;touch-action:manipulation}
.scene-panel canvas#scene{position:absolute;inset:0;display:block}
.rank-board{position:absolute;left:10px;top:10px;width:min(212px,46%);background:#07142cd9;border:1px solid #7284a657;border-radius:12px;padding:8px;backdrop-filter:blur(8px);pointer-events:none}
.rank-board h3{margin:0 0 5px;font-size:11px;color:#c1daf8;display:flex;justify-content:space-between;gap:6px;white-space:nowrap}
.rk{display:flex;align-items:center;gap:6px;padding:2px 4px;border-radius:6px;white-space:nowrap;font-size:12px;line-height:1.5}
.rk .no{width:24px;font-weight:900;color:#ffe16b;font-size:11px}.rk .dot{width:11px;height:11px;border-radius:50%;flex:0 0 11px;border:1px solid #fff8}
.rk .nm{overflow:hidden;text-overflow:ellipsis;flex:1}.rk .st{font-size:10px;color:#9fb6d8}
.rk.mine{background:#ffe16b2b;color:#ffe16b;font-weight:900}.rk.gap{opacity:.6;font-size:10px;justify-content:center}
.minimap{position:absolute;right:10px;top:54px;height:calc(100% - 146px);width:54px;border-radius:12px;background:#07142ccc;border:1px solid #7284a657}
.hud-tools{position:absolute;right:10px;top:10px;display:flex;gap:6px}
.mini-btn{border:1px solid #99b4d16c;border-radius:10px;color:#fff;background:#102542e6;padding:8px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.race-dots{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;align-items:center;gap:5px;background:#07142cd9;border:1px solid #7284a657;border-radius:999px;padding:5px 10px;font-weight:900;font-size:12px;white-space:nowrap}
.race-dots i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:2px solid #9fb6d8;color:#9fb6d8;font-size:11px}
.race-dots i.done{background:#9fb6d8;color:#07142c}.race-dots i.now{background:#fff;border-color:#fff;color:#07142c;box-shadow:0 0 10px #fff}
.section-chip{position:absolute;left:50%;top:46px;transform:translateX(-50%);padding:6px 12px;border:1px solid #a4f9ff80;background:#091d3dd9;border-radius:999px;color:#d9faff;font-size:12px;font-weight:900;white-space:nowrap;pointer-events:none}
.event-flash{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%) scale(.85);font-size:clamp(20px,3.6vw,38px);white-space:nowrap;font-weight:1000;color:#fff;text-shadow:0 3px 4px #071029,0 0 22px #2cf9ef;opacity:0;pointer-events:none;transition:transform .2s,opacity .2s;z-index:3}
.event-flash.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.slowmo{position:absolute;top:96px;left:50%;transform:translateX(-50%);font-weight:1000;letter-spacing:2px;color:#fff;background:#e2394fdd;padding:5px 12px;border-radius:8px;font-size:13px;pointer-events:none}
.start-banner{position:absolute;top:56%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;width:90%}
.start-banner h2{margin:0;font-size:clamp(40px,7vw,90px);text-shadow:0 6px 0 #121729,0 0 30px #81f8ff;letter-spacing:-1px}
.start-banner p{font-size:15px;font-weight:800;text-shadow:0 2px 6px #000;margin:6px 0 0}
.cheer-btn{position:absolute;right:74px;bottom:92px;z-index:4;border:0;border-radius:999px;padding:13px 18px;min-height:50px;font-size:16px;font-weight:1000;color:#3b1d00;background:linear-gradient(135deg,#ffe16b,#ff9f43);box-shadow:0 8px 22px #ff9f4366;touch-action:manipulation}
.cheer-btn:active:not(:disabled){transform:scale(.94)}.cheer-btn.pop{animation:cheerPop .35s}
@keyframes cheerPop{50%{transform:scale(1.16) rotate(-4deg)}}
.subtitle{position:absolute;bottom:10px;left:10px;right:10px;min-height:62px;display:flex;align-items:center;justify-content:center;gap:9px;background:#081427de;border:1px solid #5b85a66a;border-radius:14px;padding:9px 16px;text-align:center;backdrop-filter:blur(10px);font-size:clamp(12px,1.7vw,16px);font-weight:800;line-height:1.5}
.subtitle .speaker{font-size:20px}
.result-overlay{position:absolute;inset:0;background:#061326c4;backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:14px;z-index:6;overflow:auto}
.result-card{width:min(520px,100%);max-height:100%;overflow:auto;background:linear-gradient(155deg,#1b3157,#0e1a30);border:1px solid #7cc9eb9c;border-radius:24px;padding:22px;text-align:center;box-shadow:0 15px 90px #000a}
.result-card h2{font-size:20px;margin:2px 0 8px}
.trophy{font-size:56px;filter:drop-shadow(0 0 18px #ffe48377);animation:bounce 1.1s infinite alternate}
@keyframes bounce{to{transform:translateY(-8px) rotate(-5deg)}}
.champ{width:70px;height:70px;border-radius:50%;margin:10px auto;border:3px solid #ffffffa1;box-shadow:inset -14px -16px 16px #0006,inset 9px 9px 13px #fff8,0 0 26px var(--c,#fff);display:grid;place-items:center;font-weight:900;font-size:22px}
.win-text{font-size:23px;font-weight:900;margin:4px 0 2px}.win-sub{font-size:12px;color:#afc2e1;margin:0 0 10px}
.mine-result{margin:4px 0 10px;font-size:15px;font-weight:900;color:#ffe16b;line-height:1.45}.mine-stats{display:block;font-size:11px;color:#afc2e1;font-weight:700;margin-top:3px}
.photo{display:inline-block;background:#fff;color:#0b1a33;border-radius:8px;padding:3px 9px;font-weight:1000;font-size:12px;margin-bottom:6px}
.standings{width:100%;border-collapse:collapse;margin:10px 0 14px;font-size:13px}
.standings th{font-size:11px;color:#9fb6d8;font-weight:800;padding:4px}.standings td{padding:5px 4px;border-top:1px solid #2a3d63}
.standings td.nm{text-align:left}.standings .dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1px solid #fff8}
.standings tr.mine td{color:#ffe16b;font-weight:900}.standings td.pts{color:#7df9c8;font-weight:900}.standings td.tot{font-weight:900}
.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.result-actions.one{grid-template-columns:1fr}
.result-actions button{padding:13px 8px;font-size:14px}
.confetti-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:7}
.confetti{position:absolute;top:-25px;width:8px;height:16px;border-radius:2px;animation:fall var(--d,3s) linear var(--dl,0s) forwards}
@keyframes fall{to{transform:translate(var(--sx,30px),110vh) rotate(850deg);opacity:.4}}
.footer-note{text-align:center;color:#7f90b0;font-size:11px;margin:14px 0 0}
@media(max-width:860px){.app{padding:10px}.layout{grid-template-columns:1fr;gap:12px}.sidebar{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}.map-section,.mine-section,.action-section,.mode-section{grid-column:1/-1}.maps{display:flex;overflow-x:auto;padding-bottom:4px}.map{min-width:160px;flex:0 0 160px}.scene-panel{height:66vh;min-height:430px}}
@media(max-width:860px) and (max-height:520px) and (orientation:landscape){.scene-panel{height:calc(100dvh - 16px);min-height:0}.rank-board{width:150px;padding:6px}.rk{font-size:11px}.rk .st{display:none}.subtitle{min-height:40px;font-size:12px;padding:6px 10px}}
@media(max-width:520px){.top-pill{display:none}.brand p{font-size:10px}.scene-panel{height:64vh;min-height:400px;border-radius:15px}.rank-board{width:142px;padding:6px}.rk{font-size:11px}.rk .st{display:none}.minimap{width:40px;top:50px;height:calc(100% - 134px)}.cheer-btn{right:56px;bottom:84px;padding:10px 14px;min-height:44px;font-size:14px}.subtitle{min-height:52px;font-size:12px;padding:7px 10px}.race-dots{top:auto;bottom:100px;font-size:10px}.race-dots i{width:18px;height:18px}.mini-btn{padding:7px 8px;font-size:11px}.mine-chip{width:31px;height:31px;font-size:12px}}
</style>
</head>
<body>
<div class="app">
 <div class="mast">
  <div class="brand"><div class="logo"></div><div><h1>MARBLE <span>RUSH</span></h1><p data-en="Real bouncing marbles · A new winner every race!">진짜처럼 튕기는 구슬 레이스 · 매번 새로운 우승자!</p></div></div>
  <div class="mast-tools"><a class="tool-btn" id="homeLink" href="index.html">🏠 <span data-en="All games">게임 목록</span></a><button class="tool-btn" id="langBtn" type="button">🌐 English</button></div>
 </div>
 <div class="layout">
  <aside class="panel sidebar">
   <section class="map-section"><h2 class="label" data-en="🌎 Choose a world">🌎 레이스 월드</h2><div class="maps" id="maps"></div></section>
   <section class="mode-section"><h2 class="label" data-en="🏆 Race type">🏆 경기 방식</h2><div class="seg" id="modeSeg"><button type="button" data-mode="single" data-en="Single race">단판 경기</button><button type="button" data-mode="league" data-en="League · 5 races">리그 5경기</button></div><p class="hint" id="leagueInfo"></p></section>
   <section><div class="field-line"><h2 class="label" style="margin:0" data-en="🔮 Marbles">🔮 출전하는 공</h2><div class="count-box"><input id="ballCount" aria-label="공 개수" data-en-aria-label="Number of marbles" type="number" min="2" max="16" value="8"></div></div><input id="ballRange" class="range" aria-label="공 개수 조절" data-en-aria-label="Adjust the number of marbles" type="range" min="2" max="16" value="8"></section>
   <section class="mine-section"><h2 class="label" data-en="💖 Pick your marble">💖 응원할 내 구슬</h2><div class="mine-picker" id="minePicker"></div>
    <p class="hint" data-en="During the race, press 📣 Cheer to give it a push (3 times)!">레이스 중 📣 응원 버튼으로 3번 힘을 줄 수 있어요!</p>
    <button type="button" class="small-btn" id="namesBtn" style="margin-top:9px" data-en="✏️ Name the marbles">✏️ 구슬 이름 짓기</button><div class="names-panel hidden" id="namesPanel"></div></section>
   <section><h2 class="label" data-en="🎙️ Race settings">🎙️ 경기 설정</h2>
    <div class="toggle-row"><span data-en="Voice commentary">음성 중계</span><button class="switch on" id="voiceToggle" type="button" aria-label="음성 중계 켜기 끄기" data-en-aria-label="Turn voice commentary on or off"></button></div>
    <div class="toggle-row"><span data-en="Voice">목소리</span><select id="voiceSelect" class="voice-select" aria-label="중계 목소리 고르기" data-en-aria-label="Choose the announcer voice"></select></div>
    <div class="toggle-row"><span data-en="Sound effects">효과음</span><button class="switch on" id="sfxToggle" type="button" aria-label="효과음 켜기 끄기" data-en-aria-label="Turn sound effects on or off"></button></div>
    <div class="toggle-row"><span data-en="Stop the voice now">중계 음성 멈추기</span><button class="small-btn" id="stopVoice" type="button" data-en="🔇 Stop">🔇 멈추기</button></div></section>
   <section class="action-section"><button class="primary" id="startBtn" type="button">🏁 레이스 시작!</button><div class="controls"><button class="control" id="pauseBtn" type="button" disabled>⏸ 일시정지</button><button class="control" id="resetBtn" type="button" data-en="↻ Reset">↻ 다시 준비</button></div>
    <p class="hint" data-en="Keys: Space = pause · C = cheer · V = camera">단축키: 스페이스 = 일시정지 · C = 응원 · V = 카메라</p></section>
  </aside>
  <main class="scene-panel" id="scenePanel">
   <canvas id="scene" aria-label="마블 레이스 경기장" data-en-aria-label="Marble race track"></canvas>
   <div class="rank-board" id="rankBoard"></div>
   <canvas id="minimap" class="minimap" aria-label="전체 코스 지도" data-en-aria-label="Course map"></canvas>
   <div class="hud-tools"><button class="mini-btn" id="cameraBtn" type="button">🎥</button><button class="mini-btn" id="speedBtn" type="button">⚡ 1×</button></div>
   <div class="race-dots hidden" id="raceDots"></div>
   <div class="section-chip" id="sectionChip"></div>
   <div class="slowmo hidden" id="slowmo" data-en="🎬 SLOW MOTION">🎬 슬로모션</div>
   <div class="event-flash" id="eventFlash"></div>
   <div class="start-banner" id="startBanner"></div>
   <button class="cheer-btn hidden" id="cheerBtn" type="button">📣</button>
   <div class="subtitle" aria-live="polite"><span class="speaker">🎙️</span><span id="caption"></span></div>
   <div class="result-overlay hidden" id="resultOverlay"><div class="result-card" id="resultCard"></div></div>
   <div id="confettiLayer" class="confetti-layer"></div>

<script>
(()=>{'use strict';

/*SIM-START*/
// Marble-run physics: circles (marbles) against thick line segments, pegs/bumpers and rotating spinner arms.
// World units are pixels at zoom 1; y grows downward. No DOM access so it can be tested headless.
const Sim=(()=>{
const W=720,R=9,T=5,G=1500,LW=30,RW=690,TAU=Math.PI*2,MAXV=1050,SUB=1/240,CELL=48;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function build(mods,rng){

 const shapes=[],segs=[],pegs=[],spinners=[],decor=[],guide=[],sections=[],slots=[];
 let y=0,x=0,gate=null,finishY=0,finishX=0,chute=null;
 const poly=(pts,o={})=>{
  const s={pts,style:o.style||'track',e:o.e??.3,k:o.k??.6,boost:o.boost||null,on:true,tint:o.tint};
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const [px,py] of pts){x0=Math.min(x0,px);y0=Math.min(y0,py);x1=Math.max(x1,px);y1=Math.max(y1,py)}

 const panel=(x0,y0,x1,y1)=>decor.push({t:'panel',x0,y0,x1,y1});
 const unit=(dx,dy)=>{const l=Math.hypot(dx,dy)||1;return [dx/l,dy/l]};
 // funnel walls from the frame to an opening at xo; the last 46px are steep so marbles never arch over the neck
 function hopper(xo,yt,h){poly([[LW,yt],[xo-46,yt+h],[xo-18,yt+h+52]]);poly([[RW,yt],[xo+46,yt+h],[xo+18,yt+h+52]]);return yt+h+52}
 // funnel everything above into an opening centred at xo
 function collect(xo){const h=Math.max(30,.42*Math.max(xo-46-LW,RW-(xo+46)));const yb=hopper(xo,y,h);gp(x,y);gp(xo,yb);y=yb+14;x=xo}
 function start(){
  sec('start');const sy=60,shelfY=xx=>sy+40+(xx-LW)*.07;
  panel(LW,sy-60,RW,shelfY(640)+40);
  poly([[LW,shelfY(LW)],[640,shelfY(640)]]);
  gate=poly([[456,sy+4],[456,shelfY(456)-2]],{style:'gate'});
  decor.push({t:'sign',x:250,y:sy-22,text:'START'});
  for(let i=0;i<16;i++){const sx=456-T-R-1.5-i*(2*R+1);slots.push([sx,shelfY(sx)-T-R-.5])}
  gp(150,shelfY(150)-14);gp(640,shelfY(640)-14);

 }
 function ramps(n,boostIdx,wash){
  sec(wash?'wash':'ramps');const top=y;let dir=x>W/2?-1:1;
  for(let i=0;i<n;i++){
   const hx=dir>0?LW:RW,lx=dir>0?RW-52:LW+52,y0=y+18,len=Math.abs(lx-hx),drop=wash?Math.floor((len-2)/40)*(40*.06+10)+12:.11*len,y1=y0+drop;
   let pts;
   if(wash){pts=[[hx,y0]];const step=38,rise=10;let px=hx,py=y0;while(Math.abs(lx-px)>step+2){px+=dir*step;py+=step*.06;pts.push([px,py]);py+=rise;pts.push([px+dir*2,py])}pts.push([lx,py+Math.abs(lx-px)*.06])}
   else pts=[[hx,y0],[lx,y1]];
   const [ux,uy]=unit(lx-hx,drop);
   poly(pts,i===boostIdx?{style:'boost',boost:{ux,uy,acc:900,max:600}}:{style:wash?'wash':'track'});
   gp(hx+dir*24,y0-14);gp(lx,y1-14);
   y=y1+34;dir=-dir;
  }

  const yb=top+40+rows*sp,xo=[200,360,520][Math.floor(rng()*3)],h=Math.max(30,.4*Math.max(xo-46-LW,RW-(xo+46))),ye=hopper(xo,yb,h);

 function zigzag(){
  sec('zigzag');collect(360);const top=y,n=6,sp=56,xl=232,xr=488;
  poly([[xl,top-6],[xl,top+n*sp+30]]);poly([[xr,top-6],[xr,top+n*sp+30]]);
  for(let k=0;k<n;k++){const yy=top+24+k*sp;if(k%2===0){poly([[xl,yy],[xr-68,yy+20]],{style:'shelf'});gp(xl+40,yy-14);gp(xr-60,yy+6)}else{poly([[xr,yy],[xl+68,yy+20]],{style:'shelf'});gp(xr-40,yy-14);gp(xl+60,yy+6)}}

  sec('funnels');const Rb=165,A=62*Math.PI/180,ah=Math.asin(17/Rb),st=3.5*Math.PI/180;

   const cy=top-Rb*Math.cos(A),bottom=cy+Rb,left=[],right=[];
   for(let a=A;a>ah;a-=st)left.push([bx-Rb*Math.sin(a),cy+Rb*Math.cos(a)]);left.push([bx-Rb*Math.sin(ah),cy+Rb*Math.cos(ah)]);
   for(let a=ah;a<A;a+=st)right.push([bx+Rb*Math.sin(a),cy+Rb*Math.cos(a)]);right.push([bx+Rb*Math.sin(A),cy+Rb*Math.cos(A)]);
   const rl=left[0],rr=right[right.length-1];
   poly([[rl[0]-8,rl[1]-40],...left],{style:'bowl',e:.25,k:.3});poly([...right,[rr[0]+8,rr[1]-40]],{style:'bowl',e:.25,k:.3});
   decor.push({t:'bowl',cx:bx,cy,Rb,A,ah,n:i+1});
   const nb=bx+(i%2?sd:-sd)*90;
   gp(bx+(nb>bx?-1:1)*100,top+20);gp(bx,bottom-12);
   if(i<k-1){top=bottom+60;bx=nb}else{y=bottom+40;x=bx}
  }
 }
 function spinnerShaft(){
  sec('spinner');collect(360);const top=y,xl=250,xr=470,H=330,s=rng()<.5?1:-1;
  poly([[xl,top-6],[xl,top+H]]);poly([[xr,top-6],[xr,top+H]]);
  spinners.push({x:360,y:top+95,len:80,arms:4,w:1.7*s,a0:rng()*TAU,e:.4},{x:360,y:top+235,len:80,arms:4,w:-1.9*s,a0:rng()*TAU,e:.4});
  panel(xl-22,top-10,xr+22,top+H+10);gp(360,top);gp(360,top+H);
  y=top+H+8;x=360;
 }
 function bumperField(){
  sec('bumpers');const top=y;
  for(const [bx,by] of [[190,70],[360,46],[530,70],[275,162],[445,162],[360,254]])pegs.push({x:bx+(rng()-.5)*20,y:top+by,r:19,e:1.05,kind:'bumper',flash:-9});
  poly([[LW,top+112],[LW+72,top+176]],{style:'sling',e:.9});poly([[RW,top+112],[RW-72,top+176]],{style:'sling',e:.9});
  const yb=top+306,xo=rng()<.5?220:500,h=Math.max(30,.4*Math.max(xo-46-LW,RW-(xo+46))),ye=hopper(xo,yb,h);
  panel(LW,top,RW,ye+10);gp(x,top);gp(360,top+150);gp(xo,ye);
  x=xo;y=ye+16;
 }
 function split(){
  sec('split');collect(360);const top=y,H=300,pl=338,pr=382;
  poly([[pl,top+50],[360,top+12],[pr,top+50]],{style:'shelf'});
  poly([[pl,top+50],[pl,top+H]]);poly([[pr,top+50],[pr,top+H]]);
  for(let k=0;k<3;k++){const yy=top+84+k*70;if(k%2===0)poly([[pl,yy],[LW+58,yy+22]],{style:'shelf'});else poly([[LW,yy],[pl-58,yy+22]],{style:'shelf'})}
  poly([[pr,top+66],[pr+70,top+84]],{style:'shelf'});
  for(let r=0;r<5;r++){const py=top+122+r*40,off=r%2?24:0;for(let px=pr+52+off;px<RW-22;px+=48)pegs.push({x:px+(rng()-.5)*4,y:py,r:5,e:.45,kind:'peg'})}
  const yb=top+H+8,h=Math.max(30,.42*(360-46-LW)),ye=hopper(360,yb,h);

  x=360;y=ye+16;

  // single-file tube that bends smoothly into a numbered results lane (no sharp corner to jam in)
  sec('finish');collect(120);const yf=y+12,cx=142,cy=yf+20,rc=22,half=16,sl=.1,end=604;
  const arc=(r,a0,a1)=>{const p=[];for(let i=0;i<=8;i++){const a=a0+(a1-a0)*i/8;p.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r])}return p};
  const fl=xx=>cy+rc+half+(xx-cx)*sl;
  poly([[104,y-14],...arc(rc+half,Math.PI,Math.PI/2),[end,fl(end)]]);
  poly([[136,y-14],...arc(rc-half,Math.PI,Math.PI/2),[end,fl(end)-2*half]],{style:'glass'});
  poly([[end,fl(end)-2*half-2],[end,fl(end)+2]]);

  const cs=[];for(let k=0;k<24;k++){const sx=end-T-R-.5-k*(2*R+.5);cs.push([sx,fl(sx)-T-R])}

  decor.push({t:'finish',x:120,y:yf});
  gp(120,yf-30);gp(120,cy);gp(cx,cy+rc);gp(end-10,fl(end-10)-14);

 const MOD={ramps2:()=>ramps(2,-1),ramps3:()=>ramps(3,-1),ramps2b:()=>ramps(2,1),ramps3b:()=>ramps(3,1),wash2:()=>ramps(2,-1,true),
  pegs:pegField,zigzag,funnels2:()=>funnels(2),funnels3:()=>funnels(3),funnels4:()=>funnels(4),spinner:spinnerShaft,bumpers:bumperField,split};
 start();for(const m of mods)MOD[m]();finish();
 const H=y;
 poly([[LW,-400],[LW,H]],{style:'frame'});poly([[RW,-400],[RW,H]],{style:'frame'});poly([[LW,H],[RW,H]],{style:'frame'});
 // guide polyline with cumulative length, used for ranking and the minimap
 const cum=[0];for(let i=1;i<guide.length;i++)cum.push(cum[i-1]+Math.hypot(guide[i][0]-guide[i-1][0],guide[i][1]-guide[i-1][1]));

 const grid=new Map(),add=(k,o)=>{let a=grid.get(k);if(!a)grid.set(k,a=[]);a.push(o)},reach=R+T+2;
 for(const s of segs){const x0=Math.min(s.ax,s.ax+s.dx)-reach,x1=Math.max(s.ax,s.ax+s.dx)+reach,y0=Math.min(s.ay,s.ay+s.dy)-reach,y1=Math.max(s.ay,s.ay+s.dy)+reach;
  for(let cx=Math.floor(x0/CELL);cx<=Math.floor(x1/CELL);cx++)for(let cy=Math.floor(y0/CELL);cy<=Math.floor(y1/CELL);cy++)add(cx+','+cy,s)}
 for(const p of pegs){const rr=p.r+R+2;for(let cx=Math.floor((p.x-rr)/CELL);cx<=Math.floor((p.x+rr)/CELL);cx++)for(let cy=Math.floor((p.y-rr)/CELL);cy<=Math.floor((p.y+rr)/CELL);cy++)add(cx+','+cy,p)}

}

function createState(course,n,order){
 const marbles=[];
 for(let i=0;i<n;i++){const [sx,sy]=course.slots[order[i]];marbles.push({id:i,x:sx,y:sy,vx:0,vy:0,ang:Math.random()*TAU,done:false,finishTime:0,progress:0,gi:0,bestP:0,lastGain:0,stuck:0,nudges:0,rescues:0,boosted:-9})}
 return {course,marbles,t:0,finishers:[],events:[],gateOpen:false};
}
function openGate(st){st.course.gate.on=false;st.gateOpen=true;st.gateT=st.t;for(const m of st.marbles){m.lastGain=st.t}}

function hitSeg(m,s,h,st){
 const sh=s.shape;if(!sh.on)return;
 const t=clamp(((m.x-s.ax)*s.dx+(m.y-s.ay)*s.dy)/s.len2,0,1),px=s.ax+t*s.dx,py=s.ay+t*s.dy;
 let nx=m.x-px,ny=m.y-py;const d2=nx*nx+ny*ny,rr=R+T;if(d2>=rr*rr)return;
 const d=Math.sqrt(d2)||1e-6;nx/=d;ny/=d;m.x+=nx*(rr-d);m.y+=ny*(rr-d);
 const vn=m.vx*nx+m.vy*ny;
 if(vn<0){m.vx-=(1+sh.e)*vn*nx;m.vy-=(1+sh.e)*vn*ny;if(vn<-260)st.events.push({t:'hit',x:px,y:py,v:-vn,id:m.id})}
 const tx=-ny,ty=nx,vt=m.vx*tx+m.vy*ty,dec=vt*(1-Math.exp(-sh.k*h));m.vx-=tx*dec;m.vy-=ty*dec;
 if(sh.boost){const b=sh.boost;if(m.vx*b.ux+m.vy*b.uy<b.max){m.vx+=b.ux*b.acc*h;m.vy+=b.uy*b.acc*h}if(st.t-m.boosted>1.5)st.events.push({t:'boost',id:m.id,x:m.x,y:m.y});m.boosted=st.t}
}
function hitPeg(m,p,st){
 let nx=m.x-p.x,ny=m.y-p.y;const d2=nx*nx+ny*ny,rr=R+p.r;if(d2>=rr*rr)return;
 const d=Math.sqrt(d2)||1e-6;nx/=d;ny/=d;m.x=p.x+nx*rr;m.y=p.y+ny*rr;
 const vn=m.vx*nx+m.vy*ny;
 if(vn<0){m.vx-=(1+p.e)*vn*nx;m.vy-=(1+p.e)*vn*ny;
  if(p.kind==='bumper'){const out=m.vx*nx+m.vy*ny;if(out<300){m.vx+=nx*(300-out);m.vy+=ny*(300-out)}p.flash=st.t;st.events.push({t:'bumper',x:p.x,y:p.y,id:m.id})}
  else if(vn<-260)st.events.push({t:'hit',x:m.x-nx*R,y:m.y-ny*R,v:-vn,id:m.id})}
 else{const tx=-ny,ty=nx,vt=m.vx*tx+m.vy*ty;m.vx-=tx*vt*.002;m.vy-=ty*vt*.002}
}
function spinnerArms(sp,t){const a=[];for(let k=0;k<sp.arms;k++){const th=sp.a0+sp.w*t+k*TAU/sp.arms;a.push([sp.x+Math.cos(th)*sp.len,sp.y+Math.sin(th)*sp.len])}return a}
function hitSpinner(m,sp,st){
 const reach=sp.len+R+6;if(Math.abs(m.x-sp.x)>reach||Math.abs(m.y-sp.y)>reach)return;
 hitPeg(m,{x:sp.x,y:sp.y,r:10,e:sp.e,kind:'hub'},st);
 for(const [ex,ey] of spinnerArms(sp,st.t)){
  const dx=ex-sp.x,dy=ey-sp.y,t=clamp(((m.x-sp.x)*dx+(m.y-sp.y)*dy)/(dx*dx+dy*dy),0,1),px=sp.x+t*dx,py=sp.y+t*dy;
  let nx=m.x-px,ny=m.y-py;const d2=nx*nx+ny*ny,rr=R+4;if(d2>=rr*rr)continue;
  const d=Math.sqrt(d2)||1e-6;nx/=d;ny/=d;m.x+=nx*(rr-d);m.y+=ny*(rr-d);
  const svx=-sp.w*(py-sp.y),svy=sp.w*(px-sp.x),vn=(m.vx-svx)*nx+(m.vy-svy)*ny;
  if(vn<0){m.vx-=(1+sp.e)*vn*nx;m.vy-=(1+sp.e)*vn*ny;if(vn<-200)st.events.push({t:'hit',x:px,y:py,v:-vn,id:m.id})}
 }
}
function substep(st,h){
 const ms=st.marbles,c=st.course;st.t+=h;
 for(const m of ms){m.vy+=G*h;const f=1-.05*h;m.vx*=f;m.vy*=f;const sp=Math.hypot(m.vx,m.vy);if(sp>MAXV){m.vx*=MAXV/sp;m.vy*=MAXV/sp}m.x+=m.vx*h;m.y+=m.vy*h;m.ang+=m.vx*h/R}
 for(let i=0;i<ms.length;i++)for(let j=i+1;j<ms.length;j++){const a=ms[i],b=ms[j],dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;
  if(d2<4*R*R&&d2>1e-9){const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,p=(2*R-d)/2;a.x-=nx*p;a.y-=ny*p;b.x+=nx*p;b.y+=ny*p;
   const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rv<0){const jj=-1.6*rv/2;a.vx-=jj*nx;a.vy-=jj*ny;b.vx+=jj*nx;b.vy+=jj*ny;if(rv<-220)st.events.push({t:'clack',x:(a.x+b.x)/2,y:(a.y+b.y)/2,v:-rv})}}}

  const list=c.grid.get(Math.floor(m.x/CELL)+','+Math.floor(m.y/CELL));
  if(list)for(const o of list){if(o.shape)hitSeg(m,o,h,st);else hitPeg(m,o,st)}

}
function updateProgress(st){
 const c=st.course,g=c.guide,cum=c.cum;
 for(const m of st.marbles){
  if(m.done)continue;
  let best=1e18,bi=m.gi,bt=0;
  for(let i=Math.max(0,m.gi-2);i<=Math.min(g.length-2,m.gi+10);i++){
   const [ax,ay]=g[i],dx=g[i+1][0]-ax,dy=g[i+1][1]-ay,l2=dx*dx+dy*dy||1,t=clamp(((m.x-ax)*dx+(m.y-ay)*dy)/l2,0,1),ex=ax+t*dx-m.x,ey=ay+t*dy-m.y,d=ex*ex+ey*ey;

   const idle=st.t-m.lastGain,slow=Math.hypot(m.vx,m.vy)<25,blocked=st.marbles.some(o=>o!==m&&!o.done&&(o.x-m.x)**2+(o.y-m.y)**2<(2*R+3)**2);
   if(idle>9&&!blocked){const target=m.progress+60;let k=m.gi;while(k<g.length-2&&cum[k+1]<target)k++;m.x=g[k][0];m.y=g[k][1]-4;m.vx=0;m.vy=0;m.lastGain=st.t;m.rescues++;st.events.push({t:'rescue',id:m.id})}
   else if(idle>3.2&&slow&&(!blocked||idle>4.5)&&st.t-(m.lastNudge||0)>1.5){m.vx+=(Math.random()-.5)*160;m.vy-=110;m.lastNudge=st.t;m.nudges++}

}
function step(st,dt){const n=Math.max(1,Math.ceil(dt/SUB)),h=dt/n;for(let i=0;i<n;i++)substep(st,h);updateProgress(st)}
function ranking(st){return st.marbles.slice().sort((a,b)=>a.done&&b.done?a.finishTime-b.finishTime:a.done?-1:b.done?1:b.progress-a.progress)}
return {W,R,T,LW,RW,build,createState,openGate,step,ranking,spinnerArms};
})();
/*SIM-END*/

const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const ord=n=>n+(n%100>=11&&n%100<=13?'th':['th','st','nd','rd'][n%10]||'th');
const TAU=Math.PI*2,R=Sim.R;
const hex=h=>{const n=parseInt(h.slice(1),16);return [n>>16,n>>8&255,n&255]};

 const vy0=(cam.y-vh/2/cam.z)*sy,vy1=(cam.y+vh/2/cam.z)*sy;mctx.strokeStyle='rgba(255,255,255,.75)';mctx.lineWidth=1.2;mctx.strokeRect(-3,vy0,w-4,Math.max(6,vy1-vy0));
 for(const m of st.marbles){if(m.id===mine)continue;mctx.fillStyle=PALETTE[m.id][1];mctx.beginPath();mctx.arc(m.x*sx,m.y*sy,2.6,0,TAU);mctx.fill()}
 const me=st.marbles[mine];if(me){mctx.fillStyle=PALETTE[mine][1];mctx.strokeStyle='#ffe16b';mctx.lineWidth=2;mctx.beginPath();mctx.arc(me.x*sx,me.y*sy,4.2,0,TAU);mctx.fill();mctx.stroke()}
}

// ---------------------------------------------------------------- HUD
function updateHud(force){
 if(!force&&clock-lastHud<.25)return;lastHud=clock;
 const rank=Sim.ranking(st),n=rank.length,show=window.innerWidth<=520||window.innerHeight<=520?(window.innerHeight<=420?3:5):8;let rows='';
 const row=(m,i)=>`<div class="rk${m.id===mine?' mine':''}"><span class="no">${i<3&&(phase!=='ready'&&phase!=='countdown')?['🥇','🥈','🥉'][i]:i+1}</span><span class="dot" style="background:${PALETTE[m.id][1]}"></span><span class="nm">${esc(nameOf(m.id))}${m.id===mine?' ⭐':''}</span><span class="st">${m.done?'🏁':''}</span></div>`;
 rank.slice(0,show).forEach((m,i)=>rows+=row(m,i));
 const mi=rank.findIndex(m=>m.id===mine);if(mi>=show){rows+=`<div class="rk gap">⋯</div>`+row(rank[mi],mi)}
 const title=phase==='ready'||phase==='countdown'?L('🚦 출발 순서','🚦 Lineup'):L('🏆 실시간 순위','🏆 Live ranking');
 $('rankBoard').innerHTML=`<h3><span>${title}</span><span style="color:#56f7da">${leadChanges?L(`역전 ${leadChanges}회`,`${leadChanges} lead change${leadChanges===1?'':'s'}`):''}</span></h3>${rows}`;
 const s=course.sections[Math.max(0,secIdx)]||course.sections[0],[em,lab]=SECTION[s.type];
 $('sectionChip').textContent=`${theme.name} · ${em} ${lab} · ${Math.max(1,secIdx+1)}/${course.sections.length}`;
 $('sectionChip').classList.toggle('hidden',vw<640);
}
function updateLeagueUI(){
 const dots=$('raceDots'),info=$('leagueInfo');
 if(mode==='league'&&league&&!league.done){dots.classList.remove('hidden');dots.innerHTML='RACE '+Array.from({length:LEAGUE_RACES},(_,i)=>`<i class="${i+1<league.race?'done':i+1===league.race?'now':''}">${i+1}</i>`).join('');
  info.textContent=L(`${league.race}/${LEAGUE_RACES}경기 · ${WORLDS[league.worlds[league.race-1]].name} · 1~6등에게 ${POINTS.join('·')}점`,`Race ${league.race}/${LEAGUE_RACES} · ${WORLDS[league.worlds[league.race-1]].name} · Top 6 get ${POINTS.join('·')} points`)}
 else{dots.classList.toggle('hidden',mode!=='league');if(mode==='league')dots.innerHTML='RACE '+Array.from({length:LEAGUE_RACES},(_,i)=>`<i>${i+1}</i>`).join('');info.textContent=mode==='league'?L(`5경기를 치러 점수를 합산해요. 1~6등에게 ${POINTS.join('·')}점!`,`Five races, points add up. Top 6 get ${POINTS.join('·')} points!`):L('한 경기로 우승자를 가려요.','One race decides the winner.')}
 document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.mode===mode));
}
function setControls(){
 const running=phase==='running'||phase==='countdown';
 $('startBtn').textContent=mode==='league'&&league&&!league.done&&phase!=='running'?L(`🏁 ${league.race}경기 시작!`,`🏁 Start race ${league.race}!`):running?L('🏁 새 레이스','🏁 New race'):L('🏁 레이스 시작!','🏁 Start race!');
 $('pauseBtn').disabled=phase!=='running';$('pauseBtn').textContent=paused?L('▶ 이어하기','▶ Resume'):L('⏸ 일시정지','⏸ Pause');
 $('voiceToggle').classList.toggle('on',voiceOn);$('sfxToggle').classList.toggle('on',sfxOn);
 $('ballCount').value=numBalls;$('ballRange').value=numBalls;
 const cb=$('cheerBtn');cb.classList.toggle('hidden',phase!=='running');cb.disabled=cheersLeft<=0||paused||!!st?.marbles[mine]?.done;cb.textContent=L(`📣 응원! ×${cheersLeft}`,`📣 Cheer! ×${cheersLeft}`);
 $('cameraBtn').textContent=[L('🎥 자동','🎥 Auto'),L('⭐ 내 구슬','⭐ Mine'),L('🗺️ 전체','🗺️ All')][cam.mode];
 $('speedBtn').textContent=`⚡ ${raceRate}×`;
 const lock=running||(mode==='league'&&league&&!league.done&&league.race>1);
 document.querySelectorAll('#minePicker button').forEach(b=>b.disabled=running);
 $('ballCount').disabled=$('ballRange').disabled=!!lock;
 document.querySelectorAll('#maps .map').forEach(b=>b.disabled=running||mode==='league');
 document.querySelectorAll('#modeSeg button').forEach(b=>b.disabled=running);
}
function renderMaps(){
 $('maps').innerHTML=WORLDS.map((w,i)=>`<button type="button" class="map${i===raceWorld?' active':''}" data-world="${i}"><img src="images/world-${w.id}.webp" alt="" onerror="this.style.visibility='hidden'"><span><b>${esc(w.name)}</b><small>${esc(w.desc)}</small></span></button>`).join('');
}
function renderMinePicker(){if(mine>=numBalls)mine=numBalls-1;$('minePicker').innerHTML=PALETTE.slice(0,numBalls).map((c,i)=>`<button type="button" class="mine-chip${i===mine?' on':''}" data-mine="${i}" title="${esc(nameOf(i))}" style="background:radial-gradient(circle at 32% 28%,#fff 0 9%,${c[1]} 42%,${SHADE[i].dark})" aria-label="${esc(L(`${nameOf(i)} 응원하기`,`Cheer for ${nameOf(i)}`))}" aria-pressed="${i===mine}">${i+1}</button>`).join('')}
function renderNames(){
 const p=$('namesPanel');if(p.classList.contains('hidden'))return;
 p.innerHTML=PALETTE.slice(0,numBalls).map((c,i)=>`<label><span class="dot" style="background:${c[1]}"></span>${i+1}<input type="text" maxlength="10" data-name="${i}" value="${esc(names[i])}" placeholder="${esc(c[0])}" aria-label="${esc(L(`${i+1}번 구슬 이름`,`Name for marble ${i+1}`))}"></label>`).join('');
}

// ---------------------------------------------------------------- results & league
function startLeague(){const order=shuffle([...Array(WORLDS.length).keys()]);league={race:1,n:numBalls,worlds:order.slice(0,LEAGUE_RACES),total:Array(numBalls).fill(0),last:[],done:false};save()}
function showResults(){
 phase='finished';$('slowmo').classList.add('hidden');slowTarget=1;
 const rank=Sim.ranking(st),champ=rank[0],me=st.marbles[mine],myRank=rank.findIndex(m=>m.id===mine)+1,won=champ.id===mine;
 mineStats.races++;if(won)mineStats.wins++;
 const fmt=t=>{const s=Math.max(0,t);return `${Math.floor(s/60)}:${(s%60).toFixed(1).padStart(4,'0')}`};
 let table='',actions='',title,leagueDone=false,hero=champ.id,heroText=L(`${nameOf(champ.id)} 우승!`,`${nameOf(champ.id)} wins!`),heroSub='',mineLine=won?L(`🎉 내 구슬 ${esc(nameOf(mine))}이 우승했어요! 응원 대성공!`,`🎉 Your marble ${esc(nameOf(mine))} won! Great cheering!`):L(`⭐ 내 구슬 ${esc(nameOf(mine))}은 ${myRank}위! 다음엔 1등 할 수 있어요!`,`⭐ Your marble ${esc(nameOf(mine))} came ${ord(myRank)}. It could win next time!`);
 if(mode==='league'&&league&&!league.done){
  const pts=Array(numBalls).fill(0);rank.forEach((m,i)=>{pts[m.id]=POINTS[i]||0;league.total[m.id]+=POINTS[i]||0});league.last=pts;
  const k=league.race,order=[...Array(numBalls).keys()].sort((a,b)=>league.total[b]-league.total[a]||pts[b]-pts[a]);
  leagueDone=k>=LEAGUE_RACES;title=leagueDone?L('🏆 리그 최종 결과','🏆 Final league standings'):L(`리그 ${k}/${LEAGUE_RACES}경기 결과`,`League race ${k}/${LEAGUE_RACES}`);
  table=`<table class="standings"><tr><th></th><th style="text-align:left">${L('구슬','Marble')}</th><th>${L('이번','Race')}</th><th>${L('합계','Total')}</th></tr>${order.map((id,i)=>`<tr class="${id===mine?'mine':''}"><td>${i<3?['🥇','🥈','🥉'][i]:i+1}</td><td class="nm"><span class="dot" style="background:${PALETTE[id][1]}"></span>${esc(nameOf(id))}${id===mine?' ⭐':''}</td><td class="pts">${pts[id]?'+'+pts[id]:'-'}</td><td class="tot">${league.total[id]}</td></tr>`).join('')}</table>`;
  if(leagueDone){league.done=true;const lc=order[0],lr=order.indexOf(mine)+1;hero=lc;heroText=L(`${nameOf(lc)} 리그 챔피언!`,`${nameOf(lc)} is the league champion!`);heroSub=L(`리그 합계 ${league.total[lc]}점`,`${league.total[lc]} league points`);
   mineLine=lc===mine?L(`👑 내 구슬 ${esc(nameOf(mine))}이 리그 챔피언이에요!`,`👑 Your marble ${esc(nameOf(mine))} is the league champion!`):L(`⭐ 내 구슬 ${esc(nameOf(mine))}은 리그 ${lr}위 (${league.total[mine]}점)!`,`⭐ Your marble ${esc(nameOf(mine))} finished the league ${ord(lr)} (${league.total[mine]} points)!`);setTimeout(()=>speak(fill(T.champ,lc),true),2600);
   actions=`<div class="result-actions one"><button class="primary" type="button" data-act="newLeague">${L('🔁 새 리그 시작','🔁 New league')}</button></div>`}
  else{league.race++;setTimeout(()=>speak(fill(T.leagueNext,order[0],{k}),false),2600);
   actions=`<div class="result-actions one"><button class="primary" type="button" data-act="next">${L(`▶ 다음 경기 (${league.race}/${LEAGUE_RACES})`,`▶ Next race (${league.race}/${LEAGUE_RACES})`)}</button></div>`}
 }else{
  title=L('오늘의 우승자!',"Today's winner!");
  table=`<table class="standings">${rank.slice(0,3).map((m,i)=>`<tr class="${m.id===mine?'mine':''}"><td>${['🥇','🥈','🥉'][i]}</td><td class="nm"><span class="dot" style="background:${PALETTE[m.id][1]}"></span>${esc(nameOf(m.id))}${m.id===mine?' ⭐':''}</td><td>${m.done?fmt(m.finishTime-st.raceT0):L('추격 중','racing')}</td></tr>`).join('')}</table>`;
  actions=`<div class="result-actions"><button class="control" type="button" data-act="again">${L('🔁 다시 대결','🔁 Race again')}</button><button class="primary" type="button" data-act="nextWorld">${L('🌍 다음 월드','🌍 Next world')}</button></div>`;
 }
 $('resultCard').innerHTML=`<div class="trophy">🏆</div><h2>${title}</h2>${photo?`<span class="photo">📸 ${L('사진 판정','Photo finish')}</span>`:''}<div class="champ" style="background:${PALETTE[hero][1]};--c:${PALETTE[hero][1]}">${hero+1}</div>
  <div class="win-text" style="color:${PALETTE[hero][1]}">${esc(heroText)}</div><p class="win-sub">${heroSub?esc(heroSub)+' · ':''}${esc(theme.name)} · ${fmt((champ.finishTime||st.t)-st.raceT0)} · ${L(`역전 ${leadChanges}회`,`${leadChanges} lead change${leadChanges===1?'':'s'}`)}</p>
  <p class="mine-result">${mineLine}<span class="mine-stats">${L(`응원한 구슬 우승 ${mineStats.wins}번 / ${mineStats.races}경기`,`Your marble won ${mineStats.wins} of ${mineStats.races} race${mineStats.races===1?'':'s'}`)}</span></p>${table}${actions}`;
 $('resultOverlay').classList.remove('hidden');confetti();if(won)setTimeout(jingle,600);
 save();setControls();updateLeagueUI();
 setCaption(L(`🏆 ${nameOf(champ.id)} 우승! 축하해요!`,`🏆 ${nameOf(champ.id)} wins! Congratulations!`));
}
function confetti(){const root=$('confettiLayer');root.innerHTML='';for(let i=0;i<80;i++){const el=document.createElement('div');el.className='confetti';el.style.left=rand(1,99)+'%';el.style.background=PALETTE[i%16][1];el.style.setProperty('--d',rand(2,4)+'s');el.style.setProperty('--dl',rand(0,.8)+'s');el.style.setProperty('--sx',rand(-140,140)+'px');root.appendChild(el)}setTimeout(()=>root.innerHTML='',5200)}

// ---------------------------------------------------------------- loop
function resize(){const r=panelEl.getBoundingClientRect();vw=Math.max(1,r.width);vh=Math.max(1,r.height);dpr=Math.min(window.devicePixelRatio||1,2);C.width=Math.round(vw*dpr);C.height=Math.round(vh*dpr);C.style.width=vw+'px';C.style.height=vh+'px';if(course)buildMinimap()}
let lastFrame=0;
function frame(now){
 const dt=Math.min(.05,(now-(lastFrame||now))/1000);lastFrame=now;clock+=dt;
 if(st&&!paused){
  if(phase==='countdown'){countdownT+=dt;const n=3-Math.floor(countdownT);if(countdownT>=3.2)beginRunning();else if(n!==shownCount){shownCount=n;$('startBanner').innerHTML=`<h2>${n}</h2><p>${esc(L('곧 문이 열려요!','The gate opens soon!'))}</p>`;tone(350+80*(3-n),120)}}
  timeScale+=(slowTarget-timeScale)*Math.min(1,dt*5);
  Sim.step(st,dt*(phase==='running'?raceRate*timeScale:1));handleEvents();stepEffects(dt);
  if(phase==='running')raceLogic();
 }
 if(st){updateCamera(dt,false);ctx.setTransform(dpr,0,0,dpr,0,0);drawBackground();drawWorld();drawMinimap();updateHud(false)}
 if(flashUntil&&clock>flashUntil){$('eventFlash').classList.remove('show');flashUntil=0}
 requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- wiring
function togglePause(){if(phase!=='running')return;paused=!paused;setControls();try{paused?speechSynthesis.pause():speechSynthesis.resume()}catch(e){}setCaption(paused?L('⏸ 일시정지! 이어하기를 눌러 주세요.','⏸ Paused. Press Resume to keep going.'):L('▶ 다시 출발!','▶ Back to the race!'))}
function setCount(v){const n=clamp(parseInt(v,10)||8,2,16);if(n===numBalls)return;numBalls=n;if(league&&!league.done){league=null;setCaption(L('구슬 수가 바뀌어서 리그를 새로 시작해요.','The number of marbles changed, so the league starts over.'))}save();prepare()}
$('maps').addEventListener('click',e=>{const b=e.target.closest('[data-world]');if(!b||b.disabled)return;worldIdx=+b.dataset.world;save();prepare();speak(L(`${WORLDS[worldIdx].name} 코스예요! 출발대에 구슬들이 줄을 섰어요.`,`Welcome to ${WORLDS[worldIdx].name}! The marbles are lined up at the gate.`),true)});
$('modeSeg').addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(!b||b.disabled)return;mode=b.dataset.mode;if(mode==='league'&&(!league||league.done))startLeague();save();prepare()});
$('ballCount').addEventListener('change',e=>setCount(e.target.value));$('ballRange').addEventListener('input',e=>setCount(e.target.value));
$('minePicker').addEventListener('click',e=>{const b=e.target.closest('[data-mine]');if(!b||b.disabled)return;mine=+b.dataset.mine;save();renderMinePicker();updateHud(true);setCaption(L(`💖 ${nameOf(mine)} 구슬을 응원해요! 레이스 중 📣 응원 버튼을 눌러 힘을 주세요.`,`💖 You're cheering for ${nameOf(mine)}! Press 📣 Cheer during the race to give it a push.`));tone(660,80,'triangle',.07);setTimeout(()=>tone(990,110,'triangle',.07),80)});
$('namesBtn').addEventListener('click',()=>{$('namesPanel').classList.toggle('hidden');renderNames()});
$('namesPanel').addEventListener('input',e=>{const i=e.target.dataset.name;if(i==null)return;names[+i]=e.target.value.replace(/[<>]/g,'').slice(0,10);save();renderMinePicker();updateHud(true)});
$('startBtn').addEventListener('click',startRace);$('pauseBtn').addEventListener('click',togglePause);
$('resetBtn').addEventListener('click',()=>{prepare();setCaption(L('↻ 다시 준비했어요. 출발 버튼을 눌러 주세요!','↻ Reset. Press Start when you are ready!'))});
$('cheerBtn').addEventListener('click',cheer);
$('cameraBtn').addEventListener('click',()=>{cam.mode=(cam.mode+1)%3;setControls()});
$('speedBtn').addEventListener('click',()=>{raceRate=raceRate===1?1.5:raceRate===1.5?2:1;setControls()});
$('voiceToggle').addEventListener('click',()=>{voiceOn=!voiceOn;save();setControls();if(!voiceOn){try{speechSynthesis.cancel()}catch(e){}setCaption(L('음성 중계를 껐어요. 자막은 계속 나와요.','Voice commentary is off. Captions keep showing.'))}else speak(L('음성 중계를 켰어요! 신나는 레이스를 즐겨요!','Commentary is on! Enjoy the race!'),true)});
$('sfxToggle').addEventListener('click',()=>{sfxOn=!sfxOn;save();setControls();if(sfxOn)tone(660)});
$('stopVoice').addEventListener('click',()=>{try{speechSynthesis.cancel()}catch(e){}setCaption(L('🔇 음성을 멈췄어요.','🔇 Voice stopped.'))});
$('voiceSelect').addEventListener('change',e=>{voicePick[LANG]=e.target.value;save();speak(L('안녕하세요! 오늘 구슬 레이스 중계를 맡았습니다.','Hello! I am your marble race announcer today.'),true)});
$('resultCard').addEventListener('click',e=>{const a=e.target.closest('[data-act]')?.dataset.act;if(!a)return;
 if(a==='again'){prepare();startRace()}else if(a==='nextWorld'){worldIdx=(worldIdx+1)%WORLDS.length;save();prepare();startRace()}
 else if(a==='next'){prepare();startRace()}else if(a==='newLeague'){startLeague();prepare();startRace()}});
window.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();togglePause()}else if(e.code==='KeyC')cheer();else if(e.code==='KeyV'){cam.mode=(cam.mode+1)%3;setControls()}});
window.addEventListener('resize',resize);
if('speechSynthesis' in window){speechSynthesis.getVoices();speechSynthesis.addEventListener?.('voiceschanged',fillVoiceSelect)}
fillVoiceSelect();setTimeout(fillVoiceSelect,600);
resize();prepare();setCaption(L('환영합니다! 응원할 구슬을 고르고 출발 버튼을 눌러요!','Welcome! Pick your marble and press Start!'));
window.__marble={get:()=>({phase,st,course,cam,league,mode,timeScale}),start:startRace,prepare,cheer,showResults,setMine:i=>{mine=i}};
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
