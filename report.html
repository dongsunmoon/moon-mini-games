/*PLUS:BEGIN*/
// mgPlus: 문코치 Plus / Coach Moon Plus, the paid part. The same code is in every game (inside the coach block),
// index.html and report.html. Source: _src/coach/plus.js, copied by _src/coach/inject.py.
// Who sells Plus:
//  · In the Android/iOS app, the store (Google Play Billing / StoreKit 2). app-bridge.js gives mgBillingNative
//    {query,buy,restore,manage}; the native side reports with window.mgPlusUpdate(state), where state is
//    {active, product, until (ms or null), trial, products:[{id:'yearly'|'monthly', price, period:'year'|'month',
//    trial:'P7D'|null}], msg, pending}.
//  · On the web, WEB_SALE says what happens: 'open' = nothing is locked (now: the family's site before launch);
//    'stores' = the web locks like the app and the parent screen points to the app stores; 'web' = a later web sale
//    with accounts on a server (not built: it would plug in where mgBillingNative does).
//  · An organization licence code (hagwon, school, family) opens Plus on one device. LIC holds only hashes of the
//    codes; the codes themselves live in _src/plus/ (never in the repo).
// Free for everyone: the front of each game (FREE), this month's free units (MONTHLY, rotating with the school year),
// daily goals and every parent tool. Plus: everything else, the full parents' report and all certificates.
// Kids' category rules: the child never sees a price or a buy button. A lock shows a neutral preview card with
// "keep playing free"; buying happens only on the parent screen behind the grown-up check (mgGate). Locks are only
// checked when something starts, never in the middle of an activity. Nothing earned or bought is taken away.
// API: mgPlus.has() · open(game,kind,idx,total) · monthly(game,kind,total) · lock(card) · tease(card) ·
//      paywall(ctx) · parent(ctx) (grown-up check, then paywall) · gate(cb,kind) (the grown-up check alone; kind picks
//      its line: 'buy', 'report', 'settings', 'share', 'link') · redeem(code) ·
//      on(fn) · state() · mode
// Testing on the web: ?plus=lock (locks like the app, with a pretend store), ?plus=on (Plus on), ?plus=reset (forget a
// pretend purchase, a code and today's previews, then lock), ?plus=off (back). A 🧪 bar in the corner switches them.
(()=>{if(window.mgPlus)return;
const WEB_SALE='open';
const KEY='moonGames.plus',SEEN='moonGames.plusSeen';
// game → kind → how many from the start are free (idx is 1-based in the game's own order)
const FREE={math:{tank:5},science:{world:1},coding:{world:2},music:{unit:2},chess:{boss:4,lesson:15,ladder:1},detective:{area:1,case:10},marble:{world:3}};
// this month's free units, on top of FREE: they rotate through the locked ones from the start of the school year
// (Korea: March, Ontario: September), so a free family still practises roughly what school is teaching
const MONTHLY={math:{tank:2},science:{world:1}};
// licence codes: hash → {org, until 'YYYY-MM-DD'}. Made by _src/plus/licenses.py.
const LIC={/*LIC*/'ngv2xywrul.1rpbvpeeth8':{org:'family',until:''},'1xohrd8e9hu.19j2nuvroey':{org:'pilot-01',until:'2027-08-31'},'2gffweq8nz4.2a4hqsmddel':{org:'pilot-02',until:'2027-08-31'},'1yw64k0cab.12knbhyfn3l':{org:'pilot-03',until:'2027-08-31'},'ya69p178zq.894eq6vvc6':{org:'pilot-04',until:'2027-08-31'},'19tuegqwc92.j097j8bywo':{org:'pilot-05',until:'2027-08-31'},'29aabny30te.1blphalr06w':{org:'pilot-06',until:'2027-08-31'},'7h0fel1q7r.1421idve94w':{org:'pilot-07',until:'2027-08-31'},'249sj1d4fo9.mw8epkleru':{org:'pilot-08',until:'2027-08-31'},'2d572kc4p4d.19a3chj218t':{org:'pilot-09',until:'2027-08-31'},'d80cygnl2v.2fh1c84wsfm':{org:'pilot-10',until:'2027-08-31'},'lgwu8jc895.21awvpf8uas':{org:'test-expired',until:'2026-01-01'}};
const lang=()=>{try{if(typeof LANG==='string'&&LANG)return LANG}catch(e){}return 'ko'};
const T=(ko,en)=>lang()==='en'?en:ko;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const two=x=>Array.isArray(x)?T(x[0],x[1]):x==null?'':String(x);
const day=()=>new Date().toLocaleDateString('en-CA');
const get=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){return {}}};
const put=o=>{try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}};
const inApp=!!window.__mgApp;
// ?plus=reset also forgets a pretend purchase, a licence code and today's previews, then locks again
const dev=(()=>{try{const q=new URLSearchParams(location.search).get('plus');if(q==='off')sessionStorage.removeItem('moonGames.plusDev');
 else if(q==='reset'){localStorage.removeItem(KEY);localStorage.removeItem(SEEN);sessionStorage.setItem('moonGames.plusDev','lock')}
 else if(q==='lock'||q==='on')sessionStorage.setItem('moonGames.plusDev',q);return sessionStorage.getItem('moonGames.plusDev')||''}catch(e){return ''}})();
const mode=inApp?'app':dev==='lock'?'test':dev==='on'?'on':WEB_SALE;
const N=()=>window.mgBillingNative||null;
const cyrb=(s,seed)=>{let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<s.length;i++){ch=s.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}
 h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)};
const licHash=c=>{const s='moon-lic|'+c;return cyrb(s,1)+'.'+cyrb(s,2)};
const norm=c=>String(c||'').toUpperCase().replace(/[^0-9A-Z]/g,'');
const lic=()=>{const l=get().lic;return l&&(!l.until||l.until>=day())?l:null};
const store=()=>{const s=get().store;if(!s||!s.active)return null;if(s.until&&s.until+3*864e5<Date.now())return null;return s};
const has=()=>mode==='open'||mode==='on'||!!(store()||lic());
const subs=[];const emit=()=>{subs.slice().forEach(f=>{try{f(has())}catch(e){}});try{dispatchEvent(new CustomEvent('mgplus',{detail:{plus:has()}}))}catch(e){}};
const schoolMonth=()=>{const m=new Date().getMonth()+1;return lang()==='en'?(m+3)%12:(m+9)%12};
function monthly(game,kind,total){const f=(FREE[game]||{})[kind]||0,n=(MONTHLY[game]||{})[kind]||0;if(!n||!total||total<=f)return [];
 const span=total-f,out=[];for(let i=0;i<n;i++){const v=f+1+((schoolMonth()*n+i)%span);if(!out.includes(v))out.push(v)}return out}
function open(game,kind,idx,total){if(has())return true;const f=(FREE[game]||{})[kind];if(f==null)return false;return idx<=f||monthly(game,kind,total).includes(idx)}
// pretend store for ?plus=lock on the web, so the whole flow can be tried and tested
const FAKE=()=>lang()==='en'?[{id:'yearly',price:'$49.99',period:'year',trial:'P7D'},{id:'monthly',price:'$6.99',period:'month',trial:null}]:[{id:'yearly',price:'₩49,000',period:'year',trial:null},{id:'monthly',price:'₩6,900',period:'month',trial:null}];
// sheet (the open parent screen) is declared up here: a store state can arrive before the rest of this file has run
let products=null,msg='',pending=false,sheet=null;
function update(s){try{if(typeof s==='string')s=JSON.parse(s)}catch(e){return}if(!s||typeof s!=='object')return;
 if(Array.isArray(s.products))products=s.products;msg=s.msg||'';pending=!!s.pending;
 if('active' in s){const o=get();o.store={active:!!s.active,product:s.product||'',until:s.until||null,trial:!!s.trial,at:Date.now()};put(o)}
 emit();if(sheet)sheet.render()}
window.mgPlusUpdate=update;if(window.__mgPlusPending){const p=window.__mgPlusPending;window.__mgPlusPending=null;update(p)}
if(mode==='app'){try{N()&&N().query()}catch(e){}}
// ---- shared look (both windows live in a shadow root, so no game's CSS can reach them)
const CSS=':host{all:initial}*{box-sizing:border-box;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}'+
 '.bg{position:fixed;inset:0;z-index:2147483600;background:rgba(12,20,40,.7);display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}'+
 '.card{position:relative;background:#fff;color:#1d2a4a;border-radius:24px;width:min(400px,100%);max-height:100%;overflow:auto;padding:18px 18px 16px;box-shadow:0 14px 44px rgba(0,0,0,.35);text-align:center}'+
 '.x{position:absolute;right:10px;top:10px;min-width:44px;min-height:44px;border:0;border-radius:14px;background:#eef2fb;font-size:18px;color:#1d2a4a;cursor:pointer}'+
 '.pic{width:150px;height:150px;margin:6px auto 4px;border-radius:26px;background:linear-gradient(160deg,#fff4d6,#ffe2b8);display:flex;align-items:center;justify-content:center;font-size:76px;position:relative;overflow:hidden}'+
 '.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.star{position:absolute;right:6px;bottom:6px;background:#ffd34d;color:#5a3d00;font-size:13px;font-weight:900;border-radius:999px;padding:3px 9px;box-shadow:0 2px 0 #d9a400}'+
 'h2{margin:8px 34px 4px;font-size:21px;line-height:1.3;word-break:keep-all}.t{margin:4px 0;font-size:15.5px;font-weight:700;line-height:1.5;color:#34407a;word-break:keep-all}'+
 '.free{margin:8px 0 12px;font-size:14px;color:#56607a;line-height:1.5;word-break:keep-all}'+
 '.go{display:block;width:100%;min-height:54px;border:0;border-radius:16px;background:#2f9e5b;color:#fff;font-size:18px;font-weight:900;box-shadow:0 4px 0 #1f7a43;cursor:pointer}'+
 '.ask{display:block;width:100%;min-height:44px;margin-top:10px;border:0;background:none;color:#4656c8;font-size:14.5px;font-weight:800;text-decoration:underline;text-underline-offset:3px;cursor:pointer}'+
 '.wide{width:min(460px,100%);text-align:left}.wide h2{margin:2px 40px 8px 0}.ctx{background:#f3f6ff;border-radius:14px;padding:10px 12px;font-size:14.5px;font-weight:700;color:#34407a;margin:6px 0 10px}'+
 '.list{margin:6px 0 12px;padding:0;list-style:none;display:grid;gap:6px}.list li{font-size:14.5px;line-height:1.45;padding-left:24px;position:relative}.list li::before{content:"✓";position:absolute;left:4px;color:#2f9e5b;font-weight:900}'+
 '.plans{display:grid;gap:8px;margin:8px 0}.plan{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:60px;border:2px solid #d7def0;border-radius:16px;background:#fff;padding:10px 14px;text-align:left;cursor:pointer;font:inherit;color:#1d2a4a}'+
 '.plan.best{border-color:#4656c8;background:#f5f7ff}.plan b{font-size:16px}.plan span{font-size:13px;color:#56607a;display:block}.plan i{font-style:normal;font-size:17px;font-weight:900;white-space:nowrap}'+
 '.plan:disabled{opacity:.55;cursor:default}.msg{min-height:20px;font-size:14px;font-weight:700;color:#b4232c;margin:4px 0}.msg.ok{color:#2b8a3e}'+
 '.row{display:flex;flex-wrap:wrap;gap:4px 14px;margin:6px 0}.row button,.row a{min-height:44px;border:0;background:none;padding:0;color:#4656c8;font-size:14px;font-weight:800;text-decoration:underline;text-underline-offset:3px;cursor:pointer;display:inline-flex;align-items:center}'+
 '.fine{font-size:12.5px;color:#6b7390;line-height:1.55;margin:8px 0 0}.code{display:flex;gap:8px;margin:6px 0}.code input{flex:1;min-width:0;min-height:48px;border:2px solid #d7def0;border-radius:12px;padding:0 12px;font-size:17px;font-weight:800;letter-spacing:1px;text-transform:uppercase}'+
 '.code button{min-height:48px;border:0;border-radius:12px;background:#4656c8;color:#fff;font-weight:900;padding:0 16px;font-size:15px;cursor:pointer}'+
 '.on{background:#e9f8ef;border-radius:14px;padding:12px;font-weight:800;color:#1f6b3e;margin:6px 0}'+
 '.q{font-size:28px;font-weight:900;margin:8px 0}.gin{width:100%;min-height:52px;font-size:24px;font-weight:900;text-align:center;border:2px solid #d7def0;border-radius:14px}'+
 'button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #ffb703;outline-offset:2px}'+
 '@media (max-height:560px){.pic{width:96px;height:96px;font-size:48px}.card{padding:12px 14px}}';
function layer(html,onClose){const host=document.createElement('div');host.setAttribute('data-mg-plus','');const root=host.attachShadow?host.attachShadow({mode:'open'}):host;
 const st=document.createElement('style');st.textContent=CSS;root.appendChild(st);const bg=document.createElement('div');bg.className='bg';bg.setAttribute('role','dialog');bg.setAttribute('aria-modal','true');bg.innerHTML=html;root.appendChild(bg);(document.body||document.documentElement).appendChild(host);
 const prev=document.activeElement,close=()=>{try{host.remove()}catch(e){}try{prev&&prev.focus&&prev.focus()}catch(e){}onClose&&onClose()};
 root.querySelector('.bg').addEventListener('click',e=>{if(e.target.classList.contains('bg'))close()});host.addEventListener('keydown',e=>{if(e.key==='Escape'){e.stopPropagation();close()}});
 const x=root.querySelector('.x');if(x)x.addEventListener('click',close);setTimeout(()=>{try{(root.querySelector('.go,.x')||{}).focus()}catch(e){}},40);
 return {root,close,$:s=>root.querySelector(s)}}
// ---- the child's lock card: a preview and a neutral line, no price
let lockOpen=false;
function lock(c){c=c||{};if(lockOpen)return false;lockOpen=true;
 const pic=c.pic?`<img src="${esc(c.pic)}" alt="" onerror="this.remove()">`:'';
 const L1=two(c.text)||T('다음 이야기는 문코치 Plus에서 열려요.','The next part opens with Coach Moon Plus.');
 const F=two(c.free)||T('이달의 단원, 매일 목표, 다른 게임은 지금도 할 수 있어요.','This month’s units, daily goals and other games are open now.');
 const w=layer(`<div class="card"><button class="x" type="button" aria-label="${T('닫기','Close')}">✕</button>
  <div class="pic" aria-hidden="true">${esc(c.emoji||'🌙')}${pic}<span class="star">⭐ Plus</span></div>
  <h2>${esc(two(c.title)||T('새로운 곳이 기다려요','Something new is waiting'))}</h2><p class="t">${esc(L1)}</p><p class="free">${esc(F)}</p>
  <button class="go" type="button">▶ ${T('무료로 계속하기','Keep playing free')}</button>
  <button class="ask" type="button">👨‍👩‍👧 ${T('어른에게 보여 주기','Show a grown-up')}</button></div>`,()=>{lockOpen=false;c.onClose&&c.onClose()});
 w.$('.go').addEventListener('click',()=>{w.close();c.onFree&&c.onFree()});
 w.$('.ask').addEventListener('click',()=>{w.close();parent(c.ctx)});return true}
// shown once a day per game at a big moment (a boss beaten, a unit finished), only to players without Plus
function tease(c){if(has()||!c||!c.game)return false;let s={};try{s=JSON.parse(localStorage.getItem(SEEN)||'{}')||{}}catch(e){}
 if(s[c.game]===day())return false;s[c.game]=day();try{localStorage.setItem(SEEN,JSON.stringify(s))}catch(e){}return lock(c)}
// ---- grown-up check: the app's mgGate (app-bridge.js); on the web a simple question
function gate(cb,kind){if(typeof window.mgGate==='function'){window.mgGate(kind||'buy',ok=>cb(!!ok));return}
 const a=12+Math.floor(Math.random()*17),b=6+Math.floor(Math.random()*4);
 const w=layer(`<div class="card"><button class="x" type="button" aria-label="${T('닫기','Close')}">✕</button><h2>🔒 ${T('보호자 확인','Grown-ups only')}</h2>
  <p class="free">${T('어린이는 보호자에게 보여 주세요. 아래 계산의 답을 입력해 주세요.','Kids: please show this to a grown-up. Type the answer below.')}</p>
  <p class="q" aria-hidden="true">${a} × ${b} = ?</p><input class="gin" inputmode="numeric" autocomplete="off" aria-label="${T(a+' 곱하기 '+b,a+' times '+b)}"><p class="msg" aria-live="polite"></p>
  <button class="go" type="button">${T('확인','Continue')}</button></div>`);
 const go=()=>{if(w.$('.gin').value.trim()===String(a*b)){w.close();cb(true)}else{w.$('.msg').textContent=T('답이 달라요.','Not quite.');w.$('.gin').value=''}};
 w.$('.go').addEventListener('click',go);w.$('.gin').addEventListener('keydown',e=>{if(e.key==='Enter')go()});setTimeout(()=>{try{w.$('.gin').focus()}catch(e){}},60)}
function parent(ctx){if(has()&&mode!=='app'&&mode!=='test'){paywall(ctx);return}gate(ok=>{if(ok)paywall(ctx)})}
// ---- the parent screen: what Plus opens, the store's prices, restore, licence code, the fine print
const OPENS=()=>[T('수학 아쿠아리움: 1~6학년 수족관 120곳 모두','Math Aquarium: all 120 aquariums, grades 1–6'),T('코딩 섬: 파이썬 미션 84개와 보스 13명','Coding Island: all 84 Python missions and 13 bosses'),
 T('체스 기사단: 보스 8명, 스파링, 대국 복기, 보스 코스, 레슨 57개','Chess Knights: all 8 bosses, sparring, game review, boss courses, 57 lessons'),T('과학·음악의 모든 세계와 단원, 꼬마 탐정의 모든 사건, 구슬 레이스의 모든 세계','Every science world and music unit, every detective case, every Marble Rush world'),
 T('부모 리포트 전체: 과목별 분석, 틀린 문제, 집에서 돕기, 인쇄','The full parents’ report: subjects, missed questions, home plan, printing'),T('모든 수료증, 이 기기의 모든 아이 프로필','All certificates, and every child profile on this device')];
const perLabel=p=>p.period==='month'?T('월간','Monthly'):T('연간','Yearly');
const trialLabel=t=>{const m=/P(\d+)([DWMY])/.exec(t||'');if(!m)return '';const n=+m[1],u=m[2];if(u==='M'||u==='Y')return u==='M'?T(`${n}개월 무료 체험 뒤 결제`,`${n}-month free trial, then`):T(`${n}년 무료 체험 뒤 결제`,`${n}-year free trial, then`);const d=n*(u==='W'?7:1);return T(`${d}일 무료 체험 뒤 결제`,`${d}-day free trial, then`)};
// in the app the notice page opens in the same view (a new window would go nowhere); on the web in a new tab
const tgt=inApp?'':' target="_blank" rel="noopener"';
function paywall(ctx){if(sheet){sheet.render();return}
 const w=layer(`<div class="card wide"><button class="x" type="button" aria-label="${T('닫기','Close')}">✕</button><div class="body"></div></div>`,()=>{sheet=null});
 let codeOpen=false,note='',good=false;
 const buy=id=>{note='';if(mode==='test'){const o=get();o.store={active:true,product:id,until:Date.now()+(id==='monthly'?31:366)*864e5,trial:false,at:Date.now()};put(o);good=true;note=T('고마워요! Plus가 열렸어요.','Thank you! Plus is on.');emit();sheet&&sheet.render();return}
  const n=N();if(mode==='app'&&n){pending=true;sheet.render();n.buy(id)}};
 const render=()=>{const b=w.$('.body'),s=store(),l=lic(),ps=mode==='test'?FAKE():products;let h=`<h2>⭐ ${T('문코치 Plus','Coach Moon Plus')}</h2>`;

<script>
// ---------------------------------------------------------------- the games and where their learning records live
// Each game's shared recorder (LR, in the coach block) writes "<save prefix>learn@profileId"; see _src/report/SPEC.md.
const GAMES=[
 {id:'math',file:'math_aquarium.html',key:'mathAquarium.learn',save:'mathAquarium.v1',subj:['수학','Math'],game:['꼬마 수학 아쿠아리움','Little Math Aquarium'],icon:'🧮',c:'#2f6ff0'},
 {id:'music',file:'music_academy.html',key:'musicAcademy.learn',save:'musicAcademy.v1',subj:['음악','Music'],game:['꼬마 음악 아카데미','Little Music Academy'],icon:'🎵',c:'#9050e8'},
 {id:'science',file:'science_guardians.html',key:'scienceGuardians.learn',save:'scienceGuardians.v1',subj:['과학','Science'],game:['꼬마 과학 수호대','Little Science Guardians'],icon:'🔬',c:'#0f9e7b'},
 {id:'coding',file:'coding_island.html',key:'pythonIsland.learn',save:'pythonIsland.v1',subj:['코딩','Coding'],game:['꼬마 코딩 섬','Little Coding Island'],icon:'💻',c:'#ec7c1c'},
 {id:'chess',file:'chess_knights.html',key:'chessKnights.learn',save:'chessKnights.v1',subj:['체스 · 전략','Chess · Strategy'],game:['꼬마 체스 기사단','Little Chess Knights'],icon:'♞',c:'#b0832a'},
 {id:'detective',file:'detective_game.html',key:'little-detective-learn',save:'little-detective-v3',subj:['추리 · 듣기','Reasoning · Listening'],game:['꼬마 탐정단','Little Detectives'],icon:'🕵️',c:'#dc4a76'},
 {id:'marble',file:'marble_rush_3d.html',key:'marbleRush.learn',save:'marbleRush.v2',subj:['과학 탐구','Science inquiry'],game:['마블 레이스','Marble Rush'],icon:'🔵',c:'#1d9fbe'}];
const T=p=>Array.isArray(p)?L(p[0],p[1]):'';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// painted pictures: subject icons (rp-subj-*), finding icons (rp-ic-*), the child's own character from the games (aq-me-*)
// and Coach Moon with the report; each falls back to its emoji if the picture can't load
const icImg=(src,emo,cls='')=>`<img class="pic ${cls}" src="${src}" alt="" data-e="${esc(emo)}" onerror="this.replaceWith(document.createTextNode(this.dataset.e))">`;
const gIc=(g,cls='')=>icImg(`images/rp-subj-${g.id}.webp`,g.icon,cls);
const ME_KEY={'🐰':'bunny','🐻':'bear','🦊':'fox','🐼':'panda','🐨':'koala','🐯':'tiger','🦁':'lion','🐸':'frog','🐱':'cat','🐶':'puppy','🐥':'chick','🦄':'unicorn','🐙':'octopus','🐬':'dolphin','🦖':'dino','⭐':'star'};
const avImg=(av,cls='')=>{const k=ME_KEY[String(av||'').replace(/️/g,'')];return k?icImg(`images/aq-me-${k}.webp`,av,'me '+cls):esc(av||'🙂')};
const IC_IMG={'🌟':'strength','📈':'growth','🎯':'focus','🔍':'wait'},icOf=e=>IC_IMG[e]?icImg(`images/rp-ic-${IC_IMG[e]}.webp`,e,'sm'):e;

const $=id=>document.getElementById(id);
const getJ=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}};
const Q=new URLSearchParams(location.search),DEMO=Q.get('demo')==='1';
// ---------------------------------------------------------------- Korean particles after a name
const hasB=w=>{const c=String(w).trim().slice(-1);const n=c.charCodeAt(0);if(n>=0xAC00&&n<=0xD7A3)return (n-0xAC00)%28>0;return /[013678]$/.test(c)};
const nmK=w=>hasB(w)?w+'이':w;  // 도준 → 도준이, 윤아 → 윤아 (then 는/가/의 follow a vowel)
// ---------------------------------------------------------------- dates
const dkey=d=>d.toLocaleDateString('en-CA');
const TODAY=new Date();TODAY.setHours(12,0,0,0);
const daysAgo=n=>{const d=new Date(TODAY);d.setDate(d.getDate()-n);return d};
const ago=k=>{if(!k)return L('예전에','earlier');const d=new Date(k+'T12:00:00'),n=Math.round((TODAY-d)/864e5);return n<=0?L('오늘','today'):n===1?L('어제','yesterday'):n<7?L(`${n}일 전`,`${n} days ago`):d.toLocaleDateString(LANG==='en'?'en-US':'ko-KR',{month:'short',day:'numeric'})};
const fmtMin=s=>{if(s>0&&s<30)return L('1분 미만','under 1 min');const m=Math.round(s/60);if(m<60)return LANG==='en'?`${m} min`:`${m}분`;const h=Math.floor(m/60),r=m%60;return LANG==='en'?`${h} h${r?` ${r} min`:''}`:`${h}시간${r?` ${r}분`:''}`};
const pct=x=>Math.round(x*100);
// ---------------------------------------------------------------- data
let PROF={list:[],cur:null};
function loadProfiles(){const p=getJ('moonGames.profiles');PROF=p&&Array.isArray(p.list)?p:{list:[],cur:null};
 const want=Q.get('p');if(want&&PROF.list.some(x=>x.id===want))PROF.cur=want;
 if(!PROF.list.some(x=>x.id===PROF.cur))PROF.cur=PROF.list[0]?PROF.list[0].id:null}
const me=()=>PROF.list.find(x=>x.id===PROF.cur)||null;
function records(){if(DEMO)return demoRecords();const m=me(),sfx=m?'@'+m.id:'';const out={};
 for(const g of GAMES){const r=getJ(g.key+sfx);const saved=localStorage.getItem(g.save+sfx)!=null||(g.id==='marble'&&localStorage.getItem('marble3dsettings'+sfx)!=null);
  out[g.id]={r:r&&r.v===1?r:null,saved}}

// ---------------------------------------------------------------- parent check: a quick sum that young children can't do yet
function gate(){if(DEMO){render();return}let ok=false;try{ok=sessionStorage.getItem('moonGames.parentOK')==='1'}catch(e){}if(ok){render();return}
 // in the app: the app's stronger grown-up check (numbers as words, optional PIN)
 if(typeof window.mgGate==='function'){window.mgGate('report',g=>{if(g){try{sessionStorage.setItem('moonGames.parentOK','1')}catch(e){}render()}else location.href=`index.html?lang=${LANG}`});return}
 const a=12+Math.floor(Math.random()*8),b=6+Math.floor(Math.random()*4);
 $('gate').innerHTML=`<div class="gate"><div class="gate-box" role="dialog" aria-modal="true" aria-labelledby="gT"><h2 id="gT">👨‍👩‍👧 ${L('보호자 확인','Grown-ups only')}</h2><p>${L('학부모님을 위한 화면이에요. 아래 계산의 답을 입력해 주세요.','This page is for parents. Please type the answer below.')}</p>
  <div class="gate-q num" aria-hidden="true">${a} × ${b} = ?</div><input id="gA" inputmode="numeric" autocomplete="off" aria-label="${esc(L(`${a} 곱하기 ${b}의 답`,`${a} times ${b}`))}">
  <div class="row"><a class="btn ghost" href="index.html?lang=${LANG}">${L('돌아가기','Back')}</a><button type="button" class="btn" id="gGo">${L('확인','Continue')}</button></div></div></div>`;
 const go=()=>{if(+$('gA').value===a*b){try{sessionStorage.setItem('moonGames.parentOK','1')}catch(e){}$('gate').innerHTML='';render()}else{const bx=document.querySelector('.gate-box');bx.classList.remove('shake');void bx.offsetWidth;bx.classList.add('shake');$('gA').value='';$('gA').focus()}};
 $('gGo').onclick=go;$('gA').addEventListener('keydown',e=>{if(e.key==='Enter')go()});setTimeout(()=>$('gA').focus(),60)}
// ---------------------------------------------------------------- start
document.querySelectorAll('[data-lang]').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.lang===LANG);b.onclick=()=>{try{localStorage.setItem('moonGames.lang',b.dataset.lang)}catch(e){}const u=new URL(location.href);u.searchParams.set('lang',b.dataset.lang);location.replace(u.href)}});
if(LANG==='en'){document.querySelectorAll('[data-en]').forEach(el=>{el.textContent=el.dataset.en});document.querySelectorAll('[data-en-aria-label]').forEach(el=>el.setAttribute('aria-label',el.dataset.enAriaLabel));document.title=document.querySelector('title').dataset.en}
$('home').href=`index.html?lang=${LANG}`;$('print').onclick=()=>{if(!(DEMO||mgPlus.has())){mgPlus.paywall(PCTX());return}document.querySelectorAll('details').forEach(d=>d.open=true);window.print()};
