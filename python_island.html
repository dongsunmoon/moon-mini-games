<script>
/* Language: ?lang=ko|en, then the saved choice, then the device language. Shared by every page on this site. */
const LANG=(()=>{let q=null,s=null;try{q=new URLSearchParams(location.search).get('lang')}catch(e){}try{s=localStorage.getItem('moonGames.lang')}catch(e){}const l=q==='ko'||q==='en'?q:s==='ko'||s==='en'?s:/^ko/i.test(navigator.language||'')?'ko':'en';if(q===l){try{localStorage.setItem('moonGames.lang',l)}catch(e){}}document.documentElement.lang=l;return l})();
const L=(ko,en)=>LANG==='en'?en:ko;
/*COACH:BEGIN*/
// Coach Moon, the maker's character, cheers the player on in every game, in two ways:
// · coachLine(kind) puts one line inside result and level-up windows (kinds: up, big, good, try, race).
// · coachPop(pose,ko,en) shows a small bubble in the corner at good moments. It never blocks a tap and
//   waits between appearances, so he never nags. He only praises and encourages.
// Source: _src/coach/coach.js, copied into every game by _src/coach/inject.py.
const coachEsc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const coachNm=()=>{try{return MGP.me&&MGP.me.name||''}catch(e){return ''}};
const coachPick=a=>a[Math.random()*a.length|0];
const coachSay_=t=>{const nm=coachNm(),ok=t.filter(x=>nm||!/\{nm\}/.test(x[0])),x=coachPick(ok.length?ok:t);return L(x[0],x[1]).replace(/\{nm\}/g,coachEsc(nm))};
const COACH={
 up:['clap',[['꾸준히 한 덕분이에요. 정말 멋져요!','Your steady practice paid off. Awesome!'],['어제보다 오늘 더 잘하고 있어요!','You’re doing even better than yesterday!'],['계속 도전해서 여기까지 왔어요!','You kept trying, and look how far you’ve come!'],['{nm}의 노력이 반짝반짝 빛나요 ✨','Your hard work is shining, {nm} ✨'],['문 코치가 박수 쳐요! 짝짝짝 👏','Coach Moon is clapping for you! 👏'],['이 기세 그대로 가 봐요! 🌙','Keep this going! 🌙']]],
 big:['medal',[['정말 대단해요! 이 메달 받아요 🏅','Amazing! This medal is yours 🏅'],['최고예요! 오늘의 주인공이에요 🏅','The best! You’re the star today 🏅'],['{nm}, 문 코치가 정말 자랑스러워요! 🏅','I’m so proud of you, {nm}! 🏅'],['완벽해요! 멋진 실력이에요 🌟','Perfect! What great skills 🌟']]],
 try:['go',[['괜찮아요! 연습하면 다음엔 더 잘할 거예요.','That’s okay! With practice you’ll do even better next time.'],['끝까지 해낸 게 멋져요. 다음에 또 해 봐요!','You finished, and that’s great. Let’s try again next time!'],['틀린 문제에서 제일 많이 배워요. 문 코치가 응원해요 🌙','We learn the most from mistakes. Coach Moon is cheering for you 🌙'],['{nm}, 할 수 있어요! 한 번 더 해 봐요 🌙','You can do it, {nm}! One more try 🌙']]],
 good:['go',[['잘했어요! 조금만 더 연습하면 별 3개예요 ⭐','Nice work! A little more practice and it’s 3 stars ⭐'],['좋아요! 한 번 더 하면 더 잘할 거예요 🌙','Good job! One more go and you’ll do even better 🌙'],['실력이 쑥쑥 자라고 있어요! 문 코치가 응원해요 🌙','Your skills are growing fast! Coach Moon is cheering 🌙'],['{nm}, 점점 더 잘하고 있어요!','You’re getting better and better, {nm}!']]],
 race:['clap',[['응원한 보람이 있어요! 정말 신나요!','Your cheering paid off! So exciting!'],['끝까지 응원한 게 최고예요!','Cheering to the very end was the best!'],['와, 우승이에요! 문 코치도 같이 응원했어요 🎉','A win! Coach Moon was cheering too 🎉']]]};
function coachLine(k){const [pose,ls]=COACH[k];return `<div class="mcoach"><img src="images/coach-moon-${pose}.webp" alt="" width="58" height="70" onerror="this.parentNode.remove()"><p><b>${L('문 코치','Coach Moon')}</b>${coachSay_(ls)}</p></div>`}
let coachAt=0,coachRun=0,coachMiss=0;
// true while a game window (dialog) is open, so the bubble never covers one
const coachBusy=()=>[...document.querySelectorAll('[role="dialog"],[aria-modal="true"]')].some(e=>e.getAttribute('aria-hidden')!=='true'&&e.getClientRects().length&&getComputedStyle(e).visibility!=='hidden');
function coachLater(fn,left=180){if(!coachBusy()){fn();return}if(left>0)setTimeout(()=>coachLater(fn,left-1),1000)}
function coachPop(pose,ko,en,o={}){const now=Date.now();if(!o.force&&now-coachAt<(o.gap||60000))return false;if(!o.force&&coachBusy())return false;coachAt=now;
 let el=document.getElementById('coachPop');if(!el){el=document.createElement('div');el.id='coachPop';el.setAttribute('role','status');document.body.appendChild(el)}
 el.innerHTML=`<img src="images/coach-moon-${pose}.webp" alt="" onerror="this.remove()"><p><b>${L('문 코치','Coach Moon')}</b>${L(ko,en)}</p>`;
 el.classList.remove('show');void el.offsetWidth;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),o.ms||4500);return true}
// call with every final answer: praise runs of right answers, and help after two misses in a row
function coachAnswer(ok){
 if(ok){coachRun++;coachMiss=0;if(![3,5,10,15,20,30].includes(coachRun))return;const n=coachRun,t=coachPick([[`${n}번 연속 성공! 집중력이 대단해요 🌙`,`${n} in a row! Amazing focus 🌙`],[`와, ${n}번 연속이에요! 문 코치가 박수 쳐요 👏`,`Wow, ${n} in a row! Coach Moon is clapping 👏`],[`${n}번 연속! 오늘 머리가 반짝반짝해요 ✨`,`${n} straight! Your brain is sparkling today ✨`]]);coachPop('clap',t[0],t[1],{gap:20000});return}
 coachRun=0;coachMiss++;if(coachMiss!==2)return;const nm=coachEsc(coachNm()),t=coachPick([['괜찮아요! 틀리면서 배우는 거예요. 천천히 다시 봐요 🌙','That’s okay! Mistakes help us learn. Take another look 🌙'],[nm?`${nm}, 할 수 있어요! 문 코치가 응원해요 🌙`:'할 수 있어요! 문 코치가 응원해요 🌙',nm?`You can do it, ${nm}! Coach Moon is cheering 🌙`:'You can do it! Coach Moon is cheering 🌙'],['실수는 배움의 친구예요. 한 번 더 해 봐요!','Mistakes are friends of learning. One more try!']]);coachPop('go',t[0],t[1],{gap:30000})}
// Once a day per game he says hello, a few minutes in he shares a tip, and after 20 minutes he suggests a little rest.
// Each day a game is opened is noted for the main page's praise-stamp board.
function coachStart(hello,tips){const game=(location.pathname.split('/').pop()||'index').replace(/\.html$/,''),k='moonGames.coach'+(MGP.me?'@'+MGP.me.id:''),d=new Date().toLocaleDateString('en-CA');
 const notes=f=>{let st={};try{st=JSON.parse(localStorage.getItem(k)||'{}')||{}}catch(e){}f(st);try{localStorage.setItem(k,JSON.stringify(st))}catch(e){}return st};
 const st=notes(st=>{st.played=(st.played||[]).filter(x=>x!==d).concat(d).slice(-14)}),nm=coachEsc(coachNm());
 // the hello counts as said only once it has really been shown
 if((st.hello||{})[game]!==d)setTimeout(()=>coachLater(()=>setTimeout(()=>{if(coachPop('hi',`${hello[0]} ${nm?`문 코치는 언제나 ${nm} 편이에요 🌙`:'문 코치가 응원해요 🌙'}`,`${hello[1]} ${nm?`Coach Moon is always on your side, ${nm} 🌙`:'Coach Moon is cheering for you 🌙'}`,{force:true,ms:6000}))notes(st=>{(st.hello=st.hello||{})[game]=d})},900)),2500);
 if(tips&&tips.length)setTimeout(()=>{const t=coachPick(tips);coachPop('idea',t[0],t[1],{ms:6000})},4*60000);
 setTimeout(()=>coachLater(()=>coachPop('go','벌써 20분이나 열심히 했어요! 눈이 피곤하면 잠깐 쉬어도 좋아요 🌙','20 minutes of hard work already! Rest your eyes for a bit if they’re tired 🌙',{force:true,ms:7000})),20*60000)}
// Chrome's read-aloud voice can freeze: it says it is speaking, but no sentence ever starts and every later one waits behind it.
// Starting a sentence the instant after cancel() is a common trigger, so a sentence that follows a cancel waits a moment.
// A sentence that has not started after 3 seconds is cancelled and tried once more; if that try is stuck too,
// Coach Moon says once how to get the voice back, instead of the game going quiet with no reason.
(()=>{const ss=window.speechSynthesis;if(!ss||ss.__mgGuard||typeof SpeechSynthesisUtterance!=='function')return;ss.__mgGuard=1;
 const speak0=ss.speak.bind(ss),cancel0=ss.cancel.bind(ss),live=new Set();let gen=0,cutAt=0,told=false;
 ss.cancel=()=>{gen++;if(ss.speaking||ss.pending)cutAt=performance.now();live.clear();cancel0()};
 const send=(u,my,retry)=>{if(my!==gen)return;const watch=!live.size;let started=false;live.add(u);
  u.addEventListener('start',()=>{started=true});['end','error'].forEach(e=>u.addEventListener(e,()=>live.delete(u)));
  try{if(ss.paused)ss.resume()}catch(e){}speak0(u);if(!watch)return;
  setTimeout(()=>{if(started||my!==gen||!live.has(u))return;live.delete(u);cancel0();
   if(!retry){const c=new SpeechSynthesisUtterance(u.text);['lang','voice','rate','pitch','volume'].forEach(k=>{try{c[k]=u[k]}catch(e){}});setTimeout(()=>send(c,my,true),200)}
   else if(!told){told=true;if(typeof coachPop==='function')coachPop('idea','목소리가 잠깐 멈췄어요. 브라우저를 완전히 껐다 켜면 다시 들려요 🌙','The voice got stuck. Close the browser fully and open it again to hear it 🌙',{force:true,ms:8000})}},3000)};
 ss.speak=u=>{const my=gen,wait=cutAt+150-performance.now();if(wait>0)setTimeout(()=>send(u,my,false),wait);else send(u,my,false)}})();
/*COACH:END*/
function applyLang(){if(LANG!=='en')return;document.querySelectorAll('[data-en]').forEach(el=>{el.textContent=el.dataset.en});for(const a of ['aria-label','placeholder','title'])document.querySelectorAll('[data-en-'+a+']').forEach(el=>el.setAttribute(a,el.getAttribute('data-en-'+a)))}
function setLang(next){try{localStorage.setItem('moonGames.lang',next)}catch(e){}try{speechSynthesis.cancel()}catch(e){}const u=new URL(location.href);u.searchParams.set('lang',next);location.replace(u.href)}
</script>
<script>
/* Player profile picked on the main page. Each game keeps its save per profile ("key@profileId"),
   so players never share progress and resetting one game leaves every other game alone. */
const MGP=(()=>{let P=null;try{P=JSON.parse(localStorage.getItem('moonGames.profiles')||'null')}catch(e){}
 const me=P&&Array.isArray(P.list)&&P.list.find(x=>x&&x.id===P.cur)||null;
 if(me){const S=Storage.prototype,g=S.getItem,s=S.setItem,r=S.removeItem,own=/^(little-detective-|marbleRush\.|marble3dsettings|chessKnights\.|scienceGuardians\.|musicAcademy\.|mathAquarium\.|pythonIsland\.)/,k=x=>{x=String(x);return own.test(x)&&!x.includes('@')?x+'@'+me.id:x};
  S.getItem=function(x){return g.call(this,k(x))};S.setItem=function(x,v){return s.call(this,k(x),v)};S.removeItem=function(x){return r.call(this,k(x))}}
 return {me}})();
</script>

.place .dots{display:flex;gap:4px;margin-top:4px}.place .dots i{width:12px;height:12px;border-radius:50%;background:#dde9e6}.place .dots i.d{background:var(--leaf)}.place .dots i.b{background:#ffc53d;box-shadow:0 0 0 2px #fff3c4}

/* ---------------------------------------------------------------- mission screen */
.phead{display:flex;align-items:center;gap:8px;margin-bottom:4px}

.copts{display:grid;gap:8px;margin-bottom:8px}.copt{position:relative;text-align:left;border:3px solid transparent;border-radius:16px;background:var(--codebg);padding:6px 4px 6px 40px;box-shadow:0 3px 0 #dfe8dc}

/* ---------------------------------------------------------------- turtle board */
.tboard{position:relative;margin:2px auto;border-radius:14px;overflow:hidden;box-shadow:0 0 0 3px #e9dfc4}

/* ---------------------------------------------------------------- message board (console) */
.stagebox.text{align-items:stretch}

.tin label{display:flex;flex-direction:column;gap:6px;margin-top:8px;font-weight:800}.tin label span{display:flex;gap:6px}.tin input,.askin{flex:1;min-height:48px;border-radius:12px;border:2px solid #9fd3c8;padding:0 12px;font-size:17px}

.var.changed{animation:pop .5s}.var.changed .vn{background:#ffcf3d}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
.var .bx{min-width:52px;min-height:40px;padding:6px 10px;border-radius:10px;background:linear-gradient(180deg,#ffe1a3,#f8c56a);box-shadow:inset 0 -4px 0 #d9a040;display:grid;place-items:center;font-family:var(--mono);font-weight:800}

.v-str{color:#9a4b00}.v-num{color:#5d2bb8}.v-bool{color:#c2348a}.v-none{color:#888}.v-mini{font-family:var(--mono);font-size:13px}.v-obj{font-weight:800}
.cars{display:flex;align-items:flex-end;gap:3px;flex-wrap:wrap}.engine{font-size:30px;line-height:1}

.fnchip{display:inline-block;padding:6px 10px;border-radius:12px;background:#e6f7f2;font-family:var(--mono);font-weight:800;color:#0b5f5a}

const codeLines=code=>String(code).split('\n').filter(l=>l.trim()&&!l.trim().startsWith('#')&&!LOCKED.test(l)).length;
function run(m,code,o={}){let stage=null;const opt={seed:o.seed??7,inputs:o.inputs||m.inputs||[],maxTrace:o.maxTrace??2500,vars:o.vars};
 if(m.stage==='grid'){stage=STAGE.grid(m.grid);opt.world=stage.api}
 else if(m.stage==='turtle'){stage=STAGE.turtle();opt.modules=stage.modules}
 const r=PY.run(code,opt);r.stage=stage;r.code=code;return r}
const refCache=new Map();
function ref(m,inputs){const k=m.id+'|'+JSON.stringify(inputs||m.inputs||[]);if(!refCache.has(k))refCache.set(k,run(m,m.solution,{inputs:inputs||m.inputs,maxTrace:1,vars:false}));return refCache.get(k)}
// {ok, why, …}: why = 'error' | 'input' | 'apples' | 'home' | 'drawing' | 'output' | 'uses' | 'short'
function judge(m,r,o={}){
 if(r.need)return {ok:false,why:'input'};
 if(r.err)return {ok:false,why:'error',err:r.err,world:/^(Bump|NoApple)$/.test(r.err.type)};
 const g=m.goal||{},make=m.kind==='make';
 if(m.stage==='grid'){const s=r.stage.result();if(!s.ok)return {ok:false,why:s.left?'apples':'home',left:s.left,home:s.home}}
 const want=make?null:ref(m,r.inputs);
 if(m.stage==='turtle'){const d=r.stage.drawing();
  if(make){const n=d.segs.length+d.dots.length+d.fills.length;if(n<(g.minSegs||1))return {ok:false,why:'short',need:g.minSegs||1,have:n}}
  else{const sim=STAGE.sameDrawing(d,want.stage.drawing());if(sim<.95)return {ok:false,why:'drawing',sim}}}
 if(m.stage==='text'){
  if(make){const n=norm(r.out).split('\n').filter(x=>x.trim()).length;if(n<(g.minOut||1))return {ok:false,why:'short',need:g.minOut||1,have:n}}
  else if(norm(r.out)!==norm(want.out))return {ok:false,why:'output',want:norm(want.out),got:norm(r.out)}}
 if(g.uses){const ins=PY.inspect(r.code);for(const u of g.uses)if(!has(ins,u))return {ok:false,why:'uses',use:u}}
 return {ok:true}}
const has=(ins,u)=>ins.kinds.has(u)||ins.calls.has(u)||ins.attrs.has(u.replace(/^\./,''))&&u.startsWith('.');
function bonusOk(m,code){const b=m.bonus;if(!b)return false;if(b.maxLines&&codeLines(code)>b.maxLines)return false;if(b.uses){const ins=PY.inspect(code);if(!b.uses.every(u=>has(ins,u)))return false}return true}
// does a solution line come from this tile? (slots match a number, or one of the choices)
function tileMatch(tile,line){const parts=[],vals=[];let last=0;for(const m of tile.matchAll(SLOT)){parts.push(tile.slice(last,m.index));vals.push(m[1].split('|'));last=m.index+m[0].length}parts.push(tile.slice(last));
 const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');const re=new RegExp('^'+parts.map(esc).join('(.+?)')+'$');const mm=re.exec(line.trim());if(!mm)return false;
 return vals.every((opts,k)=>{const v=mm[k+1];return opts.length===1&&/^-?\d+(\.\d+)?$/.test(opts[0])?/^-?\d+(\.\d+)?$/.test(v):opts.includes(v)})}
return {SLOT,slotsOf,fill,norm,run,ref,judge,bonusOk,tileMatch,codeLines,lockCount,LOCKED}})();
</script>

WORLD(7,{icon:'🛠️',name:'발명가 공방|Inventor’s Workshop',concept:'함수 만들기|Making functions',
 intro:['여기는 발명가 공방이에요! 오늘은 나만의 새 명령을 발명해요.|This is the Inventor’s Workshop! Today we invent our very own commands.',
  '`def` 단어로 레시피 카드를 써요. 이런 카드를 함수라고 해요.|`def` writes a recipe card. A card like this is called a function.',

 intro:['어서 오세요, 이름표 매점이에요! 여기 메뉴판은 딕셔너리로 만들어요.|Welcome to the Name-Tag Snack Shop! Our menu board is made with a dict.',

  solution:'class Pet:\n    def __init__(self, name):\n        self.name = name\n\n    def speak(self):\n        print(self.name, "멍멍!")\n\na = Pet("뭉치")\nb = Pet("초코")\nb.speak()\na.speak()',
  why:'`b.speak()` 코드를 먼저 불렀어요. 이때 `self` 자리에는 `b` 객체, 초코가 들어가요. 그래서 초코가 먼저 말해요.|`b.speak()` is called first, so `self` is `b`, and `b`’s name, "초코", prints first.',
  learn:'메서드는 객체가 할 수 있는 일이에요. `self` 자리에는 그 메서드를 부른 객체가 들어가요.|A method is something an object can do. `self` is the object that called it.',
  hints:['맨 아래 두 줄을 봐요. 누가 먼저 `speak()` 메서드를 부르나요?|Look at the last two lines. Who calls `speak()` first?','`b.speak()` 코드에서는 `self` 자리가 `b` 객체예요. `b` 객체의 이름은 뭐였죠?|In `b.speak()`, `self` is `b`. What was `b`’s name?']},
 {id:'w11-4',kind:'fix',stage:'text',title:'목소리를 찾아요|Find the voice',scene:'🐱❓',
  say:'아기 고양이가 인사하려는데 에러가 나요! 메서드 첫 줄에 꼭 있어야 할 게 빠졌어요.|The kitten wants to say hi, but there’s an error! Something is missing from the method’s first line.',
  code:'class Pet:\n    def __init__(self, name):\n        self.name = name\n\n    def speak():\n        print(self.name, "야옹!")\n\nc = Pet("나비")\nc.speak()',bug:5,
  fixes:['    def speak(self):','    def speak(self)','    def speak(name):'],
  solution:'class Pet:\n    def __init__(self, name):\n        self.name = name\n\n    def speak(self):\n        print(self.name, "야옹!")\n\nc = Pet("나비")\nc.speak()',
  learn:'메서드를 만들 때는 괄호 첫 칸에 꼭 `self` 이름을 써요. 그래야 메서드가 자기 객체를 알아요.|When you make a method, put `self` first in the brackets. That’s how the method knows its object.',
  hints:['▶ 실행해서 에러 설명을 읽어 봐요. 어느 줄이 문제일까요?|Press ▶ Run and read the error. Which line is the problem?','`__init__` 메서드의 첫 줄과 `speak` 메서드의 첫 줄을 비교해 봐요.|Compare the first line of `__init__` with the first line of `speak`.','메서드 괄호의 첫 칸에는 `self` 이름이 와요. 콜론(:)도 잊지 말아요.|A method’s brackets start with `self`. Don’t forget the colon (:) too.']},
 {id:'w11-5',kind:'blank',stage:'text',title:'냠냠 밥 주기|Feeding time',scene:'🐶🍖',
  say:'밥을 먹으면 배고픔이 1 줄어요. 뭉치에게 밥을 줘서 배고픔을 2로 만들어요!|Eating lowers hunger by 1. Feed the puppy so its hunger becomes 2!',
  code:'class Pet:\n    def __init__(self, name):\n        self.name = name\n        self.hunger = 3\n\n    def feed(self):\n        <<self.hunger|hunger>> = self.hunger - 1\n\np = Pet("뭉치")\np.<<feed()|feed>>\nprint(p.name, "배고픔", p.hunger)',
  solution:'class Pet:\n    def __init__(self, name):\n        self.name = name\n        self.hunger = 3\n\n    def feed(self):\n        self.hunger = self.hunger - 1\n\np = Pet("뭉치")\np.feed()\nprint(p.name, "배고픔", p.hunger)',
  learn:'메서드 안에서 `self.hunger` 속성을 바꾸면 그 객체의 값이 진짜로 바뀌어요. 메서드는 괄호를 붙여 불러요.|Changing `self.hunger` in a method really changes that object. Call a method with brackets.',
  hints:['실행하면서 메모리 칸의 `Pet` 카드를 봐요. 배고픔 숫자가 바뀌나요?|Run it and watch the `Pet` card. Does the hunger number change?','`self.` 부분이 없으면 잠깐 쓰고 사라지는 상자라서 카드는 그대로예요.|Without `self.`, it’s just a quick box that disappears, so the card stays the same.','메서드는 `feed()` 모양처럼 괄호를 붙여야 실행돼요.|A method only runs with brackets, like `feed()`.']},
 {id:'w11-6',kind:'tiles',stage:'text',title:'다 같이 밥 먹자|Dinner for all',scene:'🐶🐱🐹🍖',
  say:'동물 세 마리가 리스트 기차에 탔어요. 반복으로 한 마리씩 밥을 주고 배고픔을 보여 줘요!|Three pets are on a list train. Use a loop to feed each one and show its hunger!',
  start:'class Pet:\n    def __init__(self, name):\n        self.name = name\n        self.hunger = 3\n\n    def feed(self):\n        self.hunger = self.hunger - 1\n\npets = [Pet("뭉치"), Pet("나비"), Pet("초코")]',
  tiles:['for p in pets:','p.feed()','pets.feed()','print(p.name, "배고픔", p.hunger)'],
  goal:{uses:['For']},
  solution:'class Pet:\n    def __init__(self, name):\n        self.name = name\n        self.hunger = 3\n\n    def feed(self):\n        self.hunger = self.hunger - 1\n\npets = [Pet("뭉치"), Pet("나비"), Pet("초코")]\nfor p in pets:\n    p.feed()\n    print(p.name, "배고픔", p.hunger)',
  learn:'객체를 리스트 기차에 태우면 `for` 반복으로 한 마리씩 차례로 돌볼 수 있어요.|Put objects on a list train, and a `for` loop can care for them one by one.',
  hints:['`for p in pets:` 줄을 쓰면 `p` 상자에 동물이 한 마리씩 들어가요.|With `for p in pets:`, the box `p` holds one pet at a time.','밥은 기차 전체가 아니라 `p` 상자 속 동물에게 줘요.|Feed the pet in the box `p`, not the whole train.','반복 안의 두 줄은 ⇥ 버튼으로 들여 써요. 밥을 먼저 주고, 그다음에 보여 줘요.|Indent the two lines inside the loop with ⇥. Feed first, then show.']},
 {id:'w11-7',kind:'make',stage:'text',title:'나만의 쿠키틀|My own cutter',scene:'🤖🐶🍪',
  say:'이제 친구만의 틀을 만들 차례예요! 로봇, 동물, 쿠키 뭐든 좋아요.|Now it’s your turn to make a cutter! A robot, a pet, a cookie, anything.',
  idea:'나만의 클래스를 만들고, 객체를 두 개 이상 찍어서 말하게 해요!|Make your own class, press out two or more objects, and make them talk!',
  tiles:['class <<Robot|Pet|Cookie>>:','def __init__(self, name):','self.name = name','self.happy = <<5>>','def speak(self):','print(self.name, <<"삐빅!"|"멍멍!"|"바삭바삭!">>)','def play(self):','self.happy = self.happy + 1','print(self.name, "기분", self.happy)','<<a|b>> = <<Robot|Pet|Cookie>>(<<"동동"|"반짝"|"뭉치"|"나비"|"별"|"하트">>)','<<a|b>>.speak()','<<a|b>>.play()'],
  goal:{minOut:2,uses:['Class']},
  solution:'class Robot:\n    def __init__(self, name):\n        self.name = name\n        self.happy = 5\n\n    def speak(self):\n        print(self.name, "삐빅!")\n\n    def play(self):\n        self.happy = self.happy + 1\n        print(self.name, "기분", self.happy)\n\na = Robot("동동")\nb = Robot("반짝")\na.speak()\nb.speak()\nb.play()',
  bonus:{ko:'객체들을 리스트에 넣고 `for` 반복으로 모두 말하게 해 봐요!',en:'Put your objects in a list and make them all talk with a `for` loop!',uses:['For']},
  bonusSolution:'class Robot:\n    def __init__(self, name):\n        self.name = name\n        self.happy = 5\n\n    def speak(self):\n        print(self.name, "삐빅!")\n\nrobots = [Robot("동동"), Robot("반짝"), Robot("뚝딱")]\nfor r in robots:\n    r.speak()',
  learn:'틀 하나를 잘 만들면 객체를 몇 개든 찍어 낼 수 있어요. 그게 클래스의 힘이에요!|Make one good cutter and you can press out as many objects as you like. That’s the power of classes!',
  hints:['먼저 틀(클래스)을 만들고, 다음에 객체를 찍고, 마지막에 메서드를 불러요.|First the cutter (class), then press out objects, then call methods.','틀 안의 줄은 ⇥ 버튼으로 한 번, 메서드 안의 줄은 두 번 들여 써요.|Indent lines inside the cutter once with ⇥, and lines inside a method twice.','틀 이름과 객체를 찍을 때 쓰는 이름이 같아야 해요.|The class name must match the name you use to press out objects.']}
 ]});
WORLD(12,{icon:'🎪',name:'섬 축제|Island Festival',concept:'모두 함께|Everything together',
 intro:['드디어 섬 축제 날이에요! 지금까지 배운 걸 모두 모아서 축제를 준비해요.|It’s festival day on the island! Let’s use everything we’ve learned to get ready.',
  '반복, 조건, 함수, 리스트, 딕셔너리, 집합, 클래스… 친구는 벌써 다 할 줄 알아요!|Loops, ifs, functions, lists, dicts, sets, classes… you already know them all!',
  '작은 프로그램을 하나씩 만들면서 축제를 즐겨요. 🎉|Let’s enjoy the festival by making one small program at a time. 🎉'],
 demo:'festival = ["🎈", "🍭", "🎆"]\nfor thing in festival:\n    print(thing, "준비 완료!")',
 missions:[
 {id:'w12-1',kind:'watch',stage:'turtle',title:'축제 포스터|Festival poster',
  say:'축제 포스터를 그려요! 깃발 함수와 반복이 함께 일해요. ▶ 실행해서 봐요.|Let’s draw the festival poster! A flag function and a loop work together. Press ▶ Run.',
  code:'from turtle import *\nbgcolor("lightyellow")\n\ndef flag():\n    begin_fill()\n    for k in range(3):\n        forward(30)\n        right(120)\n    end_fill()\n    forward(40)\n\ncolor("orange")\npenup()\ngoto(-120, 130)\npendown()\nfor i in range(<<6>>):\n    flag()\n\npenup()\ngoto(-50, 30)\nwrite("🎪 섬 축제 🎪")\ngoto(-90, -80)\ncolor("hotpink")\nfor i in range(<<4>>):\n    dot(40)\n    forward(60)',
  notes:{4:'`def flag():` 줄은 깃발 하나를 그리는 레시피 카드예요.|`def flag():` is a recipe card for one flag.',
   6:'세 번 그리고 돌면 세모 깃발이 돼요.|Draw and turn three times to make a triangle flag.',
   10:'`forward(40)` 코드로 다음 깃발 자리로 가요.|`forward(40)` moves on to the next flag’s spot.',
   16:'반복이 `flag()` 레시피를 여러 번 불러요. 숫자를 바꿔 봐요!|The loop uses the `flag()` recipe many times. Try changing the number!',
   21:'`write()` 함수로 포스터에 글자를 써요.|`write()` puts words on the poster.',
   24:'반복으로 `dot()` 함수를 여러 번 불러서 풍선을 찍어요.|The loop uses `dot()` again and again to stamp balloons.'},
  solution:'from turtle import *\nbgcolor("lightyellow")\n\ndef flag():\n    begin_fill()\n    for k in range(3):\n        forward(30)\n        right(120)\n    end_fill()\n    forward(40)\n\ncolor("orange")\npenup()\ngoto(-120, 130)\npendown()\nfor i in range(6):\n    flag()\n\npenup()\ngoto(-50, 30)\nwrite("🎪 섬 축제 🎪")\ngoto(-90, -80)\ncolor("hotpink")\nfor i in range(4):\n    dot(40)\n    forward(60)',
  learn:'함수와 반복을 함께 쓰면 짧은 코드로도 멋진 그림을 그릴 수 있어요.|With a function and a loop together, short code can draw something great.',
  hints:['▶ 실행하고 깃발과 풍선이 몇 개 그려지는지 세어 봐요.|Press ▶ Run and count the flags and balloons.','`range()` 함수 안의 숫자를 바꾸면 깃발이나 풍선 수가 바뀌어요.|Change a number in `range()` to change how many flags or balloons.']},
 {id:'w12-2',kind:'type',stage:'text',title:'간식 가게 계산|Snack-stand sales',scene:'🍢🍭🧃',
  say:'축제 간식 가게가 문을 열었어요! 주문을 모두 더해서 오늘 번 돈을 알려 줘요.|The festival snack stand is open! Add up all the orders to show today’s earnings.',
  start:'menu = {"떡볶이": 3, "솜사탕": 2, "주스": 1}\norders = ["솜사탕", "떡볶이", "솜사탕", "주스"]\ntotal = 0\n\nprint("오늘 번 돈은", total, "코인!")',
  snippets:['for food in orders:','menu[food]','total = total + '],
  goal:{uses:['For']},
  solution:'menu = {"떡볶이": 3, "솜사탕": 2, "주스": 1}\norders = ["솜사탕", "떡볶이", "솜사탕", "주스"]\ntotal = 0\nfor food in orders:\n    total = total + menu[food]\nprint("오늘 번 돈은", total, "코인!")',
  learn:'리스트에서 주문을 하나씩 꺼내고, 딕셔너리 메뉴판에서 값을 찾아 더했어요. 진짜 가게 프로그램이에요!|You took each order from the list, found its price in the dict, and added it up. A real shop program!',
  hints:['주문 리스트를 반복으로 하나씩 꺼내요. 그리고 메뉴판에서 그 간식의 값을 찾아요.|Take the orders one by one with a loop, then find each snack’s price on the menu board.','`total = 0` 줄과 `print` 줄 사이에 반복을 넣어요.|Put the loop between the `total = 0` line and the `print` line.','`for food in orders:` 줄을 쓰고, 그 아래에 `total = total + menu[food]` 줄을 한 칸 들여 써요.|Write `for food in orders:`, then indent `total = total + menu[food]` under it.']},
 {id:'w12-3',kind:'predict',stage:'text',title:'스티커 바꾸기|Sticker swap',scene:'🐶🐱🐰🐼🦊',
  say:'친구랑 스티커를 바꿔요! 주머니는 같은 스티커를 두 장 넣지 않아요. 무엇이 나올까요?|Let’s trade stickers! The pouch never takes doubles. What will it print?',
  code:'mine = {"🐶", "🐱", "🐰"}\nfriend = {"🐱", "🐼", "🦊"}\nmine.add("🐼")\nmine.add("🐱")\nprint(len(mine))\nprint(len(mine | friend))\nif "🦊" in mine:\n    print("여우 있어요!")\nelse:\n    print("여우 없어요")',
  ask:'어떤 글자가 나올까요?|What will be printed?',
  options:['4\n5\n여우 없어요','5\n6\n여우 없어요','4\n5\n여우 있어요!'],
  solution:'mine = {"🐶", "🐱", "🐰"}\nfriend = {"🐱", "🐼", "🦊"}\nmine.add("🐼")\nmine.add("🐱")\nprint(len(mine))\nprint(len(mine | friend))\nif "🦊" in mine:\n    print("여우 있어요!")\nelse:\n    print("여우 없어요")',
  why:'🐱 스티커는 이미 있어서 안 들어가요. 그래서 4장이에요. 두 주머니를 합치면 새 주머니가 생길 뿐, 내 주머니엔 여우가 없어요.|🐱 was already there, so it’s still 4. Joining the pouches makes a new pouch; my pouch still has no fox.',
  learn:'집합 주머니에는 같은 스티커가 한 장만 들어가요. 그래서 겹치지 않게 세기 편해요.|A set pouch holds just one of each sticker, so counting without doubles is easy.',
  hints:['한 줄씩 따라가며 내 주머니 속 스티커를 손가락으로 세어 봐요.|Go line by line and count the stickers in my pouch on your fingers.','`mine.add("🐱")` 코드에서는 🐱 스티커가 이미 있었는지 확인해요.|At `mine.add("🐱")`, check whether 🐱 was already there.','두 주머니를 합치는 줄은 새 주머니를 만들어요. `mine` 주머니는 그대로예요.|The line that joins the pouches makes a new pouch. `mine` itself doesn’t change.']},
 {id:'w12-4',kind:'tiles',stage:'text',title:'축제 퀴즈 쇼|Festival quiz show',scene:'🎤❓🏆',inputs:['8','7'],
  say:'축제 퀴즈 쇼예요! 두 번째 문제를 채점하는 코드를 만들어요. 맞히면 1점이 올라요.|It’s the festival quiz show! Build the code that checks question 2. A right answer adds 1 point.',
  start:'score = 0\nanswer = input("3 + 5 = ")\nif answer == "8":\n    score = score + 1\nanswer = input("무지개는 몇 색? ")',
  tiles:['if answer == <<"7"|7>>:','score = score + 1','print("점수:", score)','if answer = "7":'],
  goal:{uses:['If']},
  solution:'score = 0\nanswer = input("3 + 5 = ")\nif answer == "8":\n    score = score + 1\nanswer = input("무지개는 몇 색? ")\nif answer == "7":\n    score = score + 1\nprint("점수:", score)',
  learn:'`input()` 함수로 답을 받고 `if` 조건으로 채점했어요. 점수는 `score` 상자에 차곡차곡 쌓여요.|You took answers with `input()` and checked them with `if`. Points pile up in the `score` box.',
  hints:['첫 번째 문제를 채점하는 코드를 잘 보고 똑같은 모양으로 만들어요.|Look at how question 1 is checked and build the same shape.','`input()` 함수로 받은 답은 글자예요. 그래서 따옴표가 있는 `"7"` 값과 비교해요.|An answer from `input()` is text, so compare it with `"7"` in quotes.','같은지 비교할 때는 `==` 기호를 써요. 점수를 보여 주는 줄은 맨 끝에 들여 쓰지 않고 놓아요.|Use `==` to compare. Put the line that shows the score at the very end, not indented.']},
 {id:'w12-5',kind:'fix',stage:'text',title:'동물 자랑 대회|Pet show',scene:'🐶🐱🐹🎀',
  say:'동물 자랑 대회가 시작됐는데 에러가 나요! 한 마리씩 재주를 보여 주게 고쳐 줘요.|The pet show has started, but there’s an error! Fix it so each pet shows its trick.',
  code:'class Pet:\n    def __init__(self, name, trick):\n        self.name = name\n        self.trick = trick\n\n    def show(self):\n        print(self.name, "-", self.trick, "👏")\n\npets = [Pet("뭉치", "공 굴리기"),\n        Pet("나비", "높이 뛰기"),\n        Pet("콩이", "빙글 돌기")]\nfor p in pets:\n    pets.show()',bug:13,
  fixes:['    p.show()','    pets[0].show()','    show()'],
  solution:'class Pet:\n    def __init__(self, name, trick):\n        self.name = name\n        self.trick = trick\n\n    def show(self):\n        print(self.name, "-", self.trick, "👏")\n\npets = [Pet("뭉치", "공 굴리기"),\n        Pet("나비", "높이 뛰기"),\n        Pet("콩이", "빙글 돌기")]\nfor p in pets:\n    p.show()',
  learn:'메서드는 기차 전체가 아니라 객체 하나하나에게 불러요. 반복할 때 `p` 상자에 든 객체에게요!|Call a method on each object, not on the whole train: the object in the loop box `p`!',
  hints:['▶ 실행하고 에러 설명을 읽어 봐요. `pets` 이름은 리스트 기차 전체예요.|Press ▶ Run and read the error. `pets` is the whole list train.','반복할 때마다 동물 한 마리가 `p` 상자에 들어가요. 그 동물에게 재주를 시켜요.|Each time round, one pet is in the box `p`. Ask that pet to do its trick.']},
 {id:'w12-6',kind:'tiles',stage:'grid',title:'축제 퍼레이드|Festival parade',
  say:'축제 퍼레이드예요! 꼬불꼬불 길을 따라가며 사과를 다 먹고 🏠 집까지 가요.|It’s the festival parade! Follow the winding path, eat every apple, and reach 🏠 home.',
  grid:{map:['#########',
             '#P.A....#',
             '#######.#',
             '#..A.G#A#',
             '#.#####.#',
             '#...A...#',
             '#########'],dir:'E'},
  start:'while not at_goal():',
  tiles:['if apple_here():','eat()','if front_is_clear():','move()','else:','turn_right()','turn_left()'],
  goal:{uses:['While','If']},
  solution:'while not at_goal():\n    if apple_here():\n        eat()\n    if front_is_clear():\n        move()\n    else:\n        turn_right()',
  learn:'`while` 반복과 `if` 조건을 함께 쓰면 길이 꼬불꼬불해도 파이가 스스로 판단하며 걸어요.|With `while` and `if` together, Py decides for itself, however the path winds.',
  hints:['파이가 할 일을 먼저 말로 해 봐요. 사과가 있으면 먹고, 앞이 열려 있으면 가고, 막히면 돌아요.|Say Py’s job in words first: apple here? Eat. Way clear? Go. Blocked? Turn.','모퉁이마다 파이는 어느 쪽으로 도나요? 첫 모퉁이를 손가락으로 따라가 봐요.|Which way does Py turn at each corner? Trace the first corner with your finger.','`else:` 줄은 `if` 줄과 같은 깊이로, 그 안의 줄은 한 칸 더 들여 써요.|Put `else:` at the same depth as its `if`, and indent the line inside it one more.']},
 {id:'w12-7',kind:'make',stage:'turtle',title:'축제 불꽃놀이|Festival fireworks',
  say:'축제의 마지막은 불꽃놀이예요! 친구만의 불꽃으로 밤하늘을 가득 채워요. 🎆|The festival ends with fireworks! Fill the night sky with your own fireworks. 🎆',
  idea:'함수와 반복으로 불꽃을 그려요. 다 그리면 놀이터에서 무엇이든 계속 만들어요!|Draw fireworks with a function and a loop. Then keep making anything in the playground!',
  tiles:['bgcolor(<<"black"|"navy">>)','def firework(size):','for i in range(<<12>>):','forward(size)','backward(size)','right(<<30>>)','color(<<"gold"|"pink"|"cyan"|"orange">>)','penup()','pendown()','goto(<<-90>>, <<60>>)','firework(<<60>>)','write(<<"축제 최고!"|"고마워요!"|"또 만나요!">>)'],
  goal:{minSegs:6,uses:['For']},
  solution:'from turtle import *\nbgcolor("black")\n\ndef firework(size):\n    for i in range(12):\n        forward(size)\n        backward(size)\n        right(30)\n\ncolor("gold")\npenup()\ngoto(-90, 60)\npendown()\nfirework(60)\ncolor("pink")\npenup()\ngoto(80, 20)\npendown()\nfirework(45)\ncolor("cyan")\npenup()\ngoto(0, -100)\npendown()\nfirework(35)\npenup()\ngoto(-50, -170)\nwrite("축제 최고!")',
  bonus:{ko:'`def` 레시피로 불꽃을 만들고, `write()` 함수로 축제 인사도 써 봐요!',en:'Make fireworks with a `def` recipe, and write a festival greeting with `write()`!',uses:['Def','write']},
  bonusSolution:'from turtle import *\nbgcolor("navy")\n\ndef firework(size):\n    for i in range(12):\n        forward(size)\n        backward(size)\n        right(30)\n\ncolor("orange")\nfor n in range(3):\n    penup()\n    goto(-120 + n * 110, 40 - n * 50)\n    pendown()\n    firework(40)\npenup()\ngoto(-60, -170)\nwrite("또 만나요!")',
  learn:'배운 걸 모두 모아 멋진 작품을 만들었어요! 놀이터에서 친구만의 프로그램을 계속 만들어 봐요.|You put it all together into something great! Keep making your own programs in the playground.',
  hints:['먼저 `def firework(size):` 레시피를 만들고 그 안에 반복을 넣어요. 12번 × 30도면 딱 한 바퀴예요.|First make the `def firework(size):` recipe with a loop inside. 12 times 30 degrees is one full turn.','`penup()` 함수로 펜을 들고 `goto()` 함수로 옮긴 다음, `pendown()` 함수로 내려서 그려요.|Lift the pen with `penup()`, move with `goto()`, then put it down with `pendown()` and draw.','밤하늘은 어두워요. `color()` 함수로 밝은 색을 골라야 불꽃이 잘 보여요!|The night sky is dark. Pick a bright colour with `color()` so your fireworks show up!']}
 ]});
</script>
<script>
// ================================================================ Little Python Island · core
// Save data, rewards, sound, voice, windows and Py the baby python (drawn in SVG, dressed by the child).

// ---------------------------------------------------------------- helpers
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const dayKey=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addDays=(k,n)=>{const [y,m,d]=k.split('-').map(Number);return dayKey(new Date(y,m-1,d+n))};
const now=()=>Date.now();
// 'ko|en' → the current language; `code` inside text becomes <code>
const T=s=>{const p=String(s).split('|');return LANG==='en'?(p[1]??p[0]):p[0]};
const rich=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\n/g,'<br>');
const tx=s=>rich(T(s));
const COPYRIGHT=()=>`<footer class="copy">© 2026 Dongsun Moon. ${L('모든 권리 보유. 무단 복제와 사용을 금해요.','All rights reserved. No copying or reuse without permission.')}<br>${L('미션, 그림, 캐릭터, 소리, 파이썬 실행기는 이 게임을 위해 새로 만들었어요. Python은 Python Software Foundation의 상표예요.','Missions, art, characters, sounds and the Python runner were made for this game. Python is a trademark of the Python Software Foundation.')}</footer>`;

// ---------------------------------------------------------------- save (one save per profile picked on the main page)
const SAVE_KEY='pythonIsland.v1';
const freshS=()=>({v:1,created:dayKey(),name:L('코딩 친구','Coder'),av:'🧒',xp:0,lvl:1,apples:10,done:{},drafts:{},seen:{},rev:{},
 stats:{runs:0,bugs:0,fixed:0,hints:0,steps:0,missions:0,bonus:0,reviews:0,works:0,days:[]},works:[],
 wear:{color:'leaf',hat:'',acc:''},owned:{color:['leaf'],hat:[''],acc:['']},opt:{sound:true,voice:true,speed:1,big:false},tut:{},today:{day:'',n:0},last:now()});
function loadS(){let d=null;try{d=JSON.parse(localStorage.getItem(SAVE_KEY)||'null')}catch(e){}const f=freshS();if(!d||typeof d!=='object')return f;
 const s={...f,...d};for(const k of ['stats','wear','owned','opt','tut','today'])s[k]={...f[k],...(d[k]||{})};return s}
let S=loadS();
if(MGP.me){S.name=MGP.me.name;S.av=MGP.me.av}
let saveT=0,NOSAVE=false;
const save=(soon=false)=>{const w=()=>{if(NOSAVE)return;S.last=now();try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}};clearTimeout(saveT);if(soon)saveT=setTimeout(w,400);else w()};
window.addEventListener('pagehide',()=>save());document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
function markDay(){const t=dayKey();if(S.today.day!==t)S.today={day:t,n:0};const ds=S.stats.days;if(ds[ds.length-1]!==t){ds.push(t);if(ds.length>60)ds.shift()}}

// ---------------------------------------------------------------- levels and rewards
const TITLES=[[1,'🌱','코딩 새싹|Code Sprout'],[3,'🧭','명령 탐험가|Command Explorer'],[5,'🔎','버그 탐정|Bug Detective'],[8,'🌀','반복 마법사|Loop Wizard'],[11,'🔀','조건 박사|Condition Expert'],[14,'🛠️','함수 발명가|Function Inventor'],[18,'🚂','데이터 기관사|Data Engineer'],[22,'🍪','클래스 건축가|Class Architect'],[26,'🐍','파이썬 레인저|Python Ranger']];
const titleOf=l=>{let t=TITLES[0];for(const x of TITLES)if(l>=x[0])t=x;return {icon:t[1],name:T(t[2])}};
const xpNeed=l=>30+15*l;
function addXP(n){S.xp+=n;let up=false;while(S.xp>=xpNeed(S.lvl)){S.xp-=xpNeed(S.lvl);S.lvl++;up=true}updateHud();return up}
function addApples(n,at){if(!n)return;S.apples+=n;popAt(at,`+${n} 🍎`);updateHud()}

// ---------------------------------------------------------------- sound effects (made in the browser)
let AC=null;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}if(AC&&AC.state==='suspended')AC.resume();return AC}
document.addEventListener('pointerdown',()=>audio(),{capture:true,once:true});
function tone(f,t0,dur,type='sine',vol=.16,slide=0){const ac=AC;if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f*slide),t0+dur);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.012);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+dur+.05)}
function sfx(name){if(!S.opt.sound)return;const ac=audio();if(!ac)return;const t=ac.currentTime+.01;
 switch(name){
  case 'tap':tone(660,t,.06,'triangle',.07);break;
  case 'tile':tone(520,t,.05,'square',.04);tone(780,t+.04,.06,'triangle',.06);break;
  case 'step':tone(420+Math.random()*60,t,.05,'triangle',.05);break;
  case 'move':tone(300,t,.07,'sine',.08,1.5);break;
  case 'turn':tone(500,t,.06,'triangle',.05,.8);break;
  case 'eat':tone(700,t,.06,'square',.05);tone(980,t+.06,.1,'square',.05);break;
  case 'bump':tone(160,t,.18,'sine',.14,.6);break;
  case 'draw':tone(880,t,.04,'sine',.025);break;
  case 'print':tone(1200,t,.03,'square',.025);break;
  case 'good':[523,659,784].forEach((f,k)=>tone(f,t+k*.07,.18,'triangle',.13));break;
  case 'oops':tone(392,t,.14,'triangle',.1);tone(330,t+.12,.2,'triangle',.08);break;
  case 'win':[523,659,784,1047].forEach((f,k)=>tone(f,t+k*.1,.3,'triangle',.13));tone(1047,t+.4,.5,'sine',.07);break;
  case 'coin':tone(988,t,.08,'square',.05);tone(1319,t+.07,.16,'square',.05);break;
  case 'fanfare':[523,523,523,659,784,659,784,1047].forEach((f,k)=>tone(f,t+k*.13,k===7?.8:.16,'square',.06));break;
  default:tone(520,t,.08,'triangle',.07)}}

// ---------------------------------------------------------------- voice (Py reads story lines, hints and explanations; code is never read)
let voices=[];
const NOVELTY=/albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|deranged|hysterical|grandma|grandpa|eddy|flo\b|reed|rocko|sandy|shelley/i;
function loadVoices(){try{voices=speechSynthesis.getVoices().filter(v=>(v.lang||'').toLowerCase().startsWith(LANG)&&!NOVELTY.test(v.name))}catch(e){voices=[]}}
if('speechSynthesis' in window){loadVoices();try{speechSynthesis.addEventListener('voiceschanged',loadVoices)}catch(e){}}
const bestVoice=()=>voices.find(v=>/google|yuna|sora|samantha|ava|allison|natural|premium|enhanced|siri/i.test(v.name))||voices[0]||null;
// read code names plainly: `move()` → "move", symbols and emoji dropped
function speakable(t){t=String(t).replace(/<[^>]+>/g,' ');
 t=t.replace(/`([^`]*)`/g,(m,c)=>' '+c.replace(/[()[\]{}:"'#=<>.,_*+\-/%]/g,' ').replace(/\s+/g,' ').trim()+' ');
 t=t.replace(/[→➡]/g,' ').replace(/\p{Extended_Pictographic}|‍|️/gu,' ').replace(/[▶⏹👣💡]/g,' ');
 return t.replace(/[()…·•"“”]/g,' ').replace(/\s+/g,' ').trim()}
let pendingSay=null,saySeq=0;
document.addEventListener('pointerdown',()=>{const p=pendingSay;pendingSay=null;if(p)setTimeout(()=>{if(p.seq===saySeq)say(p.t,p.o)},250)},{capture:true,once:true});
function say(text,o={}){const end=o.onend||null;if(!(S.opt.voice||o.force)||!('speechSynthesis' in window)||!text){if(end)setTimeout(end,200);return}
 saySeq++;const seq=saySeq;if(navigator.userActivation&&!navigator.userActivation.hasBeenActive){pendingSay={t:text,o,seq};if(end)setTimeout(end,200);return}
 try{speechSynthesis.cancel();const words=speakable(text),u=new SpeechSynthesisUtterance(words),v=bestVoice();if(v)u.voice=v;u.lang=LANG==='en'?'en-US':'ko-KR';u.rate=LANG==='en'?.95:1;u.pitch=1.15;
  let fired=false;const fire=()=>{if(fired||seq!==saySeq)return;fired=true;if(end)end()};u.onend=fire;u.onerror=fire;setTimeout(fire,Math.min(15000,800+words.length*95));speechSynthesis.speak(u)}catch(e){if(end)end()}}
const hush=()=>{saySeq++;try{speechSynthesis.cancel()}catch(e){}};

// ---------------------------------------------------------------- praise for the way the child worked (process, not talent)
const PRAISE={
 first:['한 번에 해냈어요! 차근차근 생각한 덕분이에요.|First try! Thinking step by step paid off.','처음부터 딱 맞았어요! 코드를 꼼꼼히 읽었네요.|Right the first time! You read the code carefully.'],
 retry:['다시 고쳐서 해냈어요! 그게 진짜 개발자의 방법이에요.|You fixed it and got there. That’s how real coders work!','포기하지 않고 끝까지 했어요. 멋져요!|You didn’t give up. Great!','실행해 보고 고치고, 또 실행했죠. 최고의 방법이에요!|Run, fix, run again: the best way to code!'],
 bug:['버그를 찾아서 고쳤어요! 이제 버그 탐정이에요 🔎|You found and fixed the bug! You’re a bug detective now 🔎'],
 hint:['힌트를 잘 써서 해냈어요. 도움을 받는 것도 좋은 전략이에요.|You used the hints well. Asking for help is a smart strategy.'],
 loop:['반복을 써서 코드를 짧고 똑똑하게 만들었어요!|You used a loop to make the code short and smart!'],
 func:['나만의 함수를 만들어서 썼어요. 발명가 같아요!|You made and used your own function, like an inventor!'],
 predict:['예측이 딱 맞았어요! 코드를 머릿속으로 실행했네요.|Your prediction was spot on! You ran the code in your head.'],
 make:['친구만의 작품이 생겼어요! 세상에 하나뿐인 코드예요.|You made your own work! There’s no other code like it.']};
const praise=k=>T(pick(PRAISE[k]));

// ---------------------------------------------------------------- Py, the baby python (SVG; colour, hat and accessory come from the wardrobe)
const COLORS={leaf:['#4cc96a','#2f9e4f','#c9f5c0','🌿 연두|🌿 Leaf',0],sky:['#4fb6ff','#2683d6','#d2ecff','💧 하늘|💧 Sky',30],berry:['#ff7eb6','#d94f8d','#ffd9ea','🍓 딸기|🍓 Berry',30],grape:['#a17cff','#6f4fd6','#e6dcff','🍇 포도|🍇 Grape',40],
 sun:['#ffc53d','#e09a00','#fff0bf','🌞 해님|🌞 Sun',40],mint:['#4fd8c4','#1fa592','#d0f7f1','🍃 민트|🍃 Mint',50],coral:['#ff8a5c','#e05a2a','#ffe0d2','🪸 산호|🪸 Coral',50],night:['#5a6bd8','#3343a8','#dfe3ff','🌙 밤하늘|🌙 Night',80],
 rainbow:['url(#pyRainbow)','#9b59d6','#fff','🌈 무지개|🌈 Rainbow',150],gold:['url(#pyGold)','#c58b00','#fff6d0','👑 황금|👑 Gold',0]};
const HATS={'':['','없음|None',0],cap:['🧢','모자|Cap',20],bow:['🎀','리본|Bow',20],flower:['🌸','꽃|Flower',25],party:['🥳','파티|Party',30],tophat:['🎩','신사 모자|Top hat',40],crown:['👑','왕관|Crown',90],grad:['🎓','학사모|Grad cap',0],chef:['👨‍🍳','요리사|Chef',0]};
const ACCS={'':['','없음|None',0],glasses:['👓','안경|Glasses',25],shades:['🕶️','선글라스|Shades',35],scarf:['🧣','목도리|Scarf',30],star:['⭐','별 배지|Star badge',0]};
// prizes that are only won by finishing worlds (never bought)
const WORLD_PRIZE={4:['acc','star'],8:['hat','chef'],12:['hat','grad'],11:['color','gold']};
// 3D pictures of Py (images/py-<pose>.webp) are used once they are listed here; until then Py is drawn in SVG.
// The wardrobe colours then become a hue filter on the picture.
const PY_HAVE=new Set(['hi','wow','think','oops']),PY_POSE={happy:'hi',wow:'wow',think:'think',oops:'oops'};
const PY_TINT={leaf:'',sky:'hue-rotate(130deg) saturate(1.15)',berry:'hue-rotate(255deg) saturate(1.1)',grape:'hue-rotate(200deg) saturate(1.05)',sun:'hue-rotate(-25deg) saturate(1.2) brightness(1.05)',mint:'hue-rotate(90deg)',coral:'hue-rotate(-60deg) saturate(1.25)',night:'hue-rotate(160deg) brightness(.82) saturate(1.2)',rainbow:'',gold:'sepia(1) saturate(2.5) hue-rotate(-12deg) brightness(1.05)'};
let pyN=0;
function pySVG(mood='happy',o={}){const pose=PY_POSE[mood]||'hi';
 if(PY_HAVE.has(pose)){const col=o.color||S.wear.color,hat=HATS[o.hat??S.wear.hat]||HATS[''],acc=ACCS[o.acc??S.wear.acc]||ACCS[''];
  return `<span class="py pic ${o.cls||''} m-${mood}">${hat[0]?`<i class="pyhat">${hat[0]}</i>`:''}<img src="images/py-${pose}.webp" alt="" draggable="false" class="${col==='rainbow'?'rainbow':''}" style="filter:${PY_TINT[col]||'none'}">${acc[0]?`<i class="pyacc a-${o.acc??S.wear.acc}">${acc[0]}</i>`:''}</span>`}
const c=COLORS[o.color||S.wear.color]||COLORS.leaf,id=++pyN,[dark,light]=[c[1],c[2]],main=c[0].replace(/url\(#(\w+)\)/,`url(#$1${id})`);
 const eyes=mood==='think'?`<circle cx="41" cy="33" r="4" fill="#1f2b55"/><circle cx="59" cy="33" r="4" fill="#1f2b55"/><circle cx="42" cy="31.5" r="1.4" fill="#fff"/><circle cx="60" cy="31.5" r="1.4" fill="#fff"/>`
  :mood==='oops'?`<path d="M36 34 l9 -2 M64 34 l-9 -2" stroke="#1f2b55" stroke-width="3" stroke-linecap="round"/><path d="M70 22 q3 6 0 9 q-3 -3 0 -9z" fill="#7cc8ff"/>`
  :mood==='wow'?`<ellipse cx="41" cy="34" rx="6.5" ry="7.5" fill="#fff"/><ellipse cx="59" cy="34" rx="6.5" ry="7.5" fill="#fff"/><circle cx="41" cy="35" r="4.4" fill="#1f2b55"/><circle cx="59" cy="35" r="4.4" fill="#1f2b55"/><circle cx="42.5" cy="33" r="1.6" fill="#fff"/><circle cx="60.5" cy="33" r="1.6" fill="#fff"/>`
  :`<path d="M35 35 q6 -7 12 0" stroke="#1f2b55" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="M53 35 q6 -7 12 0" stroke="#1f2b55" stroke-width="3.2" fill="none" stroke-linecap="round"/>`;
 const mouth=mood==='oops'?`<path d="M45 49 q5 -3 10 0" stroke="#1f2b55" stroke-width="2.4" fill="none" stroke-linecap="round"/>`
  :mood==='wow'?`<ellipse cx="50" cy="49" rx="4" ry="4.5" fill="#7a2a3a"/>`

// ---------------------------------------------------------------- code with colours (slots <<…>> are drawn by the caller)
const PYKW=new Set(['def','class','for','in','if','elif','else','while','return','import','from','as','and','or','not','is','break','continue','pass','global','del','lambda','with','try','except','finally','raise','yield','True','False','None','self']);
const PYBI=new Set(['print','len','range','input','int','str','float','list','dict','set','tuple','sum','max','min','sorted','abs','round','enumerate','zip','type','isinstance','reversed','any','all','super']);
const TOK=/(<<.*?>>)|(#.*$)|([fFrR]?"(?:[^"\\]|\\.)*"?|[fFrR]?'(?:[^'\\]|\\.)*'?)|(\b\d+(?:\.\d+)?\b)|([\p{L}_][\p{L}\p{N}_]*)|(\s+)|(.)/gu;
function hl(line,slot){let out='',m;const re=new RegExp(TOK.source,TOK.flags),s=String(line);   // own copy: slots call hl() again
 while((m=re.exec(s))&&m[0]){const [w,sl,cm,st,nu,nm]=m;
  if(sl)out+=slot?slot(sl.slice(2,-2).split('|')):`<span class="t-st">${esc(sl.slice(2,-2).split('|')[0])}</span>`;
  else if(cm)out+=`<span class="t-cm">${esc(cm)}</span>`;else if(st)out+=`<span class="t-st">${esc(st)}</span>`;else if(nu)out+=`<span class="t-nu">${esc(nu)}</span>`;
  else if(nm){const after=s.slice(re.lastIndex);out+=`<span class="${PYKW.has(nm)?'t-kw':PYBI.has(nm)?'t-bi':/^\s*\(/.test(after)?'t-fn':'t-nm'}">${esc(nm)}</span>`}
  else out+=esc(w)}
 return out}
// leading spaces become indent guides so children can see which lines are "inside"
function indentHTML(line){const m=/^( *)/.exec(line)[1].length,lv=Math.floor(m/4),rest=m%4;return '<i class="ind"></i>'.repeat(lv)+' '.repeat(rest)}
function codeHTML(code,o={}){let k=0;const ls=String(code).split('\n');
 return `<div class="code ${o.cls||''}">${ls.map((l,i)=>{const n=i+1,cls=[o.cur===n?'cur':'',o.err===n?'err':'',o.sel===n?'sel':'',o.mark&&o.mark[n]?o.mark[n]:'',i<(o.lock||0)?'lock':''].join(' ');
  const body=hl(l.replace(/^ +/,''),o.slot?(opts)=>o.slot(k++,opts,n):null);
  return `<div class="cl ${cls}" data-ln="${n}"><span class="ln">${n}</span><span class="ct">${indentHTML(l)}${body||'&nbsp;'}</span></div>`}).join('')}</div>`}

function GridView(host,cfg){const g=STAGE.parseGrid(cfg);let cs=48;
 const st={x:g.px,y:g.py,d:g.dir,ang:DIRANG[g.dir],trail:[],grow:0,food:{...g.food}};
 function size(){const w=Math.max(200,(host.clientWidth||340)-8);cs=Math.floor(Math.min(56,w/g.w,(innerHeight*.42)/g.h));host.style.setProperty('--cs',cs+'px')}

  return `<div class="gc ${c==='~'?'water':c==='#'||c==='T'?'block':''} ${(x+y)%2?'odd':''}" data-k="${k}">${CELL[c]||''}${n?`<span class="apple">🍎${n>1?`<b>${n}</b>`:''}</span>`:''}</div>`}

// ---------------------------------------------------------------- the turtle board (three stacked canvases: paper+target, ink, turtle)
function TurtleView(host,o={}){const W=400;let px=340,scale=1,dpr=Math.min(2,window.devicePixelRatio||1);
 host.innerHTML=`<div class="tboard"><canvas class="tc0"></canvas><canvas class="tc1"></canvas><canvas class="tc2"></canvas></div>`;
 const [c0,c1,c2]=host.querySelectorAll('canvas');const x0=c0.getContext('2d'),x1=c1.getContext('2d'),x2=c2.getContext('2d');
 let target=o.target||null,bg=null,turtles=[{x:0,y:0,h:0,show:true,c:'black'}],anim=null,view=200;
 function fit(extra){let m=200;const look=d=>{if(!d)return;for(const s of d.segs)m=Math.max(m,Math.abs(s.x1),Math.abs(s.y1),Math.abs(s.x2),Math.abs(s.y2));for(const p of d.dots)m=Math.max(m,Math.abs(p.x)+p.s/2);for(const t of d.texts)m=Math.max(m,Math.abs(t.x)+20,Math.abs(t.y)+10)};look(target);look(extra);view=Math.min(2000,m*1.05)}
 function size(){px=Math.min(Math.max(220,(host.clientWidth||340)-4),420);for(const c of [c0,c1,c2]){c.width=px*dpr;c.height=px*dpr;c.style.width=c.style.height=px+'px'}host.querySelector('.tboard').style.width=host.querySelector('.tboard').style.height=px+'px';scale=px/(2*view)}
 const P=(x,y)=>[(x+view)*scale*dpr,(view-y)*scale*dpr];
 function paper(){x0.setTransform(1,0,0,1,0,0);x0.fillStyle=bg||'#fffdf6';x0.fillRect(0,0,c0.width,c0.height);
  x0.strokeStyle='rgba(80,110,170,.09)';x0.lineWidth=1;const step=50;for(let v=-Math.floor(view/step)*step;v<=view;v+=step){const [a]=P(v,0),[,b]=P(0,v);x0.beginPath();x0.moveTo(a,0);x0.lineTo(a,c0.height);x0.stroke();x0.beginPath();x0.moveTo(0,b);x0.lineTo(c0.width,b);x0.stroke()}
  x0.strokeStyle='rgba(80,110,170,.2)';const [ox,oy]=P(0,0);x0.beginPath();x0.moveTo(ox-6,oy);x0.lineTo(ox+6,oy);x0.moveTo(ox,oy-6);x0.lineTo(ox,oy+6);x0.stroke();
  if(target){x0.save();x0.setLineDash([6*dpr,6*dpr]);x0.strokeStyle='rgba(120,130,170,.55)';x0.lineWidth=3*dpr;x0.lineCap='round';
   for(const f of target.fills){x0.fillStyle='rgba(150,160,200,.15)';x0.beginPath();f.pts.forEach(([x,y],i)=>{const [a,b]=P(x,y);i?x0.lineTo(a,b):x0.moveTo(a,b)});x0.closePath();x0.fill()}
   for(const s of target.segs){const [a,b]=P(s.x1,s.y1),[c,d]=P(s.x2,s.y2);x0.beginPath();x0.moveTo(a,b);x0.lineTo(c,d);x0.stroke()}
   for(const p of target.dots){const [a,b]=P(p.x,p.y);x0.beginPath();x0.arc(a,b,Math.max(2,p.s/2*scale*dpr),0,7);x0.stroke()}x0.restore()}}
 const lw=w=>Math.max(1.5,w*scale*dpr*1.4);
 function line(ctx,s,t=1){const [a,b]=P(s.x1,s.y1),[c,d]=P(s.x1+(s.x2-s.x1)*t,s.y1+(s.y2-s.y1)*t);ctx.strokeStyle=s.c;ctx.lineWidth=lw(s.w||1);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke()}
 function sprite(){x2.setTransform(1,0,0,1,0,0);x2.clearRect(0,0,c2.width,c2.height);
  for(const t of turtles){if(!t.show)continue;const [a,b]=P(t.x,t.y),r=9*dpr*Math.max(.8,Math.min(1.4,scale*1.2));x2.save();x2.translate(a,b);x2.rotate(-t.h*Math.PI/180);
   x2.fillStyle='#7ad36b';for(const [lx,ly] of [[.5,.75],[.5,-.75],[-.6,.75],[-.6,-.75]]){x2.beginPath();x2.ellipse(lx*r,ly*r,r*.32,r*.22,0,0,7);x2.fill()}

  else{S.stats.bugs++;P.errSeen=true;firstBug();html=`<p>🐞 <b>${L(`${e.line}번째 줄에서 버그 발견!`,`Bug found on line ${e.line}!`)}</b></p><p>${esc(L(e.ko,e.en))}</p><details><summary>${L('파이썬이 보여 준 메시지','What Python said')}</summary><code class="pyerr">${esc(e.type+': '+e.pymsg)}</code></details>`}}
 else if(j.why==='apples')html=`<p>🍎 ${L(`사과가 아직 ${j.left}개 남았어요. 사과 칸에서 \`eat()\` 명령을 했나요?`,`${j.left} apple${j.left===1?' is':'s are'} left. Did Py use \`eat()\` on the apple square?`).replace(/`([^`]+)`/g,'<code>$1</code>')}</p>`;
 else if(j.why==='home')html=`<p>🏠 ${L('사과는 다 먹었어요! 이제 집까지 가요.','All apples eaten! Now go home.')}</p>`;
 else if(j.why==='drawing')html=`<p>🐢 ${L('점선 그림과 조금 달라요. 선의 길이와 도는 각도를 확인해요.','It doesn’t match the dotted picture yet. Check the lengths and turning angles.')}</p>`;
 else if(j.why==='output'){html=`<p>💬 ${L('게시판 글이 목표와 달라요. 한 줄씩 비교해 봐요.','The messages don’t match the goal yet. Compare them line by line.')}</p>${outDiff(j.want,j.got)}`}
 else if(j.why==='uses'){const u=USES[j.use]||[j.use,j.use];html=`<p>🎯 ${tx(`이번 미션은 ${u[0]}을(를) 써서 만들어요.|This mission wants you to use ${u[1]}.`).replace('을(를)',josaCode(u[0]))}</p>`}
 else if(j.why==='short')html=`<p>✨ ${m.stage==='turtle'?L('조금 더 그려 봐요! 선을 더 그어요.','Draw a bit more! Add more lines.'):L('조금 더 만들어 봐요! 줄을 더 보여 줘요.','Make a bit more! Print more lines.')}</p>`;
 if(r.warn&&r.warn.length)html+=r.warn.map(w=>`<p class="warnl">💡 ${L(`${w.line}번째 줄`,`Line ${w.line}`)}: ${esc(L(w.ko,w.en))}</p>`).join('');
 if(m.kind==='choose'&&P.tries>=2)html+=`<p class="why">💭 ${tx(m.why)}</p>`;
 if(m.kind==='fix'&&!P.fixedOnce)html+=`<p class="small">👆 ${L('버그가 있는 줄을 눌러서 고쳐요.','Tap the line with the bug to fix it.')}</p>`;
 if(P.tries>=3&&P.hints===0)html+=`<p class="small">💡 ${L('막히면 오른쪽 위 💡 힌트를 눌러요. 힌트는 공짜예요!','Stuck? Tap 💡 at the top right. Hints are free!')}</p>`;
 pySays(html+`<button class="sayb" type="button" data-say="${esc(stripTags(html))}|${esc(stripTags(html))}" aria-label="${L('다시 듣기','Hear again')}">🔊</button>`,mood);
 say(stripTags(html).replace(/What Python said.*|파이썬이 보여 준 메시지.*/s,''));save(true)}
const stripTags=h=>String(h).replace(/<details>.*?<\/details>/gs,'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
const josaCode=w=>{const c=w.replace(/`/g,'').trim(),last=c.charCodeAt(c.length-1);return last>=0xAC00&&last<=0xD7A3&&(last-0xAC00)%28?'을':'를'};
function outDiff(want,got){const a=want.split('\n'),b=got.split('\n'),n=Math.max(a.length,b.length);let rows='';for(let i=0;i<Math.min(n,12);i++){const ok=a[i]===b[i];rows+=`<tr class="${ok?'':'bad'}"><td>${esc(b[i]??'')}</td><td>${esc(a[i]??'')}</td></tr>`}
 return `<table class="odiff"><tr><th>${L('내 결과','Mine')}</th><th>${L('목표','Goal')}</th></tr>${rows}</table>`}
function firstBug(){if(S.tut.bug)return;S.tut.bug=1;save(true);setTimeout(()=>{if(typeof coachPop==='function')coachPop('idea','첫 버그를 만났어요! 진짜 개발자도 매일 버그를 고쳐요. 같이 찾아봐요 🌙','Your first bug! Real coders fix bugs every day. Let’s find it together 🌙',{force:true,ms:6500})},1200)}
// predict: pick an answer first, then watch what really happens
function predictPick(i){if(P.running||P.answered!=null&&P.answered!==false)return;P.pickedOpt=i;if(P.firstPick==null)P.firstPick=i;sfx('tap');document.querySelectorAll('.popt').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));P.answered=false;runCode()}
function predictAfter(r){const m=P.m,ok=MISSION.norm(m.options[P.pickedOpt])===MISSION.norm(r.out),right=m.options.findIndex(o=>MISSION.norm(o)===MISSION.norm(r.out));P.answered=true;
 document.querySelectorAll('.popt').forEach(b=>{const i=+b.dataset.i;b.classList.toggle('right',i===right);b.classList.toggle('wrong',i===P.pickedOpt&&!ok);b.disabled=true});runbar();
 if(ok){if(typeof coachAnswer==='function')coachAnswer(true);success(m.code,{predicted:P.firstPick===right})}
 else{P.tries++;sfx('oops');pySays(`<p>💡 ${L('아하! 실제로는 초록색 답이 나왔어요.','Aha! The green answer is what really happens.')}</p><p class="why">${tx(m.why)}</p><button class="btn small" type="button" data-a="gotit">👍 ${L('알겠어요!','Got it!')}</button>`,'think');say(L('아하! 실제로는 초록색 답이 나왔어요. ','Aha! The green answer is what really happens. ')+T(m.why))}}
function choosePick(i){if(P.running)return;P.picked=i;if(P.firstPick==null)P.firstPick=i;sfx('tap');document.querySelectorAll('.copt').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));P.ed.setCode(P.m.options[i]);runCode()}
function fixTap(ln){const m=P.m;if(P.running)return;
 if(ln===m.bug){sfx('tap');chooser(L(`${ln}번째 줄을 어떻게 고칠까요?`,`How should line ${ln} be?`),shuffle(m.fixes),P.fixLines[ln-1],v=>{P.fixLines[ln-1]=v;P.fixedOnce=true;P.ed.setCode(P.fixLines.join('\n'));P.ed.setMarks({[ln]:'fixed'});pySays(`<p>🔧 ${L('줄을 바꿨어요! ▶ 실행해서 확인해요.','Line changed! Press ▶ to check.')}</p>`,'happy')});return}
 P.wrongTaps++;sfx('oops');P.ed.setMarks({[ln]:'okline'});pySays(`<p>👍 ${L(`${ln}번째 줄은 괜찮아 보여요.`,`Line ${ln} looks fine.`)} ${P.wrongTaps>=2?L(`힌트: ${m.bug-1>0?m.bug-1+'번째 줄 다음을':'첫 줄을'} 잘 봐요!`,`Hint: look just after line ${m.bug-1}!`):L('▶ 실행해서 파이가 어디서 멈추는지 봐요.','Press ▶ and watch where Py goes wrong.')}</p>`,'think')}

// ---------------------------------------------------------------- success, rewards and what comes next
function success(code,o={}){const m=P.m,first=!S.done[m.id],ins=PY.inspect(code||'');
 const bonusNow=m.kind==='predict'||m.kind==='choose'?(o.predicted!=null?o.predicted:P.firstPick!=null&&P.order&&P.firstPick===P.picked&&P.tries===0):MISSION.bonusOk(m,code);
 const hadBonus=!first&&S.done[m.id].b;let apples=0,xp=0,newBonus=false;
 if(P.review){reviewDone(bonusNow);return}
 if(first){S.done[m.id]={t:dayKey(),b:false,tries:P.tries,h:P.hints};apples+=3;xp+=10;S.stats.missions++;if(m.kind==='predict'||m.kind==='choose')S.rev[m.id]={b:0,due:addDays(dayKey(),1)}}else xp+=2;
 if(bonusNow&&!hadBonus&&(m.bonus||m.kind==='predict'||m.kind==='choose')){S.done[m.id].b=true;apples+=2;xp+=5;S.stats.bonus++;newBonus=true}
 delete S.drafts[m.id];S.today.n++;markDay();
 if(m.kind==='make'&&first)saveWork({stage:m.stage,code,title:T(m.title),grid:m.grid});
 const w=worldOf(m),wasAll=first&&worldDone(w)===w.missions.length;
 const up=addXP(xp);addApples(apples,$('runbar'));save();
 sfx('win');celebrate(30);pySays(`<p>🎉 <b>${L('성공!','You did it!')}</b> ${tx(m.learn)}</p>`,'wow');
 const key=m.kind==='predict'?'predict':m.kind==='make'?'make':m.kind==='fix'?'bug':P.tries===0&&P.hints===0?'first':P.hints&&P.tries<2?'hint':'retry';
 const extra=ins.kinds.has('For')&&m.world>=4&&m.world<6&&key!=='make'?praise('loop'):ins.kinds.has('Def')&&m.world===7?praise('func'):'';
 const praiseText=praise(key)+(extra?' '+extra:'');
 const nx=nextInWorld(m),k=first?(wasAll?'big':'up'):'good';
 setTimeout(()=>{if(!P||P.m!==m)return;say(T(m.learn));
  modal(`<div class="big">${pySVG('wow',{cls:'big'})}</div><h2>🎉 ${L('미션 성공!','Mission complete!')}</h2><p class="praise">${esc(praiseText)}</p><div class="learn">💡 ${tx(m.learn)}</div>
   ${apples||xp?`<div class="rew">${apples?`<span>+${apples} 🍎</span>`:''}<span>+${xp} XP</span>${newBonus?`<span class="bn">⭐ ${L('도전 성공!','Challenge done!')}</span>`:''}${up?`<span class="bn">🆙 ${L(`레벨 ${S.lvl}!`,`Level ${S.lvl}!`)}</span>`:''}</div>`:''}
   ${m.bonus&&!S.done[m.id].b?`<div class="bonusbox">⭐ <b>${L('도전 미션','Challenge')}</b> ${esc(LANG==='en'?m.bonus.en:m.bonus.ko)}<button class="btn ghost small" type="button" data-act="close">${L('도전해 볼래요','I’ll try')}</button></div>`:''}
   ${typeof coachLine==='function'?coachLine(k):''}
   <div class="row"><button class="btn ghost" type="button" data-act="again">🔄 ${L('다시 하기','Again')}</button><button class="btn" type="button" data-act="next">${nx?L('다음 미션','Next mission'):L('섬으로','To the island')} ▶</button></div>`,
   {cls:'result',acts:{again:()=>()=>openMission(m.id),next:()=>()=>{if(wasAll)worldComplete(w);else if(nx)openMission(nx.id);else go('world',m.world)}}})},900)}
function nextInWorld(m){const w=worldOf(m),n=w.missions[m.idx+1];if(n)return n;const nw=WORLDS[m.world];return nw&&worldOpen(nw.n)?nw.missions.find(x=>!doneM(x.id))||null:null}
function worldComplete(w){const prize=WORLD_PRIZE[w.n];let gift='';
 if(prize){const [kind,id]=prize,own=S.owned[kind];if(!own.includes(id)){own.push(id);const item=kind==='color'?COLORS[id]:kind==='hat'?HATS[id]:ACCS[id];gift=`<div class="gift">🎁 ${L('선물','Gift')}: ${kind==='color'?'':item[0]} <b>${T(kind==='color'?item[3]:item[1])}</b><small>${L('꾸미기에서 입혀 봐요','Try it on in the wardrobe')}</small></div>`}}
 addApples(10);save();sfx('fanfare');celebrate(60);
 modal(`<div class="big">${w.icon}</div><h2>🏝️ ${L(`${tx(w.name)} 완성!`,`${tx(w.name)} complete!`)}</h2>${pyLine(`${T(w.concept)}${L('을(를) 모두 배웠어요! 섬에 불이 하나 더 켜졌어요.',' — learned! Another light is on on the island.')}|${T(w.concept)}`)}
  <div class="rew"><span>+10 🍎</span></div>${gift}${typeof coachLine==='function'?coachLine('big'):''}<button class="btn wide" type="button" data-act="go">${L('섬 지도 보기','See the island')} ▶</button>`,{cls:'wide',acts:{go:()=>()=>go('home')},onOpen:()=>say(L(`${T(w.name)} 완성! 정말 멋져요!`,`${T(w.name)} complete! Amazing!`))})}

function hint(){const m=P.m;P.hints++;S.stats.hints++;save(true);const i=P.hints-1;sfx('tap');
 if(i<m.hints.length)modal(`<div class="big">💡</div><h2>${L(`힌트 ${i+1}`,`Hint ${i+1}`)}</h2>${pyLine(m.hints[i],'think')}<div class="row"><button class="btn ghost" type="button" data-act="more">${i<m.hints.length-1?L('더 알려 줘요','More help'):L('방법 보기','Show me')}</button><button class="btn" type="button" data-act="close">${L('해 볼게요!','I’ll try!')}</button></div>`,{onOpen:()=>say(T(m.hints[i])),acts:{more:()=>()=>hint()}});

function showWay(){const m=P.m,can=['blank','order','tiles','type','make','fix','choose'].includes(m.kind);let code=m.solution;
 modal(`<h2>🔑 ${L('이렇게 할 수 있어요','Here’s one way')}</h2>${m.kind==='predict'?`<p>${L('답을 하나 골라서 실행해 봐요. 틀려도 괜찮아요, 실제 결과를 보면서 배워요!','Pick an answer and run it. If it’s wrong that’s fine — you learn by seeing what really happens!')}</p>`:codeHTML(code)}
  <p class="muted">${L('천천히 읽어 보고 직접 해 봐요. 답을 보고 이해하는 것도 배우는 방법이에요.','Read it slowly, then try it yourself. Understanding an answer is learning too.')}</p>
  <div class="row">${can?`<button class="btn" type="button" data-act="fill">${L('이 코드로 채우기','Use this code')}</button>`:''}<button class="btn ghost" type="button" data-act="close">${L('닫기','Close')}</button></div>`,{acts:{fill:()=>{fillWay();return null}}})}
function fillWay(){const m=P.m;
 if(m.kind==='blank')P.ed.fillAnswer(m.solution);else if(m.kind==='order')P.ed.fillAnswer();else if(m.kind==='fix'){P.fixLines=m.solution.split('\n');P.fixedOnce=true;P.ed.setCode(m.solution);P.ed.setMarks({[m.bug]:'fixed'})}
 else if(m.kind==='choose'){const i=m.options.findIndex(o=>MISSION.norm(o)===MISSION.norm(m.solution));P.picked=i;document.querySelectorAll('.copt').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));P.ed.setCode(m.options[i])}
 else if(P.ed.setCode)P.ed.setCode(m.solution);
 toast(L('▶ 실행해서 확인해요!','Press ▶ to check!'))}

// ---------------------------------------------------------------- memory quiz: earlier predict/choose missions come back after 1, 3, 7, 14, 30 days
const BOXES=[1,3,7,14,30];
function reviewDue(){const t=dayKey();return Object.entries(S.rev).filter(([id,r])=>MBY[id]&&r.due<=t).sort((a,b)=>a[1].due<b[1].due?-1:1).slice(0,3).map(([id])=>id)}
function startReview(){const q=reviewDue();if(!q.length){toast(L('오늘의 기억 퀴즈를 다 했어요!','Today’s memory quiz is done!'));return}openMission(q[0],{review:{q,i:0}})}
function reviewDone(firstRight){const m=P.m,rv=P.review,r=S.rev[m.id]||{b:0};r.b=firstRight?Math.min(r.b+1,BOXES.length-1):0;r.due=addDays(dayKey(),BOXES[r.b]);S.rev[m.id]=r;S.stats.reviews++;
 addXP(3);addApples(1,$('runbar'));save();sfx('good');
 setTimeout(()=>{const n=rv.i+1;if(n<rv.q.length&&MBY[rv.q[n]])openMission(rv.q[n],{review:{q:rv.q,i:n}});
  else{modal(`<div class="big">🧠</div><h2>${L('기억 퀴즈 끝!','Memory quiz done!')}</h2>${pyLine('예전에 배운 걸 다시 꺼내 보면 더 오래 기억해요. 잘했어요!|Bringing back what you learned helps you remember it longer. Well done!')}${typeof coachLine==='function'?coachLine('up'):''}<button class="btn wide" type="button" data-act="close">${L('좋아요!','Great!')}</button>`,{onClose:()=>go('home')})}},firstRight?700:200)}

 if(r.err){const e=r.err,world=/^(Bump|NoApple)$/.test(e.type);P.ed.mark(0,e.line);sfx('oops');if(!world){S.stats.bugs++;firstBug()}
  pySays(world?`<p>🐍 <b>${esc(L(e.ko,e.en))}</b> (${L(`${e.line}번째 줄`,`line ${e.line}`)})</p>`:`<p>🐞 <b>${L(`${e.line}번째 줄에서 버그 발견!`,`Bug on line ${e.line}!`)}</b></p><p>${esc(L(e.ko,e.en))}</p><details><summary>${L('파이썬이 보여 준 메시지','What Python said')}</summary><code class="pyerr">${esc(e.type+': '+e.pymsg)}</code></details>`,'oops');P.labErr=true}
 else{if(P.labErr){S.stats.fixed++;P.labErr=false}sfx('good');pySays(`<p>✨ ${pick([L('멋진 코드예요!','Lovely code!'),L('잘 돌아가요!','It runs!'),L('직접 만든 프로그램이에요!','A program you made yourself!')])}</p>`,'happy')}
 save(true)}
function examples(){const st=LAB.stage;modal(`<h2>📚 ${L('예제 불러오기','Load an example')}</h2><p class="muted">${L('예제를 실행해 보고, 숫자나 색을 바꿔 보세요!','Run an example, then change its numbers or colours!')}</p><div class="chooser">${EXAMPLES[st].map((e,i)=>`<button type="button" class="chopt" data-act="ex" data-i="${i}">${L(e[0],e[1])}</button>`).join('')}</div>`,{acts:{ex:b=>{const e=EXAMPLES[st][+b.dataset.i];LAB.code[st]=e[2];RENDER.lab()}}})}

// ---------------------------------------------------------------- my works (gallery)
function saveWork(w){S.works.unshift({id:'k'+now(),t:dayKey(),...w});S.works=S.works.slice(0,40);S.stats.works++;save(true);
 if(S.works.length===1)setTimeout(()=>{if(typeof coachPop==='function')coachPop('clap','첫 작품이 생겼어요! 문 코치도 보고 싶어요. 작품 탭에서 언제든 다시 볼 수 있어요 🌙','Your first work! Coach Moon wants to see it. Find it any time in My Works 🌙',{force:true,ms:6500})},2500)}
RENDER.works=()=>{const ws=S.works;
 $('v-works').innerHTML=`<h2 class="vtitle">🖼️ ${L('내 작품','My works')}</h2>${ws.length?`<div class="works">${ws.map((w,i)=>`<div class="work card"><div class="wthumb ${w.stage}" id="th${i}"></div><b>${esc(w.title)}</b><small>${STAGE_NAME[w.stage]} · ${esc(w.t)}</small><div class="row"><button class="btn small" type="button" data-a="wopen" data-i="${i}">▶ ${L('열기','Open')}</button><button class="btn ghost small danger" type="button" data-a="wdel" data-i="${i}" aria-label="${L('지우기','Delete')}">🗑</button></div></div>`).join('')}</div>`
  :`<div class="card center">${pySVG('think')}<p>${L('아직 작품이 없어요. 섬마다 마지막 🎨 미션을 하거나 놀이터에서 저장하면 여기에 모여요.','No works yet. Finish the last 🎨 mission on an island, or save from the playground, and they’ll gather here.')}</p></div>`}${COPYRIGHT()}`;
 ws.forEach((w,i)=>{const host=$('th'+i);if(!host)return;const m={id:w.id,stage:w.stage,kind:'make',grid:w.grid||LABGRID};const r=MISSION.run(m,w.code,{maxTrace:1,vars:false,inputs:['🙂','🙂','🙂']});
  if(w.stage==='turtle'){const v=TurtleView(host);const d=r.stage.drawing();v.reset(d);v.drawAll(d)}else if(w.stage==='text')host.innerHTML=`<pre>${esc(r.out.split('\n').slice(0,5).join('\n'))}</pre>`;else host.innerHTML=`<pre>${esc(w.code.split('\n').slice(0,5).join('\n'))}</pre>`})};

// ---------------------------------------------------------------- Py's wardrobe (cosmetic only; some pieces are prizes for finishing islands)
let DRESS='color';
RENDER.dress=()=>{const set=DRESS==='color'?COLORS:DRESS==='hat'?HATS:ACCS,own=S.owned[DRESS],wear=S.wear[DRESS];
 const prizeOf=id=>Object.entries(WORLD_PRIZE).find(([n,p])=>p[0]===DRESS&&p[1]===id);
 $('v-dress').innerHTML=`<h2 class="vtitle">🎒 ${L('파이 꾸미기','Dress up Py')}</h2><div class="card dressme">${pySVG('happy',{cls:'big'})}<p>🍎 <b>${S.apples}</b> ${L('사과로 꾸며요. 사과는 미션을 하면 받아요.','Use apples to dress Py. Missions give apples.')}</p></div>
  <div class="tabs">${[['color','🎨 '+L('색깔','Colours')],['hat','🎩 '+L('모자','Hats')],['acc','👓 '+L('소품','Extras')]].map(([k,t])=>`<button type="button" class="${DRESS===k?'on':''}" data-a="dtab" data-v="${k}">${t}</button>`).join('')}</div>
  <div class="items">${Object.entries(set).map(([id,it])=>{const owned=own.includes(id),on=wear===id,price=DRESS==='color'?it[4]:it[2],prize=prizeOf(id);
   const look=DRESS==='color'?pySVG('happy',{color:id,hat:'',acc:'',cls:'mini'}):`<span class="em">${it[0]||'🚫'}</span>`;
   return `<button type="button" class="item ${on?'on':''} ${owned?'own':''}" data-a="ditem" data-id="${id}">${look}<b>${T(DRESS==='color'?it[3]:it[1])}</b><small>${on?L('입고 있어요','Wearing'):owned?L('입기','Wear'):prize?`🏝️ ${L(`${prize[0]}번 섬 선물`,`Island ${prize[0]} gift`)}`:`🍎 ${price}`}</small></button>`}).join('')}</div>${COPYRIGHT()}`};
function dressItem(id){const own=S.owned[DRESS],set=DRESS==='color'?COLORS:DRESS==='hat'?HATS:ACCS,it=set[id],price=DRESS==='color'?it[4]:it[2];
 if(!own.includes(id)){const prize=Object.entries(WORLD_PRIZE).find(([n,p])=>p[0]===DRESS&&p[1]===id);if(prize){sfx('oops');toast(`🏝️ ${L(`${prize[0]}번 섬을 완성하면 받는 선물이에요!`,`A gift for finishing island ${prize[0]}!`)}`);return}
  if(S.apples<price){sfx('oops');toast(`🍎 ${L('사과가 조금 모자라요. 미션을 하면 사과를 받아요!','Not quite enough apples. Missions give apples!')}`);return}
  S.apples-=price;own.push(id);sfx('coin');toast(L('새 꾸미기를 샀어요!','New look bought!'))}else sfx('tap');
 S.wear[DRESS]=id;save();updateHud();RENDER.dress()}

// ---------------------------------------------------------------- welcome and the player card
function welcome(){modal(`<div class="big">${pySVG('wow',{cls:'big'})}</div><h2>${L('꼬마 파이썬 섬에 온 걸 환영해요!','Welcome to Little Python Island!')}</h2>
  ${pyLine('안녕! 나는 아기 뱀 파이예요. 진짜 파이썬 코드로 나를 움직이고, 그림을 그리고, 가게도 열어 봐요!|Hi! I’m Py, a baby python. Use real Python code to move me, draw pictures and even run a shop!','wow')}
  <ul class="howlist"><li>🧱 ${L('타일을 눌러 코드를 만들고 ▶ 실행을 눌러요.','Tap tiles to build code, then press ▶ Run.')}</li><li>👣 ${L('한 줄씩 실행하면 코드가 어떻게 움직이는지 보여요.','Step mode shows how the code runs, line by line.')}</li><li>🐞 ${L('틀려도 괜찮아요. 버그를 고치면서 배워요!','Mistakes are fine. Fixing bugs is how we learn!')}</li><li>💡 ${L('막히면 힌트를 눌러요. 힌트는 언제나 공짜예요.','Stuck? Tap a hint. Hints are always free.')}</li></ul>
  <button class="btn wide" type="button" data-act="go">🌱 ${L('첫 섬으로 출발!','Off to the first island!')}</button>`,{cls:'wide',closable:false,onOpen:()=>say(L('안녕! 나는 아기 뱀 파이예요. 진짜 파이썬 코드로 나를 움직이고, 그림을 그리고, 가게도 열어 봐요!','Hi! I’m Py, a baby python. Use real Python code to move me, draw pictures and even run a shop!')),
  acts:{go:()=>{S.tut.hello=1;save();return ()=>go('world',1)}}})}
function meCard(){const t=titleOf(S.lvl);modal(`<div class="big">${esc(S.av)}</div><h2>${esc(S.name)}</h2><p><b>${t.icon} ${esc(t.name)}</b> · ${L(`레벨 ${S.lvl}`,`Level ${S.lvl}`)}</p><div class="meter"><i style="width:${Math.min(100,100*S.xp/xpNeed(S.lvl))}%"></i></div><p class="muted">${L(`다음 레벨까지 ${xpNeed(S.lvl)-S.xp} XP`,`${xpNeed(S.lvl)-S.xp} XP to the next level`)}</p>
  <div class="statrow"><span><b>${Object.keys(S.done).length}</b><small>${L('미션','missions')}</small></span><span><b>${S.stats.runs}</b><small>▶ ${L('실행','runs')}</small></span><span><b>${S.stats.fixed}</b><small>🐞 ${L('고친 버그','bugs fixed')}</small></span><span><b>${S.stats.reviews}</b><small>🧠 ${L('복습','reviews')}</small></span></div>
  <p class="muted">${L('레벨은 미션과 복습을 할 때마다 올라요.','Levels grow with every mission and review.')}</p>`)}

// ---------------------------------------------------------------- one click handler per area
function wire(){
 document.querySelector('.nav').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b)return;sfx('tap');go(b.dataset.v)});
 $('gearBtn').addEventListener('click',()=>{sfx('tap');settings()});
 $('hudLvlBtn').addEventListener('click',()=>{sfx('tap');meCard()});
 $('hudApplePill').addEventListener('click',()=>{sfx('tap');go('dress')});
 $('hudStarPill').addEventListener('click',()=>{sfx('tap');go('home')});
 $('hudBugPill').addEventListener('click',()=>{sfx('tap');modal(`<div class="big">🐞</div><h2>${L(`고친 버그 ${S.stats.fixed}개`,`${S.stats.fixed} bugs fixed`)}</h2>${pyLine('버그를 만나고 고칠 때마다 이 숫자가 늘어요. 진짜 개발자도 매일 버그를 고쳐요!|This grows each time you meet a bug and fix it. Real coders fix bugs every day!','happy')}`)});
 document.querySelector('main').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  switch(a){
   case 'home':sfx('tap');go('home');break;
   case 'world':{const n=+b.dataset.n;if(!worldOpen(n)){sfx('oops');const p=WORLDS[n-2];toast('🔒 '+L(`${p.n}번 섬에서 미션을 ${worldNeed(p)-worldDone(p)}개 더 하면 열려요!`,`Do ${worldNeed(p)-worldDone(p)} more mission(s) on island ${p.n} to open it!`));return}sfx('tap');go('world',n);break}
   case 'intro':sfx('tap');worldIntro(+b.dataset.n);break;
   case 'mission':sfx('tap');openMission(b.dataset.id);break;
   case 'review':sfx('tap');startReview();break;
   case 'back':sfx('tap');if(P&&P.review)go('home');else go('world',P?P.m.world:1);break;
   case 'hint':hint();break;
   case 'run':P.lab?labRun(false):runCode(false);break;
   case 'step':P.lab?labRun(true):runCode(true);break;
   case 'nextstep':sfx('tap');if(PLAY.next){const f=PLAY.next;PLAY.next=null;f()}break;
   case 'stop':sfx('tap');stopPlay();runbar();pySays(`<p>⏹ ${L('멈췄어요. 다시 ▶ 실행할 수 있어요.','Stopped. You can press ▶ again.')}</p>`);break;
   case 'reset':sfx('tap');P.view.reset&&P.view.reset();P.mem.reset();P.ed.mark&&P.ed.mark(0,0);{const s=$('outstrip');if(s)s.classList.add('hidden')}break;
   case 'predict':predictPick(+b.dataset.i);break;
   case 'replay':runCode(false);break;
   case 'gotit':sfx('tap');success(P.m.code,{predicted:false});break;
   case 'choose':choosePick(+b.dataset.i);break;
   case 'mode':{const t=b.dataset.v==='type';if(t===!!P.typing)return;S.drafts[P.m.id]=P.ed.raw?P.ed.raw():P.ed.code()||'';P.typing=t;sfx('tap');setupEditor();break}
   case 'labst':sfx('tap');LAB.stage=b.dataset.v;RENDER.lab();break;
   case 'examples':sfx('tap');examples();break;
   case 'labsave':{const code=P.ed.code();if(!code){toast(L('먼저 코드를 써요','Write some code first'));return}sfx('coin');saveWork({stage:LAB.stage,code,title:L(`내 작품 ${S.works.length+1}`,`My work ${S.works.length+1}`),grid:LAB.stage==='grid'?LABGRID:null});toast('💾 '+L('작품에 저장했어요!','Saved to My works!'));break}
   case 'labclear':sfx('tap');LAB.code[LAB.stage]=LAB.stage==='turtle'?'from turtle import *\n':'';RENDER.lab();break;
   case 'wopen':{const w=S.works[+b.dataset.i];if(!w)return;sfx('tap');LAB.stage=w.stage;LAB.code[w.stage]=w.code;go('lab');break}
   case 'wdel':{const i=+b.dataset.i;sfx('tap');modal(`<h2>🗑 ${L('이 작품을 지울까요?','Delete this work?')}</h2><p>${L('지우면 되돌릴 수 없어요.','This can’t be undone.')}</p><div class="row"><button class="btn ghost" type="button" data-act="close">${L('아니요','No')}</button><button class="btn danger" type="button" data-act="yes">${L('지울래요','Delete')}</button></div>`,{acts:{yes:()=>{S.works.splice(i,1);save();return ()=>RENDER.works()}}});break}
   case 'dtab':sfx('tap');DRESS=b.dataset.v;RENDER.dress();break;
   case 'ditem':dressItem(b.dataset.id);break}})}

// ---------------------------------------------------------------- start-up
function boot(){applyLang();document.body.classList.toggle('bigcode',!!S.opt.big);markDay();updateHud();wire();
 const q=new URLSearchParams(location.search),mid=q.get('m');
 if(mid&&MBY[mid]){go('home');openMission(mid,{review:null,force:true})}else go(q.get('v')&&RENDER[q.get('v')]&&q.get('v')!=='play'?q.get('v'):'home');
 if(!S.tut.hello&&!mid)welcome()}
boot();
</script>
<script>try{coachStart(['꼬마 파이썬 섬에 온 걸 환영해요!','Welcome to Little Python Island!'],[['코드가 안 될 때는 👣 한 줄씩 실행해 보면 버그가 잘 보여요.','When code doesn’t work, 👣 step through it line by line to spot the bug.'],['틀린 코드도 소중해요. 무엇이 다른지 비교하면서 배우거든요.','Wrong code is precious too. You learn by comparing what’s different.'],['하루에 미션 한두 개면 충분해요. 꾸준함이 최고예요!','One or two missions a day is plenty. Steady wins!']])}catch(e){}</script>
</body>
