// ---------------------------------------------------------------- thermometer: read it or set it
SIMS.thermo=(q,ctx)=>{
 const lv=Math.max(q.l,ctx.diff>=3?3:q.l);
 const setMode=lv>=2&&Math.random()<.5;
 let lo=-30,hi=40,step=10,minor=lv===1?10:lv===2?5:2,T0;
 const setTask=setMode?pick([[0,'물이 어는 온도|the freezing point of water',-30,40],[100,'물이 끓는 온도|the boiling point of water',0,110],[37,'건강한 사람의 체온|healthy body temperature',30,45]]):null;
 if(setTask){[T0,,lo,hi]=setTask;step=setTask[0]===37?5:setTask[0]===100?20:10;minor=setTask[0]===37?1:setTask[0]===100?10:5}
 else T0=lv===1?pick([-20,-10,0,10,20,30]):lv===2?pick([-25,-15,-5,5,15,25,35]):pick([-24,-18,-12,-6,8,14,22,28,36]);
 const Y0=212,Y1=30,yOf=t=>Y0-(t-lo)/(hi-lo)*(Y0-Y1),tOf=y=>lo+(Y0-y)/(Y0-Y1)*(hi-lo);
 const fmtT=t=>`${t<0?'−':''}${Math.abs(t)}°C`;
 const text=setMode?`온도계를 끌어서 ${T(setTask[1])}(${fmtT(T0)})에 맞춰요!|Drag the thermometer to ${T(setTask[1])} (${fmtT(T0)})!`:'온도계가 가리키는 온도는 몇 도일까요?|What temperature does the thermometer show?';
 const opts=setMode?null:shuffle([T0,...shuffle([...new Set([T0+minor,T0-minor,T0?-T0:2*minor,T0+2*minor,T0-2*minor])].filter(t=>t!==T0&&t>=lo&&t<=hi)).slice(0,ctx.diff===1?2:3)]);
 let cur=setMode?(T0>lo+(hi-lo)/2?lo+(hi-lo)*.15:hi-(hi-lo)*.15):T0,hint=null;
 const scene=t=>t<=0?'❄️⛄':t>=30?'☀️🥵':t>=15?'🌤️🙂':'🍂🧥';
 return {tag:['🌡️',T('온도계 읽기|Read the thermometer')],say:T(text),answer:fmtT(T0),
  mount(box,done){box.__done=done;
   let ticks='';for(let t=lo;t<=hi;t+=minor){const y=yOf(t),maj=(t-lo)%step===0||t===0;ticks+=`<line x1="${maj?118:126}" x2="138" y1="${y}" y2="${y}" stroke="${t===0?'#2a6fdb':'#5d6894'}" stroke-width="${maj?2:1}"/>${maj?`<text x="112" y="${y+4}" font-size="12" font-weight="800" text-anchor="end" fill="${t===0?'#2a6fdb':'#24305e'}">${t<0?'−':''}${Math.abs(t)}</text>`:''}`}
   box.innerHTML=qText(T(text))+`<div class="thermo-wrap"><svg class="simsvg thermo" viewBox="40 10 200 240"><rect x="140" y="${Y1-12}" width="26" height="${Y0-Y1+24}" rx="13" fill="#fff" stroke="#9aa3c7" stroke-width="2"/>
    ${ticks}<rect class="liq" x="147" width="12" fill="#ff4d5e" rx="6"/><circle cx="153" cy="${Y0+18}" r="17" fill="#ff4d5e" stroke="#c0283a" stroke-width="2"/><text x="185" y="40" font-size="13" font-weight="900" fill="#24305e">°C</text>
    ${setMode?`<g class="knob"><circle cx="153" r="12" fill="#fff" stroke="#ff4d5e" stroke-width="3"/><text x="153" dy="4.5" text-anchor="middle" font-size="12">↕</text></g>`:''}</svg>
    <div class="tside"><span class="scene">${setMode?'🌡️':scene(T0)}</span>${setMode?`<b class="tv"></b>`:''}</div></div>`+(setMode?checkRow():'');
   const liq=box.querySelector('.liq'),knob=box.querySelector('.knob'),tv=box.querySelector('.tv');
   const draw=()=>{const y=yOf(cur);liq.setAttribute('y',y);liq.setAttribute('height',Y0+10-y);if(knob)knob.setAttribute('transform',`translate(0,${y})`);if(tv)tv.textContent=fmtT(Math.round(cur))};draw();
   if(setMode){const svg=box.querySelector('svg');onDrag(svg,svg,p=>{if(box.dataset.done)return;cur=clamp(tOf(p.y),lo,hi);cur=Math.round(cur);draw()});
    tryFlow(box,ctx,{check:()=>Math.abs(cur-T0)<=(lv>=3?1:2),nudge:()=>cur<T0?T('조금 더 올려요!|A bit higher!'):T('조금 더 내려요!|A bit lower!'),reveal:cb=>{const f=cur;tween(800,e=>{cur=f+(T0-f)*e;draw()},cb)},answer:()=>fmtT(T0)})}
   else hint=choiceUI(box,opts.map(t=>({html:fmtT(t)})),opts.indexOf(T0),ok=>done(ok,{why:T(`빨간 기둥 끝이 ${fmtT(T0)} 눈금에 있어요. 0°C보다 아래는 영하예요.|The top of the red line is at ${fmtT(T0)}. Below 0°C means below freezing.`)}));
  },hint:()=>hint?hint():false};
};
// ---------------------------------------------------------------- spin the Earth: day and night
SIMS.earth=(q,ctx)=>{
 const CX=222,CY=120,ER=86,base={ca:0,kr:206};// Toronto → Seoul is about 206° eastward
 const tasks=q.l>=2||ctx.diff>1?['caNoon','krNight','caRise','krNoon','caNightKrDay']:['caNoon','caNight','krNoon','krNight'];
 const task=pick(tasks);
 const ang=(id,rot)=>((base[id]+rot)%360+360)%360;// math angle, counterclockwise; the Sun is at 180°
 const near=(a,t,tol)=>Math.abs(((a-t)%360+540)%360-180)<=tol;
 const tol=[40,32,24][ctx.diff-1];
 const good=r=>task==='caNoon'?near(ang('ca',r),180,tol):task==='caNight'?near(ang('ca',r),0,tol):task==='krNoon'?near(ang('kr',r),180,tol):task==='krNight'?near(ang('kr',r),0,tol):task==='caRise'?near(ang('ca',r),90,tol*.8):(Math.cos(ang('ca',r)*Math.PI/180)>.25&&Math.cos(ang('kr',r)*Math.PI/180)<-.25);
 let rot;do{rot=rnd(360)}while(good(rot));
 const CA=T('캐나다|Canada'),KR=T('한국|Korea');
 const text={caNoon:`지구를 돌려서 ${CA}${LANG==='en'?'':'가'} 한낮이 되게 해요!|Spin Earth so it’s midday in ${CA}!`,caNight:`지구를 돌려서 ${CA}${LANG==='en'?'':'가'} 한밤중이 되게 해요!|Spin Earth so it’s midnight in ${CA}!`,krNoon:`지구를 돌려서 ${KR}이 한낮이 되게 해요!|Spin Earth so it’s midday in ${KR}!`,krNight:`지구를 돌려서 ${KR}이 한밤중이 되게 해요!|Spin Earth so it’s midnight in ${KR}!`,caRise:`지구를 돌려서 ${CA}에 막 해가 뜨는 아침이 되게 해요!|Spin Earth so the Sun is just rising in ${CA}!`,caNightKrDay:`${CA}는 밤, ${KR}은 낮이 되게 지구를 돌려요!|Spin Earth so it’s night in ${CA} and day in ${KR}!`}[task];
 return {tag:['🌍',T('지구 돌리기|Spin the Earth')],say:T(text)+' '+T('지구는 화살표 방향으로 돌아요. 해를 바라보는 쪽이 낮이에요.|Earth spins the way the arrow shows. The side facing the Sun has day.'),answer:'',
  mount(box,done){box.__done=done;
   const pin=(id,col,label)=>`<g class="pin" data-id="${id}"><circle r="8" fill="${col}" stroke="#fff" stroke-width="2.5"/><text class="pl" font-size="12" font-weight="900" fill="#fff" stroke="#123" stroke-width="3" paint-order="stroke" text-anchor="middle">${label}</text></g>`;
   box.innerHTML=qText(T(text))+`<div class="simwrap"><svg class="simsvg" viewBox="0 0 360 240"><rect width="360" height="240" fill="#0c1430"/>${Array.from({length:30},()=>`<circle cx="${rnd(360)}" cy="${rnd(240)}" r="${Math.random()*1.3+.3}" fill="#fff" opacity=".7"/>`).join('')}
    <g><circle cx="-6" cy="${CY}" r="64" fill="#ffd84d"/><circle cx="-6" cy="${CY}" r="80" fill="#ffd84d" opacity=".25"/><text x="22" y="${CY+5}" font-size="13" font-weight="900" fill="#7a4b00">${T('해|Sun')}</text></g>
    <g class="earth"><circle cx="${CX}" cy="${CY}" r="${ER}" fill="#2f7fe0"/>
     <path d="M${CX-40} ${CY-50} q30 -20 55 0 q10 20 -10 30 q-25 10 -45 -10z M${CX+20} ${CY+10} q30 -10 40 15 q-10 25 -35 20 q-20 -15 -5 -35z M${CX-60} ${CY+20} q20 -5 25 15 q-10 20 -25 10z" fill="#46b35a"/>
     <circle cx="${CX}" cy="${CY}" r="7" fill="#fff"/></g>
    <path d="M${CX} ${CY-ER} A${ER} ${ER} 0 0 1 ${CX} ${CY+ER} Z" fill="#000" opacity=".52"/>
    <g class="pins">${pin('ca','#ff4d5e','🍁 '+CA)}${pin('kr','#4c7dff',KR)}</g>
    <text x="${CX}" y="${CY+ER+22}" font-size="11.5" font-weight="900" fill="#cfe0ff" text-anchor="middle">${T('↺ 지구가 도는 방향 (북극 위에서 본 모습)|↺ Spin direction (from above the North Pole)')}</text>
    <text x="${CX+ER-6}" y="22" font-size="12" font-weight="900" fill="#9fb4e6" text-anchor="middle">🌙 ${T('밤|Night')}</text><text x="${CX-ER+10}" y="22" font-size="12" font-weight="900" fill="#ffe27a" text-anchor="middle">☀️ ${T('낮|Day')}</text>
   </svg></div><div class="simrow"><button class="btn small ghost spinb" type="button" data-d="1">↺ ${T('돌리기|Spin')}</button><button class="btn small ghost spinb" type="button" data-d="-1">↻ ${T('거꾸로|Back')}</button></div>`+checkRow();
   const svg=box.querySelector('svg'),earth=svg.querySelector('.earth'),pins=[...svg.querySelectorAll('.pin')];
   const draw=()=>{earth.setAttribute('transform',`rotate(${-rot} ${CX} ${CY})`);pins.forEach(p=>{const a=ang(p.dataset.id,rot)*Math.PI/180,x=CX+Math.cos(a)*ER*.62,y=CY-Math.sin(a)*ER*.62;p.setAttribute('transform',`translate(${x},${y})`);p.querySelector('.pl').setAttribute('y',-13)})};
   draw();let last=null;
   onDrag(svg,svg,(p,ph)=>{if(box.dataset.done)return;const a=Math.atan2(CY-p.y,p.x-CX)*180/Math.PI;if(ph==='down'){last=a;return}if(last==null)return;let d=a-last;if(d>180)d-=360;if(d<-180)d+=360;rot=(rot+d+360)%360;last=a;draw()});
   box.querySelectorAll('.spinb').forEach(b=>b.addEventListener('click',()=>{if(box.dataset.done)return;SFX.click();const from=rot,to=rot+30*(+b.dataset.d);tween(350,e=>{rot=((from+(to-from)*e)%360+360)%360;draw()})}));
   tryFlow(box,ctx,{check:()=>good(rot),nudge:()=>T('해를 바라보는 왼쪽이 낮, 오른쪽 어두운 쪽이 밤이에요.|The left side facing the Sun has day; the dark right side has night.'),
    reveal:cb=>{let k1=-1,k2=-1;for(let k=0;k<=360;k+=2){const g=good((rot+k)%360);if(g&&k1<0)k1=k;if(!g&&k1>=0){k2=k;break}}const to=rot+(k1<0?0:(k1+(k2<0?k1:k2))/2),from=rot;tween(1100,e=>{rot=((from+(to-from)*e)%360+360)%360;draw()},cb)},
    answer:()=>T('해를 바라보는 쪽이 낮이고, 반대쪽은 밤이에요.|The side facing the Sun has day; the far side has night.')});
  },hint(){return false}};
};
// ---------------------------------------------------------------- lightning: count the seconds
SIMS.thunder=(q,ctx)=>{
 const lv=Math.max(q.l,ctx.diff>=3?3:1);
 const s=lv===1?pick([1,2,8,9]):lv===2?pick([3,6,9]):pick([12,15,4.5]);
 const near=s<=3;
 const opts=lv===1?[T('🚨 아주 가까워요|🚨 Very close'),T('🌄 멀리 있어요|🌄 Far away')]:shuffle([s/3,...shuffle([...new Set([s,s/3+1,s/3+2,Math.max(.5,s/3-1)])].filter(x=>x!==s/3)).slice(0,ctx.diff===1?2:3)]);
 const ans=lv===1?(near?0:1):opts.indexOf(s/3);
 const km=x=>`${T('약|about')} ${x%1?x.toFixed(1):x}km`;
 const text=lv===1?'번개가 번쩍! 천둥소리가 들릴 때까지 같이 초를 세요. 번개는 가까이 있을까요, 멀리 있을까요?|Flash! Count the seconds until you hear thunder. Is the lightning close or far?':'번개가 번쩍! 천둥소리가 들릴 때까지 초를 세요. 번개는 얼마나 멀리 있을까요?|Flash! Count the seconds until the thunder. How far away is the lightning?';
 let hint=null;
 return {tag:['⚡',T('천둥 세기|Count the thunder')],say:T(text),answer:lv===1?opts[ans]:km(s/3),
  mount(box,done){
   box.innerHTML=qText(T(text))+`<div class="storm"><div class="flash"></div><svg class="simsvg" viewBox="0 0 360 170"><rect width="360" height="170" fill="#1d2448"/><g class="cloud"><ellipse cx="${near?140:260}" cy="34" rx="70" ry="24" fill="#4a5180"/><ellipse cx="${near?110:230}" cy="44" rx="40" ry="18" fill="#565e92"/><ellipse cx="${near?175:295}" cy="46" rx="44" ry="18" fill="#565e92"/></g>
    <polyline class="bolt" points="${near?'150,50 130,90 150,90 125,140':'265,50 250,80 262,80 245,115'}" fill="none" stroke="#fff6a0" stroke-width="5" stroke-linejoin="round" opacity="0"/>
    <rect y="140" width="360" height="30" fill="#2c3d2c"/><text x="40" y="146" font-size="34">🏠</text><text x="86" y="148" font-size="26">🧒</text></svg>
    <div class="counter"><b>0</b><small>${T('초|sec')}</small></div></div><div class="simrow"><button class="btn gold go" type="button">▶ ${T('시작!|Start!')}</button></div>`;
   const go=box.querySelector('.go'),cnt=box.querySelector('.counter b'),bolt=box.querySelector('.bolt'),fl=box.querySelector('.flash'),st=box.querySelector('.storm');
   go.addEventListener('click',()=>{if(go.disabled)return;go.disabled=true;go.classList.add('hidden');
    fl.classList.add('on');bolt.setAttribute('opacity','1');SFX.zap();later(260,()=>{fl.classList.remove('on');bolt.setAttribute('opacity','0')});
    const fast=s>9,unit=fast?260:1000,n=Math.floor(s);let k=0;
    const boom=()=>{cnt.textContent=String(s%1?s.toFixed(1):s);SFX.rumble(near);st.classList.add('shake');
      if(lv===2)box.insertAdjacentHTML('beforeend',`<p class="sub center">${T(`천둥까지 ${s}초! 3초마다 약 1km예요.|Thunder after ${s} seconds! Every 3 seconds is about 1 km.`)}</p>`);
      hint=choiceUI(box,(lv===1?opts:opts.map(km)).map(o=>({html:esc(o)})),ans,ok=>done(ok,{why:lv===1?T(`천둥이 ${s}초 만에 들렸어요. 초가 적을수록 가까워요. 3초가 약 1km!|The thunder came after ${s} seconds. Fewer seconds means closer. 3 seconds is about 1 km!`):T(`${s}초 ÷ 3 = ${km(s/3)}. 빛은 소리보다 훨씬 빨라서 번개가 먼저 보여요.|${s} seconds ÷ 3 = ${km(s/3)}. Light is far faster than sound, so the flash comes first.`)}))};
    const tick=()=>{if(!box.isConnected)return;k++;cnt.textContent=String(k);SFX.tick();if(k<n)later(unit,tick);else later(Math.max(60,(s-n)*unit),boom)};
    if(fast)box.querySelector('.counter small').textContent+=' ⏩';later(unit,tick)});
  },hint:()=>hint?hint():false};
};
// ---------------------------------------------------------------- listen: high and low sounds
SIMS.pitch=(q,ctx)=>{
 const lv=Math.max(q.l,ctx.diff>=3?2:1),kind=lv===1?'xylo':lv===2?pick(['bands','drum']):pick(['glass','bands','drum']);
 const n=ctx.diff===1?3:4,want=pick(['high','low']);
 // size rank 0 = smallest/thinnest/least water
 const ranks=shuffle(Array.from({length:n},(_,i)=>i));
 const pitchRank=r=>n-1-r;// bigger, thicker or fuller = lower pitch
 const target=ranks.findIndex(r=>pitchRank(r)===(want==='high'?n-1:0));
 const NOTES=[262,330,392,523,659].slice(0,n);
 const name={xylo:'실로폰 막대|xylophone bars',bands:'고무줄|rubber bands',drum:'북|drums',glass:'물이 든 유리컵(톡 치기)|glasses of water (tapped)'}[kind];
 const text=`${want==='high'?'가장 높은|the HIGHEST':'가장 낮은|the LOWEST'}`;
 const tx=LANG==='en'?`Which of the ${T(name)} makes ${T(text)} sound? Tap to listen, then choose.`:`${T(name)} 중에서 ${T(text)} 소리를 내는 것은? 눌러서 들어 보고 골라요.`;
 let sel=-1;
 const draw=(r,i)=>{if(kind==='xylo'){const h=60+(n-1-r)*0+30+r*22;return `<svg viewBox="0 0 50 160"><rect x="8" y="${(160-h)/2}" width="34" height="${h}" rx="8" fill="${['#ff6b6b','#ffb547','#ffe066','#5ed98e','#5aa0ff'][i%5]}" stroke="#0002" stroke-width="2"/><circle cx="25" cy="${(160-h)/2+10}" r="3" fill="#0004"/><circle cx="25" cy="${(160+h)/2-10}" r="3" fill="#0004"/></svg>`}
  if(kind==='bands')return `<svg viewBox="0 0 50 160"><rect x="4" y="10" width="42" height="12" rx="4" fill="#9c6b3a"/><rect x="4" y="138" width="42" height="12" rx="4" fill="#9c6b3a"/><line class="vib" x1="25" y1="22" x2="25" y2="138" stroke="#d9534f" stroke-width="${2+r*3.2}" stroke-linecap="round"/></svg>`;
  if(kind==='drum'){const w=22+r*9;return `<svg viewBox="0 0 70 160"><ellipse cx="35" cy="${110-w*.6}" rx="${w}" ry="${w*.3}" fill="#ffe7c2" stroke="#b5651d" stroke-width="2"/><rect x="${35-w}" y="${110-w*.6}" width="${w*2}" height="${w*.9}" fill="#e2553f"/><ellipse cx="35" cy="${110-w*.6+w*.9}" rx="${w}" ry="${w*.3}" fill="#c43f2c"/></svg>`}
  const lvl=22+r*28;return `<svg viewBox="0 0 60 160"><rect x="12" y="${148-lvl}" width="36" height="${lvl}" rx="3" fill="#5ab8ff" opacity=".8"/><path d="M10 30h40v116q0 6 -6 6h-28q-6 0 -6 -6z" fill="#e8f6ff55" stroke="#8fbcd8" stroke-width="2.5"/></svg>`};
 const play=r=>{const f=NOTES[pitchRank(r)];if(kind==='drum')SFX.drum(f*.5);else if(kind==='glass')SFX.note(f*2,'sine',.9);else if(kind==='bands')SFX.note(f,'sawtooth',.35,.03);else SFX.note(f*2,'triangle',.6)};
 return {tag:['🎵',T('소리 실험|Sound lab')],say:tx,answer:'',
  mount(box,done){box.__done=done;
   box.innerHTML=qText(tx)+`<div class="instr ${kind}">${ranks.map((r,i)=>`<button class="ins" type="button" data-i="${i}" aria-label="${i+1}">${draw(r,i)}<span class="num">${i+1}</span></button>`).join('')}</div><p class="sub center">🔊 ${T('누를 때마다 소리가 나요. 고른 다음 확인!|Each tap plays a sound. Pick one, then check!')}</p>`+checkRow(T('이거예요!|This one!'));
   box.querySelector('.instr').addEventListener('click',e=>{const b=e.target.closest('.ins');if(!b||box.dataset.done)return;const i=+b.dataset.i;sel=i;play(ranks[i]);box.querySelectorAll('.ins').forEach(x=>x.classList.toggle('sel',x===b));b.classList.remove('buzz');void b.offsetWidth;b.classList.add('buzz')});
   const why=()=>kind==='glass'?T('유리컵을 톡 치면 물이 많을수록 낮은 소리, 적을수록 높은 소리가 나요.|When you tap a glass, more water makes a lower sound and less water makes a higher sound.'):kind==='drum'?T('작은 북은 높은 소리, 큰 북은 낮은 소리가 나요.|Small drums sound high; big drums sound low.'):kind==='bands'?T('가는 고무줄은 높은 소리, 굵은 고무줄은 낮은 소리가 나요.|Thin bands sound high; thick bands sound low.'):T('짧은 막대는 높은 소리, 긴 막대는 낮은 소리가 나요.|Short bars sound high; long bars sound low.');
   const btn=box.querySelector('.check');
   btn.addEventListener('click',()=>{if(box.dataset.done)return;if(sel<0){const m=box.querySelector('.simmsg');m.textContent='👆 '+T('먼저 하나를 골라요!|Pick one first!');m.classList.add('show');return}
    box.dataset.done=1;btn.disabled=true;const ok=sel===target;const els=box.querySelectorAll('.ins');els[target].classList.add('right');if(!ok)els[sel].classList.add('wrong');(ok?SFX.good:SFX.bad)();later(400,()=>play(ranks[target]));later(1300,()=>done(ok,{answer:`${target+1}${T('번|')}`,why:why()}))});
  },hint(){return false}};
};
// ---------------------------------------------------------------- hand washing: scrub for 20 seconds
SIMS.scrub=(q,ctx)=>{
 const NEED=20;let step=0,scrub=0,lastMove=0,B=null;
 return {tag:['🧼',T('손 씻기 대작전|Hand-washing mission')],say:T('세균을 없애요! 물을 묻히고, 비누칠하고, 20초 동안 문지른 다음 헹궈요.|Beat the germs! Wet, soap up, scrub for 20 seconds, then rinse.'),answer:T('20초 동안 문지르고 헹궈요|Scrub for 20 seconds, then rinse'),
  mount(box,done){B=box;

// Voices read unit symbols letter by letter or as a word (Korean voices say “큼” for cm), so spell units and short abbreviations out
const UNIT_KO={'g/cm³':'그램 퍼 세제곱센티미터','cm³':'세제곱센티미터',km:'킬로미터',cm:'센티미터',mm:'밀리미터',mL:'밀리리터',mg:'밀리그램',kg:'킬로그램',m:'미터',g:'그램',L:'리터'};
const UNIT_EN={'g/cm³':['gram per cubic centimeter','grams per cubic centimeter'],'cm³':['cubic centimeter','cubic centimeters'],km:['kilometer','kilometers'],cm:['centimeter','centimeters'],mm:['millimeter','millimeters'],mL:['milliliter','milliliters'],mg:['milligram','milligrams'],kg:['kilogram','kilograms'],m:['meter','meters'],g:['gram','grams'],L:['liter','liters']};
const UNIT_ALT='g\\/cm³|cm³|km|cm|mm|mL|mg|kg|m|g|L';
const RE_NUM_UNIT=new RegExp(`(\\d[\\d,]*(?:\\.\\d+)?)\\s?(${UNIT_ALT})(?![A-Za-z])`,'g'),RE_UNIT_NAMED=new RegExp(`(?:${UNIT_ALT})\\s?\\(([가-힣]+)\\)`,'g'),
 RE_UNIT_PAREN=new RegExp(`\\s?\\((?:${UNIT_ALT})\\)`,'g'),RE_BARE_UNIT=new RegExp(`(^|[^A-Za-z])(${UNIT_ALT})(?![A-Za-z])`,'g');
const ABBR_KO={OX:'오엑스',TV:'티브이',BTB:'비티비',pH:'피에이치',N:'엔',S:'에스'};
// 은/는 after a Korean word or a digit, for reading “=”
const hasBatchim=w=>{const c=w.replace(/[^가-힣0-9]+$/,'').slice(-1);if(!c)return false;if(/\d/.test(c))return '013678'.includes(c);return (c.charCodeAt(0)-0xac00)%28>0};
function speakable(t){
 const en=LANG==='en';
 t=String(t).replace(/°C\s?\((섭씨|degrees Celsius)\)/g,L('섭씨 도','degrees Celsius')).replace(/−(\d+(?:\.\d+)?)\s?°C/g,L('영하 $1도','minus $1 degrees')).replace(/(\d+(?:\.\d+)?)\s?°C/g,L('$1도','$1 degrees')).replace(/°C/g,L('도','degrees Celsius'));
 t=t.replace(RE_NUM_UNIT,(m,n,u)=>en?`${n} ${UNIT_EN[u][n==='1'?0:1]}`:n+UNIT_KO[u]);
 if(en)t=t.replace(RE_UNIT_PAREN,'').replace(/\s?\([A-Za-z]\)/g,'').replace(/\b(g\/cm³|cm³|km|cm|mm|mL|mg|kg)(?![A-Za-z])/g,u=>UNIT_EN[u][1]).replace(/\s*=\s*/g,' equals ');
 else t=t.replace(RE_UNIT_NAMED,'$1').replace(/\([A-Za-z]\)/g,'').replace(RE_BARE_UNIT,(m,p,u)=>p+UNIT_KO[u])
  .replace(/\b(OX|TV|BTB|pH|N|S)\b/g,a=>ABBR_KO[a]).replace(/(\S+)\s*=\s*/g,(m,w)=>w+(hasBatchim(w)?'은 ':'는 '));
 t=t.replace(/×/g,L(' 곱하기 ',' times ')).replace(/÷/g,L(' 나누기 ',' divided by ')).replace(/→/g,', ').replace(/−/g,L(' 빼기 ',' minus ')).replace(/~/g,L('에서 ',' to '));
 return t.replace(/\p{Extended_Pictographic}|‍|️|[①②③④⭕❌]/gu,'').replace(/\s+/g,' ').trim()}
// Browsers only allow speech after the first tap, so a line asked for before then waits for that tap
let pendingSay=null,saySeq=0;
document.addEventListener('pointerdown',()=>{const t=pendingSay;pendingSay=null;if(!t)return;const seq=saySeq;setTimeout(()=>{if(saySeq===seq)speak(t)},400)},{capture:true,once:true});
function speak(text){
 if(!ROOT.opt.voice||!('speechSynthesis' in window)||!text)return;
 saySeq++;if(navigator.userActivation&&!navigator.userActivation.hasBeenActive){pendingSay=text;return}
 try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(speakable(text));const v=bestVoice();if(v)u.voice=v;u.lang=LANG==='en'?'en-US':'ko-KR';u.rate=S.diff===1?.95:1.02;u.pitch=(BUDDIES[S.equip.buddy]||BUDDIES.puppy).pitch;speechSynthesis.speak(u)}catch(e){}
}

function ensureMissions(){
 const d=dayKey();if(S.missions.day===d)return;
 S.missions={day:d,list:shuffle(MISSIONS.slice()).slice(0,3).map(m=>({id:m.id,n:0,got:false})),chest:false};save();
}
function track(id,n=1){
 ensureMissions();
 for(const m of S.missions.list){if(m.id!==id||m.got)continue;const def=MISSIONS.find(x=>x.id===id);const was=m.n;m.n=Math.min(def.goal,m.n+n);
  if(was<def.goal&&m.n>=def.goal)toast(`${def.icon} ${L('임무 완료!','Mission complete!')} <small>${esc(def.text)}</small>`)}
 save();
}

// a card got answered: grow its mastery (at most 3 points a day so repeats are spread over days)
function learn(id,ok){
 const c=S.cards[id]||(S.cards[id]={m:0,d:'',n:0,r:0,w:0});const day=dayKey(),before=tierOf(c.m);
 if(c.d!==day){c.d=day;c.n=0}
 if(ok){c.r++;if(c.n<3){c.n++;c.m++}
  if(S.weak[id]){S.weak[id]--;if(S.weak[id]<=0){delete S.weak[id];S.beaten++;toast(`👾 ${L('오답 몬스터 퇴치!','Mistake monster defeated!')} <small>${esc(CARD[id].title)}</small>`)}}}
 else{c.w++;S.weak[id]=2;c.m=Math.max(0,c.m-1)}
 const after=tierOf(c.m);if(after>before){toast(`${TIER[after].icon} ${L('카드 승급!','Card leveled up!')} <b>${esc(CARD[id].title)}</b>`);track('card')}
 save();
}

function reviewList(){
 const ok=id=>CARD[id]&&CARD[id].lv<=S.diff;
 const weak=Object.keys(S.weak).filter(ok);
 const due=Object.entries(S.cards).filter(([id,c])=>ok(id)&&!S.weak[id]&&c.m>0&&tierOf(c.m)<3&&daysSince(c.d)>=INTERVAL[tierOf(c.m)]).sort((a,b)=>a[1].m-b[1].m).map(([id])=>id);
 return {weak,due};
}

function openMissionChest(){
 if(S.missions.chest||!S.missions.list.every(m=>m.got))return;

// a chest with two coin bags: add them up for a bonus (2-digit + 1-digit on Easy, 3-digit otherwise)
// wrong choices differ in the ones or the tens, so both digits have to be worked out
function mathChest(title,done){
 const easy=S.diff===1,a=easy?10+rnd(40):100+rnd(150),b=easy?2+rnd(8):60+rnd(140),ans=a+b,opts=shuffle([ans,...shuffle([ans+1,ans-1,ans+10,ans-10]).slice(0,2)]);
 let answered=false;
 modal(`<div style="font-size:70px">🎁</div><h2>${esc(title)}</h2><p>${L('상자 안에 코인 주머니가 2개 있어요. 모두 몇 개일까요? 맞히면 보너스 +50!','There are two coin bags inside. How many coins in total? Get it right for +50 bonus!')}</p>
  <div class="math" style="font-size:24px">${COIN} ${a} + ${COIN} ${b} = ?</div>
  <div class="choices">${opts.map(o=>`<button type="button" data-act="ans" data-v="${o}">${o}</button>`).join('')}</div>
  <p id="chestMsg" style="min-height:24px"></p><div class="row"><button class="btn gold hidden" id="chestTake" type="button" data-act="take">${L('받기','Collect')}</button></div>`,
 {closable:false,acts:{
  ans:b2=>{if(answered)return false;answered=true;const ok=+b2.dataset.v===ans;
   document.querySelectorAll('.choices button').forEach(x=>{if(+x.dataset.v===ans)x.classList.add('right');else if(x===b2)x.classList.add('wrong')});
   $('chestMsg').textContent=ok?L(`정답! ${a} + ${b} = ${ans} · 보너스 +50!`,`Correct! ${a} + ${b} = ${ans} · +50 bonus!`):L(`정답은 ${ans}이에요. 그래도 ${ans}코인을 받아요!`,`The answer is ${ans}. You still get ${ans} coins!`);
   if(ok){SFX.good();celebrate()}else SFX.bad();
   $('chestTake').classList.remove('hidden');$('chestTake').dataset.coins=ans+(ok?50:0);return false},
  take:b2=>{const n=+b2.dataset.coins;const r=grant({coins:n,xp:30});flyCoins(null,r.coins);done&&done()}
 }});
}

function pickItem(){

 if(!pool.length){PS.used.clear();pool=PS.pool.slice()}
 const rage=PS.foe&&PS.foe.boss&&PS.hp<=PS.maxHp/2&&!PS.rageDone;
 const w=pool.map(q=>{let x=1;x*=LW[S.diff][q.l]||1;if(S.weak[q.c])x*=2.2;if(PS.fresh&&PS.fresh.includes(q.c))x*=1.5;if(q.t==='sim')x*=rage?5:1.5;if(q.t===PS.lastT)x*=.25;if(q.c===PS.lastC)x*=.35;x/=1+.35*(S.seenQ[q.k]||0);if(PS.mode==='review'&&S.weak[q.c])x*=2;return x});

 if(k==='shield'){S.shieldOn=!S.shieldOn;save();drawItems();drawStatus();toast(S.shieldOn?'🛡️ '+L('실수 방패를 자동으로 써요','The shield will block your next mistake'):'🛡️ '+L('방패를 아껴 둘게요','Saving the shield for later'));return}
 if(PS.over||!PS.cur||PS.cur.answered){toast(L('다음 문제에서 써요!','Use it on the next question!'));return}
 if(k==='potion'){if(PS.hearts>=PS.max||!S.inv.potion){if(!S.inv.potion)toast(L('물약이 없어요. 상점에서 살 수 있어요!','No potions left. Get some in the shop!'));return}S.inv.potion--;PS.hearts++;save();SFX.hint();drawStatus();drawItems();toast('🧪 '+L('하트가 채워졌어요!','Heart refilled!'));return}
 if(k==='power'){if(!S.inv.power){toast(L('파워 업이 없어요. 상점에서 살 수 있어요!','No power-ups left. Get some in the shop!'));return}if(PS.power){toast(L('이미 파워 업 중이에요!','Already powered up!'));return}S.inv.power--;PS.power=3;save();SFX.zap();drawStatus();drawItems();toast('⚡ '+L('다음 정답 3번은 공격력 2배!','Next 3 right answers hit twice as hard!'));return}
 if(k==='hint'){
  if(PS.hintUsed){toast(L('이 문제에는 이미 힌트를 썼어요.','You already used a hint here.'));return}
  if(!PS.freeHint&&!S.inv.hint){toast(L('힌트 전구가 없어요. 상점에서 살 수 있어요!','No hint bulbs left. Get some in the shop!'));return}
  const box=$('cbody');let used=PS.cur.hint&&PS.cur.hint();
  if(!used){const c=CARD[PS.cur.q.c];const q=box.querySelector('.qtext');if(q&&!box.querySelector('.hintline')){q.insertAdjacentHTML('afterend',`<div class="hintline">💡 ${esc(c.text)}</div>`);used=true;speak(c.text)}}
  if(!used){toast(L('지금은 힌트를 쓸 수 없어요.','Can’t use a hint right now.'));return}
  if(PS.freeHint)PS.freeHint--;else S.inv.hint--;PS.hintUsed=true;save();SFX.hint();drawItems();
 }
}
// fly the hero's beam at the foe
function beamFly(cb){
 if(window.__sciInstant){cb&&cb();return}
 const a=$('meAva'),b=$('foeImg');if(!a||!b){cb&&cb();return}
 const ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect(),bm=BEAMS.find(x=>x.id===S.equip.beam)||BEAMS[0];
 const e=document.createElement('div');e.className='beamfx';e.textContent=bm.icon;e.style.setProperty('--c',bm.color);document.body.appendChild(e);
 const x0=ra.left+ra.width/2,y0=ra.top+ra.height/2,x1=rb.left+rb.width/2,y1=rb.top+rb.height/2;
 e.animate([{transform:`translate(${x0}px,${y0}px) scale(.5)`,opacity:.3},{transform:`translate(${(x0+x1)/2}px,${Math.min(y0,y1)-50}px) scale(1.5) rotate(180deg)`,opacity:1,offset:.5},{transform:`translate(${x1}px,${y1}px) scale(1.2) rotate(360deg)`,opacity:1}],{duration:560,easing:'cubic-bezier(.4,0,.6,1)'}).onfinish=()=>{e.remove();cb&&cb()};
}
function popOver(el,html,cls){if(!el)return;const r=el.getBoundingClientRect(),d=document.createElement('div');d.className='dmg '+(cls||'');d.innerHTML=html;d.style.left=(r.left+r.width/2)+'px';d.style.top=(r.top+r.height*.2)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1100)}
function answer(ok,info){
 const ch=PS.cur,q=ch.q,c=CARD[q.c],sim=q.t==='sim';
 S.answered++;learn(q.c,ok);PS.cardsHit.add(q.c);
 let blocked=false,dmg=0,crit=false;
 if(ok){
  PS.right++;PS.combo++;PS.maxCombo=Math.max(PS.maxCombo,PS.combo);S.correct++;track('correct');if(sim){S.sims++;track('sim')}
  if(PS.combo>S.bestCombo)S.bestCombo=PS.combo;if(PS.combo===5)track('combo');
  if(PS.foe){crit=PS.mode!=='review'&&PS.combo>=(S.equip.buddy==='owl'?2:3);dmg=PS.mode==='review'?1:(crit?2:1)*(PS.power?2:1);if(PS.power&&PS.mode!=='review')PS.power--;
   SFX.good();const P=PS;beamFly(()=>{if(PS!==P)return;SFX.hit();const fi=$('foeImg');if(fi){fi.classList.remove('hit');void fi.offsetWidth;fi.classList.add('hit')}popOver(fi,crit?`💥 −${dmg} <small>${L('크리티컬!','CRITICAL!')}</small>`:`−${dmg}`,crit?'crit':'');PS.hp=Math.max(0,PS.hp-dmg);drawStatus();if(PS.hp<=0){PS.over=true;PS.won=true;const f=$('foe');if(f)f.classList.add('down')}else if(PS.foe.boss&&PS.hp<=PS.maxHp/2&&!PS.ragedSaid){PS.ragedSaid=true;setFoeSay(L('으으… 화났다! 이제 실험 문제로 간다!','Grr… now I’m mad! Here come the lab challenges!'))}showFeedback(true,info,{dmg,crit})})}
  else{PS.score++;SFX.good();if(S.lab.day!==dayKey())S.lab={day:dayKey(),coins:0};if(S.lab.coins<60){S.lab.coins+=3;grant({coins:3,xp:3})}else grant({xp:2});showFeedback(true,info,{})}
 }else{
  PS.wrong++;PS.combo=0;PS.mistakes.push({q,ch,info});
  if(PS.foe){
   if(PS.guard){PS.guard--;blocked=true}else if(S.shieldOn&&S.inv.shield>0){S.inv.shield--;blocked=true}
   if(blocked)PS.blocked++;else PS.hearts--;
   SFX.hurt();const f=$('foe');if(f){f.classList.remove('lunge');void f.offsetWidth;f.classList.add('lunge')}
   const ar=document.querySelector('.arena');if(ar){ar.classList.remove('hurt');void ar.offsetWidth;ar.classList.add('hurt')}
   popOver($('meAva'),blocked?'🛡️':'💔',blocked?'shield':'ouch');
   if(PS.hearts<=0){PS.over=true;PS.won=false}
   drawStatus();drawItems();
  }else SFX.bad();
  const P=PS;if(window.__sciInstant)showFeedback(false,info,{blocked});else setTimeout(()=>{if(PS===P)showFeedback(false,info,{blocked})},PS.foe?450:150);
 }
 save();
}

 const ch=PS.cur,q=ch.q,c=CARD[q.c],why=(info&&info.why)||(q.why?T(q.why):c.text),ans=(info&&info.answer)||ch.answer;

 const nextLabel=PS.over?(PS.won||!PS.foe?L('결과 보기 ▶','See results ▶'):L('결과 보기 ▶','See results ▶')):L('다음 문제 ▶','Next ▶');
 $('fb').className='fb '+(ok?'ok':'bad');

  <div class="fbr"><button class="cardchip" type="button" data-cardchip="${c.id}">${icon(c.icon)} ${esc(c.title)}</button><button class="btn ${PS.over?'gold':'green'} next" type="button" data-next>${nextLabel}</button></div>`;
 $('fb').classList.remove('hidden');

let SP=null;
function speedPool(){const ws=openWorldIds();let p=QALL.filter(q=>q.t==='ox'&&q.l<=S.diff&&ws.includes(CARD[q.c].w));if(p.length<12)p=QALL.filter(q=>q.t==='ox'&&q.l<=S.diff&&CARD[q.c].w<=Math.max(1,...ws));
 // Hard skips the grade 1–2 claims once there are enough harder ones

 return p}

function speedBegin(sec){
 S.speedPlays++;save();go('play');
 SP={end:Date.now()+sec*1000,total:sec,score:0,combo:0,best:0,miss:[],pool:shuffle(speedPool()),i:0,over:false,cur:null,lock:false,timer:null};
 $('v-play').innerHTML=`<div class="arena speed" style="background:linear-gradient(135deg,#ffb347,#ff5e7e 50%,#7b4dff)"><div class="ptitle">⚡ ${L('번개 OX','Lightning O/X')}</div>
  <div class="spbar"><div class="tm"><i id="spT"></i></div><b id="spS" class="score">0</b></div><div class="spcombo" id="spC"></div></div>
  <div class="chal card speedcard" id="chal"><div class="claim big"><span class="who">${pic(FINAL.img,FINAL.icon)}</span><div class="says" id="spQ"></div></div>
  <div class="oxrow"><button class="oxb o" type="button" data-v="1"><b>⭕</b><small>${L('맞아요','True')}</small></button><button class="oxb x" type="button" data-v="0"><b>❌</b><small>${L('틀려요','False')}</small></button></div><div class="spfb" id="spF"></div></div>`;
 $('v-play').querySelector('.oxrow').addEventListener('click',e=>{const b=e.target.closest('.oxb');if(!b||!SP||SP.over||SP.lock)return;speedAnswer(+b.dataset.v===SP.cur.v)});
 speedNext();SP.timer=setInterval(speedTick,200);
}
function speedNext(){if(!SP)return;if(SP.i>=SP.pool.length){SP.pool=shuffle(SP.pool);SP.i=0}SP.cur=SP.pool[SP.i++];$('spQ').textContent='“'+T(SP.cur.s)+'”';SP.lock=false;speak(T(SP.cur.s))}
function speedTick(){if(!SP||SP.over)return;const left=(SP.end-Date.now())/1000;$('spT').style.width=Math.max(0,left/SP.total*100)+'%';$('spT').parentElement.classList.toggle('low',left<10);if(left<=10&&left>0&&Math.floor(left)!==SP.lt){SP.lt=Math.floor(left);SFX.tick()}if(left<=0)speedEnd()}
function speedAnswer(ok){
 const q=SP.cur;SP.lock=true;learn(q.c,ok);S.answered++;
 const f=$('spF');
 if(ok){SP.score++;SP.combo++;SP.best=Math.max(SP.best,SP.combo);S.correct++;track('correct');SFX.good();f.className='spfb ok';f.textContent='✅ '+(SP.combo>=3?`🔥${SP.combo}`:'')}
 else{SP.combo=0;SP.end-=3000;SP.miss.push(q);SFX.bad();f.className='spfb bad';f.textContent=`❌ ${L('정답','Answer')}: ${q.v?'⭕':'❌'} · −3${L('초','s')}`;const c=$('chal');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}
 $('spS').textContent=SP.score;$('spC').textContent=SP.combo>=3?`🔥 ${SP.combo} ${L('콤보','combo')}`:'';

 setTimeout(()=>{if(SP&&!SP.over)speedNext()},ok?380:1100);
}
function speedEnd(){
 if(!SP||SP.over)return;SP.over=true;clearInterval(SP.timer);stopVoice();
 const P=SP,rec=P.score>S.speedBest;if(rec)S.speedBest=P.score;track('speed');
 const r=grant({coins:P.score*3+(rec&&P.score>=5?50:0),xp:10+P.score*2},true);SFX.win();if(rec)celebrate();
 modal(`<div style="font-size:64px">⚡</div><h2>${rec?L('새 기록!','New record!'):L('시간 끝!','Time’s up!')}</h2><div class="bignum">${P.score}</div><p>${L(`최고 기록 ${S.speedBest} · 최고 콤보 ${P.best}`,`Best ${S.speedBest} · best combo ${P.best}`)}</p>${rewardChips(r)}
  ${P.miss.length?`<details class="review" open><summary>📝 ${L(`틀린 문제 다시 보기 (${P.miss.length})`,`Review your mistakes (${P.miss.length})`)}</summary>${[...new Set(P.miss)].map(q=>`<div class="rv"><b>${q.v?'⭕':'❌'} ${esc(T(q.s))}</b><span>${esc(q.why?T(q.why):CARD[q.c].text)}</span></div>`).join('')}</details>`:''}
  <div class="row"><button class="btn ghost" type="button" data-act="out">${L('홈으로','Home')}</button><button class="btn gold" type="button" data-act="again">⚡ ${L('다시 하기','Again')}</button></div>`,
 {closable:false,acts:{out:()=>()=>go('home'),again:()=>()=>speedIntro()},onOpen:b=>{if(r.coins)setTimeout(()=>flyCoins(b.querySelector('.rewards'),r.coins),400)}});

}

 else if(shopTab==='buddy')list=Object.entries(BUDDIES).map(([id,c])=>{const own=S.owned.buddy.includes(id);return `<div class="item">${own?`<span class="own">✓</span>`:''}<div class="pv">${pic(c.img,c.icon)}</div><b>${esc(c.name)}</b><small>✨ ${esc(c.perk)}</small>${buyBtn('buddy',id,c.price,own,S.equip.buddy===id)}</div>`}).join('');
 else list=EFFECTS.map(f=>{const own=S.owned.fx.includes(f.id);return `<div class="item">${own?`<span class="own">✓</span>`:''}<div class="pv">${f.icon}</div><b>${esc(f.name)}</b><button class="btn small ghost" type="button" data-preview="${f.id}">👀 ${L('미리 보기','Preview')}</button>${buyBtn('fx',f.id,f.price,own,S.equip.fx===f.id)}</div>`}).join('');

 if(b){

  {acts:{buy:()=>{if(S.coins<price)return;S.coins-=price;S.purchases++;

 }
});

  <div class="calendar">${LOGIN.map((c,i)=>`<div class="${i<idx?'got':i===idx?'today':''}">${L(`${i+1}일`,`Day ${i+1}`)}<b>${i===6?'🎁':i<idx?'✅':'🪙'}</b>${c}</div>`).join('')}</div>
  <div class="row"><button class="btn gold" type="button" data-act="take">${COIN} +${coins} ${L('받기','Collect')}</button></div>`,

}

// No title screen: open straight onto the home screen with the last player
applyLang();updateHud();ensureMissions();quietTrophies();$('homeLink').href='index.html?lang='+LANG;
go('home');
if(!S.intro)playerForm(S,{isNew:true});
else{if(ROOT.order.length>1)toast(`${esc(S.av)} ${esc(L(`${S.name} 대원으로 시작해요. 얼굴을 누르면 바꿀 수 있어요`,`Playing as ${S.name}. Tap the face to switch`))}`);dailyLogin()}
window.addEventListener('beforeunload',()=>save());

// For browser verification
window.__sciTest={get:()=>S,root:()=>ROOT,set:o=>{Object.assign(S,o);save();updateHud()},ps:()=>PS,sp:()=>SP,QALL,CARD,CH,SIMS,LABS,go,startStage,bossIntro,finalIntro,startReview,startDaily,startLab,speedBegin,finish,
 solve:()=>{if(!PS||!PS.cur||PS.cur.answered)return false;PS.cur.answered=true;answer(true,{});return true},miss:()=>{if(!PS||!PS.cur||PS.cur.answered)return false;PS.cur.answered=true;answer(false,{});return true},next:()=>{if(PS){if(PS.over)finish();else nextTurn()}},
 show:k=>{if(!PS)return false;PS.fixed=[QALL[k]];PS.over=false;nextTurn();return QALL[k]}};
</script>
