 $('ctNext').addEventListener('click',()=>{if(last)ceremony();else{CT.i++;contestRound()}})}
function ceremony(){const c=CT.c,host=$('host'),n=CT.accs.length,me=CT.accs.reduce((a,b)=>a+b,0)/n*100;
 const all=[{n:S.name,ic:S.av,v:me,me:true},...c.rivals.map((id,i)=>({id,n:T(RIVALS[id].name),ic:RIVALS[id].icon,v:CT.riv[i].reduce((a,b)=>a+b,0)/n}))].sort((a,b)=>b.v-a.v);
 const place=all.findIndex(x=>x.me)+1,medal=place<=3?4-place:0,rec=S.contests[c.id]||{medal:0,best:0,n:0};
 const firstGold=medal===3&&rec.medal<3;S.contests[c.id]={medal:Math.max(rec.medal,medal),best:Math.max(rec.best,me/100),n:rec.n+1};
 const coins=Math.round(c.prize*[.2,.4,.6,1][medal]),st=firstGold?giveSticker(pick(['🏅','👑','💎','🏰']))||giveSticker():null;save();
 host.innerHTML=`<div class="ceremony card"><h2>${c.icon} ${L('최종 결과','Final results')}</h2><div class="drumroll">🥁 ${L('두구두구두구…','Drumroll…')}</div>
  <div class="podium">${[2,1,3].map(p=>{const x=all[p-1];return x?`<div class="pod p${p} hide" data-p="${p}"><span class="pic">${esc(x.ic)}</span><b>${esc(x.n)}</b><em>${Math.round(x.v*10)}${L('점',' pts')}</em><div class="blk">${['','🥇','🥈','🥉'][p]}</div></div>`:''}).join('')}</div>
  <div class="finalmsg hide"></div><div class="rewards hide">${COIN} +${coins}${st?` <span class="stk">${st}</span>`:''}</div>
  <div class="row hide" id="cerBtns"><button class="btn ghost" id="ctAgain" type="button">↻ ${L('다시 도전','Try again')}</button><button class="btn gold" id="ctOut" type="button">${L('대회 목록','Contests')}</button></div></div>`;
 SFX.roll(2);const reveal=p=>{const el=host.querySelector(`.pod[data-p="${p}"]`);if(el){el.classList.remove('hide');SFX.star(3-p)}};
 setTimeout(()=>reveal(3),1700);setTimeout(()=>reveal(2),2600);setTimeout(()=>{reveal(1);host.querySelector('.drumroll').classList.add('hide');
  const rival=all.find(x=>!x.me&&x.id),rv=rival?RIVALS[rival.id]:null,msg=place===1?L('🥇 1등! 우승이에요! 정말 대단해요!','🥇 1st place! You won! Amazing!'):place===2?L('🥈 2등! 정말 아슬아슬했어요!','🥈 2nd place! That was so close!'):place===3?L('🥉 3등! 메달을 땄어요!','🥉 3rd place! You won a medal!'):L('🎗️ 참가 리본! 다음엔 꼭 메달!','🎗️ Participation ribbon! A medal is next!');
  const fm=host.querySelector('.finalmsg');fm.innerHTML=`<b>${msg}</b>${rv?`<p>${esc(rival.ic)} “${esc(T(place===1?rv.lose:rv.win))}”</p>`:''}`;fm.classList.remove('hide');host.querySelector('.rewards').classList.remove('hide');$('cerBtns').classList.remove('hide');
  if(place===1){SFX.win();setTimeout(SFX.cheer,300);celebrate()}else if(place<=3){SFX.fanfare();celebrate('stars')}else SFX.good();speak(msg.replace(/^\S+\s/,''));
  grant({coins,xp:30+medal*15});checkTrophies()},3600);
 host.addEventListener('click',e=>{if(e.target.id==='ctAgain'){CT={c,i:0,accs:[],riv:c.rivals.map(()=>[])};contestRound()}if(e.target.id==='ctOut')go('contests')})}

// ---------------------------------------------------------------- stickers, shop, trophies
RENDER.stickers=()=>{$('v-stickers').innerHTML=`<div class="room"><h2 class="h2w">📒 ${L('스티커북','Sticker book')} <small>${S.stickers.length}/${STICKERS.length}</small></h2><p class="sub wsub">${L('레슨을 처음 마치거나, 오늘의 연습을 끝내거나, 연속 기록을 세우면 스티커를 받아요!','Get stickers for new lessons, daily practice and streaks!')}</p>
 <div class="card stkgrid">${STICKERS.map(s=>`<span class="${S.stickers.includes(s)?'got':''}">${S.stickers.includes(s)?s:'?'}</span>`).join('')}</div></div>`};
RENDER.shop=()=>{const cats=[['skin',L('음표 모양','Note shapes')],['stage',L('무대','Stages')],['keys',L('건반','Keys')]];
 $('v-shop').innerHTML=`<div class="room"><h2 class="h2w">🛍️ ${L('상점','Shop')} <small>${COIN} ${num(S.coins)}</small></h2>${cats.map(([c,n])=>`<div class="card"><b>${n}</b><div class="shopgrid">${SHOP.filter(x=>x.cat===c).map(x=>{const own=S.owned.includes(x.id),eq=S.equip[c]===x.id;return `<button type="button" class="sitem ${eq?'eq':''}" data-s="${x.id}"><span class="si">${x.emoji||x.icon}</span><b>${esc(T(x.name))}</b><small>${eq?'✅ '+L('사용 중','In use'):own?L('사용하기','Use'):`${COIN} ${x.price}`}</small></button>`}).join('')}</div></div>`).join('')}</div>`;
 $('v-shop').querySelectorAll('[data-s]').forEach(b=>b.addEventListener('click',()=>{const x=SHOP.find(i=>i.id===b.dataset.s);if(S.owned.includes(x.id)){S.equip[x.cat]=x.id;save();applyOpts();SFX.click();RENDER.shop();return}
  if(S.coins<x.price){SFX.pop();toast(`${COIN} ${L(`코인이 ${x.price-S.coins}개 더 필요해요. 연습하면 모을 수 있어요!`,`You need ${x.price-S.coins} more coins. Practice to earn them!`)}`);return}
  modal(`<div class="center"><div class="big">${x.emoji||x.icon}</div><h2>${esc(T(x.name))}</h2><p>${COIN} ${x.price}</p></div><div class="row"><button class="btn ghost" data-act="close" type="button">${L('아니요','No')}</button><button class="btn gold" data-act="buy" type="button">${L('살래요!','Buy it!')}</button></div>`,{acts:{buy:()=>()=>{S.coins-=x.price;S.owned.push(x.id);S.equip[x.cat]=x.id;save();applyOpts();updateHud();SFX.coin();celebrate('stars');RENDER.shop()}}})}))};
RENDER.trophies=()=>{$('v-trophies').innerHTML=`<div class="room"><h2 class="h2w">🏅 ${L('트로피','Trophies')} <small>${S.ach.length}/${ACH.length}</small></h2>
 <div class="card medals">${CONTESTS.map(c=>`<div><span>${['🎗️','🥉','🥈','🥇'][(S.contests[c.id]||{}).medal||0]}</span><small>${esc(T(c.name))}</small></div>`).join('')}</div>
 <div class="achlist">${ACH.map(a=>{const got=S.ach.includes(a.id);return `<div class="achrow ${got?'got':''}"><span>${got?a.icon:'🔒'}</span><div><b>${esc(T(a.name))}</b><small>${esc(T(a.desc))}</small></div></div>`}).join('')}</div></div>`};

// ---------------------------------------------------------------- players, settings, timing check
// who is practicing: each profile keeps its own lessons, stars, streak, daily tasks, medals, stickers and coins
const doneOf=p=>LESSONS.filter(l=>p.lessons[l.id]&&(p.lessons[l.id].s>=1||p.lessons[l.id].pass)).length;
RENDER.who=()=>{const today=dayKey();
 $('v-who').innerHTML=`<div class="who"><h2 class="h2w center">🎵 ${L('누가 연습할까요?','Who’s practicing?')}</h2><p class="wsub center">${L('내 이름을 눌러요. 진도는 사람마다 따로 저장돼요.','Tap your name. Everyone’s progress is saved separately.')}</p>
  <div class="whogrid">${ROOT.P.map((p,i)=>{const t=titleOf(p.lvl),dn=p.daily&&p.daily.day===today?p.daily.done.filter(Boolean).length:0,gap=p.streak.last?daysSince(p.streak.last):null;
   return `<button type="button" class="whocard ${i===ROOT.cur?'last':''}" data-p="${i}"><span class="ava big">${esc(p.av)}</span><b class="wn">${esc(p.name)}</b><small>${t.icon} ${esc(t.name)} · Lv.${p.lvl}</small>
    <span class="wstats"><span>🔥 ${p.streak.n}</span><span>🎓 ${doneOf(p)}/${LESSONS.length}</span><span>📅 ${dn}/3</span></span>
    <small class="wlast">${gap==null?L('아직 연습 전이에요','Hasn’t practiced yet'):gap===0?'✅ '+L('오늘 연습했어요!','Practiced today!'):gap===1?L('어제 연습했어요','Practiced yesterday'):L(`${gap}일 전에 연습했어요`,`Last practiced ${gap} days ago`)}</small></button>`}).join('')}</div>
  <div class="row"><button class="btn ghost small" id="whoAdd" type="button">➕ ${L('친구 추가','Add player')}</button><button class="btn ghost small" id="whoEdit" type="button">✏️ ${L('이름·얼굴 바꾸기','Edit names & faces')}</button></div></div>`;
 $('v-who').querySelectorAll('[data-p]').forEach(b=>b.addEventListener('click',()=>selectPlayer(+b.dataset.p)));
 $('whoAdd').addEventListener('click',()=>playerForm(true));$('whoEdit').addEventListener('click',manageProfiles);
 speak(L('누가 연습할까요? 내 이름을 눌러요!','Who’s practicing? Tap your name!'))};
function selectPlayer(i){save();ROOT.cur=i;S=ROOT.P[i];save();applyOpts();SFX.open();toast(`${esc(S.av)} ${L(`${esc(S.name)} 차례예요!`,`${esc(S.name)}’s turn!`)}`);go('home',false);
 if(!S.intro)welcome();else{speak(L(`${S.name}, 안녕! 오늘도 같이 연습해요!`,`Hi ${S.name}! Let’s practice together!`));returnGreeting()}}
function manageProfiles(){modal(`<h2>✏️ ${L('이름·얼굴 바꾸기','Edit players')}</h2><div class="plist">${ROOT.P.map((p,i)=>`<div class="prow"><span class="ava mini">${esc(p.av)}</span><b>${esc(p.name)}</b><button type="button" class="btn ghost small" data-act="ed" data-i="${i}" aria-label="${esc(L('바꾸기','Edit'))}">✏️</button>${ROOT.P.length>1?`<button type="button" class="btn ghost small" data-act="del" data-i="${i}" aria-label="${esc(L('지우기','Delete'))}">🗑️</button>`:''}</div>`).join('')}</div>`,
 {acts:{ed:b=>()=>playerForm(false,+b.dataset.i),del:b=>()=>confirmDelete(+b.dataset.i)}})}
function confirmDelete(i){const p=ROOT.P[i];modal(`<div class="center"><span class="ava big">${esc(p.av)}</span><h2>${L(`${esc(p.name)} 기록을 지울까요?`,`Delete ${esc(p.name)}?`)}</h2><p>${L('별, 스티커, 코인, 메달이 모두 사라지고 되돌릴 수 없어요.','All stars, stickers, coins and medals will be gone for good.')}</p></div>
 <div class="row"><button class="btn ghost" data-act="close" type="button">${L('아니요','No')}</button><button class="btn red" data-act="yes" type="button">${L('지울래요','Delete')}</button></div>`,
 {acts:{yes:()=>()=>{save();const curP=ROOT.P[ROOT.cur];ROOT.P.splice(i,1);ROOT.cur=Math.max(0,ROOT.P.indexOf(curP));S=ROOT.P[ROOT.cur];save();applyOpts();go('who',false)}}})}
function playerForm(isNew,idx=ROOT.cur){const p=isNew?freshP():ROOT.P[idx];let av=p.av;
 modal(`<h2>${isNew?L('새 친구','New player'):L('이름과 얼굴','Name and face')}</h2><input class="nameIn" id="nameIn" maxlength="12" value="${esc(isNew?'':p.name)}" placeholder="${esc(L('이름','Name'))}"><div class="avs">${AVATARS.map(a=>`<button type="button" class="avb ${a===av?'on':''}" data-a="${a}">${a}</button>`).join('')}</div>
  <div class="row"><button class="btn green" data-act="ok" type="button">${L('좋아요!','OK!')}</button></div>`,{onOpen:box=>{box.querySelector('.avs').addEventListener('click',e=>{const b=e.target.closest('.avb');if(!b)return;av=b.dataset.a;box.querySelectorAll('.avb').forEach(x=>x.classList.toggle('on',x===b))})},
  acts:{ok:()=>{const n=($('nameIn').value||'').trim()||L('음악 친구','Music friend');
   if(isNew){const np=freshP();np.name=n;np.av=av;np.faceSet=true;ROOT.P.push(np);save();return ()=>selectPlayer(ROOT.P.length-1)}
   p.name=n;p.av=av;p.faceSet=true;save();applyOpts();updateHud();if(VIEW==='who')RENDER.who()}}})}
function openSettings(){const o=ROOT.opt;modal(`<h2>⚙️ ${L('설정','Settings')}</h2><div class="sets">
  <button type="button" class="setrow" data-act="snd">🔊 ${L('소리','Sound')}<b>${o.sound?'ON':'OFF'}</b></button>
  <button type="button" class="setrow" data-act="vce">🗣️ ${L('선생님 목소리','Teacher voice')}<b>${o.voice?'ON':'OFF'}</b></button>
  <div class="setrow">🔤 ${L('음 이름','Note names')}<span class="seg mini">${[['solfege',L('도레미','Do Re Mi')],['letter','C D E'],['both',L('둘 다','Both')]].map(([v,n])=>`<button type="button" data-act="nm" data-v="${v}" class="${OPT_NAMES()===v?'on':''}">${n}</button>`).join('')}</span></div>
  <button type="button" class="setrow" data-act="cal">⏱️ ${L('박자 맞추기 보정','Timing check')}<b>${o.calib>0?'+':''}${o.calib}ms</b></button>
  <button type="button" class="setrow" data-act="lang">🌐 ${L('English로 바꾸기','한국어로 바꾸기')}</button>
  <button type="button" class="setrow" data-act="ppl">👨‍👩‍👧 ${L('연습하는 친구 바꾸기','Switch player')}</button>
  <button type="button" class="setrow danger" data-act="reset">🗑️ ${L('이 친구 기록 지우기','Reset this player')}</button></div>${COPYRIGHT()}`,{acts:{
  snd:()=>{o.sound=!o.sound;save();applyOpts();return ()=>openSettings()},vce:()=>{o.voice=!o.voice;if(!o.voice)stopVoice();save();return ()=>openSettings()},
  nm:b=>{o.names=b.dataset.v;save();applyOpts();return ()=>{openSettings();if(VIEW!=='play')go(VIEW,false)}},cal:()=>()=>calibrate(),lang:()=>setLang(LANG==='en'?'ko':'en'),ppl:()=>()=>switchPlayer(),
  reset:()=>()=>modal(`<h2>🗑️ ${L('정말 지울까요?','Really reset?')}</h2><p>${L('이 친구의 별, 스티커, 코인이 모두 사라져요.','All stars, stickers and coins for this player will be gone.')}</p><div class="row"><button class="btn ghost" data-act="close" type="button">${L('아니요','No')}</button><button class="btn red" data-act="yes" type="button">${L('지울래요','Reset')}</button></div>`,{acts:{yes:()=>()=>{const n=S.name,a=S.av;S=freshP();S.name=n;S.av=a;S.intro=true;ROOT.P[ROOT.cur]=S;save();applyOpts();go('home',false)}}})}})}
// tap along with ticks; the average delay becomes the timing correction
function calibrate(){let taps=[],clk=null,t0=0,b=null,spb=60/90,N=12;
 modal(`<h2>⏱️ ${L('박자 맞추기 보정','Timing check')}</h2><p>${L('블루투스 이어폰이나 화면 반응이 느리면 박자가 늦게 판정될 수 있어요. “똑딱” 소리에 맞춰 버튼을 12번 눌러 주세요.','Wireless headphones or slow screens can make taps seem late. Tap the button along with the 12 ticks.')}</p>
  <button type="button" class="bl-pad calpad" id="calPad">👆</button><p class="center" id="calMsg">${L('시작을 누르세요','Press start')}</p>
  <div class="row"><button class="btn green" id="calGo" type="button">▶ ${L('시작','Start')}</button><button class="btn ghost" data-act="zero" type="button">${L('0으로 되돌리기','Reset to 0')}</button></div>`,{acts:{zero:()=>{ROOT.opt.calib=0;save();applyOpts();toast('⏱️ 0ms')}},
  onOpen:box=>{const pad=box.querySelector('#calPad'),msg=box.querySelector('#calMsg');
   box.querySelector('#calGo').addEventListener('click',async()=>{const ok=await ensureAudio();if(!ok){msg.textContent=L('소리를 켤 수 없어요','Sound is not available');return}taps=[];clk=makeClock(true);b=bus(1);t0=startAt(clk,true,.6);for(let i=0;i<N;i++)drum(i%4?'click':'accent',t0+i*spb,.9,b);msg.textContent=L('똑딱에 맞춰 눌러요!','Tap with the ticks!');
    setTimeout(()=>{killBus(b);const offs=taps.map(t=>{const k=Math.round((t-t0)/spb);return k>=2&&k<N?(t-t0)-k*spb:null}).filter(x=>x!=null&&Math.abs(x)<.3).sort((a,c)=>a-c);
     if(offs.length<5){msg.textContent=L('눌린 횟수가 부족해요. 다시 해 봐요!','Not enough taps. Try again!');return}const med=offs[Math.floor(offs.length/2)],ms=clamp(Math.round(med*1000),-200,250);ROOT.opt.calib=ms;save();applyOpts();msg.textContent=L(`보정 완료! ${ms>0?'+':''}${ms}ms`,`Done! ${ms>0?'+':''}${ms} ms`);SFX.good()},600+N*spb*1000+500)});
   pad.addEventListener('pointerdown',e=>{e.preventDefault();if(clk)taps.push(clk(e.timeStamp));pad.classList.remove('hit');void pad.offsetWidth;pad.classList.add('hit')})}})}

// ---------------------------------------------------------------- welcome story for a new player
function welcome(){const ts=Object.values(TEACHERS);
 modal(`<div class="welcome"><div class="tparade">${ts.map(t=>`<span class="tface" style="background:${t.bg}">${pic(t.img,t.icon)}</span>`).join('')}</div><h2>${L(`${esc(S.name)}, 꼬마 음악 아카데미에 온 걸 환영해요!`,`${esc(S.name)}, welcome to Little Music Academy!`)}</h2>
  <p>${L('여섯 선생님과 함께 박자, 건반, 악보, 노래, 드럼, 악기를 하나씩 배워요. 매일 조금씩 연습하고, 대회에 나가 메달도 따 봐요!','Learn beat, keys, reading music, singing, drums and instruments with six teachers. Practice a little every day and win medals in contests!')}</p></div>
  <div class="row"><button class="btn green cta" data-act="go" type="button">🎵 ${L('시작하기','Let’s start')}</button></div>`,{closable:false,onOpen:()=>{SFX.open();speak(L(`${S.name}, 꼬마 음악 아카데미에 온 걸 환영해요! 여섯 선생님과 함께 음악을 배워 봐요!`,`${S.name}, welcome to Little Music Academy! Let’s learn music with six teachers!`))},
  acts:{go:()=>()=>{S.intro=true;save();if(!S.faceSet)playerForm(false)}}})}

// ---------------------------------------------------------------- start
function returnGreeting(){const gap=daysSince(S.streak.last);if(S.intro&&S.streak.last&&gap>=3){const t=TEACHERS[pick(Object.keys(TEACHERS))];
 modal(`<div class="center"><span class="tface huge" style="background:${t.bg}">${pic(t.img,t.icon)}</span><h2>${L('보고 싶었어요!','We missed you!')}</h2><p>${L('오늘은 가볍게 “오늘의 연습” 하나만 해 볼까요? 1분이면 돼요!','How about just one quick task today? It only takes a minute!')}</p></div><div class="row"><button class="btn green" data-act="close" type="button">${L('좋아요!','Okay!')}</button></div>`,{onOpen:()=>speak(L('보고 싶었어요! 오늘은 가볍게 하나만 해 볼까요?','We missed you! Just one quick task today?'))})}}
$('backBtn').addEventListener('click',()=>{SFX.click();back()});
$('gearBtn').addEventListener('click',openSettings);$('coinPill').addEventListener('click',()=>go('shop'));$('streakPill').addEventListener('click',()=>toast(`🔥 ${L(`${S.streak.n}일 연속 · 최고 ${S.streak.best}일 · 🛡️ 쉬는 날 카드 ${S.streak.shields}장`,`${S.streak.n}-day streak · best ${S.streak.best} · 🛡️ ${S.streak.shields} rest-day passes`)}`));
$('lvlBtn').addEventListener('click',switchPlayer);
// with more than one player, always ask who is practicing first so progress never mixes
applyLang();applyOpts();save();if(!MGP.me&&ROOT.P.length>1)go('who',false);else{go('home',false);if(!S.intro)welcome();else returnGreeting()}
window.__musTest={get:()=>S,root:()=>ROOT,selectPlayer,set:o=>{Object.assign(S,o);save();updateHud()},go,openLesson,startLessonActivity,startDaily,contestLobby,act:()=>ACT,sim:acc=>ACT&&ACT.sim(acc),LESSONS,CONTESTS,SONGS,DRUMS,playSong,playDrum,modalFlush:()=>{while(CUR)closeModal();MQ.length=0}};
</script>
