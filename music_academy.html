.qdots i.cur{background:#fff}
.quiz .qdots i,.keytask .qdots i,.sing .qdots i{background:#e4dcff}.quiz .qdots i.cur{background:#7b5cff}
.qdots i.ok{background:#3ee07a}.qdots i.half{background:#ffd23f}.qdots i.no{background:#ff7b8a}

/* beat tapping */
.beatlab,.rhylab,.quiz,.keytask,.sing,.breath,.micgate,.howto{background:rgba(255,255,255,.96);border-radius:24px;padding:12px 14px 16px;box-shadow:var(--shadow);position:relative}
.bl-msg,.rl-msg{text-align:center;font-weight:900;font-size:17px;min-height:26px}
.bl-msg.quietmsg{color:#7b5cff}
.bl-stage{position:relative;width:220px;height:220px;margin:8px auto;display:grid;place-items:center}
.bl-ring{position:absolute;inset:0;border-radius:50%;border:6px solid #ff5fa2;opacity:0}
.bl-ring.beat{animation:ring .5s ease-out}
@keyframes ring{0%{transform:scale(.75);opacity:1}100%{transform:scale(1.15);opacity:0}}
.bl-pad{position:relative;width:170px;height:170px;border-radius:50%;border:0;background:radial-gradient(circle at 40% 35%,#fff7e0,#ffcf6b 55%,#f29a1e);box-shadow:0 10px 0 #c97a10,0 18px 30px rgba(0,0,0,.25);display:grid;place-items:center;touch-action:none}
.bl-pad.hit{animation:padhit2 .16s}
@keyframes padhit2{50%{transform:translateY(6px) scale(.96);box-shadow:0 4px 0 #c97a10}}
.bl-hop{font-size:56px;line-height:1}.bl-hop .ei{width:70px;height:70px}
.bl-num{position:absolute;bottom:18px;font-size:22px;font-weight:900;color:#7a4300}
.bl-meter{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:900;color:var(--muted);margin:6px 0}
.bl-bar{position:relative;flex:1;height:18px;border-radius:99px;background:linear-gradient(90deg,#ffd6dc,#fff 40%,#fff 60%,#ffd6dc)}
.bl-bar em{position:absolute;left:50%;top:-4px;bottom:-4px;width:3px;margin-left:-1.5px;background:#3ec46d;border-radius:2px}
.bl-bar i{position:absolute;top:-3px;width:14px;height:24px;margin-left:-7px;border-radius:7px;left:50%;background:#ccc;opacity:0}
.bl-bar i.flash{animation:tick 1s}
@keyframes tick{0%{opacity:1;transform:scale(1.3)}70%{opacity:1}100%{opacity:.25;transform:none}}
.bl-judge{text-align:center;font-size:26px;font-weight:900;min-height:36px}
.bl-judge.pop,.hw-judge.pop{animation:jpop .45s}
@keyframes jpop{from{transform:scale(1.5);opacity:.3}}
.bl-dots{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:6px 0 4px}
.bl-dots i{width:14px;height:14px;border-radius:50%;background:#e4dcff}
.bl-dots i.quiet{box-shadow:inset 0 0 0 2px #7b5cff;background:#f6f2ff}
.bl-dots i.jp{background:#ffd23f}.bl-dots i.jg{background:#3ee07a}.bl-dots i.jo{background:#5cc8ff}.bl-dots i.jm{background:#ff7b8a}

/* rhythm */
.rl-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rl-top b{background:#f1edff;border-radius:99px;padding:3px 10px;font-size:13px}
.rl-sheet{min-height:96px;display:grid;place-items:center;background:#fffaf0;border-radius:16px;margin:8px 0;padding:4px}
.rl-sheet svg{width:100%;height:auto;max-height:120px}
.rl-hidden{font-size:22px;font-weight:900;color:var(--brand-d)}
.rl-ctl{display:flex;gap:10px;justify-content:center;min-height:52px;flex-wrap:wrap}
.rl-pad{width:150px;height:150px;margin:10px auto 4px;display:grid;font-size:56px}
.rl-pad.listening{filter:grayscale(.6);opacity:.6}
.rl-pop{position:absolute;left:50%;top:-6px;font-style:normal;font-size:24px;animation:rlp .6s forwards}
@keyframes rlp{to{transform:translateY(-40px);opacity:0}}

/* falling notes */
.hw{display:flex;flex-direction:column;gap:6px;height:calc(100dvh - 120px);min-height:520px;position:relative}
.hw-top{display:flex;align-items:center;gap:8px;color:#fff;font-weight:900}
.hw-score{font-size:22px;min-width:64px}
.hw-combo{font-size:18px;color:#ffd23f;min-width:50px}
.hw-prog{flex:1;height:10px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden}
.hw-prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff8fd1,#ffd23f)}
.hw-acc{min-width:44px;text-align:right}
.hw .tline{min-height:40px}
.hw-staff{width:100%;height:110px;border-radius:14px;background:#fffdf7;flex:0 0 auto}
.hw-road{position:relative;flex:1;min-height:200px;border-radius:18px;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(255,255,255,.2)}
.hw-cv{display:block;width:100%;height:100%}
.hw-judge{position:absolute;left:0;right:0;top:28%;text-align:center;pointer-events:none;font-size:34px;font-weight:900;text-shadow:0 3px 10px rgba(0,0,0,.45)}
.hw-judge i{display:block;font-style:normal;font-size:18px;color:#fff}
.hw-input{flex:0 0 auto;position:relative}
.hw-input.song{height:min(170px,24vh)}
.hw-input.drum,.hw-input.chordplay{display:flex;gap:8px;height:min(150px,22vh)}
.hw-hint{color:#e9e2ff!important;font-size:13px}
.hw-rivals{display:grid;gap:3px;background:rgba(0,0,0,.25);border-radius:12px;padding:6px 8px}
.rrow{position:relative;display:flex;gap:6px;align-items:center;color:#fff;font-size:12.5px;font-weight:800;height:20px}
.rrow span{width:16px}.rrow b{position:relative;z-index:1;white-space:nowrap}
.rrow i{position:absolute;left:22px;top:2px;bottom:2px;border-radius:6px;background:rgba(255,255,255,.18);transition:width .3s}
.rrow.me i{background:linear-gradient(90deg,#ff8fd1aa,#ffd23faa)}
.pad{flex:1;border:0;border-radius:20px;background:var(--c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;box-shadow:0 6px 0 rgba(0,0,0,.25);touch-action:none;position:relative}
.pad .pi{font-size:34px;line-height:1.1}.pad b{font-size:20px}.pad small{font-size:11.5px;font-weight:800;opacity:.9}.pad .cn{font-size:30px}
.pad kbd{position:absolute;top:6px;right:8px;font:900 11px system-ui;background:rgba(0,0,0,.25);border-radius:6px;padding:1px 5px}
.pad.down{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.25);filter:brightness(1.15)}
@media (pointer:coarse){.pad kbd{display:none}}
/* playable keys */
.pkeys{position:relative;height:100%;min-height:120px;touch-action:none;-webkit-user-select:none;user-select:none}
.pk{position:absolute;top:0;border:0;padding:0;display:flex;align-items:flex-end;justify-content:center;touch-action:none}
.pk.w{height:100%;background:linear-gradient(180deg,#fff 70%,#eef0f7);border:1.5px solid #9aa5c2;border-radius:0 0 10px 10px;box-shadow:inset 0 -6px 0 #dfe3ee;z-index:1}
.pk.b{height:60%;background:linear-gradient(180deg,#3a4466,#1d2238);border-radius:0 0 7px 7px;z-index:2;box-shadow:0 3px 0 #0b0e1a}
.pk span{font-weight:900;font-size:clamp(11px,2.6vw,16px);color:#5f6b8f;margin-bottom:10px;pointer-events:none}
.pk.b span{color:#fff;font-size:10px;margin-bottom:6px}
.pk.w.rb{box-shadow:inset 0 -14px 0 var(--nc)}
.pk.w.gd{background:linear-gradient(180deg,#fffbe6 60%,#ffe08a)}
.pk.b.gd{background:linear-gradient(180deg,#8a6a1a,#3a2a06)}
.pk.down,.pk.w.down{background:linear-gradient(180deg,#ffe6f2,#ffc2de)}
.pk.b.down{background:#7b5cff}
.pk.glow{animation:kglow .9s infinite}
.pk.w.glow{background:linear-gradient(180deg,#fff,#ffe680)}
@keyframes kglow{50%{box-shadow:inset 0 -6px 0 #ffd23f,0 0 0 4px #ffd23f}}
.pk.hint{background:linear-gradient(180deg,#fff,#b8f5cf)!important;animation:kglow .7s infinite}
.pk.b.hint{background:#3ec46d!important}
.pk.good{background:linear-gradient(180deg,#e8fff0,#9fe8b9)!important}
.pk.b.good{background:#1f9a4f!important}
.pk.bad,.pk.nope{animation:shake .35s;background:linear-gradient(180deg,#fff,#ffc4cb)!important}
.pk.sel{background:linear-gradient(180deg,#eef4ff,#a9c8ff)!important}
.pk.b.sel{background:#2a8df4!important}
.pk.start{background:linear-gradient(180deg,#fff,#ffd6ea)!important}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}

/* quiz */
.qcard{margin-top:4px}
.qcard.in{animation:viewIn .3s}
.qq{font-size:19px;font-weight:900;text-align:center;margin:4px 0 10px;line-height:1.35}
.qart{display:grid;place-items:center;font-size:58px;line-height:1.2;margin:6px auto 10px;min-height:70px}
.qart svg{max-width:100%}
.qart.staffart,.qart.kbdart{width:min(320px,100%)}
.qart.staffart svg,.qart.kbdart svg{width:100%;height:auto}
.qart.instr{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:18px}
.qart.instr .ib{width:90px;height:90px;font-size:62px}.qart.instr .isvg{width:74px;height:74px}
.qcard .hear{display:flex;margin:-4px auto 10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.n2{grid-template-columns:1fr 1fr}
.opt{border:0;border-radius:16px;min-height:60px;padding:10px;background:#f1edff;font-weight:900;font-size:16px;box-shadow:0 4px 0 #d6ccfa;line-height:1.25}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 #d6ccfa}
.opt.right{background:linear-gradient(180deg,#d8ffe6,#9fe8b9);box-shadow:0 4px 0 #5fc98a}
.opt.wrong{background:linear-gradient(180deg,#ffe2e6,#ffb3bd);box-shadow:0 4px 0 #f28694;animation:shake .35s}
.opt:disabled{cursor:default}
.qfb{margin-top:10px;text-align:center;font-weight:800;display:grid;gap:6px;justify-items:center}

/* keyboard tasks */
.kt-q{font-size:19px;font-weight:900;text-align:center;line-height:1.35}
.kt-art{display:grid;place-items:center;min-height:10px;margin:6px 0}
.kt-art svg{width:min(300px,90%);height:auto}
.kt-steps{display:flex;gap:6px;justify-content:center;margin:6px 0}
.kt-steps .ss{min-width:34px;padding:4px 6px;border-radius:10px;background:#f1edff;font-weight:900;font-size:14px;text-align:center;color:#b3a8d8}
.kt-steps .ss.ok{background:#3ee07a;color:#fff}.kt-steps .ss.half{background:#ffd23f;color:#5a4300}
.kt-fb{min-height:24px;text-align:center;font-weight:800;color:var(--brand-d)}
.kt-kbd{height:min(180px,28vh);margin-top:6px}
.kt-ctl{display:flex;justify-content:center;gap:10px;margin-top:8px}

/* singing */
.sg-q{text-align:center;font-weight:900;font-size:17px;line-height:1.35}
.sg-q .big{font-size:40px}
.sg-stage{position:relative;margin:8px 0}
.sg-cv{display:block;width:100%;height:min(260px,36vh);border-radius:16px;background:#fffaf0;box-shadow:inset 0 0 0 2px #f0e6cc}
.sg-tip{text-align:center;font-weight:900;font-size:20px;min-height:32px;margin-top:6px;color:var(--brand-d)}
.sg-ctl{display:flex;flex-direction:column;align-items:center;gap:8px}
.sg-ctl .row{margin-top:0}
.micgate{text-align:center}
.mg-ic{font-size:72px;line-height:1.2}
.micgate h3{font-size:18px}
.breath{text-align:center}
.br-msg{font-weight:900;font-size:19px;min-height:30px}
.br-stage{position:relative;height:240px;display:grid;place-items:center}
.br-ball{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d9f6ff,#5cc8ff 60%,#2a8df4);box-shadow:0 10px 30px rgba(42,141,244,.4);transition:transform .2s linear}
.br-ball.out{background:radial-gradient(circle at 35% 30%,#ffe6f2,#ff8fd1 60%,#ff5fa2)}
.br-ball.hold{background:radial-gradient(circle at 35% 30%,#fff7d6,#ffd23f 60%,#f2a500)}
.br-n{position:absolute;font-size:44px;font-weight:900;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.br-meter{display:flex;align-items:center;gap:8px;margin:4px 20px}
.br-meter .bar{flex:1;height:14px;border-radius:99px;background:#eef}
.br-meter i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#5cc8ff,#3ec46d)}
.br-cyc{display:flex;gap:8px;justify-content:center;margin:8px}
.br-cyc i{width:16px;height:16px;border-radius:50%;background:#e4dcff}.br-cyc i.on{background:#7b5cff}

/* how-to cards */
.howto{text-align:center}
.howto p{font-weight:800;font-size:17px;line-height:1.45}
.howroad{position:relative;width:180px;height:170px;margin:10px auto;background:linear-gradient(180deg,#2a1466,#5a33b8);border-radius:16px;overflow:hidden}
.howroad .blk{position:absolute;left:62px;width:56px;height:30px;border-radius:9px;background:#ff5fa2;animation:fall 1.8s infinite linear}
.howroad .line{position:absolute;left:0;right:0;bottom:30px;height:4px;background:#ffd23f}
.howroad .hand{position:absolute;left:72px;bottom:-4px;font-size:34px;animation:handtap 1.8s infinite}
@keyframes fall{0%{top:-30px}70%{top:106px;opacity:1}75%{opacity:0}100%{top:106px;opacity:0}}
@keyframes handtap{0%,62%{transform:translateY(10px)}70%{transform:translateY(-4px)}80%,100%{transform:translateY(10px)}}
.howbeat{position:relative;width:140px;height:140px;margin:10px auto}
.howbeat i{position:absolute;inset:16px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff7e0,#ffcf6b 55%,#f29a1e);animation:hb 1s infinite}
.howbeat .hand{position:absolute;right:-6px;bottom:-6px;font-size:40px;animation:handtap2 1s infinite}
@keyframes hb{0%,100%{transform:scale(1)}10%{transform:scale(.92)}}
@keyframes handtap2{0%,100%{transform:translate(0,0)}10%{transform:translate(-10px,-10px)}}

/* results */
.result{text-align:center}
.rstars{display:flex;justify-content:center;gap:8px;font-size:56px;line-height:1;color:#e4dcff}
.rstars span.on.pop{color:#ffc83d;animation:starin .45s cubic-bezier(.2,1.6,.4,1);text-shadow:0 4px 12px rgba(255,180,0,.5)}
@keyframes starin{from{transform:scale(0) rotate(-120deg)}}
.rpct{font-size:44px;font-weight:900;color:var(--brand-d);margin:4px 0}
.rchips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.rchips span{background:color-mix(in srgb,var(--c) 22%,#fff);border:2px solid var(--c);border-radius:99px;padding:3px 10px;font-weight:900;font-size:13.5px}
.growth{margin:10px auto 0;display:inline-block;background:linear-gradient(90deg,#fff3c4,#ffd6ea);border-radius:99px;padding:6px 14px;font-weight:900}
.result .teach{text-align:left}
.advice{list-style:none;margin:8px 0;padding:10px 12px;background:#eef8ff;border-radius:14px;text-align:left;font-weight:800;font-size:14.5px;display:grid;gap:6px}
.rewards{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0;font-weight:900}
.rewards span{background:#fff8dc;border-radius:99px;padding:5px 12px;box-shadow:inset 0 0 0 2px #ffe08a}
.rewards .stk{background:#ffeef6;box-shadow:inset 0 0 0 2px #ffb3d6;font-size:18px}
.rbtns .btn{flex:1;min-width:130px}

/* rooms */
.room .card{margin-bottom:10px}
.opts .seg{margin:4px 0}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:#f1edff;border-radius:14px;padding:4px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:8px 6px;font-weight:900;font-size:14px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--brand-d);box-shadow:0 2px 6px rgba(80,40,200,.2)}
.seg.mini{display:inline-flex;background:#f1edff}
.seg.mini button{padding:5px 8px;font-size:12.5px}
.songlist{display:grid;gap:8px}
.songrow{display:flex;align-items:center;gap:8px;background:#fff;border-radius:18px;padding:10px 12px;box-shadow:var(--shadow)}
.songrow .si{flex:1;min-width:0}.songrow b{display:block;font-size:16px}.songrow small{color:var(--muted);font-weight:700}
.songrow.locked{opacity:.65}
.tabs{margin-bottom:10px;background:rgba(255,255,255,.9)}
.voices{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;margin-bottom:8px}
.vc{border:0;border-radius:14px;background:#fff;padding:6px;display:flex;flex-direction:column;align-items:center;box-shadow:0 3px 0 #d6ccfa}
.vc span{font-size:26px}.vc small{font-size:11.5px;font-weight:800;text-align:center;line-height:1.2}
.vc.on{background:#ffe9f4;box-shadow:0 3px 0 #ff9ccc,0 0 0 3px #ff5fa2}
.free .row.small{margin:6px 0}
.freekeys{height:min(230px,34vh);background:#fff;border-radius:16px;padding:6px;box-shadow:var(--shadow)}
.kit{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.kpad{border:0;border-radius:22px;aspect-ratio:1.2;background:linear-gradient(160deg,#9d84ff,#5636d6);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 6px 0 #3a1fa6;touch-action:none}
.kpad span{font-size:38px}.kpad small{font-weight:900}
.kpad.hit{animation:padhit .16s}
.kith{color:#fff;margin:16px 4px 8px;font-size:17px}
.kpad2{background:linear-gradient(160deg,#ffcf6b,#f08a24);box-shadow:0 6px 0 #b85c0c}
.kpad2 span{display:grid;place-items:center;width:52px;height:52px}.kpad2 .iimg,.kpad2 .isvg{width:52px;height:52px}
.metro{display:flex;align-items:center;gap:10px;margin-top:12px}
.metro input{flex:1}
.fam .igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:8px}
.icard{border:0;background:#f6f2ff;border-radius:16px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px}
.icard b{font-size:13px}
.ibig{display:grid;place-items:center;font-size:90px;height:110px}.ibig .isvg{width:100px;height:100px}

/* contests */
.contest{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:22px;padding:14px;color:#fff;text-align:left;margin-bottom:10px;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.contest .cic{font-size:44px}.contest .cinfo{flex:1;display:flex;flex-direction:column}.contest b{font-size:17px}.contest small{font-weight:800;opacity:.95}
.contest .cmedal{font-size:34px}
.contest.locked{filter:grayscale(.75);opacity:.75}
.poster{border-radius:20px;color:#fff;text-align:center;padding:16px;margin:-4px -4px 8px}
.poster .cic{font-size:64px}.poster h2{margin:0}
.rivals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rv{background:#f6f2ff;border-radius:16px;padding:8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.rv .rf{font-size:40px;line-height:1.1}.rv .rf .ei{width:56px;height:56px}
.rv b{font-size:13.5px}.rv small{font-size:11.5px;color:var(--muted);font-weight:700}
.rivals.mini{display:flex;justify-content:center;gap:10px;font-size:40px}
.rounds{font-weight:800;margin:0;padding-left:24px}
.rsplash{color:#fff;text-align:center;padding:40px 10px;animation:viewIn .4s}
.rsplash .big{font-size:90px}.rsplash h2{font-size:34px}.rsplash p{font-size:20px;font-weight:900}
.standings .srow{display:flex;align-items:center;gap:8px;margin:8px 0;font-weight:900}
.srow .pl{width:24px;height:24px;border-radius:50%;background:#f1edff;display:grid;place-items:center;font-size:13px}
.srow .ic{font-size:26px}.srow b{width:92px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.sbar{flex:1;height:16px;border-radius:99px;background:#f1edff;overflow:hidden}
.sbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#9d84ff,#7b5cff);transition:width 1.2s cubic-bezier(.2,.9,.3,1)}
.srow.me .sbar i{background:linear-gradient(90deg,#ff8fd1,#ffd23f)}
.srow em{font-style:normal;width:44px;text-align:right}
.srow.me{background:#fff4fa;border-radius:12px;padding:4px}
.ceremony{text-align:center}
.drumroll{font-size:22px;font-weight:900;animation:shake .4s infinite}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:16px 0 8px;min-height:220px}
.pod{display:flex;flex-direction:column;align-items:center;width:30%;transition:all .5s}
.pod.hide{opacity:0;transform:translateY(30px)}
.pod .pic{font-size:44px}.pod b{font-size:13.5px}.pod em{font-style:normal;font-weight:900;color:var(--brand-d)}
.pod .blk{width:100%;border-radius:12px 12px 0 0;display:grid;place-items:start center;padding-top:6px;font-size:30px;background:linear-gradient(180deg,#e9e2ff,#cfc2ff)}

const LESSONS=[
 // A ---- beat
 {id:'a1',u:'A',t:'심장처럼 똑같이|Steady like a heartbeat',intro:[
  {t:'음악에는 늘 똑같은 간격으로 계속되는 “박”이 있어요. 시계의 똑딱 소리처럼요!|Music has a “beat” that keeps going at the same speed, like a ticking clock!',v:{pulse:80},p:{metro:{bpm:80,beats:8}}},
  {t:'우리 심장도 콩닥콩닥 박을 가지고 있어요. 가슴에 손을 대 봐요.|Your heart has a beat too. Put your hand on your chest!',v:{emoji:'💓'}},
  {t:'똑딱 소리가 날 때마다 큰 북을 콩! 쳐요. 소리와 딱 맞게!|Each time you hear the tick, hit the big drum. Right on time!',v:{emoji:'🥁'}}],
  a:{type:'beat',bpm:76,beats:16}},
 {id:'a2',u:'A',t:'빠른 박, 느린 박|Fast beat, slow beat',intro:[
  {t:'박이 빠르게 갈 수도 있고 느리게 갈 수도 있어요. 이걸 “빠르기”라고 해요.|A beat can go fast or slow. That’s called the “tempo”.',p:{metro:{bpm:60,beats:4}}},
  {t:'이번엔 빨라요! 거북이에서 토끼로 바뀌어도 똑같은 간격을 지켜요.|Now it’s fast! From turtle to rabbit, keep the space between beats even.',v:{emoji:'🐢➡️🐇'},p:{metro:{bpm:120,beats:6}}}],
  a:{type:'beat',segs:[[64,8],[104,12]]}},
 {id:'a3',u:'A',t:'마음속 박자|The beat inside you',intro:[
  {t:'진짜 음악가는 소리가 없어도 마음속으로 박을 세요.|Real musicians keep the beat in their heads, even in silence.',v:{emoji:'🧠💓'}},
  {t:'똑딱 소리가 중간에 사라져요. 그래도 같은 빠르기로 계속 쳐요! 마지막에 소리가 돌아오면 얼마나 맞았는지 알 수 있어요.|The ticks will disappear in the middle. Keep tapping at the same speed! When they come back, you’ll see how close you stayed.',v:{emoji:'🤫'}}],
  a:{type:'beat',bpm:84,beats:24,fade:[8,20]}},
 {id:'a4',u:'A',t:'센박과 여린박|Strong and weak beats',intro:[
  {t:'박을 넷씩 묶으면 첫 번째 박이 가장 힘차요. 이걸 “센박”이라고 해요.|When beats come in groups of four, the first one is the strongest. It’s the “strong beat”.',v:{text:'💥 · · · 💥 · · ·'},p:{drum:{pattern:'accent4',bars:2,bpm:80}}},
  {t:'첫째 박은 “쿵”, 나머지 박은 “칫”! 하나 둘 셋 넷!|Beat one goes “boom”, the others go “tss”! One, two, three, four!'}],
  a:{type:'drum',pattern:'accent4',bars:6,bpm:76,lanes:['kick','hat']}},
 // B ---- pitch and keyboard
 {id:'b1',u:'B',t:'높은 소리, 낮은 소리|High and low sounds',intro:[
  {t:'새가 짹짹하는 소리는 높고, 곰이 우우하는 소리는 낮아요.|A bird’s tweet is high and a bear’s growl is low.',v:{emoji:'🐦  🐻'},p:{seq:{notes:'C6/1 C3/1',bpm:70}}},
  {t:'피아노는 오른쪽으로 갈수록 높은 소리, 왼쪽으로 갈수록 낮은 소리가 나요.|On a piano, sounds get higher to the right and lower to the left.',v:{kbd:{from:48,to:72,labels:false}},p:{seq:{notes:'C3/.5 E3/.5 G3/.5 C4/.5 E4/.5 G4/.5 C5/1',bpm:100}}}],
  a:{type:'pitch',task:'hl',count:6}},
 {id:'b2',u:'B',t:'건반 지도|The keyboard map',intro:[
  {t:'검은 건반은 2개, 3개씩 짝을 지어 있어요. 이게 건반의 지도예요!|Black keys come in groups of 2 and 3. That’s the map of the keyboard!',v:{kbd:{from:48,to:71,labels:false,dots:{49:'#ff5fa2',51:'#ff5fa2',54:'#3ec4ff',56:'#3ec4ff',58:'#3ec4ff',61:'#ff5fa2',63:'#ff5fa2',66:'#3ec4ff',68:'#3ec4ff',70:'#3ec4ff'}}}},
  {t:'검은 건반 2개 바로 왼쪽 흰 건반이 “도”예요. 3개 바로 왼쪽은 “파”예요.|The white key just left of the 2 black keys is “Do” (C). Just left of the 3 black keys is “Fa” (F).',v:{kbd:{from:48,to:71,labels:false,hi:{48:'#ff5a5f',60:'#ff5a5f',53:'#3ec46d',65:'#3ec46d'}}},p:{seq:{notes:'C4/1 F4/1 C5/1',bpm:80}}}],
  a:{type:'keys',task:'findCF',count:6}},
 {id:'b3',u:'B',t:'도레미파솔라시도|Do Re Mi Fa Sol La Ti Do',intro:[
  {t:'흰 건반은 도부터 차례로 도·레·미·파·솔·라·시예요. 그리고 다시 도!|From Do, the white keys go Do, Re, Mi, Fa, Sol, La, Ti, and then Do again!',v:{kbd:{from:60,to:72,labels:true}},p:{seq:{notes:'C4/.5 D4/.5 E4/.5 F4/.5 G4/.5 A4/.5 B4/.5 C5/1',bpm:90}}},
  {t:'영어로는 C·D·E·F·G·A·B라고도 불러요. 도 = C예요.|In letters they are C, D, E, F, G, A, B. Do = C.',v:{kbd:{from:60,to:72,labels:true,names:'letter'}}}],
  a:{type:'keys',task:'name',range:[60,72],count:8}},
 {id:'b4',u:'B',t:'첫 노래 연습|Your first song',intro:[
  {t:'도·레·미 세 음으로 “뜨거운 빵”을 쳐 봐요. 미-레-도!|Let’s play “Hot Cross Buns” with just Do, Re, Mi. Mi-Re-Do!',v:{kbd:{from:60,to:64,labels:true,hi:{60:'#ff5a5f',62:'#ff9f1c',64:'#ffd23f'}}},p:{song:'hotcross'}},
  {t:'이번엔 천천히 기다려 주는 연습이에요. 빛나는 건반을 눌러요!|This is wait-for-me practice. Press the glowing key!'}],
  a:{type:'song',song:'hotcross',step:true}},
 {id:'b5',u:'B',t:'박자에 맞춰 뜨거운 빵|Hot Cross Buns in time',intro:[
  {t:'이제 음표가 내려와요. 선에 닿을 때 딱 맞춰 눌러요!|Now the notes fall down. Press when they touch the line!',v:{emoji:'⬇️🎹'}},
  {t:'길쭉한 음표는 길게 쉬는 음이에요. 다음 음을 기다려요.|Long notes last longer. Wait for the next one.'}],
  a:{type:'song',song:'hotcross',speed:.85}},
 {id:'b6',u:'B',t:'메리의 어린 양|Mary Had a Little Lamb',intro:[
  {t:'이번 노래에는 “솔”도 나와요. 도·레·미·솔!|This song has Sol too. Do, Re, Mi, Sol!',v:{kbd:{from:60,to:67,labels:true,hi:{60:'#ff5a5f',62:'#ff9f1c',64:'#ffd23f',67:'#1fb5c9'}}},p:{song:'mary'}}],
  a:{type:'song',song:'mary',speed:.9}},
 {id:'b7',u:'B',t:'올라가요, 내려가요|Up or down?',intro:[
  {t:'소리 세 개가 계단처럼 올라가기도 하고 내려가기도 해요.|Three sounds can climb up like stairs, or go down.',v:{emoji:'📈 📉'},p:{seq:{notes:'C4/1 E4/1 G4/1 r/1 G4/1 E4/1 C4/1',bpm:100}}}],
  a:{type:'pitch',task:'contour',count:6}},
 // S ---- singing and voice
 {id:'s1',u:'S',t:'바른 자세와 숨쉬기|Posture and breathing',intro:[
  {t:'노래할 때는 등을 쭉 펴고, 어깨는 편하게, 발은 바닥에 꾹 붙여요.|To sing, stand or sit tall, relax your shoulders and keep your feet flat on the floor.',v:{emoji:'🧍✨'}},
  {t:'숨을 들이마시면 배가 풍선처럼 불룩, 내쉬면 쏙! 이게 노래하는 숨, 복식 호흡이에요.|Breathe in and your tummy puffs up like a balloon; breathe out and it goes back in. That’s a singing breath!',v:{emoji:'🎈'}},
  {t:'공이 커질 때 들이마시고, 작아질 때 “스~” 하고 길게 내쉬어요.|Breathe in as the ball grows, then let out a long “sss” as it shrinks.',v:{emoji:'🔵'}}],
  a:{type:'breath',cycles:3}},
 {id:'s2',u:'S',t:'목 풀기|Voice warm-ups',intro:[
  {t:'입술을 “부르르” 떨거나 “음~” 하고 허밍하면 목이 부드럽게 풀려요.|Lip trills (“brrr”) and humming (“mmm”) gently warm up your voice.',v:{emoji:'😗〰️'},p:{seq:{notes:'C4/1 E4/1 G4/1 E4/1 C4/2',bpm:96,v:'flute'}}},
  {t:'“아”는 입을 크게, “이”는 옆으로 쭉, “우”는 동그랗게 모아요.|For “ah” open wide, for “ee” smile wide, for “oo” make a small circle.',v:{emoji:'😮 😁 😗'}},
  {t:'이번엔 “우~” 하고 사이렌처럼 낮은 소리에서 높은 소리로 미끄러져요!|Now slide from low to high like a siren: “ooo~”!',v:{emoji:'🚨'}}],
  a:{type:'sing',task:'siren'}},
 {id:'s3',u:'S',t:'같은 소리 내기|Match the note',intro:[
  {t:'선생님 소리를 잘 듣고 똑같은 높이로 “아~” 하고 불러요.|Listen to my note, then sing “ahh” at the same height.',p:{seq:{notes:'E4/2',bpm:60,v:'flute'}}},
  {t:'분홍 점이 초록 줄에 오면 딱 맞은 거예요! 점이 위에 있으면 조금 낮게, 아래에 있으면 조금 높게 불러요.|When the pink dot sits on the green line, you’re spot on! If it’s above, sing a little lower; if it’s below, sing a little higher.',v:{emoji:'🎯'}}],
  a:{type:'sing',task:'match',count:5}},
 {id:'s4',u:'S',t:'도레미파솔 노래하기|Sing Do-Re-Mi-Fa-Sol',intro:[
  {t:'계단을 오르듯 한 음씩 올라가요. 도·레·미·파·솔!|Climb up one step at a time: Do, Re, Mi, Fa, Sol!',v:{kbd:{from:60,to:67,labels:true}},p:{seq:{notes:'C4/1 D4/1 E4/1 F4/1 G4/2',bpm:80,v:'flute'}}}],
  a:{type:'sing',task:'scale'}},
 {id:'s5',u:'S',t:'계이름으로 노래하기|Sing with note names',intro:[
  {t:'“반짝반짝 작은 별” 가락을 계이름으로 불러요. 도도솔솔 라라솔~|Sing “Twinkle Twinkle” with note names: Do Do Sol Sol La La Sol~',v:{staff:{notes:'C4/1 C4/1 G4/1 G4/1 A4/1 A4/1 G4/2',labels:true}},p:{song:'twinkle'}},
  {t:'막대가 지나갈 때 막대에 적힌 계이름으로 노래해요. 내 목소리는 분홍 선으로 보여요!|Sing the name written on each bar as it passes. Your voice shows up as a pink line!'}],
  a:{type:'sing',task:'song',song:'twinkle',len:14,bpm:80}},
 {id:'s6',u:'S',t:'목소리 건강|A healthy voice',intro:[
  {t:'목소리도 소중한 악기예요. 소리를 지르면 목이 다칠 수 있어요. 물을 자주 마셔요!|Your voice is a precious instrument. Shouting can hurt it. Drink water often!',v:{emoji:'💧🗣️'}}],
  a:{type:'quiz',bank:'voice',count:5}},
 // C ---- notes and rests
 {id:'c1',u:'C',t:'음표의 길이|How long is a note?',intro:[
  {t:'음표는 모양에 따라 길이가 달라요. 4분음표는 1박이에요.|A note’s shape tells how long it lasts. A quarter note lasts 1 beat.',v:{sym:[['q','1박|1 beat']]},p:{rhy:{p:'q q q q',bpm:80}}},
  {t:'속이 빈 2분음표는 2박, 막대가 없는 온음표는 4박이에요!|A hollow half note lasts 2 beats, and a whole note with no stem lasts 4!',v:{sym:[['h','2박|2 beats'],['w','4박|4 beats']]},p:{rhy:{p:'h h w',bpm:80}}}],
  a:{type:'quiz',bank:'values',set:['q','h','w'],count:6}},
 {id:'c2',u:'C',t:'리듬 읽기|Reading rhythms',intro:[
  {t:'악보의 리듬을 보고 북을 쳐요. 분홍 막대가 지금 칠 곳을 알려 줘요.|Read the rhythm and tap the drum. The pink bar shows where you are.',v:{rhy:'q q h'},p:{rhy:{p:'q q h',bpm:76}}},
  {t:'2분음표는 한 번 치고 2박을 기다려요. “따-안”!|For a half note, tap once and wait 2 beats: “taa-aa”!'}],
  a:{type:'read',level:1,count:4,bpm:72}},
 {id:'c3',u:'C',t:'쉼표는 쉬는 박|Rests are quiet beats',intro:[
  {t:'쉼표는 소리를 내지 않고 쉬는 박이에요. 4분쉼표는 1박 쉬어요.|A rest is a quiet beat. A quarter rest is 1 beat of silence.',v:{sym:[['qr','1박 쉼|1 beat rest'],['hr','2박 쉼|2 beats rest']]}},
  {t:'쉼표에서는 북을 치지 말고 마음속으로 “쉼” 하고 세요.|On a rest, don’t tap. Just think “rest”.',v:{rhy:'q qr q qr'},p:{rhy:{p:'q qr q qr',bpm:76}}}],
  a:{type:'read',level:2,count:4,bpm:72}},
 {id:'c4',u:'C',t:'리듬 따라 하기|Copy the rhythm',intro:[
  {t:'콩콩 선생님이 먼저 리듬을 쳐요. 잘 듣고 똑같이 따라 쳐요!|Ms. Hop plays a rhythm first. Listen, then copy it!',v:{emoji:'👂➡️🥁'},p:{rhy:{p:'q q h',bpm:80}}}],
  a:{type:'echo',level:1,count:5,bpm:80}},
 {id:'c5',u:'C',t:'8분음표 둘은 한 박|Two eighths make a beat',intro:[
  {t:'8분음표는 반 박이에요. 둘이 손을 잡으면 1박이 돼요. “따-따”!|An eighth note is half a beat. Two of them holding hands make 1 beat: “ti-ti”!',v:{sym:[['e','반 박|½ beat'],['ee','1박|1 beat']]},p:{rhy:{p:'e e e e q q',bpm:76}}}],
  a:{type:'read',level:3,count:4,bpm:70}},
 {id:'c6',u:'C',t:'리듬 따라 하기 2|Copy the rhythm 2',intro:[
  {t:'이번엔 빠른 8분음표도 나와요. 귀를 쫑긋!|Now there are quick eighth notes too. Listen closely!',p:{rhy:{p:'q e e q q',bpm:80}}}],
  a:{type:'echo',level:3,count:5,bpm:80}},
 // D ---- drums
 {id:'d1',u:'D',t:'드럼 세트 친구들|Meet the drum kit',intro:[
  {t:'발로 밟는 큰 북은 베이스 드럼이에요. “쿵!”|The big drum you play with your foot is the bass drum. “Boom!”',v:{emoji:'💥'},p:{drums:['kick','kick']}},
  {t:'스틱으로 치는 스네어 드럼은 “짝!”, 심벌즈 두 개가 붙은 하이햇은 “칫!”|The snare drum goes “crack!” and the hi-hat, two cymbals stacked together, goes “tss!”',v:{emoji:'🥁 ✨'},p:{drums:['snare','hat','hat']}}],
  a:{type:'quiz',bank:'drumkit',count:6}},
 {id:'d2',u:'D',t:'쿵-짝 쿵-짝|Boom-clap',intro:[
  {t:'1박과 3박에는 쿵, 2박과 4박에는 짝! 많은 노래가 이 박자로 움직여요.|Boom on beats 1 and 3, clap on beats 2 and 4! Tons of songs move like this.',p:{drum:{pattern:'boomclap',bars:2,bpm:84}}},
  {t:'처음 한 마디는 쿵쾅 선생님이 보여 줄게. 그다음 따라와!|I’ll play the first bar. Then you join in!'}],
  a:{type:'drum',pattern:'boomclap',bars:6,bpm:80,lanes:['kick','snare']}},
 {id:'d3',u:'D',t:'하이햇 8비트|Eight-beat rock',intro:[
  {t:'하이햇이 “칫칫칫칫” 8번, 그 위에 쿵-짝! 이게 록 드럼이야!|The hi-hat goes “tss” eight times, with boom-clap on top. That’s a rock beat!',p:{drum:{pattern:'rock',bars:2,bpm:80}}}],
  a:{type:'drum',pattern:'rock',bars:6,bpm:72}},
 {id:'d4',u:'D',t:'필인으로 마무리|Finish with a fill',intro:[
  {t:'네 마디마다 스네어를 다다다닥! 다음 부분으로 넘어가는 신호, “필인”이야.|Every fourth bar, rattle the snare! That’s a “fill”, a signal that a new part is coming.',p:{drum:{pattern:'rockfill',bars:4,bpm:80}}}],
  a:{type:'drum',pattern:'rockfill',bars:8,bpm:76}},
 {id:'d5',u:'D',t:'디스코 비트|Disco beat',intro:[
  {t:'쿵이 매 박마다! 하이햇은 박 사이에서 “칫”. 춤추고 싶어지지?|Boom on every beat, and the hi-hat goes “tss” in between. Feel like dancing?',p:{drum:{pattern:'disco',bars:2,bpm:96}}}],
  a:{type:'drum',pattern:'disco',bars:8,bpm:88}},
 // E ---- staff
 {id:'e1',u:'E',t:'오선과 높은음자리표|The staff and the treble clef',intro:[
  {t:'음악을 적는 다섯 줄을 “오선”이라고 해요. 줄은 아래부터 첫째 줄, 둘째 줄… 하고 세요.|Music is written on five lines called the “staff”. Count the lines from the bottom up.',v:{staff:{notes:[]}}},
  {t:'맨 앞의 높은음자리표는 둘째 줄이 “솔”이라고 알려 줘요. 음표가 위로 갈수록 높은 소리예요.|The treble clef at the front marks the second line as Sol (G). The higher a note sits, the higher it sounds.',v:{staff:{notes:[{m:60},{m:64},{m:67},{m:72}],labels:true}},p:{seq:{notes:'C4/1 E4/1 G4/1 C5/1',bpm:80}}}],
  a:{type:'quiz',bank:'staffbasics',count:6}},
 {id:'e2',u:'E',t:'도·레·미 찾기|Find Do, Re, Mi',intro:[
  {t:'“도”는 오선 아래 짧은 덧줄 위에 있어요. 레는 그 바로 위, 미는 첫째 줄!|Do (C) sits on a little ledger line below the staff. Re is just above it, and Mi is on the first line!',v:{staff:{notes:[{m:60},{m:62},{m:64}],labels:true}},p:{seq:{notes:'C4/1 D4/1 E4/1',bpm:80}}}],
  a:{type:'notes',range:[60,64],count:8}},
 {id:'e3',u:'E',t:'도부터 솔까지|Do up to Sol',intro:[
  {t:'줄–칸–줄–칸, 한 칸씩 올라갈 때마다 한 음씩 높아져요.|Line, space, line, space: each step up is the next note up.',v:{staff:{notes:[{m:60},{m:62},{m:64},{m:65},{m:67}],labels:true}},p:{seq:{notes:'C4/.5 D4/.5 E4/.5 F4/.5 G4/1',bpm:80}}}],
  a:{type:'notes',range:[60,67],count:10}},
 {id:'e4',u:'E',t:'반짝반짝 작은 별|Twinkle Twinkle Little Star',intro:[
  {t:'위쪽 오선에 악보가 지나가요. 악보를 보면서 쳐 봐요!|Music scrolls across the staff at the top. Read it as you play!',v:{staff:{notes:'C4/1 C4/1 G4/1 G4/1 A4/1 A4/1 G4/2',labels:true}},p:{song:'twinkle'}}],
  a:{type:'song',song:'twinkle',mode:'both',speed:.85}},
 {id:'e5',u:'E',t:'높은 도까지|All the way to high Do',intro:[
  {t:'라·시·높은 도까지 읽어 봐요. 높은 도는 셋째 칸이에요.|Now read La, Ti and high Do. High Do sits in the third space.',v:{staff:{notes:[{m:69},{m:71},{m:72}],labels:true}},p:{seq:{notes:'A4/1 B4/1 C5/2',bpm:80}}}],
  a:{type:'notes',range:[60,72],count:12}},
 {id:'e6',u:'E',t:'환희의 송가|Ode to Joy',intro:[
  {t:'베토벤 아저씨가 만든 유명한 곡이에요. 미-미-파-솔!|A famous tune by Beethoven. Mi-Mi-Fa-Sol!',v:{staff:{notes:'E4/1 E4/1 F4/1 G4/1 G4/1 F4/1 E4/1 D4/1',labels:true}},p:{song:'ode'}}],
  a:{type:'song',song:'ode',mode:'both',speed:.9}},
 {id:'e7',u:'E',t:'작은 한스|Lightly Row',intro:[
  {t:'솔-미-미, 파-레-레! 신나는 독일 동요예요.|Sol-Mi-Mi, Fa-Re-Re! A cheerful German folk song.',p:{song:'lightly'}}],
  a:{type:'song',song:'lightly',mode:'both'}},
 // F ---- bars and time signatures
 {id:'f1',u:'F',t:'마디와 박자표|Bars and time signatures',intro:[
  {t:'악보는 세로줄로 “마디”를 나눠요. 맨 앞의 박자표 4/4는 한 마디에 4분음표가 4개라는 뜻이에요.|Bar lines split music into “bars”. The time signature 4/4 means four quarter notes fit in each bar.',v:{rhy:'q q q q h h',sig:true},p:{rhy:{p:'q q q q h h',bpm:80}}}],
  a:{type:'quiz',bank:'sig',count:6}},
 {id:'f2',u:'F',t:'3박자 왈츠|Waltz in 3',intro:[
  {t:'3/4박자는 “쿵-짝-짝, 쿵-짝-짝”. 빙글빙글 춤추는 왈츠예요!|3/4 time goes “boom-tick-tick”. It’s a twirling waltz!',p:{drum:{pattern:'waltz',bars:2,bpm:96}}}],
  a:{type:'drum',pattern:'waltz',bars:8,bpm:90,lanes:['kick','hat']}},
 {id:'f3',u:'F',t:'3박자 리듬 읽기|Reading in 3',intro:[
  {t:'한 마디에 3박이에요. 하나-둘-셋, 하나-둘-셋!|Three beats in each bar. One-two-three, one-two-three!',v:{rhy:'q q q h q',sig3:true},p:{rhy:{p:'q q q h q',bpm:84,sig:3}}}],
  a:{type:'read',level:'w3',count:4,bpm:80,sig:3}},
 {id:'f4',u:'F',t:'2박자 행진곡|March in 2',intro:[
  {t:'2/4박자는 “하나-둘, 하나-둘” 씩씩하게 걷는 행진곡에 잘 어울려요.|2/4 time is “left-right, left-right”, perfect for a march.',p:{drum:{pattern:'march',bars:4,bpm:104}}}],
  a:{type:'drum',pattern:'march',bars:8,bpm:96,lanes:['kick','snare']}},
 {id:'f5',u:'F',t:'자크 형제|Frère Jacques',intro:[
  {t:'노래 끝에 낮은 “솔”이 나와요. 도 왼쪽의 솔을 찾아봐요!|There’s a low Sol near the end. Find the Sol to the left of Do!',v:{kbd:{from:55,to:69,labels:true,hi:{55:'#1fb5c9'}}},p:{song:'jacques'}}],
  a:{type:'song',song:'jacques',mode:'both'}},
 // G ---- scales and chords (with whole and half steps, major and minor)
 {id:'g1',u:'G',t:'반음과 온음|Half steps and whole steps',intro:[
  {t:'바로 옆 건반으로 가는 거리를 “반음”이라고 해요. 검은 건반도 한 칸으로 세요.|Moving to the very next key, black or white, is a “half step”.',v:{kbd:{from:60,to:67,labels:true,hi:{60:'#ff5a5f',61:'#ff5fa2'}}},p:{seq:{notes:'C4/1 C#4/1',bpm:70}}},
  {t:'반음 두 개를 합치면 “온음”이에요. 도에서 레는 온음!|Two half steps make a “whole step”. Do to Re is a whole step!',v:{kbd:{from:60,to:67,labels:true,hi:{60:'#ff5a5f',62:'#2a8df4'}}},p:{seq:{notes:'C4/1 D4/1',bpm:70}}},
  {t:'미-파와 시-도 사이에는 검은 건반이 없어요. 그래서 흰 건반끼리인데도 반음이에요!|There’s no black key between Mi–Fa or Ti–Do, so those white keys are only a half step apart!',v:{kbd:{from:60,to:72,labels:true,hi:{64:'#ffd23f',65:'#ffd23f',71:'#a25cff',72:'#a25cff'}}}}],
  a:{type:'steps',task:'name',count:8}},
 {id:'g2',u:'G',t:'반음·온음 건반 찾기|Find the step',intro:[
  {t:'이번엔 직접 찾아요. “미에서 반음 위”는? 바로 옆 파!|Now you find it. A half step up from Mi? The very next key, Fa!',v:{kbd:{from:60,to:72,labels:true,hi:{64:'#ffd23f',65:'#3ec46d'}}}}],
  a:{type:'steps',task:'find',count:8}},
 {id:'g3',u:'G',t:'장음계 만들기|Build a major scale',intro:[
  {t:'도레미파솔라시도는 “온-온-반-온-온-온-반” 순서로 올라가요. 이것을 장음계라고 해요.|Do-Re-Mi-Fa-Sol-La-Ti-Do climbs whole, whole, half, whole, whole, whole, half. That’s a major scale.',v:{kbd:{from:60,to:72,labels:true}},p:{seq:{notes:'C4/.5 D4/.5 E4/.5 F4/.5 G4/.5 A4/.5 B4/.5 C5/1',bpm:90}}},
  {t:'도에서 시작하는 장음계라서 “다장조”라고 불러요. 건반을 차례로 눌러 만들어 봐요!|Starting on Do, it’s called C major. Build it key by key!'}],
  a:{type:'scale',task:'build',key:'C'}},
 {id:'g4',u:'G',t:'장조와 단조|Major and minor',intro:[
  {t:'장조는 밝고 신나는 느낌, 단조는 슬프거나 신비로운 느낌이 나요.|Major sounds bright and happy; minor sounds sad or mysterious.',v:{emoji:'😊  😢'}},
  {t:'같은 노래를 장조와 단조로 들어 봐요. 느낌이 어떻게 다른가요?|Listen to the same tune in major, then minor. How do they feel?',p:{majmin:0}},
  {t:'라에서 시작하는 “라시도레미파솔라”는 단음계예요. 반음 자리가 달라서 느낌이 바뀌어요!|“La-Ti-Do-Re-Mi-Fa-Sol-La” starting on La is a minor scale. The half steps move, and the mood changes!',v:{kbd:{from:57,to:69,labels:true,hi:{57:'#a25cff',69:'#a25cff'}}},p:{seq:{notes:'A3/.5 B3/.5 C4/.5 D4/.5 E4/.5 F4/.5 G4/.5 A4/1',bpm:90}}}],
  a:{type:'scale',task:'majmin',count:6}},
 {id:'g5',u:'G',t:'화음이란?|What is a chord?',intro:[
  {t:'여러 음을 한꺼번에 누르면 어울리는 소리, “화음”이 돼요.|Press several notes together and they blend into a “chord”.',v:{kbd:{from:60,to:72,labels:true,hi:{60:'#2a8df4',64:'#2a8df4',67:'#2a8df4'}}},p:{chord:[60,64,67]}},
  {t:'도·미·솔! 하나 건너 하나씩 누르면 돼요.|Do, Mi, Sol! Skip one key between each.'}],
  a:{type:'chord',task:'build',chords:['C'],count:3}},
 {id:'g6',u:'G',t:'으뜸·버금딸림·딸림화음|Three main chords',intro:[
  {t:'다장조에서 도미솔은 “으뜸화음”, 파라도는 “버금딸림화음”, 솔시레는 “딸림화음”이에요.|In C major, C–E–G is the home chord (I), F–A–C is chord IV and G–B–D is chord V.',v:{kbd:{from:60,to:76,labels:true,hi:{65:'#3ec46d',69:'#3ec46d',72:'#3ec46d'}}},p:{chords:['C','F','G','C']}},
  {t:'이 세 화음만 있으면 많은 노래에 반주를 붙일 수 있어요!|With just these three chords you can play along with lots of songs!'}],
  a:{type:'chord',task:'build',chords:['C','F','G'],count:5}},
 {id:'g7',u:'G',t:'밝은 화음, 슬픈 화음|Happy chord, sad chord',intro:[
  {t:'도·미·솔은 밝은 장화음, 도·미♭·솔은 슬픈 단화음이에요. 가운데 음 하나만 반음 내려가도 느낌이 확 달라져요!|C–E–G is a bright major chord; C–E♭–G is a sad minor chord. Lowering just the middle note a half step changes the whole mood!',v:{emoji:'😊  😢'},p:{chordpair:[[60,64,67],[60,63,67]]}}],
  a:{type:'chord',task:'majmin',count:6}},
 {id:'g8',u:'G',t:'반주 쳐 보기|Play the chords',intro:[
  {t:'선생님이 멜로디를 칠게요. 여러분은 화음 버튼으로 반주를 쳐요!|I’ll play the melody. You play the chords with the chord buttons!',v:{emoji:'🎹🐻'},p:{song:'twinkle'}}],
  a:{type:'chordplay',song:'twinkle'}},
 // H ---- instruments
 {id:'h1',u:'H',t:'악기 가족|Instrument families',intro:[
  {t:'악기는 소리 내는 방법에 따라 가족이 있어요. 줄을 쓰면 현악기, 숨을 불면 관악기, 두드리면 타악기!|Instruments come in families by how they make sound: strings, wind instruments and percussion!',v:{instr:['violin','trumpet','drum','piano']}},
  {t:'관악기는 다시 나무로 시작한 목관악기와 금속으로 만든 금관악기로 나눠요.|Wind instruments split into woodwinds and brass.',v:{instr:['flute','clarinet','trumpet','tuba']}}],
  a:{type:'quiz',bank:'family',count:6}},
 {id:'h2',u:'H',t:'소리 듣고 맞히기|Guess by ear',intro:[
  {t:'눈을 감고 들어 봐요. 줄을 뜯는 소리, 부는 소리, 두드리는 소리가 다 달라요.|Close your eyes and listen. Plucked, blown and struck sounds are all different.',p:{voices:['pluck','flute','mallet']}}],
  a:{type:'listen',task:'family',count:6}},
 {id:'h3',u:'H',t:'우리 악기|Korean instruments',intro:[
  {t:'우리나라에도 멋진 악기가 많아요. 가야금, 해금, 대금, 장구를 만나 봐요!|Korea has wonderful instruments too: gayageum, haegeum, daegeum and janggu!',v:{instr:['gayageum','haegeum','daegeum','janggu']}},
  {t:'꽹과리·징·장구·북 네 악기로 하는 신나는 공연을 “사물놀이”라고 해요.|A lively show with four instruments, kkwaenggwari, jing, janggu and buk, is called “samulnori”.',v:{instr:['kkwaenggwari','jing','janggu','buk']}}],
  a:{type:'quiz',bank:'korean',count:6}},
 {id:'h4',u:'H',t:'오케스트라|The orchestra',intro:[
  {t:'여러 악기 가족이 모여 함께 연주하는 큰 악단이 오케스트라예요. 지휘자가 빠르기와 셈여림을 알려 줘요.|An orchestra is a big group of instrument families playing together. The conductor shows how fast and how loud.',v:{emoji:'🎻🎺🥁🎼'}}],
  a:{type:'quiz',bank:'orch',count:5}},
 // I ---- dynamics, tempo, symbols
 {id:'i1',u:'I',t:'셈여림|Loud and soft',intro:[
  {t:'p(피아노)는 여리게, f(포르테)는 세게! 소리의 크기도 악보에 적어요.|p (piano) means soft and f (forte) means loud. Music tells you how loud to play!',v:{sym:[['p','여리게|soft'],['f','세게|loud']]},p:{dyn:true}},
  {t:'“<” 모양은 점점 세게(크레셴도), “>” 모양은 점점 여리게(디크레셴도)예요.|“<” means get louder (crescendo) and “>” means get softer (decrescendo).',v:{sym:[['cresc','점점 세게|louder'],['decresc','점점 여리게|softer']]}}],
  a:{type:'quiz',bank:'dyn',count:6}},
 {id:'i2',u:'I',t:'빠르기말|Tempo words',intro:[
  {t:'알레그로는 빠르게, 모데라토는 보통 빠르게, 안단테는 조금 느리게, 아다지오는 느리게!|Allegro is fast, Moderato is medium, Andante is a walking pace and Adagio is slow!',v:{emoji:'🐇 🚶 🐢'},p:{tempo:true}}],
  a:{type:'quiz',bank:'tempo',count:6}},
 {id:'i3',u:'I',t:'악보 기호|Music symbols',intro:[
  {t:'도돌이표를 만나면 앞으로 돌아가서 한 번 더! 끝세로줄은 곡이 끝났다는 뜻이에요.|A repeat sign says “go back and play again!” A final bar line means the end.',v:{sym:[['repeat','도돌이표|repeat'],['final','끝세로줄|the end']]}},
  {t:'♯(올림표)는 반음 올리고, ♭(내림표)는 반음 내려요.|A sharp (♯) raises a note a half step and a flat (♭) lowers it.',v:{sym:[['sharp','반음 올림|half step up'],['flat','반음 내림|half step down']]}}],
  a:{type:'quiz',bank:'symbols',count:6}},

function audioCtx(){

  const len=Math.floor(AC.sampleRate*.8),ir=AC.createBuffer(2,len,AC.sampleRate);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,4.5)}

// unlock audio on the first touch (browsers block sound until then)
['pointerdown','keydown','touchend'].forEach(ev=>document.addEventListener(ev,()=>{audioCtx()},{capture:true,passive:true}));

// ---------------------------------------------------------------- clock: the time the listener is hearing right now
// Scheduled sounds are heard later than they are scheduled (output latency); getOutputTimestamp tells us what is coming out of the speaker.
// On many phones and tablets the audio clock moves in uneven jumps, which made falling notes and beat flashes shake.
// So the games read performance.now() plus an offset that slowly follows the audio clock: smooth, and still in step with the sound.
const CLK={off:0,n:0,far:0};
function audioOff(){const now=performance.now(),fb=AC.currentTime-(AC.outputLatency||AC.baseLatency||0);let ts=null;try{ts=AC.getOutputTimestamp&&AC.getOutputTimestamp()}catch(e){}

 if(ts&&ts.performanceTime>0&&ts.contextTime>0){const h=ts.contextTime+(now-ts.performanceTime)/1000;if(Math.abs(h-fb)<.5)return h-now/1000}

function heardTime(perf=performance.now()){

  else if(Math.abs(d)>.1){if(++CLK.far>8){CLK.off+=d;CLK.n=1;CLK.far=0}}

// file bytes can be fetched before audio is allowed; decoding waits for the audio context
function fetchBytes(url){return SMP_BYTES[url]||(SMP_BYTES[url]=fetch(url).then(r=>{if(!r.ok)throw new Error(r.status);return r.arrayBuffer()}).catch(e=>{delete SMP_BYTES[url];throw e}))}

const HELD={};
function playSample(S,v,m,t,dur,vol,out){
 while(m<S.lo-7)m+=12;while(m>S.hi+7)m-=12;
 let k=S.f[0],bd=99;for(const n of S.f){const d=Math.abs(m-S.r[n]);if(d<bd){bd=d;k=n}}

 if(whole)return `<ellipse cx="${x}" cy="${y}" rx="7.4" ry="4.9" fill="none" stroke="${col}" stroke-width="2.4" transform="rotate(-18 ${x} ${y})"/><ellipse cx="${x}" cy="${y}" rx="7.4" ry="4.9" fill="none" stroke="${col}" stroke-width="1.2"/>`;
 return hollow?`<ellipse cx="${x}" cy="${y}" rx="6.3" ry="4.5" fill="#fff" stroke="${col}" stroke-width="2.2" transform="rotate(-22 ${x} ${y})"/>`:`<ellipse cx="${x}" cy="${y}" rx="6.3" ry="4.5" fill="${col}" transform="rotate(-22 ${x} ${y})"/>`}
const flagSVG=(x,y,col,dbl)=>`<path d="M${x} ${y}c1 7 9 9 8 18c4-9-5-12-8-18z" fill="${col}"/>`+(dbl?`<path d="M${x} ${y+7}c1 7 9 9 8 18c4-9-5-12-8-18z" fill="${col}"/>`:'');
function restSVG(k,x,y,col='#1d2a4a'){
 // y is the middle of the staff
 switch(k){
  case 'q':return `<path d="M${x-3} ${y-14}l6 7-4 5 5 6c-5-2-8 1-4 6c-7-3-6-8-1-8l-5-6 4-5z" fill="${col}" stroke="${col}" stroke-width="1.4" stroke-linejoin="round"/>`;
  case 'h':return `<rect x="${x-7}" y="${y-5}" width="14" height="5" fill="${col}"/>`;
  case 'w':return `<rect x="${x-7}" y="${y-10}" width="14" height="5" fill="${col}"/>`;
  case 'e':return `<circle cx="${x-2}" cy="${y-6}" r="2.8" fill="${col}"/><path d="M${x-2} ${y-4}q4 1 6-3l-5 14" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round"/>`;
  case 's':return `<circle cx="${x-2}" cy="${y-8}" r="2.4" fill="${col}"/><circle cx="${x-4}" cy="${y-1}" r="2.4" fill="${col}"/><path d="M${x-2} ${y-6}q4 1 6-3l-6 18M${x-4} ${y+1}q4 1 6-3" fill="none" stroke="${col}" stroke-width="1.8" stroke-linecap="round"/>`;
 }return ''}
const sharpSVG=(x,y,col)=>`<text x="${x}" y="${y+6}" font-size="17" font-weight="700" text-anchor="middle" fill="${col}">♯</text>`;

// ---------------------------------------------------------------- staff with pitched notes
// notes: [{m, d (beats, optional), col, label}] spread evenly; returns an SVG string
function staffSVG(notes=[],{w=320,pad=0,clef=true,sig=null,labels=false,col='#1d2a4a',bars=[],x0=null,hideNames=false,focus=-1}={}){
 const top=34,bot=top+40,h=130,start=x0!=null?x0:(clef?46:18)+(sig?22:0),span=w-start-16,n=Math.max(1,notes.length),dx=span/n;
 let s=`<svg class="staff" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">`;
 for(let i=0;i<5;i++)s+=`<line x1="${pad+6}" y1="${top+i*10}" x2="${w-6}" y2="${top+i*10}" stroke="#7d88a6" stroke-width="1.3"/>`;
 if(clef)s+=clefSVG(pad+12,top,1,col);
 if(sig)s+=`<text x="${pad+(clef?50:20)}" y="${top+18}" font-size="21" font-weight="900" text-anchor="middle" fill="${col}" font-family="Georgia,serif">${sig[0]}</text><text x="${pad+(clef?50:20)}" y="${top+38}" font-size="21" font-weight="900" text-anchor="middle" fill="${col}" font-family="Georgia,serif">${sig[1]}</text>`;
 bars.forEach(i=>{const x=start+dx*i-dx*.15;s+=`<line x1="${x}" y1="${top}" x2="${x}" y2="${bot}" stroke="#7d88a6" stroke-width="1.6"/>`});
 notes.forEach((nt,i)=>{const x=start+dx*(i+.5),c=nt.col||col;
  if(nt.rest){s+=restSVG(nt.rest,x,top+20,c);return}
  s+=`<g class="sn" data-i="${i}">`;
  const st=stepOf(nt.m),y=bot-(st-2)*5,d=nt.d||1;
  // ledger lines below (C4 and lower) and above (A5 and higher)
  for(let k=0;k>=st;k-=2)s+=`<line x1="${x-11}" y1="${bot-(k-2)*5}" x2="${x+11}" y2="${bot-(k-2)*5}" stroke="#7d88a6" stroke-width="1.4"/>`;
  for(let k=12;k<=st;k+=2)s+=`<line x1="${x-11}" y1="${bot-(k-2)*5}" x2="${x+11}" y2="${bot-(k-2)*5}" stroke="#7d88a6" stroke-width="1.4"/>`;
  if(i===focus)s+=`<circle cx="${x}" cy="${y}" r="14" fill="#ffe680" opacity=".75"/>`;
  if(sharpOf(nt.m))s+=sharpSVG(x-15,y,c);
  s+=headSVG(x,y,{hollow:d>=2,whole:d>=4,col:c});
  if(d<4){const up=st<6,sx=up?x+5.6:x-5.6,sy2=up?y-34:y+34;s+=`<line x1="${sx}" y1="${y+(up?-1:1)}" x2="${sx}" y2="${sy2}" stroke="${c}" stroke-width="1.8"/>`;if(d<1&&up)s+=flagSVG(sx,sy2,c,d<.5)}
  if(d===1.5||d===3)s+=`<circle cx="${x+11}" cy="${y-(st%2===0?3:0)}" r="2.2" fill="${c}"/>`;
  if(labels&&!hideNames)s+=`<text x="${x}" y="${h-6}" font-size="13" font-weight="900" text-anchor="middle" fill="${c}">${esc(nt.label||noteName(nt.m))}</text>`;
  s+='</g>';
 });
 return s+'</svg>'}

// ---------------------------------------------------------------- rhythms (one-line percussion staff)
const RTOK={w:[4,0],h:[2,0],q:[1,0],e:[.5,0],s:[.25,0],dq:[1.5,0],dh:[3,0],de:[.75,0],wr:[4,1],hr:[2,1],qr:[1,1],er:[.5,1],sr:[.25,1]};
function parseRhythm(str){let t=0;return str.trim().split(/\s+/).filter(x=>x!=='|').map(k=>{const [d,r]=RTOK[k]||[1,0],o={k,d,rest:!!r,t};t+=d;return o})}
const rhythmBeats=str=>parseRhythm(str).reduce((a,b)=>a+b.d,0);
// draws the rhythm; cols[i] colours token i; returns {svg, xs}
function rhythmSVG(str,{w=320,sig=4,cols=[],showSig=false,count=false,cursor=null}={}){
 const toks=parseRhythm(str),total=toks.reduce((a,b)=>a+b.d,0),bars=Math.max(1,Math.ceil(total/sig-1e-9)),h=count?92:78,line=46;
 const x0=showSig?40:16,span=w-x0-14;
 // spacing grows with duration but never too tight
 const unit=span/(total+bars*.15),xs=[];let s=`<svg class="rhy" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg"><line x1="8" y1="${line}" x2="${w-8}" y2="${line}" stroke="#9aa5c2" stroke-width="2"/>`;
 if(showSig)s+=`<text x="22" y="${line-4}" font-size="19" font-weight="900" text-anchor="middle" fill="#1d2a4a" font-family="Georgia,serif">${sig}</text><text x="22" y="${line+16}" font-size="19" font-weight="900" text-anchor="middle" fill="#1d2a4a" font-family="Georgia,serif">4</text>`;
 let x=x0+unit*.4,barAt=sig;
 toks.forEach((tk,i)=>{xs.push(x);x+=tk.d*unit;if(Math.abs(tk.t+tk.d-barAt)<1e-6&&i<toks.length-1){s+=`<line x1="${x-unit*.3}" y1="${line-16}" x2="${x-unit*.3}" y2="${line+16}" stroke="#9aa5c2" stroke-width="2"/>`;x+=unit*.15;barAt+=sig}});
 s+=`<line x1="${w-12}" y1="${line-16}" x2="${w-12}" y2="${line+16}" stroke="#9aa5c2" stroke-width="2"/><line x1="${w-8}" y1="${line-16}" x2="${w-8}" y2="${line+16}" stroke="#9aa5c2" stroke-width="3.5"/>`;
 // beam groups: eighths/sixteenths inside one beat
 const groups=[];let cur=null;
 toks.forEach((tk,i)=>{const short=!tk.rest&&tk.d<1&&tk.k!=='de';const beat=Math.floor(tk.t+1e-6);if(short&&cur&&cur.beat===beat){cur.idx.push(i)}else{if(cur&&cur.idx.length>1)groups.push(cur);cur=short?{beat,idx:[i]}:null}});
 if(cur&&cur.idx.length>1)groups.push(cur);
 const inGroup=new Set(groups.flatMap(g=>g.idx));
 toks.forEach((tk,i)=>{const c=cols[i]||'#1d2a4a',xx=xs[i];
  if(tk.rest){s+=restSVG(tk.k[0],xx,line+(tk.k==='wr'?4:tk.k==='hr'?0:0),c);return}
  s+=headSVG(xx,line,{hollow:tk.d>=2,whole:tk.d>=4,col:c});
  if(tk.d<4)s+=`<line x1="${xx+5.6}" y1="${line-1}" x2="${xx+5.6}" y2="${line-32}" stroke="${c}" stroke-width="1.8"/>`;
  if(tk.d<1&&!inGroup.has(i))s+=flagSVG(xx+5.6,line-32,c,tk.d<.5);
  if(tk.k==='dq'||tk.k==='dh'||tk.k==='de')s+=`<circle cx="${xx+11}" cy="${line-3}" r="2.3" fill="${c}"/>`});
 groups.forEach(g=>{const a=xs[g.idx[0]]+5.6,b=xs[g.idx[g.idx.length-1]]+5.6;s+=`<rect x="${a-.9}" y="${line-34}" width="${b-a+1.8}" height="4.6" fill="#1d2a4a"/>`;
  // second beam for sixteenths
  g.idx.forEach((i,j)=>{if(toks[i].d<=.25){const nx=g.idx[j+1]!=null&&toks[g.idx[j+1]].d<=.25?xs[g.idx[j+1]]+5.6:null,pv=g.idx[j-1]!=null&&toks[g.idx[j-1]].d<=.25;
   if(nx!=null)s+=`<rect x="${xs[i]+4.7}" y="${line-27}" width="${nx-xs[i]-5.6+1.8}" height="4.6" fill="#1d2a4a"/>`;else if(!pv)s+=`<rect x="${xs[i]+4.7}" y="${line-27}" width="8" height="4.6" fill="#1d2a4a"/>`}})});
 if(count){toks.forEach((tk,i)=>{if(Math.abs(tk.t-Math.round(tk.t))<1e-6)s+=`<text x="${xs[i]}" y="${h-4}" font-size="13" font-weight="900" text-anchor="middle" fill="#7d88a6">${(Math.round(tk.t)%sig)+1}</text>`;else if(Math.abs(tk.t%1-.5)<1e-6)s+=`<text x="${xs[i]}" y="${h-4}" font-size="12" font-weight="900" text-anchor="middle" fill="#b0b8cf">&amp;</text>`})}
 if(cursor!=null)s+=`<line class="rcur" x1="${cursor}" y1="8" x2="${cursor}" y2="${line+22}" stroke="#ff5fa2" stroke-width="3" stroke-linecap="round"/>`;
 return {svg:s+'</svg>',xs,unit,x0}}

// ---------------------------------------------------------------- single symbols for quizzes and lesson cards
function symbolSVG(k,{size=90,col='#1d2a4a'}={}){
 const box=(inner,w=60,h=80)=>`<svg class="sym" viewBox="0 0 ${w} ${h}" width="${size*w/80}" height="${size*h/80}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
 const note=(d,dot,beam)=>{let s=headSVG(24,58,{hollow:d>=2,whole:d>=4,col});if(d<4)s+=`<line x1="29.6" y1="57" x2="29.6" y2="20" stroke="${col}" stroke-width="2"/>`;if(d<1)s+=flagSVG(29.6,20,col,d<.5);if(dot)s+=`<circle cx="38" cy="55" r="2.6" fill="${col}"/>`;return box(s)};
 switch(k){
  case 'w':return note(4);case 'h':return note(2);case 'q':return note(1);case 'e':return note(.5);case 's':return note(.25);case 'dh':return note(2,1);case 'dq':return note(1,1);
  case 'ee':return box(headSVG(14,58,{col})+headSVG(44,58,{col})+`<line x1="19.6" y1="57" x2="19.6" y2="22" stroke="${col}" stroke-width="2"/><line x1="49.6" y1="57" x2="49.6" y2="22" stroke="${col}" stroke-width="2"/><rect x="18.7" y="20" width="31.8" height="5" fill="${col}"/>`);
  case 'wr':case 'hr':case 'qr':case 'er':case 'sr':return box(`<line x1="6" y1="${k==='wr'?36:k==='hr'?44:40}" x2="54" y2="${k==='wr'?36:k==='hr'?44:40}" stroke="#c3cbe0" stroke-width="1.5"/>`+restSVG(k[0],30,44,col));
  case 'clef':return box(clefSVG(18,18,1,col)+[0,1,2,3,4].map(i=>`<line x1="4" y1="${18+i*10}" x2="56" y2="${18+i*10}" stroke="#c3cbe0" stroke-width="1.2"/>`).join(''),60,90);
  case 'sharp':case 'flat':case 'natural':return box(`<text x="30" y="58" font-size="54" text-anchor="middle" fill="${col}">${{sharp:'♯',flat:'♭',natural:'♮'}[k]}</text>`);
  case 'repeat':return box(`${[0,1,2,3,4].map(i=>`<line x1="4" y1="${20+i*10}" x2="56" y2="${20+i*10}" stroke="#c3cbe0" stroke-width="1.2"/>`).join('')}<circle cx="30" cy="35" r="3" fill="${col}"/><circle cx="30" cy="45" r="3" fill="${col}"/><rect x="37" y="20" width="3" height="40" fill="${col}"/><rect x="44" y="20" width="7" height="40" fill="${col}"/>`);
  case 'final':return box(`${[0,1,2,3,4].map(i=>`<line x1="4" y1="${20+i*10}" x2="50" y2="${20+i*10}" stroke="#c3cbe0" stroke-width="1.2"/>`).join('')}<rect x="38" y="20" width="3" height="40" fill="${col}"/><rect x="45" y="20" width="7" height="40" fill="${col}"/>`);
  case 'bar':return box(`${[0,1,2,3,4].map(i=>`<line x1="4" y1="${20+i*10}" x2="56" y2="${20+i*10}" stroke="#c3cbe0" stroke-width="1.2"/>`).join('')}<rect x="29" y="20" width="2.5" height="40" fill="${col}"/>`);
  case 'cresc':return box(`<path d="M6 40L54 26M6 40L54 54" stroke="${col}" stroke-width="3" fill="none" stroke-linecap="round"/>`);
  case 'decresc':return box(`<path d="M6 26L54 40M6 54L54 40" stroke="${col}" stroke-width="3" fill="none" stroke-linecap="round"/>`);
  case 'fermata':return box(`<path d="M8 50a22 22 0 0 1 44 0" fill="none" stroke="${col}" stroke-width="4"/><circle cx="30" cy="44" r="4" fill="${col}"/>`);
  default:{// dynamics: p, pp, mp, mf, f, ff
   return box(`<text x="30" y="56" font-size="${k.length>1?34:44}" font-style="italic" font-weight="900" text-anchor="middle" fill="${col}" font-family="Georgia,'Times New Roman',serif">${esc(k)}</text>`)}
 }}

// ---------------------------------------------------------------- a picture of a keyboard (not playable)
function keyboardSVG({from=60,to=72,hi={},labels=true,w=320,dots={},showBlackNames=false,showBlack=false,names=null}={}){showBlackNames=showBlackNames||showBlack;
 const whites=[];for(let m=from;m<=to;m++)if(!isBlack(m))whites.push(m);
 const kw=w/whites.length,h=kw*3.6>130?130:kw*3.6;let s=`<svg class="kbd" viewBox="0 0 ${w} ${h+4}" xmlns="http://www.w3.org/2000/svg">`;
 whites.forEach((m,i)=>{const c=hi[m]||'#fff';s+=`<rect data-m="${m}" data-c="${c}" x="${i*kw+1}" y="1" width="${kw-2}" height="${h}" rx="5" fill="${c}" stroke="#9aa5c2" stroke-width="1.5"/>`;
  if(dots[m])s+=`<circle cx="${i*kw+kw/2}" cy="${h-34}" r="7" fill="${dots[m]}"/>`;
  if(labels)s+=`<text x="${i*kw+kw/2}" y="${h-10}" font-size="${Math.min(14,kw*.42)}" font-weight="900" text-anchor="middle" fill="${hi[m]&&hi[m]!=='#fff'?'#fff':'#5f6b8f'}">${esc(noteName(m,names).split(' ')[0])}</text>`});
 for(let m=from;m<=to;m++){if(!isBlack(m))continue;const i=whites.indexOf(m-1);if(i<0)continue;const x=(i+1)*kw-kw*.31,c=hi[m]||'#26304d';
  s+=`<rect data-m="${m}" data-c="${c}" x="${x}" y="1" width="${kw*.62}" height="${h*.6}" rx="3" fill="${c}"/>`;if(dots[m])s+=`<circle cx="${x+kw*.31}" cy="${h*.6-12}" r="5.5" fill="${dots[m]}"/>`;
  if(showBlackNames)s+=`<text x="${x+kw*.31}" y="${h*.6-6}" font-size="${Math.min(9,kw*.28)}" font-weight="900" text-anchor="middle" fill="#fff">${esc(noteName(m,names).split(' ')[0])}</text>`}
 return s+'</svg>'}
</script>
<script>
// ================================================================ activities: beat tapping, rhythm copy/reading, falling-note piano/drums/chords, quizzes and keyboard tasks
// Every activity renders into a host element and calls done(result) once; ACT.stop() cancels it.
const WIN={1:{p:.085,g:.15,o:.22},2:{p:.07,g:.125,o:.19},3:{p:.055,g:.105,o:.16}};
const JW={p:1,g:.8,o:.5,m:0};
const JTXT={p:'완벽!|PERFECT!',g:'좋아요!|GREAT!',o:'괜찮아요|GOOD',m:'놓쳤어요|MISS'};
const JCOL={p:'#ffd23f',g:'#3ee07a',o:'#5cc8ff',m:'#ff7b8a'};
const TIMING={calib:0};
const LOOK={skin:'block',stage:'night',keys:'classic'};
const PRAISE_SHORT=['좋아요!|Nice!','최고!|Awesome!','멋져요!|Great!','잘했어요!|Well done!','와우!|Wow!','딱 맞았어요!|Spot on!','천재인가요?|Are you a genius?','손가락이 춤춰요!|Your fingers are dancing!','귀가 정말 좋아요!|What great ears!','박자 짱!|Beat master!','반짝반짝 빛나요!|You’re shining!','계속 이렇게!|Keep it up!'];
const ENCOURAGE=['괜찮아요, 다음 거!|That’s okay, next one!','아깝다! 거의 맞았어요!|So close!','천천히 해도 돼요.|Take your time.','틀려도 배우는 중이에요!|Mistakes help you learn!','다음엔 꼭 맞힐 거예요!|You’ll get the next one!'];
const COMBO_TXT={10:'10콤보! 박자를 탔어요!|10 combo! You’ve got the beat!',20:'20콤보! 손가락이 춤춰요!|20 combo! Fingers dancing!',30:'30콤보! 진짜 음악가 같아요!|30 combo! A real musician!',50:'50콤보! 믿을 수 없어요!|50 combo! Unbelievable!',80:'80콤보!! 전설이에요!|80 combo!! Legendary!'};
const judgeOf=(dt,w)=>{const a=Math.abs(dt);return a<=w.p?'p':a<=w.g?'g':a<=w.o?'o':null};
const starsOf=acc=>acc>=.88?3:acc>=.7?2:acc>=.45?1:0;
let ACT=null;
function stopActivity(){const a=ACT;ACT=null;if(a){try{a.stop()}catch(e){console.error(e)}}}
function tally(){return {p:0,g:0,o:0,m:0,extra:0,combo:0,maxCombo:0,n:0,offs:[],
 add(j,dt){this[j]++;this.n++;if(j==='m')this.combo=0;else{this.combo++;if(this.combo>this.maxCombo)this.maxCombo=this.combo;if(dt!=null)this.offs.push(dt)}},
 acc(){const tot=this.n+this.extra*.5;return tot?(this.p*JW.p+this.g*JW.g+this.o*JW.o)/tot:0},
 result(extra={}){const acc=this.acc(),avg=this.offs.length?this.offs.reduce((a,b)=>a+b,0)/this.offs.length:0;
  return {acc,stars:starsOf(acc),p:this.p,g:this.g,o:this.o,m:this.m,n:this.n,extra:this.extra,maxCombo:this.maxCombo,avgOff:avg,timed:true,...extra}}}}
async function ensureAudio(){const a=audioCtx();if(a&&a.state!=='running'){try{await Promise.race([a.resume(),new Promise(r=>setTimeout(r,450))])}catch(e){}}
 if(a&&!(SETS.piano.buf&&SETS.perc.buf))await want(['piano','perc'],1500);return audioReady()}
const makeClock=useAC=>useAC?(perf=performance.now())=>heardTime(perf):(perf=performance.now())=>perf/1000;
// when the first sound of a game plays: a moment from now, but never already past on the audio clock (slow wireless speakers)
const startAt=(clk,ok,lead)=>ok&&AC?Math.max(clk()+lead,AC.currentTime+.1):clk()+lead;
// keys that count as a tap in the beat and rhythm games
const isTapKey=e=>!e.repeat&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&e.key!=='Escape'&&e.key!=='Tab'&&(e.key.length===1||e.key==='Enter');
function bubble(host,txt,cls=''){const b=host.querySelector('.tbub');if(!b)return;b.textContent=T(txt);b.className='tbub show '+cls;clearTimeout(b._t);b._t=setTimeout(()=>b.classList.remove('show'),1600)}
const tface=t=>`<span class="tface" style="background:${TEACHERS[t].bg}">${pic(TEACHERS[t].img,TEACHERS[t].icon)}</span>`;
function countdownHTML(){return `<div class="cdown hidden"></div>`}
function showCount(host,txt){const c=host.querySelector('.cdown');if(!c)return;c.textContent=txt;c.classList.remove('hidden','pop');void c.offsetWidth;c.classList.add('pop')}
const hideCount=host=>{const c=host.querySelector('.cdown');if(c)c.classList.add('hidden')};
function simJ(acc){const r=Math.random();return r<acc*.8?'p':r<acc*.95?'g':r<acc*1.05?'o':'m'}

// ================================================================ 1. beat tapping (steady beat, tempo changes, inner pulse)
function runBeat(spec,host,opt){
 const segs=spec.segs||[[spec.bpm,spec.beats]],sig=spec.sig||4,w=WIN[opt.tier||1],fade=spec.fade||null;
 const beats=[];let t=0;segs.forEach(([b,n])=>{const spb=60/b;for(let i=0;i<n;i++){beats.push({t,spb,j:null});t+=spb}});
 const lead=sig,spb0=60/segs[0][0],quiet=i=>fade&&i>=fade[0]&&i<fade[1];
 host.innerHTML=`<div class="beatlab">${countdownHTML()}
  <div class="tline">${tface(opt.teacher||'hop')}<div class="tbub"></div></div>
  <div class="bl-msg">${T('똑딱 소리에 맞춰 큰 북을 쳐요!|Hit the big drum with each tick!')}</div>
  <div class="bl-stage"><div class="bl-ring"></div><button class="bl-pad" type="button" aria-label="${esc(T('북|Drum'))}"><span class="bl-hop">${pic(TEACHERS.hop.img,'🦘')}</span><b class="bl-num"></b></button></div>
  <div class="bl-meter"><span>◀ ${T('빨라요|Early')}</span><div class="bl-bar"><em></em><i></i></div><span>${T('늦어요|Late')} ▶</span></div>
  <div class="bl-judge"></div>

<script>

  const loop=()=>{if(stopped)return;const now=performance.now()/1000-start;if(now>total){finish();return}

   if(seg.k!==lastK){lastK=seg.k;msg.textContent=T(TXT[seg.k]);if(seg.k==='in')speak(T('들이마셔요|Breathe in'));if(seg.k==='out')speak(T('스~|Sss'));const ci=Math.floor(seg.t/(13*spb));cyc.forEach((x,i)=>x.classList.toggle('on',i<=ci))}
   const sc=seg.k==='in'?.45+.55*f:seg.k==='hold'?1:seg.k==='out'?1-.55*f:.45;ball.style.transform=`scale(${sc.toFixed(3)})`;ball.className='br-ball '+seg.k;
   n.textContent=seg.k==='rest'?'':String(Math.min(Math.floor(f*seg.d/spb)+1,Math.round(seg.d/spb)));
   if(useMic){const r=micRead();const lv=clamp(r.rms/.08,0,1);if(meter)meter.style.width=(lv*100)+'%';if(seg.k==='out'&&now>=seg.t+.5){outT++;if(r.rms>.015)outOn++}}
   raf=requestAnimationFrame(loop)};raf=requestAnimationFrame(loop)})}

// ================================================================ singing games: siren slide, pitch match, scale and a solfège song
function runSing(spec,host,opt){
 const task=spec.task,teacher=opt.teacher||'lala',$q=s=>host.querySelector(s);let stopped=false,raf=0,ended=false,bs=null,useMic=false;want(['flute'],0);
 const stop=()=>{stopped=true;cancelAnimationFrame(raf);killBus(bs);micOff()};
 const finish=r=>{if(ended)return;ended=true;stop();opt.done(r)};
 ACT={stop,sim(acc=.9){finish({acc,stars:starsOf(acc),kind:'sing'})}};
 micGate(host,teacher,on=>{if(stopped)return;useMic=on;bs=bus(1);
  host.innerHTML=`<div class="sing"><div class="tline">${tface(teacher)}<div class="tbub"></div></div><div class="qdots"></div>
   <div class="sg-q"></div><div class="sg-stage"><canvas class="sg-cv"></canvas><div class="sg-tip"></div></div><div class="sg-ctl"></div></div>`;
  if(task==='match'||task==='scale')pitchRounds();else glideOrSong()});
 // ---------------- hold one note at a time
 function pitchRounds(){const pool=spec.notes||[60,62,64,65,67,69],seq=task==='scale'?[60,62,64,65,67]:Array.from({length:spec.count||5},()=>pick(pool));
  let i=0,sc=0,hold=0,best=0,phase='listen',t0=0,lastHint='';const need=task==='scale'?.6:1,limit=7;
  $q('.qdots').innerHTML=seq.map(()=>'<i></i>').join('');const dots=[...host.querySelectorAll('.qdots i')];
  const cv=$q('.sg-cv'),ctx=cv.getContext('2d'),tip=$q('.sg-tip'),ctl=$q('.sg-ctl'),trail=[];
  const say=()=>{const m=seq[i];$q('.sg-q').innerHTML=`${T(task==='scale'?'계이름을 부르며 따라 해요|Sing the note name':'들은 소리를 “아~” 하고 따라 불러요|Sing back the note on “ahh”')}<br><b class="big" style="color:${colorOf(m)}">${esc(noteName(m,'solfege'))} ${LANG==='en'?'('+PC[m%12]+')':''}</b>`};
  const listen=()=>{phase='listen';hold=0;best=0;trail.length=0;say();if(!useMic){const m=seq[i];$q('.sg-stage').innerHTML=`<div class="vkbd" style="margin:auto">${keyboardSVG({from:60,to:72,labels:true,hi:{[m]:colorOf(m)},w:340})}</div>`}play('flute',seq[i],AC?AC.currentTime+.1:0,1.3,.8,bs);tip.textContent='👂 '+T('잘 들어요…|Listen…');
   ctl.innerHTML=`<button class="btn ghost small again" type="button">🔊 ${T('다시 듣기|Hear it again')}</button>${useMic?'':`<button class="btn green small sang" type="button">🎤 ${T('불렀어요!|I sang it!')}</button>`}`;
   ctl.querySelector('.again').addEventListener('click',()=>play('flute',seq[i],AC?AC.currentTime+.05:0,1.3,.8,bs));
   const sang=ctl.querySelector('.sang');if(sang)sang.addEventListener('click',()=>{sc+=.75;dots[i].className='half';nextNote()});
   setTimeout(()=>{if(stopped||phase!=='listen')return;phase='sing';t0=performance.now();tip.textContent=useMic?'🎤 '+T('이제 불러요! “아~”|Now sing! “Ahh~”'):'🎤 '+T('따라 불러 봐요!|Sing it back!')},1500)};
  const nextNote=()=>{i++;if(i>=seq.length){if(useMic){const acc=sc/seq.length;finish({acc,stars:starsOf(acc),kind:'sing'})}else selfRate(host,finish);return}setTimeout(listen,700)};
  const draw=(c)=>{const W=cv.clientWidth,H=cv.clientHeight,dpr=Math.min(2,devicePixelRatio||1);if(cv.width!==W*dpr){cv.width=W*dpr;cv.height=H*dpr}ctx.setTransform(dpr,0,0,dpr,0,0);
   ctx.fillStyle='#fffaf0';ctx.fillRect(0,0,W,H);const mid=H/2,sc2=H/2/500;
   // target band (±50 cents) and helper lines
   ctx.fillStyle='rgba(62,196,109,.22)';ctx.fillRect(0,mid-50*sc2,W,100*sc2);ctx.strokeStyle='#3ec46d';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,mid);ctx.lineTo(W,mid);ctx.stroke();
   ctx.fillStyle='#9aa5c2';ctx.font='900 13px system-ui';ctx.textAlign='left';ctx.fillText('⬆ '+T('높아요|High'),8,18);ctx.fillText('⬇ '+T('낮아요|Low'),8,H-8);
   ctx.strokeStyle='#ff5fa2';ctx.lineWidth=3;ctx.beginPath();trail.forEach((p,k)=>{const x=W*.15+k*(W*.7/90),y=mid-clamp(p,-480,480)*sc2;k?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();
   if(c!=null){const x=W*.15+trail.length*(W*.7/90),y=mid-clamp(c,-480,480)*sc2;ctx.fillStyle=Math.abs(c)<=50?'#3ec46d':'#ff5fa2';ctx.beginPath();ctx.arc(Math.min(x,W*.86),y,11,0,7);ctx.fill()}
   const pr=Math.min(1,hold/need);ctx.fillStyle='#3ec46d';ctx.fillRect(W-28,10+(H-20)*(1-pr),18,(H-20)*pr);ctx.strokeStyle='#3ec46d';ctx.lineWidth=2;ctx.strokeRect(W-28,10,18,H-20)};
  let lastT=performance.now();
  const loop=()=>{if(stopped)return;const now=performance.now(),dt=(now-lastT)/1000;lastT=now;let c=null;
   if(phase==='sing'&&useMic){const r=micRead();c=centsTo(r.f,seq[i]);if(c!=null){trail.push(c);if(trail.length>90)trail.shift();
     if(Math.abs(c)<=50){hold+=dt;tip.textContent='🎯 '+T('딱 맞아요! 그대로 쭉~|Right on! Hold it~')}else{hold=Math.max(0,hold-dt*.5);const h=c>0?'⬇️ '+T('조금 낮게!|A little lower!'):'⬆️ '+T('조금 높게!|A little higher!');if(h!==lastHint){lastHint=h}tip.textContent=h}}
    else tip.textContent='🎤 '+T('“아~” 소리를 내 봐요|Sing “ahh~”');
    best=Math.max(best,hold);
    if(hold>=need){phase='done';sc+=1;dots[i].className='ok';SFX.good();bubble(host,pick(PRAISE_SHORT));nextNote()}
    else if((now-t0)/1000>limit){phase='done';const part=clamp(best/need,0,.6);sc+=part;dots[i].className=part>.3?'half':'no';bubble(host,pick(ENCOURAGE));nextNote()}}
   if(useMic)draw(c);raf=requestAnimationFrame(loop)};
  listen();raf=requestAnimationFrame(loop)}
 // ---------------- follow a sliding line (siren) or sing a song in solfège on a scrolling pitch chart
 function glideOrSong(){const cv=$q('.sg-cv'),ctx=cv.getContext('2d'),tip=$q('.sg-tip'),ctl=$q('.sg-ctl');let start=0,on=0,tot=0,trace=[];
  let notes,dur,lo,hi,bpm=spec.bpm||84;
  if(task==='siren'){notes=null;dur=8;lo=55;hi=74;$q('.sg-q').textContent=T('“우~” 하고 사이렌처럼 선을 따라 올라갔다 내려와요!|Go “ooo~” like a siren: follow the line up and back down!')}
  else{const s=SONGS[spec.song||'twinkle'],spb=60/bpm,mel=parseMelody(s.m).slice(0,spec.len||14);notes=mel.filter(n=>!n.rest).map(n=>({t:n.b*spb,d:n.d*spb,m:n.m}));dur=Math.max(...notes.map(n=>n.t+n.d))+.5;lo=Math.min(...notes.map(n=>n.m))-3;hi=Math.max(...notes.map(n=>n.m))+3;
   $q('.sg-q').textContent=T('막대에 적힌 계이름으로 노래해요! 내 목소리 선을 막대에 올려요.|Sing the note names on the bars! Keep your voice line on the bars.')}
  const guide=t=>task==='siren'?(t<1?55:t<4?55+(t-1)/3*17:t<7?72-(t-4)/3*17:55):(()=>{const n=notes.find(n=>t>=n.t&&t<n.t+n.d);return n?n.m:null})();
  const W=()=>cv.clientWidth,H=()=>cv.clientHeight,yOf=m=>H()-12-(m-lo)/(hi-lo)*(H()-24);
  ctl.innerHTML=`<button class="btn green go" type="button">▶ ${T('시작|Start')}</button>`;
  const draw=now=>{const w=W(),h=H(),dpr=Math.min(2,devicePixelRatio||1);if(cv.width!==w*dpr){cv.width=w*dpr;cv.height=h*dpr}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#fffaf0';ctx.fillRect(0,0,w,h);
   const px=w*.25,pps=w/4;ctx.fillStyle='rgba(255,95,162,.15)';ctx.fillRect(px-2,0,4,h);
   if(task==='siren'){ctx.strokeStyle='#3ec46d';ctx.lineWidth=14;ctx.lineCap='round';ctx.globalAlpha=.35;ctx.beginPath();for(let t=Math.max(0,now-1);t<now+3;t+=.05){const x=px+(t-now)*pps,y=yOf(guide(t));t===Math.max(0,now-1)?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke();ctx.globalAlpha=1}
   else notes.forEach(n=>{const x=px+(n.t-now)*pps,x2=x+n.d*pps-4;if(x2<0||x>w)return;ctx.fillStyle=colorOf(n.m);ctx.globalAlpha=.85;ctx.beginPath();ctx.roundRect?ctx.roundRect(x,yOf(n.m)-10,x2-x,20,8):ctx.rect(x,yOf(n.m)-10,x2-x,20);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.font='900 12px system-ui';ctx.textAlign='left';ctx.fillText(noteName(n.m,'solfege'),x+5,yOf(n.m)+4)});
   ctx.strokeStyle='#ff5fa2';ctx.lineWidth=3;ctx.beginPath();let first=true;trace.forEach(p=>{const x=px+(p.t-now)*pps;if(x<0||p.m==null){first=true;return}const y=yOf(p.m);first?ctx.moveTo(x,y):ctx.lineTo(x,y);first=false});ctx.stroke()};
  const loop=()=>{if(stopped)return;const now=performance.now()/1000-start;if(now>dur){const acc=useMic?(tot?clamp(on/tot/.8,0,1):0):1;if(useMic)finish({acc,stars:starsOf(acc),kind:'sing'});else{tip.textContent='';selfRate(host,finish)}return}
   const g=now>=0?guide(now):null;let m=null;
   if(useMic&&now>=0){const r=micRead();if(r.f>0){const raw=69+12*Math.log2(r.f/440);
     // fold the sung pitch to the octave of the guide so a child singing an octave up still lines up
     m=g!=null?raw+12*Math.round((g-raw)/12):raw}
    trace.push({t:now,m});if(trace.length>400)trace.shift();
    if(g!=null){tot++;if(m!=null&&Math.abs(m-g)<=(task==='siren'?1.2:.75))on++;tip.textContent=m==null?'🎤 '+T('소리를 내 봐요!|Let me hear you!'):Math.abs(m-g)<=.75?'🎯 '+T('좋아요!|Nice!'):m>g?'⬇️ '+T('조금 낮게|A bit lower'):'⬆️ '+T('조금 높게|A bit higher')}}
   draw(now);raf=requestAnimationFrame(loop)};
  ctl.querySelector('.go').addEventListener('click',async()=>{ctl.innerHTML='';await ensureAudio();await want(['flute'],1500);start=performance.now()/1000+1.2;const t0=AC?AC.currentTime+1.2:0;
   if(task==='siren'){for(let i=0;i<4;i++)drum('click',t0-1.2+i*.3,.6,bs);/* a soft guide glide */const o=AC&&SND.on?AC.createOscillator():null;if(o){const g2=AC.createGain();o.type='sine';g2.gain.value=0;o.connect(g2);g2.connect(bs);o.frequency.setValueAtTime(hz(55),t0);o.frequency.setValueAtTime(hz(55),t0+1);o.frequency.linearRampToValueAtTime(hz(72),t0+4);o.frequency.linearRampToValueAtTime(hz(55),t0+7);g2.gain.setValueAtTime(0,t0);g2.gain.linearRampToValueAtTime(.08,t0+.3);g2.gain.setValueAtTime(.08,t0+7.3);g2.gain.linearRampToValueAtTime(0,t0+7.8);o.start(t0);o.stop(t0+8)}}
   else{const spb=60/bpm;for(let i=0;i<4;i++)drum(i?'click':'accent',t0-4*spb+i*spb,.6,bs);notes.forEach(n=>play('flute',n.m,t0+n.t,n.d*.95,.3,bs));const nb=Math.ceil(dur/spb);for(let i=0;i<nb;i++)drum('click',t0+i*spb,.25,bs)}
   raf=requestAnimationFrame(loop)});
  draw(-1)}
}
</script>
<script>
// ================================================================ Little Music Academy
// Short lessons with six teachers, falling-note piano and drums, rhythm and singing games, daily practice with streaks,
// contests against rivals, a sticker book, a shop and several players per device.

// ---------------------------------------------------------------- helpers
const $=id=>document.getElementById(id);
const num=n=>Number(n).toLocaleString(LANG==='en'?'en-US':'ko-KR');
const dayKey=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const daysSince=k=>{if(!k)return 999;const [y,m,d]=k.split('-').map(Number);return Math.round((new Date(dayKey())-new Date(y,m-1,d))/864e5)};
const pic=(src,emoji)=>src?`<img class="ei" src="${src}" data-emoji="${esc(emoji)}" alt="" draggable="false">`:esc(emoji);
document.addEventListener('error',e=>{const t=e.target;if(!t||t.tagName!=='IMG')return;if(t.dataset.fb!==undefined){const w=document.createElement('span');w.innerHTML=icHTML(t.dataset.fb);t.replaceWith(...w.childNodes);return}if(t.dataset.emoji!==undefined)t.replaceWith(document.createTextNode(t.dataset.emoji))},true);
const COIN='🪙';
const COPYRIGHT=()=>`<footer class="copy">© 2026 Dongsun Moon. ${L('모든 권리 보유.','All rights reserved.')}<br>${L('노래 가락은 저작권이 끝난 전래 동요와 클래식 곡을 새로 편곡했어요. 악기 소리는 퍼블릭 도메인(CC0)으로 공개된 실제 악기 녹음(Versilian Studios VCSL·VSCO 2 CE, Freesound bletort)을 다듬어 썼어요. 그림과 캐릭터는 이 게임을 위해 만들었어요.','Melodies are public-domain folk songs and classical pieces, newly arranged. Instrument sounds are real recordings released into the public domain (CC0) by Versilian Studios (VCSL, VSCO 2 CE) and bletort on Freesound. Art and characters were made for this game.')}</footer>`;
function sparkle(el){if(!el)return;const r=el.getBoundingClientRect();for(let i=0;i<8;i++){const s=document.createElement('i');s.className='spk';s.textContent=pick(['✨','⭐','🎵','💫']);s.style.left=(r.left+r.width*Math.random())+'px';s.style.top=(r.top+r.height*Math.random())+'px';$('fx').appendChild(s);setTimeout(()=>s.remove(),900)}}

// ---------------------------------------------------------------- save: several players on one device
const SAVE_KEY='musicAcademy.v1';
const freshP=()=>({name:L('음악 친구','Music friend'),av:'🧒',xp:0,lvl:1,coins:120,earned:0,lessons:{},songs:{},drums:{},contests:{},stickers:[],ach:[],how:{},
 daily:{day:'',tasks:[],done:[],chest:false},streak:{n:0,best:0,last:'',shields:1},days:{},stats:{taps:0,perfect:0,plays:0,maxCombo:0,sings:0,secs:0},
 owned:['skin-block','stage-night','keys-classic'],equip:{skin:'skin-block',stage:'stage-night',keys:'keys-classic'},intro:false,fails:{},created:dayKey()});
const mergeP=d=>{const f=freshP();if(!d||typeof d!=='object')return f;return {...f,...d,streak:{...f.streak,...d.streak},stats:{...f.stats,...d.stats},equip:{...f.equip,...d.equip},daily:{...f.daily,...d.daily}}};
function loadRoot(){let r=null;try{r=JSON.parse(localStorage.getItem(SAVE_KEY)||'null')}catch(e){}
 if(!r||!Array.isArray(r.P)||!r.P.length)r={v:1,cur:0,P:[freshP()],opt:{}};
 r.opt={sound:true,voice:true,calib:0,...r.opt};r.P=r.P.map(mergeP);r.cur=clamp(r.cur||0,0,r.P.length-1);return r}
let ROOT=loadRoot(),S=ROOT.P[ROOT.cur];
// the player picked on the main page decides the name and face
if(MGP.me){S.name=MGP.me.name;S.av=MGP.me.av;S.faceSet=true}
const switchPlayer=()=>{if(MGP.me)location.href='index.html?lang='+LANG;else go('who')};
const save=()=>{ROOT.P[ROOT.cur]=S;try{localStorage.setItem(SAVE_KEY,JSON.stringify(ROOT))}catch(e){}};
function applyOpts(){SND.on=ROOT.opt.sound;TIMING.calib=(ROOT.opt.calib||0)/1000;OPT_NAMES=()=>ROOT.opt.names||(LANG==='en'?'letter':'solfege');
 LOOK.skin=S.equip.skin.replace('skin-','');LOOK.stage=S.equip.stage.replace('stage-','');LOOK.keys=S.equip.keys.replace('keys-','')}

// ---------------------------------------------------------------- progress
const lessonIdx=id=>LESSONS.findIndex(l=>l.id===id);
const lessonDone=id=>!!(S.lessons[id]&&(S.lessons[id].s>=1||S.lessons[id].pass));
const lessonOpen=i=>i===0||lessonDone(LESSONS[i-1].id);
const nextLesson=()=>LESSONS.find((l,i)=>lessonOpen(i)&&!lessonDone(l.id))||null;
const doneCount=()=>LESSONS.filter(l=>lessonDone(l.id)).length;
const starTotal=()=>Object.values(S.lessons).reduce((a,b)=>a+(b.s||0),0);
const SONG_UNLOCK={hotcross:'b4',mary:'b6',clair:'b6',twinkle:'e4',ode:'e6',lightly:'e7',jacques:'f5',oldmac:'f5',london:'i4',oldman:'i4',jingle:'i5',yankee:'j4',furelise:'j4'};
const DRUM_UNLOCK={accent4:'a4',boomclap:'d2',rock:'d3',rockfill:'d4',disco:'d5',waltz:'f2',march:'f4',funk:'j2'};
const songOpen=id=>lessonDone(SONG_UNLOCK[id]);
const drumOpen=id=>lessonDone(DRUM_UNLOCK[id]);
const contestOpen=c=>lessonDone(c.after);
const unitOf=l=>UNITS.find(u=>u.id===l.u);
const teacherOf=l=>unitOf(l).teacher;
const titleOf=lvl=>{let t=TITLES[0];for(const x of TITLES)if(lvl>=x[0])t=x;return {icon:t[1],name:T(t[2])}};
const xpNeed=l=>60+l*40;

// ---------------------------------------------------------------- voice (teachers speak every instruction)
let voices=[];
const NOVELTY=/albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|deranged|hysterical|grandma|grandpa|eddy|flo\b|reed|rocko|sandy|shelley/i;
function loadVoices(){try{voices=speechSynthesis.getVoices().filter(v=>(v.lang||'').toLowerCase().startsWith(LANG)&&!NOVELTY.test(v.name))}catch(e){voices=[]}}
if('speechSynthesis' in window){loadVoices();try{speechSynthesis.addEventListener('voiceschanged',loadVoices)}catch(e){}}
const bestVoice=()=>voices.find(v=>/google|yuna|sora|samantha|ava|allison|natural|premium|enhanced|siri/i.test(v.name))||voices[0]||null;
// read music words the way people say them: 4/4 → “4분의 4”, p(피아노) → “피아노”, no emoji or symbols
function speakable(t){t=String(t);
 t=t.replace(/\b(pp|p|mp|mf|f|ff)\s?\(([^)]+)\)/g,'$2').replace(/\(([A-G][♯♭#b]?)\)/g,'').replace(/(\d)\/(\d)/g,L('$2분의 $1','$1 $2')).replace(/“[<>]”\s?/g,'')
  .replace(/♯/g,L(' 샵',' sharp')).replace(/♭/g,L(' 플랫',' flat')).replace(/[·–]/g,' ').replace(/~+/g,'').replace(/W-W-H-W-W-W-H|W-H-W-W-H-W-W/g,'');
 return t.replace(/\p{Extended_Pictographic}|‍|️|[①②③④⭕❌♩♪♫♬]/gu,'').replace(/\s+/g,' ').trim()}
let pendingSay=null,saySeq=0;
document.addEventListener('pointerdown',()=>{const p=pendingSay;pendingSay=null;if(!p)return;setTimeout(()=>speak(p.text,p.o),300)},{capture:true,once:true});
function speak(text,o={}){const end=o.onend||null;
 if(!ROOT.opt.voice||!('speechSynthesis' in window)||!text){if(end)setTimeout(end,250);return}
 saySeq++;const seq=saySeq;if(navigator.userActivation&&!navigator.userActivation.hasBeenActive){pendingSay={text,o};if(end)setTimeout(end,250);return}
 try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(speakable(text));const v=bestVoice();if(v)u.voice=v;u.lang=LANG==='en'?'en-US':'ko-KR';u.rate=1;u.pitch=1.12;
  let fired=false;const fire=()=>{if(fired||seq!==saySeq)return;fired=true;if(end)end()};u.onend=fire;u.onerror=fire;setTimeout(fire,Math.min(14000,600+speakable(text).length*95));speechSynthesis.speak(u)}catch(e){if(end)end()}}
const stopVoice=()=>{saySeq++;try{speechSynthesis.cancel()}catch(e){}};

// ---------------------------------------------------------------- HUD, modals, toasts, effects
function updateHud(){const t=titleOf(S.lvl);$('lvlNum').textContent=S.lvl;$('lvlName').innerHTML=`${esc(S.name)} <small>${t.icon} ${esc(t.name)}</small>`;$('xpFill').style.width=Math.min(100,100*S.xp/xpNeed(S.lvl))+'%';
 $('coinNum').textContent=num(S.coins);$('streakNum').textContent=S.streak.n;$('streakPill').classList.toggle('lit',S.streak.last===dayKey());$('avaBtn').textContent=S.av}
function toast(html){const t=document.createElement('div');t.className='toast';t.innerHTML=html;$('toasts').appendChild(t);setTimeout(()=>t.classList.add('out'),2300);setTimeout(()=>t.remove(),2700)}
let MQ=[],CUR=null;
function modal(html,o={}){MQ.push({html,...o});if(!CUR)nextModal()}

// any finished practice counts for the streak; a rest-day pass covers one missed day
function practiced(){const today=dayKey();S.days[today]=(S.days[today]||0)+1;const keys=Object.keys(S.days).sort();while(keys.length>70)delete S.days[keys.shift()];
 if(S.streak.last===today){save();return null}
 const gap=daysSince(S.streak.last);let usedShield=false;
 if(gap===1)S.streak.n++;else if(gap===2&&S.streak.shields>0){S.streak.shields--;S.streak.n++;usedShield=true}else S.streak.n=1;
 S.streak.last=today;S.streak.best=Math.max(S.streak.best,S.streak.n);if(S.streak.n%7===0)S.streak.shields=Math.min(2,S.streak.shields+1);save();updateHud();
 const n=S.streak.n,ms=[3,7,14,21,30,50,100].includes(n);
 setTimeout(()=>{if(ms){const st=giveSticker();grant({coins:n*10});modal(`<div class="streakup"><div class="flame">🔥</div><h2>${L(`${n}일 연속 연습!`,`${n}-day streak!`)}</h2><p>${L('매일 조금씩 연습하는 게 진짜 실력의 비밀이에요!','A little practice every day is the real secret!')}</p><div class="rewards"><span>${COIN} +${n*10}</span>${st?`<span class="stk">${st}</span>`:''}</div></div><div class="row"><button class="btn gold" data-act="close" type="button">${L('최고!','Awesome!')}</button></div>`,{cls:'pop',onOpen:()=>{SFX.fanfare();celebrate();speak(L(`${n}일 연속 연습! 정말 대단해요!`,`${n} days in a row! You’re amazing!`))}})}
  else toast(`🔥 ${L(`${n}일째 연습!`,`Day ${n} of practice!`)}${usedShield?' · 🛡️ '+L('쉬는 날 카드를 썼어요','Rest-day pass used'):''}`)},400);
 return n}
