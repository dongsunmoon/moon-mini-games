function openLesson(id){const re=()=>{if(VIEW==='course'){courseTick();renderCourse()}};MiniLesson.open(chL(id),{onDone:re,onClose:re})}
const STEP_GO={ls:['📖','수업 듣기','Watch'],pz:['🧩','퍼즐 풀기','Solve'],dr:['🏁','드릴 하기','Play'],my:['📜','복습하기','Review'],pow:['⚔️','대국하기','Play'],sp:['🥊','연습 대국','Practice'],boss:['⚔️','도전!','Fight!']};
function stepCard(c,s,i,cur){const p=stepProg(c,s),ok=doneAt(c,i),now=i===cur,b=BOTS[c.bi],fr=p.pow?clamp((p.n-600)/(p.of-600),0,1):clamp(p.n/p.of,0,1);
 let more='';
 if(s.k==='ls'){const nx=s.ids.find(id=>!chSeen(id));more=`<div class="cqchips">${s.ids.map(id=>`<button type="button" class="mlx-chip ${chSeen(id)?'seen':''}" data-cls="${id}">${chSeen(id)?'✅':'▶'} ${esc(tx(CH_LS[id].title))}</button>`).join('')}</div>${nx&&!ok?`<p class="cqhook">💬 ${esc(tx(CH_LS[nx].hook||CH_LS[nx].key[0]))}</p>`:''}`}
 else if(s.k==='dr')more=`<div class="cqchips">${s.ids.map(id=>{const d=DRILL(id);return d?`<button type="button" class="mlx-chip ${drOk(id)?'seen':''}" data-cdr="${id}">${drOk(id)?'⭐':'▶'} ${esc(tx(d.title))}</button>`:''}).join('')}</div>`;
 else if(s.k==='pz'&&!ok)more=`<p class="cqhook">🧩 ${L(`지금 내 퍼즐 점수는 ${S.rating}점이에요. 내 점수에 맞는 문제부터 나오고, ${s.min}점이 넘는 문제를 풀면 칸이 차요.`,`Your puzzle score is ${S.rating}. Puzzles start near your score; each one rated ${s.min}+ fills the bar.`)}</p>`;
 else if(s.k==='my'&&!ok)more=`<p class="cqhook">📜 ${L(`내 퍼즐 ${S.myPz.length}개 · 오늘 복습 ${myDue().length}개. 대국을 돌아보면 실수가 퍼즐이 돼요.`,`${S.myPz.length} puzzles · ${myDue().length} due today. Review a game and its mistakes become puzzles.`)}</p>`;
 else if(s.k==='pow'&&!ok)more=`<p class="cqhook">💪 ${L('대국에서 이기면 올라요. 강한 상대를 이길수록 많이 올라요.','It goes up when you win games, more for stronger opponents.')}</p>`;
 else if(s.k==='sp'){const sp=c.sp,r=S.spar[sp.id]||{w:0,d:0,l:0};more=`<p class="cqhook">${sp.icon} ${esc(sp.name)} · 💪 ${bossPow(sp)} · ${L(`${r.w}승 ${r.d}무 ${r.l}패`,`${r.w}W ${r.d}D ${r.l}L`)}<br>${sparOpen(sp)?`“${esc(sp.hi)}”`:esc(sparLockText(sp))}</p>`}
 else if(s.k==='boss')more=`<p class="cqhook">${b.icon} 💪 ${bossPow(b)} · “${esc(b.hi)}”</p>`;
 const go_=STEP_GO[s.k],cnt=p.pow?`${num(p.n)} / ${num(p.of)}`:`${Math.min(p.n,p.of)} / ${p.of}`;
 const btn=ok&&s.k!=='boss'&&s.k!=='sp'?`<span class="cqok" aria-label="${L('완료','Done')}">✅</span>`:`<button class="btn small ${s.k==='boss'?'red':now?'green':'ghost'}" type="button" data-cgo="${i}">${go_[0]} ${ok&&s.k==='boss'?L('또 도전','Again'):L(go_[1],go_[2])}</button>`;
 return `<div class="card cqstep ${ok?'ok':''} ${now?'now':''}">${now?`<span class="cqnow">${pic(COACHES[S.equip.coach].img,COACHES[S.equip.coach].icon)} ${L('지금 여기!','You are here!')}</span>`:''}
  <div class="cqtop"><span class="cqn">${ok?'✓':i+1}</span><span class="cqic">${s.icon}</span><div class="tx"><b>${esc(tx(s.t))}</b><small>${esc(tx(s.g))}</small></div>${btn}</div>
  <div class="cqbar"><div class="mbar"><i style="width:${Math.round(fr*100)}%"></i></div><small>${cnt}</small></div>${more}</div>`}
function renderCourse(){
 const c=COURSES.find(x=>x.id===CQ)||COURSES[0],b=BOTS[c.bi],cur=courseCurD(c),n=courseNumD(c),won=(S.botWins[c.boss]||0)>0;
 $('v-course').innerHTML=`<h2 class="section-title">🧭 ${L('보스 정복 코스','Boss quest')}</h2>
 <div class="tabs cqtabs">${COURSES.map(x=>{const bb=BOTS[x.bi];return `<button type="button" data-cqt="${x.id}" aria-pressed="${x.id===c.id}"><span>${bb.icon} ${esc(bb.name)}</span><small>${courseNumD(x)}/${x.steps.length}</small></button>`}).join('')}</div>
 <div class="card cqhead"><span class="pt">${pic(b.img,b.icon)}</span><div class="tx"><b>${L(`${b.name} 정복 코스`,`Road to ${b.name}`)}</b><small>💪 ${L('보스 힘','Boss power')} ${num(bossPow(b))} · ${L('내 체스 힘','My power')} ${num(powShow(S.grow.r))}</small>
  <div class="mbar"><i style="width:${Math.round(n/c.steps.length*100)}%"></i></div><small>${won?`🏆 ${L('이미 이겼어요! 코스를 하면 더 강해져요.','Already beaten! The course still makes you stronger.')}`:L(`${c.steps.length}단계 중 ${n}단계 완료`,`${n} of ${c.steps.length} steps done`)}</small></div></div>
 <p class="gwlead">💡 ${L('단계는 추천이에요. 보스는 언제든 도전할 수 있어요!','Steps are tips, not locks. You can fight the boss any time!')}</p>
 <div class="cqlist">${c.steps.map((s,i)=>stepCard(c,s,i,cur)).join('')}</div>`}
$('v-course').addEventListener('click',e=>{
 const t=e.target.closest('[data-cqt]'),g=e.target.closest('[data-cgo]'),l=e.target.closest('[data-cls]'),d=e.target.closest('[data-cdr]'),c=COURSES.find(x=>x.id===CQ)||COURSES[0];
 if(t){SFX.click();CQ=t.dataset.cqt;renderCourse();return}
 if(l){SFX.click();openLesson(l.dataset.cls);return}
 if(d){SFX.click();startDrill(d.dataset.cdr,'course');return}
 if(g){SFX.click();courseGo(c,+g.dataset.cgo)}
});
function courseGo(c,i){const s=c.steps[i];if(!s)return;
 if(s.k==='ls')openLesson(s.ids.find(x=>!chSeen(x))||s.ids[0]);
 else if(s.k==='pz')coursePuzzle(c,i);
 else if(s.k==='dr')startDrill(s.ids.find(x=>!drOk(x))||s.ids[0],'course');
 else if(s.k==='my'){const due=myDue();if(due.length){startMine(due[0].id,'course');return}
  modal(`<div style="font-size:60px">📜</div><h2>${L('오늘 복습할 퍼즐이 없어요','No puzzles due today')}</h2><p>${L('내 퍼즐은 내 대국에서 생겨요. 대국을 두고 ‘대국 돌아보기’를 하면 실수가 퍼즐이 되고, 다음 날부터 복습할 수 있어요.','Your puzzles come from your own games. Play a game and tap “Review game”: its mistakes become puzzles you can review from the next day.')}</p>
   <div class="row"><button class="btn ghost" type="button" data-act="pz">🧩 ${L('내 퍼즐','My puzzles')}</button><button class="btn green" type="button" data-act="spar">${sparOpen(c.sp)?`${c.sp.icon} ${L('연습 대국','Practice game')}`:esc(sparLockText(c.sp))}</button></div>`,{acts:{pz:()=>()=>{growTab='pz';growBack='course';go('grow')},spar:()=>()=>startSpar(SPARS.indexOf(c.sp),'course')}})}
 else if(s.k==='pow')modal(`<div style="font-size:60px">💪</div><h2>${L('체스 힘 키우기','Grow your chess power')}</h2><p>${L(`지금 ${num(powShow(S.grow.r))}이에요. 대국에서 이기면 올라가요. 연습 상대와 보스 모두 돼요.`,`It is ${num(powShow(S.grow.r))} now. Winning games makes it grow: practice partners and bosses both count.`)}</p>
   <div class="row"><button class="btn ghost" type="button" data-act="grow">📈 ${L('나의 성장','My growth')}</button><button class="btn green" type="button" data-act="spar">${sparOpen(c.sp)?`${c.sp.icon} ${L('연습 대국','Practice game')}`:esc(sparLockText(c.sp))}</button></div>`,{acts:{grow:()=>()=>{growTab='power';growBack='course';go('grow')},spar:()=>()=>startSpar(SPARS.indexOf(c.sp),'course')}});
 else if(s.k==='sp')startSpar(SPARS.indexOf(c.sp),'course');
 else courseBoss(c)}
// the next puzzle for a puzzle step: the easiest unsolved one in its themes from just under the child's score (so a child
// below the step's rating climbs toward it), one of the three nearest for variety
function coursePuzzle(c,i){const s=c.steps[i],floor=Math.max(0,Math.min(s.min,rungOf(S.rating-150)));
 const cand=s.th.map(th=>ladNext(th,floor)).filter(x=>x!=null).sort((a,b)=>PUZ[a].rating-PUZ[b].rating);
 if(!cand.length){toast('🏆 '+L('이 단계의 퍼즐을 모두 풀었어요!','You solved every puzzle for this step!'));return}
 const k=cand[rnd(Math.min(3,cand.length))];
 thIntro(PUZ[k].theme,()=>startPuzzle(k,'ladder',{th:PUZ[k].theme,src:{c:c.id,i},back:'course'}))}
// the boss: through the adventure when it is that land's boss and not beaten there yet, else as an AI battle
function courseBoss(c){if(!botUnlocked(c.bi)){toast('🔒 '+L(`${josa(BOTS[c.bi-1].name,'을','를')} 먼저 이겨요!`,`Beat ${BOTS[c.bi-1].name} first!`));return}
 if(c.ch>=0&&bossUnlocked(c.ch)&&!S.bossWins.includes(c.ch)){bossIntro(c.ch);return}
 const col=S.color===-1?(Math.random()<.5?WHITE:BLACK):S.color;startBattle(c.bi,col,{back:'course'})}
// next to the boss on the battle screen: the course and its sparring partner
function courseCard(c){const n=courseNumD(c),cur=courseCurD(c),s=cur>=0?c.steps[cur]:null,sp=c.sp,b=BOTS[c.bi];
 return `<div class="bot cqcard"><div class="tx"><b>🧭 ${L(`${b.name} 정복 코스`,`Road to ${b.name}`)} <span class="cqcnt">${n}/${c.steps.length}</span></b><small>${s?`${L('다음','Next')}: ${cur+1}. ${esc(tx(s.t))}`:L('준비 끝! 도전해요','All set! Go for it')}</small><span class="cqdots" aria-hidden="true">${c.steps.map((x,i)=>`<i class="${doneAt(c,i)?'on':''}"></i>`).join('')}</span></div>
  <div class="cqbtns"><button class="btn small green" type="button" data-cq="${c.id}">🧭 ${L('코스','Course')}</button><button class="btn small ghost" type="button" data-spar="${SPARS.indexOf(sp)}">${sparOpen(sp)?`🥊 ${esc(sp.name)} · 💪${bossPow(sp)}`:esc(sparLockText(sp))}</button></div></div>`}
// the home banner: where the child is on the road to the next top boss
function courseBanner(){const c=courseNow();if(!c)return '';const b=BOTS[c.bi],i=courseCurD(c),s=i>=0?c.steps[i]:null;
 return `<button class="resume cqban" type="button" data-go="course"><span class="ic">${pic(b.img,b.icon)}</span><span class="cqbt"><b>🧭 ${L(`${b.name} 정복 코스`,`Road to ${b.name}`)}</b><small class="sub">${s?`${L('다음','Next')}: ${i+1}. ${esc(tx(s.t))}`:L('준비 끝! 보스에게 도전해요','All set! Challenge the boss')}</small></span><span class="gdot">${courseNumD(c)}/${c.steps.length}</span></button>`}

 else list=Object.entries(COACHES).map(([id,c])=>{const own=S.owned.coach.includes(id);return `<div class="item">${own?`<span class="own">✓</span>`:''}<div class="pv">${pic(c.img,c.icon)}</div><b>${esc(c.name)}</b><small>${esc(c.say)} ${L('퍼즐을 함께 풀어요','Solves puzzles with you')}</small>${buyBtn('coach',id,c.price,own,S.equip.coach===id)}</div>`}).join('');
 $('v-shop').innerHTML=`<h2 class="section-title">🛒 ${L('상점','Shop')} <small>${COIN} ${num(S.coins)}</small></h2>${safeNote('info','코인은 게임 속 놀이 돈이에요. 진짜 돈은 하나도 쓰지 않아요.','Coins are pretend game money. Nothing here costs real money.','shopnote')}<div class="tabs">${tabs.map(([k,t])=>`<button type="button" data-tab="${k}" aria-pressed="${shopTab===k}">${t}</button>`).join('')}</div><div class="items">${list}</div>`;

 if(b){

 // each switch is the whole row: one big tap target with its own spoken name
 const sw=(id,on,icon,label)=>`<button class="row" type="button" role="switch" aria-checked="${on}" aria-label="${label}" data-act="${id}"><span>${icon} ${label}</span><span class="switch ${on?'on':''}" aria-hidden="true"></span></button>`;
 const flip=(b,on)=>{b.setAttribute('aria-checked',on);b.querySelector('.switch').classList.toggle('on',on)};

 modal(`<h2>⚙️ ${L('설정','Settings')}</h2><div class="settings">${sw('snd',S.sound,'🔊',L('효과음','Sound effects'))}${sw('voice',S.voice,'🗣️',L('코치 목소리','Coach voice'))}${sw('shield',S.shieldOn,'🛡️',L('실수 방패 자동 사용','Use the shield automatically'))}

  <button class="row danger" type="button" data-act="reset"><span>🗑️ ${L('이 게임 기록 지우기','Erase this game’s progress')}</span><b aria-hidden="true">›</b></button></div>
  <p class="credit">${L('체스 퍼즐은 Lichess 공개 퍼즐 데이터베이스(CC0, 자유 이용)에서 골랐어요. 이 게임은 Lichess와 관계없는 독립 게임이에요. 체스판·기물 그림, 캐릭터, 소리, 컴퓨터 상대는 이 게임을 위해 새로 만들었어요.','Puzzles come from the Lichess open puzzle database (CC0, free to use). This is an independent game, not affiliated with or endorsed by Lichess. The board, pieces, characters, sounds and computer opponent were made for this game.')}</p>
  <p class="copy">${COPYRIGHT}<br>${safeLink()}</p>`,
 {acts:{
  snd:b=>{S.sound=!S.sound;flip(b,S.sound);save();if(S.sound)SFX.click();return false},
  voice:b=>{S.voice=!S.voice;flip(b,S.voice);save();if(!S.voice)try{speechSynthesis.cancel()}catch(e){}else speak(L('코치 목소리를 켰어요!','Coach voice is on!'));return false},
  shield:b=>{S.shieldOn=!S.shieldOn;flip(b,S.shieldOn);save();if(PZ)renderPuzzleTools();return false},
  lang:b=>{if(b.dataset.v!==LANG){save();setLang(b.dataset.v)}return false},
  reset:()=>confirmReset,
 }});
}
// erasing only touches this game's save for the current player (MGP adds "@playerId" to the key)
function confirmReset(){

  lbStep(['가운데 나이트는 8칸, 구석 나이트는 2칸만 갈 수 있어요. 기물은 가운데에서 더 힘이 세요.','A knight in the middle reaches 8 squares. A knight in the corner reaches only 2. Pieces are stronger in the center.'],{fen:'k7/8/8/8/3N4/8/8/N6K w - - 0 1',dots:['d4','a1'],v:h=>h.moves('d4').length===8&&h.moves('a1').length===2}),
  lbStep(['그래서 첫 수는 보통 센터 폰을 두 칸 앞으로 보내요. 센터를 차지하고, 비숍과 퀸이 나올 길도 열려요.','So a great first move is a center pawn two squares forward. It grabs the center and opens a path for the bishop and queen.'],{fen:CHX_START,arrows:[['e2','e4','g'],['d2','d4','g']]}),
  lbStep(['해 봐요! 센터를 차지하는 첫 수를 둬요.','Your turn! Play a first move that takes the center.'],{fen:CHX_START,want:['e2e4','d2d4'],ok:['좋아요! 폰이 센터에 섰고, 기물이 나올 길도 열렸어요.','Nice! Your pawn stands in the center, and your pieces have a way out.'],
   no:(p,m,u)=>['g1f3','b1c3','c2c4'].includes(u)?['그것도 센터를 지키는 좋은 수예요! 이번엔 폰을 센터에 바로 세워 봐요.','That also fights for the center, nice! This time, put a pawn right in the center.']:u==='e2e3'||u==='d2d3'?['한 칸도 괜찮지만, 두 칸 가면 센터에 바로 서요!','One square is okay, but two squares puts it right in the center!']:null,
   miss:['d폰이나 e폰을 두 칸 앞으로 보내 봐요.','Push the d-pawn or the e-pawn two squares.']}),
  lbStep(['흑도 센터를 원해요. 백이 e4를 뒀어요. 해 봐요! 흑 차례예요. 흑도 센터 폰으로 맞서요.','Black wants the center too. White played e4. Your turn! Black to move. Answer with a center pawn.'],{...chxAt('e2e4'),want:['e7e5','d7d5'],
   test:(p,m,u)=>['e7e6','c7c6','c7c5'].includes(u),ok:(p,m)=>m.t===sqv('e5')||m.t===sqv('d5')?['좋아요! 흑 폰도 센터에 섰어요.','Good! Black has a pawn in the center too.']:['그것도 좋은 수예요! 다음에 d5로 센터에 맞설 수 있어요.','That is a good move too! Next, d5 can fight for the center.'],
   miss:['e폰이나 d폰을 두 칸 앞으로!','Push the e-pawn or the d-pawn two squares!']})]},

 develop:{icon:2,title:['기물을 꺼내요: 전개','Develop your pieces'],hook:['기물이 집에만 있으면 싸울 수 없어요. 나이트와 비숍을 먼저 꺼내요.','Pieces at home can’t fight. Bring out your knights and bishops first.'],
  key:[['나이트와 비숍을 먼저 꺼내요. 나이트는 가운데 쪽으로!','Bring out knights and bishops first. Knights go toward the center!'],['오프닝에서는 같은 기물을 두 번 움직이지 않아요.','In the opening, don’t move the same piece twice.']],steps:[
  lbStep(['‘전개’는 기물을 처음 자리에서 꺼내 싸울 자리에 세우는 거예요. 센터 폰 다음에는 나이트와 비숍을 꺼내요.','Developing means bringing a piece out from its home square to a useful spot. After a center pawn, bring out your knights and bishops.'],{...chxAt('e2e4 e7e5'),arrows:[['g1','f3','gn'],['b1','c3','gn'],['f1','c4','g']]}),
  lbStep(['같은 기물을 여러 번 움직이면 늦어요. 백은 나이트 하나만 세 번 움직였고, 흑은 기물 세 개를 꺼냈어요.','Moving one piece again and again is slow. White moved one knight three times, while Black brought out three pieces.'],{...chxAt('e2e4 e7e5 g1f3 b8c6 f3g5 g8f6 g5h3 f8c5'),hl:{good:['c6','f6','c5'],bad:['h3']},v:h=>h.moves('h3').length===3}),
  lbStep(['해 봐요! 아직 집에 있는 기물을 하나 꺼내요.','Your turn! Bring out a piece that is still at home.'],{...chxAt('e2e4 e7e5 g1f3 b8c6'),want:['f1c4','f1b5','b1c3','f1e2'],ok:['좋아요! 기물이 하나 더 싸우러 나왔어요.','Nice! One more piece is ready to fight.'],
   no:(p,m,u)=>m.f===sqv('f3')?['그 나이트는 벌써 나왔어요. 아직 집에 있는 기물을 꺼내요!','That knight is already out. Bring out a piece that is still at home!']:typeOf(m.p)===5?['퀸은 아직 기다려요. 나이트나 비숍 먼저!','The queen can wait. Knights and bishops first!']:typeOf(m.p)===1?['폰도 둘 수 있지만, 이번엔 나이트나 비숍을 꺼내 봐요.','A pawn move is allowed, but this time bring out a knight or a bishop.']:u==='f1a6'?['a6에서는 폰이 비숍을 잡아요!','On a6 the pawn just takes your bishop!']:u==='f1d3'?['d3의 비숍은 d폰의 길을 막아요. 다른 칸을 찾아요.','A bishop on d3 blocks the d-pawn. Find another square.']:null,
   miss:['나이트는 c3, 비숍은 c4나 b5가 좋아요.','Try the knight to c3, or the bishop to c4 or b5.']}),
  lbStep(['해 봐요! 이번엔 흑 차례예요. 흑 기물을 하나 꺼내요.','Your turn! This time Black is to move. Bring out a black piece.'],{...chxAt('e2e4 e7e5 g1f3 b8c6 f1c4'),want:['f8c5','g8f6','f8e7'],ok:['좋아요! 흑도 전개하고 있어요.','Good! Black is developing too.'],
   no:(p,m,u)=>m.f===sqv('c6')?['그 나이트는 벌써 나왔어요. 다른 기물을 꺼내요!','That knight is already out. Bring out another piece!']:typeOf(m.p)===5?['퀸은 아직 기다려요.','The queen can wait.']:typeOf(m.p)===1?['폰도 괜찮지만, 이번엔 나이트나 비숍을 꺼내 봐요.','A pawn move is okay, but this time bring out a knight or a bishop.']:null,
   miss:['비숍 c5나 나이트 f6이 좋아요.','Try the bishop to c5 or the knight to f6.']})]},

 castleEarly:{icon:'🛡️',title:['일찍 캐슬링, 룩 연결','Castle early, connect rooks'],hook:['가운데에 남은 킹은 공격받기 쉬워요. 일찍 캐슬링해서 지켜요.','A king left in the middle is easy to attack. Castle early to keep it safe.'],
  key:[['일찍 캐슬링해서 킹을 폰 뒤에 숨겨요.','Castle early and tuck your king behind its pawns.'],['기물을 다 꺼내면 두 룩이 서로 보게 해요. 이걸 룩 연결이라고 해요.','When your pieces are out, let your rooks see each other. That is called connecting the rooks.']],steps:[
  lbStep(['나이트와 비숍이 나오면 바로 캐슬링해요. 킹은 폰 뒤로 숨고, 룩은 가운데로 나와요.','Once the knight and bishop are out, castle. The king hides behind its pawns, and the rook comes toward the center.'],{...chxAt('e2e4 e7e5 g1f3 b8c6 f1c4 f8c5'),demo:['e1g1']}),
  lbStep(['킹이 가운데에 있으면 위험해요. e줄이 열려서 룩이 킹을 노려요. 흑 비숍은 핀에 걸려 꼼짝 못 해요.','A king in the middle is in danger. The e-file is open, so the rook aims at the king, and the black bishop is pinned.'],{fen:'r1bqk2r/ppppbppp/2n2n2/8/2B5/2NP1N2/PPP2PPP/R1BQR1K1 b kq - 0 7',arrows:[['e1','e8','rdx']],v:h=>h.moves('e7').length===0&&!h.pos.inCheck()}),
  lbStep(['해 봐요! 흑 차례예요. 흑 킹을 캐슬링으로 안전하게 숨겨요.','Your turn! Black to move. Castle to get the black king to safety.'],{fen:'r1bqk2r/ppppbppp/2n2n2/8/2B5/2NP1N2/PPP2PPP/R1BQR1K1 b kq - 0 7',want:['e8g8'],ok:['캐슬링! 이제 비숍도 자유롭게 움직일 수 있어요.','You castled! Now the bishop is free to move too.'],miss:['킹을 룩 쪽으로 두 칸 옮겨 캐슬링해요.','Move the king two squares toward the rook to castle.'],v:h=>h.moves('e7').length===0}),
  lbStep(['캐슬링하고 기물이 다 나오면, 두 룩 사이가 비어서 서로 지켜 줘요. 이걸 ‘룩 연결’이라고 해요.','After castling and developing, nothing stands between the rooks, so they guard each other. That is called connecting the rooks.'],{fen:'r4rk1/pppqbppp/2npbn2/4p3/2B1P3/2NPBN2/PPP1QPPP/R4RK1 w - - 0 10',arrows:[['a1','f1','g'],['a8','f8','g']],v:h=>h.attacks(h.pos,'a1','f1')&&h.attacks(h.pos,'a8','f8')}),
  lbStep(['해 봐요! 퀸이 두 룩 사이를 막고 있어요. 퀸을 한 칸 앞으로 옮겨 룩을 연결해요.','Your turn! The queen stands between the rooks. Move her up a row to connect the rooks.'],{fen:'r2q1rk1/pppbbppp/2np1n2/4p3/2B1P3/2NPBN2/PPP2PPP/R2Q1RK1 w - - 0 9',want:['d1d2','d1e2'],ok:['룩 연결! 이제 두 룩이 서로 지켜요.','Rooks connected! Now they guard each other.'],no:(p,m)=>typeOf(m.p)===5?['퀸이 아직 첫 줄에 있어서 룩 사이를 막아요.','The queen is still on the back row, between the rooks.']:null,miss:['퀸을 d2나 e2로 옮겨 봐요.','Try moving the queen to d2 or e2.'],v:h=>h.attacks(h.after('d1e2'),'a1','f1')&&!h.attacks(h.pos,'a1','f1')})]},

 queenEarly:{icon:5,title:['퀸은 천천히','Don’t rush the queen'],hook:['퀸이 너무 일찍 나오면 쫓겨 다니다가 시간을 잃어요.','A queen that comes out too early gets chased around and wastes time.'],
  key:[['퀸은 나이트와 비숍이 나온 뒤에 꺼내요.','Bring the queen out after your knights and bishops.'],['일찍 나온 상대 퀸은 기물을 꺼내면서 공격해요.','Attack an early enemy queen while you develop your pieces.'],['폰 하나 잡으려다 퀸이 갇히거나 묶일 수 있어요.','Grabbing a pawn with the queen can get her trapped or pinned.']],steps:[
  lbStep(['백 퀸이 일찍 나와서 f7을 노려요. 흑은 폰 g6과 나이트 f6으로 막으면서 퀸을 쫓아내요. 퀸이 또 움직이는 동안 흑은 기물을 꺼내요.','White’s queen comes out early to aim at f7. Black blocks with the g-pawn and the knight, chasing the queen. While the queen moves again, Black brings out pieces.'],{fen:CHX_START,demo:['e2e4','e7e5','d1h5','b8c6','f1c4','g7g6','h5f3','g8f6']}),
  lbStep(['해 봐요! 흑 차례예요. 백 퀸과 비숍이 함께 f7을 노려요. 퀸이 f7을 잡으면 체크메이트! 막아요.','Your turn! Black to move. White’s queen and bishop both aim at f7. Queen takes f7 would be checkmate! Stop it.'],{...chxAt('e2e4 e7e5 d1h5 b8c6 f1c4'),arrows:[['h5','f7','r'],['c4','f7','r']],want:['g7g6','d8e7','d8f6','g8h6'],
   ok:(p,m)=>m.f===sqv('g7')?['최고예요! 막으면서 퀸까지 공격했어요.','Excellent! You blocked it and attacked the queen too.']:['막았어요! 이제 퀸이 f7을 잡을 수 없어요.','Blocked! Now the queen can’t take f7.'],
   no:p=>chxMateNext(p)?['앗, 그러면 퀸이 f7을 잡아서 체크메이트예요! f7을 지켜요.','Oh no, then the queen takes f7 with checkmate! Guard f7.']:null,miss:['f7을 지키거나, 퀸과 f7 사이를 막아요.','Guard f7, or block the line between the queen and f7.'],v:h=>h.mates(h.after('g8f6'))===1&&h.mates(h.after('g7g6'))===0}),
  lbStep(['해 봐요! 흑 퀸이 일찍 나왔어요. 기물을 꺼내면서 퀸을 공격해요.','Your turn! Black’s queen came out early. Bring out a piece and attack the queen at the same time.'],{...chxAt('e2e4 d7d5 e4d5 d8d5'),want:['b1c3'],ok:['좋아요! 나이트가 나오면서 퀸을 쫓아요. 퀸은 또 움직여야 해요.','Good! The knight comes out and kicks the queen. She has to move again.'],
   no:(p,m)=>typeOf(m.p)===2||typeOf(m.p)===3?['기물을 꺼냈지만, 퀸을 공격하지는 않아요. 퀸을 노리는 칸을 찾아요.','You brought out a piece, but it doesn’t attack the queen. Find the square that hits her.']:null,miss:['나이트가 c3으로 가면 퀸을 공격해요.','A knight on c3 attacks the queen.'],v:h=>h.attacks(h.after('b1c3'),'c3','d5')}),
  lbStep(['해 봐요! 흑 퀸이 폰을 잡으러 e5까지 왔어요. 흑 킹은 같은 e줄에 있어요. 퀸을 킹 앞에 묶어요!','Your turn! Black’s queen went all the way to e5 to grab a pawn, with the king behind her on the e-file. Pin the queen to the king!'],{fen:'rnb1kb1r/ppp2ppp/3p4/4q3/2B5/2N5/PPP2PPP/R1BQ1RK1 w kq - 0 7',want:['f1e1'],ok:['핀! 퀸은 킹 앞에서 움직일 수 없어요. 룩 하나로 퀸을 얻어요.','A pin! The queen can’t step away from the king. You win her for a rook.'],miss:['룩을 퀸과 킹이 서 있는 e줄로 보내요.','Send a rook to the e-file, where the queen and king stand.'],v:h=>{const Q=h.after('f1e1');return Q.legal().every(m=>typeOf(m.p)!==5||(m.t&7)===4)}})]},

 italian:{icon:3,title:['이탈리안 게임','The Italian Game'],hook:['이탈리안은 기물을 빨리 꺼내고 f7을 노리는, 처음 배우기 좋은 오프닝이에요.','The Italian brings pieces out fast and aims at f7. It is a great first opening to learn.'],
  key:[['이탈리안: e4, 나이트 f3, 비숍 c4로 f7을 노려요.','Italian: e4, knight to f3, then bishop to c4 aiming at f7.'],['그다음 캐슬링, c3과 d4로 센터를 넓혀요.','Then castle, and play c3 and d4 to build a big center.']],steps:[
  lbStep(['이탈리안 게임이에요. 백 e4, 흑 e5. 나이트 f3이 e5를 공격하면 흑 나이트 c6이 지켜요. 그리고 비숍 c4!','This is the Italian Game. White plays e4, Black e5. The knight on f3 attacks e5, the black knight on c6 guards it, and then: bishop to c4!'],{fen:CHX_START,demo:['e2e4','e7e5','g1f3','b8c6','f1c4']}),
  lbStep(['비숍 c4는 f7을 노려요. f7은 흑 킹만 지키고 있는 약한 칸이에요.','The bishop on c4 aims at f7. Only the black king guards f7, so it is a weak spot.'],{...chxAt('e2e4 e7e5 g1f3 b8c6 f1c4'),arrows:[['c4','f7','r']],hl:{bad:['f7']},v:h=>h.attacks(h.pos,'c4','f7')}),
  lbStep(['백의 다음 계획: ① 캐슬링 ② c3 ③ d4. c3이 d4를 도와서 센터에 폰 두 개를 세워요.','White’s plan next: ① castle, ② c3, ③ d4. The c-pawn helps d4, so White gets two pawns in the center.'],{...chxAt('e2e4 e7e5 g1f3 b8c6 f1c4 f8c5'),arrows:[['e1','g1','g','1'],['c2','c3','b','2'],['d2','d4','b','3']]}),
  lbStep(['해 봐요! 흑이 비숍 c5를 뒀어요. 이탈리안 계획대로 좋은 수를 하나 둬요.','Your turn! Black played bishop to c5. Play a good move from the Italian plan.'],{...chxAt('e2e4 e7e5 g1f3 b8c6 f1c4 f8c5'),want:['c2c3','e1g1','d2d3','b1c3'],ok:(p,m)=>m.fl&4?['캐슬링! 킹이 안전해졌어요.','Castled! Your king is safe.']:['좋아요! 계획대로 차근차근 가요.','Nice! Step by step, just like the plan.'],
   no:(p,m,u)=>u==='f3g5'?['나이트가 또 움직이면 전개가 늦어요. 지금 f7은 퀸도 지켜요.','Moving the knight again is slow, and right now the queen guards f7 too.']:u==='c4f7'?['f7을 잡으면 킹이 비숍을 잡아요. 3점을 주고 1점만 얻어요.','Take f7 and the king takes your bishop. You give 3 points to win 1.']:u==='f3e5'?['e5 폰은 나이트 c6이 지켜요. 잡으면 내 나이트가 잡혀요.','The knight on c6 guards e5. Take it and you lose your knight.']:typeOf(m.p)===5?['퀸은 아직 기다려요.','The queen can wait.']:null,
   miss:['캐슬링, c3, d3, 나이트 c3 중에서 골라 봐요.','Pick one: castle, c3, d3, or knight to c3.']})]},

 italianTraps:{icon:'🪤',title:['이탈리안의 함정','Italian traps'],hook:['함정을 알면 걸리지 않고, 상대가 걸리면 바로 벌줄 수 있어요.','Know the traps: you won’t fall for them, and you can punish them.'],
  key:[['나이트 g5가 f7을 노리면, 흑은 d5로 비숍 길을 막아요.','When the knight jumps to g5 to hit f7, Black blocks the bishop with d5.'],['킹이 아니라 퀸 앞의 핀은 풀릴 수 있어요. 함정을 조심!','A pin against the queen, not the king, can be broken. Watch for traps!']],steps:[
  lbStep(['흑이 나이트 f6으로 e4를 노리면, 백 나이트가 g5로 뛰어요. 이제 나이트와 비숍이 둘이서 f7을 노려요.','When Black’s knight goes to f6, White’s knight can jump to g5. Now the knight and bishop both aim at f7.'],{...chxAt('e2e4 e7e5 g1f3 b8c6 f1c4 g8f6 f3g5'),arrows:[['g5','f7','rn'],['c4','f7','r']],hl:{bad:['f7']},v:h=>h.attacks(h.pos,'g5','f7')&&h.attacks(h.pos,'c4','f7')}),
  lbStep(['해 봐요! 흑이 f7을 지키지 않고 h6을 뒀어요. f7을 잡아서 퀸과 룩을 한꺼번에 공격해요!','Your turn! Black didn’t guard f7 and played h6 instead. Take f7 and attack the queen and the rook at once!'],{...chxAt('e2e4 e7e5 g1f3 b8c6 f1c4 g8f6 f3g5 h7h6'),want:['g5f7'],ok:['포크! 퀸이 피하면 룩을 잡아요.','A fork! When the queen moves, you take the rook.'],no:(p,m,u)=>u==='c4f7'?['체크지만, 킹이 피하면 h6 폰이 나이트를 잡아요. 나이트로 잡아 봐요!','That’s check, but after the king steps away, the h-pawn takes your knight. Take with the knight!']:null,miss:['나이트로 f7 폰을 잡아요.','Take the f7 pawn with the knight.'],v:h=>{const Q=h.after('g5f7');return h.attacks(Q,'f7','d8')&&h.attacks(Q,'f7','h8')}}),

 pawnSquare:{icon:'🟩',title:['폰의 사각형','The square of the pawn'],hook:['킹이 폰을 따라잡을 수 있을까? 사각형 하나만 그려 보면 알 수 있어요.','Can the king catch the pawn? Draw one square and you will know.'],

 outpost:{icon:'🏯',title:['아웃포스트와 약한 칸','Outposts and weak squares'],hook:['상대 폰이 쫓아낼 수 없는 칸에 나이트를 세우면 아주 강해져요.','A knight on a square no enemy pawn can attack becomes a monster.'],

 kingSafety:{icon:'🏠',title:['킹을 지키는 폰 방패','King safety'],hook:['킹 앞의 폰은 방패예요. 함부로 밀면 구멍이 생겨요.','The pawns in front of your king are its shield. Push them carelessly and holes appear.'],
