const CARD_RAW=[
 // ---------------------------------------------------------------- 0 Compass Camp
 ['dir4',0,1,'🧭','동서남북|The four directions','기본 방향은 북·동·남·서 4가지예요. 지도에서는 보통 위가 북쪽, 오른쪽이 동쪽, 아래가 남쪽, 왼쪽이 서쪽이에요.|The four main directions are north, east, south and west. On most maps north is at the top, east on the right, south at the bottom and west on the left.','북쪽을 보고 서면 오른손 쪽이 동쪽이에요!|Face north and your right hand points east!'],
 ['sunrise',0,1,'🌅','해는 동쪽에서 떠요|The Sun rises in the east','해는 아침에 동쪽에서 떠서, 한낮에는 남쪽 하늘 높이 있다가, 저녁에 서쪽으로 져요.|The Sun rises in the east in the morning, is high in the southern sky at midday, and sets in the west in the evening.','아침 햇살이 들어오는 창문은 동쪽 창문이에요.|The window that gets morning sunshine faces east.'],
 ['compass',0,1,'🧭','나침반|The compass','나침반 바늘의 빨간 끝(N)은 언제나 북쪽을 가리켜요. 나침반을 돌려도 바늘은 다시 북쪽을 봐요.|The red end (N) of a compass needle always points north. Even if you turn the compass, the needle swings back to north.','캠핑이나 등산을 할 때 나침반이 있으면 길을 잃지 않아요.|A compass helps you stay on track when camping or hiking.'],
 ['leftright',0,1,'↔️','왼쪽·오른쪽과 동서남북|Left/right vs. compass directions','왼쪽·오른쪽은 내가 몸을 돌리면 바뀌지만, 동서남북은 내가 돌아도 바뀌지 않아요.|Left and right change when you turn around, but north, east, south and west stay the same.','길을 알려줄 때 “북쪽으로 두 블록”이라고 하면 누구에게나 똑같이 통해요.|“Two blocks north” means the same thing to everyone.'],
 ['mapread',0,1,'🗺️','지도 읽기|Reading a map','지도는 하늘 위에서 내려다본 그림이에요. 방위표(N 화살표)와 그림 기호를 보면 길을 찾을 수 있어요.|A map is a picture of a place seen from above. The north arrow and the symbols help you find your way.','공원 안내판 지도에서 “현재 위치”부터 찾아봐요.|On a park map, find the “You are here” spot first.'],
 ['dir8',0,2,'✳️','8방위|Eight directions','북과 동 사이는 북동, 남과 서 사이는 남서처럼 사이 방향도 있어요. 모두 합치면 8방위예요.|Between north and east is northeast, between south and west is southwest, and so on. Together they make eight directions.','일기예보에서 “북서풍”이라고 하면 북서쪽에서 부는 바람이에요.|A “northwest wind” blows from the northwest.'],
 ['noonshadow',0,2,'🕛','한낮 그림자는 북쪽|Noon shadows point north','캐나다나 한국 같은 북쪽 나라에서는 한낮에 해가 남쪽 하늘에 있어서 그림자가 북쪽을 가리켜요.|In northern countries like Canada and Korea, the midday Sun is in the southern sky, so shadows point north.','나침반이 없을 때 한낮의 막대 그림자로 북쪽을 찾을 수 있어요.|No compass? A stick’s shadow at midday points north.'],
 ['magnetearth',0,2,'🌏','지구는 커다란 자석|Earth is a giant magnet','지구는 커다란 자석 같아서 작은 자석인 나침반 바늘이 북쪽을 가리켜요. 가까이에 자석이나 쇠가 있으면 바늘이 엉뚱한 곳을 가리킬 수 있어요.|Earth acts like a giant magnet, so the little magnet in a compass points north. A magnet or iron nearby can make the needle point the wrong way.','나침반은 휴대폰, 스피커, 쇠붙이에서 떨어뜨려서 써요.|Keep a compass away from phones, speakers and metal.'],
 ['polaris',0,2,'⭐','북극성|The North Star','북극성은 밤새 거의 움직이지 않고 북쪽 하늘에 있어요. 옛날 사람들은 북극성을 보고 길을 찾았어요.|The North Star (Polaris) stays almost still in the northern sky all night. Long ago, travelers used it to find their way.','국자 모양의 북두칠성을 찾으면 북극성을 찾기 쉬워요.|Find the Big Dipper first; it points to the North Star.'],
 ['moss',0,2,'🌿','이끼 방향은 믿지 마요|Don’t trust the moss','“이끼는 나무 북쪽에만 자란다”는 말은 믿을 수 없어요. 이끼는 그늘지고 축축하면 어느 쪽에나 자라요.|“Moss only grows on the north side of trees” is not true. Moss grows on any side that is shady and damp.','길을 찾을 땐 이끼 말고 나침반, 해, 지도를 써요.|To find your way, use a compass, the Sun or a map, not moss.'],
 ['startrail',0,3,'🌌','별의 하루 움직임|Stars wheel across the sky','지구가 서쪽에서 동쪽으로 돌기 때문에 해와 별은 동쪽에서 떠서 서쪽으로 지는 것처럼 보여요. 북쪽 하늘의 별들은 북극성을 중심으로 시계 반대 방향으로 빙 돌아요.|Because Earth spins from west to east, the Sun and stars seem to rise in the east and set in the west. Stars in the northern sky circle the North Star, counterclockwise.','캠핑 가서 한 시간마다 북두칠성을 보면 자리가 바뀐 걸 알 수 있어요.|At a campsite, check the Big Dipper every hour and you’ll see it has moved.'],
 ['mapscale',0,3,'📐','축척과 등고선|Map scale and contour lines','지도는 실제 땅을 작게 줄여 그린 그림이에요. 축척을 보면 지도 위 1cm가 실제로 얼마나 먼지 알 수 있어요. 높이가 같은 곳을 이은 등고선이 촘촘할수록 경사가 가팔라요.|A map shrinks real places down. The scale tells you how far 1 cm on the map really is. Contour lines join places of the same height; the closer together they are, the steeper the slope.','등산 지도에서 축척과 등고선을 보면 얼마나 멀고 가파른지 미리 알 수 있어요.|A trail map’s scale and contour lines tell you how far and how steep a hike is before you start.'],
 ['measure',0,1,'📏','길이 재기|Measuring length','길이는 자로 재요. 물체의 한쪽 끝을 눈금 0에 맞추고 다른 끝의 눈금을 읽어요. 짧은 것은 cm(센티미터), 긴 것은 m(미터)로 나타내요. 1m는 100cm예요.|We measure length with a ruler. Line one end up with 0 and read the mark at the other end. Short things are measured in centimetres (cm), long things in metres (m). 1 m = 100 cm.','어른 손가락 너비는 약 1cm예요. 자가 없을 때 어림해 봐요!|A grown-up’s finger is about 1 cm wide. Use it to estimate when you have no ruler!'],
 ['prefix',0,2,'🔢','킬로, 센티, 밀리|Kilo, centi, milli','단위 앞에 붙는 말로 크기를 알 수 있어요. 킬로(k)는 1000배, 센티(c)는 100분의 1, 밀리(m)는 1000분의 1이에요. 그래서 1km = 1000m, 1m = 100cm, 1cm = 10mm, 1kg = 1000g, 1L = 1000mL예요.|The word at the front of a unit tells you its size. Kilo (k) means 1000 times, centi (c) means one hundredth and milli (m) means one thousandth. So 1 km = 1000 m, 1 m = 100 cm, 1 cm = 10 mm, 1 kg = 1000 g and 1 L = 1000 mL.','도로 표지판의 km, 우유 팩의 mL, 과자 봉지의 g을 찾아봐요.|Spot km on road signs, mL on milk cartons and g on snack bags.'],
 // ---------------------------------------------------------------- 1 Shadow Park
 ['shform',1,1,'👤','그림자가 생기는 이유|How shadows form','빛은 곧게 나아가요. 물체가 빛을 막으면 그 뒤쪽은 빛이 닿지 않아 어두워져요. 그게 그림자예요.|Light travels in straight lines. When an object blocks the light, the area behind it gets no light. That dark area is a shadow.','손전등 빛을 손으로 막아 벽에 그림자 동물을 만들어 봐요.|Block a flashlight with your hands to make shadow animals on the wall.'],
 ['shopp',1,1,'↔️','그림자는 빛의 반대쪽|Shadows fall opposite the light','그림자는 언제나 빛이 오는 쪽의 반대쪽에 생겨요. 빛이 왼쪽에서 오면 그림자는 오른쪽!|A shadow always falls on the side away from the light. Light from the left makes a shadow on the right!','해를 등지고 서면 내 그림자가 내 앞에 생겨요.|Stand with your back to the Sun and your shadow is in front of you.'],
 ['shnear',1,1,'🔦','빛과 가까우면 커져요|Closer to the light, bigger shadow','물체를 손전등에 가까이 하면 벽의 그림자가 커지고, 멀리 하면 작아져요.|Move an object closer to the flashlight and its shadow on the wall grows. Move it away and the shadow shrinks.','그림자 연극에서 괴물을 크게 만들고 싶으면 인형을 빛 쪽으로!|In a shadow play, move the puppet toward the light to make a giant monster!'],
 ['shlow',1,1,'📏','빛이 낮으면 길어져요|Low light, long shadow','빛이 낮게 비추면 그림자가 길어지고, 머리 위에서 비추면 짧아져요.|When light shines from low down, shadows get long. When it shines from overhead, shadows get short.','아침·저녁 그림자는 키다리, 한낮 그림자는 땅꼬마!|Morning and evening shadows are tall; midday shadows are tiny!'],
 ['shsun',1,2,'🕐','하루 동안 바뀌는 그림자|Shadows change during the day','해가 하늘을 지나가면 그림자도 움직여요. 아침에는 서쪽으로 길게, 한낮에는 짧게, 저녁에는 동쪽으로 길게 생겨요.|As the Sun crosses the sky, shadows move. They are long toward the west in the morning, short at midday and long toward the east in the evening.','옛날 사람들은 그림자로 시간을 재는 해시계를 썼어요.|Long ago, people told time with shadows on a sundial.'],
 ['shtrans',1,1,'🪟','투명·반투명·불투명|Clear, cloudy and solid','유리처럼 빛이 잘 통과하면 그림자가 거의 없고, 기름종이처럼 조금 통과하면 흐린 그림자, 나무처럼 막으면 진한 그림자가 생겨요.|Clear things like glass let light through, so they make almost no shadow. Cloudy things like wax paper make a faint shadow. Solid things like wood make a dark shadow.','두꺼운 커튼을 치면 방이 어두워지는 것도 빛을 막기 때문이에요.|Thick curtains make a room dark because they block the light.'],
 ['shshape',1,1,'⭐','그림자 모양|Shadow shapes','그림자는 물체의 테두리 모양을 닮아요. 하지만 물체를 돌리거나 빛의 방향이 바뀌면 그림자 모양도 바뀌어요.|A shadow has the outline shape of the object. Turn the object or move the light and the shadow’s shape changes.','손 모양을 바꾸면 강아지, 새, 토끼 그림자를 만들 수 있어요.|Change your hand shape to make a dog, a bird or a bunny shadow.'],
 ['straight',1,2,'➡️','빛은 곧게 나아가요|Light travels straight','빛은 휘지 않고 똑바로 나아가요. 그래서 벽 뒤에 숨으면 빛이 닿지 않아요.|Light does not bend around corners; it goes straight. That is why light can’t reach you behind a wall.','커튼 틈으로 들어온 햇빛이 곧은 줄처럼 보여요.|Sunlight through a gap in the curtains looks like a straight beam.'],
 ['mirror',1,2,'🪞','빛의 반사|Light bounces','거울은 빛을 튕겨 보내요(반사). 우리가 물건을 보는 것도 물건에 튕긴 빛이 눈에 들어오기 때문이에요.|A mirror bounces light back (reflection). We see things because light bounces off them into our eyes.','깜깜한 방에서는 아무것도 안 보여요. 빛이 있어야 볼 수 있어요.|In a pitch-dark room you can’t see anything. We need light to see.'],
 ['glow',1,1,'💡','스스로 빛나는 것|Things that make light','해, 불, 전구, 반딧불이는 스스로 빛을 내요. 달과 거울은 스스로 빛나지 않고 다른 빛을 반사해요.|The Sun, fire, light bulbs and fireflies make their own light. The Moon and mirrors don’t; they reflect other light.','자전거 반사판도 스스로 빛나지 않고 자동차 불빛을 반사해서 반짝여요.|A bike reflector doesn’t glow by itself; it reflects car headlights.'],
 ['refract',1,2,'🥤','빛의 굴절|Light bends','빛은 곧게 나아가다가 공기에서 물이나 유리로 들어가는 경계에서 꺾여요(굴절). 그래서 물컵 속 빨대가 꺾여 보이고, 물속 바닥은 실제보다 얕아 보여요. 프리즘을 지난 햇빛은 여러 색으로 나뉘어요.|Light travels straight, but it bends where it passes from air into water or glass (refraction). That’s why a straw looks broken in a glass of water and a pool looks shallower than it is. Sunlight through a prism splits into colors.','수영장이나 냇가는 보이는 것보다 깊어요. 들어가기 전에 어른과 깊이를 꼭 확인해요.|Pools and streams are deeper than they look. Check the depth with a grown-up first.'],
 ['lens',1,3,'🔍','볼록 렌즈와 돋보기|Lenses and magnifiers','가운데가 볼록한 렌즈는 가까운 물체를 크게 보여 주고, 햇빛을 한 점으로 모아요. 안경, 카메라, 현미경에 렌즈가 쓰여요.|A lens that bulges in the middle makes close things look bigger and gathers sunlight into one spot. Glasses, cameras and microscopes all use lenses.','돋보기로 모은 햇빛은 종이가 탈 만큼 뜨거워요. 절대 장난치면 안 돼요!|Sunlight focused by a magnifier can burn paper. Never play with it!'],
 ['sunalt',1,3,'📐','태양 고도와 기온|Sun height and temperature','해가 높이 뜰수록(태양 고도가 높을수록) 그림자는 짧아지고 땅이 더 많이 데워져요. 태양 고도는 한낮에 가장 높지만, 땅이 데워져 공기를 데우는 데 시간이 걸려서 기온은 오후 2시쯤 가장 높아요.|The higher the Sun climbs (its altitude), the shorter the shadows and the more the ground heats up. The Sun is highest at midday, but the air is warmest around 2 p.m., because the ground takes time to warm up and heat the air.','여름 오후 2~3시가 가장 더워요. 그늘에서 쉬고 물을 자주 마셔요.|Summer afternoons around 2–3 p.m. are the hottest. Rest in the shade and drink water often.'],
 // ---------------------------------------------------------------- 2 Zoom Bus Road
 ['pushpull',2,1,'👐','밀기와 당기기|Push and pull','물체를 움직이려면 밀거나 당겨야 해요. 이렇게 물체를 움직이는 것을 “힘”이라고 해요. 세게 밀수록 더 빨리, 더 멀리 가요.|To move something you push or pull it. That push or pull is called a force. A bigger push makes it go faster and farther.','문을 열 때, 그네를 밀 때, 썰매를 끌 때 모두 힘을 써요.|Opening a door, pushing a swing and pulling a sled all use forces.'],
 ['inertia',2,1,'🚌','급정거하면 앞으로!|Sudden stop: you lurch forward','움직이던 물체는 계속 움직이려고 해요(관성). 버스가 갑자기 멈추면 몸은 계속 앞으로 가려다 앞으로 쏠려요.|Moving things keep moving (this is called inertia). When a bus stops suddenly, your body keeps going and lurches forward.','버스에서 서 있을 때는 손잡이를 꼭 잡아요.|Hold on to a handle when you stand on a bus.'],
 ['inertia2',2,1,'🚦','갑자기 출발하면 뒤로!|Sudden start: you lean back','멈춰 있던 물체는 계속 멈춰 있으려고 해요. 버스가 갑자기 출발하면 몸이 제자리에 남으려 해서 뒤로 쏠려요.|Still things like to stay still. When a bus starts suddenly, your body wants to stay put, so you lean backward.','버스가 출발할 때는 자리에 앉아 있거나 손잡이를 잡아요.|Sit down or hold on when the bus pulls away.'],
 ['seatbelt',2,1,'🦺','안전벨트|Seat belts','차가 갑자기 멈춰도 몸은 계속 앞으로 가려고 해요. 안전벨트가 몸을 꽉 잡아 줘서 다치지 않아요.|When a car stops suddenly, your body keeps moving forward. A seat belt holds you in place so you don’t get hurt.','가까운 곳에 갈 때도 차에 타면 바로 안전벨트! 어린이는 부스터 시트도 써요.|Buckle up for every ride, even short ones. Kids use booster seats too.'],
 ['friction',2,1,'🧊','마찰력|Friction','두 물체가 비벼질 때 움직임을 방해하는 힘이 마찰력이에요. 거친 곳은 마찰이 커서 덜 미끄럽고, 얼음처럼 매끈한 곳은 잘 미끄러워요.|Friction is a force that slows things down when two surfaces rub together. Rough surfaces have lots of friction; smooth ice has very little.','겨울에 얼음길에 모래를 뿌리면 덜 미끄러워요. 손을 비비면 따뜻해지는 것도 마찰 때문!|Sand on icy sidewalks stops slipping. Rubbing your hands warms them up: that’s friction too!'],
 ['gravity',2,1,'🍎','중력|Gravity','지구는 모든 물체를 아래로 끌어당겨요. 그래서 공을 위로 던져도 다시 떨어져요.|Earth pulls everything down toward it. That is why a ball you throw up always comes back down.','미끄럼틀을 슝 내려올 수 있는 것도 중력 덕분이에요.|Gravity is what pulls you down the slide!'],
 ['slope',2,2,'🛷','비탈이 가파를수록 빨라요|Steeper slopes are faster','비탈이 가파를수록 굴러 내려가는 물체가 더 빨라져요. 공처럼 둥근 것은 잘 구르고, 네모난 상자는 잘 안 굴러요.|The steeper the slope, the faster things roll down. Round things like balls roll easily; boxes don’t.','썰매는 가파른 언덕에서 더 씽씽 달려요. 너무 가파른 곳은 위험해요!|Sleds go faster on steep hills. Too steep is dangerous!'],
 ['stopdist',2,1,'🚗','차는 바로 못 멈춰요|Cars can’t stop instantly','빠르게 달리던 차는 브레이크를 밟아도 한참 더 가서 멈춰요. 비나 눈이 오면 더 길어져요.|A fast car keeps going for a while even after the driver brakes. On rain or snow it takes even longer.','길을 건너기 전에는 멈추고, 차가 완전히 섰는지 양쪽을 살펴요.|Before you cross, stop and look both ways until cars have fully stopped.'],
 ['seesaw',2,2,'⚖️','시소의 균형|Balancing a seesaw','무거운 쪽은 가운데 가까이, 가벼운 쪽은 끝에 앉으면 시소가 균형을 이뤄요. 무게 × 가운데까지의 거리가 같으면 균형!|To balance a seesaw, the heavier person sits closer to the middle and the lighter person sits near the end. When weight × distance is the same on both sides, it balances!','아빠와 시소를 탈 때는 아빠가 가운데 쪽으로 앉아야 해요.|When you ride with a grown-up, they should sit closer to the middle.'],
 ['airres',2,2,'🪂','공기 저항|Air resistance','공기도 움직임을 방해해요. 낙하산이나 펼친 종이는 천천히, 뭉친 종이는 빨리 떨어져요. 크기와 모양이 같으면 무거워도 가벼워도 거의 함께 떨어져요.|Air pushes back on moving things. Parachutes and flat paper fall slowly, while crumpled paper falls fast. Objects of the same size and shape fall at almost the same speed, heavy or light.','민들레 씨앗은 솜털 낙하산으로 바람을 타고 멀리 날아가요.|Dandelion seeds float far away on tiny fluffy parachutes.'],
 ['tools',2,2,'🔧','힘을 덜 쓰는 도구|Tools that make work easier','지레는 받침점에서 먼 곳을 누를수록 힘이 덜 들어요(병따개, 가위, 시소). 빗면은 길고 완만할수록 물건을 올리기 쉬워요(경사로). 도르래와 바퀴도 힘을 덜어 줘요.|A lever is easier to push the farther you push from its pivot (bottle openers, scissors, seesaws). A ramp is easier the longer and gentler it is. Pulleys and wheels help too.','무거운 짐은 바퀴 달린 카트나 경사로로 옮겨요.|Move heavy loads with a wheeled cart or a ramp.'],
 ['speed',2,3,'⏱️','속력|Speed','속력은 1초나 1시간처럼 정해진 시간 동안 얼마나 먼 거리를 가는지예요. 속력 = 이동 거리 ÷ 걸린 시간. 같은 거리를 더 짧은 시간에 가면 더 빨라요.|Speed is how far something goes in a set time, like one second or one hour. Speed = distance ÷ time. Covering the same distance in less time is faster.','학교 앞 어린이 보호구역에서는 차가 천천히 달려야 해요. 빠를수록 멈추는 데 더 먼 거리가 필요하거든요.|Cars must go slowly in school zones: the faster a car goes, the farther it needs to stop.'],
 ['flight',2,3,'✈️','비행기가 나는 힘|How planes fly','날개가 공기를 가르며 앞으로 나아가면 위로 뜨는 힘(양력)이 생겨요. 엔진은 앞으로 미는 힘(추력)을 내고, 공기는 뒤로 막는 힘(항력)을, 중력은 아래로 끄는 힘을 줘요.|As wings slice forward through the air, they get an upward push called lift. Engines give a forward push (thrust), the air pushes back (drag) and gravity pulls down.','종이비행기 날개 끝을 살짝 접어 올리거나 내리면 나는 모습이 달라져요.|Bend the back edges of a paper plane’s wings up or down and watch how its flight changes.'],
 ['pushback',2,2,'🎈','밀면 되밀어요|Every push pushes back','물체를 밀면 그 물체도 똑같은 크기로 나를 되밀어요(작용과 반작용). 풍선에서 바람이 뒤로 나가면 풍선은 앞으로, 로켓이 가스를 아래로 뿜으면 로켓은 위로 올라가요.|When you push on something, it pushes back on you just as hard (action and reaction). Air rushing out the back of a balloon sends it forward; a rocket blasts gas down and shoots up.','스케이트를 신고 벽을 밀면 내가 뒤로 미끄러져요.|On skates, push the wall and you glide backward.'],
 ['inertia3',2,2,'🪙','관성 더 알아보기|More about inertia','움직이던 것은 계속 움직이려 하고, 멈춰 있던 것은 계속 멈춰 있으려 해요(관성). 무거울수록 관성이 커서 움직이게 하거나 멈추기가 더 어려워요.|Moving things want to keep moving and still things want to stay still (inertia). The heavier something is, the more inertia it has, so it’s harder to start or stop.','이불을 탁탁 털면 이불은 움직이지만 먼지는 제자리에 남으려 해서 떨어져 나가요.|Shake a blanket hard: the blanket moves, but the dust tends to stay put, so it falls off.'],
 ['springscale',2,2,'🪝','용수철저울로 무게 재기|Weighing with a spring scale','용수철은 무거운 물체를 매달수록 더 많이 늘어나요. 무게가 2배가 되면 늘어난 길이도 약 2배가 돼요. 이 성질로 무게를 재는 도구가 용수철저울이에요. 재기 전에 바늘을 눈금 0에 맞추고, 물체를 매단 뒤 바늘이 멈추면 눈금을 읽어요.|A spring stretches more when you hang something heavier on it. Double the weight and it stretches about twice as far. A spring scale uses this to measure weight. Set the pointer to 0 first, hang the object, then read the mark once the pointer stops.','여행 가방 무게를 재는 손저울 중에도 용수철이 들어 있는 것이 있어요.|Some handheld luggage scales have a spring inside.'],
 ['gears',2,2,'⚙️','톱니바퀴와 도르래|Gears and pulleys','톱니바퀴 두 개가 맞물리면 서로 반대 방향으로 돌아요. 큰 톱니바퀴가 한 바퀴 돌 때 작은 톱니바퀴는 여러 바퀴 돌아서 더 빨리 돌아요. 고정도르래는 힘의 방향을 바꿔 주고, 움직도르래는 무거운 물건을 더 적은 힘으로 들게 해 줘요.|When two gears mesh, they turn in opposite directions. When a big gear turns once, a small gear turns several times, so it spins faster. A fixed pulley changes the direction of your pull, and a movable pulley lets you lift a heavy load with less force.','자전거는 페달의 큰 톱니바퀴와 뒷바퀴의 작은 톱니바퀴가 체인으로 이어져 있어요.|On a bike, a chain links the big gear at the pedals to a small gear on the back wheel.'],
 // ---------------------------------------------------------------- 3 Magnet Factory
 ['magiron',3,1,'🧲','자석에 붙는 것|What magnets pick up','자석은 철(쇠)로 된 물건을 끌어당겨요. 클립, 쇠못, 옷핀은 붙고, 나무, 종이, 플라스틱, 유리는 안 붙어요.|Magnets pull things made of iron or steel. Paper clips, nails and safety pins stick; wood, paper, plastic and glass don’t.','냉장고 자석이 붙는 건 냉장고 문이 철로 만들어졌기 때문이에요.|Fridge magnets stick because the fridge door is made of steel.'],
 ['magmetal',3,2,'🥫','모든 금속이 붙지는 않아요|Not every metal sticks','알루미늄 캔, 구리, 금반지는 금속이지만 자석에 붙지 않아요. 자석은 주로 철로 된 것을 끌어당겨요.|Aluminum cans, copper and gold rings are metals, but magnets don’t pull them. Magnets mostly pull iron and steel.','재활용 공장에서는 큰 자석으로 철 캔만 골라내요.|Recycling plants use giant magnets to pull out steel cans.'],
 ['poles',3,1,'🧲','N극과 S극|North and south poles','자석에는 N극과 S극이 있어요. 다른 극끼리는 붙고(N–S), 같은 극끼리는 밀어내요(N–N, S–S).|Every magnet has a north (N) and a south (S) pole. Opposite poles pull together (N–S); the same poles push apart (N–N, S–S).','자석 기차 장난감이 붙거나 밀리는 것도 이 원리예요.|Magnetic toy trains snap together or push apart because of poles.'],
 ['magthrough',3,1,'📄','자석의 힘은 통과해요|Magnet force goes through things','자석의 힘은 종이, 물, 유리, 얇은 플라스틱을 통과해요. 종이 아래에서 자석을 움직이면 위의 클립도 따라 움직여요.|A magnet’s pull goes through paper, water, glass and thin plastic. Move a magnet under paper and a clip on top follows it.','냉장고 자석이 그림 종이를 붙잡아 두는 것도 이 덕분이에요.|That’s how a fridge magnet holds a drawing in place.'],
 ['magend',3,2,'💪','양 끝이 가장 세요|The ends are strongest','막대자석은 가운데보다 양 끝(극)의 힘이 가장 세요. 클립도 양 끝에 많이 붙어요.|A bar magnet pulls hardest at its two ends (the poles), not in the middle. Most clips stick to the ends.','자석 낚시 놀이를 할 때는 자석 끝을 물고기에 대 봐요.|In a magnet fishing game, use the end of the magnet.'],
 ['float',3,1,'🛟','뜨는 것, 가라앉는 것|Float or sink','나무, 코르크, 공기가 든 공은 물에 뜨고, 돌, 동전, 쇠 숟가락은 가라앉아요.|Wood, cork and balls full of air float. Stones, coins and metal spoons sink.','목욕할 때 장난감이 뜨는지 가라앉는지 실험해 봐요.|Test your bath toys: which float and which sink?'],
 ['heatcond',3,2,'🥄','열이 잘 통하는 금속|Metal carries heat','금속은 열을 잘 전해서, 뜨거운 국에 넣은 쇠 숟가락은 금방 뜨거워져요. 나무와 플라스틱은 열이 잘 안 통해요.|Metal passes heat along quickly, so a metal spoon in hot soup gets hot fast. Wood and plastic don’t pass heat well.','그래서 냄비 손잡이는 플라스틱이나 나무로 만들어요. 뜨거운 냄비는 오븐 장갑으로!|That’s why pot handles are plastic or wood. Use oven mitts for hot pots!'],
 ['material',3,1,'🧱','물질의 쓰임|Materials have jobs','유리는 투명해서 창문, 고무는 잘 늘어나서 고무줄, 쇠는 단단해서 못, 천은 부드러워서 옷을 만들어요.|Glass is clear, so we make windows. Rubber stretches, so we make rubber bands. Metal is strong, so we make nails. Cloth is soft, so we make clothes.','우비는 물이 스며들지 않는 재료로 만들어요.|Raincoats are made of materials that keep water out.'],
 ['recycle',3,1,'♻️','분리배출|Sorting recycling','종이, 플라스틱, 캔, 유리를 나눠서 버리면 다시 새 물건으로 만들 수 있어요. 음식물 쓰레기는 퇴비가 돼요.|When we sort paper, plastic, cans and glass, they can be made into new things. Food scraps can become compost.','병과 캔은 물로 헹군 다음 분리해서 버려요.|Rinse bottles and cans before you put them in the recycling.'],
 ['electric',3,2,'⚡','전기는 조심!|Be careful with electricity','금속과 물은 전기가 잘 통해요. 젖은 손으로 콘센트나 스위치를 만지면 감전될 수 있어요.|Electricity travels easily through metal and water. Touching plugs or switches with wet hands can give you a shock.','콘센트에는 절대 젓가락이나 핀을 넣지 마요.|Never put chopsticks, pins or anything else into an outlet.'],
 ['structure',3,2,'🏗️','튼튼한 구조물|Strong structures','세모(삼각형) 모양은 눌러도 잘 찌그러지지 않아서 다리, 송전탑, 자전거 틀에 쓰여요. 아래가 넓고 무거우면 잘 넘어지지 않아요. 종이도 접거나 둥글게 말면 훨씬 튼튼해져요.|Triangles don’t squash easily, so bridges, power towers and bike frames use them. A wide, heavy base keeps things from tipping over. Even paper gets much stronger when you fold it or roll it into a tube.','블록 탑을 쌓을 때 아래를 넓게 쌓으면 더 높이 올릴 수 있어요.|Build a block tower with a wide bottom and it can go higher.'],
 ['circuit',3,3,'🔋','전기 회로|Electric circuits','전지, 전선, 전구가 끊기지 않고 둥글게 이어져야(닫힌 회로) 전기가 흘러 불이 켜져요. 전지 두 개를 한 줄로 이으면(직렬연결) 전구가 더 밝아요. 쇠나 구리처럼 전기가 잘 통하는 것을 도체, 고무나 플라스틱처럼 안 통하는 것을 부도체라고 해요.|Electricity flows only around an unbroken loop of battery, wires and bulb (a closed circuit). Two batteries in a row (in series) make the bulb brighter. Things that carry electricity well, like iron and copper, are conductors; rubber and plastic are insulators.','전선 겉을 고무나 플라스틱으로 싸는 건 전기가 밖으로 새지 않게 하려는 거예요.|Wires are coated in rubber or plastic to keep the electricity inside.'],
 ['emag',3,3,'🧲','전자석|Electromagnets','쇠못에 전선을 감고 전기를 흘리면 자석이 돼요(전자석). 전기를 끊으면 자석의 힘이 사라지고, 전선을 많이 감거나 전지를 더 이으면 세져요. 전지 방향을 바꾸면 N극과 S극도 바뀌어요.|Wrap wire around an iron nail and run electricity through it, and it becomes a magnet (an electromagnet). Switch off the power and it stops being a magnet. More turns of wire or more batteries make it stronger. Flip the battery and the poles flip too.','고철 공장의 기중기, 스피커, 초인종에 전자석이 들어 있어요.|Scrapyard cranes, speakers and doorbells all have electromagnets inside.'],
 ['energy',3,3,'♻️','에너지 아껴 쓰기|Saving energy','석유, 석탄, 가스는 쓰면 다시 채우기 어렵고 태우면 공기를 더럽혀요. 햇빛, 바람, 흐르는 물로 만드는 재생에너지는 계속 쓸 수 있어요. 전기를 아끼면 자원도 아끼고 지구도 지켜요.|Oil, coal and gas run out and pollute the air when we burn them. Renewable energy from sunlight, wind and moving water won’t run out. Saving electricity saves resources and protects the planet.','안 쓰는 방의 불 끄기, 충전이 끝난 충전기 뽑기부터 해 봐요.|Start by switching off lights in empty rooms and unplugging finished chargers.'],
 ['metal',3,2,'🔩','금속의 성질|What metals are like','금속은 반짝이고 단단하며, 열과 전기가 잘 통해요. 두드리면 얇게 펴지고, 길게 늘여 전선을 만들 수 있어요. 철은 공기와 물을 만나면 녹이 슬지만 금은 녹슬지 않아요. 알루미늄은 가벼워서 캔과 비행기에 쓰여요.|Metals are shiny and strong, and they carry heat and electricity well. You can hammer them flat or stretch them into wire. Iron rusts with air and water, but gold doesn’t. Aluminum is light, so it’s used for cans and planes.','자전거 체인에 기름을 칠하거나 철에 페인트를 바르면 녹이 덜 슬어요.|Oil on a bike chain or paint on iron helps keep rust away.'],
 ['static',3,2,'🎈','정전기|Static electricity','풍선을 머리카락에 문지르면 풍선과 머리카락이 서로 끌어당겨요. 문지를 때 생긴 전기가 흐르지 않고 머물러 있는 것을 정전기라고 해요. 번개도 구름에 쌓인 아주 큰 정전기가 한꺼번에 흐르는 거예요.|Rub a balloon on your hair and they pull toward each other. Electricity made by rubbing that stays put instead of flowing is static electricity. Lightning is a giant spark of static electricity from a cloud.','겨울에 문고리에서 찌릿하면 정전기예요. 손에 로션을 바르면 덜해요.|That zap from a doorknob in winter is static. Hand lotion helps.'],
 ['transform',3,2,'🔄','에너지는 모습을 바꿔요|Energy changes form','전기는 전구에서 빛, 전기난로에서 열, 스피커에서 소리, 선풍기에서 움직임으로 바뀌어요. 음식 속 에너지는 우리 몸을 움직이게 하고, 건전지 속 에너지는 전기로 바뀌어요.|Electricity becomes light in a bulb, heat in a heater, sound in a speaker and motion in a fan. Energy in food makes our bodies move, and energy stored in a battery becomes electricity.','손을 비비면 움직임이 열로 바뀌어 따뜻해져요.|Rub your hands together: motion turns into heat.'],
 ['generate',3,3,'⚡','전기는 어떻게 만들까요?|How electricity is made','발전기 속에서 자석과 구리 전선 뭉치가 서로 돌면 전기가 생겨요. 수력은 떨어지는 물, 풍력은 바람, 화력은 석탄이나 가스를 태운 증기로 발전기를 돌려요. 태양광 판은 햇빛을 바로 전기로 바꿔요. 만든 전기는 전선을 타고 집까지 와요.|Inside a generator, magnets and coils of copper wire spin past each other and make electricity. Hydro plants turn generators with falling water, wind turbines with wind, and thermal plants with steam from burning coal or gas. Solar panels turn sunlight straight into electricity. Power lines carry it to our homes.','자전거 바퀴 발전기 전등도 바퀴가 돌 때 자석이 돌아서 불이 켜져요.|A bike dynamo light glows because a magnet spins as the wheel turns.'],
 ['density',3,2,'⚖️','무게와 밀도는 달라요|Weight vs. density','무게는 지구가 물체를 끌어당기는 힘의 크기예요. 밀도는 같은 크기(부피)일 때 얼마나 무거운지, 즉 얼마나 꽉 차 있는지예요. 물에 뜨고 가라앉는 것은 무게가 아니라 밀도로 정해져요. 큰 통나무는 무거워도 뜨고, 작은 동전은 가벼워도 가라앉아요.|Weight is how hard Earth pulls on something. Density is how heavy something is for its size, or how tightly packed it is. Floating and sinking depend on density, not weight: a huge log is heavy but floats, while a tiny coin is light but sinks.','솜 1kg과 쇠 1kg은 무게가 똑같아요! 하지만 쇠는 밀도가 커서 훨씬 작은 덩어리예요.|1 kg of cotton and 1 kg of iron weigh exactly the same! But iron is denser, so it’s a much smaller lump.'],
 ['density2',3,3,'🧮','밀도 계산과 달에서의 무게|Density math and weight on the Moon','밀도는 무게(질량)를 부피로 나눈 값이에요. 물 1cm³의 무게는 약 1g이라서 물의 밀도는 1g/cm³예요. 밀도가 이보다 작으면 물에 뜨고, 크면 가라앉아요. 달에서는 몸무게가 지구의 약 6분의 1이 되지만, 몸을 이루는 물질의 양과 밀도는 그대로예요.|Density is mass divided by volume. One cubic centimetre of water has a mass of about 1 g, so water’s density is 1 g/cm³. Anything less dense floats in water; anything denser sinks. On the Moon you weigh about one-sixth as much, but the amount of stuff in you and your density stay the same.','열기구는 속의 공기를 데워 밀도를 작게 만들어서 떠올라요.|A hot-air balloon rises because heating the air inside makes it less dense.'],
 ['buoy',3,2,'🏊','물이 밀어 올리는 힘, 부력|Buoyancy: water pushes up','물속에 들어간 물체는 물이 위로 밀어 올리는 힘을 받아요. 이 힘을 부력이라고 해요. 그래서 물속에서는 물건이 가볍게 느껴지고, 용수철저울의 눈금도 줄어들어요. 부력이 물체의 무게보다 크면 떠오르고, 작으면 가라앉아요. 소금물은 맹물보다 밀도가 커서 더 세게 밀어 올려요.|Anything in water gets pushed upward by the water. This push is called buoyancy. That’s why things feel lighter underwater and a spring scale reads less. If the push is bigger than the object’s weight, it rises; if it’s smaller, it sinks. Salt water is denser than plain water, so it pushes up harder.','구명조끼에는 공기나 가벼운 재료가 들어 있어 몸이 잘 뜨도록 도와줘요. 깊은 물에서는 꼭 입어요!|A life jacket is filled with air or light foam to help you float. Always wear one around deep water!'],
 ['buoy2',3,3,'🚢','부력과 밀도|Buoyancy and density','물체가 물속에서 받는 부력은 물체가 밀어낸 물의 무게와 같아요(아르키메데스의 원리). 그래서 물체의 밀도가 물보다 작으면 뜨고, 크면 가라앉아요. 쇠로 만든 배도 속이 비어 있어서 배 전체의 밀도가 물보다 작아 떠요. 밀도가 큰 소금물에서는 부력이 더 커서 더 잘 떠요.|The upward push on an object equals the weight of the water it pushes aside (Archimedes’ principle). So anything less dense than water floats and anything denser sinks. A steel ship floats because it’s hollow, which makes the whole ship less dense than water. Salty water is denser, so it pushes up harder and things float more easily.','잠수함은 물탱크에 물을 채우면 가라앉고, 공기로 물을 밀어내면 떠올라요.|A submarine dives by filling its tanks with water and rises by blowing the water out with air.'],
 // ---------------------------------------------------------------- 4 Kitchen Lab
 ['states',4,1,'🧊','고체·액체·기체|Solid, liquid, gas','얼음처럼 모양이 일정한 것은 고체, 물처럼 흘러서 그릇 모양이 되는 것은 액체, 수증기나 공기처럼 퍼져 나가는 것은 기체예요.|Things that keep their shape, like ice, are solids. Things that flow and take the shape of their container, like water, are liquids. Things that spread out to fill a space, like steam and air, are gases.','주스는 액체, 컵은 고체, 풍선 속 공기는 기체!|Juice is a liquid, the cup is a solid and the air in a balloon is a gas!'],
 ['melt',4,1,'🍦','녹기|Melting','고체가 열을 받으면 액체가 돼요. 얼음은 녹아서 물이 되고, 초콜릿은 손에서 녹아요.|When a solid warms up, it can melt into a liquid. Ice melts into water and chocolate melts in your hand.','아이스크림은 햇볕 아래에서 빨리 녹으니 그늘에서 먹어요.|Ice cream melts fast in the sun, so eat it in the shade.'],
 ['freeze',4,1,'❄️','얼기|Freezing','물은 0°C보다 차가워지면 얼음이 돼요. 캐나다의 겨울에는 호수도 꽁꽁 얼어요.|Water turns to ice when it gets colder than 0°C. In a Canadian winter, even lakes freeze solid.','물은 얼면 부피가 커져서, 물을 꽉 채운 유리병을 얼리면 깨질 수 있어요.|Water grows bigger when it freezes, so a full glass bottle in the freezer can crack.'],
 ['boil',4,1,'♨️','끓기|Boiling','물은 100°C가 되면 보글보글 끓으며 수증기(기체)로 변해요.|Water bubbles and boils at 100°C, turning into water vapor (a gas).','끓는 물과 김은 아주 뜨거우니 가까이 가지 마요.|Boiling water and steam are very hot. Stay back!'],
 ['evap',4,2,'💨','증발|Evaporation','물은 끓지 않아도 조금씩 수증기가 되어 날아가요. 그래서 물웅덩이가 마르고 빨래가 말라요. 햇볕이 쨍하고 바람이 불면 더 빨리 말라요.|Water slowly turns into vapor even without boiling. That’s how puddles dry up and laundry dries. Sun and wind make it happen faster.','젖은 수건은 펼쳐서 널어야 빨리 말라요.|Spread out a wet towel and it dries faster.'],
 ['condense',4,2,'💧','응결|Condensation','공기 속 수증기가 차가운 것에 닿으면 다시 물방울이 돼요. 차가운 컵 겉의 물방울, 샤워 후 뿌연 거울, 겨울 입김이 모두 그래요.|When water vapor in the air touches something cold, it turns back into water drops. Drops on a cold cup, a foggy bathroom mirror and your breath on a winter day are all condensation.','차가운 음료 컵 밑에는 받침을 깔아요.|Put a coaster under a cold drink.'],
 ['dissolve',4,1,'🍬','녹아서 섞이기(용해)|Dissolving','설탕이나 소금은 물에 녹아서 안 보이게 섞여요. 모래는 녹지 않아요. 따뜻한 물에서, 저어 주면 더 빨리 녹아요.|Sugar and salt dissolve in water and disappear from sight. Sand doesn’t dissolve. Warm water and stirring make things dissolve faster.','코코아 가루는 따뜻한 우유에 넣고 저어야 잘 녹아요.|Stir cocoa powder into warm milk so it dissolves well.'],
 ['thermo',4,1,'🌡️','온도계|Thermometers','온도계를 보면 얼마나 뜨겁고 차가운지 숫자로 알 수 있어요. 단위는 °C(섭씨)예요. 0°C보다 낮으면 영하예요.|A thermometer tells us how hot or cold something is with a number. We measure in °C (degrees Celsius). Below 0°C is “below zero”.','일기예보의 −10°C는 영하 10도, 꽁꽁 언 날씨예요.|−10°C in the forecast means ten below zero: freezing cold!'],
 ['heatflow',4,2,'🔥','열은 뜨거운 데서 차가운 데로|Heat moves from hot to cold','열은 언제나 뜨거운 쪽에서 차가운 쪽으로 이동해요. 그래서 뜨거운 코코아는 식고, 얼음을 넣은 음료는 시원해져요.|Heat always moves from something hot to something colder. That’s why hot cocoa cools down and ice cools a drink.','두꺼운 옷이나 수건은 열이 빠져나가는 걸 막아 줘요.|Thick clothes and towels slow heat from escaping.'],
 ['fridge',4,1,'🥛','냉장고의 비밀|Why we use a fridge','세균은 따뜻한 곳에서 빨리 늘어나요. 음식을 차갑게 두면 덜 상해요.|Germs grow fast where it’s warm. Keeping food cold helps it stay fresh.','우유와 남은 음식은 바로 냉장고에 넣어요.|Put milk and leftovers back in the fridge right away.'],
 ['gas',4,2,'🎈','기체의 성질|Gases','공기 같은 기체도 무게가 있고 공간을 차지해요. 기체는 따뜻해지면 부피가 커지고 차가워지면 작아져요. 우리가 숨 쉬는 산소, 탄산음료 속 이산화탄소, 풍선 속 헬륨처럼 여러 기체가 쓰여요.|Gases like air have weight and take up space. A gas spreads out when it warms up and shrinks when it cools. We use many gases: oxygen to breathe, carbon dioxide in fizzy drinks and helium in floating balloons.','찌그러진 탁구공을 뜨거운 물에 넣으면 펴질 수 있어요(꼭 어른과 함께!).|A dented ping-pong ball can pop back out in hot water (only with a grown-up!).'],
 ['microbe',4,2,'🦠','부엌의 작은 생물|Tiny living things in the kitchen','곰팡이와 버섯은 식물이 아닌 균류예요. 눈에 안 보이는 세균도 있어요. 김치, 요구르트, 치즈, 빵은 이로운 균류와 세균 덕분에 만들어지지만, 음식을 상하게 하거나 병을 옮기는 것도 있어요.|Molds and mushrooms are fungi, not plants. There are also bacteria too tiny to see. Kimchi, yogurt, cheese and bread are made with help from good fungi and bacteria, but others spoil food or make us sick.','빵에 곰팡이가 피면 그 부분만 떼지 말고 통째로 버려요.|If bread gets moldy, throw out the whole loaf, not just the moldy bit.'],
 ['acidbase',4,3,'🧪','산과 염기|Acids and bases','식초, 레몬즙, 탄산수는 산성이고, 비눗물, 베이킹소다 물, 유리 세정제는 염기성이에요. 리트머스 종이나 적양배추 물 같은 지시약으로 구별할 수 있어요. 산성 용액과 염기성 용액을 섞으면 서로의 성질이 약해져요.|Vinegar, lemon juice and soda water are acids. Soapy water, baking soda water and glass cleaner are bases. Indicators like litmus paper or red cabbage juice tell them apart. Mix an acid and a base and they weaken each other.','생선 요리에 레몬즙을 뿌리면 비린내가 줄어요. 산이 비린내 나는 물질을 약하게 하거든요.|Lemon juice on fish cuts the fishy smell: the acid weakens the smelly stuff.'],
 ['solution',4,3,'🥄','용액의 진하기|How strong a solution is','설탕이 물에 녹아 고르게 섞인 것을 용액이라고 해요. 같은 양의 물에 녹은 설탕이 많을수록 진한 용액이에요. 물에 녹는 양에는 한계가 있고, 따뜻한 물일수록 더 많이 녹아요. 녹은 설탕은 사라진 게 아니라서 무게는 그대로예요.|When sugar dissolves and mixes evenly into water, it makes a solution. The more sugar in the same amount of water, the stronger it is. Water can only hold so much, and warm water holds more. Dissolved sugar hasn’t vanished, so the weight stays the same.','진한 소금물에는 달걀이 둥둥 떠요. 바닷물에서 몸이 더 잘 뜨는 것과 같아요.|An egg floats in very salty water, just like you float more easily in the sea.'],
 ['burn',4,3,'🔥','불이 타는 조건|What fire needs','물질이 타려면 탈 물질, 산소(공기), 불이 붙을 만큼 높은 온도가 모두 있어야 해요. 셋 중 하나만 없애도 불이 꺼져요. 프라이팬 기름에 불이 붙으면 물을 붓지 말고 뚜껑을 덮어요.|Fire needs three things: fuel, oxygen (air) and enough heat. Take away any one and the fire goes out. If oil in a pan catches fire, never pour water on it; cover it with a lid.','부엌에서 불이 나면 바로 어른에게 알리고, 소화기 위치를 미리 알아 둬요.|Tell a grown-up right away about any kitchen fire, and know where the fire extinguisher is.'],
 ['change',4,3,'🍞','물질이 바뀌는 변화|Changes in matter','얼음이 녹거나 종이를 자르는 것은 물질의 성질은 그대로인 변화예요. 빵을 굽거나 나무가 타거나 쇠가 녹스는 것은 성질이 다른 새 물질이 생기는 변화예요. 이런 변화는 되돌리기 어려워요.|Melting ice or cutting paper doesn’t change what the material is. Baking bread, burning wood and rusting iron make brand-new substances, and those changes are hard to undo.','삶은 달걀은 다시 날달걀로 되돌릴 수 없어요!|Once an egg is boiled, you can’t turn it back into a raw egg!'],
 ['fizz',4,1,'🫧','부글부글 거품 실험|Fizzy reactions','식초에 베이킹소다를 넣으면 부글부글 거품이 나요. 두 물질이 만나 이산화탄소라는 새 기체가 생겼기 때문이에요. 이 거품으로 화산 놀이를 할 수 있어요.|Add baking soda to vinegar and it fizzes and foams. The two react and make a new gas called carbon dioxide. You can use it to make a pretend volcano!','실험할 때는 보안경을 쓰고 어른과 함께 해요.|Wear goggles and do experiments with a grown-up.'],
 ['chemsafe',4,1,'☠️','집 안 화학 제품 안전|Chemical safety at home','세제, 약, 표백제 같은 화학 제품은 어른만 다뤄요. 원래 통에 담아 두고, 모르는 병은 냄새 맡거나 맛보지 않아요. 병에 그려진 해골이나 불꽃 그림은 위험하다는 표시예요.|Cleaners, medicines and bleach are for grown-ups to handle. Keep them in their own containers, and never sniff or taste an unknown bottle. A skull or flame picture on a bottle means danger.','누가 잘못 삼켰다면 바로 어른에게 알리고 응급 전화를 해요.|If someone swallows something, tell a grown-up and call for help right away.'],
 ['acidlife',4,2,'🍊','신맛은 산성, 미끈미끈은 염기성|Sour acids, slippery bases','레몬, 식초, 오렌지 주스처럼 신맛이 나는 것은 대개 산성이에요. 비눗물처럼 만지면 미끈미끈한 것은 대개 염기성이에요. 하지만 모르는 액체는 절대 맛보거나 만지지 말고 지시약으로 알아봐요.|Sour things like lemons, vinegar and orange juice are usually acids. Things that feel slippery, like soapy water, are usually bases. Never taste or touch an unknown liquid; test it with an indicator.','책에서 과일을 “알칼리성 식품”이라고 하는 건 음식을 태운 재로 나눈 거예요. 오렌지 주스 자체는 산성이에요.|When books call fruit an “alkaline food,” they mean the ash left after burning it. Orange juice itself is acidic.'],
 ['kitchenchem',4,2,'🍎','부엌 속 화학|Chemistry in the kitchen','깎은 사과가 갈색으로 변하는 것은 공기 속 산소와 만나서예요. 레몬즙을 바르면 늦출 수 있어요. 빵 반죽은 효모가 만든 이산화탄소로 부풀고, 세제는 기름때를 감싸서 물에 씻겨 나가게 해요.|Cut apples turn brown when they meet oxygen in the air; lemon juice slows it down. Bread dough rises from carbon dioxide made by yeast, and dish soap wraps around grease so water can wash it away.','세제나 표백제는 서로 섞으면 독한 기체가 나올 수 있어요. 절대 섞지 말아요!|Mixing cleaners or bleach can make poisonous gas. Never mix them!'],
 ['flame',4,2,'🎆','불꽃 반응|Flame tests','어떤 금속을 불꽃에 넣으면 금속마다 다른 색 불꽃이 나요. 구리는 청록색, 나트륨(소금)은 노란색, 리튬은 빨간색, 칼륨은 보라색이에요. 불꽃놀이의 여러 색이 바로 이 원리예요.|Put certain metals into a flame and each gives its own color: copper blue-green, sodium (in salt) yellow, lithium red, potassium violet. That’s how fireworks get their colors.','국이 끓어 넘쳐 가스 불에 닿으면 불꽃이 노랗게 변해요. 국 속 소금의 나트륨 때문이에요.|When salty soup boils over onto a gas flame, the flame flashes yellow from the sodium in the salt.'],
 ['heatmove',4,3,'♨️','열이 이동하는 세 가지 방법|Three ways heat moves','고체에서는 열이 맞닿은 곳을 따라 전해지고(전도), 물이나 공기는 데워진 부분이 위로 올라가며 돌면서 열을 옮기고(대류), 햇볕이나 모닥불의 열은 곧장 날아와요(복사).|In solids, heat passes along through touching parts (conduction). In water and air, warm parts rise and circulate, carrying heat (convection). Heat from the Sun or a campfire travels straight to you (radiation).','에어컨은 위쪽에, 난로는 아래쪽에 두면 방 전체가 고르게 시원하고 따뜻해져요.|Put an air conditioner up high and a heater down low, and the whole room cools or warms evenly.'],
 ['separate',4,3,'⚗️','섞인 것 나누기|Separating mixtures','섞인 물질은 성질 차이를 이용해 나눠요. 크기가 다르면 체로, 철이 섞였으면 자석으로, 물에 녹는 것과 안 녹는 것은 거름종이로 거르고, 녹아 있는 소금은 물을 증발시켜 얻어요.|Mixtures are separated using differences in their properties: a sieve for different sizes, a magnet for iron, filter paper for things that do and don’t dissolve, and evaporation to get dissolved salt back.','재활용 공장도 자석과 바람, 물을 이용해 쓰레기를 나눠요.|Recycling plants sort waste with magnets, air and water.'],
 ['volmass',4,2,'🧃','들이와 무게의 단위|Litres and grams','L(리터)와 mL(밀리리터)는 들이(담을 수 있는 양), kg(킬로그램)과 g(그램)은 무게를 나타내요. 1L = 1000mL, 1kg = 1000g이에요. 물 1mL의 무게는 약 1g이에요.|Litres (L) and millilitres (mL) measure how much something holds; kilograms (kg) and grams (g) measure weight. 1 L = 1000 mL and 1 kg = 1000 g. One millilitre of water weighs about 1 gram.','약을 먹을 때는 숟가락 대신 mL 눈금이 있는 계량컵이나 계량 주사기로 정확히 재요.|For medicine, measure exactly with a cup or syringe marked in mL, not a kitchen spoon.'],
 ['indicators',4,3,'🧻','지시약 삼총사|Three indicator tests','지시약은 산성과 염기성에 따라 색이 변하는 물질이에요. 푸른색 리트머스 종이는 산성에서 붉게, 붉은색 리트머스 종이는 염기성에서 푸르게 변해요. BTB 용액은 산성에서 노란색, 중성에서 초록색, 염기성에서 파란색이에요. 페놀프탈레인 용액은 염기성에서만 붉은색으로 변해요.|An indicator changes color depending on whether something is acidic or basic. Blue litmus paper turns red in an acid, and red litmus paper turns blue in a base. BTB solution is yellow in an acid, green when neutral and blue in a base. Phenolphthalein turns pinkish-red only in a base.','적양배추, 포도 껍질, 검은콩 삶은 물로 집에서도 천연 지시약을 만들 수 있어요.|You can make natural indicators at home from red cabbage, grape skins or the water from boiled black beans.'],
 ['neutral',4,3,'🤝','산과 염기가 만나면(중화)|When acids meet bases','산성 용액에 염기성 용액을 조금씩 넣으면 산성이 점점 약해지다가 중성이 되고, 더 넣으면 염기성이 돼요. 이렇게 산과 염기가 만나 서로의 성질을 약하게 만드는 것을 중화라고 해요. BTB 용액을 넣고 섞으면 색깔로 이 변화를 볼 수 있어요.|Add a base to an acid little by little and the acid gets weaker, becomes neutral, then turns basic if you keep going. When an acid and a base weaken each other like this, it’s called neutralization. With BTB in the mix, you can watch it happen by color.','생선 요리에 레몬즙을 뿌리면 비린내를 내는 염기성 물질이 약해져요.|Squeezing lemon on fish weakens the basic stuff that makes the fishy smell.'],
 ['acidpower',4,3,'🥚','산과 염기는 물질을 바꿔요|Acids and bases change things','산성 용액에 달걀 껍데기, 조개껍데기, 대리석을 넣으면 거품이 생기며 녹아요. 염기성 용액에 두부나 삶은 달걀 흰자를 넣으면 흐물흐물해지며 녹아요. 그래서 산성비는 대리석 조각상을 조금씩 녹이고, 염기성인 하수구 세정제는 머리카락 뭉치를 녹여 막힌 하수구를 뚫어요.|Put eggshell, seashell or marble into an acid and it fizzes and dissolves. Put tofu or boiled egg white into a base and it turns mushy and breaks down. That’s why acid rain slowly wears away marble statues, and drain cleaner, which is a base, dissolves clumps of hair to unclog drains.','강한 산이나 염기는 피부와 눈을 다치게 해요. 실험할 때는 보안경과 장갑을 껴요.|Strong acids and bases can hurt your skin and eyes. Wear goggles and gloves for experiments.'],
 ['ph',4,3,'🔢','산성과 염기성을 숫자로, pH|pH: acids and bases as numbers','pH는 산성과 염기성의 세기를 0부터 14까지의 숫자로 나타낸 거예요. 7은 중성이고, 7보다 작을수록 강한 산성, 7보다 클수록 강한 염기성이에요. 레몬즙은 약 2, 오렌지 주스는 약 4, 맹물은 약 7, 비눗물은 약 10이에요.|pH shows how acidic or basic something is with a number from 0 to 14. 7 is neutral. The lower the number below 7, the stronger the acid; the higher above 7, the stronger the base. Lemon juice is about 2, orange juice about 4, plain water about 7 and soapy water about 10.','pH 시험지는 색깔로 pH 숫자를 대략 알려 줘요.|pH paper shows the rough pH number by its color.'],
 // ---------------------------------------------------------------- 5 Green Forest
 ['plantneeds',5,1,'🌱','식물에게 필요한 것|What plants need','식물이 자라려면 햇빛, 물, 공기, 그리고 영양분이 있는 흙이 필요해요. 물이 너무 많아도 안 좋아요.|Plants need sunlight, water, air and soil with nutrients to grow. Too much water is bad, too.','화분은 햇빛 드는 창가에 두고, 흙이 마르면 물을 줘요.|Keep a plant by a sunny window and water it when the soil is dry.'],
 ['plantparts',5,1,'🌷','식물의 부분|Parts of a plant','뿌리는 물을 빨아들이고, 줄기는 물을 나르고, 잎은 햇빛으로 양분을 만들고, 꽃은 씨앗을 만들어요.|Roots soak up water, stems carry it, leaves make food from sunlight and flowers make seeds.','당근은 뿌리, 상추는 잎, 브로콜리는 꽃봉오리를 먹는 거예요!|A carrot is a root, lettuce is a leaf and broccoli is flower buds!'],
 ['lifecycle',5,1,'🦋','나비의 한살이|A butterfly’s life cycle','나비는 알 → 애벌레 → 번데기 → 나비로 자라요. 번데기 속에서 모습이 완전히 바뀌어요.|A butterfly grows from egg → caterpillar → chrysalis → butterfly. It changes completely inside the chrysalis.','봄·여름에 잎 뒷면을 살펴보면 작은 알이나 애벌레를 볼 수 있어요.|Look under leaves in spring and summer to spot tiny eggs or caterpillars.'],
 ['frog',5,1,'🐸','개구리의 한살이|A frog’s life cycle','개구리는 알 → 올챙이 → 다리가 난 올챙이 → 개구리로 자라요. 올챙이는 물속에서 아가미로 숨 쉬어요.|A frog grows from egg → tadpole → tadpole with legs → frog. Tadpoles breathe underwater with gills.','봄 연못의 젤리 같은 알 덩어리가 개구리 알이에요.|The jelly blobs in a spring pond are frog eggs.'],
 ['insect',5,1,'🐞','곤충|Insects','곤충은 다리가 6개이고 몸이 머리·가슴·배 3부분이에요. 거미는 다리가 8개라서 곤충이 아니에요.|Insects have 6 legs and 3 body parts: head, thorax and abdomen. Spiders have 8 legs, so they are not insects.','개미, 무당벌레, 벌, 나비, 메뚜기는 모두 곤충이에요.|Ants, ladybugs, bees, butterflies and grasshoppers are all insects.'],
 ['groups',5,2,'🐋','동물 무리|Animal groups','포유류는 털이 있고 새끼에게 젖을 먹여요(고래·박쥐도!). 새는 깃털과 부리가 있고 알을 낳아요. 물고기는 아가미로 숨 쉬어요.|Mammals have hair and feed their babies milk (whales and bats too!). Birds have feathers and beaks and lay eggs. Fish breathe with gills.','펭귄은 날지 못해도 깃털이 있는 새예요.|Penguins can’t fly, but they have feathers: they’re birds!'],
 ['foodchain',5,2,'🦊','먹이 사슬|Food chains','풀 → 토끼 → 여우처럼 먹고 먹히는 관계를 먹이 사슬이라고 해요. 모든 먹이 사슬은 햇빛을 받는 식물에서 시작해요.|Grass → rabbit → fox is a food chain: who eats whom. Every food chain starts with plants that use sunlight.','한 동물이 사라지면 먹이 사슬의 다른 동물도 힘들어져요.|If one animal disappears, others in the food chain have a hard time.'],
 ['eaters',5,2,'🦷','초식·육식·잡식|Plant-eaters and meat-eaters','풀을 먹는 동물은 초식동물(토끼, 사슴), 고기를 먹는 동물은 육식동물(늑대, 사자), 둘 다 먹으면 잡식동물(곰, 사람)이에요.|Animals that eat plants are herbivores (rabbits, deer). Meat-eaters are carnivores (wolves, lions). Animals that eat both are omnivores (bears, people).','우리도 채소와 고기를 골고루 먹는 잡식동물이에요.|We are omnivores too: we eat both veggies and meat.'],
 ['seasonlife',5,1,'🍁','계절과 생물|Seasons and living things','가을에는 단풍잎이 물들어 떨어지고, 캐나다 거위는 따뜻한 남쪽으로 날아가요. 곰은 겨울잠을 자요.|In fall, leaves change color and drop, and Canada geese fly south to warmer places. Bears sleep through the winter.','이른 봄에는 단풍나무 수액을 모아 메이플 시럽을 만들어요.|In early spring, maple sap is collected to make maple syrup.'],
 ['decomp',5,2,'🍄','자연의 재활용꾼|Nature’s recyclers','지렁이와 버섯은 죽은 잎과 음식 찌꺼기를 잘게 분해해서 기름진 흙으로 만들어요.|Worms and mushrooms break down dead leaves and food scraps into rich soil.','음식물 쓰레기로 퇴비를 만들면 텃밭 흙이 좋아져요.|Compost made from food scraps makes garden soil healthy.'],
 ['habitat',5,2,'🏜️','사는 곳에 맞는 생김새|Built for where they live','동물과 식물은 사는 곳에 맞는 생김새를 가지고 있어요. 북극곰은 두꺼운 털과 지방으로 추위를 견디고, 사막여우는 큰 귀로 몸의 열을 내보내요. 선인장은 가시 모양 잎과 두꺼운 줄기로 물을 아껴요.|Animals and plants have bodies that fit where they live. Polar bears have thick fur and fat for the cold, and fennec foxes let heat out through their huge ears. Cacti have spine-shaped leaves and thick stems to save water.','캐나다 북쪽에 사는 북극여우와 순록도 추위를 이기는 몸을 가졌어요.|Arctic foxes and caribou in northern Canada have bodies made for the cold too.'],
 ['metamorph',5,2,'🦗','한살이는 여러 가지|Different life cycles','나비처럼 알 → 애벌레 → 번데기 → 어른벌레로 자라는 것을 완전 탈바꿈, 메뚜기와 잠자리처럼 번데기 없이 어른벌레가 되는 것을 불완전 탈바꿈이라고 해요. 강아지나 사람은 어미와 닮은 모습으로 태어나 자라요.|Butterflies grow egg → larva → pupa → adult: complete metamorphosis. Grasshoppers and dragonflies skip the pupa: incomplete metamorphosis. Puppies and people are born looking like their parents and just grow.','봄에 공원에서 애벌레나 메뚜기를 찾아 관찰 일기를 써 봐요.|In spring, look for caterpillars or grasshoppers in the park and keep an observation diary.'],
 ['photosyn',5,3,'🍃','광합성|Photosynthesis','식물의 잎은 햇빛을 받아, 뿌리에서 올라온 물과 공기 속 이산화탄소로 양분(녹말)을 만들어요. 이때 산소를 내보내서 우리가 숨 쉴 수 있어요.|Leaves use sunlight to turn water from the roots and carbon dioxide from the air into food (starch). They give off oxygen, which we breathe.','숲속 공기가 상쾌한 것도 나무가 산소를 내보내기 때문이에요.|Forest air feels fresh partly because trees give off oxygen.'],
 ['transpire',5,3,'💦','증산 작용|Plants give off water','뿌리가 빨아들인 물은 줄기를 따라 잎까지 올라가고, 잎의 작은 구멍(기공)으로 수증기가 되어 빠져나가요. 이것을 증산 작용이라고 해요. 덕분에 물이 위로 끌려 올라가고 식물의 온도도 낮아져요.|Water taken in by the roots travels up the stem to the leaves and escapes as water vapor through tiny holes called stomata. This is transpiration. It pulls water upward and cools the plant.','더운 날 큰 나무 그늘이 시원한 건 나무가 물을 내보내기 때문이기도 해요.|Shade under a big tree on a hot day feels cool partly because the tree gives off water.'],
 ['seeds',5,3,'🌬️','씨가 퍼지는 방법|How seeds travel','식물은 걸어 다닐 수 없어서 씨를 멀리 보내는 방법이 있어요. 민들레 씨는 바람을 타고, 도꼬마리 씨는 동물 털에 붙어서, 코코넛은 물에 떠서 퍼져요. 맛있는 열매는 동물이 먹고 씨를 퍼뜨려 줘요.|Plants can’t walk, so they send their seeds away in clever ways. Dandelion seeds ride the wind, burrs hitch rides on animal fur and coconuts float on water. Tasty fruits get eaten, and animals spread the seeds.','산책하고 나서 바지에 붙은 가시 씨앗을 찾아봐요. 동물 털에 붙어 가는 씨예요!|After a walk, look for prickly seeds stuck to your pants. They travel on animal fur!'],
 ['balance',5,3,'⚖️','생태계의 균형|Balance in nature','생태계의 생물들은 먹이그물로 서로 이어져 있어요. 양분을 만드는 생산자, 먹는 소비자, 죽은 것을 분해하는 분해자가 함께 살아요. 한 생물이 갑자기 사라지거나 너무 많아지면 균형이 깨질 수 있어요.|Living things in an ecosystem are linked in a food web: producers make food, consumers eat, and decomposers break down dead things. If one kind suddenly disappears or grows too many, the balance can break.','쓰레기 줍기, 들꽃 꺾지 않기도 생태계를 지키는 일이에요.|Picking up litter and leaving wildflowers alone help protect ecosystems.'],
 ['plantcycle',5,1,'🌱','식물의 한살이|A plant’s life cycle','씨앗을 심고 물을 주면 싹이 터요. 떡잎이 나오고 본잎과 줄기가 자라면 꽃이 피고, 꽃이 진 자리에 열매가 열려요. 열매 속 씨앗을 다시 심으면 한살이가 되풀이돼요. 벼나 해바라기처럼 한 해 만에 한살이를 마치는 식물도 있고, 사과나무처럼 여러 해를 사는 식물도 있어요.|Plant a seed and water it, and it sprouts. Seed leaves come first, then true leaves and a stem grow, flowers bloom, and fruit forms where the flowers were. Plant the seeds from the fruit and the life cycle starts again. Some plants, like rice and sunflowers, finish their whole life in one year; others, like apple trees, live for many years.','강낭콩을 물에 적신 휴지 위에 두면 며칠 만에 뿌리가 나오는 걸 볼 수 있어요.|Put a bean on a damp paper towel and you’ll see a root come out in a few days.'],
 ['vertebrate',5,3,'🦴','등뼈가 있는 동물, 없는 동물|Backbone or no backbone','동물은 등뼈(척추)가 있는 척추동물과 없는 무척추동물로 나눌 수 있어요. 척추동물은 포유류, 조류, 파충류, 양서류, 어류의 다섯 무리예요. 곤충, 거미, 달팽이, 문어, 지렁이는 등뼈가 없는 무척추동물이에요. 지구에 사는 동물은 대부분 무척추동물이에요.|Animals can be split into vertebrates, which have a backbone, and invertebrates, which don’t. Vertebrates come in five groups: mammals, birds, reptiles, amphibians and fish. Insects, spiders, snails, octopuses and earthworms have no backbone. Most animals on Earth are invertebrates.','파충류(뱀, 거북, 도마뱀)는 몸이 비늘로 덮여 있고, 양서류(개구리, 도롱뇽)는 피부가 촉촉하며 물과 땅을 오가며 살아요.|Reptiles (snakes, turtles, lizards) are covered in scales; amphibians (frogs, salamanders) have moist skin and live both in water and on land.'],
 ['cell',5,3,'🔬','생물은 세포로 되어 있어요|Living things are made of cells','모든 생물은 아주 작은 세포로 이루어져 있어요. 세포는 너무 작아서 현미경으로 봐야 보여요. 세포는 세포막으로 둘러싸여 있고 대부분 핵이 있어요. 식물 세포는 단단한 세포벽이 있어 모양이 반듯하고, 초록색 엽록체가 있어 광합성을 해요. 동물 세포는 세포벽이 없어 모양이 둥글둥글해요.|All living things are made of tiny cells. Cells are so small you need a microscope to see them. Each cell is wrapped in a cell membrane, and most have a nucleus. Plant cells also have a stiff cell wall that gives them neat shapes, plus green chloroplasts for photosynthesis. Animal cells have no cell wall, so they are rounder.','양파 껍질 안쪽의 얇은 막이나 입안 볼 안쪽을 현미경으로 보면 세포를 볼 수 있어요.|Under a microscope you can see cells in the thin skin inside an onion or from the inside of your cheek.'],
 ['biodiv',5,3,'🐯','생물 다양성을 지켜요|Protecting biodiversity','지구에는 아주 많은 종류의 생물이 서로 이어져 살아요. 이것을 생물 다양성이라고 해요. 숲이 사라지거나, 물과 공기가 오염되거나, 너무 많이 잡거나, 기후가 변하면 생물이 줄어들어 멸종 위기에 놓여요. 한번 멸종한 생물은 다시 돌아오지 않아요.|Earth is home to a huge variety of living things that depend on one another. This is called biodiversity. When forests disappear, water and air get polluted, too many animals are caught or the climate changes, living things decline and can become endangered. Once a species goes extinct, it never comes back.','한국에서는 지리산에 반달가슴곰을 풀어 다시 살게 하고 있어요. 동물이 사는 곳을 지키는 것이 가장 중요해요.|In Korea, Asiatic black bears have been released in Jirisan to bring them back. Protecting the places animals live matters most.'],
 // ---------------------------------------------------------------- 6 Sky Station
 ['dayobs',6,1,'🌗','낮과 밤|Day and night','낮에는 해가 떠 있어서 밝고 따뜻해요. 해가 지면 밤이 되어 어둡고 서늘해지고, 하늘에 달과 별이 보여요.|During the day the Sun is up, so it’s bright and warm. When the Sun sets it becomes night: dark and cooler, with the Moon and stars in the sky.','별을 보려면 도시 불빛에서 먼 캠핑장이 좋아요.|Stars are easiest to see far from city lights, like at a campsite.'],
 ['daynight',6,2,'🌍','지구의 자전|Earth spins','지구는 팽이처럼 하루에 한 바퀴 돌아요(자전). 해를 바라보는 쪽은 낮, 반대쪽은 밤이에요.|Earth spins like a top, once every day. The side facing the Sun has day; the other side has night.','한국이 낮일 때 캐나다는 밤이에요. 할머니 할아버지께 전화할 때 시간을 확인해요!|When it’s daytime in Korea, it’s night in Canada. Check the time before you call family far away!'],
 ['sunstar',6,1,'☀️','해는 별이에요|The Sun is a star','해(태양)는 스스로 빛과 열을 내는 아주 큰 별이에요. 가장 가까운 별이라서 크고 밝게 보여요.|The Sun is a huge star that makes its own light and heat. It looks big and bright because it’s the closest star to us.','해를 맨눈으로 똑바로 보면 눈을 다쳐요. 절대 보지 마요!|Never look straight at the Sun. It can hurt your eyes!'],
 ['moonphase',6,2,'🌙','달의 모양 변화|Moon phases','달은 스스로 빛나지 않고 햇빛을 반사해요. 약 한 달 동안 초승달 → 반달 → 보름달 → 반달 → 그믐달로 모양이 바뀌어 보여요.|The Moon doesn’t make light; it reflects sunlight. Over about a month it seems to change from crescent → half → full → half → crescent.','오늘 밤 달 모양을 그려 두고 일주일 뒤와 비교해 봐요.|Draw tonight’s Moon and compare it with the Moon a week later.'],
 ['watercycle',6,1,'🔄','물의 여행|The water cycle','바다와 강의 물이 증발해 수증기가 되고, 하늘에서 식어 구름이 되고, 비나 눈으로 내려 다시 강과 바다로 가요.|Water from oceans and rivers evaporates into vapor, cools into clouds, falls as rain or snow and flows back to rivers and oceans.','오늘 마신 물도 예전에는 구름이었을지 몰라요!|The water you drank today may once have been a cloud!'],
 ['clouds',6,1,'☁️','구름과 비|Clouds and rain','구름은 아주 작은 물방울이나 얼음 알갱이가 모인 거예요. 물방울이 커지고 무거워지면 비나 눈이 되어 떨어져요.|Clouds are made of tiny water drops or ice crystals. When the drops grow big and heavy, they fall as rain or snow.','먹구름이 몰려오면 우산을 챙겨요.|When dark clouds roll in, grab an umbrella.'],
 ['rainbow',6,1,'🌈','무지개|Rainbows','햇빛 속에는 여러 색이 숨어 있어요. 비 온 뒤 해를 등지고 서면 물방울이 햇빛을 나눠서 무지개가 보여요(빨주노초파남보).|Sunlight hides many colors. After rain, stand with the Sun behind you and water drops split the light into a rainbow (red, orange, yellow, green, blue, indigo, violet).','맑은 날 해를 등지고 분무기를 뿌리면 작은 무지개를 만들 수 있어요.|On a sunny day, spray a mist with the Sun behind you to make a mini rainbow.'],
 ['thunder',6,1,'⚡','번개와 천둥|Lightning and thunder','빛은 소리보다 훨씬 빨라서 번개가 먼저 보이고 천둥은 나중에 들려요. 3초를 세면 약 1km 떨어진 거예요.|Light is much faster than sound, so we see lightning before we hear thunder. Every 3 seconds you count is about 1 km away.','천둥이 들리면 바로 건물 안으로! 큰 나무 아래는 위험해요.|When thunder roars, go indoors! Never shelter under a tall tree.'],
 ['seasons',6,1,'🍂','사계절|The four seasons','봄·여름·가을·겨울이 차례로 돌아와요. 여름에는 낮이 길고 덥고, 겨울에는 낮이 짧고 추워요.|Spring, summer, fall and winter come around in order. Summer has long, warm days; winter has short, cold days.','캐나다의 겨울에는 오후 5시면 벌써 깜깜해져요.|In a Canadian winter, it can be dark by 5 p.m.'],
 ['orbit',6,3,'🪐','공전과 기울기|Earth’s orbit and tilt','지구는 1년에 한 바퀴 해 둘레를 돌아요(공전). 지구가 기울어져 있어서 계절이 생겨요. 여름이 더운 건 해와 가까워서가 아니에요!|Earth travels around the Sun once a year (its orbit). Earth is tilted, and that tilt causes the seasons. Summer is not hot because we are closer to the Sun!','캐나다가 여름일 때 남반구의 호주는 겨울이에요.|When it’s summer in Canada, it’s winter in Australia.'],
 ['dress',6,1,'🧣','날씨에 맞는 옷차림|Dressing for the weather','추운 날에는 여러 겹 입고 모자와 장갑으로 귀와 손가락을 지켜요. 더운 날에는 모자, 선크림, 물을 챙겨요.|On cold days, wear layers and cover your ears and fingers with a hat and mittens. On hot days, bring a hat, sunscreen and water.','캐나다 겨울에는 동상을 조심해서 코와 귀를 꼭 가려요.|In a Canadian winter, cover your nose and ears to prevent frostbite.'],
 ['climate',6,2,'🌡️','기후변화|Climate change','석유, 석탄, 가스를 태우면 나오는 온실가스가 지구를 이불처럼 덮어서 지구의 평균 기온이 올라가고 있어요. 빙하가 녹아 바다의 높이가 올라가고, 폭염, 가뭄, 홍수, 산불이 잦아져요.|Burning oil, coal and gas releases greenhouse gases that wrap Earth like a blanket, so the planet’s average temperature is rising. Glaciers melt, seas rise, and heat waves, droughts, floods and wildfires happen more often.','가까운 곳은 걷거나 자전거로, 쓰지 않는 전기는 끄기!|Walk or bike for short trips, and switch off what you’re not using!'],
 ['humidity',6,3,'💧','이슬, 안개, 구름|Dew, fog and clouds','공기 속 수증기의 양을 습도라고 해요. 밤사이 차가워진 풀잎에 수증기가 응결하면 이슬, 땅 가까운 공기가 차가워져 작은 물방울이 떠 있으면 안개, 높은 하늘에서 생기면 구름이에요.|The amount of water vapor in the air is called humidity. Vapor condensing on leaves that cooled overnight is dew. Tiny droplets floating near the ground are fog; high in the sky they’re clouds.','습도가 높은 날은 빨래가 잘 안 마르고 땀이 끈적끈적해요.|On humid days laundry dries slowly and sweat feels sticky.'],
 ['pressure',6,3,'🌬️','기압과 바람|Air pressure and wind','공기가 누르는 힘을 기압이라고 해요. 바람은 기압이 높은 곳에서 낮은 곳으로 불어요. 고기압일 때는 대체로 맑고, 저기압일 때는 구름이 많고 비가 오기 쉬워요. 바닷가에서는 낮에 바다에서 육지로, 밤에 육지에서 바다로 바람이 불어요.|Air pressure is the push of the air. Wind blows from high pressure to low pressure. High pressure usually means clear skies; low pressure brings clouds and rain. At the beach the breeze blows from sea to land by day and from land to sea at night.','일기예보에서 “저기압이 다가온다”고 하면 우산을 챙겨요.|If the forecast says a low is coming, pack an umbrella.'],
 ['constell',6,3,'✨','계절마다 다른 별자리|Seasonal star patterns','지구가 1년에 한 바퀴 해 둘레를 돌기(공전) 때문에 계절마다 밤하늘에 보이는 별자리가 달라요. 겨울밤에는 오리온자리, 여름밤에는 백조자리가 잘 보여요. 북극성 가까이 있는 북두칠성은 거의 1년 내내 볼 수 있어요.|Because Earth travels around the Sun once a year, different star patterns fill the night sky each season. Orion shines on winter nights and Cygnus, the Swan, on summer nights. The Big Dipper, near the North Star, can be seen almost all year.','겨울밤에 오리온자리 허리띠의 나란한 별 세 개를 찾아봐요.|On a winter night, look for the three stars in a row that make Orion’s belt.'],
 ['moon',6,1,'🌕','달은 어떤 곳일까?|What is the Moon like?','달은 지구 둘레를 도는 커다란 돌덩이예요. 달에는 숨 쉴 공기도, 흐르는 물도 없어서 생물이 살 수 없어요. 달 표면에는 우주에서 날아온 돌이 부딪혀 생긴 둥근 구덩이(크레이터)가 많아요. 달은 스스로 빛나지 않고 햇빛을 받아 빛나요.|The Moon is a big ball of rock that travels around Earth. It has no air to breathe and no flowing water, so nothing lives there. Its surface is covered in round pits called craters, made when space rocks crashed into it. The Moon doesn’t make its own light; it shines with sunlight.','달에는 바람과 비가 없어서 우주 비행사의 발자국이 지금도 그대로 남아 있을 거예요.|With no wind or rain on the Moon, the astronauts’ footprints are probably still there today.'],
 ['planets',6,2,'🪐','태양계 가족|The Sun’s family','태양계에는 해 둘레를 도는 행성이 8개 있어요. 해에서 가까운 순서로 수성, 금성, 지구, 화성, 목성, 토성, 천왕성, 해왕성이에요. 수성부터 화성까지는 단단한 암석 행성이고, 목성부터 해왕성까지는 아주 큰 가스 행성이에요. 행성은 스스로 빛나지 않고 햇빛을 반사해요.|Eight planets travel around the Sun. In order from the Sun, they are Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus and Neptune. Mercury to Mars are rocky planets; Jupiter to Neptune are giant planets made mostly of gas. Planets don’t make their own light; they reflect sunlight.','“수금지화목토천해”라고 외우면 순서를 기억하기 쉬워요!|Try “My Very Easy Method Just Speeds Up Naming” to remember the order!'],
 ['space',6,3,'🚀','우주 탐험|Exploring space','로켓은 가스를 아래로 세차게 뿜고, 그 반작용으로 위로 날아올라요. 국제 우주 정거장은 약 400km 높이에서 하루에 지구를 약 16바퀴 돌아요. 우주 비행사가 둥둥 떠다니는 것은 중력이 없어서가 아니라, 우주 정거장과 함께 지구 쪽으로 계속 떨어지면서 아주 빠르게 앞으로 나아가기 때문이에요.|A rocket blasts gas downward, and the reaction pushes it up. The International Space Station circles Earth about 16 times a day, roughly 400 km up. Astronauts float not because there’s no gravity, but because they and the station are always falling toward Earth while zooming forward so fast that they keep missing it.','캐나다가 만든 로봇 팔 캐나다암은 우주 정거장을 짓는 데 쓰였어요. 한국은 누리호 로켓을 쏘아 올렸고 달 궤도선 다누리를 달에 보냈어요.|Canada built the Canadarm robotic arms that helped assemble the space station. Korea launched its own Nuri rocket and sent the Danuri orbiter to the Moon.'],
 ['stars2',6,3,'🌌','별의 색깔과 은하|Star colors and galaxies','별은 색깔에 따라 온도가 달라요. 파란 별이 가장 뜨겁고, 하얀 별, 노란 별(해), 붉은 별 순서로 온도가 낮아요. 밤하늘의 별빛은 아주 먼 곳에서 오랫동안 날아온 빛이에요. 해와 같은 별이 수없이 모인 거대한 무리를 은하라고 하고, 우리가 사는 은하를 우리은하라고 해요.|A star’s color tells its temperature. Blue stars are the hottest, then white stars, then yellow stars like the Sun, and red stars are the coolest. Starlight has traveled a very long way for a very long time to reach us. A huge collection of countless stars like the Sun is called a galaxy, and ours is the Milky Way.','도시 불빛이 없는 깜깜한 곳에서는 밤하늘을 가로지르는 은하수(우리은하의 모습)를 볼 수 있어요.|Far from city lights, you can see the Milky Way stretching across the night sky.'],
 // ---------------------------------------------------------------- 7 Healthy Town
 ['sound',7,1,'🔔','소리는 떨림|Sound is vibration','물체가 떨리면 소리가 나요. 북을 치거나 기타 줄을 튕기면 떨리면서 소리가 나요.|Sounds are made when things vibrate (shake quickly). A drum or a guitar string makes sound when it vibrates.','말할 때 목에 손을 대 보면 떨림이 느껴져요.|Put your hand on your throat while you talk and feel it buzz.'],
 ['pitch',7,1,'🎵','높은 소리, 낮은 소리|High and low sounds','짧고, 가늘고, 팽팽할수록 높은 소리가 나고, 길고, 굵고, 느슨할수록 낮은 소리가 나요.|Short, thin and tight things make high sounds. Long, thick and loose things make low sounds.','실로폰의 짧은 막대는 높은 소리, 긴 막대는 낮은 소리!|On a xylophone, short bars sound high and long bars sound low!'],
 ['loud',7,1,'🔊','큰 소리, 작은 소리|Loud and soft','세게 치면 크게 떨려서 큰 소리, 살살 치면 작게 떨려서 작은 소리가 나요. 너무 큰 소리는 귀를 다치게 해요.|Hit something hard and it vibrates a lot: loud. Tap it gently: soft. Very loud sounds can hurt your ears.','이어폰 소리는 작게! 아주 시끄러운 곳에서는 귀마개를 써요.|Keep headphones quiet, and wear earplugs in very noisy places.'],
 ['soundtravel',7,2,'📞','소리의 여행|How sound travels','소리는 공기, 물, 실 같은 고체를 통해 전해져요. 공기가 없는 우주에서는 소리가 전해지지 않아요. 벽이나 산에 부딪혀 돌아오는 소리가 메아리예요.|Sound travels through air, water and solids like string. In space there is no air, so sound can’t travel. An echo is sound bouncing back off a wall or mountain.','종이컵 두 개를 실로 이어 실 전화기를 만들어 봐요.|Make a string telephone with two paper cups.'],
 ['heart',7,1,'❤️','심장과 폐|Heart and lungs','심장은 쉬지 않고 피를 온몸으로 보내고, 폐는 공기를 들이마셔 산소를 받아들여요. 뛰면 심장이 더 빨리 뛰어요.|Your heart pumps blood all around your body without stopping. Your lungs breathe in air to get oxygen. When you run, your heart beats faster.','손목이나 목에 손가락을 대고 맥박을 세어 봐요.|Put two fingers on your wrist or neck and count your pulse.'],
 ['body',7,1,'🦴','우리 몸|My body','뼈는 몸을 받치고 뇌와 심장 같은 중요한 곳을 보호해요. 근육이 뼈를 당겨서 몸이 움직여요. 눈·귀·코·혀·피부의 다섯 감각으로 세상을 느껴요.|Bones hold you up and protect important parts like your brain and heart. Muscles pull on bones to move you. Your five senses (eyes, ears, nose, tongue and skin) tell you about the world.','우유, 멸치 같은 칼슘 음식과 운동이 뼈를 튼튼하게 해요.|Calcium foods like milk and lots of exercise make bones strong.'],
 ['germs',7,1,'🧼','세균과 손 씻기|Germs and hand washing','세균은 너무 작아서 눈에 안 보여요. 비누로 20초 이상 손을 씻으면 세균을 없앨 수 있어요. 기침은 팔꿈치 안쪽에!|Germs are too tiny to see. Washing with soap for at least 20 seconds gets rid of them. Cough into your elbow!','밖에서 돌아오면, 화장실 다녀오면, 밥 먹기 전에 손 씻기!|Wash after coming inside, after the bathroom and before you eat!'],
 ['healthy',7,1,'🥦','튼튼한 생활 습관|Healthy habits','골고루 먹고, 물을 마시고, 매일 뛰어놀고, 푹 자요. 초등학생은 하루 9~12시간 자는 게 좋아요.|Eat lots of different foods, drink water, play actively every day and sleep well. Kids your age need 9–12 hours of sleep.','이는 하루 2번, 2분 동안 꼼꼼히 닦아요.|Brush your teeth twice a day for two minutes.'],
 ['emergency',7,1,'🚒','위급할 때|Emergencies','캐나다·미국에서는 911, 한국에서는 불이 나거나 다치면 119, 범죄는 112에 전화해요. 불이 나면 몸을 낮추고 밖으로! 옷에 불이 붙으면 멈추고, 엎드리고, 굴러요.|In Canada and the US, call 911. In Korea, call 119 for fires and injuries and 112 for police. In a fire, stay low and get out! If your clothes catch fire: stop, drop and roll.','우리 집 주소를 외워 두면 위급할 때 도움이 돼요.|Learn your home address by heart. It helps in an emergency.'],
 ['firstaid',7,2,'🩹','응급처치 상식|First-aid facts','데었을 때는 시원한 흐르는 물에 10분 넘게 식혀요(버터·얼음은 안 돼요). 코피가 나면 고개를 앞으로 숙이고 콧볼을 꼭 눌러요.|For a burn, cool it under running water for more than 10 minutes (no butter or ice). For a nosebleed, lean forward and pinch the soft part of your nose.','다치면 참지 말고 바로 어른에게 알려요.|If you get hurt, tell a grown-up right away.'],
 ['digest',7,3,'🍽️','소화 기관|Digestion','음식은 입 → 식도 → 위 → 작은창자 → 큰창자 → 항문 순서로 지나가요. 입과 위에서 잘게 부수고 녹인 뒤, 작은창자에서 영양소를 흡수하고, 큰창자에서 물을 흡수해요.|Food travels mouth → esophagus → stomach → small intestine → large intestine → anus. It’s mashed and broken down in the mouth and stomach, nutrients are absorbed in the small intestine and water in the large intestine.','꼭꼭 씹어 먹으면 위와 창자가 일을 덜 해서 소화가 잘돼요.|Chewing well gives your stomach and intestines less work to do.'],
 ['breathe',7,3,'🫁','호흡과 순환|Breathing and blood flow','숨을 들이마시면 공기가 코 → 기관 → 기관지 → 폐로 들어가요. 폐는 산소를 받아들이고 이산화탄소를 내보내요. 심장은 산소를 실은 피를 혈관을 따라 온몸으로 보내요. 운동하면 숨과 맥박이 빨라져요.|When you breathe in, air goes nose → windpipe → bronchi → lungs. The lungs take in oxygen and get rid of carbon dioxide. The heart pumps oxygen-rich blood through blood vessels all over the body. Exercise speeds up your breathing and pulse.','달리기 전과 후에 1분 동안 맥박을 세어 비교해 봐요.|Count your pulse for one minute before and after running and compare.'],
 ['organteam',7,3,'🧩','몸속 기관은 한 팀|Body systems work together','콩팥은 피 속의 노폐물을 걸러 오줌을 만들고, 오줌은 방광에 모였다가 몸 밖으로 나가요(배설). 피는 소화로 얻은 영양소와 폐에서 받은 산소를 온몸에 나르고, 생긴 노폐물은 콩팥이 걸러요. 이렇게 여러 기관이 서로 도와요.|Kidneys filter waste out of the blood to make urine, which is stored in the bladder and then leaves the body (excretion). Blood carries nutrients from digestion and oxygen from the lungs all around the body, and the kidneys clean out the waste. The body systems all help each other.','물을 충분히 마시면 콩팥이 일을 잘할 수 있어요.|Drinking enough water helps your kidneys do their job.'],
 ['nerve',7,3,'⚡','자극과 반응|Senses, nerves and the brain','눈, 귀, 코, 혀, 피부가 받아들인 자극은 신경을 따라 뇌로 전달돼요. 뇌가 명령을 내리면 다시 신경을 따라 근육이 움직여요. 근육이 줄어들며 뼈를 당겨서 팔과 다리가 움직여요.|What your eyes, ears, nose, tongue and skin sense travels along nerves to the brain. The brain sends commands back along nerves, and muscles move. Muscles shorten and pull on bones to move your arms and legs.','공 잡기를 연습하면 보고 움직이는 반응이 빨라져요.|Practice catching a ball and your see-and-move reactions get faster.'],
 ['nutrient',7,2,'🍱','영양소 삼총사|Nutrients','음식에는 우리 몸에 필요한 영양소가 들어 있어요. 밥, 빵, 국수에 많은 탄수화물은 움직일 힘을 주고, 고기, 생선, 달걀, 콩에 많은 단백질은 근육과 몸을 만들어요. 버터, 기름, 견과류의 지방도 에너지를 줘요. 채소와 과일의 비타민과 무기질은 몸이 잘 돌아가게 도와요.|Food contains nutrients your body needs. Carbohydrates, found in rice, bread and noodles, give you energy to move. Protein, found in meat, fish, eggs and beans, builds your muscles and body. Fats in butter, oil and nuts give energy too. Vitamins and minerals in vegetables and fruit keep everything working well.','한 가지 음식만 먹지 말고 여러 가지 음식을 골고루 먹어요.|Don’t eat just one food: enjoy lots of different ones.'],
 // ---------------------------------------------------------------- 8 Fossil Valley
 ['dino',8,1,'🦖','화석과 공룡|Fossils and dinosaurs','화석은 아주 오래전에 살았던 생물의 몸이나 발자국이 돌에 남은 거예요. 공룡은 사람이 나타나기 훨씬 전에 살다가 사라졌어요. 화석 덕분에 공룡이 어떻게 생겼는지 알 수 있어요.|Fossils are the bodies or footprints of living things from long, long ago, saved in rock. Dinosaurs lived and died out long before there were any people. Fossils show us what dinosaurs looked like.','캐나다 앨버타주와 한국 경상남도 고성은 공룡 화석과 발자국으로 유명해요.|Alberta in Canada and Goseong in Korea are famous for dinosaur fossils and footprints.'],
 ['soil',8,1,'🟫','흙|Soil','흙은 잘게 부서진 돌 알갱이, 썩은 잎, 물, 공기가 섞인 거예요. 흙에는 지렁이와 개미 같은 작은 생물이 살고, 식물은 흙에 뿌리를 내려 물과 영양분을 얻어요.|Soil is a mix of tiny bits of rock, rotted leaves, water and air. Earthworms, ants and other small creatures live in it, and plants root in it to get water and nutrients.','텃밭 흙을 돋보기로 보면 작은 돌, 뿌리, 벌레를 찾을 수 있어요.|Look at garden soil with a magnifier to find tiny stones, roots and bugs.'],
 ['rocks',8,1,'🪨','여러 가지 돌|Rocks and stones','돌은 색깔, 크기, 단단한 정도, 무늬가 저마다 달라요. 단단한 돌은 건물과 길을 만드는 데 쓰여요. 우리가 밟는 모래도 아주 작은 돌 알갱이예요.|Rocks differ in color, size, hardness and pattern. Hard rocks are used to build buildings and roads. Even sand is made of tiny bits of rock.','바닷가나 강가에서 돌을 주워 크기와 색깔로 나눠 봐요.|Collect stones at a beach or river and sort them by size and color.'],
 ['volcano',8,1,'🌋','화산|Volcanoes','땅속 깊은 곳의 아주 뜨겁게 녹은 돌(마그마)이 땅 위로 터져 나오는 곳이 화산이에요. 땅 위로 흘러나온 마그마를 용암이라고 해요. 한라산과 백두산도 화산이에요.|A volcano is where super-hot melted rock (magma) from deep underground bursts out. Once it flows out, it’s called lava. Korea’s Hallasan and Baekdusan are volcanoes.','화산재와 용암은 아주 위험해서, 화산 근처 사람들은 대피 방법을 미리 연습해요.|Ash and lava are dangerous, so people near volcanoes practice how to evacuate.'],
 ['quake',8,1,'🏚️','지진에서 나를 지켜요|Staying safe in an earthquake','지진은 땅이 갑자기 흔들리는 거예요. 흔들릴 때는 튼튼한 책상 밑으로 들어가 머리를 가리고 책상 다리를 꼭 잡아요. 흔들림이 멈추면 엘리베이터 말고 계단으로 넓은 곳에 나가요.|An earthquake is when the ground suddenly shakes. Drop under a sturdy table, cover your head and hold on to a table leg. When the shaking stops, take the stairs (not the elevator) to an open space.','“엎드리고, 가리고, 잡기”를 가족과 함께 연습해 봐요.|Practice “Drop, Cover and Hold On” with your family.'],
 ['river',8,2,'🏞️','흐르는 물이 바꾸는 땅|Running water shapes the land','흐르는 물은 땅을 깎고(침식), 흙과 돌을 옮기고(운반), 느려진 곳에 쌓아요(퇴적). 산 위 상류에는 크고 모난 돌이, 바다 가까운 하류에는 작고 둥근 돌과 모래가 많아요.|Running water wears land away (erosion), carries soil and stones along (transport) and drops them where it slows down (deposition). Upstream in the mountains the rocks are big and jagged; downstream near the sea they’re small round pebbles and sand.','비 온 뒤 운동장에 생긴 작은 물길을 관찰해 봐요.|After rain, look at the little streams that form on the playground.'],
 ['igneous',8,2,'⚫','화산이 만든 돌|Rocks made by volcanoes','마그마가 식어서 굳은 돌을 화성암이라고 해요. 땅 위에서 빨리 식은 현무암은 어둡고 알갱이가 작으며 구멍이 송송 난 것이 많아요. 땅속에서 천천히 식은 화강암은 밝고 알갱이가 커요.|Rock made when magma cools and hardens is igneous rock. Basalt cools fast at the surface: dark, fine-grained and often full of holes. Granite cools slowly underground: light-colored with big crystals.','제주도 돌하르방은 현무암, 많은 건물 계단은 화강암으로 만들어요.|Jeju’s stone grandfather statues are basalt; many building steps are granite.'],
 ['sea',8,2,'🌊','지구와 바다|Earth’s land and sea','지구 표면은 육지보다 바다가 훨씬 넓어요(약 70%). 바닷물은 짜서 그냥 마실 수 없어요. 바닷물은 하루에 두 번쯤 높아졌다(밀물) 낮아졌다(썰물) 해요. 지구는 공기(대기)로 둘러싸여 있어요.|Oceans cover much more of Earth than land does (about 70%). Seawater is salty, so we can’t drink it. About twice a day the sea rises (high tide) and falls (low tide). Earth is wrapped in a layer of air (the atmosphere).','갯벌 체험을 할 때는 물때를 확인하고 밀물이 들어오기 전에 나와요.|On a mudflat trip, check the tide times and get out before the tide comes in.'],
 ['mineral',8,2,'💎','광물|Minerals','돌은 여러 가지 광물이 모여 이루어져 있어요. 연필심의 흑연, 음식에 넣는 소금, 유리를 만드는 석영도 광물이에요. 광물은 색깔과 단단한 정도가 저마다 달라요.|Rocks are made of minerals. Pencil graphite, table salt and quartz (used to make glass) are all minerals. Minerals differ in color and hardness.','캐나다는 니켈과 금 같은 광물이 많이 나는 나라예요.|Canada produces lots of minerals, such as nickel and gold.'],
 ['strata',8,3,'🍰','지층|Rock layers','강이나 바다 밑에 자갈, 모래, 진흙이 층층이 쌓이고 오랜 시간 눌려 굳으면 지층이 돼요. 보통 아래에 있는 층이 먼저 쌓여서 더 오래됐어요. 알갱이 크기에 따라 역암(자갈), 사암(모래), 이암(진흙)으로 나눠요.|Gravel, sand and mud pile up in layers under rivers and seas, then get pressed into rock over a long time. Usually the bottom layer formed first, so it’s the oldest. By grain size, these rocks are conglomerate (gravel), sandstone (sand) and mudstone (mud).','바닷가 절벽의 줄무늬는 지층이에요. 무너질 수 있으니 가까이 가지 마요.|The stripes in seaside cliffs are rock layers. Keep away from the edge; they can crumble.'],
 ['fossil2',8,3,'🐚','화석이 알려 주는 것|What fossils tell us','생물이 죽은 뒤 진흙이나 모래에 빨리 묻히고 그 위에 계속 흙이 쌓여 굳으면 화석이 돼요. 산에서 조개 화석이 나오면 그곳이 옛날에 바다였다는 걸 알 수 있어요. 석탄도 아주 옛날 식물이 땅속에 묻혀 만들어졌어요.|When a living thing dies and is quickly buried in mud or sand, and more layers pile on and harden, it can become a fossil. Seashell fossils on a mountain tell us the place was once under the sea. Coal formed from ancient plants buried underground.','박물관에서 화석을 보면 어떤 환경에서 살았을지 상상해 봐요.|At a museum, look at a fossil and imagine where that creature lived.'],
 ['rocktypes',8,2,'🪨','돌의 세 가지 무리|Three kinds of rock','돌은 만들어진 방법에 따라 세 무리로 나눠요. 마그마가 식어 굳은 화성암(현무암, 화강암), 알갱이가 쌓여 굳은 퇴적암(사암, 이암, 석회암), 높은 열과 압력으로 모습이 바뀐 변성암(대리암, 편마암)이에요.|Rocks come in three groups depending on how they formed: igneous rock from cooled magma (basalt, granite), sedimentary rock from layers of grains pressed together (sandstone, mudstone, limestone), and metamorphic rock changed by great heat and pressure (marble, gneiss).','돌은 아주 오랜 시간 동안 깎이고 쌓이고 녹으며 다른 무리로 바뀌어요(암석의 순환).|Over a very long time, rocks wear away, pile up and melt, changing from one kind to another (the rock cycle).'],
 ['quakewhy',8,2,'💥','지진은 왜 일어날까?|Why do earthquakes happen?','지구의 겉은 커다란 조각(판) 여러 개로 나뉘어 있고, 판은 1년에 몇 cm씩 아주 천천히 움직여요. 판끼리 밀거나 어긋나면 땅속 바위에 힘이 조금씩 쌓여요. 오랫동안 쌓인 힘을 견디지 못한 바위가 갑자기 끊어지거나 미끄러지면, 그 떨림이 사방으로 퍼져 땅이 흔들려요. 이것이 지진이에요.|Earth’s outer shell is broken into giant pieces called plates, which creep along a few centimetres a year. Where plates push or grind past each other, pressure slowly builds up in the rock underground. When the rock can’t take it any more, it suddenly breaks or slips, and the shaking spreads out in every direction. That’s an earthquake.','나무젓가락을 양 끝에서 밀면 휘다가 “딱!” 부러지면서 손에 떨림이 느껴져요. 지진도 이렇게 생겨요.|Push a chopstick from both ends: it bends, then snaps, and you feel a jolt in your hands. Earthquakes work the same way.'],
 ['quakemap',8,2,'🗺️','지진이 자주 일어나는 곳|Where earthquakes happen','지진은 판과 판이 만나는 경계에서 자주 일어나요. 태평양을 빙 둘러싼 “불의 고리”에는 일본, 인도네시아, 필리핀, 뉴질랜드, 칠레, 미국 서해안, 캐나다 서해안이 있어서 지진과 화산이 많아요. 이탈리아, 튀르키예, 이란, 네팔처럼 유럽 남쪽에서 히말라야로 이어지는 띠에도 지진이 잦아요. 판 한가운데에 있는 호주와 브라질은 큰 지진이 드물어요.|Earthquakes happen most where plates meet. The “Ring of Fire” around the Pacific Ocean, with Japan, Indonesia, the Philippines, New Zealand, Chile and the west coasts of the United States and Canada, has lots of earthquakes and volcanoes. So does a belt from southern Europe to the Himalayas, through Italy, Türkiye, Iran and Nepal. Australia and Brazil sit in the middle of plates, so big quakes there are rare.','한국은 판의 경계에서 조금 떨어져 있어서 일본보다 지진이 훨씬 적지만, 2016년 경주와 2017년 포항에서는 땅이 크게 흔들렸어요.|Korea is a little way from the plate edges, so it has far fewer quakes than Japan, but strong ones shook Gyeongju in 2016 and Pohang in 2017.'],
 ['quake3',8,3,'📈','지진의 세기와 지진 해일|Earthquake strength and tsunamis','지진이 처음 시작된 땅속 지점을 진원, 그 바로 위 땅을 진앙이라고 해요. 지진이 내는 에너지의 크기는 규모로 나타내는데, 규모가 1 커지면 에너지는 약 32배가 돼요. 같은 지진이라도 진앙에서 가까울수록 더 세게 흔들려요. 바다 밑에서 큰 지진이 나면 거대한 파도인 지진 해일(쓰나미)이 밀려올 수 있어요.|The spot underground where an earthquake starts is the focus, and the point on the surface right above it is the epicentre. An earthquake’s energy is measured by its magnitude: each step up of 1 means about 32 times more energy. The same quake shakes harder the closer you are to the epicentre. A big quake under the sea can send giant waves called a tsunami.','바닷가에서 땅이 크게 흔들리면 경보를 기다리지 말고 바로 높은 곳으로 대피해요.|If you feel strong shaking at the beach, don’t wait for a warning: head for high ground right away.'],
 ['earthin',8,3,'🌏','지구의 속|Inside the Earth','지구의 속은 달걀처럼 여러 층으로 되어 있어요. 가장 바깥의 얇은 껍데기는 지각, 그 아래 두껍고 뜨거운 층은 맨틀, 가장 안쪽의 핵은 주로 철로 되어 있어요. 핵의 바깥쪽(외핵)은 녹은 액체이고, 가장 안쪽(내핵)은 단단한 고체예요. 지구 중심은 약 5000°C가 넘을 만큼 뜨거워요.|Inside, Earth has layers, a bit like an egg. The thin outer shell is the crust, under it is a thick, hot layer called the mantle, and at the centre is the core, made mostly of iron. The outer core is liquid metal and the inner core is solid. The centre is hotter than about 5000°C.','사람이 땅을 가장 깊이 판 구멍도 약 12km라서 지각조차 다 뚫지 못했어요. 지구의 속은 지진파를 연구해서 알아냈어요.|The deepest hole ever dug is only about 12 km, not even through the crust. We learned what’s inside Earth by studying earthquake waves.'],
];

 let lx,ly,guard=0;do{lx=rand(30,330);ly=rand(28,TOP-40)}while((good(lx,ly)||(task==='flag'&&Math.abs(tipOf(lx,ly)-flagX)<55))&&guard++<200);
