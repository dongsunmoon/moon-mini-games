<script>
/* Language: ?lang=ko|en, then the saved choice, then the device language. Shared by every page on this site. */
const LANG=(()=>{let q=null,s=null;try{q=new URLSearchParams(location.search).get('lang')}catch(e){}try{s=localStorage.getItem('moonGames.lang')}catch(e){}const l=q==='ko'||q==='en'?q:s==='ko'||s==='en'?s:/^ko/i.test(navigator.language||'')?'ko':'en';if(q===l){try{localStorage.setItem('moonGames.lang',l)}catch(e){}}document.documentElement.lang=l;return l})();
const L=(ko,en)=>LANG==='en'?en:ko;
/*COACH:BEGIN*/
// Coach Moon, the maker's character, cheers the player on in every game, in two ways:
// · coachLine(kind) puts one line inside result and level-up windows (kinds: up, big, good, try, race).
// · coachPop(pose,ko,en) shows a small bubble in the corner at good moments. It never blocks a tap and
//   waits between appearances, so he never nags. He only praises and encourages.
// Source: _src/coach/coach.js, copied into every game by _src/coach/inject.py.
// LR keeps the learning record that the parents' report (report.html) reads. Each game has one record per player,
// stored under its save prefix + "learn", so the profile script files it as "...@profileId". It holds:
// · days: play time in seconds and right/wrong answers per day (the last 120 days). Time counts only while the
//   page is visible and the player touched or typed in the last 2 minutes.
// · sum: the game's own summary of skills, built by the function passed to LR.set() (see _src/report/SPEC.md).
// · when: the day each skill first reached "mastered" ('' = before the record started).
// · sk: right/wrong counts per skill, from coachAnswer(ok,skillId); skw: the same per week (Monday's date, 12 weeks).
// · mx: kinds of questions the child got wrong (up to 40), from coachAnswer(ok,skillId,item) with
//   item={id,q:[ko,en],a:[ko,en],g?:[ko,en],tip?:[ko,en]}: the latest example, the right answer, the child's answer,
//   how many misses, and how many right answers in a row since the last miss (so the report can say "fixed now").
// · ls: the mini lessons (MiniLesson, in lesson.js) the child watched to the end, with the first day.
// A game's reset must call LR.forget() so the report forgets only that game; LR.resume() starts a fresh record.
const LR=(()=>{const f=(location.pathname.split('/').pop()||'').replace(/\.html$/,'');
 const KEY={math_aquarium:'mathAquarium.learn',science_guardians:'scienceGuardians.learn',music_academy:'musicAcademy.learn',chess_knights:'chessKnights.learn',detective_game:'little-detective-learn',marble_rush_3d:'marbleRush.learn',coding_island:'pythonIsland.learn',python_island:'pythonIsland.learn'}[f];
 const day=()=>new Date().toLocaleDateString('en-CA'),week=(n=0)=>{const d=new Date();d.setDate(d.getDate()-(d.getDay()+6)%7-7*n);return d.toLocaleDateString('en-CA')};
 const two=x=>Array.isArray(x)?x.slice(0,2).map(v=>String(v==null?'':v).slice(0,140)):undefined;let R=null,fn=null,off=!KEY,dirty=false,last=0;
 const load=()=>{if(R)return R;try{R=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(!R||R.v!==1)R={v:1,days:{},when:{}};return R};
 const today=()=>{const r=load(),d=day();return r.days[d]||(r.days[d]={s:0,r:0,w:0})};
 const save=()=>{if(off)return;const r=load();
  if(fn){try{const s=fn();if(s){const first=!r.sum,d=day();r.sum=s;(s.areas||[]).forEach(a=>(a.skills||[]).forEach(k=>{if(k.st===2&&r.when[k.id]==null)r.when[k.id]=first?'':d}))}}catch(e){}}
  const ks=Object.keys(r.days).sort();ks.slice(0,Math.max(0,ks.length-120)).forEach(k=>delete r.days[k]);
  const old=week(12);for(const k in r.skw||{}){for(const w in r.skw[k])if(w<old)delete r.skw[k][w];if(!Object.keys(r.skw[k]).length)delete r.skw[k]}
  r.at=Date.now();try{localStorage.setItem(KEY,JSON.stringify(r))}catch(e){}dirty=false};
 ['pointerdown','keydown','touchstart','wheel'].forEach(e=>addEventListener(e,()=>{last=Date.now()},{passive:true,capture:true}));
 setInterval(()=>{if(off||document.hidden||Date.now()-last>120000)return;today().s+=10;dirty=true},10000);
 setInterval(()=>{if(dirty)save()},30000);
 addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden&&dirty)save()});
 return {
  ans(ok,skill,item){if(off)return;const t=today(),r=load(),i=ok?0:1;ok?t.r++:t.w++;
   if(skill!=null){const sk=r.sk||(r.sk={});(sk[skill]||(sk[skill]=[0,0]))[i]++;const sw=r.skw||(r.skw={}),o=sw[skill]||(sw[skill]={}),w=week();(o[w]||(o[w]=[0,0]))[i]++}
   if(item&&item.id!=null){const mx=r.mx||(r.mx={}),id=String(item.id).slice(0,80);let e=mx[id];
    if(!ok){if(!e)e=mx[id]={s:skill,n:0,ok:0,f:day()};e.n++;e.k=0;e.l=day();e.q=two(item.q);e.a=two(item.a);e.g=two(item.g);e.tip=two(item.tip)||e.tip;
     const ids=Object.keys(mx);if(ids.length>40)ids.sort((a,b)=>mx[a].l!==mx[b].l?(mx[a].l<mx[b].l?-1:1):mx[a].n-mx[b].n).slice(0,ids.length-40).forEach(x=>delete mx[x])}
    else if(e){e.ok++;e.k=(e.k||0)+1}}
   dirty=true},
  set(f){fn=f;setTimeout(save,1500)},save,
  stat(id){const x=(load().sk||{})[id];return x?{r:x[0],w:x[1]}:null},
  // mini lessons watched to the end (MiniLesson): lesson id → the first day; les() returns them all
  les(id){const r=load();if(id==null)return r.ls||{};if(!(r.ls||(r.ls={}))[id]){r.ls[id]=day();dirty=true;if(!off)save()}return r.ls},
  forget(){off=true;R=null;try{localStorage.removeItem(KEY)}catch(e){}},
  resume(){off=!KEY;R=null;dirty=false}}})();
const coachEsc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const coachNm=()=>{try{return MGP.me&&MGP.me.name||''}catch(e){return ''}};
const coachPick=a=>a[Math.random()*a.length|0];
// the player's face as their game character (images/aq-me-<key>.webp) from the emoji the profile stores; other emoji stay as they are
const COACH_ME={'🐰':'bunny','🐻':'bear','🦊':'fox','🐼':'panda','🐨':'koala','🐯':'tiger','🦁':'lion','🐸':'frog','🐱':'cat','🐶':'puppy','🐥':'chick','🦄':'unicorn','🐙':'octopus','🐬':'dolphin','🦖':'dino','⭐':'star'};
const coachMe=(av,cls='')=>{const k=COACH_ME[String(av||'').replace(/\ufe0f/g,'')];return k?`<img class="me-pic ${cls}" src="images/aq-me-${k}.webp" alt="" draggable="false" data-e="${coachEsc(av)}" onerror="this.replaceWith(document.createTextNode(this.dataset.e))">`:coachEsc(av||'')};
// a short caution or notice line in any window: kind 'safe' (⚠️ real-world safety, e.g. "only with a grown-up") or 'info'
// (ℹ️ privacy, pretend coins, credits). safeLink() is the settings-window link to notice.html, the page for grown-ups.
const SAFE_HEAD={safe:['⚠️','안전 주의','Safety first'],info:['ℹ️','알아 두기','Good to know']};
const safeNote=(kind,ko,en,cls='')=>{const k=SAFE_HEAD[kind]?kind:'info',h=SAFE_HEAD[k];return `<p class="mg-note mg-${k} ${cls}" role="note"><b>${h[0]} ${L(h[1],h[2])}</b> ${coachEsc(en==null?ko:L(ko,en))}</p>`};
const safeLink=()=>`<a class="mg-notice-link" href="notice.html?lang=${LANG}" target="_blank" rel="noopener">🛡️ ${L('안전 · 개인정보 · 저작권 안내 (보호자용)','Safety, privacy & credits (for grown-ups)')}</a>`;
const coachSay_=t=>{const nm=coachNm(),ok=t.filter(x=>nm||!/\{nm\}/.test(x[0])),x=coachPick(ok.length?ok:t);return L(x[0],x[1]).replace(/\{nm\}/g,coachEsc(nm))};
const COACH={
 up:['clap',[['꾸준히 한 덕분이에요. 정말 멋져요!','Your steady practice paid off. Awesome!'],['어제보다 오늘 더 잘하고 있어요!','You’re doing even better than yesterday!'],['계속 도전해서 여기까지 왔어요!','You kept trying, and look how far you’ve come!'],['{nm}의 노력이 반짝반짝 빛나요 ✨','Your hard work is shining, {nm} ✨'],['문 코치가 박수 쳐요! 짝짝짝 👏','Coach Moon is clapping for you! 👏'],['이 기세 그대로 가 봐요! 🌙','Keep this going! 🌙']]],
 big:['medal',[['정말 대단해요! 이 메달 받아요 🏅','Amazing! This medal is yours 🏅'],['최고예요! 오늘의 주인공이에요 🏅','The best! You’re the star today 🏅'],['{nm}, 문 코치가 정말 자랑스러워요! 🏅','I’m so proud of you, {nm}! 🏅'],['완벽해요! 멋진 실력이에요 🌟','Perfect! What great skills 🌟']]],
 try:['go',[['괜찮아요! 연습하면 다음엔 더 잘할 거예요.','That’s okay! With practice you’ll do even better next time.'],['끝까지 해낸 게 멋져요. 다음에 또 해 봐요!','You finished, and that’s great. Let’s try again next time!'],['틀린 문제에서 제일 많이 배워요. 문 코치가 응원해요 🌙','We learn the most from mistakes. Coach Moon is cheering for you 🌙'],['{nm}, 할 수 있어요! 한 번 더 해 봐요 🌙','You can do it, {nm}! One more try 🌙']]],
 good:['go',[['잘했어요! 조금만 더 연습하면 별 3개예요 ⭐','Nice work! A little more practice and it’s 3 stars ⭐'],['좋아요! 한 번 더 하면 더 잘할 거예요 🌙','Good job! One more go and you’ll do even better 🌙'],['실력이 쑥쑥 자라고 있어요! 문 코치가 응원해요 🌙','Your skills are growing fast! Coach Moon is cheering 🌙'],['{nm}, 점점 더 잘하고 있어요!','You’re getting better and better, {nm}!']]],
 race:['clap',[['응원한 보람이 있어요! 정말 신나요!','Your cheering paid off! So exciting!'],['끝까지 응원한 게 최고예요!','Cheering to the very end was the best!'],['와, 우승이에요! 문 코치도 같이 응원했어요 🎉','A win! Coach Moon was cheering too 🎉']]]};
function coachLine(k){const [pose,ls]=COACH[k];return `<div class="mcoach"><img src="images/coach-moon-${pose}.webp" alt="" width="58" height="70" onerror="this.parentNode.remove()"><p><b>${L('문 코치','Coach Moon')}</b>${coachSay_(ls)}</p></div>`}
let coachAt=0,coachRun=0,coachMiss=0;
// true while a game window (dialog) is open, so the bubble never covers one
const coachBusy=()=>[...document.querySelectorAll('[role="dialog"],[aria-modal="true"]')].some(e=>e.getAttribute('aria-hidden')!=='true'&&e.getClientRects().length&&getComputedStyle(e).visibility!=='hidden');
function coachLater(fn,left=180){if(!coachBusy()){fn();return}if(left>0)setTimeout(()=>coachLater(fn,left-1),1000)}
function coachPop(pose,ko,en,o={}){const now=Date.now();if(!o.force&&now-coachAt<(o.gap||60000))return false;if(!o.force&&coachBusy())return false;coachAt=now;
 let el=document.getElementById('coachPop');if(!el){el=document.createElement('div');el.id='coachPop';el.setAttribute('role','status');document.body.appendChild(el)}
 el.innerHTML=`<img src="images/coach-moon-${pose}.webp" alt="" onerror="this.remove()"><p><b>${L('문 코치','Coach Moon')}</b>${L(ko,en)}</p>`;
 el.classList.remove('show');void el.offsetWidth;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),o.ms||4500);return true}
// call with every final answer: praise runs of right answers, and help after two misses in a row.
// The optional skill id (one of the skill ids in the game's LR summary) counts the answer for that skill in the report,
// and the optional item (see LR above) lets the report list the kinds of questions the child often gets wrong.
function coachAnswer(ok,skill,item){try{LR.ans(ok,skill,item)}catch(e){}
 if(ok){coachRun++;coachMiss=0;if(![3,5,10,15,20,30].includes(coachRun))return;const n=coachRun,t=coachPick([[`${n}번 연속 성공! 집중력이 대단해요 🌙`,`${n} in a row! Amazing focus 🌙`],[`와, ${n}번 연속이에요! 문 코치가 박수 쳐요 👏`,`Wow, ${n} in a row! Coach Moon is clapping 👏`],[`${n}번 연속! 오늘 머리가 반짝반짝해요 ✨`,`${n} straight! Your brain is sparkling today ✨`]]);coachPop('clap',t[0],t[1],{gap:20000});return}
 coachRun=0;coachMiss++;if(coachMiss!==2)return;const nm=coachEsc(coachNm()),t=coachPick([['괜찮아요! 틀리면서 배우는 거예요. 천천히 다시 봐요 🌙','That’s okay! Mistakes help us learn. Take another look 🌙'],[nm?`${nm}, 할 수 있어요! 문 코치가 응원해요 🌙`:'할 수 있어요! 문 코치가 응원해요 🌙',nm?`You can do it, ${nm}! Coach Moon is cheering 🌙`:'You can do it! Coach Moon is cheering 🌙'],['실수는 배움의 친구예요. 한 번 더 해 봐요!','Mistakes are friends of learning. One more try!']]);coachPop('go',t[0],t[1],{gap:30000})}
// Once a day per game he says hello, a few minutes in he shares a tip, and after 20 minutes he suggests a little rest.
// Each day a game is opened is noted for the main page's praise-stamp board.
function coachStart(hello,tips){const game=(location.pathname.split('/').pop()||'index').replace(/\.html$/,''),k='moonGames.coach'+(MGP.me?'@'+MGP.me.id:''),d=new Date().toLocaleDateString('en-CA');
 const notes=f=>{let st={};try{st=JSON.parse(localStorage.getItem(k)||'{}')||{}}catch(e){}f(st);try{localStorage.setItem(k,JSON.stringify(st))}catch(e){}return st};
 const st=notes(st=>{st.played=(st.played||[]).filter(x=>x!==d).concat(d).slice(-14)}),nm=coachEsc(coachNm());
 // the hello counts as said only once it has really been shown
 if((st.hello||{})[game]!==d)setTimeout(()=>coachLater(()=>setTimeout(()=>{if(coachPop('hi',`${hello[0]} ${nm?`문 코치는 언제나 ${nm} 편이에요 🌙`:'문 코치가 응원해요 🌙'}`,`${hello[1]} ${nm?`Coach Moon is always on your side, ${nm} 🌙`:'Coach Moon is cheering for you 🌙'}`,{force:true,ms:6000}))notes(st=>{(st.hello=st.hello||{})[game]=d})},900)),2500);
 if(tips&&tips.length)setTimeout(()=>{const t=coachPick(tips);coachPop('idea',t[0],t[1],{ms:6000})},4*60000);
 setTimeout(()=>coachLater(()=>coachPop('go','벌써 20분이나 열심히 했어요! 눈이 피곤하면 잠깐 쉬어도 좋아요 🌙','20 minutes of hard work already! Rest your eyes for a bit if they’re tired 🌙',{force:true,ms:7000})),20*60000)}
/*SAYABLE:BEGIN*/
// What the voice says. Symbols a voice reads badly become words: ÷ × + − = between numbers, fractions like 3/4, % ² ³,
// jamo point names (선분 ㄱㄴ → 기역 니은), a lone ? or □ blank, Python's __name__, HTML quotes (&quot;) and Lv.2.
// The screen keeps the symbols. Every game's read-aloud passes through here (the voice guard below), and
// _src/voice/tools/apply-sayable.js runs this same function over the voice line lists so pre-made clips match.
// No lookbehind in these patterns: older iPad Safari can't parse it, and one bad pattern would stop the whole block.
function mgSayable(t,lang){t=String(t==null?'':t);const ko=lang!=='en',o=t;
 const JAMO={'ㄱ':'기역','ㄴ':'니은','ㄷ':'디귿','ㄹ':'리을','ㅁ':'미음','ㅂ':'비읍','ㅅ':'시옷','ㅇ':'이응','ㅈ':'지읒','ㅊ':'치읓','ㅋ':'키읔','ㅌ':'티읕','ㅍ':'피읖','ㅎ':'히읗'};
 const ORD=['','','half','third','fourth','fifth','sixth','seventh','eighth','ninth','tenth','eleventh','twelfth'];
 const UNIT={km:['킬로미터','kilometres'],cm:['센티미터','centimetres'],mm:['밀리미터','millimetres'],m:['미터','metres']};
 // 은/는 after a number or a Hangul syllable, by whether it ends in a consonant sound (0 영, 1 일, 3 삼, 6 육, 7 칠, 8 팔)
 const topic=c=>/[013678]/.test(c)?'은':/[2459]/.test(c)?'는':/[가-힣]/.test(c)?((c.charCodeAt(0)-0xAC00)%28?'은':'는'):'는';
 t=t.replace(/&quot;/g,'"').replace(/&#39;|&apos;/g,"'").replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&');
 t=t.replace(/__([A-Za-z][A-Za-z0-9_]*?)__/g,'$1');
 t=t.replace(/\bLv\.\s?(\d)/g,(m,d)=>(ko?'레벨 ':'level ')+d);
 t=t.replace(/(^|[^A-Za-z])(km|cm|mm|m)([²³])/g,(m,a,u,p)=>a+(/\d$/.test(a)?' ':'')+(ko?(p==='²'?'제곱':'세제곱')+UNIT[u][0]:(p==='²'?'square ':'cubic ')+UNIT[u][1]));
 if(!ko)t=t.replace(/(^|[^\d.,])1 (square|cubic) (kilo|centi|milli)?metres\b/g,'$11 $2 $3metre');
 t=t.replace(/²/g,ko?'의 제곱':' squared').replace(/³/g,ko?'의 세제곱':' cubed');
 t=t.replace(/(^|[^\d\/])(\d+)\/(\d+)(?![\d\/])/g,(m,a,n,d)=>{const N=+n,D=+d;if(!D)return m;
  if(ko)return a+d+'분의 '+n;
  const w=ORD[D];return a+(!w?n+' over '+d:N===1?(D===2?'one half':'one '+w):n+' '+(D===2?'halves':w+'s'))});
 // units after a number become words (single-letter units only after a space, so 1990s stays 1990s)
 const UW={km:['킬로미터','kilometre'],cm:['센티미터','centimetre'],mm:['밀리미터','millimetre'],kg:['킬로그램','kilogram'],mL:['밀리리터','millilitre'],min:['분','minute'],m:['미터','metre'],g:['그램','gram'],L:['리터','litre'],h:['시간','hour'],s:['초','second'],t:['톤','tonne']};
 t=t.replace(/(\d[\d,.]*)(?:\s?(km|cm|mm|kg|mL|min)|\s(m|g|L|h|s|t))(?![A-Za-z가-힣²³])/g,(m,n,a,b)=>{const u=UW[a||b];return n+' '+(ko?u[0]:u[1]+(n==='1'?'':'s'))});
 t=t.replace(/(\d)\s*%/g,'$1'+(ko?' 퍼센트':' percent'));
 t=t.replace(/\s*÷\s*/g,ko?' 나누기 ':' divided by ').replace(/\s*×\s*/g,ko?' 곱하기 ':' times ');
 t=t.replace(/([\d□)\]])\s*\+\s*(?=[\d□(\[])/g,'$1'+(ko?' 더하기 ':' plus '));
 t=t.replace(/([\d□)\]])\s*−\s*(?=[\d□(\[])/g,'$1'+(ko?' 빼기 ':' minus ')).replace(/(\d) - (?=\d)/g,'$1'+(ko?' 빼기 ':' minus '));
 t=t.replace(/(^|[\s,(])\+(\d)/g,'$1'+(ko?'플러스 ':'plus ')+'$2').replace(/(^|[\s,(])−(\d)/g,'$1'+(ko?'마이너스 ':'minus ')+'$2');
 // = only between two things (3 = 3, apples = 3), never when the sign itself is being talked about (“= 는 넣기”, “after =,”)
 t=t.replace(/([\w가-힣)\]□"'])\s*=(?!=)\s*(?=[\w가-힣(□"'−-])/g,(m,c)=>c+(ko?topic(c)+' ':' equals '));
 t=t.replace(/(^|[\s,(])\?(?=[\s,).]|$)/g,'$1'+(ko?'빈칸':'blank'));
 t=t.replace(/\bthe what number\b/gi,'the box').replace(/□/g,ko?' 빈칸 ':' the box ');
 if(ko)t=t.replace(/[ㄱ-ㅎ]+/g,r=>[...r].map(j=>JAMO[j]).join(' '));
 if(t===o)return o; // nothing to change: leave the line exactly as the game wrote it
 return t.replace(/\s+([,.!?])/g,'$1').replace(/\s+/g,' ').trim()}

// Chrome's read-aloud voice can freeze: it says it is speaking, but no sentence ever starts and every later one waits behind it.

//   after(box,api), if given, runs once the teacher has finished reading the step (for example to play a demo).
//   warn:[ko,en] on a step (or on the lesson, for the last page) shows a ⚠️ safety line under the picture and the
//   teacher reads it too: anything a child might copy at home (heat, electricity, magnets...) says how to stay safe.

.btn.ghost:active{box-shadow:0 1px 0 #cfd3f5}
.btn.small{min-height:44px;font-size:15px;padding:0 14px;border-radius:13px}
.btn[disabled]{filter:grayscale(.8);opacity:.55;pointer-events:none}

@keyframes float{50%{transform:translateY(-10px) rotate(-3deg)}}

/* ---------------------------------------------------------------- home */
.home{display:grid;gap:14px}
.hero{display:flex;gap:14px;align-items:center;color:#fff;padding:18px;border-radius:26px;position:relative;overflow:hidden;
 background:linear-gradient(135deg,#ff8a5c,#ff5fa2 45%,#8f5cff);box-shadow:0 14px 34px rgba(30,10,90,.35)}
.hero::after{content:"♞";position:absolute;right:-10px;bottom:-40px;font-size:190px;opacity:.15;line-height:1}
.hero .face{flex:0 0 auto;width:86px;height:86px;border-radius:26px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:54px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
.hero .face .ei{width:76px;height:76px}
.hero .t1{font-size:14px;font-weight:800;opacity:.92}
.hero .t2{font-size:clamp(22px,5vw,28px);font-weight:900;letter-spacing:-.5px;line-height:1.15}
.hero .stats{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.hero .stats span{background:rgba(255,255,255,.22);border-radius:99px;padding:4px 10px;font-size:13px;font-weight:800}
.cta{width:100%;min-height:76px;font-size:21px;border-radius:22px;flex-direction:column;gap:0}
.cta small{font-size:13px;font-weight:800;opacity:.85}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{position:relative;border:0;border-radius:22px;padding:14px 10px 12px;background:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-height:132px;transition:transform .12s}
.tile:active{transform:scale(.96)}
.tile .ic{font-size:44px;line-height:1.1;height:56px;display:grid;place-items:center}
.tile .ic .ei{width:56px;height:56px}
.tile div{display:flex;flex-direction:column;align-items:center}
.tile b{font-size:16px;font-weight:900}
.tile small{font-size:12.5px;font-weight:800;color:var(--muted)}
.tile .dot{position:absolute;top:8px;right:10px;min-width:22px;height:22px;border-radius:99px;background:var(--red);color:#fff;font-size:12px;font-weight:900;display:grid;place-items:center;padding:0 6px;box-shadow:0 2px 6px rgba(216,52,74,.5);animation:pulse 1.6s infinite}
.tile.t-adv{background:linear-gradient(160deg,#e9fff1,#c9f5da)}
.tile.t-rated{background:linear-gradient(160deg,#eef3ff,#d6e2ff)}
.tile.t-rush{background:linear-gradient(160deg,#fff5e3,#ffe0ad)}
.tile.t-battle{background:linear-gradient(160deg,#ffecee,#ffd1d7)}
.tile.t-daily{background:linear-gradient(160deg,#f3ecff,#e2d3ff)}
.tile.t-shop{background:linear-gradient(160deg,#fffbe0,#fff0a8)}
.tile.t-trophy{background:linear-gradient(160deg,#e8fbff,#c6efff)}
.tile.t-bag{background:linear-gradient(160deg,#f6f6f6,#e6e6ee)}
@keyframes pulse{50%{transform:scale(1.12)}}
.missions .row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px dashed var(--line)}
.missions .row:first-of-type{border-top:0}
.missions .ic{font-size:26px;width:34px;text-align:center}
.missions .txt{flex:1;min-width:0;font-weight:800;font-size:15px}
.missions .mbar{height:9px;border-radius:99px;background:#edf0fb;overflow:hidden;margin-top:4px}
.missions .mbar i{display:block;height:100%;background:linear-gradient(90deg,#5ee08f,#2fbf71);border-radius:99px}
.missions .rw{font-weight:900;font-size:14px;color:#8a5a00;white-space:nowrap}
.missions .ok{color:var(--green-d)}
.missions .chest{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px;border-radius:16px;background:#fff7db}
.missions .chest .big{font-size:34px}.missions .chest .big .ei{width:42px;height:42px}
.opp .ei{width:30px;height:30px;vertical-align:-9px}
.resume{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:12px 14px;box-shadow:var(--shadow);border:0;text-align:left;width:100%}
.resume .ic{font-size:36px}
.resume .ic .ei{width:46px;height:46px;border-radius:12px;object-fit:cover}
.foot{text-align:center;color:#d8dbff;font-size:12.5px;font-weight:700;opacity:.85;margin:6px 0 0;line-height:1.6}

/* ---------------------------------------------------------------- adventure map */
.chapters{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory;scrollbar-width:none}
.chapters::-webkit-scrollbar{display:none}
.chap{flex:0 0 auto;scroll-snap-align:start;width:120px;border:0;border-radius:18px;padding:10px 8px;background:rgba(255,255,255,.14);color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.15)}
.chap .ic{font-size:34px;height:44px;display:grid;place-items:center}
.chap .ic .ei{width:44px;height:44px;border-radius:10px;object-fit:cover}
.chap b{font-size:13.5px;font-weight:900;white-space:nowrap}
.chap small{font-size:12px;font-weight:800;opacity:.85}
.chap.on{background:#fff;color:var(--ink);box-shadow:0 6px 16px rgba(0,0,0,.25)}
.chap.locked{opacity:.55}
.banner{position:relative;overflow:hidden;border-radius:24px;padding:18px;color:#fff;display:flex;gap:14px;align-items:center;box-shadow:0 12px 28px rgba(0,0,0,.25)}
.banner .art{flex:0 0 auto;width:96px;height:96px;border-radius:20px;display:grid;place-items:center;font-size:62px;background:rgba(255,255,255,.2)}
.banner .art .ei{width:96px;height:96px;border-radius:20px;object-fit:cover}
.banner h2{margin:0;font-size:24px;font-weight:900;letter-spacing:-.4px}
.banner .skill{display:inline-block;margin:4px 0 6px;padding:3px 10px;border-radius:99px;background:rgba(0,0,0,.2);font-size:13px;font-weight:900}
.banner .prog{font-weight:800;font-size:14px}
.banner .learn{margin-top:8px}
.path{position:relative;margin:14px auto 0;max-width:560px}
.path svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.path path{fill:none;stroke:rgba(255,255,255,.55);stroke-width:10;stroke-linecap:round;stroke-dasharray:2 18}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:0}
.node .ball{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:900;color:#fff;
 background:radial-gradient(circle at 35% 30%,#a99cff,#6b5cff 60%,#4a3cd6);box-shadow:0 6px 0 #3427a8,0 10px 16px rgba(0,0,0,.3);transition:transform .1s}
.node:active .ball{transform:translateY(4px);box-shadow:0 2px 0 #3427a8}
.node.done .ball{background:radial-gradient(circle at 35% 30%,#a6f5c3,#33c46b 60%,#1f9a4f);box-shadow:0 6px 0 #167a3d,0 10px 16px rgba(0,0,0,.3)}
.node.locked .ball{background:radial-gradient(circle at 35% 30%,#d6d8e6,#a3a7bf 70%);box-shadow:0 6px 0 #7b809c;color:#eef}
.node.cur .ball{animation:nodePulse 1.4s infinite}
.node.boss .ball{width:96px;height:96px;font-size:54px;background:radial-gradient(circle at 35% 30%,#ffd1a1,#ff7a45 60%,#d4401c);box-shadow:0 7px 0 #a02c10,0 12px 20px rgba(0,0,0,.35)}
.node.boss .ball .ei{width:84px;height:84px;border-radius:50%;object-fit:cover}
.node.boss.done .ball{background:radial-gradient(circle at 35% 30%,#fff2b0,#ffc83d 60%,#e09a00);box-shadow:0 7px 0 #a86f00}
.node.boss.locked .ball{filter:grayscale(.85) brightness(.9)}
.node .stars{font-size:15px;letter-spacing:-2px;text-shadow:0 2px 3px rgba(0,0,0,.3);min-height:20px}
.node .stars .off{filter:grayscale(1) brightness(1.6);opacity:.5}
.node .tag{font-size:12px;font-weight:900;color:#fff;background:#d4401c;border-radius:99px;padding:1px 8px;margin-top:2px}
.node .me{position:absolute;left:calc(100% + 2px);top:6px;font-size:30px;animation:float 1.8s ease-in-out infinite}
.node .me .ei{width:40px;height:40px}
@keyframes nodePulse{0%,100%{box-shadow:0 6px 0 #3427a8,0 0 0 0 rgba(255,255,255,.7)}50%{box-shadow:0 6px 0 #3427a8,0 0 0 14px rgba(255,255,255,0)}}

/* ---------------------------------------------------------------- game (board) */
.game{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.boardcol{--bs:min(100%,640px,max(300px,calc(100dvh - 190px)));display:flex;flex-direction:column;gap:8px;min-width:0;align-items:center}
.bar{width:100%;max-width:var(--bs);display:flex;align-items:center;gap:10px;color:#fff;min-height:48px}
.bar .av{flex:0 0 auto;width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:30px;overflow:hidden}
.bar .av .ei{width:46px;height:46px;object-fit:cover}
.bar .who{flex:1;min-width:0}
.bar .who b{display:block;font-size:16px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .who small{font-size:13px;font-weight:800;opacity:.85}
.bar .caps{font-size:18px;letter-spacing:-5px;min-height:20px;white-space:nowrap}
.bar .caps em{font-style:normal;letter-spacing:0;font-size:13px;font-weight:900;margin-left:8px;background:rgba(255,255,255,.2);border-radius:99px;padding:1px 7px}
.bar .turn{font-size:13px;font-weight:900;border-radius:99px;padding:5px 11px;background:rgba(255,255,255,.18)}
.bar .turn.on{background:var(--gold);color:#3b2a00;animation:pulse 1.6s infinite}
.thinking i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:#fff;animation:think 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes think{50%{transform:translateY(-6px);opacity:.5}}
.rushbar{display:flex;gap:8px;align-items:center;width:100%;max-width:var(--bs)}
.rushbar .tm{flex:1;height:16px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.rushbar .tm i{display:block;height:100%;background:linear-gradient(90deg,#ffd84d,#ff8a3d);transition:width 1s linear}
.rushbar .tm.low i{background:linear-gradient(90deg,#ff7a7a,#ff3d5a)}
.rushbar b{color:#fff;font-weight:900;font-size:18px;min-width:56px;text-align:center}
.rushbar .lives{font-size:20px;letter-spacing:-2px}
.rushbar .score{background:#fff;color:var(--ink);border-radius:12px;padding:2px 10px}
.frame{position:relative;width:var(--bs);aspect-ratio:1;border-radius:14px;padding:2.2%;background:linear-gradient(145deg,#6b4b32,#3e2a1c);box-shadow:0 18px 40px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.2)}
.board{position:relative;width:100%;height:100%;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border-radius:6px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.sq{position:relative;background:var(--light)}
.sq.dk{background:var(--dark)}
.sq .co{position:absolute;font-size:12px;font-weight:900;line-height:1;pointer-events:none;opacity:.85}
.sq .co.r{left:3px;top:3px}.sq .co.f{right:3px;bottom:2px}
.sq .co{color:var(--dark)}.sq.dk .co{color:var(--light)}
.sq.last::after,.sq.sel::after,.sq.hintF::after,.sq.hintT::after,.sq.bad::after,.sq.good::after,.sq.chk::after{content:"";position:absolute;inset:0;pointer-events:none}
.sq.last::after{background:var(--last)}
.sq.sel::after{background:var(--sel)}
.sq.chk::after{background:radial-gradient(circle,rgba(255,40,40,.95) 0,rgba(255,40,40,.6) 35%,transparent 72%)}
.sq.hintF::after{box-shadow:inset 0 0 0 5px #31e0ff;background:rgba(49,224,255,.25);animation:hintGlow 1s infinite alternate}
.sq.hintT::after{box-shadow:inset 0 0 0 5px #31e0ff;background:rgba(49,224,255,.18);animation:hintGlow 1s infinite alternate}
.sq.bad::after{background:rgba(255,50,70,.6)}
.sq.good::after{background:rgba(60,230,120,.55)}
@keyframes hintGlow{to{box-shadow:inset 0 0 0 5px #fff;background:rgba(49,224,255,.45)}}
.sq.mv::before{content:"";position:absolute;left:50%;top:50%;width:30%;height:30%;margin:-15% 0 0 -15%;border-radius:50%;background:var(--dot);z-index:2;pointer-events:none}
.sq.cap::before{content:"";position:absolute;inset:4%;border-radius:50%;box-shadow:inset 0 0 0 5px var(--dot);z-index:2;pointer-events:none}
.sq.drop{box-shadow:inset 0 0 0 4px rgba(255,255,255,.85)}
.pieces{position:absolute;inset:0;pointer-events:none}
.pc{position:absolute;left:0;top:0;width:12.5%;height:12.5%;transition:transform .22s cubic-bezier(.3,.8,.3,1),opacity .2s;will-change:transform;z-index:3}
.pc.drag{transition:none;z-index:20}
.pc.drag svg{transform:scale(1.18) translateY(-8%)}
.pc.gone{opacity:0;transform:var(--t) scale(.4)!important}
.pc.pop svg{animation:pcPop .35s}
@keyframes pcPop{50%{transform:scale(1.25)}}
.pc svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 3px 2px rgba(0,0,0,.3));transition:transform .12s}
.pc .f{stroke-width:3.2;stroke-linejoin:round;stroke-linecap:round}
.pc .d{fill:none;stroke-width:3;stroke-linecap:round}
.pc .sh{stroke:none;fill:#fff;opacity:.5}
.pc.b .sh{opacity:.22}
/* piece sets */
.ps-classic .pc.w .f{fill:url(#gw-classic);stroke:#363c56}.ps-classic .pc.w .d{stroke:#363c56}.ps-classic .pc.w .e{fill:#363c56}
.ps-classic .pc.b .f{fill:url(#gb-classic);stroke:#0b0d16}.ps-classic .pc.b .d{stroke:#b9c0d8}.ps-classic .pc.b .e{fill:#eef1fb}
.ps-jelly .pc.w .f{fill:url(#gw-jelly);stroke:#c0508a}.ps-jelly .pc.w .d{stroke:#c0508a}.ps-jelly .pc.w .e{fill:#8a2c5e}
.ps-jelly .pc.b .f{fill:url(#gb-jelly);stroke:#1c5a92}.ps-jelly .pc.b .d{stroke:#e2f6ff}.ps-jelly .pc.b .e{fill:#fff}
.ps-neon .pc.w .f{fill:url(#gw-neon);stroke:#14c8e6}.ps-neon .pc.w .d{stroke:#0a8aa3}.ps-neon .pc.w .e{fill:#0a6f86}
.ps-neon .pc.b .f{fill:url(#gb-neon);stroke:#ff4fd8}.ps-neon .pc.b .d{stroke:#ff9bea}.ps-neon .pc.b .e{fill:#ff9bea}
.ps-neon .pc.w svg{filter:drop-shadow(0 0 4px #2ee6ff) drop-shadow(0 3px 2px rgba(0,0,0,.3))}
.ps-neon .pc.b svg{filter:drop-shadow(0 0 4px #ff4fd8) drop-shadow(0 3px 2px rgba(0,0,0,.3))}
.ps-gem .pc.w .f{fill:url(#gw-gem);stroke:#3d8fc4}.ps-gem .pc.w .d{stroke:#3d8fc4}.ps-gem .pc.w .e{fill:#245d86}
.ps-gem .pc.b .f{fill:url(#gb-gem);stroke:#2a0f5c}.ps-gem .pc.b .d{stroke:#e2ccff}.ps-gem .pc.b .e{fill:#fff}
.ps-royal .pc.w .f{fill:url(#gw-royal);stroke:#7a5200}.ps-royal .pc.w .d{stroke:#7a5200}.ps-royal .pc.w .e{fill:#5c3d00}
.ps-royal .pc.b .f{fill:url(#gb-royal);stroke:#e7b52a}.ps-royal .pc.b .d{stroke:#e7b52a}.ps-royal .pc.b .e{fill:#ffd862}
/* board themes */
.bt-classic{--light:#eeeed2;--dark:#769656;--frame1:#6b4b32;--frame2:#3e2a1c}
.bt-wood{--light:#f0d9b5;--dark:#b58863;--frame1:#8a5a33;--frame2:#5a3518}
.bt-ocean{--light:#e3f4ff;--dark:#5b9bd5;--frame1:#2f6db0;--frame2:#163f73;--dot:rgba(10,40,90,.3)}
.bt-candy{--light:#ffeef6;--dark:#f593c0;--frame1:#ff7fb5;--frame2:#c94586;--dot:rgba(120,20,70,.28)}
.bt-ice{--light:#f6fcff;--dark:#a9d2ec;--frame1:#bfe6ff;--frame2:#6aa7d1;--dot:rgba(20,70,110,.3)}
.bt-galaxy{--light:#d6d0ff;--dark:#5a47b8;--frame1:#33256e;--frame2:#120b33;--dot:rgba(255,255,255,.4)}
.bt-galaxy .sq.dk{background:radial-gradient(1.5px 1.5px at 30% 30%,#fff,transparent),radial-gradient(1px 1px at 70% 60%,#fff,transparent),var(--dark)}
.bt-gold{--light:#fff6d8;--dark:#d9a520;--frame1:#f7d36b;--frame2:#a8740a}
.frame.bt-classic,.frame.bt-wood,.frame.bt-ocean,.frame.bt-candy,.frame.bt-ice,.frame.bt-galaxy,.frame.bt-gold{background:linear-gradient(145deg,var(--frame1),var(--frame2))}
.frame.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.promo{position:absolute;inset:0;z-index:40;display:grid;place-items:center;background:rgba(10,10,40,.55);border-radius:14px}
.promo .box{display:flex;gap:8px;background:#fff;padding:12px;border-radius:18px;box-shadow:var(--shadow)}
.promo button{width:68px;height:68px;border:0;border-radius:14px;background:#eef0ff;padding:4px}
.promo .pc{position:static;width:100%;height:100%;transform:none}
.boardmsg{position:absolute;left:50%;top:50%;z-index:35;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;font-size:clamp(26px,6vw,44px);font-weight:900;color:#fff;white-space:nowrap;
 text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 20px rgba(0,0,0,.4);transition:transform .25s cubic-bezier(.2,1.6,.4,1),opacity .2s}
.boardmsg.show{transform:translate(-50%,-50%) scale(1);opacity:1}

/* side panel */
.side{display:flex;flex-direction:column;gap:12px}
.coach{display:flex;gap:10px;align-items:flex-start}
.coach .face{flex:0 0 auto;width:64px;height:64px;border-radius:20px;background:#fff;display:grid;place-items:center;font-size:42px;box-shadow:var(--shadow);overflow:hidden}
.coach .face .ei{width:60px;height:60px}
.coach .face.talk{animation:talk .5s 2}
@keyframes talk{50%{transform:rotate(-6deg) scale(1.06)}}
.bubble{position:relative;flex:1;background:#fff;border-radius:18px;padding:12px 14px;font-weight:800;font-size:16px;box-shadow:var(--shadow);min-height:64px}
.bubble::before{content:"";position:absolute;left:-8px;top:22px;border:8px solid transparent;border-right-color:#fff;border-left:0}
.goal{display:flex;gap:12px;align-items:center}
.goal .ic{font-size:40px;width:52px;text-align:center}
.goal b{display:block;font-size:17px;font-weight:900}
.goal small{font-weight:800;color:var(--muted)}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tool{position:relative;display:flex;align-items:center;justify-content:center;gap:6px;min-height:54px;border:0;border-radius:16px;background:#fff;box-shadow:0 4px 0 #d5d9f2,0 8px 14px rgba(30,20,100,.12);font-weight:900;font-size:15px;color:var(--ink);padding:4px 8px}
.tool:active{transform:translateY(3px);box-shadow:0 1px 0 #d5d9f2}
.tool .ic{font-size:22px}
.tool .ic .ei{width:28px;height:28px}
.tool .n{position:absolute;top:-6px;right:-4px;min-width:22px;height:22px;border-radius:99px;background:var(--brand);color:#fff;font-size:12px;display:grid;place-items:center;padding:0 6px;box-shadow:0 2px 5px rgba(0,0,0,.25)}
.tool .n.zero{background:#a3a7bf}
.tool.on{background:#e6fff0;box-shadow:0 4px 0 #9fe2bb,0 8px 14px rgba(30,20,100,.12)}
.tool.warn{background:#fff0f2;box-shadow:0 4px 0 #f6c0c8}
.tool.wide{grid-column:1/-1}
.tool[disabled]{opacity:.5;pointer-events:none}
.movelist{max-height:170px;overflow:auto;font-size:14px;font-weight:800;display:grid;grid-template-columns:36px 1fr 1fr;gap:2px 8px;padding:10px 14px}
.movelist span{color:var(--muted)}
.movelist .cur{background:#fff2b8;border-radius:6px;padding:0 4px}

/* ---------------------------------------------------------------- lists: battle, shop, trophies */
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.bot{display:flex;gap:12px;align-items:center;border:0;text-align:left;background:#fff;border-radius:20px;padding:12px;box-shadow:var(--shadow);position:relative;width:100%}
.bot .pt{position:relative;flex:0 0 auto;width:74px;height:74px;border-radius:20px;display:grid;place-items:center;font-size:48px;background:linear-gradient(160deg,#fff3e6,#ffd9b8);overflow:hidden}
.bot .pt .ei{width:74px;height:74px;object-fit:cover}
.bot b{font-size:17px;font-weight:900;display:block}
.bot small{display:block;font-weight:800;color:var(--muted);font-size:13px}
.bot .pw{display:inline-flex;gap:4px;align-items:center;margin-top:4px;font-size:13px;font-weight:900;color:#b0410f;background:#ffe9dc;border-radius:99px;padding:2px 9px;white-space:nowrap}

.trophy{display:flex;gap:12px;align-items:center;background:#fff;border-radius:18px;padding:12px;box-shadow:var(--shadow)}

.section-title{color:#fff;font-size:22px;font-weight:900;margin:4px 0 12px;letter-spacing:-.4px;display:flex;align-items:center;gap:10px}

.panelhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}

/* ---------------------------------------------------------------- modals, toasts, effects */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(14,10,50,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fadeIn .2s}
.modal .box{position:relative;width:min(440px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:#fff;border-radius:28px;padding:22px 20px 20px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.4);animation:popIn .35s cubic-bezier(.2,1.4,.4,1)}
.modal h2{margin:4px 0 6px;font-size:26px;font-weight:900;letter-spacing:-.5px}
.modal p{margin:6px 0;font-weight:700;color:var(--muted);word-break:keep-all;overflow-wrap:break-word}
.modal .row{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.modal .row .btn{flex:1;min-width:130px}
.modal .row .btn.rvgo{flex-basis:100%;white-space:nowrap} /* "review the game" gets its own line on a phone */
.modal .x{position:absolute;top:8px;right:8px;width:44px;height:44px;border-radius:50%;border:0;background:#f0f1fa;font-size:18px;z-index:2}
.modal .box:focus{outline:none}
@keyframes fadeIn{from{opacity:0}}
@keyframes popIn{from{opacity:0;transform:scale(.7)}}
.bigstars{display:flex;justify-content:center;gap:6px;font-size:58px;margin:6px 0 2px;min-height:72px}
.bigstars span{display:inline-block;opacity:0;transform:scale(.2) rotate(-40deg)}
.bigstars span.in{animation:starIn .45s cubic-bezier(.2,1.6,.4,1) forwards}
.bigstars span.dim{filter:grayscale(1);opacity:.25!important;transform:none!important;animation:none}
@keyframes starIn{to{opacity:1;transform:scale(1) rotate(0)}}
.rewards{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:12px 0 4px}
.rewards span{display:inline-flex;align-items:center;gap:5px;background:#f3f4ff;border-radius:99px;padding:7px 13px;font-weight:900;font-size:15.5px}
.rewards span.coin{background:#fff4cc;color:#7a4b00}
.rewards span.xp{background:#e2f6ff;color:#0b5c84}
.rewards span.rate{background:#efe9ff;color:#4b2fb0}
.rewards span.item{background:#e6fff0;color:#1b7a42}
.math{margin:10px auto 0;display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:18px;color:#7a4b00;background:#fffaf0;border:2px dashed #ffd36b;border-radius:14px;padding:6px 14px}
.math .ei{width:24px;height:24px}
.levelup .rays{position:absolute;left:50%;top:92px;width:420px;height:420px;margin:-210px 0 0 -210px;pointer-events:none;opacity:.5;
 background:repeating-conic-gradient(from 0deg,#ffe58a 0 10deg,transparent 10deg 20deg);border-radius:50%;-webkit-mask:radial-gradient(circle,#000 20%,transparent 68%);mask:radial-gradient(circle,#000 20%,transparent 68%);animation:spin 8s linear infinite}
.levelup .num{position:relative;width:120px;height:120px;margin:4px auto 0;border-radius:50%;display:grid;place-items:center;font-size:54px;font-weight:900;color:#3b2a00;
 background:radial-gradient(circle at 35% 30%,#fff6c9,#ffc83d 55%,#e09a00);box-shadow:0 0 0 6px #fff3c4,0 10px 26px rgba(224,154,0,.5);animation:popIn .6s cubic-bezier(.2,1.6,.4,1)}
.levelup .lbl{position:relative;font-size:30px;font-weight:900;color:var(--brand);letter-spacing:1px;margin-top:10px}
@keyframes spin{to{transform:rotate(360deg)}}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.choices button{min-height:56px;border-radius:16px;border:0;background:#eef0ff;font-weight:900;font-size:22px;box-shadow:0 4px 0 #cfd3f5}
.choices button.right{background:#d8ffe6;box-shadow:0 4px 0 #8fdcae}
.choices button.wrong{background:#ffe1e5;box-shadow:0 4px 0 #f3a8b3}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.calendar div{border-radius:12px;padding:8px 2px;background:#f3f4ff;font-size:12px;font-weight:900;color:var(--muted)}
.calendar div b{display:block;font-size:22px;line-height:1.3}
.calendar div.got{background:#e3f8eb;color:var(--green-d)}
.calendar div.today{background:#fff4cc;color:#7a4b00;box-shadow:0 0 0 3px var(--gold);animation:pulse 1.4s infinite}
.toasts{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,420px)}
.toast{background:#fff;border-radius:16px;padding:10px 16px;font-weight:900;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:toastIn .35s cubic-bezier(.2,1.4,.4,1),toastOut .3s 2.4s forwards;display:flex;gap:8px;align-items:center}
.toast .ei{width:26px;height:26px}
@keyframes toastIn{from{opacity:0;transform:translateY(-16px) scale(.9)}}
@keyframes toastOut{to{opacity:0;transform:translateY(-10px)}}
.fx{position:fixed;inset:0;pointer-events:none;z-index:75;overflow:hidden}
.fx i{position:absolute;display:block;will-change:transform,opacity}
.flycoin{position:fixed;z-index:76;pointer-events:none;width:30px;height:30px}
.flycoin .ei{width:30px;height:30px}
.settings .row{justify-content:space-between;align-items:center;margin-top:10px;padding:10px 12px;background:#f6f7ff;border-radius:14px;font-weight:900;color:var(--ink)}
.settings button.row{width:100%;border:0;min-height:54px;flex-wrap:nowrap;text-align:left;font:inherit;font-weight:900;color:var(--ink);cursor:pointer}
.settings button.row>span:first-child{flex:1;min-width:0}
.settings button.row:active{background:#eceefe}
.settings button.row.danger{color:var(--red-d);background:#fff0f2}
.settings button.row.danger b{font-size:22px;line-height:1}
.settings .note{margin:10px 2px 0;text-align:left;font-size:14px}
.seg{display:inline-flex;flex:0 0 auto;gap:3px;padding:3px;border-radius:14px;background:#e4e7fa}
.seg button{min-height:44px;min-width:84px;padding:0 12px;border:0;border-radius:11px;background:none;font-weight:900;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--brand-d);box-shadow:0 2px 6px rgba(30,20,100,.15)}
.modal p.credit{font-size:12.5px;margin-top:14px}
.modal p.copy{font-size:12.5px;margin:4px 0 0}
.meline{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 40px 4px}
.meline .mav{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:32px;background:#f0eeff;box-shadow:0 0 0 3px #ffd36b}
.meline b{font-size:19px;font-weight:900;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.switch{display:block;width:58px;height:32px;border-radius:99px;border:0;background:#c9cce0;position:relative;flex:0 0 auto}
.switch::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .18s;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.switch.on{background:var(--green)}
.switch.on::after{left:30px}
.values{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.values span{display:flex;flex-direction:column;align-items:center;font-weight:900;background:#f3f4ff;border-radius:12px;padding:4px 8px;min-width:52px}
.values .pc{position:static;width:38px;height:38px;transform:none}
/* lesson boards inside the mini lessons (lbDraw): the main board's squares and pieces, drawn small from a FEN */
.lbw{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.lb{position:relative;width:min(calc(var(--c) * 52px),100%,316px);aspect-ratio:var(--c)/var(--r);display:grid;grid-template-columns:repeat(var(--c),1fr);grid-template-rows:repeat(var(--r),1fr);margin:4px;border-radius:8px;overflow:hidden;box-shadow:0 0 0 4px var(--frame1,#6b4b32),0 8px 18px rgba(30,20,90,.25);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.lb.try .sq{cursor:pointer}
.mlx-stage:has(.lbw){flex-shrink:0} /* never squeeze a lesson board; the lesson card scrolls instead */
@media (max-height:720px){.lb{width:min(calc(var(--c) * 52px),100%,236px)}}
.lb .sq .co{font-size:12px} /* board coordinates stay readable (12 px, the game's smallest text) */
.lb-pcs{position:absolute;inset:0;pointer-events:none}
.lb .pc{width:calc(100% / var(--c));height:calc(100% / var(--r))}
.lb-ar{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
.lb .sq.lbx::before{content:"✕";position:absolute;inset:0;display:grid;place-items:center;color:#e8243c;font-size:24px;font-weight:900;line-height:1;text-shadow:0 0 3px #fff,0 0 6px #fff;z-index:4;pointer-events:none}
.lbcap{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;background:#fff;border-radius:12px;padding:4px 12px;font-size:16px;font-weight:900;color:#26326a;box-shadow:0 2px 0 #e1e7fb}
.lb-re{min-height:40px;border:0;border-radius:20px;padding:0 14px;background:#eef1ff;color:#3a4690;font:inherit;font-size:14px;font-weight:900;cursor:pointer}
.lbic{display:inline-block;width:1.25em;height:1.25em;vertical-align:-.28em}
.lbic .pc,.lbpc .pc,.lbpro .pc{position:static;display:block;width:100%;height:100%;transform:none}
.lbpc{display:inline-block;width:30px;height:30px}
.lbpro{display:flex;gap:10px;justify-content:center;background:#fff;border-radius:16px;padding:10px 14px;box-shadow:0 4px 12px rgba(30,20,90,.15)}
.lbpro .pc{width:54px;height:54px}
.lbth{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.lbth span{background:#fff;border-radius:14px;padding:8px 12px;font-size:15px;font-weight:900;box-shadow:0 2px 0 #e1e7fb}
.mlx .values>span{min-width:50px;padding:4px 6px;font-size:15px}.mlx .values .pc{width:40px;height:40px;min-width:0;padding:0;background:none}
.goal .mlx-chip{margin-top:6px}

<script id="engineSrc">
/*ENGINE-START*/
// Chess rules and a small alpha-beta AI. 0x88 board: sq = row*16 + col, row 0 is rank 8 (top), col 0 is the a-file.
// Piece codes: type 1-6 (P N B R Q K) plus 8 for black. No DOM access, so it can be tested headless.
const Chess=(()=>{
const P=1,N=2,B=3,R=4,Q=5,K=6,WHITE=0,BLACK=8;
const typeOf=p=>p&7,colorOf=p=>p&8;
const KNIGHT=[-33,-31,-18,-14,14,18,31,33],KING=[-17,-16,-15,-1,1,15,16,17],DIAG=[-17,-15,15,17],ORTH=[-16,-1,1,16];
const CH='.PNBRQK..pnbrqk',LETTER='.PNBRQK';
const START_FEN='rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
const sqName=s=>'abcdefgh'[s&7]+(8-(s>>4));
const sqOf=n=>(8-(+n[1]))*16+(n.charCodeAt(0)-97);
// castling rights left after a move touches a square (a8 e8 h8 / a1 e1 h1)
const CR=new Int8Array(128).fill(15);CR[0]=7;CR[4]=3;CR[7]=11;CR[112]=13;CR[116]=12;CR[119]=14;

class Position{
 constructor(fen){this.load(fen||START_FEN)}
 load(fen){
  const [pl,turn,cas='-',ep='-',hm='0',fm='1']=fen.trim().split(/\s+/);
  this.b=new Int8Array(128);this.ks=[-1,-1];let r=0,c=0;
  for(const ch of pl){
   if(ch==='/'){r++;c=0}
   else if(ch>='1'&&ch<='8')c+=+ch;
   else{const p=CH.indexOf(ch);if(p<=0)throw new Error('bad FEN '+fen);const s=r*16+c;this.b[s]=p;if(typeOf(p)===K)this.ks[colorOf(p)>>3]=s;c++}
  }
  this.turn=turn==='b'?BLACK:WHITE;
  this.castle=(cas.includes('K')?1:0)|(cas.includes('Q')?2:0)|(cas.includes('k')?4:0)|(cas.includes('q')?8:0);
  this.ep=ep!=='-'?sqOf(ep):-1;this.half=+hm||0;this.full=+fm||1;this.hist=[];
  return this;
 }
 fen(){
  let s='';
  for(let r=0;r<8;r++){let e=0;for(let c=0;c<8;c++){const p=this.b[r*16+c];if(!p)e++;else{if(e){s+=e;e=0}s+=CH[p]}}if(e)s+=e;if(r<7)s+='/'}
  const cas=(this.castle&1?'K':'')+(this.castle&2?'Q':'')+(this.castle&4?'k':'')+(this.castle&8?'q':'')||'-';
  return `${s} ${this.turn?'b':'w'} ${cas} ${this.ep<0?'-':sqName(this.ep)} ${this.half} ${this.full}`;
 }
 // board + side + castling + en passant: equal keys mean the same position for repetition
 key(){return this.fen().split(' ').slice(0,4).join(' ')}
 attacked(sq,by){
  const b=this.b;
  if(by===WHITE){if(!((sq+15)&0x88)&&b[sq+15]===P)return true;if(!((sq+17)&0x88)&&b[sq+17]===P)return true}
  else{if(!((sq-15)&0x88)&&b[sq-15]===(P|BLACK))return true;if(!((sq-17)&0x88)&&b[sq-17]===(P|BLACK))return true}
  for(const d of KNIGHT){const s=sq+d;if(!(s&0x88)&&b[s]===(N|by))return true}
  for(const d of KING){const s=sq+d;if(!(s&0x88)&&b[s]===(K|by))return true}
  for(const d of DIAG){let s=sq+d;while(!(s&0x88)){const p=b[s];if(p){if(p===(B|by)||p===(Q|by))return true;break}s+=d}}
  for(const d of ORTH){let s=sq+d;while(!(s&0x88)){const p=b[s];if(p){if(p===(R|by)||p===(Q|by))return true;break}s+=d}}
  return false;
 }
 inCheck(side=this.turn){return this.attacked(this.ks[side>>3],side^8)}
 pseudo(capsOnly){
  const b=this.b,us=this.turn,them=us^8,mv=[];
  const add=(f,t,fl=0,c=b[t])=>{
   const p=b[f];
   if(typeOf(p)===P&&((t>>4)===0||(t>>4)===7)){for(const pt of [Q,R,B,N])mv.push({f,t,p,c,pr:pt|us,fl})}
   else mv.push({f,t,p,c,pr:0,fl});
  };
  for(let sq=0;sq<120;sq++){
   if(sq&0x88){sq+=7;continue}
   const p=b[sq];if(!p||colorOf(p)!==us)continue;const t=typeOf(p);
   if(t===P){
    const dir=us===WHITE?-16:16,row=sq>>4,one=sq+dir;
    if(!(one&0x88)&&!b[one]){
     const promo=(one>>4)===0||(one>>4)===7;
     if(!capsOnly||promo)add(sq,one);
     if(!capsOnly&&row===(us===WHITE?6:1)&&!b[one+dir])add(sq,one+dir,1);
    }
    for(const to of [one-1,one+1]){
     if(to&0x88)continue;
     if(b[to]&&colorOf(b[to])===them)add(sq,to);
     else if(to===this.ep)add(sq,to,2,P|them);
    }
   }else if(t===N||t===K){
    for(const d of t===N?KNIGHT:KING){const to=sq+d;if(to&0x88)continue;const q=b[to];if(!q){if(!capsOnly)add(sq,to)}else if(colorOf(q)===them)add(sq,to)}
    if(t===K&&!capsOnly)this.castles(sq,add);
   }else{
    for(const d of t===B?DIAG:t===R?ORTH:KING){
     let to=sq+d;
     while(!(to&0x88)){const q=b[to];if(!q){if(!capsOnly)add(sq,to)}else{if(colorOf(q)===them)add(sq,to);break}to+=d}
    }
   }
  }
  return mv;
 }
 castles(sq,add){
  const b=this.b,us=this.turn,them=us^8,home=us===WHITE?116:4;
  if(sq!==home||this.attacked(home,them))return;
  const ks=us===WHITE?1:4,qs=us===WHITE?2:8;
  if(this.castle&ks&&!b[home+1]&&!b[home+2]&&b[home+3]===(R|us)&&!this.attacked(home+1,them)&&!this.attacked(home+2,them))add(home,home+2,4);
  if(this.castle&qs&&!b[home-1]&&!b[home-2]&&!b[home-3]&&b[home-4]===(R|us)&&!this.attacked(home-1,them)&&!this.attacked(home-2,them))add(home,home-2,4);
 }
 make(m){
  const b=this.b,us=this.turn;
  this.hist.push([m,this.castle,this.ep,this.half,this.ks[0],this.ks[1]]);
  b[m.t]=m.pr||m.p;b[m.f]=0;
  if(m.fl&2)b[us===WHITE?m.t+16:m.t-16]=0;
  if(m.fl&4){const rf=m.t>m.f?m.t+1:m.t-2,rt=m.t>m.f?m.t-1:m.t+1;b[rt]=b[rf];b[rf]=0}
  if(typeOf(m.p)===K)this.ks[us>>3]=m.t;
  this.castle&=CR[m.f]&CR[m.t];
  this.ep=m.fl&1?(m.f+m.t)>>1:-1;
  this.half=typeOf(m.p)===P||m.c?0:this.half+1;
  if(us===BLACK)this.full++;
  this.turn=us^8;
 }
 undo(){
  const [m,castle,ep,half,k0,k1]=this.hist.pop(),b=this.b;
  this.turn^=8;const us=this.turn;
  b[m.f]=m.p;
  if(m.fl&2){b[m.t]=0;b[us===WHITE?m.t+16:m.t-16]=m.c}else b[m.t]=m.c;
  if(m.fl&4){const rf=m.t>m.f?m.t+1:m.t-2,rt=m.t>m.f?m.t-1:m.t+1;b[rf]=b[rt];b[rt]=0}
  this.castle=castle;this.ep=ep;this.half=half;this.ks[0]=k0;this.ks[1]=k1;
  if(us===BLACK)this.full--;
 }
 legal(capsOnly){
  const us=this.turn,out=[];
  for(const m of this.pseudo(capsOnly)){this.make(m);if(!this.attacked(this.ks[us>>3],us^8))out.push(m);this.undo()}
  return out;
 }
 uci(m){return sqName(m.f)+sqName(m.t)+(m.pr?LETTER[typeOf(m.pr)].toLowerCase():'')}
 fromUci(u){
  const f=sqOf(u.slice(0,2)),t=sqOf(u.slice(2,4)),pr=u[4];
  return this.legal().find(m=>m.f===f&&m.t===t&&(!m.pr||LETTER[typeOf(m.pr)].toLowerCase()===(pr||'q')))||null;
 }
 san(m,legal=this.legal()){
  const t=typeOf(m.p);let s;
  if(m.fl&4)s=m.t>m.f?'O-O':'O-O-O';
  else{
   s=t===P?'':LETTER[t];
   if(t!==P&&t!==K){
    const others=legal.filter(o=>o.t===m.t&&o.p===m.p&&o.f!==m.f);
    if(others.length){
     const sameFile=others.some(o=>(o.f&7)===(m.f&7)),sameRank=others.some(o=>(o.f>>4)===(m.f>>4));
     s+=!sameFile?'abcdefgh'[m.f&7]:!sameRank?String(8-(m.f>>4)):sqName(m.f);
    }
   }
   if(m.c){if(t===P)s+='abcdefgh'[m.f&7];s+='x'}
   s+=sqName(m.t);
   if(m.pr)s+='='+LETTER[typeOf(m.pr)];
  }
  this.make(m);if(this.inCheck())s+=this.legal().length?'+':'#';this.undo();
  return s;
 }
 // only kings, or kings plus one bishop or knight, or one bishop each on the same colour
 insufficient(){
  const minors=[];
  for(let s=0;s<120;s++){if(s&0x88){s+=7;continue}const p=this.b[s];if(!p||typeOf(p)===K)continue;if(typeOf(p)===P||typeOf(p)===R||typeOf(p)===Q)return false;minors.push([p,s])}
  if(minors.length<=1)return true;
  if(minors.length===2&&typeOf(minors[0][0])===B&&typeOf(minors[1][0])===B&&colorOf(minors[0][0])!==colorOf(minors[1][0])){
   const shade=s=>((s>>4)+(s&7))&1;return shade(minors[0][1])===shade(minors[1][1]);
  }
  return false;
 }
 // 'mate' | 'stalemate' | 'fifty' | 'material' | null (threefold repetition is tracked by the caller)
 status(){
  if(!this.legal().length)return this.inCheck()?'mate':'stalemate';
  if(this.half>=100)return 'fifty';
  if(this.insufficient())return 'material';
  return null;
 }
 // material count per side in pawns, for the "+3" score next to captured pieces
 material(){const v=[0,1,3,3,5,9,0],out=[0,0];for(let s=0;s<120;s++){if(s&0x88){s+=7;continue}const p=this.b[s];if(p)out[colorOf(p)>>3]+=v[typeOf(p)]}return out}
}

// ---------------------------------------------------------------- AI
const VAL=[0,100,320,330,500,900,0],MATE=30000,INF=1e9;
// Positional bonuses written for this game as simple formulas (white's view, index 0 = a8):
// minor pieces and the queen like the centre, pawns like to advance, rooks like the 7th rank,
// the king hides in a corner until the endgame and then walks to the centre.
const ring=i=>3.5-Math.max(Math.abs((i>>3)-3.5),Math.abs((i&7)-3.5)); // 0 on the edge .. 3 in the middle
const table=f=>Array.from({length:64},(_,i)=>Math.round(f(i>>3,i&7,ring(i))));
const PST=[[],
 table((r,c)=>[0,60,32,18,10,4,0,0][r]+((c===3||c===4)&&r<=4?8:0)-((c===3||c===4)&&r===6?10:0)),
 table((r,c,k)=>k*10-25),
 table((r,c,k)=>k*6-10),
 table((r,c)=>(r===1?12:0)+(r===7&&(c===3||c===4)?4:0)),
 table((r,c,k)=>k*4-6),
 table((r,c)=>r===7?(c<=2||c>=6?20:0):-(7-r)*8-10)];
const KING_END=table((r,c,k)=>k*12-18);

// score from the side to move's point of view
function evaluate(pos){
 const b=pos.b;let mg=0,heavy=0,mat=[0,0];
 for(let s=0;s<120;s++){if(s&0x88){s+=7;continue}const p=b[s];if(!p)continue;const t=typeOf(p);if(t!==P&&t!==K)heavy+=VAL[t];mat[colorOf(p)>>3]+=VAL[t]}
 const end=heavy<=1500;
 for(let s=0;s<120;s++){
  if(s&0x88){s+=7;continue}
  const p=b[s];if(!p)continue;const t=typeOf(p),white=!colorOf(p),i=white?(s>>4)*8+(s&7):(7-(s>>4))*8+(s&7);
  const v=VAL[t]+(t===K&&end?KING_END[i]:PST[t][i]);mg+=white?v:-v;
 }
 // mop-up: the side that is clearly ahead in an endgame drives the other king to the edge
 if(end&&Math.abs(mat[0]-mat[1])>=300){
  const lead=mat[0]>mat[1]?0:1,mine=pos.ks[lead],theirs=pos.ks[lead^1];
  const r=theirs>>4,c=theirs&7,center=Math.max(3-r,r-4)+Math.max(3-c,c-4),dist=Math.abs((mine>>4)-r)+Math.abs((mine&7)-c);
  const bonus=center*12+(14-dist)*5;mg+=lead===0?bonus:-bonus;
 }
 return pos.turn===WHITE?mg:-mg;
}
const orderScore=m=>(m.c?10000+10*VAL[typeOf(m.c)]-VAL[typeOf(m.p)]:0)+(m.pr?9000:0);
function quiesce(pos,alpha,beta,ctx,qd){
 ctx.nodes++;
 const stand=evaluate(pos);if(stand>=beta)return beta;if(stand>alpha)alpha=stand;if(qd<=0)return alpha;
 const moves=pos.legal(true).sort((a,b)=>orderScore(b)-orderScore(a));
 for(const m of moves){pos.make(m);const sc=-quiesce(pos,-beta,-alpha,ctx,qd-1);pos.undo();if(sc>=beta)return beta;if(sc>alpha)alpha=sc}

}

const rnd=n=>Math.floor(Math.random()*n),pick=a=>a[rnd(a.length)];

const PIC_MISS=new Set();
const pic=(src,emoji)=>src&&!PIC_MISS.has(src)?`<img class="ei" src="${src}" data-emoji="${emoji}" alt="" draggable="false">`:emoji;
document.addEventListener('error',e=>{const t=e.target;if(t&&t.tagName==='IMG'&&t.dataset.emoji!==undefined){PIC_MISS.add(t.getAttribute('src'));t.replaceWith(document.createTextNode(t.dataset.emoji))}},true);
// each mode's picture (images/chess-mode-<k>.webp): home tiles, puzzle bars and result windows; the emoji until it is drawn

// Korean particle after a name: 이/가, 은/는, 을/를 depending on the last syllable
const josa=(w,a,b)=>{const c=String(w).trim().slice(-1).charCodeAt(0);return w+(c>=0xac00&&c<=0xd7a3&&(c-0xac00)%28?a:b)};
const pcl=(w,a,b)=>josa(w,a,b).slice(String(w).length); // the particle alone, for a name shown in quotes
const {Position,WHITE,BLACK,typeOf,colorOf}=Chess;

// ---------------------------------------------------------------- puzzles

const THEMES={

 f:{icon:'🍴',name:L('포크','Fork'),goal:L('포크! 한 기물로 두 개를 동시에 공격해요!','Fork! Attack two pieces at once!'),miss:L('한 번에 두 기물을 공격할 수 있는 칸을 찾아봐요.','Find a square that attacks two pieces at once.')},
 p:{icon:'📌',name:L('핀','Pin'),goal:L('핀! 뒤에 숨은 큰 기물을 노려요!','Pin! Aim at the big piece hiding behind!'),miss:L('같은 줄에 나란히 선 상대 기물 두 개를 찾아봐요.','Look for two enemy pieces lined up.')},

 d:{icon:'💥',name:L('숨은 공격','Discovered attack'),goal:L('숨은 공격! 한 기물이 비키면 뒤의 기물이 공격해요!','Discovered attack! Move one piece to unleash another!'),miss:L('내 기물 하나를 비키면 열리는 공격이 있어요.','Moving one of your pieces can open up an attack.')},

 m3:{icon:'👑',name:L('3수 체크메이트','Mate in 3'),goal:L('세 수 만에 체크메이트!','Checkmate in three moves!'),miss:L('체크를 이어 가면서 킹이 도망칠 칸을 하나씩 막아 봐요.','Keep giving checks and take away the king’s escape squares one by one.'),note:L('긴 메이트는 “내 체크 → 상대 응수 → 다음 체크” 순서로 생각해요. 체크와 잡기처럼 상대가 고를 수 있는 수가 적은 강제 수부터 보면 끝까지 읽을 수 있어요.','Plan a long mate as check, reply, check. Forcing moves like checks and captures leave the opponent few answers, so you can see all the way to the end.')},
 sm:{icon:'🐴',name:L('스머더드 메이트','Smothered mate'),goal:L('자기 기물에 꽉 막힌 킹을 나이트로 체크메이트해요!','Checkmate a king boxed in by its own pieces, with a knight!'),miss:L('킹 둘레가 자기 기물로 꽉 차 있어요. 나이트로 체크할 칸을 찾아봐요. 퀸을 내주는 수가 먼저일 수도 있어요!','The king is surrounded by its own pieces. Find a knight check. A queen sacrifice may come first!'),note:L('킹이 자기 기물들에 둘러싸여 움직일 칸이 없을 때, 나이트 체크는 사이를 막을 수 없어서 바로 메이트예요. 퀸을 희생해서 상대 룩이 킹의 마지막 빈칸을 막게 만든 뒤 나이트로 끝내기도 해요.','When a king is boxed in by its own pieces, a knight check can’t be blocked, so it is mate. Sometimes a queen sacrifice first makes a rook fill the king’s last free square.')},
 dc:{icon:'✌️',name:L('더블 체크','Double check'),goal:L('두 기물로 한꺼번에 체크해요!','Give check with two pieces at once!'),miss:L('내 기물 하나가 체크하면서 비키면, 뒤에 있던 기물도 체크하게 되는 수를 찾아봐요.','Find a move where one piece gives check and also uncovers a check from the piece behind it.'),note:L('더블 체크는 두 기물이 동시에 체크하는 거예요. 막거나 잡는 걸로는 두 체크를 한 번에 못 풀어서, 킹이 직접 도망가야만 해요.','In a double check, two pieces check the king at once. Blocking or capturing can’t stop both, so the king itself must move.')},
 in:{icon:'🚧',name:L('끼어들기','Interference'),goal:L('상대 기물들 사이에 끼어들어 지키는 길을 끊어요!','Jump in between enemy pieces and cut the line that protects!'),miss:L('상대 기물 하나가 멀리서 다른 칸을 지키고 있어요. 그 길 한가운데에 내 기물을 놓아 봐요.','An enemy piece guards something from far away. Put one of your pieces right in the middle of its path.'),note:L('룩, 비숍, 퀸은 긴 줄을 따라 멀리 있는 칸을 지켜요. 그 줄 중간에 내 기물을 끼워 넣으면 지키는 힘이 끊겨요.','Rooks, bishops and queens guard faraway squares along long lines. Put a piece in the middle of that line and the protection is cut.')},
 xr:{icon:'👀',name:L('엑스레이','X-ray'),goal:L('기물을 꿰뚫어 보듯 그 뒤의 칸까지 노려요!','Look straight through a piece to the square behind it!'),miss:L('룩·비숍·퀸이 기물 하나를 사이에 두고 그 뒤를 노리고 있어요. 그 줄을 살펴봐요.','A rook, bishop or queen aims through one piece at what is behind it. Check that line.'),note:L('엑스레이는 긴 줄 위에서 기물 하나를 사이에 두고도 그 뒤의 칸을 공격하거나 지키는 힘이에요. 앞의 기물이 잡거나 비키는 순간 뒤의 힘이 살아나요.','An X-ray is a long-range piece attacking or guarding a square through another piece on the same line. As soon as the piece in front trades off or moves, the power behind it comes alive.')},
 cl:{icon:'🧹',name:L('길 열기','Clearance'),goal:L('내 기물을 비켜서 다른 내 기물이 쓸 길을 열어요!','Move your own piece out of the way to open a path for another!'),miss:L('내 기물이 다른 내 기물의 길을 막고 있어요. 체크나 공격을 하면서 비켜 봐요.','One of your pieces is in another one’s way. Move it with a check or a threat.'),note:L('가장 좋은 칸이나 줄을 내 기물이 막고 있을 때가 있어요. 그 기물을 체크나 희생으로 힘차게 비키면 뒤의 기물이 그 길로 들어갈 수 있어요.','Sometimes your own piece blocks the best square or line. Move it away with force, like a check or a sacrifice, so the piece behind can use that path.')},
 ov:{icon:'🏋️',name:L('과부하','Overloading'),goal:L('일이 두 개인 수비수를 찾아서 한 가지만 하게 만들어요!','Find the defender with two jobs and make it do just one!'),miss:L('상대 기물 하나가 두 곳을 한꺼번에 지키고 있어요. 그중 한 곳을 먼저 잡아 봐요.','One enemy piece is guarding two things at once. Take one of them first.'),note:L('한 기물이 두 가지를 동시에 지키고 있으면 과부하예요. 한쪽을 잡아서 그 기물이 되잡게 만들면, 다른 쪽은 지키는 기물이 없어져요.','A piece that guards two things at once is overloaded. Take one of them, and when it takes back, the other thing is left with no guard.')},
 iz:{icon:'✋',name:L('중간 수','In-between move'),goal:L('바로 되잡지 말고, 먼저 더 센 수를 끼워 넣어요!','Don’t take back right away: play a stronger move first!'),miss:L('당연해 보이는 수를 두기 전에 체크나 더 큰 위협이 있는지 찾아봐요.','Before the obvious move, look for a check or a bigger threat.'),note:L('중간 수는 상대가 기다리는 수 대신 체크나 큰 위협을 먼저 두는 거예요. 상대가 그것부터 막는 동안 원래 하려던 수도 결국 할 수 있어요.','An in-between move (also called an intermezzo or zwischenzug) is a check or big threat played before the expected move. While the opponent deals with it, you still get to play your first idea.')},

function knock(v=.4,f=1000){const a=audio();if(!a)return;if(!noiseBuf){noiseBuf=a.createBuffer(1,Math.floor(a.sampleRate*.07),a.sampleRate);const ch=noiseBuf.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1)*Math.pow(1-i/ch.length,5)}

const BD={pos:null,flip:false,side:WHITE,ids:new Int16Array(128).fill(-1),els:{},next:1,sel:-1,targets:[],last:null,hint:null,interactive:false,onMove:null,drag:null};
const sqAt=i=>{let r=i>>3,c=i&7;if(BD.flip){r=7-r;c=7-c}return r*16+c};
const dispOf=sq=>{let r=sq>>4,c=sq&7;if(BD.flip){r=7-r;c=7-c}return [r,c]};
function boardBuild(){
 let h='';for(let i=0;i<64;i++)h+='<div class="sq"></div>';

 $('board').addEventListener('pointerdown',onDown);

function paintSquares(){

 for(let i=0;i<64;i++){const s=sqAt(i),r=s>>4,c=s&7,el=sqs[i];el.className='sq'+((r+c)&1?' dk':'');el.dataset.sq=s;
  el.innerHTML=((i&7)===0?`<span class="co r">${8-r}</span>`:'')+((i>>3)===7?`<span class="co f">${'abcdefgh'[c]}</span>`:'')}
}
function placeEl(el,sq){const [r,c]=dispOf(sq),t=`translate(${c*100}%,${r*100}%)`;el.style.transform=t;el.style.setProperty('--t',t)}
function addPiece(sq,p){const id=BD.next++,el=document.createElement('div');el.className='pc '+(colorOf(p)?'b':'w');el.innerHTML=pieceSVG(p);placeEl(el,sq);$('pieces').appendChild(el);BD.ids[sq]=id;BD.els[id]=el;return el}
function removePiece(sq){const id=BD.ids[sq];if(id<0)return;const el=BD.els[id];delete BD.els[id];BD.ids[sq]=-1;if(el){el.classList.add('gone');setTimeout(()=>el.remove(),260)}}
function movePieceEl(f,t){const id=BD.ids[f];BD.ids[f]=-1;BD.ids[t]=id;const el=BD.els[id];if(el)placeEl(el,t);return el}
function boardSet(pos,flip){
 BD.pos=pos;BD.flip=!!flip;BD.sel=-1;BD.targets=[];BD.hint=null;BD.drag=null;BD.ids.fill(-1);BD.els={};
 const h=pos.hist[pos.hist.length-1];BD.last=h?h[0]:null;
 $('pieces').innerHTML='';
 for(let s=0;s<120;s++){if(s&0x88){s+=7;continue}if(pos.b[s])addPiece(s,pos.b[s])}
 paintSquares();marks();
}
// animate a legal move, then apply it to BD.pos
function boardPlay(m,sound=true){
 const pos=BD.pos,us=pos.turn;
 if(m.c)removePiece(m.fl&2?(us===WHITE?m.t+16:m.t-16):m.t);
 const el=movePieceEl(m.f,m.t);
 if(m.fl&4){const rf=m.t>m.f?m.t+1:m.t-2,rt=m.t>m.f?m.t-1:m.t+1;movePieceEl(rf,rt)}
 if(m.pr&&el)setTimeout(()=>{el.innerHTML=pieceSVG(m.pr);el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')},180);
 pos.make(m);BD.last=m;BD.sel=-1;BD.targets=[];BD.hint=null;
 if(sound){if(pos.inCheck())SFX.check();else if(m.c)SFX.capture();else SFX.move()}
 marks();
}
// take back the last move with animation
function boardUndo(){
 const pos=BD.pos,m=pos.hist[pos.hist.length-1][0];pos.undo();const us=pos.turn;
 const el=movePieceEl(m.t,m.f);if(m.pr&&el)el.innerHTML=pieceSVG(m.p);
 if(m.fl&4){const rf=m.t>m.f?m.t+1:m.t-2,rt=m.t>m.f?m.t-1:m.t+1;movePieceEl(rt,rf)}
 if(m.c){const e=addPiece(m.fl&2?(us===WHITE?m.t+16:m.t-16):m.t,m.c);e.style.opacity='0';setTimeout(()=>{e.style.opacity=''},30)}
 const h=pos.hist[pos.hist.length-1];BD.last=h?h[0]:null;BD.sel=-1;BD.targets=[];BD.hint=null;marks();
}
function marks(){
 const pos=BD.pos;if(!pos)return;
 const chk=pos.inCheck()?pos.ks[pos.turn>>3]:-1,sqs=$('board').children;
 for(let i=0;i<64;i++){
  const el=sqs[i],s=+el.dataset.sq,tg=BD.targets.find(m=>m.t===s),cl=el.classList;
  cl.toggle('last',!!BD.last&&(BD.last.f===s||BD.last.t===s));
  cl.toggle('sel',BD.sel===s);
  cl.toggle('mv',!!tg&&!pos.b[s]&&!(tg.fl&2));
  cl.toggle('cap',!!tg&&(!!pos.b[s]||!!(tg.fl&2)));
  cl.toggle('chk',chk===s);
  cl.toggle('hintF',!!BD.hint&&BD.hint.f===s);
  cl.toggle('hintT',!!BD.hint&&BD.hint.t===s);
 }
}
function flashSq(sq,cls,ms=600){const el=[...$('board').children].find(e=>+e.dataset.sq===sq);if(!el)return;el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),ms)}
function shakeBoard(){const f=$('frame');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake')}
function boardMsg(text,ms=1100){const e=$('boardMsg');e.textContent=text;e.classList.add('show');clearTimeout(boardMsg.t);boardMsg.t=setTimeout(()=>e.classList.remove('show'),ms)}
function sqFromPoint(x,y){const r=$('board').getBoundingClientRect();if(x<r.left||y<r.top||x>=r.right||y>=r.bottom)return -1;return sqAt(Math.floor((y-r.top)/r.height*8)*8+Math.floor((x-r.left)/r.width*8))}
const mine=s=>{const p=BD.pos.b[s];return p&&colorOf(p)===BD.pos.turn&&colorOf(p)===BD.side};
function select(s){BD.sel=s;BD.targets=BD.pos.legal().filter(m=>m.f===s);marks()}
function onDown(e){
 if(!BD.interactive||!BD.pos)return;audio();
 const s=sqFromPoint(e.clientX,e.clientY);if(s<0)return;
 if(BD.sel>=0&&BD.targets.some(m=>m.t===s)){e.preventDefault();tryMove(BD.sel,s);return}
 if(mine(s)){e.preventDefault();if(BD.sel!==s)SFX.click();select(s);const el=BD.els[BD.ids[s]];if(el)BD.drag={s,el,x:e.clientX,y:e.clientY,id:e.pointerId,moved:false};return}
 BD.sel=-1;BD.targets=[];marks();
}
function onDrag(e){
 const d=BD.drag;if(!d||e.pointerId!==d.id)return;
 if(!d.moved&&Math.hypot(e.clientX-d.x,e.clientY-d.y)<7)return;
 e.preventDefault();d.moved=true;
 const r=$('board').getBoundingClientRect(),w=r.width/8;
 d.el.classList.add('drag');d.el.style.transform=`translate(${e.clientX-r.left-w/2}px,${e.clientY-r.top-w/2}px)`;
 const over=sqFromPoint(e.clientX,e.clientY),ok=BD.targets.some(m=>m.t===over);
 for(const q of $('board').children)if(q.classList.contains('sq'))q.classList.toggle('drop',ok&&+q.dataset.sq===over);
}
function onUp(e){
 const d=BD.drag;if(!d||e.pointerId!==d.id)return;BD.drag=null;
 for(const q of $('board').querySelectorAll('.drop'))q.classList.remove('drop');
 if(!d.moved)return;
 d.el.classList.remove('drag');
 const s=sqFromPoint(e.clientX,e.clientY);
 if(s>=0&&s!==d.s&&BD.targets.some(m=>m.t===s)){d.el.style.transition='none';placeEl(d.el,s);void d.el.offsetWidth;d.el.style.transition='';tryMove(d.s,s)}
 else placeEl(d.el,d.s);
}
function tryMove(f,t){
 const opts=BD.targets.filter(m=>m.f===f&&m.t===t);if(!opts.length)return;
 if(opts.length>1&&opts[0].pr){askPromo(opts,f);return}
 BD.onMove&&BD.onMove(opts[0]);
}
function askPromo(opts,f){
 const us=BD.pos.turn,box=$('promo');
 box.innerHTML=`<div class="box">${[5,4,3,2].map(t=>`<button type="button" data-t="${t}" aria-label="${t}">${pieceHTML(t|us)}</button>`).join('')}</div>`;
 box.classList.remove('hidden');
 box.onclick=e=>{
  const b=e.target.closest('button');box.classList.add('hidden');box.onclick=null;
  if(!b){const el=BD.els[BD.ids[f]];if(el)placeEl(el,f);BD.sel=-1;BD.targets=[];marks();return}
  const m=opts.find(o=>typeOf(o.pr)===+b.dataset.t);BD.onMove&&BD.onMove(m);
 };
}

 }else{b.textContent=S.lvl;$('lvlName').innerHTML=`${t.icon} ${esc(t.name)}<small>${xpTxt}</small>`;$('lvlBtn').setAttribute('aria-label',L(`레벨 ${S.lvl} · ${t.name} · ${xpTxt}`,`Level ${S.lvl} · ${t.name} · ${xpTxt}`))}

function toast(html){const t=document.createElement('div');t.className='toast';t.innerHTML=html;$('toasts').appendChild(t);setTimeout(()=>t.remove(),2800)}
const MQ=[];let CUR=null,DEFER=null,MFOCUS=null;
// modal(html,{acts:{name:fn}}): buttons with data-act="name" run fn and close the modal (return false to keep it open)
function modal(html,o={}){if(!CUR&&!MQ.length)MFOCUS=document.activeElement;MQ.push({html,...o});if(!CUR)nextModal()}
function nextModal(){
 const m=MQ.shift();CUR=m||null;
 if(!m){$('modalRoot').innerHTML='';const f0=MFOCUS;MFOCUS=null;if(f0&&f0!==document.body&&f0.isConnected&&f0.offsetParent)try{f0.focus({preventScroll:true})}catch(e){}
  if(DEFER){const f=DEFER;DEFER=null;f()}return}
 $('modalRoot').innerHTML=`<div class="modal ${m.cls||''}" role="dialog" aria-modal="true"><div class="box" tabindex="-1">${m.closable===false?'':`<button class="x" type="button" data-act="close" aria-label="${L('닫기','Close')}">✕</button>`}${m.html}</div></div>`;
 const box=$('modalRoot').querySelector('.box'),h=box.querySelector('h2');
 if(h){h.id='modalTitle';box.parentNode.setAttribute('aria-labelledby','modalTitle')}
 try{box.focus({preventScroll:true})}catch(e){}
 if(m.onOpen)m.onOpen(box);
}
// Escape closes any modal that has a ✕ (result screens and the daily gift stay until a choice is made)
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&CUR&&CUR.closable!==false&&!CUR.sticky){e.preventDefault();closeModal()}});
function closeModal(after){const m=CUR;CUR=null;$('modalRoot').innerHTML='';if(m&&m.onClose)m.onClose();if(after){if(MQ.length)DEFER=after;else{nextModal();after();return}}nextModal()}
$('modalRoot').addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');
 if(!b){if(e.target.classList.contains('modal')&&CUR&&CUR.closable!==false&&!CUR.sticky)closeModal();return}
 SFX.click();const act=b.dataset.act;if(act==='close'){closeModal();return}
 const fn=CUR&&CUR.acts&&CUR.acts[act];if(!fn){closeModal();return}
 const r=fn(b);if(r===false)return;closeModal(typeof r==='function'?r:null);
});

// grant coins / xp / items; returns {coins, xp, before, after, levels:[...]} for the result screen
function grant({coins=0,xp=0,items={}}={}){
 const before=S.coins;S.coins+=coins;S.earned+=Math.max(0,coins);
 for(const [k,v] of Object.entries(items))S.inv[k]=(S.inv[k]||0)+v;
 S.xp+=xp;const levels=[];
 while(S.xp>=xpNeed(S.lvl)){S.xp-=xpNeed(S.lvl);S.lvl++;const oldT=titleOf(S.lvl-1).name,t=titleOf(S.lvl);
  const gift={coins:50+S.lvl*10,items:{hint:1,...(S.lvl%5===0?{shield:1,undo:1}:{})}};S.coins+=gift.coins;S.earned+=gift.coins;
  for(const [k,v] of Object.entries(gift.items))S.inv[k]=(S.inv[k]||0)+v;
  levels.push({lvl:S.lvl,gift,newTitle:t.name!==oldT?t:null});
 }
 save();updateHud();
 levels.forEach(l=>modal(levelHTML(l),{cls:'levelup',onOpen:()=>{SFX.level();celebrate('fireworks');speak(L(`레벨 업! 이제 레벨 ${l.lvl}이에요!`,`Level up! You are now level ${l.lvl}!`))}}));
 checkTrophies();
 return {coins,xp,before,after:before+coins,levels};
}

 ${l.newTitle?`<h2>${l.newTitle.icon} ${esc(l.newTitle.name)}</h2><p>${L('새 칭호를 얻었어요!','You earned a new title!')}</p>`:`<p>${L('점점 강해지고 있어요!','You are getting stronger!')}</p>`}
 ${coachLine(l.newTitle?'big':'up')}
 <div class="rewards"><span class="coin">${COIN} +${num(l.gift.coins)}</span>${Object.entries(l.gift.items).map(([k,v])=>`<span class="item">${pic(ITEMS[k].img,ITEMS[k].icon)} ${esc(ITEMS[k].name)} +${v}</span>`).join('')}</div>
 <div class="row"><button class="btn gold" type="button" data-act="close">${L('좋아요!','Awesome!')}</button></div>`;
}

function ensureMissions(){
 const d=dayKey();if(S.missions.day===d)return;
 S.missions={day:d,list:shuffle(MISSIONS.slice()).slice(0,3).map(m=>({id:m.id,n:0,got:false})),chest:false};save();
}
function track(id,n=1){
 ensureMissions();
 for(const m of S.missions.list){if(m.id!==id||m.got)continue;const def=MISSIONS.find(x=>x.id===id);const was=m.n;m.n=Math.min(def.goal,m.n+n);
  if(was<def.goal&&m.n>=def.goal)toast(`${def.icon} ${L('임무 완료!','Mission complete!')} <small>${esc(def.text)}</small>`)}
 save();
}

// ---------------------------------------------------------------- views & navigation
let VIEW='home';
function go(v){
 if(VIEW==='game'&&v!=='game')leaveGame();
 VIEW=v;for(const s of document.querySelectorAll('main .view'))s.classList.toggle('hidden',s.id!=='v-'+v);
 $('backBtn').classList.toggle('hidden',v==='home');$('homeLink').classList.toggle('hidden',v!=='home');
 if(v!=='game')courseTick(); // a course step finished anywhere (a lesson in the notebook, a puzzle, a game) is ticked here
 if(v==='home')renderHome();else if(v==='map')renderMap();else if(v==='battle')renderBattleSelect();else if(v==='shop')renderShop();else if(v==='trophy')renderTrophies();else if(v==='grow')renderGrow();else if(v==='review')renderReview();
 else if(v==='course')renderCourse();else if(v==='ladder')renderLadder();else if(v==='drills')renderDrills();
 updateHud();window.scrollTo({top:0});
}
let backTo='home';
$('backBtn').addEventListener('click',()=>{SFX.click();if(VIEW==='game'){const leave=()=>go(gameBack());if(gameUnfinished())confirmLeave(leave);else leave()}else if(VIEW==='ladder'&&LAD.th){LAD.th=null;go('ladder')}else go(VIEW==='map'||VIEW==='battle'||VIEW==='shop'||VIEW==='trophy'?'home':VIEW==='grow'?growBack:VIEW==='review'?revBack:VIEW==='ladder'?ladBack:VIEW==='course'?courseBack:VIEW==='drills'?drillsBack:backTo)});
// leaving a puzzle, a Lightning round or an AI battle half-way asks first
function gameUnfinished(){return VIEW==='game'&&!!((RUSH&&!RUSH.over)||(BT&&!BT.over)||(DR&&!DR.over&&DR.n>0)||(!RUSH&&!BT&&!DR&&PZ&&!PZ.done))}
function confirmLeave(leave){
 const why=DR?L('드릴은 언제든 처음부터 다시 할 수 있어요.','You can start this drill again any time.'):BT?L('대결은 저장돼요. 첫 화면에서 이어서 할 수 있어요.','Your battle is saved. You can continue it from the home screen.')

function mathChest(title,done){

  <div class="choices">${opts.map(o=>`<button type="button" data-act="ans" data-v="${o}">${o}</button>`).join('')}</div>

 {closable:false,acts:{

   if(ok){SFX.good();celebrate()}else SFX.bad();

  take:b2=>{const n=+b2.dataset.coins;const r=grant({coins:n,xp:30});flyCoins(null,r.coins);done&&done()}
 }});
}

function startDaily(){

  S.daily={day:d,idx:pool.length?pool[h%pool.length]:h%PUZ.length,done:false};save();

// The AI runs in a Web Worker built from the engine script, so the page stays smooth while it thinks.
let aiWorker=null,aiSeq=0;const aiWait={};
try{
 const src=document.getElementById('engineSrc').textContent+';onmessage=e=>{const {id,fen,opts}=e.data;const pos=new Chess.Position(fen);const r=Chess.bestMove(pos,opts);postMessage({id,uci:r?pos.uci(r.move):null})}';
 aiWorker=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));
 aiWorker.onmessage=e=>{const f=aiWait[e.data.id];delete aiWait[e.data.id];if(f)f(e.data.uci)};
 aiWorker.onerror=()=>{aiWorker=null};
}catch(e){aiWorker=null}
function aiMove(pos,opts){
 const fen=pos.fen();
 if(aiWorker)return new Promise(res=>{const id=++aiSeq;aiWait[id]=res;aiWorker.postMessage({id,fen,opts});setTimeout(()=>{if(aiWait[id]){delete aiWait[id];const r=Chess.bestMove(new Position(fen),opts);res(r?pos.uci(r.move):null)}},(opts.ms||1000)+4000)});
 return new Promise(res=>setTimeout(()=>{const r=Chess.bestMove(new Position(fen),opts);res(r?pos.uci(r.move):null)},30));
}

 if(!resume&&!ready){chBefore(BATTLE_LS,n=>startBattle(bi,me,{boss,ready:true,taught:n>0,back}));return}
 const bot=botOf(bi),pos=new Position();
 setupGame('battle');PZ=null;DR=null;
 BT={bi,bot,me,boss,moves:[],sans:[],keys:{},over:false,thinking:false,taught,spar:!!bot.spar,back};
 if(resume)for(const u of resume){const m=pos.fromUci(u);if(!m)break;BT.sans.push(pos.san(m));pos.make(m);BT.moves.push(u);const k=pos.key();BT.keys[k]=(BT.keys[k]||0)+1}
 BD.side=me;BD.onMove=battleMove;BD.interactive=false;boardSet(pos,me===BLACK);
 S.battles+=resume?0:1;saveBattle();renderBattle();

 if(pos.turn!==me)botThink();else{BD.interactive=true;battleTeach()}
}

// ---- skill ladders: a theme's puzzles by rating (the adventure's 60 stay for the map), in steps of 100. The next puzzle is
// the easiest unsolved one from the step the child picked, else from a little under their puzzle score.
const LADDER={};PUZ.forEach((p,i)=>{if(STAGE_SET.has(i)||!THEMES[p.theme])return;(LADDER[p.theme]=LADDER[p.theme]||[]).push(i)});

 {icon:'🌪️',name:L('고급 전술','Advanced tactics'),th:['dc','df','at','cd','ov','in','cl','xr','iz','tp','qm','sc','dm']},
